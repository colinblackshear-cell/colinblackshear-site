<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blackshear TV</title>
<link rel="manifest" href="site.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0c0d0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blackshear TV">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Cormorant+Garamond:wght@500;700&family=VT323&display=swap">
<style>[hidden]{display:none!important}body{margin:0}

/* Layout: a full-bleed lit 3D set (one seamless wall color, a walnut 1970s TV under a key light); type floats over it like film titles */
:root{
  --night:#0c0d0c;
  --title:#efe8d8;
  --title-soft:rgba(239,232,216,.62);
  --phosphor:#a6ff92;
  --f-display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --f-name:"Cormorant Garamond", "Instrument Serif", Georgia, serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--title);font-family:var(--f-mono)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--title);outline-offset:3px}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.fx{position:fixed;inset:0;pointer-events:none}
.vignette{background:radial-gradient(120% 95% at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,.72) 100%)}
.grain{inset:-50%;opacity:.12;mix-blend-mode:overlay;animation:grain 0.9s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-4%)}60%{transform:translate(-4%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.curtain{background:#000;transition:opacity 2.4s ease}
.curtain.up{opacity:0}

.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;
  padding-block:18px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  text-shadow:0 1px 12px rgba(0,0,0,.6)}
.ui button{pointer-events:auto}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.name{margin:0;line-height:0}
.name svg{display:block;height:clamp(30px, 5.4vw, 50px);width:auto;max-width:min(78vw, 520px);overflow:visible}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.sections{display:flex;gap:clamp(12px, 2.4vw, 26px);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;pointer-events:auto}
.sections a{color:var(--title-soft);text-decoration:none;padding:4px 0;border-bottom:1px solid transparent;transition:color .3s, border-color .3s}
.sections a:hover,.sections a[aria-current="true"]{color:var(--title);border-bottom-color:rgba(239,232,216,.5)}
.sections a:focus-visible{outline:2px solid var(--title);outline-offset:3px}

.bottom{display:grid;gap:12px;justify-items:center}
.label{text-align:center;max-width:60ch;display:grid;gap:4px}
.label .num{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--title-soft)}
.label h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(1.7rem, 4vw, 2.5rem);line-height:1.05;text-wrap:balance}
.label .meta{font-size:.76rem;color:var(--title-soft)}
.controls{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.pill{border:1px solid rgba(239,232,216,.45);background:rgba(10,10,9,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase}
.pill:hover{border-color:var(--title)}
.pill.sound[aria-pressed="false"]{animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(239,232,216,0)}50%{box-shadow:0 0 0 5px rgba(239,232,216,.12)}}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;width:100%;font-size:.66rem;color:var(--title-soft);letter-spacing:.08em}
.swatches{display:flex;gap:8px;align-items:center}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.35);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--night), 0 0 0 3.5px var(--title)}
.vbox{position:fixed;left:0;top:0;width:0;height:0;overflow:hidden;background:#000;pointer-events:none;transform-origin:0 0;
  display:flex;align-items:center;z-index:0}
.vbox iframe{position:absolute;left:0;top:0;display:block;border:0;transform-origin:0 0;filter:contrast(1.06) saturate(.88) sepia(.08) brightness(1.04)}
/* phones: a filter on a playing video makes the browser redraw every frame by hand, which stalls playback */
@media (pointer: coarse){
  .vbox iframe{filter:none}
  /* phones: no live blending or blurring over the moving 3D set, which makes the browser recomposite the whole screen every frame */
  .grain{mix-blend-mode:normal;opacity:.05;animation:none}
  .psy{mix-blend-mode:normal}
  .pill,body .scrub{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(10,10,9,.72)}
}
.vbox::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--crt,1);
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, rgba(0,0,0,0) 1px 3px),
    radial-gradient(55% 35% at 30% 18%, rgba(255,255,255,.10), rgba(255,255,255,0) 70%),
    radial-gradient(120% 110% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.6));
  box-shadow:inset 0 0 24px rgba(0,0,0,.8)}
.vbox[hidden]{display:none}
/* a cut between sections in the room: the picture blinks out and back, like a hard edit */
.vbox iframe{transition:opacity .35s}
.vbox.cut iframe{opacity:0!important;transition:none}
/* the film's scrub bar, along the bottom of the picture when you're inside */
.scrub{position:fixed;left:0;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:12px;box-sizing:border-box;
  background:rgba(10,8,6,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#f3e9d6;font:500 12px/1 "IBM Plex Mono",monospace;
  opacity:0;pointer-events:none;transition:opacity .45s}
.scrub.on{opacity:1;pointer-events:auto}
.scrub[hidden]{display:none}
.scrub button{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;color:#ffb547;font-size:14px;border-radius:8px}
.scrub button:focus-visible,.sctrack:focus-visible{outline:2px solid #ffb547;outline-offset:2px}
.sctrack{position:relative;flex:1;height:28px;cursor:pointer;touch-action:none}
.sctrack::before,.sctrack i{content:"";position:absolute;left:0;top:50%;height:4px;margin-top:-2px;border-radius:2px}
.sctrack::before{right:0;background:rgba(243,233,214,.25)}
.sctrack i{width:0;background:linear-gradient(90deg,#ff7a3d,#ffb547)}
.sctrack b{position:absolute;left:0;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff3dc;box-shadow:0 0 10px #ffb547}
.psy{width:100%;height:100%;mix-blend-mode:screen}
/* phone turned sideways: the film sits in a walnut set at its true shape, with a side panel for channels */
.tvframe{position:fixed;inset:0;z-index:19;display:none;opacity:0;
  background:radial-gradient(120% 90% at 40% 30%, rgba(255,220,180,.10), rgba(0,0,0,0) 60%),
    repeating-linear-gradient(91deg, rgba(0,0,0,.10) 0 2px, rgba(0,0,0,0) 2px 11px),
    repeating-linear-gradient(88deg, rgba(255,230,200,.04) 0 1px, rgba(0,0,0,0) 1px 23px),
    linear-gradient(180deg, #6b4428, #4a2c17);
  box-shadow:inset 0 0 0 3px #24150a, inset 0 0 60px rgba(0,0,0,.55)}
body.filmfull .tvframe{display:block}
.tvf-bezel{position:absolute;border-radius:20px;background:#0b0a09;
  box-shadow:0 0 0 3px #c9c2b1, 0 0 0 5px #6f695b, 0 0 0 7px #1a110a, 0 10px 24px rgba(0,0,0,.55), inset 0 0 18px rgba(0,0,0,.9)}
.tvf-side{position:absolute;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 8px;border-radius:8px;
  background:linear-gradient(180deg,#e4e0d4,#b5b0a1 60%,#a39e8f);box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 4px rgba(0,0,0,.25), 0 0 0 2px #24150a}
.tvf-ch{width:100%;text-align:center;padding:4px 0 2px;border-radius:3px;background:#0f0d09;box-shadow:inset 0 2px 6px rgba(0,0,0,.9);
  font-family:"VT323", ui-monospace, monospace;font-size:1.35rem;line-height:1;color:#ffb547;text-shadow:0 0 8px rgba(255,170,60,.7)}
.tvf-side .dk{width:100%;justify-content:center;padding:9px 0;font-size:.62rem}
.tvf-side .dk[hidden]{display:none}
.tvf-grille{flex:1;width:100%;min-height:12px;border-radius:4px;background:repeating-linear-gradient(0deg, #3a2a1c 0 2px, rgba(0,0,0,0) 2px 5px);opacity:.75}
/* iPhones can't hide the browser bar for a website, but a short swipe up makes it tuck away, so the sideways set leaves room to scroll */
html.lift,html.lift body{height:auto;overflow:visible}
html.lift body{min-height:calc(100vh + 160px)}
.tvf-tip{position:fixed;z-index:22;left:50%;top:calc(34px + env(safe-area-inset-top, 0px));transform:translateX(-50%);white-space:nowrap;pointer-events:none;
  padding:5px 12px;border-radius:999px;background:rgba(10,10,9,.6);color:var(--title);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;opacity:0;transition:opacity .6s}
.tvf-tip.on{opacity:1}
.draghint{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top, 0px));transform:translateX(-50%);z-index:6;pointer-events:none;
  padding:7px 14px;border-radius:999px;background:rgba(10,10,9,.6);color:var(--title);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;
  opacity:0;transition:opacity .5s}
.draghint.on{opacity:1}
body.filmfull .psy{opacity:0}
.tapsound{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:21;
  padding:7px 14px;border-radius:999px;background:rgba(10,10,9,.55);color:var(--title);font-size:.7rem;letter-spacing:.14em;
  text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity .4s}
body.filmfull:not(.sound-on) .tapsound{opacity:1}
.transport{display:flex;gap:6px}
.transport[hidden], .tr[hidden]{display:none!important}
.nogl{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--title-soft)}

/* full-frame mode: the room titles step aside and a control deck slides up */
header,.bottom{transition:opacity .5s ease, visibility 0s linear 0s}
body.zoomed header, body.zoomed .bottom{opacity:0;visibility:hidden;transition:opacity .4s ease, visibility 0s linear .4s}
.deck{position:fixed;left:0;right:0;bottom:0;z-index:5;visibility:hidden;opacity:0;transform:translateY(24px);
  transition:opacity .4s ease, transform .4s ease, visibility 0s linear .4s;
  padding-block:10px calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));
  background:
    repeating-linear-gradient(91deg, rgba(0,0,0,.10) 0 2px, rgba(0,0,0,0) 2px 11px),
    linear-gradient(180deg, #6b4428, #4a2c17);
  box-shadow:0 -1px 0 rgba(255,225,190,.18) inset, 0 -12px 30px rgba(0,0,0,.45)}
body.zoomed .deck{visibility:visible;opacity:1;transform:none;transition:opacity .6s ease .9s, transform .6s ease .9s, visibility 0s linear 0s}
.deck-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;
  padding:10px 12px;border-radius:8px;
  background:linear-gradient(180deg,#e4e0d4,#b5b0a1 60%,#a39e8f);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 4px rgba(0,0,0,.25), 0 0 0 2px #24150a}
.dk{border:0;cursor:pointer;padding:9px 12px;border-radius:5px;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
  color:#ebe5d6;background:linear-gradient(#2d2925,#12100e);box-shadow:0 3px 0 #000, 0 4px 6px rgba(0,0,0,.35);
  transition:transform .08s, box-shadow .08s;display:inline-flex;align-items:center;gap:7px}
.dk:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.dk .led{width:7px;height:7px;border-radius:50%;background:#4a1c14}
.dk[aria-pressed="true"] .led{background:#ff5a2e;box-shadow:0 0 6px #ff5a2e}
.readout{flex:1 1 220px;min-width:0;max-width:340px;padding:7px 12px;border-radius:4px;background:#0f0d09;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.9);font-family:"VT323", ui-monospace, monospace;font-size:1.25rem;line-height:1.1;
  color:#ffb547;text-shadow:0 0 8px rgba(255,170,60,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.06em}
.readout small{display:block;font-size:.9rem;color:rgba(255,181,71,.6);text-shadow:none}
.presets{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:4px 2px 7px}
.key{position:relative;flex:0 0 auto;width:34px;height:40px;border:0;border-radius:4px;cursor:pointer;
  font-size:.78rem;font-weight:500;color:#2a2117;background:linear-gradient(#f4f0e6,#c4bead);
  box-shadow:0 4px 0 #6f695b, 0 5px 6px rgba(0,0,0,.3);transition:transform .08s, box-shadow .08s}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #6f695b}
.key[aria-pressed="true"]{transform:translateY(3px);box-shadow:0 1px 0 #6f695b, inset 0 2px 4px rgba(0,0,0,.25);background:linear-gradient(#e6e1d4,#b9b3a2)}
.key::after{content:"";position:absolute;top:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:rgba(0,0,0,.15)}
.key[aria-pressed="true"]::after{background:#e2361f;box-shadow:0 0 5px #e2361f}
.key.dead{color:#7d7566}
@media (max-width:520px){ .hint{display:none} }
/* phones: three compact rows (readout, a full row of channel keys, then buttons) */
@media (max-width:640px){
  .deck{padding-block:8px calc(8px + env(safe-area-inset-bottom, 0px))}
  .deck-in{gap:8px;padding:8px}
  .presets{order:-1;flex:1 1 100%;gap:4px;padding:2px 0 5px;overflow:visible}
  .key{flex:1 1 0;min-width:0;width:auto;height:34px;font-size:.68rem;border-radius:3px}
  .key::after{top:3px;width:4px;height:4px;margin-left:-2px}
  .dk{padding:8px 10px;font-size:.6rem;letter-spacing:.12em}
  .readout{font-size:1.05rem;padding:5px 10px}
  .readout small{font-size:.8rem}
}
@media (max-width:640px){ .readout{flex-basis:100%;max-width:none;order:-2} }
@media (prefers-reduced-motion: reduce){ .grain{animation:none} .pill.sound{animation:none!important} }
</style>
</head><body>

<canvas id="gl" aria-label="A 1970s television on a studio set. Turn the channel dial to change films."></canvas>
<div class="vbox" id="vbox" hidden></div>
<div class="tapsound" aria-hidden="true">Tap for sound</div>
<div class="tvframe" id="tvframe">
  <div class="tvf-bezel" id="tvfBezel"></div>
  <div class="tvf-side" id="tvfSide">
    <div class="tvf-ch" id="tvfCh" aria-live="polite">03</div>
    <button class="dk" id="tvfUp" aria-label="Next channel">CH ▲</button>
    <button class="dk" id="tvfDn" aria-label="Previous channel">CH ▼</button>
    <span class="tvf-grille" aria-hidden="true"></span>
    <button class="dk" id="tvfFull" aria-label="Full screen" hidden>Full</button>
  </div>
</div>
<div class="draghint" id="draghint" aria-hidden="true">Drag the film to reframe</div>
<div class="draghint" id="taphint" style="z-index:31">Tap for sound</div>
<div class="scrub" id="scrub" hidden><button id="scPlay" aria-label="Pause">❚❚</button><span id="scA">0:00</span><div class="sctrack" id="scTrack" role="slider" tabindex="0" aria-label="Film position" aria-valuemin="0" aria-valuemax="100"><i id="scFill"></i><b id="scKnob"></b></div><span id="scB">0:00</span></div>
<div class="tvf-tip" id="tvfTip" aria-hidden="true">Swipe up to hide the browser bar</div>
<canvas class="fx psy" id="psy" aria-hidden="true"></canvas>
<div class="fx vignette"></div>
<div class="fx grain" id="grain"></div>
<div class="fx curtain" id="curtain"></div>

<div class="ui">
  <header>
    <h1 class="name"><span class="sr">Colin Blackshear</span><svg id="wordmark" aria-hidden="true"></svg></h1>
    <nav class="sections" aria-label="Sections">
      <a href="#films" data-ch="2">Films</a>
      <a href="music/">Music</a>
      <a href="lab/">Interactive</a>
    </nav>
  </header>
  <div class="bottom">
    <div class="label" aria-live="polite">
      <span class="num" id="lNum">Channel 2</span>
      <h2 id="lTitle">Selected Work</h2>
      <span class="meta" id="lMeta">Reel cut to music</span>
    </div>
    <div class="controls">
      <button class="pill" id="prev" aria-label="Previous channel">‹ Ch</button>
      <button class="pill sound" id="sound" aria-pressed="false">Sound off</button>
      <button class="pill" id="next" aria-label="Next channel">Ch ›</button>
      <button class="pill tr" id="trPrev" hidden aria-label="Previous track">‹ Track</button>
      <button class="pill tr" id="trNext" hidden aria-label="Next track">Track ›</button>
    </div>
    <div class="foot">
      <span class="hint">Click the screen to step inside  ·  Turn the dial or use ← →</span>
      <div class="swatches" id="swatches" aria-label="Wall color"></div>
    </div>
  </div>
</div>

<div class="deck" id="deck" aria-hidden="true">
  <div class="deck-in">
    <button class="dk" id="back" aria-label="Back to the room">◂ Room</button>
    <div class="readout" id="readout" aria-live="polite">CH 02 · SELECTED WORK</div>
    <div class="presets" id="presets" aria-label="Channels"></div>
    <div class="transport" id="transport" hidden>
      <button class="dk" id="dtPrev" aria-label="Previous track">◂◂</button>
      <button class="dk" id="dtPlay" aria-label="Play or pause">▶</button>
      <button class="dk" id="dtNext" aria-label="Next track">▸▸</button>
    </div>
    <button class="dk" id="dvol" aria-pressed="false"><span class="led"></span>Sound</button>
    <button class="dk" id="dpow" aria-pressed="true"><span class="led"></span>Power</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =========================================================
   WORDMARK: Colin's name, hand-drawn as one neon pen line (cap height 100)
   ========================================================= */
const GLYPHS = {
  C: { w: 74, d: 'M62 24 A34 34 0 1 0 62 76' },
  O: { w: 80, d: 'M6 50 A34 34 0 1 1 74 50 A34 34 0 1 1 6 50' },
  L: { w: 60, d: 'M8 4 V96 H56' },
  I: { w: 16, d: 'M8 4 V96' },
  N: { w: 70, d: 'M8 96 V4 L62 96 V4' },
  B: { w: 70, d: 'M8 96 V4 H36 A23 23 0 0 1 36 50 H8 M36 50 H42 A23 23 0 0 1 42 96 H8' },
  A: { w: 72, d: 'M4 96 L36 4 L68 96 M17 60 H55' },
  K: { w: 66, d: 'M8 4 V96 M60 4 L8 60 M27 41 L62 96' },
  S: { w: 68, d: 'M60 18 C50 4 10 2 10 27 C10 50 62 46 62 72 C62 99 16 101 6 82' },
  H: { w: 70, d: 'M8 4 V96 M62 4 V96 M8 50 H62' },
  E: { w: 60, d: 'M56 4 H8 V96 H56 M8 50 H46' },
  R: { w: 68, d: 'M8 96 V4 H38 A24 24 0 0 1 38 52 H8 M32 52 L62 96' },
};
function wordLayout(text, gap = 16, space = 40) {
  const out = []; let x = 0;
  for (const ch of text) { if (ch === ' ') { x += space; continue; } out.push({ x, g: GLYPHS[ch] }); x += GLYPHS[ch].w + gap; }
  return { glyphs: out, width: x - gap };
}
const WORD = wordLayout('COLIN BLACKSHEAR');
(() => {
  const svg = $('wordmark'), NS = 'http://www.w3.org/2000/svg', pad = 26;
  const mk = (t, a, parent) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); parent.appendChild(e); return e; };
  svg.setAttribute('viewBox', `${-pad} ${-pad} ${WORD.width + pad * 2} ${100 + pad * 2}`);

  camera.updateMatrixWorld(); syncVimeo(now); drawPsy(now, zp);
  renderer.render(scene, camera);
}
caption();
requestAnimationFrame(loop);
requestAnimationFrame(() => $('curtain').classList.add('up'));
const boot = () => setTimeout(() => { caption(); setPower(true); }, reduce ? 300 : 1700);
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(boot, boot);
})();
