<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>The Art of Dying Well</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Jost:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one full-screen "flight" — a thin instrument bar on top, the scene card in the middle, the narrator's caption card below it. Single deliberate look: the safety-card palette. */
:root{
  color-scheme: light;
  --cream:#F6EBD2; --parchment:#FBF3DF; --ink:#1E2A2B; --ink-soft:#44524F;
  --teal:#1F5E63; --teal-deep:#123D40; --brown:#8A4B22; --lamp:#F2B640;
  --red:#B8352A; --ok:#2F6B2B;
  --scene-bg: var(--cream);
  --display:'Jost', 'Futura', 'Century Gothic', sans-serif;
  --body:'Atkinson Hyperlegible', 'Verdana', sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;background:var(--scene-bg);transition:background-color 2.2s ease}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--ink);background:var(--parchment);transition:opacity 1.5s,filter 1.5s}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:.8rem;text-transform:uppercase}
#stageLabel{font-family:var(--display);font-weight:500;font-size:.85rem;color:var(--ink-soft);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stageLabel b{color:var(--brown);font-weight:700;margin-right:8px;font-variant-numeric:tabular-nums}
.tog{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:36px}
.tog[aria-pressed="false"]{background:transparent;color:var(--ink-soft);border-style:dashed}
.pick{font-family:var(--body);font-size:.8rem;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:8px;padding:6px 8px;min-height:36px;max-width:190px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pick:focus-visible,.tog:focus-visible,.btn:focus-visible,.spot:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
#stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:18px;padding-block:18px;padding-inline:16px;cursor:pointer;user-select:none}
#visual{width:100%;display:flex;justify-content:center;flex:none}
.frame{position:relative;width:min(100%, calc((100dvh - 380px) * 1.5), 980px);min-width:min(100%,300px);aspect-ratio:3/2;max-width:100%;border-radius:18px;overflow:hidden;transition:filter 3s ease, transform 3s ease}
.frame>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:filter 3s ease}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.caption{flex:none;max-width:720px;width:100%;box-sizing:border-box;background:var(--parchment);border:2px solid var(--ink);border-radius:6px;padding:16px 20px;min-height:4.6em;transition:opacity .8s, filter 1.5s, transform 1.5s, border-color 1.5s}
.caption p{margin:0;font-size:clamp(1.02rem, 2.3vw, 1.3rem);line-height:1.45;text-wrap:pretty}
.caption.quiet{background:transparent;border-color:transparent;text-align:center}
.caption.dark{background:#141413;color:var(--parchment);border-color:#141413}
.caption[hidden]{display:none!important}
#hint{margin:0;font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);opacity:0;transition:opacity .6s;min-height:1em}
#hint.on{opacity:.8;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
#choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.04em;border:2px solid var(--ink);background:var(--teal);color:var(--parchment);border-radius:999px;padding:12px 22px;cursor:pointer;min-height:48px}
.btn.alt{background:var(--parchment);color:var(--ink)}

/* dissolution: the manual's chrome comes apart; the narration always stays sharp */
body.d1 .bar{opacity:.85}
body.d2 .bar{filter:blur(.6px);opacity:.6}
body.d2 .frame{border-radius:28px}
body.d3 .bar{filter:blur(1.5px);opacity:.3}
body.d3 .frame{border-radius:40px}
body.void .bar,body.void #hint{opacity:0!important}

/* title */
.title-card{width:min(100%,640px);background:var(--teal);color:var(--parchment);border:2px solid var(--ink);border-radius:18px;padding:36px 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;align-items:flex-start;cursor:default}
.title-card .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:.75rem;color:var(--lamp);text-transform:uppercase}
.title-card h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1;text-wrap:balance;text-transform:uppercase;letter-spacing:.02em}
.title-card p{margin:0;font-size:1.05rem;line-height:1.5;max-width:46ch}
.title-card ol{margin:4px 0 8px;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;font-size:.98rem}
.title-card .btn{background:var(--lamp);color:var(--ink)}

/* hotspots */
.spot{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:3px solid #FFF3D6;background:rgba(242,182,64,.35);cursor:pointer;padding:0}
.spot::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid #FFF3D6;animation:ping 1.8s ease-out infinite}
.spot.done{opacity:0;pointer-events:none;transition:opacity .6s}
@keyframes ping{from{transform:scale(.7);opacity:.9}to{transform:scale(1.4);opacity:0}}
.heartglow{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(var(--s,0.4));background:radial-gradient(circle,#FFFBEA 0%,rgba(255,221,120,.85) 35%,rgba(255,200,80,0) 70%);transition:transform 1.2s ease;pointer-events:none}

/* breath ring */
.breath{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.6);border-radius:50%;border:4px solid var(--parchment);box-shadow:0 0 0 12px rgba(251,243,223,.15);transition:transform 1s ease-in-out, opacity 1s}

/* svg scenes */
.svgscene{position:absolute;inset:0;width:100%;height:100%}
.flicker{transform-origin:300px 262px;animation:flick 1.3s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1) skewX(0)}30%{transform:scaleY(.9) skewX(3deg)}60%{transform:scaleY(1.06) skewX(-2deg)}}
.orb-down{animation:down 7s ease-in-out forwards}
.orb-up{animation:up 7s ease-in-out forwards}
@keyframes down{to{transform:translateY(91px)}}
@keyframes up{to{transform:translateY(-55px)}}
.dots{stroke-dasharray:2 7;stroke-linecap:round}

/* guide entry */
.guide{position:absolute;inset:0;background:var(--parchment);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;gap:4%;padding:5%;box-sizing:border-box}
.guide .tag,.doorsteps .tag{display:inline-block;font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:clamp(.55rem,1.4vw,.75rem);background:var(--teal);color:var(--parchment);padding:5px 10px;border-radius:4px;text-transform:uppercase}
.guide h2{margin:10px 0 8px;font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,3.4vw,2.2rem);line-height:1.05;text-transform:uppercase;color:var(--brown);text-wrap:balance}
.guide p{margin:0;font-size:clamp(.85rem,1.8vw,1.15rem);line-height:1.45}
.guide .fig{height:100%;display:flex;align-items:center;justify-content:center;background:var(--teal);border-radius:12px;min-height:0}
.frame.guideframe{aspect-ratio:auto;width:min(100%,860px)}
.frame.guideframe .guide{position:relative;inset:auto;padding:24px;gap:24px}
.guide .fig{align-self:stretch;min-height:200px;padding:12px}
.guide .fig svg{height:220px;width:auto}
.guide .gtext{box-sizing:border-box}
.guide .gtext:focus-visible{outline:3px solid var(--lamp)}
@media (max-width:760px){
  .frame.guideframe .guide{grid-template-columns:1fr;gap:16px;padding:18px}
  .guide .fig{min-height:0}
  .guide .fig svg{height:150px}
  .guide h2{font-size:1.5rem}
  .guide p{font-size:1.02rem}
}

/* clear light */
.crack{stroke-dasharray:900;stroke-dashoffset:900;animation:crack 1.2s ease-out forwards}
@keyframes crack{to{stroke-dashoffset:0}}
.bubble{opacity:0;transform:scale(.6);transform-origin:80% 80%;transition:opacity .8s, transform .8s}
.bubble.on{opacity:1;transform:scale(1)}
.ring{position:absolute;left:49.8%;top:43%;width:8%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(242,182,64,.55);transform:translate(-50%,-50%);animation:ring 4.5s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(9);opacity:0}}


/* chapters 4-5 */
.rise{animation:rise 4.5s ease-out forwards}
@keyframes rise{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
.walk{animation:walk 9s ease-in forwards}
@keyframes walk{to{transform:translateY(-22px);opacity:.25}}
.steam path{animation:steam 2.4s ease-in-out infinite}
.steam path+path{animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
.balloon{opacity:0}
.balloon.on{animation:shout 4s ease-out forwards}
@keyframes shout{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.mug{opacity:0}
.mug.on{opacity:1;animation:shake .35s linear 2}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.drawer{transition:transform 1s ease}
.drawer.open{transform:translateX(60px)}
.page{transform-box:fill-box;transform-origin:center;animation:fly 1.6s ease-in forwards}
.page.f2{animation-delay:.35s}.page.f3{animation-delay:.7s}
@keyframes fly{to{transform:translate(160px,-190px) rotate(30deg);opacity:0}}
.glass.flash{animation:flash .9s ease}
@keyframes flash{40%{fill:#FFFFFF}}
.popped{transform-box:fill-box;transform-origin:center;animation:pop 1.2s ease 1s forwards}
@keyframes pop{to{transform:scale(1.5);opacity:0}}
.drops{opacity:0;animation:drops 1s ease 2s forwards}
@keyframes drops{to{opacity:1}}
.drawerbtn{position:absolute;background:transparent;border:2px dashed rgba(251,243,223,.75);border-radius:6px;cursor:pointer;padding:0}
.drawerbtn:hover{background:rgba(242,182,64,.2)}
.drawerbtn:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.run{background:var(--red);font-size:1.2rem;letter-spacing:.24em;text-transform:uppercase;padding:14px 34px;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.checks{position:absolute;inset:0;background:var(--parchment);padding:5%;box-sizing:border-box;display:flex;flex-direction:column;gap:4%}
.ck-head span{display:block;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(.95rem,3.4vw,2rem);color:var(--brown);letter-spacing:.03em}
.ck-head small{display:block;font-size:clamp(.7rem,1.6vw,1rem);color:var(--ink-soft);margin-top:4px}
.ck-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;flex:1}
.ck{display:flex;align-items:center;gap:6%;padding:4%;border:2px solid var(--ink);border-radius:12px;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:clamp(.7rem,1.9vw,1.15rem);line-height:1.25;text-align:left;cursor:pointer;min-width:0}
.ck:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.box{flex:none;width:clamp(18px,3vw,32px);aspect-ratio:1;border:3px solid var(--ink);border-radius:6px;position:relative;background:#FFFFFF}
.ck[aria-pressed="true"] .box{background:var(--ok)}
.ck[aria-pressed="true"] .box::after{content:"";position:absolute;left:30%;top:6%;width:28%;height:58%;border:solid #FFFFFF;border-width:0 4px 4px 0;transform:rotate(45deg)}


/* epilogue */
.duo{position:absolute;inset:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.half{position:relative;border:0;padding:0;margin:0;cursor:pointer;background:none;overflow:hidden;transition:filter .4s}
.half svg{width:100%;height:100%;display:block}
.half span{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(.68rem,1.6vw,.95rem);background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;white-space:nowrap}
.duo:hover .half:not(:hover){filter:brightness(.55)}
.half:focus-visible{outline:4px solid var(--lamp);outline-offset:-4px}
.rules{position:relative;background:var(--parchment);padding:24px;display:flex;flex-direction:column;gap:18px}
.rule-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rule{display:flex;flex-direction:column;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:12px;background:var(--cream);min-width:0}
.rule svg{width:100%;height:auto;border-radius:8px;background:#E9DDBF}
.rule b{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--teal)}
.rule p{margin:0;font-size:clamp(.9rem,1.6vw,1.05rem);line-height:1.35}
.spin{transform-origin:300px 170px;animation:spinr 40s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.bluerise{animation:brise 3s ease-out forwards}
@keyframes brise{to{opacity:.85;transform:translateY(-40px)}}

/* volume 2 */
.approach{transform-origin:300px 205px;animation:approach 9s ease-in forwards}
@keyframes approach{from{transform:scale(.8)}to{transform:scale(1.14)}}
.pulse{transform-origin:300px 205px;animation:pulseg 1.24s ease-in-out infinite}
@keyframes pulseg{50%{opacity:.12;transform:scale(.92)}}
.morph .pulse{animation:none;opacity:0;transition:opacity 1s}
.wrath{transform-origin:300px 205px;transition:transform 1.6s ease, opacity 1.4s ease}
.fl{transform-origin:300px 205px;animation:flick2 .45s ease-in-out infinite alternate}
@keyframes flick2{to{transform:scale(1.04) rotate(1.5deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.peace{opacity:0;transform-origin:300px 205px;transform:scale(.3);transition:opacity 1.6s ease .5s, transform 1.6s ease .5s}
.morph .wrath{transform:scale(.12) rotate(90deg);opacity:0}
.morph .peace{opacity:1;transform:scale(1)}
.frame.facing{transition:none;animation:shake2 .12s linear infinite}
@keyframes shake2{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.holdbtn{position:absolute;inset:0;background:transparent;border:0;padding:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.holdpill{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:8px 16px 8px 8px;font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:clamp(.72rem,1.7vw,.95rem);white-space:nowrap}
.holdpill svg{width:30px;height:30px}
.holdbtn:focus-visible .holdpill{outline:3px solid var(--lamp);outline-offset:3px}
.zone{position:absolute;background:transparent;border:2px dashed rgba(255,255,255,.55);border-radius:50%;cursor:pointer;padding:0}
.zone:focus-visible{outline:3px solid var(--lamp)}
.closing{transform-origin:300px 205px;animation:closing 10s ease-in forwards}
@keyframes closing{from{transform:scale(1.35)}to{transform:scale(.82)}}
.orbit{transform-origin:300px 210px;animation:spinr 18s linear infinite}


/* chapters menu */
#app{position:relative}
.chap{position:absolute;right:16px;top:calc(100% + 0px);z-index:20;width:min(340px,calc(100% - 32px));max-height:min(70vh,560px);overflow-y:auto;background:var(--parchment);border:2px solid var(--ink);border-radius:14px;box-shadow:0 12px 30px rgba(20,20,19,.25);padding:14px;box-sizing:border-box}
.chapwrap{position:relative;z-index:20}
.chap h3{margin:10px 6px 6px;font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brown)}
.chap h3:first-child{margin-top:2px}
.chap ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.chap button{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;background:transparent;border:0;border-radius:8px;padding:10px 8px;font-family:var(--body);font-size:1rem;color:var(--ink);cursor:pointer;min-height:44px}
.chap button:hover,.chap button:focus-visible{background:var(--cream);outline:none}
.chap button[aria-current="true"]{background:var(--cream);font-weight:700}
.chap button small{font-family:var(--display);font-weight:700;font-size:.7rem;letter-spacing:.1em;color:var(--ink-soft);min-width:2.4em;font-variant-numeric:tabular-nums}


/* volume 3 */
.streaks{animation:streak 1.1s linear infinite}
@keyframes streak{from{transform:translateX(-140px)}to{transform:translateX(140px)}}
.blown{animation:blown 2.6s ease-in-out infinite}
@keyframes blown{50%{transform:translate(40px,-8px)}}
.elgrid{position:absolute;inset:0;background:#1B2224;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;padding:6%;box-sizing:border-box}
.el{background:#2A3335;border-radius:14px;display:flex;align-items:center;justify-content:center;opacity:.22;transition:opacity .4s, transform .4s;min-height:0}
.el svg{width:62%;height:auto;max-height:90%}
.el.on{opacity:1;transform:scale(1.04)}
.peb{opacity:0}
.pebs.on .peb{animation:drop .5s ease-in forwards}
@keyframes drop{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:none}}
.mref{opacity:0;transition:opacity 1.2s}
.mref.on{opacity:1}
.approach2{transform-origin:230px 200px;animation:approach 9s ease-in forwards}
.leaf{transform-origin:20px 115px;transform:scaleX(.12);transition:transform .15s}
.doorwrap{position:relative;background:var(--parchment);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:24px;padding:24px;align-items:center}
.doorsteps ol{margin:12px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-size:clamp(.95rem,1.8vw,1.1rem);line-height:1.35}
.doorpic svg{width:100%;height:auto;max-height:260px;display:block}
.doorgrid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px;background:#10181B}
.doorcard{display:flex;flex-direction:column;gap:8px;background:var(--parchment);border:2px solid var(--ink);border-radius:12px;padding:8px;cursor:pointer;font-family:var(--body);font-size:clamp(.82rem,1.6vw,1rem);line-height:1.25;color:var(--ink);text-align:left;min-width:0}
.doorcard svg{width:100%;height:auto;border-radius:8px;display:block}
.doorcard:hover{transform:translateY(-2px)}
.doorcard.nope{opacity:.4;filter:grayscale(1)}
.doorcard:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}

/* pilot: shared production layer */
#visual{position:relative}
.leaving{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;pointer-events:none;z-index:4;animation:leave .7s ease forwards}
@keyframes leave{to{opacity:0;transform:scale(.985)}}
.entering{animation:enter .8s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{clip-path:inset(0 0 0 100% round 18px)}to{clip-path:inset(0 0 0 0 round 18px)}}
.amb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.kb{animation:kb 24s ease-out forwards;transform-origin:62% 48%}
@keyframes kb{to{transform:scale(1.09)}}
.glowspot{position:absolute;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.55) 0%,rgba(255,190,90,.18) 40%,rgba(255,190,90,0) 70%);mix-blend-mode:screen;pointer-events:none;animation:candle 2.3s steps(9,end) infinite;transition:opacity 1.2s ease}
@keyframes candle{0%{opacity:.85;transform:translate(-50%,-50%) scale(1)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}35%{opacity:.75}55%{opacity:.95;transform:translate(-50%,-50%) scale(.97)}75%{opacity:.8}100%{opacity:.9;transform:translate(-50%,-50%) scale(1.02)}}

      [15,26,'Peter',"Peter, who swore three times that he had never even met Jesus. He became the rock the Church was built on."],
      [85,26,'Mary Magdalene',"Mary Magdalene, whom the medieval Church remembered as a great sinner. She was the first to see Christ risen."],
      [30,16,'The good thief',"The thief crucified next to Jesus, who asked at the very last minute, and was told: today you will be with me in paradise."],
      [70,16,'Paul',"Paul, who hunted Christians down and held the coats while they were stoned, before he became one."] ]); }} ]},

{ key:'hope', label:'Hope', bg:PAPER, learn:'hope',
  view:()=>PG(BL(`${angel(110,230,1.1)}${figure(470,240,1,{halo:true,robe:RED})}${figure(540,250,.9,{halo:true,robe:BLUE})}${figure(400,250,.9,{halo:true,robe:GREEN})}${scroll(150,120,170,'Do not despair',{rot:-4})}`),'The angel at the bedside with three saints. Its scroll says: do not despair.'),
  enter(){ chime(); heartbeat(64); },
  beats:[
    {text:"The angel's scroll says: do not despair. Its argument is almost a joke at the demons' expense. If God forgave these four, then a list of your sins proves nothing at all."},
    {text:"The book even tells you what to do with the list. Don't read it. Hand it over."} ]},

{ key:'impatience', label:'The third temptation', bg:'#E6CFAF',
  view:()=>PG(BL(`${figure(470,250,1,{robe:BLUE})}${demon(120,230,.9,{tint:RED})}${scroll(150,130,190,'How well I have fooled him',{rot:-5})}<g transform="translate(420 322) rotate(-30)"><rect x="-22" y="-6" width="44" height="12" fill="${BROWN}" stroke="${INK}" stroke-width="2"/></g><g transform="translate(372 330)"><path d="M-10 0 Q0 -16 10 0Z" fill="${BLUE}" stroke="${INK}" stroke-width="2"/></g>`),'The dying man has kicked away the doctor and knocked over a table. A demon gloats: how well I have fooled him.'),
  enter(){ mood('drone'); heartbeat(96); },
  beats:[
    {text:"The third temptation is impatience. You've been in pain for days. In the woodcut, Moriens has kicked the doctor and knocked the table over, and a demon in the corner is delighted."},
    {text:"Anyone who has sat with a dying person knows this picture. The anger pain makes. The family who don't know where to stand."},
    {text:"Press and hold. Breathe through it until the ring closes. If you let go early, you'll see where the anger goes.", lock:true, show(){ let last=0;
      holdOn({label:'Hold and breathe',ms:7000,onProgress:p=>{ if(p===0&&last>.06&&last<1&&S[si].key==='impatience'){ last=0; setTimeout(()=>detour('x_impatience','impatience',2),350); return; } last=p; hbBpm=Math.round(96-34*p); }}); }} ]},

{ key:'patience', label:'Patience', bg:PAPER, learn:'patience',
  view:()=>PG(BL(`${angel(110,230,1.1)}${crucifix(470,215,.8)}${figure(540,250,.85,{halo:true,robe:RED})}${figure(405,250,.85,{halo:true,robe:'#FBF6EA'})}${scroll(150,120,150,'Be patient',{rot:-4})}`),'The angel shows a crucifix and the saints who suffered. Its scroll says: be patient.'),
  enter(){ mood('chant'); chime(); heartbeat(62); },
  guide:{title:'Pain, then and now',text:"The book doesn't say pain should be hidden or enjoyed. Modern Catholic teaching is plainer still: medicine to relieve the pain of the dying is allowed, even if it may shorten life, as long as death isn't the aim (Catechism § 2279). Hospice care grew partly out of this tradition."},
  beats:[
    {text:"The angel answers with the cross, and with the saints who suffered. The scroll says: be patient."},
    {text:"The book is gentle here. It doesn't say the pain isn't real. It says the pain doesn't have to be passed on to the people who love you."} ]},

{ key:'pride', label:'The fourth temptation', bg:'#EEDDB0',
  view:()=>PG(BL(`${demon(110,220,.9)}${demon(520,210,.9,{flip:true,tint:GREEN})}${demon(330,150,.8,{tint:BROWN})}${crown(200,140,1.3)}${crown(410,120,1.3)}${crown(300,64,1.1)}${scroll(120,110,150,'You earned this',{rot:-6})}${scroll(500,90,130,'Be proud',{rot:5})}`),'The demons hold out crowns. Their scrolls say: you earned this; be proud.'),
  enter(){ mood('drone'); heartbeat(70); },
  beats:[
    {text:"The fourth temptation is the cleverest one. The demons stop accusing you and start flattering you. They hold out crowns."},
    {text:"You were a good person, they say. You prayed, you gave, you behaved. You've earned this. Be proud."},
    {text:"Despair said you were too bad to be saved. Pride says you're good enough not to need it. Which do you choose?", lock:true, afterType(){ pick([{label:'Take the crown',go:'x_pride'},{label:'Set it down: it is a gift'}]); }} ]},

{ key:'humility', label:'Humility', bg:PAPER, learn:'humility',
  view:()=>PG(BL(`${angel(110,230,1.1)}${figure(480,240,1,{halo:true,robe:BLUE})}${figure(540,250,.9,{halo:true,robe:RED,crown:true})}${hellmouth(318,352,.55)}${scroll(150,120,150,'Be humble',{rot:-4})}`),'The angel says: be humble. Beneath the bed, a mouth of hell swallows the proud.'),
  enter(){ mood('chant'); chime(); heartbeat(62); },
  beats:[
    {text:"The angel's scroll says: be humble. And under the bed, in the woodcut, a mouth of hell swallows three proud men whole."},
    {text:"The cure for pride, the book says, isn't thinking less of yourself. It's letting yourself be given what you could never earn."} ]},

{ key:'avarice', label:'The fifth temptation', bg:'#E3D6B0',
  view:()=>PG(BL(`${demon(560,206,.8,{flip:true})}<g id="g_h">${house(76,150,1.1)}</g><g id="g_c">${chest(80,252,1.1)}</g><g id="g_w">${barrel(560,330,1)}</g><g id="g_o">${horse(84,330,.9)}</g><g id="g_f">${figure(470,252,.8,{robe:RED})}${figure(418,262,.7,{robe:GREEN})}</g>${scroll(420,96,200,'Think of your treasure',{rot:4})}${scroll(190,56,210,'Provide for your friends',{rot:-4})}`),'The demon shows the dying man his house, his money chest, his horse, his wine cellar and his family.'),
  enter(){ mood('drone'); heartbeat(66); },
  beats:[
    {text:"The last temptation is the simplest. The demon shows you your house. Your money. Your horse, your wine cellar. Your family at the foot of the bed."},
    {text:"Think of all this, it says. Who will look after it when you're gone? The book calls it avarice. Really it's clinging: the last grip on everything that made up a life."},
    {text:"What do you do?", lock:true, afterType(){ pick([{label:'Hold on to all of it',go:'x_avarice'},{label:'Hand it on'}]); }},
    {text:"Tap each thing to let it go. Nothing is lost. It's handed on.", lock:true, afterType(){ letGo([['My house','g_h',"The house. Someone else will sit by this fire."],['My money','g_c',"The money. It was only ever lent to you."],['My horse','g_o',"The horse. Let someone young ride it."],['My wine cellar','g_w',"The wine. Let them drink to you."],['My family','g_f',"Your family. Not abandoned. Put into better hands than yours."]]); }} ]},

{ key:'letgo', label:'Letting go', bg:PAPER, learn:'letgo',
  view:()=>PG(BL(`${angel(110,230,1.1)}${crucifix(470,205,.8)}${figure(545,252,.85,{halo:true,robe:BLUE})}${scroll(150,120,170,'Do not cling',{rot:-4})}`),'The angel points to Christ on the cross and to Mary beside it. The scroll says: do not cling.'),
  enter(){ mood('chant'); chime(); heartbeat(58); },
  beats:[
    {text:"The angel points to Christ on the cross, who gave up everything, even his clothes, and to Mary, who stood there and let him go. The scroll says: do not cling."},
    {text:"Five temptations. Five answers. The demons are out of arguments. Now the friend has some questions of their own."} ]},

{ key:'questions', label:'The questions', bg:PAPER,
  view:()=>PG(BL(`${figure(530,252,1,{robe:'#FBF6EA',hood:true,hands:'point'})}${candle(450,320)}${crucifix(318,200,.5)}`),'The hooded friend leans toward the dying man.'),
  enter(){ mood('room'); heartbeat(56); },
  beats:[
    {text:"The book gives the friend a list of questions to ask, borrowed from Saint Anselm, eight hundred years ago. They are meant to be answered simply. A yes is enough.", lock:true, afterType(){ setTimeout(()=>askAll([
      "Do you believe the faith of the Church, and are you glad to die in it?",
      "Do you know that you have not always lived as you should?",
      "Are you sorry for it?",
      "If you had more time, would you live differently?",
      "Do you forgive everyone who has hurt you?",
      "Do you believe that Christ died for you, and do you thank him?"]),900); }},
    {text:"Then, the book says, tell the dying person to say this, or say it for them: Into your hands, Lord, I commend my spirit."} ]},

{ key:'rites', label:'The last rites', bg:PAPER,
  view:()=>PG(BL(`${figure(470,262,1,{robe:'#FBF6EA'})}<path d="M460 238 L452 296 M480 238 L488 296" stroke="${RED}" stroke-width="5"/><circle cx="500" cy="232" r="8" fill="#FBF6EA" stroke="${INK}" stroke-width="2"/>${candle(560,320)}${crucifix(318,200,.5)}`),'A priest in a white robe and red stole stands by the bed holding up a small round host.'),
  enter(){ mood('chant'); heartbeat(54); bell(392,.05,3); },
  guide:{title:'The last rites',text:"Catholics usually mean three sacraments by the last rites: confession, the anointing of the sick, and a last communion called viaticum, from the Latin for 'with you on the way'. Anointing is no longer only for the dying; anyone seriously ill can receive it (Catechism §§ 1499–1532). Orthodox Christians have a similar anointing, called Holy Unction."},
  beats:[
    {text:"A priest comes. First he hears your confession, alone. Then he anoints you with oil. Tap where the oil goes.", lock:true, show(){ tapAll([
      [34.5,57,'Your forehead',"On your forehead: Through this holy anointing may the Lord in his love and mercy help you with the grace of the Holy Spirit."],
      [41.5,62,'Your hands',"On your hands: May the Lord who frees you from sin save you and raise you up."],
      [83,58,'The bread',"And last, the bread. It's called viaticum, which means food for the journey. This is the last meal of the trip, and the first of the next."] ]); }} ]},

{ key:'candle', label:'The candle', bg:'#E2D2AE',
  view:()=>PG(BL(`<g id="cdl" style="transition:transform .2s">${candle(0,0,1)}</g>${figure(548,292,1,{robe:'#FBF6EA',hood:true})}${crucifix(318,200,.5)}`),'The friend holds a lit candle out toward the dying man.'),
  enter(){ mood('room'); heartbeat(50); const c=$('#cdl'); c&&c.setAttribute('transform','translate(500 300)'); },
  beats:[
    {text:"The friend lights the candle and closes your fingers around it. A light in your hand for the dark, the old custom said, the way the baptism candle was a light when you began."},
    {text:"Help them. Hold, and bring the candle to your hand.", lock:true, show(){ holdOn({label:'Take the candle',ms:4000,onProgress:p=>{ const c=$('#cdl'); if(c) c.setAttribute('transform',`translate(${500-250*p} ${300-38*p})`); },onDone:()=>bell(523.25,.08,4)}); }},
    {text:"There. It's warm. You don't have to hold it tightly."} ]},

{ key:'commend', label:'Go forth', bg:'#D9C7A1', dissolve:1,
  view:()=>PG(BL(`${candle(250,262,1)}${figure(548,292,1,{robe:'#FBF6EA',hood:true})}${figure(470,300,.85,{robe:RED})}${figure(418,306,.75,{robe:GREEN})}${crucifix(318,200,.5)}<circle cx="250" cy="220" r="60" fill="url(#glory)" class="shine"/>`,{glow:true}),'Family and friend gather at the bed. The candle glows in the dying man’s hand.'),
  enter(){ mood('chant'); heartbeat(46); },
  beats:[
    {text:"Everyone gathers. The friend reads the oldest prayer for the dying in the Church, the one that begins with the Latin word Proficiscere. Go forth."},
    {text:"Go forth, Christian soul, from this world, in the name of God the almighty Father, who created you; in the name of Jesus Christ, Son of the living God, who suffered for you; in the name of the Holy Spirit, who was poured out upon you."},
    {text:"Be still with them now. Don't tap. Don't touch anything. Just rest here a moment.", lock:true, cls:'quiet', afterType(){ stillTest({ms:12000,pass:'lastbreath',fail:'restless'}); }} ]},

{ key:'restless', label:'Go forth', bg:'#D9C7A1',
  view:()=>PG(BL(`${candle(250,262,1)}${figure(548,292,1,{robe:'#FBF6EA',hood:true})}${figure(470,300,.85,{robe:RED})}${crucifix(318,200,.5)}`),'The room again, the family waiting.'),
  enter(){ heartbeat(48); },
  beats:[{text:"That's all right. The room is never quite still. Someone coughs, someone cries, a cart goes by outside. Try again when you're ready.", lock:true, afterType(){ tryAgain('Be still again','commend',2); }}] },

{ key:'lastbreath', label:'The last breath', bg:'#B9A684', dissolve:2,
  view:()=>PG(BL(`${candle(250,262,1)}${figure(548,292,1,{robe:'#FBF6EA',hood:true})}${figure(470,300,.85,{robe:RED})}${figure(418,306,.75,{robe:GREEN})}${crucifix(318,200,.5)}<rect id="dim" width="600" height="400" fill="#000" opacity="0" style="transition:opacity 5s"/>`),'The bed, the candle, the people. The light is going.'),
  enter(){ hbBpm=40; },
  beats:[
    {text:"Your breath goes short, and then long."},
    {text:"Into your hands, Lord, I commend my spirit.", show(){ breath(2,4); }},
    {text:"", cls:'quiet', lock:true, show(){ heartStop(); clockOff(); breath(2.5,6); setTimeout(()=>{ const d=$('#dim'); if(d) d.setAttribute('opacity','.85'); puff(); },3000); }, auto:7500} ]},

{ key:'black', label:'', bg:'#000000', void:true,
  view:()=>'', enter(){ silenceAll(1); }, beats:[{text:null, lock:true, auto:6000}] },

/* ===== Volume 2: the judgment ===== */
{ key:'v2', label:'Volume 2', bg:'var(--teal)',
  view:()=>card('Volume 2','The Judgment',"Christians believe the soul doesn't stop. It goes on, and right away it meets God. Here is what the Catholic Church teaches happens next, with the Catechism's paragraph numbers so you can check."),
  enter(){ mood('chant'); bell(220,.1,6); }, beats:[{text:null}] },

{ key:'soul', label:'The soul goes up', bg:SKY,
  view:()=>PG(`${glory(300,120,150)}${BL()}<g class="rise">${soul(300,150,1.6)}</g>${angel(220,150,.9)}${angel(380,150,.9,{flip:true})}${demon(90,320,.7)}${demon(520,320,.7,{flip:true,tint:GREEN})}${scroll(110,240,150,'We have lost him',{rot:-6})}${scroll(500,240,170,'Alas, I go mad',{rot:6})}`,'The last woodcut. A small soul rises from the bed between two angels. Below, demons rage: we have lost him; alas, I go mad.'),
  enter(){ mood('glory'); },
  beats:[
    {text:"In the last woodcut, something small and pale rises out of the bed. The old artists drew the soul like a little child. Two angels take it up between them."},
    {text:"And down at the bottom of the page, the demons throw a tantrum. Their scrolls say: we have lost him. Alas, I am going mad."},
    {text:"The book is over. The Church's teaching goes on. First comes the judgment."} ]},

{ key:'judge', label:'The particular judgment', bg:SKY,
  guide:{title:"Michael's scales",text:"The scales aren't doctrine. They come from art: the great church doors at Autun and Bourges, and Last Judgment paintings across Europe, show Saint Michael weighing souls while a demon tries to cheat. The Catechism only says that each person is judged at the moment of death, and quotes Saint John of the Cross: at the evening of life, we shall be judged on our love (§ 1022)."},
  view:()=>PG(`${glory(300,90,130)}${clouds(370)}${rainbow(300,170,130)}${christ(300,150,1.1)}${lifebook(150,110,1.1)}${angel(500,262,1.05,{flip:true})}${beam(330,318,1.15,0,`<g transform="translate(-70 -16)">${soul(0,0,.7)}</g>`,`<g transform="translate(70 -12)"><path d="M-14 0 l-4 -28 M0 0 v-30 M14 0 l4 -28" stroke="${INK}" stroke-width="3"/><circle cx="0" cy="-34" r="7" fill="${INK}"/></g>`)}`,'Christ sits on a rainbow. The book of life lies open. Saint Michael holds the scales: a small soul on one pan, a demon’s hand pulling at the other.',{floor:false}),
  enter(){ mood('chant'); },
  beats:[
    {text:"The moment you die, the Church says, you are judged. Not at the end of the world. Now. It's called the particular judgment, because it's yours alone (Catechism § 1022)."},
    {text:"There's Christ on the rainbow. There's the book of life, open. And there is Michael the archangel, with his scales."},
    {text:"Hold to place your life on the scale.", lock:true, show(){ holdOn({label:'Place your life',ms:6000,wait:900,onProgress:p=>{ const b=$('#beam'); if(b) b.setAttribute('transform',`rotate(${(-16*p).toFixed(1)} 0 -50)`); },
      onDone:()=>{ const b=$('#beam'); if(b){ b.insertAdjacentHTML('beforeend',`<g transform="translate(-70 -40)" class="fadein"><path d="M-3 -16 H3 V10 H-3Z M-10 -8 H10 V-2 H-10Z" fill="${OCHRE}" stroke="${INK}" stroke-width="1.5"/></g>`); b.setAttribute('transform','rotate(14 0 -50)'); } bell(392,.12,5); }}); }},
    {text:"Look. Your side went up. The demon's side was heavier. And then something was laid on your pan that you didn't put there."} ]},

{ key:'mercy', label:'Mercy', bg:SKY, learn:'mercy',
  view:()=>PG(`${glory(300,170,200)}${clouds(370)}${christ(300,250,1.4)}${soul(380,250,1.1)}`,'Christ in glory, with the small soul beside him.',{floor:false}),
  enter(){ chime(); mood('glory'); },
  beats:[
    {text:"That is the whole point of the scales in the old pictures. Nobody's life is heavy enough on its own. What tips it is mercy: the cross, laid on the pan."},
    {text:"And what are you weighed on? The Catechism answers with a line from Saint John of the Cross. At the evening of life, we shall be judged on our love."} ]},

{ key:'three', label:'Three doors', bg:PAPER,
  view:()=>PG(`<g transform="translate(110 0)"><path d="M-70 335 V150 Q0 70 70 150 V335Z" fill="#FFF6D8" stroke="${INK}" stroke-width="3"/>${glory(0,220,90)}</g><g transform="translate(300 0)"><path d="M-70 335 V150 Q0 70 70 150 V335Z" fill="#F0C98A" stroke="${INK}" stroke-width="3"/>${flames(-60,335,120,90,6,RED)}${soul(-20,250,.9)}${soul(24,240,.9)}</g><g transform="translate(490 0)"><path d="M-70 335 V150 Q0 70 70 150 V335Z" fill="#2E2A22" stroke="${INK}" stroke-width="3"/>${hellmouth(0,330,.8)}</g>`,'Three arched doors: one full of light, one of gentle flame with souls inside, one dark with the mouth of hell.'),
  enter(){ mood('chant'); },
  beats:[
    {text:"After the judgment, the Church teaches three possible ways on. Tap each door.", lock:true, show(){ tapAll([
      [18,60,'Heaven',"Heaven: to see God face to face, with everyone who loves him. The Catechism calls it the fulfilment of the deepest human longings (§ 1024)."],
      [50,60,'Purgatory',"Purgatory: for those who die in God's friendship but are not finished yet. Not a punishment, a cleaning. Everyone who goes there is already saved (§ 1030)."],
      [82,60,'Hell',"Hell: what the Church calls a state of definitive self-exclusion from God. Not a place God sends you. A no you keep saying (§ 1033)."] ]); }},
    {text:"Most people, the Church thinks, are neither ready for heaven nor lost. Where do you want to look first?", lock:true, afterType(){ pick([{label:'Look into hell',go:'x_hell'},{label:'Go to purgatory'}]); }} ]},

{ key:'purgatory', label:'Purgatory', bg:'#EAC48C',
  view:()=>PG(`${clouds(70,'#FBF6EA')}${angel(300,120,1)}${flames(20,335,560,110,14,RED)}${[90,170,250,350,430,510].map((x,i)=>`<g id="ps${i}" class="fade">${soul(x,270+(i%2)*14,1.1)}</g>`).join('')}${[[150,330],[300,330],[450,330]].map(([x,y],i)=>`<g>${candle(x,y,1,false)}</g><g id="pc${i}" opacity="0" style="transition:opacity .6s">${candle(x,y,1,true)}</g>`).join('')}`,'Souls stand in gentle flames with their hands raised. An angel waits above. Three unlit candles stand at the front.',{floor:false}),
  enter(){ mood('fire','chant'); },
  guide:{title:'Is the fire real?',text:"The Church has never defined what purgatory is like, only that it is a purification and that it ends. The fire is an image from Scripture: we will be saved, 'but only as through fire' (1 Corinthians 3:15). Pope Benedict XVI suggested the fire may simply be the gaze of Christ, which burns and heals at once."},
  beats:[
    {text:"Purgatory. The old pictures always drew it as fire, but look at the faces. Nobody here is lost. They are waiting, and getting ready."},
    {text:"And here, the living can still help. Since the earliest centuries Christians have prayed for their dead (§ 1032). Tap each candle to light one for someone.", lock:true, show(){ tapAll([
      [25,74,'Light a candle',"A candle, and a prayer: eternal rest grant unto them, O Lord.",()=>{ $('#pc0').setAttribute('opacity','1'); ['ps0','ps1'].forEach(i=>{ const e=$('#'+i); e.style.transform='translateY(-150px)'; e.style.opacity='0'; }); }],
      [50,74,'Light a candle',"A Mass said for them, which the Church counts as the greatest help of all.",()=>{ $('#pc1').setAttribute('opacity','1'); ['ps2','ps3'].forEach(i=>{ const e=$('#'+i); e.style.transform='translateY(-150px)'; e.style.opacity='0'; }); }],
      [75,74,'Light a candle',"And alms: something given to the poor, in their name.",()=>{ $('#pc2').setAttribute('opacity','1'); ['ps4','ps5'].forEach(i=>{ const e=$('#'+i); e.style.transform='translateY(-150px)'; e.style.opacity='0'; }); }] ]); }} ]},

{ key:'purgFree', label:'Purgatory', bg:SKY, learn:'prayer',
  view:()=>PG(`${glory(300,110,160)}${clouds(330)}${angel(300,190,1.1)}${soul(240,150,1)}${soul(360,150,1)}${soul(300,90,1)}`,'An angel lifts the souls up into the light.',{floor:false}),
  enter(){ mood('glory'); chime(); },
  beats:[
    {text:"The angel lifts them out. That's the strange comfort of purgatory: the dead are not out of reach. A candle lit in a church on a wet Tuesday still counts."},
    {text:"And it works both ways. Catholics believe the saints pray for the living too. Nobody, on either side of death, is on their own."} ]},

{ key:'heaven', label:'Heaven', bg:SKY,
  view:()=>PG(`${glory(300,150,210)}${clouds(340)}${christ(300,190,1.2)}${[[150,230,BLUE],[200,250,RED],[400,250,GREEN],[450,230,'#FBF6EA']].map(([x,y,c])=>figure(x,y,.75,{halo:true,robe:c})).join('')}${angel(90,150,.8)}${angel(510,150,.8,{flip:true})}`,'Heaven: Christ in a great golden light, saints and angels all around, clouds below.',{floor:false}),
  enter(){ mood('glory'); },
  beats:[
    {text:"Heaven. The Bible is careful not to describe it much. It says we will see God face to face, and know him as we are known (1 Corinthians 13:12). The Church calls this the beatific vision."},
    {text:"Saint Augustine put it best, in the first lines of his Confessions: our heart is restless until it rests in you."},
    {text:"So rest. Don't tap anything. Stay as long as it takes.", lock:true, cls:'quiet', afterType(){ stillTest({ms:15000,pass:'vision',fail:'heavenFail'}); }} ]},

{ key:'heavenFail', label:'Heaven', bg:SKY,
  view:()=>PG(`${glory(300,150,160)}${clouds(340)}${christ(300,190,1.2)}`,'The light, waiting.',{floor:false}),
  beats:[{text:"Restless, still. That's what Augustine meant. Heaven isn't going anywhere, and neither is God's patience.", lock:true, afterType(){ tryAgain('Rest again','heaven',2); }}] },

{ key:'vision', label:'Heaven', bg:'#FFF6D8',
  view:()=>PG(`<rect width="600" height="400" fill="#FFF6D8"/>${glory(300,200,300)}${glory(300,200,160)}`,'Only light.',{floor:false,bg:'#FFF6D8'}),
  enter(){ chime(); setTimeout(()=>bell(523.25,.08,6),1400); },
  beats:[
    {text:"There. That is the nearest a picture can get. What no eye has seen, nor ear heard, nor the heart of man imagined, God has prepared for those who love him (1 Corinthians 2:9)."},
    {text:"But this is not quite the end of the Christian story. The soul is in heaven. The body is still in the ground. Christianity isn't finished with it."} ]},

/* ===== Volume 3: the last day ===== */
{ key:'v3', label:'Volume 3', bg:'var(--teal)',
  view:()=>card('Volume 3','The Last Day',"Meanwhile, on earth, the living keep faith with the dead. And at the end of time, Christians believe, every grave will open."),
  enter(){ mood('chant'); bell(196,.1,6); }, beats:[{text:null}] },

{ key:'communion', label:'The living and the dead', bg:PAPER,
  view:()=>PG(`${[150,300,450].map(x=>`<g transform="translate(${x} 330)"><path d="M-34 0 V-80 Q0 -112 34 -80 V0Z" fill="#C9BFA6" stroke="${INK}" stroke-width="3"/><path d="M-6 -78 h12 M0 -90 v24" stroke="${INK}" stroke-width="2"/></g>`).join('')}${candle(205,335,1)}<g transform="translate(355 332)"><path d="M-24 0 Q-24 -16 0 -16 Q24 -16 24 0Z" fill="#FBF6EA" stroke="${INK}" stroke-width="2"/><path d="M-14 -10 l3 -3 M-2 -12 l3 -3 M10 -10 l3 -3" stroke="${OCHRE}" stroke-width="3"/></g><g transform="translate(505 332)">${[-10,0,10].map(d=>`<path d="M${d} 0 Q${d-4} -20 ${d} -34" stroke="${GREEN}" stroke-width="2.5" fill="none"/><circle cx="${d}" cy="-36" r="6" fill="${RED}" stroke="${INK}" stroke-width="1.5"/>`).join('')}</g>${glory(300,60,90)}`,'A churchyard of three headstones. Beside them, a candle, a bowl of boiled wheat, and a bunch of flowers.'),
  enter(){ mood('room','chant'); knell(1,196); },
  guide:{title:'How the churches differ',text:"Orthodox Christians pray for the dead too, but don't teach purgatory as Catholics define it. Most Protestants, since the Reformation, reject purgatory: the forgiven go straight to be with Christ (Philippians 1:23). Latter-day Saints teach a spirit world where the dead keep learning, then three kingdoms of glory. Jehovah's Witnesses and Seventh-day Adventists teach that the dead sleep, unaware, until the resurrection. Almost all of them share what comes next: the last day."},
  beats:[
    {text:"Back on earth, the living don't stop. The Church calls it the communion of saints: one family, part of it on earth, part being purified, part in heaven. Tap the three things by the graves.", lock:true, show(){ tapAll([
      [34,76,'The candle',"A candle for All Souls' Day, the second of November, when Catholics remember all the dead at once. In parts of Europe, whole cemeteries glow."],
      [59,78,'The wheat',"Kolyva, boiled wheat with honey. Orthodox families bring it to memorial services on the third, ninth and fortieth days, because the seed that dies in the ground comes up again (John 12:24)."],
      [84,74,'The flowers',"Flowers on a grave. Every Christian church, whatever it teaches about the dead, keeps this one. Remembering is a kind of prayer."] ]); }} ]},

{ key:'trumpet', label:'The trumpet', bg:'#E8DDBF',
  view:()=>PG(`${glory(300,70,110)}${trumpeter(130,130,.9)}${trumpeter(470,130,.9,true)}${[[120,0],[240,1],[360,2],[480,3]].map(([x,i])=>`<g id="rb${i}" opacity="0" style="transition:opacity 1.2s, transform 1.6s">${figure(x,298,.75,{robe:'#FBF6EA'})}</g>`).join('')}${[[120,0],[240,1],[360,2],[480,3]].map(([x,i])=>gravel(x,330,i)).join('')}`,'Two angels blow long trumpets over a field of closed graves.'),
  enter(){ mood('chant'); setTimeout(()=>{ if(!ctx) return; [196,293.7,392].forEach((f,i)=>setTimeout(()=>{ const t=now(),o=ctx.createOscillator(),g=ctx.createGain(); o.type='sawtooth'; o.frequency.value=f; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1200; env(g,t,.08,.15,1.6); o.connect(lp).connect(g).connect(master); o.start(t); o.stop(t+2); },i*700)); },600); },
  beats:[
    {text:"Then, at the end of time, a trumpet. In a flash, in the twinkling of an eye, at the last trumpet, Paul wrote. For the trumpet will sound, and the dead will be raised (1 Corinthians 15:52)."},
    {text:"Hold to open the graves.", lock:true, show(){ holdOn({label:'Raise the dead',ms:6000,wait:1400,onProgress:p=>{ [0,1,2,3].forEach(i=>{ const l=$('#lid'+i); if(l) l.setAttribute('transform',`rotate(${(-Math.min(1,Math.max(0,p*1.6-i*.2))*40).toFixed(1)} -36 -8)`); }); },
      onDone:()=>{ [0,1,2,3].forEach(i=>{ const r=$('#rb'+i); if(r){ setTimeout(()=>{ r.setAttribute('opacity','1'); r.style.transform='translateY(-30px)'; },i*200); } }); chime(); }}); }} ]},

{ key:'risen', label:'The resurrection', bg:SKY, learn:'resurrection',
  view:()=>PG(`${glory(300,110,170)}${[[120,BLUE],[220,RED],[300,'#FBF6EA'],[380,GREEN],[480,BROWN]].map(([x,c],i)=>figure(x,250-(i%2)*14,.9,{robe:c})).join('')}${[100,200,300,400,500].map((x,i)=>gravel(x,340,'r'+i)).join('')}`,'The dead stand up out of their open graves, whole, in the light.'),
  enter(){ mood('glory'); },
  beats:[
    {text:"Christians don't believe the soul escapes the body and that's the end. They believe the body comes back. Your own, the Church says, the one you have now (§ 999)."},
    {text:"But changed. It is sown perishable, Paul says, and raised imperishable. Sown in weakness, raised in power (1 Corinthians 15:42). Whatever was broken in it isn't anymore."} ]},

{ key:'lastjudge', label:'The Last Judgment', bg:SKY,
  view:()=>PG(`${glory(300,120,140)}${rainbow(300,180,120)}${christ(300,170,1)}${[['bread',90,110],['cup',90,210],['door',90,310],['cloak',510,110],['sick',510,210],['chains',510,310]].map(([k,x,y])=>mercyIcon(x,y,k)).join('')}${clouds(380)}`,'Christ on the rainbow in judgment, surrounded by six small pictures: bread, a cup, a door, a cloak, a sickbed and chains.',{floor:false}),
  enter(){ mood('chant'); },
  beats:[
    {text:"Then comes the Last Judgment, of everyone at once. Jesus described it himself, in Matthew 25. And it's not the test anyone expects. Tap each picture.", lock:true, show(){ tapAll([
      [15,27,'Bread',"I was hungry and you gave me food."],
      [15,52,'A cup',"I was thirsty and you gave me drink."],
      [15,77,'A door',"I was a stranger and you welcomed me."],
      [85,27,'A cloak',"I was naked and you clothed me."],
      [85,52,'A sickbed',"I was sick and you visited me."],
      [85,77,'Chains',"I was in prison and you came to me."] ]); }},
    {text:"And when they ask, Lord, when did we ever see you hungry, he says: whatever you did for the least of these, you did for me."},
    {text:"That's the test. Not what you believed about the afterlife. Who you fed. Who you sat with. It turns out the friend at the bedside was taking it the whole time."} ]},

{ key:'newearth', label:'A new heaven and a new earth', bg:SKY,
  view:()=>PG(`${glory(300,110,200)}${city()}<path d="M300 335 Q280 360 300 400" stroke="${BLUE}" stroke-width="18" fill="none"/>${[230,370].map(x=>`<g transform="translate(${x} 335)"><line y2="-40" stroke="${BROWN}" stroke-width="6"/><circle cy="-52" r="24" fill="${GREEN}" stroke="${INK}" stroke-width="2.5"/>${[[-10,-56],[6,-46],[10,-62]].map(([a,b])=>`<circle cx="${a}" cy="${b}" r="3.5" fill="${RED}"/>`).join('')}</g>`).join('')}`,'A walled city with open, glowing gates, a river running out of it and fruit trees on either side.'),
  enter(){ mood('glory','chant'); chime(); },
  beats:[
    {text:"And the very last page of the Bible isn't about clouds. It's a city, coming down to earth. Its gates are never shut. A river runs out of it, and trees grow by the river, and their leaves are for the healing of the nations."},
    {text:"Behold, the dwelling of God is with man. He will wipe away every tear from their eyes, and death shall be no more, neither mourning, nor crying, nor pain (Revelation 21:3–4)."},
    {text:"Death shall be no more. That is where the whole Christian story is headed: not away from the world, but the world, made new."} ]},

{ key:'lastpage', label:'The last page', bg:PAPER,
  view:()=>PG(BL(`${crucifix(318,200,.5)}${candle(84,334,1.1)}${figure(548,292,1,{robe:'#FBF6EA',hood:true})}${glory(300,40,80)}`),'The bedroom from the start, in daylight. The bed is made. The friend is still there.'),
  enter(){ mood('room'); knell(1,293.7); },
  beats:[
    {text:"Back in the room where we started. The bed is made now."},
    {text:"Here is the secret of the Ars moriendi. It was never really for the dying. The dying rarely have the strength to read. It was for the living: to learn to die while you're well, and to be the friend at someone else's bed."},
    {text:"Teach us to number our days, the psalm says, that we may get a heart of wisdom (Psalm 90:12). Number them now. Fear not."} ]},

{ key:'end', label:'The end', bg:'var(--teal)',
  view:()=>`<div class="title-card" style="cursor:default"><span class="eyebrow">Explicit · here the book ends</span><h1>Go in peace</h1>
    <p>That was the whole craft: five temptations and their answers, the last rites, the judgment, the three doors, and the last day.</p><p id="endsum" style="font-weight:700"></p>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="again" type="button">Read it again</button><button class="btn alt" id="pathend" type="button">See your path</button><button class="btn alt" id="chend" type="button">Choose a chapter</button></div>
    <div class="endlinks"><a href="../walk/">Walk the Forty Days</a><a href="../../index.html#doors">Back to Many Doors</a></div></div>`,
  enter(){ mood('chant'); $('#again').onclick=e=>{ e.stopPropagation(); go(idx('room')); }; $('#chend').onclick=e=>{ e.stopPropagation(); openChapters(true); }; $('#pathend').onclick=e=>{ e.stopPropagation(); openPath(); };
    $('#endsum').textContent=`You learned ${journey.learned.size} of ${LESSONS.length} virtues and walked ${journey.visited.size} of ${DETOURS.length} wrong turns.`+(journey.learned.size===LESSONS.length?' You know the craft.':' Read again to learn the rest.'); },
  beats:[{text:null,lock:true}] },

/* ===== wrong turns: each plays out, then rewinds to the choice ===== */
{ key:'x_doubt', label:'A wrong turn', bg:DARK,
  view:()=>PG(BL(`${demon(110,220,1,{tint:GREEN})}${demon(520,200,.9,{flip:true})}${demon(330,160,.85,{tint:RED})}${demon(440,300,.6)}${scroll(320,64,160,'He is ours',{rot:-3})}${candle(84,334,1.1,false)}`),'The candle is out. Four demons dance around the bed, and a scroll says: he is ours.',{bg:'#C9B894'}),
  enter(){ mood('drone'); heartbeat(90); },
  beats:[
    {text:"Maybe they're right, you think. And the moment you think it, the room goes cold. The candle goes out. There are more demons than before."},
    {text:"This is what the book was afraid of. Not the doubt itself; doubt is normal. Giving up the fight, and letting the doubt have the last word.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_despair', label:'A wrong turn', bg:DARK,
  view:()=>PG(BL(`${demon(110,220,1)}${demon(520,220,.95,{flip:true,tint:BROWN})}${[[150,120,-8],[460,100,6],[300,60,-3],[330,170,3],[200,200,-5]].map(([x,y,r])=>scroll(x,y,150,'Guilty',{rot:r})).join('')}`),'More and more scrolls fill the air, all saying: guilty.',{bg:'#C9B894'}),
  enter(){ mood('drone'); heartbeat(92); },
  beats:[
    {text:"They're right about me, you say. The scrolls multiply until you can't see the ceiling."},
    {text:"Medieval preachers said this was Judas's real tragedy. Not the betrayal; Peter betrayed Jesus that same night. The difference is that Peter came back and asked. Judas never believed he could.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_impatience', label:'A wrong turn', bg:DARK,
  view:()=>PG(BL(`${demon(120,230,.9,{tint:RED})}${demon(400,240,.8,{flip:true})}${scroll(150,130,140,'Alone at last',{rot:-5})}<g transform="translate(560 300)">${figure(0,0,.8,{robe:BLUE})}</g><g transform="translate(470 322) rotate(-30)"><rect x="-22" y="-6" width="44" height="12" fill="${BROWN}" stroke="${INK}" stroke-width="2"/></g>`),'The doctor walks out the door. The family has gone. Two demons sit on the bed. A scroll says: alone at last.',{bg:'#C9B894'}),
  enter(){ mood('drone'); heartbeat(104); },
  beats:[
    {text:"You let go, and the pain comes out as anger. You shout at the doctor. You snap at your daughter. One by one they leave the room."},
    {text:"The demons don't need you to stop believing. They're happy if you just die alone and furious, with everyone who loved you standing in the hall.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_pride', label:'A wrong turn', bg:DARK,
  view:()=>PG(BL(`${crown(208,206,1.1)}${demon(110,220,.9)}${demon(520,210,.9,{flip:true,tint:GREEN})}${hellmouth(318,352,.75)}${scroll(320,64,160,'Well done',{rot:-3})}`,{}),'A crown sits on the dying man’s head. Under the bed, the mouth of hell opens wide.',{bg:'#C9B894'}),
  enter(){ mood('drone','fire'); heartbeat(84); crackle(1800); },
  beats:[
    {text:"You take the crown. It fits. Well done, the demons say. And under the bed, a mouth opens."},
    {text:"In the woodcut, the crowns lead straight down into the mouth of hell at the bottom of the page. Pride's trap is that it's so pleasant. It feels like being right.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_avarice', label:'A wrong turn', bg:DARK,
  view:()=>PG(BL(`${chest(260,262,1.2)}${demon(450,250,.9,{flip:true})}${figure(520,300,.75,{robe:RED})}${figure(570,300,.7,{robe:GREEN})}${scroll(500,170,160,'Mine!',{rot:4})}${scroll(160,120,180,'Hold it tighter',{rot:-4})}`),'The dying man clutches his money chest. At the foot of the bed, two heirs argue. A demon grins.',{bg:'#C9B894'}),
  enter(){ mood('drone'); heartbeat(88); },
  beats:[
    {text:"You hold on. You grip the chest so hard your knuckles go white, and your last hour is spent counting."},
    {text:"The book's grim joke is that it doesn't matter. At the foot of the bed, your heirs are already arguing over it. You can't take it with you, and now you've missed your own goodbye.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_hell', label:'Hell', bg:HELL,
  view:()=>PG(`${hellmouth(300,360,2.2)}${flames(20,400,560,140,16,RED)}${demon(120,170,.9,{tint:GREEN})}${demon(480,170,.9,{flip:true})}`,'The great mouth of hell, wide open and full of fire.',{floor:false,bg:'#5A2A1E'}),
  enter(){ mood('drone','fire'); crackle(3000); },
  guide:{title:'Does anyone go there?',text:"The Church teaches that hell exists and is eternal, but it has never said that any particular person is in it. It insists that God predestines no one to go there (Catechism § 1037), and prays at every Mass that all may be saved. C. S. Lewis, an Anglican, put it this way: the doors of hell are locked on the inside."},
  beats:[
    {text:"Hell. The painters loved it, and drew it as a mouth full of fire. The Church is more careful. The chief punishment of hell, it says, is eternal separation from God (§ 1035)."},
    {text:"Not God's rejection of you. Your rejection of God, kept up for ever. It's the one door in this book that only locks from the inside.", lock:true, afterType(){ rewindButton(); }} ]}
];

const CHAPTERS=[
  ['Before you begin',[['Learning to die','plague'],['How this book works','howto']]],
  ['Volume 1 · The Deathbed',[['The room','room'],['Faith','doubt'],['Hope','despair'],['Patience','impatience'],['Humility','pride'],['Letting go','avarice'],['The questions','questions'],['The last rites','rites'],['Go forth','commend']]],
  ['Volume 2 · The Judgment',[['The soul goes up','soul'],['The particular judgment','judge'],['Three doors','three'],['Purgatory','purgatory'],['Heaven','heaven']]],
  ['Volume 3 · The Last Day',[['The living and the dead','communion'],['The trumpet','trumpet'],['The Last Judgment','lastjudge'],['A new heaven and a new earth','newearth'],['The last page','lastpage']]] ];
const LESSONS=[
  ['faith','Faith',"When belief feels thin, lean on familiar words. You don't have to win the argument.",'The first temptation'],
  ['hope','Hope','No list of sins is longer than mercy. Peter, Paul and the thief prove it.','The second temptation'],
  ['patience','Patience',"The pain is real, and it's allowed. It doesn't have to be passed on.",'The third temptation'],
  ['humility','Humility','Heaven is given, not earned. Set the crown down.','The fourth temptation'],
  ['letgo','Letting go','Open your hands. What you love is handed on, not lost.','The fifth temptation'],
  ['mercy','Mercy','At the evening of life you are judged on your love.','The particular judgment'],
  ['prayer','Prayer','The living can still help the dead, and the dead the living.','Purgatory'],
  ['resurrection','Resurrection','Not an escape from the body. The body, raised and made new.','The trumpet'] ];
const IC=(d)=>`<path d="${d}" fill="none" stroke="#F8F0DD" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
const DETOURS=[
  ['x_doubt','Giving in to doubt',IC('M20 10 q8 0 8 7 q0 5 -8 7 v4 M20 31 v.5')],
  ['x_despair','Despair',IC('M12 12 h16 v18 h-16z M15 17 h10 M15 21 h10 M15 25 h6')],
  ['x_impatience','Dying angry',IC('M10 28 l6 -10 l4 6 l4 -12 l6 16')],
  ['x_pride','Taking the crown',IC('M10 28 l-1 -14 l6 6 l5 -9 l5 9 l6 -6 l-1 14z')],
  ['x_avarice','Holding on',IC('M10 18 h20 v12 h-20z M10 18 q10 -10 20 0')],
  ['x_hell','Hell',IC('M12 30 q-2 -10 4 -14 q0 6 4 6 q-2 -8 4 -12 q2 8 6 8 q2 6 -2 12z')] ];
updatePathBadge();
go(0);
