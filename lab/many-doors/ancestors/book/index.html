<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>window.MD_HOME='../../index.html#doors'</script>
<title>The Homegoing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Jost:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one full-screen "flight" — a thin instrument bar on top, the scene card in the middle, the narrator's caption card below it. Single deliberate look: the safety-card palette. */
:root{
  color-scheme: light;
  --cream:#F6EBD2; --parchment:#FBF3DF; --ink:#1E2A2B; --ink-soft:#44524F;
  --teal:#1F5E63; --teal-deep:#123D40; --brown:#8A4B22; --lamp:#F2B640;
  --red:#B8352A; --ok:#2F6B2B;
  --scene-bg: var(--cream);
  --display:'Jost', 'Futura', 'Century Gothic', sans-serif;
  --body:'Atkinson Hyperlegible', 'Verdana', sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;background:var(--scene-bg);transition:background-color 2.2s ease}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--ink);background:var(--parchment);transition:opacity 1.5s,filter 1.5s}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:.8rem;text-transform:uppercase}
#stageLabel{font-family:var(--display);font-weight:500;font-size:.85rem;color:var(--ink-soft);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stageLabel b{color:var(--brown);font-weight:700;margin-right:8px;font-variant-numeric:tabular-nums}
.tog{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:36px}
.tog[aria-pressed="false"]{background:transparent;color:var(--ink-soft);border-style:dashed}
.pick{font-family:var(--body);font-size:.8rem;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:8px;padding:6px 8px;min-height:36px;max-width:190px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pick:focus-visible,.tog:focus-visible,.btn:focus-visible,.spot:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
#stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:18px;padding-block:18px;padding-inline:16px;cursor:pointer;user-select:none}
#visual{width:100%;display:flex;justify-content:center;flex:none}
.frame{position:relative;width:min(100%, calc((100dvh - 380px) * 1.5), 980px);min-width:min(100%,300px);aspect-ratio:3/2;max-width:100%;border-radius:18px;overflow:hidden;transition:filter 3s ease, transform 3s ease}
.frame>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:filter 3s ease}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.caption{flex:none;max-width:720px;width:100%;box-sizing:border-box;background:var(--parchment);border:2px solid var(--ink);border-radius:6px;padding:16px 20px;min-height:4.6em;transition:opacity .8s, filter 1.5s, transform 1.5s, border-color 1.5s}
.caption p{margin:0;font-size:clamp(1.02rem, 2.3vw, 1.3rem);line-height:1.45;text-wrap:pretty}
.caption.quiet{background:transparent;border-color:transparent;text-align:center}
.caption.dark{background:#141413;color:var(--parchment);border-color:#141413}
.caption[hidden]{display:none!important}
#hint{margin:0;font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);opacity:0;transition:opacity .6s;min-height:1em}
#hint.on{opacity:.8;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
#choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.04em;border:2px solid var(--ink);background:var(--teal);color:var(--parchment);border-radius:999px;padding:12px 22px;cursor:pointer;min-height:48px}
.btn.alt{background:var(--parchment);color:var(--ink)}

/* dissolution: the manual's chrome comes apart; the narration always stays sharp */
body.d1 .bar{opacity:.85}
body.d2 .bar{filter:blur(.6px);opacity:.6}
body.d2 .frame{border-radius:28px}
body.d3 .bar{filter:blur(1.5px);opacity:.3}
body.d3 .frame{border-radius:40px}
body.void .bar,body.void #hint{opacity:0!important}

/* title */
.title-card{width:min(100%,640px);background:var(--teal);color:var(--parchment);border:2px solid var(--ink);border-radius:18px;padding:36px 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;align-items:flex-start;cursor:default}
.title-card .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:.75rem;color:var(--lamp);text-transform:uppercase}
.title-card h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1;text-wrap:balance;text-transform:uppercase;letter-spacing:.02em}
.title-card p{margin:0;font-size:1.05rem;line-height:1.5;max-width:46ch}
.title-card ol{margin:4px 0 8px;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;font-size:.98rem}
.title-card .btn{background:var(--lamp);color:var(--ink)}

/* hotspots */
.spot{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:3px solid #FFF3D6;background:rgba(242,182,64,.35);cursor:pointer;padding:0}
.spot::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid #FFF3D6;animation:ping 1.8s ease-out infinite}
.spot.done{opacity:0;pointer-events:none;transition:opacity .6s}
@keyframes ping{from{transform:scale(.7);opacity:.9}to{transform:scale(1.4);opacity:0}}
.heartglow{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(var(--s,0.4));background:radial-gradient(circle,#FFFBEA 0%,rgba(255,221,120,.85) 35%,rgba(255,200,80,0) 70%);transition:transform 1.2s ease;pointer-events:none}

/* breath ring */
.breath{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.6);border-radius:50%;border:4px solid var(--parchment);box-shadow:0 0 0 12px rgba(251,243,223,.15);transition:transform 1s ease-in-out, opacity 1s}

/* svg scenes */
.svgscene{position:absolute;inset:0;width:100%;height:100%}
.flicker{transform-origin:300px 262px;animation:flick 1.3s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1) skewX(0)}30%{transform:scaleY(.9) skewX(3deg)}60%{transform:scaleY(1.06) skewX(-2deg)}}
.orb-down{animation:down 7s ease-in-out forwards}
.orb-up{animation:up 7s ease-in-out forwards}
@keyframes down{to{transform:translateY(91px)}}
@keyframes up{to{transform:translateY(-55px)}}
.dots{stroke-dasharray:2 7;stroke-linecap:round}

/* guide entry */
.guide{position:absolute;inset:0;background:var(--parchment);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;gap:4%;padding:5%;box-sizing:border-box}
.guide .tag,.doorsteps .tag{display:inline-block;font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:clamp(.55rem,1.4vw,.75rem);background:var(--teal);color:var(--parchment);padding:5px 10px;border-radius:4px;text-transform:uppercase}
.guide h2{margin:10px 0 8px;font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,3.4vw,2.2rem);line-height:1.05;text-transform:uppercase;color:var(--brown);text-wrap:balance}
.guide p{margin:0;font-size:clamp(.85rem,1.8vw,1.15rem);line-height:1.45}
.guide .fig{height:100%;display:flex;align-items:center;justify-content:center;background:var(--teal);border-radius:12px;min-height:0}
.frame.guideframe{aspect-ratio:auto;width:min(100%,860px)}
.frame.guideframe .guide{position:relative;inset:auto;padding:24px;gap:24px}
.guide .fig{align-self:stretch;min-height:200px;padding:12px}
.guide .fig svg{height:220px;width:auto}
.guide .gtext{box-sizing:border-box}
.guide .gtext:focus-visible{outline:3px solid var(--lamp)}
@media (max-width:760px){
  .frame.guideframe .guide{grid-template-columns:1fr;gap:16px;padding:18px}
  .guide .fig{min-height:0}
  .guide .fig svg{height:150px}
  .guide h2{font-size:1.5rem}
  .guide p{font-size:1.02rem}
}

/* clear light */
.crack{stroke-dasharray:900;stroke-dashoffset:900;animation:crack 1.2s ease-out forwards}
@keyframes crack{to{stroke-dashoffset:0}}
.bubble{opacity:0;transform:scale(.6);transform-origin:80% 80%;transition:opacity .8s, transform .8s}
.bubble.on{opacity:1;transform:scale(1)}
.ring{position:absolute;left:49.8%;top:43%;width:8%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(242,182,64,.55);transform:translate(-50%,-50%);animation:ring 4.5s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(9);opacity:0}}


/* chapters 4-5 */
.rise{animation:rise 4.5s ease-out forwards}
@keyframes rise{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
.walk{animation:walk 9s ease-in forwards}
@keyframes walk{to{transform:translateY(-22px);opacity:.25}}
.steam path{animation:steam 2.4s ease-in-out infinite}
.steam path+path{animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
.balloon{opacity:0}
.balloon.on{animation:shout 4s ease-out forwards}
@keyframes shout{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.mug{opacity:0}
.mug.on{opacity:1;animation:shake .35s linear 2}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.drawer{transition:transform 1s ease}
.drawer.open{transform:translateX(60px)}
.page{transform-box:fill-box;transform-origin:center;animation:fly 1.6s ease-in forwards}
.page.f2{animation-delay:.35s}.page.f3{animation-delay:.7s}
@keyframes fly{to{transform:translate(160px,-190px) rotate(30deg);opacity:0}}
.glass.flash{animation:flash .9s ease}
@keyframes flash{40%{fill:#FFFFFF}}
.popped{transform-box:fill-box;transform-origin:center;animation:pop 1.2s ease 1s forwards}
@keyframes pop{to{transform:scale(1.5);opacity:0}}
.drops{opacity:0;animation:drops 1s ease 2s forwards}
@keyframes drops{to{opacity:1}}
.drawerbtn{position:absolute;background:transparent;border:2px dashed rgba(251,243,223,.75);border-radius:6px;cursor:pointer;padding:0}
.drawerbtn:hover{background:rgba(242,182,64,.2)}
.drawerbtn:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.run{background:var(--red);font-size:1.2rem;letter-spacing:.24em;text-transform:uppercase;padding:14px 34px;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.checks{position:absolute;inset:0;background:var(--parchment);padding:5%;box-sizing:border-box;display:flex;flex-direction:column;gap:4%}
.ck-head span{display:block;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(.95rem,3.4vw,2rem);color:var(--brown);letter-spacing:.03em}
.ck-head small{display:block;font-size:clamp(.7rem,1.6vw,1rem);color:var(--ink-soft);margin-top:4px}
.ck-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;flex:1}
.ck{display:flex;align-items:center;gap:6%;padding:4%;border:2px solid var(--ink);border-radius:12px;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:clamp(.7rem,1.9vw,1.15rem);line-height:1.25;text-align:left;cursor:pointer;min-width:0}
.ck:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.box{flex:none;width:clamp(18px,3vw,32px);aspect-ratio:1;border:3px solid var(--ink);border-radius:6px;position:relative;background:#FFFFFF}
.ck[aria-pressed="true"] .box{background:var(--ok)}
.ck[aria-pressed="true"] .box::after{content:"";position:absolute;left:30%;top:6%;width:28%;height:58%;border:solid #FFFFFF;border-width:0 4px 4px 0;transform:rotate(45deg)}


/* epilogue */
.duo{position:absolute;inset:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.half{position:relative;border:0;padding:0;margin:0;cursor:pointer;background:none;overflow:hidden;transition:filter .4s}
.half svg{width:100%;height:100%;display:block}
.half span{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(.68rem,1.6vw,.95rem);background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;white-space:nowrap}
.duo:hover .half:not(:hover){filter:brightness(.55)}
.half:focus-visible{outline:4px solid var(--lamp);outline-offset:-4px}
.rules{position:relative;background:var(--parchment);padding:24px;display:flex;flex-direction:column;gap:18px}
.rule-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rule{display:flex;flex-direction:column;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:12px;background:var(--cream);min-width:0}
.rule svg{width:100%;height:auto;border-radius:8px;background:#E9DDBF}
.rule b{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--teal)}
.rule p{margin:0;font-size:clamp(.9rem,1.6vw,1.05rem);line-height:1.35}
.spin{transform-origin:300px 170px;animation:spinr 40s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.bluerise{animation:brise 3s ease-out forwards}
@keyframes brise{to{opacity:.85;transform:translateY(-40px)}}

/* volume 2 */
.approach{transform-origin:300px 205px;animation:approach 9s ease-in forwards}
@keyframes approach{from{transform:scale(.8)}to{transform:scale(1.14)}}
.pulse{transform-origin:300px 205px;animation:pulseg 1.24s ease-in-out infinite}
@keyframes pulseg{50%{opacity:.12;transform:scale(.92)}}
.morph .pulse{animation:none;opacity:0;transition:opacity 1s}
.wrath{transform-origin:300px 205px;transition:transform 1.6s ease, opacity 1.4s ease}
.fl{transform-origin:300px 205px;animation:flick2 .45s ease-in-out infinite alternate}
@keyframes flick2{to{transform:scale(1.04) rotate(1.5deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.peace{opacity:0;transform-origin:300px 205px;transform:scale(.3);transition:opacity 1.6s ease .5s, transform 1.6s ease .5s}
.morph .wrath{transform:scale(.12) rotate(90deg);opacity:0}
.morph .peace{opacity:1;transform:scale(1)}
.frame.facing{transition:none;animation:shake2 .12s linear infinite}
@keyframes shake2{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.holdbtn{position:absolute;inset:0;background:transparent;border:0;padding:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.holdpill{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:8px 16px 8px 8px;font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:clamp(.72rem,1.7vw,.95rem);white-space:nowrap}
.holdpill svg{width:30px;height:30px}
.holdbtn:focus-visible .holdpill{outline:3px solid var(--lamp);outline-offset:3px}
.zone{position:absolute;background:transparent;border:2px dashed rgba(255,255,255,.55);border-radius:50%;cursor:pointer;padding:0}
.zone:focus-visible{outline:3px solid var(--lamp)}
.closing{transform-origin:300px 205px;animation:closing 10s ease-in forwards}
@keyframes closing{from{transform:scale(1.35)}to{transform:scale(.82)}}
.orbit{transform-origin:300px 210px;animation:spinr 18s linear infinite}


/* chapters menu */
#app{position:relative}
.chap{position:absolute;right:16px;top:calc(100% + 0px);z-index:20;width:min(340px,calc(100% - 32px));max-height:min(70vh,560px);overflow-y:auto;background:var(--parchment);border:2px solid var(--ink);border-radius:14px;box-shadow:0 12px 30px rgba(20,20,19,.25);padding:14px;box-sizing:border-box}
.chapwrap{position:relative;z-index:20}
.chap h3{margin:10px 6px 6px;font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brown)}
.chap h3:first-child{margin-top:2px}
.chap ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.chap button{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;background:transparent;border:0;border-radius:8px;padding:10px 8px;font-family:var(--body);font-size:1rem;color:var(--ink);cursor:pointer;min-height:44px}
.chap button:hover,.chap button:focus-visible{background:var(--cream);outline:none}
.chap button[aria-current="true"]{background:var(--cream);font-weight:700}
.chap button small{font-family:var(--display);font-weight:700;font-size:.7rem;letter-spacing:.1em;color:var(--ink-soft);min-width:2.4em;font-variant-numeric:tabular-nums}


/* volume 3 */
.streaks{animation:streak 1.1s linear infinite}
@keyframes streak{from{transform:translateX(-140px)}to{transform:translateX(140px)}}
.blown{animation:blown 2.6s ease-in-out infinite}
@keyframes blown{50%{transform:translate(40px,-8px)}}
.elgrid{position:absolute;inset:0;background:#1B2224;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;padding:6%;box-sizing:border-box}
.el{background:#2A3335;border-radius:14px;display:flex;align-items:center;justify-content:center;opacity:.22;transition:opacity .4s, transform .4s;min-height:0}
.el svg{width:62%;height:auto;max-height:90%}
.el.on{opacity:1;transform:scale(1.04)}
.peb{opacity:0}
.pebs.on .peb{animation:drop .5s ease-in forwards}
@keyframes drop{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:none}}
.mref{opacity:0;transition:opacity 1.2s}
.mref.on{opacity:1}
.approach2{transform-origin:230px 200px;animation:approach 9s ease-in forwards}
.leaf{transform-origin:20px 115px;transform:scaleX(.12);transition:transform .15s}
.doorwrap{position:relative;background:var(--parchment);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:24px;padding:24px;align-items:center}
.doorsteps ol{margin:12px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-size:clamp(.95rem,1.8vw,1.1rem);line-height:1.35}
.doorpic svg{width:100%;height:auto;max-height:260px;display:block}
.doorgrid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px;background:#10181B}
.doorcard{display:flex;flex-direction:column;gap:8px;background:var(--parchment);border:2px solid var(--ink);border-radius:12px;padding:8px;cursor:pointer;font-family:var(--body);font-size:clamp(.82rem,1.6vw,1rem);line-height:1.25;color:var(--ink);text-align:left;min-width:0}
.doorcard svg{width:100%;height:auto;border-radius:8px;display:block}
.doorcard:hover{transform:translateY(-2px)}
.doorcard.nope{opacity:.4;filter:grayscale(1)}
.doorcard:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}

/* pilot: shared production layer */
#visual{position:relative}
.leaving{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;pointer-events:none;z-index:4;animation:leave .7s ease forwards}
@keyframes leave{to{opacity:0;transform:scale(.985)}}
.entering{animation:enter .8s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{clip-path:inset(0 0 0 100% round 18px)}to{clip-path:inset(0 0 0 0 round 18px)}}
.amb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.kb{animation:kb 24s ease-out forwards;transform-origin:62% 48%}
@keyframes kb{to{transform:scale(1.09)}}
.glowspot{position:absolute;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.55) 0%,rgba(255,190,90,.18) 40%,rgba(255,190,90,0) 70%);mix-blend-mode:screen;pointer-events:none;animation:candle 2.3s steps(9,end) infinite;transition:opacity 1.2s ease}
@keyframes candle{0%{opacity:.85;transform:translate(-50%,-50%) scale(1)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}35%{opacity:.75}55%{opacity:.95;transform:translate(-50%,-50%) scale(.97)}75%{opacity:.8}100%{opacity:.9;transform:translate(-50%,-50%) scale(1.02)}}
.callout{position:absolute;z-index:3;transform:translate(-50%,-50%) scale(0);background:var(--parchment);border:2px solid var(--ink);border-radius:8px;padding:5px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards;box-shadow:0 3px 0 var(--ink);pointer-events:none;white-space:nowrap}

function whiteTable(x,y,w=300){ return `<path d="M${x-w/2} ${y} H${x+w/2} L${x+w/2-10} ${y+70} H${x-w/2+10}Z" fill="${COWRIE}" stroke="${K}" stroke-width="2"/><path d="M${x-w/2} ${y} H${x+w/2}" stroke="${K}" stroke-width="3"/>`; }

/* The Homegoing, the full book. African and diaspora traditions, where the dead are not gone but become ancestors:
   the Yoruba of Nigeria, the Akan of Ghana, the Kongo of Central Africa, the Zulu and Xhosa of South Africa, and, across the
   Atlantic, Haitian Vodou, Brazilian Candomblé, Cuban Lucumí, and the jazz funerals of New Orleans. Each is its own door,
   told from published scholarship and practitioners' own public accounts. Many of these rites belong to initiates; nothing
   here is a guide to practising them, and no spirit, orisha or lwa is drawn. A first draft: each door should be read by
   people of that tradition. */
const BOOK={home:'word', toast:'Learned: ', pathLabel:'Path', pathTitle:'What you have learned', detourTitle:'Wrong turns you walked',
  pathNote:'Every wrong turn rewinds. Each door is its own people, with its own ways.',
  guideBack:'Back to the book', voiceSample:'The world is a market. Heaven is home.'};

Object.assign(MOODS,{ drone:()=>drone(),
  night:()=>pad('night',[98,146.83,196],.03), warm:()=>pad('warm',[110,164.81,220],.035), light:()=>pad('light',[130.81,196,261.63],.035),
  sea:()=>startLoop('sea',g=>{ const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=600; s.connect(f).connect(g); s.start(); return [s]; },.06),
  crowd:()=>startLoop('crowd',g=>{ const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=.5; s.connect(f).connect(g); s.start(); return [s]; },.025) });
function drumHit(k=1){ if(!ctx) return; thump(.5); burst({type:'lowpass',freq:160+k*14,peak:.2,a:.003,d:.22}); }
function horn(k=0){ if(!ctx) return; const t=now(); [1,1.5,2].forEach((m,i)=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.type='sawtooth'; o.frequency.value=[233.1,261.6,293.7,349.2,392][k%5]*m; env(g,t,.03/(i+1),.04,.5); const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1400; o.connect(f).connect(g).connect(master); o.start(t); o.stop(t+.7); }); }
function tapCount(n,lab,onTap,snd=drumHit){ let k=0; choices.innerHTML=`<button class="btn" type="button" id="tc">${lab} · 0 of ${n}</button>`; const b=$('#tc'); b.focus({preventScroll:true});
  b.onclick=e=>{ e.stopPropagation(); initAudio(); k++; snd(k); onTap&&onTap(k); b.textContent=`${lab} · ${k} of ${n}`; if(k>=n){ b.disabled=true; setTimeout(()=>{ choices.innerHTML=''; next(); },700); } }; }
const DOORS=[['Yoruba','v_yor'],['Akan','v_akan'],['Kongo','v_kongo'],['Zulu and Xhosa','v_za'],['Haitian Vodou','v_vod'],['Candomblé','v_can'],['Lucumí','v_luc'],['New Orleans','v_nola']];
const SEC=(x,y)=>`<g id="sec">${bird(x,y,1)}</g>`;

/* ---------- the book ---------- */

{ key:'title', label:'', bg:NIGHTBG,
  view:()=>`<div class="title-card" role="dialog" aria-label="Start"><span class="eyebrow">Many Doors · African and diaspora · the full book</span><h1>The Homegoing</h1>
    <p>In much of Africa, the dead don't leave. They become ancestors: elders of the family who watch over the living, and who are fed, named and remembered. When millions of Africans were carried across the Atlantic in chains, they brought that faith with them. This book has eight doors: four in Africa, four in the Americas.</p>
    <p class="draft">These are living traditions, and many of their rites belong to initiates. This book tells only what practitioners and scholars have shared publicly. It draws no spirits, copies no sacred signs, and isn't a guide to practising anything.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">${DOORS.map(([n,k])=>`<button class="btn alt" type="button" data-door="${k}">${n}</button>`).join('')}</div>

/* ===== Akan ===== */
{ key:'v_akan', label:'Akan', bg:'var(--teal)',
  view:()=>card('Door 2 · Akan','The funeral and the stool',"The Akan peoples, among them the Asante, Fante and Akuapem, make up nearly half of Ghana. For them, a funeral may be the greatest event in a family's life."),
  enter(){ mood('warm'); drumHit(); }, beats:[{text:null}] },

{ key:'ak_cloth', label:'The funeral', bg:CLOTHBG, learn:'cloth',
  view:()=>PG(`${ground(330,'#9A6A3A')}<path d="M60 150 H540 V180 H60Z" fill="${KOLA}" stroke="${K}" stroke-width="2"/>${crowd([100,170,240,310,380,450,520],330,.7,{cols:[KOLA,'#241C18',KOLA,COWRIE,'#241C18',KOLA,'#241C18'],hats:['wrap','none','cap','wrap']})}`,'A crowd in red and black cloth under a red awning.'),
  enter(){ mood('warm','crowd'); },
  guide:{title:'Funeral cloth, and the coffins of Accra',text:"Akan funerals are often held weeks or months after a death, so relatives can travel home. Mourners wear kɔbene (red) and kuntunkuni (dark brown or black) cloth for grief, and white when a long life is being celebrated or at the final rites. There is drumming, dancing, speeches and food, for hundreds of guests. Not far away in Accra, the Ga people are known for figurative coffins carved in the shape of a fish, a car, a cocoa pod: something from the dead person's life. The carver Seth Kane Kwei made them famous from the 1950s."},
  beats:[
    {text:"In Ghana, an Akan funeral can draw hundreds of people. It is grief, and a party, and a send-off to Asamando, the land of the ancestors, all at once."},
    {text:"The cloth people wear says something. Tap each colour.", lock:true, afterType(){ tapAll([
      [20,40,'Red','Red cloth, kɔbene: the colour of grief, and of loss that is hard to bear.'],
      [50,40,'Black','Black or dark brown, kuntunkuni: mourning, and respect for the dead.'],
      [80,40,'White','White: for a very old person whose long life is being celebrated, and at the final rites, when grief turns to thanks.'] ]); }} ]},

{ key:'ak_stool', label:'The stool', bg:'#2A1E18', learn:'stool',
  view:()=>PG(`<rect x="60" y="70" width="480" height="260" fill="#4A3426" stroke="${K}" stroke-width="2"/>${stool(200,320,1.2,{black:true})}${stool(400,320,1.2,{black:true})}<g id="lib"></g>${pp(300,330,.9,{col:COWRIE,trim:KOLA,arms:'offer',hat:'none',skin:SKINS[2]})}`,'Two blackened carved stools in a quiet room, and an elder standing between them.',{bg:'#3A2A20'}),
  enter(){ mood('night'); },
  guide:{title:'Blackened stools and Adae',text:"For the Akan, a stool holds something of its owner's soul. When a revered chief or queen mother dies, their stool may be blackened and kept in a stool house, where the ancestors of the lineage are remembered. At Adae, every six weeks in the Akan calendar, they are offered food and drink. Pouring libation, a little drink on the ground while calling the ancestors by name, still opens family gatherings and even state events in Ghana."},
  beats:[
    {text:"When a great chief or queen mother dies, their carved stool may be blackened and set in the stool house, with those of the chiefs before them."},
    {text:"Every six weeks, at Adae, the ancestors are remembered there. An elder pours a little drink on the ground, and calls them by name. Press and hold while the libation is poured.", lock:true, afterType(){ holdOn({label:'Pour the libation',ms:4500,
      onProgress:p=>{ const l=$('#lib'); if(l) l.innerHTML=p>.1?`<path d="M300 220 Q302 ${220+p*90} 300 ${222+p*100}" stroke="#E8D8B0" stroke-width="4" fill="none"/><ellipse cx="300" cy="330" rx="${p*40}" ry="${p*6}" fill="#6A4A2E" opacity=".7"/>`:''; }}); }},
    {text:"The first drink goes to those who came before. In many Akan homes, nothing important starts without them."} ]},

{ key:'ak_sankofa', label:'Go back and get it', bg:CLOTHBG, learn:'sankofa',
  view:()=>PG(`${ground(320)}${SEC(300,290)}<ellipse cx="270" cy="262" rx="7" ry="9" fill="${COWRIE}" stroke="${K}" stroke-width="1.4"/>`,'A bird stands facing forward, with its head turned back over its shoulder.'),
  enter(){ mood('light'); },
  guide:{title:'Sankofa',text:"Sankofa is an Akan word meaning \"go back and get it.\" A proverb says: \"It is not wrong to go back for that which you have forgotten.\" It is drawn as a bird with its head turned backwards. In the Americas, many people of African descent have taken Sankofa as their own sign: honouring ancestors whose names were taken from them. In 1991, at the African Burial Ground in Lower Manhattan, archaeologists found a coffin lid with a heart-shaped design that many believe is a Sankofa sign."},
  beats:[
    {text:"The Akan have a word: Sankofa. Go back and get it. It's pictured as a bird walking forward, with its head turned back."},
    {text:"It means it is never wrong to go back for what you've forgotten: your people, your story, your dead. Across the ocean, their descendants would need that word."} ]},

/* ===== Kongo ===== */
{ key:'v_kongo', label:'Kongo', bg:'var(--teal)',
  view:()=>card('Door 3 · Kongo','The line of water',"The BaKongo live along the Congo River, in today's Angola and both Congos. Their idea of the world under the water travelled to Brazil, Cuba, Haiti and the American South."),
  enter(){ mood('night'); drumHit(); }, beats:[{text:null}] },

{ key:'ko_kalunga', label:'Kalunga', bg:SEABG, learn:'kalunga',
  view:()=>PG(`<g id="kl">${kalunga(200,{sun:[120,120]})}</g>`,'A great water line divides the land above from its mirror image below.',{bg:'dusk'}),
  enter(){ mood('night','sea'); },
  guide:{title:'Kalunga and the circle of the sun',text:"In Kongo thought, the world of the living sits above a line of water called Kalunga. Below it lies the world of the dead, Mpémba, the white land, a mirror of this one, where the ancestors live. The sun rises, crosses the sky, sets into the water and travels through the world below, then rises again. A person's life follows the same circle: born, grows strong, dies, and goes on among the dead. The art historian Robert Farris Thompson, in Flash of the Spirit (1983), and the Kongo scholar K. Kia Bunseki Fu-Kiau described this cosmogram."},
  beats:[
    {text:"For the BaKongo, the world is split by a shining line of water: Kalunga. The living are above it. Below lies the land of the dead, a white mirror of this one."},
    {text:"The sun shows the way. Press and hold, and follow it across the sky, into the water, and around again.", lock:true, afterType(){ holdOn({label:'Follow the sun',ms:6000,
      onProgress:p=>{ const a=Math.PI*(1-p*2); const k=$('#kl'); if(k) k.innerHTML=kalunga(200,{sun:[300+Math.cos(a)*200,200-Math.sin(a)*130]}); }}); }},
    {text:"A life is the same circle. You rise, you shine, you set, and you go on below the water, among the ancestors."} ]},

{ key:'ko_grave', label:'The grave', bg:CLOTHBG, learn:'graves',
  view:()=>PG(`${ground(310,'#8A7A5A')}${bigtree(470,310,.8)}${grave(260,318,2.2)}`,'A grave mound covered in plates, cups and shells.'),
  enter(){ mood('warm'); },
  guide:{title:'Graves of the last things',text:"Kongo graves were often decorated with the last things the dead person used: plates, cups, pitchers, lamps, sometimes cracked or broken. White things and water things recall the world below Kalunga. Robert Farris Thompson traced the same custom to the graves of African Americans in Georgia, South Carolina and elsewhere in the American South, where shells, cups and clocks were laid on graves well into the twentieth century."},
  beats:[
    {text:"On a Kongo grave, the family lays the last things the person used. Tap each one.", lock:true, afterType(){ tapAll([
      [30,72,'A plate','A plate: they will eat again, below the water.'],
      [42,66,'A cup','A cup, sometimes cracked, so it belongs to the dead and no one else.'],
      [54,70,'Shells','White shells: the colour of the dead, and of the sea they cross.'],
      [47,76,'A bottle','Something from water. The ancestors live beneath it.'] ]); }},
    {text:"Thousands of miles away, on the graves of Black families in Georgia and South Carolina, people kept laying cups, shells and plates."} ]},

{ key:'ko_ocean', label:'The ocean', bg:SEABG, learn:'home',
  view:()=>PG(`${sea(230)}<g id="lt"></g>`,'A dark ocean at night.',{bg:'night'}),
  enter(){ mood('night','sea'); },
  guide:{title:'Across the water',text:"Between the 1500s and the 1800s, more than 12 million Africans were carried across the Atlantic in slave ships; many were from West Central Africa, the Kongo world. Thompson wrote that for many of them the ocean itself became Kalunga, the line between the living and the dead. Many enslaved people believed that at death their souls would cross the water home to Africa. In the Georgia Sea Islands, stories were told of Africans who flew or walked home across the sea."},
  beats:[
    {text:"Then came the slave ships. More than twelve million Africans were carried across the Atlantic in chains. For many, the ocean itself became Kalunga."},
    {text:"Many believed that when they died, their souls would cross the water home. Tap to light a candle for those who crossed.", lock:true, afterType(){ tapCount(5,'Light a candle',k=>{ const l=$('#lt'); if(l) l.innerHTML=Array.from({length:k},(_,i)=>candle(120+i*90,250+((i%2)*10),.8)).join(''); },k=>bell(330+k*30,.06,3)); }},
    {text:"Home, across the water. That hope, and that word, run through every door in the Americas."} ]},

/* ===== Zulu and Xhosa ===== */
{ key:'v_za', label:'Zulu and Xhosa', bg:'var(--teal)',
  view:()=>card('Door 4 · Zulu and Xhosa','Bringing them home',"The Zulu and Xhosa are the two largest peoples of South Africa. Many are Christian, and many also honour the ancestors: amadlozi in isiZulu, izinyanya in isiXhosa."),
  enter(){ mood('warm'); drumHit(); }, beats:[{text:null}] },

{ key:'za_ubuntu', label:'Ubuntu', bg:CLOTHBG, learn:'ubuntu',
  view:()=>PG(`${ground(320,'#9A7A4A')}<path d="M180 320 Q180 200 300 190 Q420 200 420 320Z" fill="${CLAY}" stroke="${K}" stroke-width="2.2"/><path d="M170 220 Q300 120 430 220Z" fill="#B89A5A" stroke="${K}" stroke-width="2.2"/><rect x="284" y="272" width="32" height="48" fill="#3A2A1E" stroke="${K}" stroke-width="2"/>${crowd([100,520],330,.8,{cols:[INDIGO,KOLA],hats:['wrap','cap']})}`,'A round house with a thatched roof, with people on either side.'),
  enter(){ mood('warm'); },
  guide:{title:'Umuntu ngumuntu ngabantu',text:"\"A person is a person through other people.\" This Nguni saying is the root of ubuntu, a word Archbishop Desmond Tutu helped make known around the world. In many Zulu and Xhosa homes the ancestors are part of those people: they are honoured at the umsamo, a special place at the back of the main house, spoken to, and told about the family's news."},
  beats:[
    {text:"There is a saying in isiZulu and isiXhosa: \"A person is a person through other people.\" It's called ubuntu."},
    {text:"The ancestors are still among those people. In many homes, they're honoured at the umsamo, a place at the back of the main house, and told the family's news."} ]},

{ key:'za_branch', label:'The branch', bg:'#6A5A44',
  view:()=>PG(`${ground(330,'#8A8070')}<rect x="380" y="140" width="180" height="190" fill="#D8DCE0" stroke="${K}" stroke-width="2"/><path d="M456 150 v40 M484 150 v40 M456 170 h28" stroke="${INDIGO}" stroke-width="7"/>${pp(220,330,.95,{col:INDIGO,hat:'cap',arms:'branch',skin:SKINS[2]})}`,'A man holding a leafy branch outside a hospital.'),
  enter(){ mood('night'); },
  guide:{title:'Umlahlankosi',text:"When someone dies far from home, in a hospital, a mine, an accident, many Zulu families send a relative to the place of death with a branch of the umlahlankosi, the buffalo-thorn tree. The relative speaks to the dead person, tells them it's time to come home, and carries the branch, with the spirit on it, all the way back. Many families do this even when they also hold a Christian funeral."},
  beats:[
    {text:"Sipho's grandfather died in a hospital in the city, far from home. The family believes his spirit is still there, at the place he died."},
    {text:"Sipho has to bring him home. What does he do?", lock:true, afterType(){ pick([{label:'Leave it. The spirit will find its own way',go:'x_branch'},{label:'Carry a branch from the buffalo-thorn, and talk to him all the way'}]); }} ]},

{ key:'za_road', label:'The branch', bg:CLOTHBG, learn:'branch',
  view:()=>PG(`${ground(330,'#9A7A4A')}<path d="M0 330 Q300 300 600 330" stroke="#B89A6A" stroke-width="20" fill="none"/><g id="walker">${pp(120,330,.9,{col:INDIGO,hat:'cap',arms:'branch',skin:SKINS[2]})}</g>`,'A man walks a long road home, holding the branch.',{bg:'dusk'}),
  enter(){ mood('warm'); },
  beats:[
    {text:"Sipho goes to the hospital with a branch of umlahlankosi, the buffalo-thorn. \"Grandfather, it's time. Come with me, we're going home.\""},
    {text:"Press and hold to carry him home, talking all the way.", lock:true, afterType(){ holdOn({label:'Carry him home',ms:5500,
      onProgress:p=>{ const w=$('#walker'); if(w) w.innerHTML=pp(120+p*360,330,.9,{col:INDIGO,hat:'cap',arms:'branch',skin:SKINS[2]}); }}); }},
    {text:"At the gate, he tells his grandfather they've arrived. The branch is laid where the family will remember him."} ]},

{ key:'za_buyisa', label:'Ukubuyisa', bg:CLOTHBG, learn:'buyisa',
  view:()=>PG(`${ground(320,'#9A7A4A')}<path d="M180 320 Q180 200 300 190 Q420 200 420 320Z" fill="${CLAY}" stroke="${K}" stroke-width="2.2"/><path d="M170 220 Q300 120 430 220Z" fill="#B89A5A" stroke="${K}" stroke-width="2.2"/><rect x="284" y="272" width="32" height="48" fill="#3A2A1E" stroke="${K}" stroke-width="2"/><circle cx="300" cy="250" r="90" fill="url(#glowA)" opacity=".6"/>${crowd([80,130,470,520],330,.7,{arms:'up'})}`,'Family gathered at the round house, celebrating.',{bg:'dusk'}),
  enter(){ mood('light','crowd'); },
  guide:{title:'Bringing home',text:"Some months to a year after a death, many Zulu families hold ukubuyisa, \"bringing back\": a ceremony with a feast, at which the dead person's spirit is welcomed home into the household as an ancestor. Xhosa families have similar rites. After it, the dead is no longer only someone the family lost, but someone who watches over them."},
  beats:[
    {text:"About a year later, the family gathers again for ukubuyisa, the bringing home. There's a feast, and the grandfather is welcomed back, this time as an ancestor."},
    {text:"He's no longer only someone they lost. Now he's someone who watches over them."} ]},

/* ===== Haitian Vodou ===== */
{ key:'v_vod', label:'Haitian Vodou', bg:'var(--teal)',
  view:()=>card('Door 5 · Haitian Vodou','Ginen, under the water',"Vodou grew in Haiti from the faiths of Fon, Kongo, Yoruba and other enslaved Africans, woven together with Catholicism. Few religions have been so slandered by outsiders."),
  enter(){ mood('night','sea'); drumHit(); }, beats:[{text:null}] },

{ key:'vod_water', label:'Under the water', bg:SEABG, learn:'ginen',
  view:()=>PG(`${sea(190)}<g id="soul"><circle cx="300" cy="320" r="16" fill="${COWRIE}" opacity=".85"/><circle cx="300" cy="320" r="40" fill="url(#glowA)"/></g>${crowd([140,460],190,.6,{cols:[COWRIE,COWRIE],hats:['veil','wrap']})}`,'A small light deep under the sea, with two people in white on the shore above.',{bg:'night'}),
  enter(){ mood('night','sea'); },
  guide:{title:'A year and a day',text:"In Vodou, a person has more than one soul. After death the gwo bonnanj, the \"big good angel\", goes anba dlo, beneath the waters. After a year and a day, the family may hold a ceremony to call it back up out of the water, so it can be honoured as an ancestor and help the living. Ginen, the place of the ancestors and the spirits, is Africa remembered, across or beneath the water. Maya Deren described these rites in Divine Horsemen (1953), and Karen McCarthy Brown in Mama Lola (1991)."},
  beats:[
    {text:"In Vodou, after death, part of the soul goes anba dlo: beneath the waters. It rests there for a year and a day."},
    {text:"Then the family calls it back up, so it can be honoured as an ancestor. Press and hold while they call.", lock:true, afterType(){ holdOn({label:'Call them up',ms:5000,
      onProgress:p=>{ const s=$('#soul'); if(s) s.innerHTML=`<circle cx="300" cy="${320-p*190}" r="16" fill="${COWRIE}" opacity=".85"/><circle cx="300" cy="${320-p*190}" r="${40+p*30}" fill="url(#glowA)"/>`; }}); }},
    {text:"Below the water lies Ginen: Africa, remembered. Home, and the place the spirits come from."} ]},

{ key:'vod_gede', label:'Fèt Gede', bg:'#2A1E34',
  view:()=>PG(`${ground(330,'#4A4038')}${cross(300,330,1.1)}${tomb(140,330,1)}${tomb(470,330,1.1)}${candle(260,330,.8)}${candle(340,330,.8)}${crowd([90,200,410,530],330,.7,{cols:[PURPLE,'#141414',PURPLE,'#141414'],hats:['wrap','top','wrap','none']})}`,'A cemetery at dusk with a tall black cross, candles, and people dressed in purple and black.',{bg:'dusk'}),
  enter(){ mood('night','crowd'); },
  guide:{title:'Gede, and the movies',text:"On November 1 and 2, Haitians crowd the cemeteries for Fèt Gede, the festival of the Gede, the spirits of the dead, led by Bawon Samdi and Manman Brigit. In many Haitian cemeteries, a tall cross marks Bawon's place. People wear purple and black, light candles, and laugh: the Gede are famous for rude jokes, and for protecting children and life itself. The Hollywood picture of \"voodoo\", zombies and pins in dolls, came largely from films like White Zombie (1932), made while the United States was occupying Haiti (1915 to 1934)."},
  beats:[
    {text:"Every November, Haitians crowd the cemeteries for Fèt Gede, the festival of the spirits of the dead. Purple and black, candles, and a lot of laughter."},
    {text:"But you've seen the films. What do you go with?", lock:true, afterType(){ pick([{label:'The movies: zombies and pins in dolls',go:'x_movies'},{label:'What Haitians themselves say and do'}]); }} ]},

{ key:'vod_gede2', label:'Fèt Gede', bg:'#2A1E34', learn:'gede',
  view:()=>PG(`${ground(330,'#4A4038')}${cross(300,330,1.1)}${tomb(140,330,1)}${tomb(470,330,1.1)}${candle(260,330,.8)}${candle(340,330,.8)}${candle(200,330,.7)}${candle(400,330,.7)}${crowd([90,200,410,530],330,.7,{cols:[PURPLE,'#141414',PURPLE,'#141414'],hats:['wrap','top','wrap','none'],arms:'up'})}`,'The cemetery full of candles and dancing people.',{bg:'dusk'}),
  enter(){ mood('warm','crowd'); },
  beats:[
    {text:"The Gede are spirits of death who are full of life: funny, rude, and fierce protectors of children. Families visit their own dead, clean the tombs and light candles."},
    {text:"Death, in Vodou, isn't the end of the family. It's the start of being an ancestor."} ]},

/* ===== Candomblé ===== */
{ key:'v_can', label:'Candomblé', bg:'var(--teal)',
  view:()=>card('Door 6 · Candomblé','The sisters of the Good Death',"Candomblé grew in Bahia, Brazil, from Yoruba, Fon and Bantu faiths carried by enslaved Africans. Its houses, called terreiros, honour the orixás and the ancestors."),
  enter(){ mood('warm'); drumHit(); }, beats:[{text:null}] },

{ key:'can_closed', label:'A closed door', bg:CLOTHBG,
  view:()=>PG(`${ground(330,'#B8A07A')}<rect x="140" y="130" width="320" height="200" fill="${COWRIE}" stroke="${K}" stroke-width="2.2"/><path d="M120 134 L300 70 L480 134Z" fill="#7A9A6A" stroke="${K}" stroke-width="2.2"/><rect x="270" y="240" width="60" height="90" fill="#5A4A3A" stroke="${K}" stroke-width="2"/>${crowd([90,520],330,.8,{cols:[COWRIE,COWRIE],hats:['veil','cap']})}`,'A white temple house with its door closed. People in white wait outside.'),
  enter(){ mood('night'); },
  guide:{title:'The axexê',text:"When an initiate of Candomblé dies, their terreiro performs the axexê, a series of rites over several days that releases the sacred bond made at initiation and sends the dead on their way. These rites are for initiates and are not shown to outsiders, and many practitioners ask that they not be described in detail. What can be said is that they exist, and that they matter deeply."},
  beats:[
    {text:"Dona Célia was a priestess of a terreiro in Salvador for forty years. When she dies, her house holds the axexê, the rites that send an initiate home."},
    {text:"You're a visiting writer, and you'd love to see it. What do you do?", lock:true, afterType(){ pick([{label:'Ask if you can film it',go:'x_film'},{label:'Respect that it\'s closed, and wait with the family'}]); }} ]},

{ key:'can_closed2', label:'A closed door', bg:CLOTHBG, learn:'closed',
  view:()=>PG(`${ground(330,'#B8A07A')}<rect x="140" y="130" width="320" height="200" fill="${COWRIE}" stroke="${K}" stroke-width="2.2"/><path d="M120 134 L300 70 L480 134Z" fill="#7A9A6A" stroke="${K}" stroke-width="2.2"/><rect x="270" y="240" width="60" height="90" fill="#5A4A3A" stroke="${K}" stroke-width="2"/>${crowd([90,160,520],330,.8,{cols:[COWRIE,INDIGO,COWRIE],hats:['veil','cap','wrap']})}`,'Outside the closed house, the visitor sits with the family.'),
  enter(){ mood('warm'); },
  beats:[
    {text:"You wait outside with her grandchildren. They tell you about her: her cooking, her temper, the people she healed."},
    {text:"Some doors in this book are open to everyone. Some are for initiates only. Both deserve the same respect."} ]},

{ key:'can_boa', label:'The Good Death', bg:'#3A2A30', learn:'goodDeath',
  view:()=>PG(`${ground(330,'#8A7A6A')}<rect x="40" y="120" width="140" height="210" fill="#E8E2D6" stroke="${K}" stroke-width="2"/><path d="M40 120 L110 80 L180 120Z" fill="#E8E2D6" stroke="${K}" stroke-width="2"/><g id="proc">${crowd([260,330,400,470],330,.75,{cols:['#141414',COWRIE,'#141414',COWRIE],hats:['veil','veil','veil','veil'],skin:SKINS[2]})}</g>`,'A procession of older women in white head cloths and black and white dress, beside a church.',{bg:'dusk'}),
  enter(){ mood('light'); },
  guide:{title:'Irmandade da Boa Morte',text:"In Cachoeira, Bahia, the Sisterhood of Our Lady of the Good Death was founded in the early 1800s by enslaved and freed African women. It is a Catholic lay sisterhood, and many of its members also keep Candomblé. In its early days it raised money to buy freedom for the enslaved and to give its members a dignified burial, at a time when many Black Brazilians were denied one. Each August its sisters, most of them older women, walk in procession through the town in black and white."},
  beats:[
    {text:"In the town of Cachoeira, there is a sisterhood founded two hundred years ago by enslaved and freed African women: the Sisters of the Good Death."},
    {text:"They pooled their money to buy people's freedom, and to make sure every sister got a proper funeral when the law gave Black Brazilians little else."},
    {text:"Every August, the sisters still walk through the town in black and white. A good death, for them, is a death in dignity, surrounded by your own."} ]},

/* ===== Lucumí ===== */
{ key:'v_luc', label:'Lucumí', bg:'var(--teal)',
  view:()=>card('Door 7 · Lucumí','The dead come first',"Lucumí, often called Santería, grew in Cuba from the faith of Yoruba people brought in slavery. Today it is practised in Cuba, the United States, and far beyond."),
  enter(){ mood('warm'); drumHit(); }, beats:[{text:null}] },

{ key:'luc_first', label:'The dead come first', bg:CLOTHBG,
  view:()=>PG(`${ground(330,'#9A7A5A')}${pp(300,330,1,{col:COWRIE,trim:INDIGO,hat:'cap',arms:'offer',skin:SKINS[3]})}${crowd([140,460],330,.75,{cols:[COWRIE,COWRIE],hats:['wrap','veil']})}`,'An elder in white about to begin, with others in white beside him.'),
  enter(){ mood('warm'); },
  guide:{title:'Ikú lobí òrìṣà',text:"A Lucumí saying: \"Ikú lobí òrìṣà\", the dead gave birth to the orishas. In Lucumí practice, egun, the ancestors, are honoured before the orishas at the start of a ceremony. Practitioners call on them by name, both their own blood ancestors and the elders of their religious house, and after each name of someone who has died they say \"ibaé\", a word of respect for the dead."},
  beats:[
    {text:"Before a Lucumí ceremony begins, before any orisha is called, the elder stops. Who comes first?", lock:true, afterType(){ pick([{label:'The orishas, of course',go:'x_first'},{label:'The dead'}]); }} ]},

{ key:'luc_names', label:'The dead come first', bg:CLOTHBG, learn:'egunFirst',
  view:()=>PG(`${ground(330,'#9A7A5A')}<circle cx="300" cy="180" r="120" fill="url(#glowA)" opacity=".5"/>${pp(300,330,1,{col:COWRIE,trim:INDIGO,hat:'cap',arms:'offer',skin:SKINS[3]})}${crowd([140,460],330,.75,{cols:[COWRIE,COWRIE],hats:['wrap','veil']})}`,'The elder speaks, and a soft light gathers.'),
  enter(){ mood('light'); },
  beats:[
    {text:"\"Ikú lobí òrìṣà\": the dead gave birth to the orishas. So the ancestors come first. The elder names them, and after each name, says \"ibaé\": rest, and respect."},
    {text:"Tap to hear the names.", lock:true, afterType(){ tapAll([
      [24,30,'A mother','His mother, who taught him to cook for the dead. Ibaé.'],
      [50,22,'A godmother','His godmother, who brought him into the religion. Ibaé.'],
      [76,30,'The first ones','And those whose names were lost on the ships, who no one alive can name. Ibaé.'] ]); }} ]},

{ key:'luc_boveda', label:'The white table', bg:'#2A2E44', learn:'boveda',
  view:()=>PG(`<rect x="0" y="0" width="600" height="400" fill="#3A3E54"/>${whiteTable(300,250,320)}${[200,236,272,308,344,380,416].map(x=>glass(x,250,.9)).join('')}${photo(180,210,1)}${photo(420,210,1,SKINS[2])}${flowers(300,200,1)}${candle(470,250,.8)}`,'A table with a white cloth, seven glasses of water, photographs, flowers and a candle.',{bg:'#3A3E54'}),
  enter(){ mood('night'); },
  guide:{title:'The bóveda',text:"Many Cuban families, Lucumí and not, keep a bóveda espiritual, a spiritual table from Cuban Espiritismo: a table with a white cloth, glasses of fresh water, photos of the dead, flowers and a candle. The water is changed often. It is a place to sit with the family's dead, pray for them, and ask their help."},
  beats:[
    {text:"In many Cuban homes there's a small table with a white cloth: glasses of fresh water, photos of the family's dead, flowers, a candle."},
    {text:"It's called a bóveda. It's where the living keep company with their dead, and keep the water fresh for them."} ]},

/* ===== New Orleans ===== */
{ key:'v_nola', label:'New Orleans', bg:'var(--teal)',
  view:()=>card('Door 8 · New Orleans','Cutting the body loose',"In New Orleans, Black benevolent societies and social aid and pleasure clubs have buried their members with brass bands since the 1800s. The tradition draws on West African procession and Black church faith."),
  enter(){ mood('warm'); horn(0); }, beats:[{text:null}] },

{ key:'nola_dirge', label:'The slow walk', bg:'#4A4A5A',
  view:()=>PG(`${ground(330,'#6A6A6A')}${tomb(520,330,1.2)}${crowd([110,190,270],330,.75,{cols:['#141414','#141414','#141414'],hats:['top','cap','cap'],arms:'horn'})}<rect x="330" y="290" width="110" height="34" fill="#3A2A1E" stroke="${K}" stroke-width="2"/>`,'A brass band in dark clothes walks slowly ahead of a coffin, towards a cemetery.',{bg:'#8A8EA0'}),
  enter(){ mood('drone'); },
  guide:{title:'A closer walk',text:"In a New Orleans jazz funeral, the band leads the family and the coffin from the church to the cemetery playing slow hymns and dirges, like \"Just a Closer Walk with Thee\". After the burial, or once the body is on its way, the band \"cuts the body loose\": the music turns joyful, \"When the Saints Go Marching In\" or \"Didn't He Ramble\", and the second line, everyone who follows the band, dances in the street with umbrellas and handkerchiefs."},
  beats:[
    {text:"The band walks slowly ahead of the coffin. Black suits, white gloves, and a hymn: \"Just a closer walk with thee.\""},
    {text:"At the cemetery, the body goes to rest. Now the band lifts its horns. What do they play on the way back?", lock:true, afterType(){ pick([{label:'The same slow hymn, all the way home',go:'x_dirge'},{label:'Something joyful. Cut the body loose'}]); }} ]},

{ key:'nola_second', label:'The second line', bg:CLOTHBG, learn:'cutLoose',
  view:()=>PG(`${ground(330,'#8A7A6A')}<g id="sl">${crowd([90,170,250,330,410,490],330,.7,{arms:['horn','brella','up','horn','brella','up'],hats:['top','wrap','cap','top','wrap','none']})}</g>`,'A street full of people dancing behind a brass band, with umbrellas held high.',{bg:'day'}),
  enter(){ mood('light','crowd'); horn(2); },
  beats:[
    {text:"\"When the Saints Go Marching In.\" The music bursts open, and everyone behind the band, the second line, starts to dance."},
    {text:"Dance with them.", lock:true, afterType(){ tapCount(6,'Step',k=>{ const s=$('#sl'); if(s) s.innerHTML=crowd([90,170,250,330,410,490].map((x,i)=>x+((i+k)%2?8:-8)),330,.7,{arms:['horn','brella','up','horn','brella','up'],hats:['top','wrap','cap','top','wrap','none']}); },horn); }},
    {text:"Mourn on the way there. Rejoice on the way back. The one who died has gone home."} ]},

{ key:'nola_home', label:'Homegoing', bg:NIGHTBG, learn:'homegoing',
  view:()=>PG(`${kalunga(240)}${crowd([180,300,420],240,.7,{cols:[COWRIE,INDIGO,KOLA],hats:['veil','cap','wrap']})}`,'People at the edge of shining water at evening.',{bg:'dusk'}),
  enter(){ mood('light','sea'); },
  guide:{title:'Homegoing',text:"In many Black churches in the United States, a funeral is called a homegoing, or a homegoing service: the one who died has gone home to God. It is a Christian word, but it carries a long memory. The Yoruba say heaven is home; for the BaKongo the dead go on below Kalunga; in Haiti they go to Ginen; enslaved people hoped to cross the water home. Many scholars hear all of that in the word."},
  beats:[
    {text:"In Black churches across America, a funeral has a special name: a homegoing."},
    {text:"Heaven is home, says the Yoruba proverb. Below the water, say the BaKongo. Ginen, say Haitians. Across the ocean, hoped the enslaved. And here, home to God."} ]},

{ key:'lastpage', label:'The last page', bg:NIGHTBG,
  view:()=>frame(sv(afCover(),'A figure in white stands at the shining water line at dusk.')),
  enter(){ mood('light'); },
  beats:[
    {text:"Eight doors: a market and a home, a red cloth and a blackened stool, a line of water, a buffalo-thorn branch, a year beneath the waters, a sisterhood of the Good Death, a white table, and a brass band."},
    {text:"Different maps, one promise: as long as someone says your name, you aren't gone. You're an ancestor, and you've gone home."} ]},

{ key:'end', label:'The end', bg:'var(--teal)',
  view:()=>`<div class="title-card" style="cursor:default"><span class="eyebrow">The end of the book</span><h1>The Homegoing</h1>
    <p>That was all eight doors: the Yoruba, the Akan, the BaKongo, the Zulu and Xhosa, Haitian Vodou, Candomblé, Lucumí, and the jazz funerals of New Orleans.</p><p id="endsum" style="font-weight:700"></p>
    <p class="draft">A first draft. Each door should be read by people of that tradition: Yoruba, Akan, Kongo, Zulu, Xhosa, Haitian, Candomblé, Lucumí and New Orleans readers. Sources include: John S. Mbiti, African Religions and Philosophy (1969); E. Bolaji Idowu, Olódùmarè: God in Yoruba Belief (1962); Wande Abimbola, Ifá: An Exposition of Ifá Literary Corpus (1976); Kwasi Wiredu and Kwame Gyekye on Akan thought; Kwame Arhin on Akan funerals; Robert Farris Thompson, Flash of the Spirit (1983); K. Kia Bunseki Fu-Kiau, African Cosmology of the Bântu-Kôngo (1980); Axel-Ivar Berglund, Zulu Thought-Patterns and Symbolism (1976); Maya Deren, Divine Horsemen (1953); Karen McCarthy Brown, Mama Lola (1991); J. Lorand Matory, Black Atlantic Religion (2005); Mattijs van de Port on Candomblé; David H. Brown, Santería Enthroned (2003); Helen Regis on New Orleans second lines.</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="again" type="button">Read it again</button><button class="btn alt" id="pathend" type="button">See your path</button><button class="btn alt" id="chend" type="button">Choose a chapter</button></div>
    <div class="endlinks"><a href="../walk/">Walk Eight Days with the Ancestors</a><a href="../../index.html#doors">Back to Many Doors</a></div></div>`,
  enter(){ mood('warm'); $('#again').onclick=e=>{ e.stopPropagation(); go(0); }; $('#chend').onclick=e=>{ e.stopPropagation(); openChapters(true); }; $('#pathend').onclick=e=>{ e.stopPropagation(); openPath(); };
    $('#endsum').textContent=`You learned ${journey.learned.size} of ${LESSONS.length} lessons and walked ${journey.visited.size} of ${DETOURS.length} wrong turns.`+(journey.learned.size===LESSONS.length?' You know the way.':' Read again to learn the rest.'); },
  beats:[{text:null,lock:true}] },

/* ===== wrong turns ===== */
{ key:'x_egun', label:'A wrong turn', bg:'#4A4440',
  view:()=>PG(`${ground(330,'#7A6A5A')}${egun(300,330,1)}${crowd([440,500,550],330,.6,{cols:['#5A5048','#5A5048','#5A5048']})}`,'The crowd goes silent as the visitor reaches for the cloth.',{bg:'#8A8070'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"Your hand is on the cloth when the crowd goes silent. Elders pull you back. To lift it would be a grave insult, and in many towns a serious offence."},
    {text:"The egúngún isn't a costume with a person inside. For the day, it is the ancestor. Rewind, and take the blessing.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_branch', label:'A wrong turn', bg:'#4A4440',
  view:()=>PG(`${ground(330,'#7A7A70')}<rect x="380" y="140" width="180" height="190" fill="#B8BCC0" stroke="${K}" stroke-width="2"/><circle cx="300" cy="230" r="20" fill="${COWRIE}" opacity=".3"/>`,'An empty street outside the hospital, with a faint light drifting alone.',{bg:'#8A8A90'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"No one goes. Many families believe a spirit left where it died can stay there, lost and restless, far from the people who should be looking after it."},
    {text:"The dead need the living to bring them home. Rewind, and carry the branch.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_movies', label:'A wrong turn', bg:'#3A3A44',
  view:()=>PG(`<rect x="100" y="70" width="400" height="230" fill="#D8D8D8" stroke="${K}" stroke-width="3"/><text x="300" y="200" text-anchor="middle" font-family="Jost,sans-serif" font-weight="800" font-size="40" fill="#3A3A3A">THE END?</text>${crowd([160,240,360,440],370,.5,{cols:['#3A3A3A','#3A3A3A','#3A3A3A','#3A3A3A']})}`,'A cinema screen in black and white.',{bg:'#2A2A30'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"The zombie films. The pins in dolls. Most of that was made up in Hollywood in the 1930s, while US troops occupied Haiti, and it was used to paint Haitians as dangerous and backward."},
    {text:"Real Vodou is a religion of family, healing, and the dead. Rewind, and go to the cemetery.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_film', label:'A wrong turn', bg:'#4A4440',
  view:()=>PG(`${ground(330,'#8A7A6A')}<rect x="140" y="130" width="320" height="200" fill="#C8C0B0" stroke="${K}" stroke-width="2.2"/><rect x="270" y="240" width="60" height="90" fill="#3A3028" stroke="${K}" stroke-width="2"/><rect x="480" y="250" width="40" height="28" fill="#2A2A2A" stroke="${K}" stroke-width="2"/>${pp(500,330,.8,{col:'#5A5A5A'})}`,'A visitor with a camera outside the closed house. The family has turned away.',{bg:'#9A9080'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"The family is too polite to say much. But you've asked to film the most private rite of their mother's life, and the door stays shut, and the welcome cools."},
    {text:"Some rites are for initiates only. The respectful thing is not to ask. Rewind, and wait with the family.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_first', label:'A wrong turn', bg:'#4A4440',
  view:()=>PG(`${ground(330,'#7A6A5A')}${pp(300,330,1,{col:'#C8C0B0',trim:'#8A8A8A',hat:'cap',skin:SKINS[3]})}`,'The elder waits, shaking his head gently.',{bg:'#8A8070'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"The elder smiles and shakes his head. In Lucumí, nothing starts without the dead. They are the roots; the orishas came after."},
    {text:"Rewind, and let the dead come first.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_dirge', label:'A wrong turn', bg:'#3A3A44',
  view:()=>PG(`${ground(330,'#5A5A5A')}${crowd([150,230,310,390],330,.75,{cols:['#2A2A2A','#2A2A2A','#2A2A2A','#2A2A2A'],hats:['top','cap','cap','top'],arms:'horn'})}`,'The band walks home slowly in grey light.',{bg:'#6A6E7A'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"The band plays the slow hymn all the way back. It's beautiful, and heavy, and nobody dances. It's a fine funeral, but not a New Orleans one."},
    {text:"Here, you mourn on the way to the grave and rejoice on the way back, because the one who died has gone home. Rewind, and cut the body loose.", lock:true, afterType(){ rewindButton(); }} ]}
];
