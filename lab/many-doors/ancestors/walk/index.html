<style>
/* Shared chrome for the Many Doors books. Each book overrides the tokens in its own :root block. Single deliberate light look, like the Bardo series. */
:root{
  color-scheme:light;

html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}

button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:2px solid var(--ink);background:var(--paper)}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.85rem}
.brand small{display:block;font-weight:500;letter-spacing:.04em;text-transform:none;color:var(--ink-soft);font-size:.78rem;font-family:var(--body)}
.bar .sp{flex:1}
.pill,.tog{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;text-decoration:none;min-height:36px;display:inline-flex;align-items:center}

.btn{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.03em;border:2px solid var(--ink);background:var(--accent);color:var(--paper);border-radius:999px;padding:11px 22px;min-height:48px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}

/* svg motion helpers */

<script>
/* Shared engine for the Many Doors books: sound, narration, the full-screen player and its interactions. */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------------- sound ---------------- */
const SND={ctx:null,m:null,nb:null,bb:null,on:store.get('md-sound')!=='0',loops:{},drone:null};
/* the drone: a quiet, slowly breathing tone on A under everything, so silence only happens on purpose. level(v,secs) fades it (0 = silent, 1 = normal). */
function makeDrone(c,dest,vol=.05){ const t=c.currentTime,g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+6); g.connect(dest);
  const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=650; lp.Q.value=.6; lp.connect(g);
  const sw=c.createOscillator(), sg=c.createGain(); sw.frequency.value=.045; sg.gain.value=260; sw.connect(sg).connect(lp.frequency); sw.start(t);
  const nodes=[sw]; [[55,'sine',.55,0],[110,'sawtooth',.16,-4],[110.3,'sawtooth',.12,3],[164.8,'sine',.12,0],[220,'sine',.1,2],[329.6,'sine',.035,-3]].forEach(([f,type,v,dt],i)=>{ const o=c.createOscillator(),og=c.createGain(); o.type=type; o.frequency.value=f; o.detune.value=dt; og.gain.value=v;
    const l=c.createOscillator(),lg=c.createGain(); l.frequency.value=.03+i*.017; lg.gain.value=v*.45; l.connect(lg).connect(og.gain); o.connect(og).connect(lp); o.start(t); l.start(t); nodes.push(o,l); });
  return {level(v,secs=2){ const n=c.currentTime; g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(Math.max(g.gain.value,.0001),n); g.gain.exponentialRampToValueAtTime(Math.max(vol*v,.0001),n+secs); },
    stop(){ this.level(0,1.5); setTimeout(()=>nodes.forEach(o=>{try{o.stop()}catch(e){}}),1700); }}; }

function aInit(){ if(SND.ctx){ if(SND.ctx.state!=='running') try{SND.ctx.resume()}catch(e){} return; }
  try{ SND.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  const c=SND.ctx; SND.m=c.createGain(); SND.m.gain.value=SND.on?.9:0; SND.m.connect(c.destination);
  const n=c.sampleRate*2; SND.nb=c.createBuffer(1,n,c.sampleRate); SND.bb=c.createBuffer(1,n,c.sampleRate);
  const w=SND.nb.getChannelData(0), b=SND.bb.getChannelData(0); let l=0;
  for(let i=0;i<n;i++){ const r=Math.random()*2-1; w[i]=r; l=(l+.02*r)/1.02; b[i]=l*3.5; }
  SND.drone=makeDrone(c,SND.m); }
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{ if(SND.ctx&&SND.ctx.state!=='running') try{SND.ctx.resume()}catch(e){} },{capture:true,passive:true}));
const T=()=>SND.ctx.currentTime;
function aEnv(g,t,p,a,d){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(p,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d); }
function tone(fr,{type='sine',peak=.12,a=.01,d=2,at=0}={}){ if(!SND.ctx) return; const c=SND.ctx,t=T()+at,o=c.createOscillator(); o.type=type; o.frequency.value=fr; const g=c.createGain(); aEnv(g,t,peak,a,d); o.connect(g).connect(SND.m); o.start(t); o.stop(t+a+d+.1); }
function nz({freq=1000,type='highpass',peak=.08,a=.003,d=.03,q=.7,brown=false}={}){ if(!SND.ctx) return; const c=SND.ctx,t=T(),s=c.createBufferSource(); s.buffer=brown?SND.bb:SND.nb; const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q; const g=c.createGain(); aEnv(g,t,peak,a,d); s.connect(f).connect(g).connect(SND.m); s.start(t,Math.random()); s.stop(t+a+d+.1); }
function loopOn(name,build,vol,fade=2){ if(!SND.ctx||SND.loops[name]) return; const g=SND.ctx.createGain(); g.gain.value=.0001; g.connect(SND.m); const nodes=build(g); g.gain.exponentialRampToValueAtTime(vol,T()+fade); SND.loops[name]={g,nodes}; }

function vScore(v){ let n=0; const nm=v.name.toLowerCase(); if(/natural|neural|premium|enhanced|siri/.test(nm)) n+=50; if(/online/.test(nm)) n+=20; if(/en-gb/i.test(v.lang)) n+=15; else if(/^en/i.test(v.lang)) n+=8; else n-=100;
  if(/daniel|arthur|george|ryan|thomas|oliver|guy|libby|sonia|serena|kate|martha|google uk english male/.test(nm)) n+=10;
  if(/compact|espeak|zarvox|trinoids|albert|bad news|bells|boing|bubbles|cellos|whisper|jester|organ|superstar|wobble|fred|junior|ralph/.test(nm)) n-=60; return n; }
function loadVoices(){ if(!('speechSynthesis' in window)) return; const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>vScore(b)-vScore(a)); if(!vs.length) return; VO.list=vs; const saved=store.get('md-voice'); const k=saved?vs.findIndex(v=>v.name===saved):0; VO.voice=vs[Math.max(k,0)]; }

}
function closePlayer(silent){ const s=PS; PS=null; hush(); if(SND.ctx) allOff(.8); cvStop(); if(s){ s.el.remove(); document.body.classList.remove('insession'); if(!silent&&s.onclose) s.onclose(); } }

/* press and hold the stage */
function hold(s,{label,ms=3000,ask:q,early,onP}){ alive(s); if(q) ask(q); return new Promise(res=>{ const l=layer(); l.innerHTML=`<button type="button" class="holdzone" aria-label="${esc(label)}"><span class="holdpill"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="rgba(30,42,43,.2)" stroke-width="4"/><circle id="hr" cx="20" cy="20" r="16" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="100.5" stroke-dashoffset="100.5" transform="rotate(-90 20 20)" stroke-linecap="round"/></svg>${esc(label)}</span></button>`;

/* ---------------- sitting: a minute with a breathing ring ---------------- */

    const end=()=>{ clearInterval(iv); l.innerHTML=''; res(); };
    l.querySelector('.ghost').onclick=end;
    iv=setInterval(()=>{ if(PS!==s){ clearInterval(iv); return res(); } const left=Math.max(0,secs-Math.floor((performance.now()-t0)/1000)); tEl.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`; if(left<=0){ if(SND.ctx) bowl(196,.12); end(); } },250); });
  cvStop(); alive(s); }

/* ---------------- svg helpers shared by the books ---------------- */
function rays(cx,cy,r,n,op=.2,col='#FFF6DE'){ let o=''; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2,a2=a+Math.PI/n*.6; o+=`<path d="M${cx} ${cy}L${cx+Math.cos(a)*r} ${cy+Math.sin(a)*r}L${cx+Math.cos(a2)*r} ${cy+Math.sin(a2)*r}Z" fill="${col}" opacity="${op}"/>`; } return o; }
function stars(n,seed=3,h=400,col='#FFF6DE'){ let s=seed,o=''; const r=()=>{ s=(s*9301+49297)%233280; return s/233280; }; for(let i=0;i<n;i++) o+=`<circle cx="${(r()*600).toFixed(1)}" cy="${(r()*h).toFixed(1)}" r="${(r()*1.6+.3).toFixed(2)}" fill="${col}" opacity="${(r()*.7+.2).toFixed(2)}"/>`; return o; }
function rnd(seed){ let s=seed; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
function header(B){ const h=$('#bar'); if(!h) return; h.innerHTML=`<span class="brand">${esc(B.brand)}<small>${esc(B.brandSub)}</small></span><span class="sp"></span>${(B.links||[]).filter(l=>l[1]).map(([t,u])=>`<a class="pill" href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join('')}`; }

/* The walk: one short daily practice per stage, with a map of stones. Each day: the book, what it means, a practice, a task for today, a minute of sitting. */
function stonePos(i,n){ const per=n<=10?n:n<=21?7:n<=42?7:7; const rows=Math.ceil(n/per); const r=Math.floor(i/per), c=i%per, cc=r%2?per-1-c:c;
  const W=600,H=400, dx=(W-120)/Math.max(per-1,1), dy=rows>1?(H-110)/(rows-1):0; return [60+cc*dx, (rows>1?55:200)+r*dy]; }
function walkMap(W,n,{label=true}={}){ const N=W.days.length; let d='',st=''; for(let i=0;i<N;i++){ const [x,y]=stonePos(i,N); d+=(i?'L':'M')+x+' '+y; }
  for(let i=0;i<N;i++){ const [x,y]=stonePos(i,N), P=W.parts[W.days[i].p], done=i<n, cur=i===n; const r=N>20?13:N>9?18:26;
    st+=`<g><circle cx="${x}" cy="${y}" r="${r}" fill="${done?P.col:'#26343A'}" stroke="${cur?W.gold||'#E8B13A':P.col}" stroke-width="${cur?4:2.5}"/>${label?`<text x="${x}" y="${y+4.5}" text-anchor="middle" font-size="${N>20?11:14}" font-weight="700" fill="${done?'#10181B':'#FFF6DE'}">${i+1}</text>`:''}${cur?`<circle cx="${x}" cy="${y}" r="${r+6}" fill="none" stroke="${W.gold||'#E8B13A'}" stroke-width="2" class="pulse"/>`:''}</g>`; }
  return `<rect width="600" height="400" fill="#10181B"/>${W.mapBg?W.mapBg():''}<path d="${d}" fill="none" stroke="rgba(255,246,222,.25)" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>${st}`; }
function walkLanding(W){
  const n=Math.min(+store.get(W.key+'-next')||0,W.days.length-1);
  $('#wrap').innerHTML=`<section class="hero"><div><span class="eyebrow">${esc(W.eyebrow)}</span><h1>${esc(W.title)}</h1><p class="lede">${esc(W.lede)}</p><p class="note">${esc(W.note)}</p>
    <div class="cta"><button type="button" class="btn gold" id="begin">${n?`Continue: ${W.unit} ${n+1}`:`Begin ${W.unit} 1`}</button>${n?`<button type="button" class="btn alt" id="restart">Start over</button>`:''}${W.manualUrl?`<a class="pill" href="${W.manualUrl}" target="_blank" rel="noopener">${esc(W.manualName)}</a>`:''}</div></div>
    <div class="cover"><svg viewBox="0 0 600 400" role="img" aria-label="Map of the ${W.days.length} ${W.unit.toLowerCase()}s">${walkMap(W,n)}</svg></div></section>
    <section class="sec"><h2>The ${W.parts.length>1?'stages':'path'}</h2><div class="cgrid">${W.parts.map((p,i)=>{ const first=W.days.findIndex(d=>d.p===i), last=W.days.length-1-[...W.days].reverse().findIndex(d=>d.p===i); return `<button type="button" class="ck" data-n="${first}" style="--c:${p.col}"><i></i><b>${esc(p.name)}</b><span>${W.unit}s ${first+1}${last>first?'–'+(last+1):''} · ${esc(p.sub)}</span></button>`; }).join('')}</div></section>
    <section class="sec how"><h2>Each ${W.unit.toLowerCase()}</h2>${[['The book',W.howBook||'What the tradition itself says, in plain words.'],['What it means','What it could mean for a living person.'],['A practice','A short interactive moment on the screen.'],['Today','One small thing to do before tomorrow.'],['Sit','A minute of quiet with a breathing ring.']].map(([a,b])=>`<div><b>${a}</b><p>${esc(b)}</p></div>`).join('')}</section>
    <details class="all"><summary>Read every ${W.unit.toLowerCase()} as text</summary>${W.days.map((d,i)=>`<h3>${W.unit} ${i+1}: ${esc(d.t)}</h3><p>${esc(d.book)}</p><p>${esc(d.mean)}</p><p><b>Today:</b> ${esc(d.try)}</p>`).join('')}</details>
    <section class="sec"><h2>Sources</h2><p class="sources">${W.sources}</p></section>`;
  $('#begin').onclick=()=>playWalk(W,n);
  const r=$('#restart'); if(r) r.onclick=()=>{ store.set(W.key+'-next','0'); playWalk(W,0); };
  document.querySelectorAll('.ck').forEach(b=>b.onclick=()=>playWalk(W,+b.dataset.n));
}
async function playWalk(W,n){
  const D=W.days[n], P=W.parts[D.p];
  const menu={label:W.unit+'s',build:()=>`<h3>Jump to a ${W.unit.toLowerCase()}</h3><ol>${W.days.map((d,i)=>`<li><button type="button" data-go="${i}" aria-current="${i===n}"><small>${i+1}</small>${esc(d.t)}</button></li>`).join('')}</ol>`,go:i=>playWalk(W,+i)};
  const s=openPlayer({title:D.t,sub:`${W.unit} ${n+1} of ${W.days.length}`,steps:['The book','Meaning','Practice','Today','Sit'],menu,color:P.col});
  s.onclose=()=>walkLanding(W);
  const bg=W.art(D,n,P);
  try{
    if(W.ambient) W.ambient(D,P);
    stepTo(0); art(bg,D.t); await say(s,D.book,{eye:`${P.name} · the book`});
    stepTo(1); await say(s,D.mean,{eye:'What it means'});
    stepTo(2); clearLayer(); eyebrow('Practice'); if(D.act) await D.act(s,D,P); else if(D.a) await runAct(s,D.a,P); else await hold(s,{label:'Press and hold',ms:3500,ask:'Press and hold while you let that sink in.'});
    alive(s); art(bg,D.t);
    stepTo(3); await say(s,D.try,{eye:'Today'});
    stepTo(4); await sit(s,{text:D.sit,col:P.col});
    alive(s); store.set(W.key+'-next',String(Math.min(n+1,W.days.length-1)));
    if(n===W.days.length-1){ if(W.finale) await W.finale(s); store.set(W.key+'-next','0'); closePlayer(); return; }
    art(walkMap(W,n+1),'Your path'); eyebrow(''); $('#pText').textContent=`${W.unit} ${n+1} done. ${W.unit} ${n+2}, “${W.days[n+1].t}”, is waiting.`; $('#pRow').innerHTML=`<button type="button" class="sgo alt" id="wDone">Close for today</button><button type="button" class="sgo" id="wNext">Go on to ${W.unit.toLowerCase()} ${n+2} →</button>`;
    $('#wDone').onclick=()=>closePlayer(); $('#wNext').onclick=()=>playWalk(W,n+1); $('#wNext').focus({preventScroll:true});
  }catch(e){ if(!(e instanceof Abort)) console.error(e); }
}

/* practice specs written as data: {k:'hold'|'still'|'release'|'count'|'choose', ...} */
async function runAct(s,a,P){
  const q=a.q;
  if(a.k==='hold') await hold(s,{label:a.label||'Press and hold',ms:a.ms||4000,ask:q,early:a.early||'Not yet. Hold again, slowly.'});
  else if(a.k==='still') await still(s,{ask:q,ms:a.ms||8000});
  else if(a.k==='release') await release(s,{ask:q,words:a.words});
  else if(a.k==='count') await count(s,{ask:q,n:a.n,label:a.label||'Tap',onTap:k=>{ if(SND.ctx) (a.sound==='bell'?bell(392+k*20,.07):plop()); }});
  else if(a.k==='choose'){ const i=await choose(s,q,a.opts,{right:a.right??-1,wrong:a.wrong}); if(a.replies&&a.replies[i]) await say(s,a.replies[i]); }
  if(a.after) await say(s,a.after);
}

/* The Homegoing: flat earth colours with a border of indigo cloth, after hand-dyed resist cloth. Indigo, ochre, terracotta,
   cowrie white, palm green and kola red. Kept plain and generic: no sacred signs (vèvè, adinkra, Ifá marks) are copied,
   and no spirits, orishas or lwa are drawn, only people, places and things. */
const K='#1A1410', INDIGO='#1E2A5A', DEEP='#121833', OCHRE='#D99A2B', TERRA='#B5532D', COWRIE='#F4EBDA', PALM='#3F7A4A', KOLA='#8E2B2B', CLAY='#C9A27A', PURPLE='#5A2A6A', SKY='#E7C58A';
const SKINS=['#6B4226','#8A5A3B','#4E2F1E','#7A4A2E'];
const AF_DEFS=`<defs><pattern id="afb" width="28" height="16" patternUnits="userSpaceOnUse"><rect width="28" height="16" fill="${INDIGO}"/><circle cx="7" cy="8" r="2.6" fill="${COWRIE}" opacity=".85"/><path d="M14 12 L18 4 L22 12" fill="none" stroke="${COWRIE}" stroke-width="1.6" opacity=".7"/></pattern>
<radialGradient id="glowA"><stop offset="0" stop-color="#FFF2CC"/><stop offset=".5" stop-color="${OCHRE}" stop-opacity=".45"/><stop offset="1" stop-color="${OCHRE}" stop-opacity="0"/></radialGradient>
<linearGradient id="nightA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B0F22"/><stop offset="1" stop-color="#26315E"/></linearGradient>
<linearGradient id="duskA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A2A5A"/><stop offset=".6" stop-color="${TERRA}"/><stop offset="1" stop-color="${OCHRE}"/></linearGradient>
<linearGradient id="seaA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E5A7A"/><stop offset="1" stop-color="#0E2236"/></linearGradient><clipPath id="afclip"><rect width="600" height="400"/></clipPath></defs>`;
function af(inner,{bg='day',border=true}={}){ const f=bg==='night'?'url(#nightA)':bg==='dusk'?'url(#duskA)':bg==='day'?SKY:bg==='sea'?'url(#seaA)':bg;
  return `${AF_DEFS}<g clip-path="url(#afclip)"><rect width="600" height="400" fill="${f}"/>${bg==='night'?stars(60,29,260,COWRIE):''}${inner}${border?`<rect width="600" height="16" fill="url(#afb)"/><rect y="384" width="600" height="16" fill="url(#afb)"/>`:''}</g>`; }
function ground(y=330,col='#B07A4A'){ return `<rect x="0" y="${y}" width="600" height="${400-y}" fill="${col}"/><path d="M0 ${y} H600" stroke="${K}" stroke-width="3"/>`; }
/* a person in a long robe or wrapper; hat: none, wrap (head-tie), cap (soft cap), top (top hat), veil (white head cloth) */
function pp(x,y,s=1,{col=TERRA,trim=OCHRE,hat='none',arms='down',skin=SKINS[0],op=1}={}){
  const ar={down:'',fold:`<path d="M-16 -62 Q0 -52 16 -62" stroke="${col}" stroke-width="12" fill="none" stroke-linecap="round"/>`,
    offer:`<path d="M-20 -70 Q-18 -48 0 -52 Q18 -48 20 -70" stroke="${col}" stroke-width="12" fill="none" stroke-linecap="round"/>`,
    up:`<path d="M-20 -76 L-34 -108 M20 -76 L34 -108" stroke="${col}" stroke-width="11" stroke-linecap="round"/>`,
    drum:`<path d="M-20 -74 Q-30 -56 -14 -50 M20 -74 Q34 -70 36 -90" stroke="${col}" stroke-width="11" fill="none" stroke-linecap="round"/>`,
    horn:`<path d="M-18 -74 Q-10 -60 6 -92 M18 -74 Q22 -88 10 -94" stroke="${col}" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M0 -96 L34 -108 L44 -122 V-90 L34 -100Z" fill="${OCHRE}" stroke="${K}" stroke-width="1.8"/>`,
    brella:`<path d="M20 -74 L30 -130" stroke="${col}" stroke-width="10" stroke-linecap="round"/><path d="M30 -130 V-150" stroke="${K}" stroke-width="2.5"/><path d="M-6 -150 Q30 -186 66 -150 Z" fill="${OCHRE}" stroke="${K}" stroke-width="2"/><path d="M-6 -150 Q12 -144 30 -150 Q48 -144 66 -150" fill="none" stroke="${TERRA}" stroke-width="3"/>`,
    branch:`<path d="M20 -74 Q34 -70 40 -96" stroke="${col}" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M40 -96 L56 -150 M48 -122 L66 -132 M52 -136 L40 -150" stroke="#5A4026" stroke-width="3.5" stroke-linecap="round"/>${[[66,-134],[40,-152],[58,-152],[46,-124]].map(([a,b])=>`<ellipse cx="${a}" cy="${b}" rx="6" ry="3.5" fill="${PALM}"/>`).join('')}`}[arms]||'';
  const h={none:`<path d="M-15 -110 Q0 -126 15 -110 Q0 -116 -15 -110Z" fill="#1A1410"/>`,
    wrap:`<path d="M-19 -108 Q-24 -136 0 -138 Q26 -138 20 -108 Q0 -116 -19 -108Z" fill="${trim}" stroke="${K}" stroke-width="1.8"/><path d="M14 -134 Q30 -142 26 -124" fill="${trim}" stroke="${K}" stroke-width="1.6"/>`,
    cap:`<path d="M-16 -108 Q-14 -130 4 -128 Q20 -126 18 -110Z" fill="${trim}" stroke="${K}" stroke-width="1.8"/>`,
    top:`<rect x="-14" y="-146" width="28" height="30" fill="#141414" stroke="${K}" stroke-width="1.5"/><rect x="-22" y="-118" width="44" height="6" rx="2" fill="#141414"/>`,
    veil:`<path d="M-20 -104 Q-22 -132 0 -134 Q22 -132 20 -104 L22 -80 L-22 -80Z" fill="${COWRIE}" stroke="${K}" stroke-width="1.6"/>`}[hat]||'';
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${op}"><path d="M-26 0 L-20 -84 Q0 -94 20 -84 L26 0Z" fill="${col}" stroke="${K}" stroke-width="2.2"/><path d="M-24 -16 H24 M-22 -40 H22" stroke="${trim}" stroke-width="3.5"/>${ar}${hat==='veil'?h:''}<circle cx="0" cy="-104" r="15" fill="${skin}" stroke="${K}" stroke-width="2.2"/>${hat==='veil'?'':h}</g>`; }
/* a crowd of mourners or dancers */
function crowd(xs,y,s,{cols=[TERRA,INDIGO,PALM,KOLA],hats=['wrap','cap','none','wrap'],arms='down',op=1}={}){ return xs.map((x,i)=>pp(x,y,s,{col:cols[i%cols.length],hat:hats[i%hats.length],arms:Array.isArray(arms)?arms[i%arms.length]:arms,skin:SKINS[i%4],trim:i%2?OCHRE:COWRIE,op})).join(''); }
/* a big shade tree, like an iroko or a baobab */
function bigtree(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-22 0 Q-14 -60 -18 -120 H18 Q14 -60 22 0Z" fill="#6A4A2E" stroke="${K}" stroke-width="2.2"/><path d="M-16 -110 Q-50 -130 -70 -150 M16 -110 Q50 -132 72 -150 M0 -118 V-170" stroke="#6A4A2E" stroke-width="9" fill="none" stroke-linecap="round"/>${[[-70,-162,40],[72,-164,42],[0,-186,48],[-34,-180,34],[38,-184,36]].map(([a,b,r],i)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="${i%2?PALM:'#356A3E'}" stroke="${K}" stroke-width="1.8"/>`).join('')}</g>`; }
function palm(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-5 0 Q-2 -60 6 -120 H12 Q4 -60 5 0Z" fill="#7A5A3A" stroke="${K}" stroke-width="1.8"/>${[-150,-120,-60,-30,-95].map(a=>{ const r=a*Math.PI/180; return `<path d="M9 -120 Q${9+Math.cos(r)*40} ${-140+Math.sin(r)*10} ${9+Math.cos(r)*62} ${-120+Math.sin(r)*-30+30}" stroke="${PALM}" stroke-width="7" fill="none" stroke-linecap="round"/>`; }).join('')}</g>`; }
/* a compound house with a mud wall and a pitched roof */
function house(x,y,s=1,{roof='#7A5A3A',wall=CLAY}={}){ return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-70" y="-80" width="140" height="80" fill="${wall}" stroke="${K}" stroke-width="2.2"/><path d="M-84 -78 L0 -132 L84 -78Z" fill="${roof}" stroke="${K}" stroke-width="2.2"/><rect x="-16" y="-50" width="32" height="50" fill="#3A2A1E" stroke="${K}" stroke-width="2"/><path d="M-70 -24 H70" stroke="${TERRA}" stroke-width="5" opacity=".6"/></g>`; }
/* a masquerade of layered cloth panels: no face is shown, nobody is inside to see */
function egun(x,y,s=1,{sway=0}={}){ const P=[KOLA,INDIGO,OCHRE,PALM,TERRA,PURPLE,COWRIE];
  return `<g transform="translate(${x} ${y}) scale(${s}) rotate(${sway})">${[0,1,2,3,4,5].map(i=>{ const top=-170+i*26, w=30+i*12; return `<path d="M${-w} ${top+40} L${-w*.55} ${top} H${w*.55} L${w} ${top+40}Z" fill="${P[i%P.length]}" stroke="${K}" stroke-width="2"/>${Array.from({length:6},(_,j)=>`<path d="M${-w+8+j*(2*w-16)/5} ${top+40} v8" stroke="${COWRIE}" stroke-width="2"/>`).join('')}`; }).join('')}<path d="M-18 -170 Q0 -206 18 -170Z" fill="${KOLA}" stroke="${K}" stroke-width="2"/><rect x="-14" y="-168" width="28" height="18" fill="#2A2018" stroke="${K}" stroke-width="1.5"/><path d="M-12 -164 H12 M-12 -159 H12 M-12 -154 H12" stroke="#6A5A4A" stroke-width="1"/></g>`; }
/* an hourglass talking drum */

/* a carved stool */

function grave(x,y,s=1,{things=true}={}){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-70 0 Q0 -36 70 0Z" fill="#8A6A44" stroke="${K}" stroke-width="2"/>${things?`<ellipse cx="-36" cy="-12" rx="14" ry="5" fill="${COWRIE}" stroke="${K}" stroke-width="1.6"/><path d="M-6 -20 h14 l-2 14 h-10z" fill="${INDIGO}" stroke="${K}" stroke-width="1.6"/><path d="M30 -16 q6 -14 12 0" fill="none" stroke="${COWRIE}" stroke-width="3"/><circle cx="20" cy="-6" r="4" fill="#7ABAC8" stroke="${K}" stroke-width="1.2"/>`:''}</g>`; }

function glass(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-10 -34 H10 L8 0 H-8Z" fill="#CFE6EE" stroke="${K}" stroke-width="1.6" opacity=".9"/><path d="M-9 -22 H9" stroke="#7ABAC8" stroke-width="2"/></g>`; }
function whiteTable(x,y,w=300){ return `<path d="M${x-w/2} ${y} H${x+w/2} L${x+w/2-10} ${y+70} H${x-w/2+10}Z" fill="${COWRIE}" stroke="${K}" stroke-width="2"/><path d="M${x-w/2} ${y} H${x+w/2}" stroke="${K}" stroke-width="3"/>`; }
function photo(x,y,s=1,skin=SKINS[1]){ return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-16" y="-44" width="32" height="40" fill="#E8DCC4" stroke="${K}" stroke-width="2"/><circle cy="-30" r="7" fill="${skin}"/><path d="M-10 -8 Q0 -22 10 -8Z" fill="${INDIGO}"/></g>`; }
function flowers(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 V-30 M-8 0 L-12 -24 M8 0 L12 -26" stroke="${PALM}" stroke-width="2.5"/>${[[0,-34],[-13,-28],[13,-30]].map(([a,b],i)=>`<circle cx="${a}" cy="${b}" r="7" fill="${[COWRIE,OCHRE,'#E89AB0'][i]}" stroke="${K}" stroke-width="1.4"/>`).join('')}</g>`; }
function market(){ return [80,230,380,530].map((x,i)=>`<g><path d="M${x-60} 250 L${x} 214 L${x+60} 250Z" fill="${[OCHRE,INDIGO,TERRA,PALM][i]}" stroke="${K}" stroke-width="2"/><path d="M${x-50} 250 V300 M${x+50} 250 V300" stroke="#6A4A2E" stroke-width="5"/><rect x="${x-56}" y="296" width="112" height="14" fill="#8A6A44" stroke="${K}" stroke-width="1.8"/>${[0,1,2].map(j=>`<circle cx="${x-30+j*30}" cy="290" r="9" fill="${[KOLA,OCHRE,PALM][(i+j)%3]}" stroke="${K}" stroke-width="1.4"/>`).join('')}</g>`).join(''); }
/* a bird looking back over its shoulder: going back for what was left behind */
function bird(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-40 0 Q-10 -36 30 -20 Q40 -4 20 6 Q-10 14 -40 0Z" fill="${INDIGO}" stroke="${K}" stroke-width="2"/><path d="M-40 0 L-66 -14 L-62 8Z" fill="${INDIGO}" stroke="${K}" stroke-width="2"/><path d="M-6 -14 Q10 -22 22 -12" stroke="${COWRIE}" stroke-width="2" fill="none"/><path d="M24 -18 Q20 -48 -6 -46" stroke="${INDIGO}" stroke-width="12" fill="none" stroke-linecap="round"/><circle cx="-10" cy="-48" r="14" fill="${INDIGO}" stroke="${K}" stroke-width="2"/><circle cx="-14" cy="-50" r="2.6" fill="${COWRIE}"/><path d="M-22 -46 L-34 -42 L-22 -40Z" fill="${OCHRE}" stroke="${K}" stroke-width="1.2"/><circle cx="-30" cy="-30" r="6" fill="${COWRIE}" stroke="${K}" stroke-width="1.4"/><path d="M0 8 V22 M10 6 V22" stroke="${K}" stroke-width="2.5"/></g>`; }
function cowries(x,y,n=5){ return Array.from({length:n},(_,i)=>`<ellipse cx="${x+i*22}" cy="${y+(i%2)*6}" rx="8" ry="5" fill="${COWRIE}" stroke="${K}" stroke-width="1.4"/><path d="M${x+i*22-5} ${y+(i%2)*6} H${x+i*22+5}" stroke="${K}" stroke-width="1"/>`).join(''); }
function lineage(n){ return Array.from({length:n},(_,i)=>pp(80+i*(440/Math.max(n-1,1)),300,.55+i*.03,{col:[INDIGO,TERRA,PALM,KOLA,OCHRE][i%5],hat:['wrap','cap','none'][i%3],skin:SKINS[i%4],op:.35+i*.65/n})).join(''); }
function afCover(){ return af(`<circle cx="300" cy="150" r="120" fill="url(#glowA)"/>${kalunga(250)}${pp(300,250,.9,{col:COWRIE,trim:INDIGO,hat:'veil',skin:SKINS[2]})}<path d="M300 140 Q300 60 300 40" stroke="${COWRIE}" stroke-width="1.5" stroke-dasharray="3 6" opacity=".6"/>`,{bg:'dusk'}); }

/* Eight Days with the Ancestors: one day with each door of The Homegoing. This walk doesn't teach any of these traditions'
   rites, which belong to their own people and, often, to initiates. Each day takes one thing they have shared publicly about
   the dead, and one small thing anyone can do with it. */
const AF_WSC=[
 n=>af([`${ground(310)}${bigtree(300,310,1)}${lineage(6)}`,`${ground(310)}${market()}${crowd([150,300,450],330,.6)}`,`${ground(320)}${bird(300,290,1.1)}`,`${ground(320,'#9A7A4A')}<path d="M180 320 Q180 200 300 190 Q420 200 420 320Z" fill="${CLAY}" stroke="${K}" stroke-width="2.2"/><path d="M170 220 Q300 120 430 220Z" fill="#B89A5A" stroke="${K}" stroke-width="2.2"/>${crowd([100,520],330,.8)}`][n],{bg:n===2?'dusk':'day'}),
 n=>af([`${sea(230)}${[0,1,2,3,4].map(i=>candle(120+i*90,250+(i%2)*10,.8)).join('')}`,`${ground(330,'#4A4038')}${cross(300,330,1.1)}${tomb(140,330,1)}${tomb(470,330,1.1)}${candle(260,330,.8)}${candle(340,330,.8)}`,`${whiteTable(300,250,320)}${[200,236,272,308,344,380,416].map(x=>glass(x,250,.9)).join('')}${photo(180,210,1)}${flowers(300,200,1)}${candle(470,250,.8)}`,`${ground(330,'#8A7A6A')}${crowd([90,170,250,330,410,490],330,.7,{arms:['horn','brella','up','horn','brella','up'],hats:['top','wrap','cap','top','wrap','none']})}`][n-4],{bg:n===4?'night':n===5?'dusk':n===6?'#3A3E54':'day'})];
const WALK={key:'af-eight',brand:'Eight Days with the Ancestors',brandSub:'After The Homegoing',title:'Eight Days with the Ancestors',eyebrow:'A daily walk · 8 days',unit:'Day',gold:OCHRE,
 lede:'In much of Africa and its diaspora, the dead become ancestors who are remembered, named and honoured. Spend eight days with eight traditions, from Nigeria to New Orleans, and take one lesson from each about keeping your own dead close.',
 note:'Each day takes about five minutes. This walk doesn\'t teach any tradition\'s rites, which belong to its own people and often to initiates. What you get here is what they have shared publicly, and something small to do in your own life.',
 manualUrl:'../book/',manualName:'The Homegoing',
 howBook:'What a tradition has shared about the dead, in plain words.',
 sources:'John S. Mbiti, African Religions and Philosophy (1969); E. Bolaji Idowu, Olódùmarè: God in Yoruba Belief (1962); Kwame Gyekye, An Essay on African Philosophical Thought (1987); Robert Farris Thompson, Flash of the Spirit (1983); Axel-Ivar Berglund, Zulu Thought-Patterns and Symbolism (1976); Karen McCarthy Brown, Mama Lola (1991); David H. Brown, Santería Enthroned (2003); Helen Regis, "Second Lines, Minstrelsy, and the Contested Landscapes of New Orleans Afro-Creole Festivals" (1999).',
 parts:[{name:'Africa',sub:'Yoruba, Akan, Zulu and Xhosa',col:TERRA},{name:'The Americas',sub:'Across the water to New Orleans',col:INDIGO}],
 art:(D,n,P)=>AF_WSC[D.p](n),
 mapBg:()=>`<rect width="600" height="400" fill="${DEEP}"/>`,
 ambient:(D,P)=>{ if(SND.ctx){ pad('pad',[[110,165,220],[98,147,196]][D.p],.03); if(D.p===1) waterLoop(); } },
 finale:async s=>{ art(afCover()); if(SND.ctx) chime();
   await say(s,'Eight days. Say their names. Do your business well, then go home. Go back for what you forgot. Be a person through other people. Remember those who crossed. Learn from the people, not the movies. Let the dead come first. Mourn on the way there, rejoice on the way back.',{eye:'The end of the walk'});
   await say(s,'As long as someone says your name, you aren\'t gone. Say one more name tonight.'); },
 days:[
 {p:0,t:'Say Their Names',book:'The Kenyan scholar John Mbiti called the recently dead "the living-dead". In many African traditions they stay part of the family for as long as someone alive remembers them by name. When the last person who knew them dies, they pass into the great company of the ancestors.',
  mean:'Saying a name keeps someone among the living a little longer. Most of us can name fewer of our great-grandparents than we think.',
  try:'Write down every ancestor\'s name you know, going back as far as you can. Ask a relative for one you\'re missing.',sit:'Breathe in a name. Breathe it out, gently.',a:{k:'count',n:4,label:'Say a name',sound:'bell',q:'Say four names: a parent, a grandparent, a great-grandparent, and someone you never met.'}},
 {p:0,t:'The Market and the Home',book:'A Yoruba saying: "The world is a market; heaven is home." You come to the market for a while. You trade, talk, laugh, and do your business as well as you can. In the evening, you go home. A good life fulfils the destiny, the orí, you chose before birth.',
  mean:'Life is a visit, not the whole story. That makes the business of the day matter, and the evening less frightening.',
  try:'Do one piece of business you\'ve been putting off: a call, an apology, a thank-you. Then rest.',sit:'Breathe in the busy market. Breathe out, walking home.',a:{k:'choose',q:'What does the proverb say life is?',opts:['A prison','A trip to market'],right:1,wrong:'Not to the Yoruba. Choose again.',after:'A trip to market. Do your business well, and then go home.'}},
 {p:0,t:'Go Back and Get It',book:'Sankofa is an Akan word from Ghana: "go back and get it." A proverb says it is not wrong to go back for what you have forgotten. It\'s pictured as a bird walking forward with its head turned back. Many people of African descent in the Americas have made it their own sign.',
  mean:'Moving forward doesn\'t mean leaving your dead behind. Going back for their stories is part of going on.',
  try:'Ask an elder for a story about someone in your family you never met. Write it down.',sit:'Breathe in, looking back. Breathe out, walking on.',a:{k:'hold',ms:4500,label:'Look back',q:'Press and hold, and look back over your shoulder at where you came from.'}},
 {p:0,t:'A Person Through People',book:'"Umuntu ngumuntu ngabantu": a person is a person through other people. This Zulu and Xhosa saying is the root of ubuntu. The ancestors, amadlozi and izinyanya, are still among those people, and when someone dies far away, a relative may carry their spirit home on a branch of the buffalo-thorn tree.',
  mean:'You were made by other people, living and dead. Nobody is a person alone.',
  try:'Tell one person today how they helped make you who you are.',sit:'Breathe in everyone who made you. Breathe out thanks.',a:{k:'choose',q:'A person is a person through...',opts:['Their own effort alone','Other people'],right:1,wrong:'Ubuntu says otherwise. Choose again.'}},
 {p:1,t:'The Line of Water',book:'For the BaKongo of Central Africa, a line of water, Kalunga, divides the living from the dead. For many of the more than twelve million Africans carried across the Atlantic in slave ships, the ocean itself became Kalunga, and many hoped death would carry them home across it.',
  mean:'Some of the dead were never mourned properly, and their names were taken. Remembering them is a kind of homegoing.',
  try:'Learn about one place where enslaved Africans are buried or remembered, like the African Burial Ground in New York, and the people found there.',sit:'Breathe in like a wave coming in. Breathe out like it going home.',a:{k:'still',ms:8000,q:'A moment of quiet for those who crossed. Stay still.'}},
 {p:1,t:'Not the Movies',book:'Haitian Vodou says that after death part of the soul goes beneath the waters, and after a year and a day the family calls it back up as an ancestor. Every November, at Fèt Gede, Haitians crowd the cemeteries. The zombies and voodoo dolls of film were largely invented in Hollywood in the 1930s, while the US occupied Haiti.',
  mean:'Whole peoples\' ways of honouring their dead have been turned into horror stories. Learning from the people themselves is a way of setting it right.',
  try:'Read something by a Haitian writer, like Edwidge Danticat, in their own words.',sit:'Breathe in. Breathe out, letting a false picture go.',a:{k:'choose',q:'Where should you learn about Vodou?',opts:['From horror films','From Haitians themselves'],right:1,wrong:'Those films were made to frighten, not to inform. Choose again.'}},
 {p:1,t:'The Dead Come First',book:'In Cuban Lucumí they say "Ikú lobí òrìṣà": the dead gave birth to the orishas. So at the start of a ceremony, the ancestors are named first. Many Cuban homes also keep a bóveda: a white table with fresh water, flowers and photos of the family\'s dead. In Brazil, some Candomblé rites for the dead are for initiates only, and stay closed.',
  mean:'The people who came before you are your roots. It\'s good to remember them before you celebrate anything.',
  try:'At your next meal with family or friends, take a moment first to remember someone who isn\'t there.',sit:'Breathe in for those who came before. Breathe out for those who\'ll come after.',a:{k:'hold',ms:4000,label:'Remember',q:'Before anything else, press and hold, and remember who came before you.'}},
 {p:1,t:'Cut the Body Loose',book:'In a New Orleans jazz funeral, the brass band walks the coffin slowly to the cemetery, playing hymns. Then, on the way back, it "cuts the body loose": the music turns joyful, and the second line dances in the street with umbrellas and handkerchiefs. In Black churches across America, a funeral is called a homegoing.',
  mean:'Grief and joy can share the same day. You mourn on the way there, and rejoice on the way back, because they\'ve gone home.',
  try:'Choose two songs for your own funeral: one slow, for the walk there, and one joyful, for the walk back. Tell someone.',sit:'Breathe in slowly, like a hymn. Breathe out like a horn.',a:{k:'choose',q:'The coffin is laid to rest. What does the band play on the way back?',opts:['The same slow hymn','Something joyful'],right:1,wrong:'That\'s for the walk there. Choose again.',after:'"When the Saints Go Marching In." They\'ve gone home.'}}
 ]};
header({brand:WALK.brand,brandSub:WALK.brandSub,links:[['Many Doors','../../../many-doors/'],[WALK.manualName,WALK.manualUrl]]});
walkLanding(WALK);
