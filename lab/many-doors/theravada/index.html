<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>window.MD_HOME='../index.html#doors'</script>
<title>The Last Thought</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chonburi&family=Jost:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one full-screen "flight" — a thin instrument bar on top, the scene card in the middle, the narrator's caption card below it. Single deliberate look: the safety-card palette. */
:root{
  color-scheme: light;
  --cream:#F6EBD2; --parchment:#FBF3DF; --ink:#1E2A2B; --ink-soft:#44524F;
  --teal:#1F5E63; --teal-deep:#123D40; --brown:#8A4B22; --lamp:#F2B640;
  --red:#B8352A; --ok:#2F6B2B;
  --scene-bg: var(--cream);
  --display:'Jost', 'Futura', 'Century Gothic', sans-serif;
  --body:'Atkinson Hyperlegible', 'Verdana', sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;background:var(--scene-bg);transition:background-color 2.2s ease}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--ink);background:var(--parchment);transition:opacity 1.5s,filter 1.5s}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:.8rem;text-transform:uppercase}
#stageLabel{font-family:var(--display);font-weight:500;font-size:.85rem;color:var(--ink-soft);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stageLabel b{color:var(--brown);font-weight:700;margin-right:8px;font-variant-numeric:tabular-nums}
.tog{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:36px}
.tog[aria-pressed="false"]{background:transparent;color:var(--ink-soft);border-style:dashed}
.pick{font-family:var(--body);font-size:.8rem;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:8px;padding:6px 8px;min-height:36px;max-width:190px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pick:focus-visible,.tog:focus-visible,.btn:focus-visible,.spot:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
#stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:18px;padding-block:18px;padding-inline:16px;cursor:pointer;user-select:none}
#visual{width:100%;display:flex;justify-content:center;flex:none}
.frame{position:relative;width:min(100%, calc((100dvh - 380px) * 1.5), 980px);min-width:min(100%,300px);aspect-ratio:3/2;max-width:100%;border-radius:18px;overflow:hidden;transition:filter 3s ease, transform 3s ease}
.frame>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:filter 3s ease}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.caption{flex:none;max-width:720px;width:100%;box-sizing:border-box;background:var(--parchment);border:2px solid var(--ink);border-radius:6px;padding:16px 20px;min-height:4.6em;transition:opacity .8s, filter 1.5s, transform 1.5s, border-color 1.5s}
.caption p{margin:0;font-size:clamp(1.02rem, 2.3vw, 1.3rem);line-height:1.45;text-wrap:pretty}
.caption.quiet{background:transparent;border-color:transparent;text-align:center}
.caption.dark{background:#141413;color:var(--parchment);border-color:#141413}
.caption[hidden]{display:none!important}
#hint{margin:0;font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);opacity:0;transition:opacity .6s;min-height:1em}
#hint.on{opacity:.8;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
#choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.04em;border:2px solid var(--ink);background:var(--teal);color:var(--parchment);border-radius:999px;padding:12px 22px;cursor:pointer;min-height:48px}
.btn.alt{background:var(--parchment);color:var(--ink)}

/* dissolution: the manual's chrome comes apart; the narration always stays sharp */
body.d1 .bar{opacity:.85}
body.d2 .bar{filter:blur(.6px);opacity:.6}
body.d2 .frame{border-radius:28px}
body.d3 .bar{filter:blur(1.5px);opacity:.3}
body.d3 .frame{border-radius:40px}
body.void .bar,body.void #hint{opacity:0!important}

/* title */
.title-card{width:min(100%,640px);background:var(--teal);color:var(--parchment);border:2px solid var(--ink);border-radius:18px;padding:36px 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;align-items:flex-start;cursor:default}
.title-card .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:.75rem;color:var(--lamp);text-transform:uppercase}
.title-card h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1;text-wrap:balance;text-transform:uppercase;letter-spacing:.02em}
.title-card p{margin:0;font-size:1.05rem;line-height:1.5;max-width:46ch}
.title-card ol{margin:4px 0 8px;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;font-size:.98rem}
.title-card .btn{background:var(--lamp);color:var(--ink)}

/* hotspots */
.spot{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:3px solid #FFF3D6;background:rgba(242,182,64,.35);cursor:pointer;padding:0}
.spot::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid #FFF3D6;animation:ping 1.8s ease-out infinite}
.spot.done{opacity:0;pointer-events:none;transition:opacity .6s}
@keyframes ping{from{transform:scale(.7);opacity:.9}to{transform:scale(1.4);opacity:0}}
.heartglow{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(var(--s,0.4));background:radial-gradient(circle,#FFFBEA 0%,rgba(255,221,120,.85) 35%,rgba(255,200,80,0) 70%);transition:transform 1.2s ease;pointer-events:none}

/* breath ring */
.breath{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.6);border-radius:50%;border:4px solid var(--parchment);box-shadow:0 0 0 12px rgba(251,243,223,.15);transition:transform 1s ease-in-out, opacity 1s}

/* svg scenes */
.svgscene{position:absolute;inset:0;width:100%;height:100%}
.flicker{transform-origin:300px 262px;animation:flick 1.3s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1) skewX(0)}30%{transform:scaleY(.9) skewX(3deg)}60%{transform:scaleY(1.06) skewX(-2deg)}}
.orb-down{animation:down 7s ease-in-out forwards}
.orb-up{animation:up 7s ease-in-out forwards}
@keyframes down{to{transform:translateY(91px)}}
@keyframes up{to{transform:translateY(-55px)}}
.dots{stroke-dasharray:2 7;stroke-linecap:round}

/* guide entry */
.guide{position:absolute;inset:0;background:var(--parchment);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;gap:4%;padding:5%;box-sizing:border-box}
.guide .tag,.doorsteps .tag{display:inline-block;font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:clamp(.55rem,1.4vw,.75rem);background:var(--teal);color:var(--parchment);padding:5px 10px;border-radius:4px;text-transform:uppercase}
.guide h2{margin:10px 0 8px;font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,3.4vw,2.2rem);line-height:1.05;text-transform:uppercase;color:var(--brown);text-wrap:balance}
.guide p{margin:0;font-size:clamp(.85rem,1.8vw,1.15rem);line-height:1.45}
.guide .fig{height:100%;display:flex;align-items:center;justify-content:center;background:var(--teal);border-radius:12px;min-height:0}
.frame.guideframe{aspect-ratio:auto;width:min(100%,860px)}
.frame.guideframe .guide{position:relative;inset:auto;padding:24px;gap:24px}
.guide .fig{align-self:stretch;min-height:200px;padding:12px}
.guide .fig svg{height:220px;width:auto}
.guide .gtext{box-sizing:border-box}
.guide .gtext:focus-visible{outline:3px solid var(--lamp)}
@media (max-width:760px){
  .frame.guideframe .guide{grid-template-columns:1fr;gap:16px;padding:18px}
  .guide .fig{min-height:0}
  .guide .fig svg{height:150px}
  .guide h2{font-size:1.5rem}
  .guide p{font-size:1.02rem}
}

/* clear light */
.crack{stroke-dasharray:900;stroke-dashoffset:900;animation:crack 1.2s ease-out forwards}
@keyframes crack{to{stroke-dashoffset:0}}
.bubble{opacity:0;transform:scale(.6);transform-origin:80% 80%;transition:opacity .8s, transform .8s}
.bubble.on{opacity:1;transform:scale(1)}
.ring{position:absolute;left:49.8%;top:43%;width:8%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(242,182,64,.55);transform:translate(-50%,-50%);animation:ring 4.5s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(9);opacity:0}}


/* chapters 4-5 */
.rise{animation:rise 4.5s ease-out forwards}
@keyframes rise{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
.walk{animation:walk 9s ease-in forwards}
@keyframes walk{to{transform:translateY(-22px);opacity:.25}}
.steam path{animation:steam 2.4s ease-in-out infinite}
.steam path+path{animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
.balloon{opacity:0}
.balloon.on{animation:shout 4s ease-out forwards}
@keyframes shout{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.mug{opacity:0}
.mug.on{opacity:1;animation:shake .35s linear 2}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.drawer{transition:transform 1s ease}
.drawer.open{transform:translateX(60px)}
.page{transform-box:fill-box;transform-origin:center;animation:fly 1.6s ease-in forwards}
.page.f2{animation-delay:.35s}.page.f3{animation-delay:.7s}
@keyframes fly{to{transform:translate(160px,-190px) rotate(30deg);opacity:0}}
.glass.flash{animation:flash .9s ease}
@keyframes flash{40%{fill:#FFFFFF}}
.popped{transform-box:fill-box;transform-origin:center;animation:pop 1.2s ease 1s forwards}
@keyframes pop{to{transform:scale(1.5);opacity:0}}
.drops{opacity:0;animation:drops 1s ease 2s forwards}
@keyframes drops{to{opacity:1}}
.drawerbtn{position:absolute;background:transparent;border:2px dashed rgba(251,243,223,.75);border-radius:6px;cursor:pointer;padding:0}
.drawerbtn:hover{background:rgba(242,182,64,.2)}
.drawerbtn:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.run{background:var(--red);font-size:1.2rem;letter-spacing:.24em;text-transform:uppercase;padding:14px 34px;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.checks{position:absolute;inset:0;background:var(--parchment);padding:5%;box-sizing:border-box;display:flex;flex-direction:column;gap:4%}
.ck-head span{display:block;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(.95rem,3.4vw,2rem);color:var(--brown);letter-spacing:.03em}
.ck-head small{display:block;font-size:clamp(.7rem,1.6vw,1rem);color:var(--ink-soft);margin-top:4px}
.ck-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;flex:1}
.ck{display:flex;align-items:center;gap:6%;padding:4%;border:2px solid var(--ink);border-radius:12px;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:clamp(.7rem,1.9vw,1.15rem);line-height:1.25;text-align:left;cursor:pointer;min-width:0}
.ck:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.box{flex:none;width:clamp(18px,3vw,32px);aspect-ratio:1;border:3px solid var(--ink);border-radius:6px;position:relative;background:#FFFFFF}
.ck[aria-pressed="true"] .box{background:var(--ok)}
.ck[aria-pressed="true"] .box::after{content:"";position:absolute;left:30%;top:6%;width:28%;height:58%;border:solid #FFFFFF;border-width:0 4px 4px 0;transform:rotate(45deg)}


/* epilogue */
.duo{position:absolute;inset:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.half{position:relative;border:0;padding:0;margin:0;cursor:pointer;background:none;overflow:hidden;transition:filter .4s}
.half svg{width:100%;height:100%;display:block}
.half span{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(.68rem,1.6vw,.95rem);background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;white-space:nowrap}
.duo:hover .half:not(:hover){filter:brightness(.55)}
.half:focus-visible{outline:4px solid var(--lamp);outline-offset:-4px}
.rules{position:relative;background:var(--parchment);padding:24px;display:flex;flex-direction:column;gap:18px}
.rule-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rule{display:flex;flex-direction:column;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:12px;background:var(--cream);min-width:0}
.rule svg{width:100%;height:auto;border-radius:8px;background:#E9DDBF}
.rule b{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--teal)}
.rule p{margin:0;font-size:clamp(.9rem,1.6vw,1.05rem);line-height:1.35}
.spin{transform-origin:300px 170px;animation:spinr 40s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.bluerise{animation:brise 3s ease-out forwards}
@keyframes brise{to{opacity:.85;transform:translateY(-40px)}}

/* volume 2 */
.approach{transform-origin:300px 205px;animation:approach 9s ease-in forwards}
@keyframes approach{from{transform:scale(.8)}to{transform:scale(1.14)}}
.pulse{transform-origin:300px 205px;animation:pulseg 1.24s ease-in-out infinite}
@keyframes pulseg{50%{opacity:.12;transform:scale(.92)}}
.morph .pulse{animation:none;opacity:0;transition:opacity 1s}
.wrath{transform-origin:300px 205px;transition:transform 1.6s ease, opacity 1.4s ease}
.fl{transform-origin:300px 205px;animation:flick2 .45s ease-in-out infinite alternate}
@keyframes flick2{to{transform:scale(1.04) rotate(1.5deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.peace{opacity:0;transform-origin:300px 205px;transform:scale(.3);transition:opacity 1.6s ease .5s, transform 1.6s ease .5s}
.morph .wrath{transform:scale(.12) rotate(90deg);opacity:0}
.morph .peace{opacity:1;transform:scale(1)}
.frame.facing{transition:none;animation:shake2 .12s linear infinite}
@keyframes shake2{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.holdbtn{position:absolute;inset:0;background:transparent;border:0;padding:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.holdpill{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:8px 16px 8px 8px;font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:clamp(.72rem,1.7vw,.95rem);white-space:nowrap}
.holdpill svg{width:30px;height:30px}
.holdbtn:focus-visible .holdpill{outline:3px solid var(--lamp);outline-offset:3px}
.zone{position:absolute;background:transparent;border:2px dashed rgba(255,255,255,.55);border-radius:50%;cursor:pointer;padding:0}
.zone:focus-visible{outline:3px solid var(--lamp)}
.closing{transform-origin:300px 205px;animation:closing 10s ease-in forwards}
@keyframes closing{from{transform:scale(1.35)}to{transform:scale(.82)}}
.orbit{transform-origin:300px 210px;animation:spinr 18s linear infinite}


/* chapters menu */
#app{position:relative}
.chap{position:absolute;right:16px;top:calc(100% + 0px);z-index:20;width:min(340px,calc(100% - 32px));max-height:min(70vh,560px);overflow-y:auto;background:var(--parchment);border:2px solid var(--ink);border-radius:14px;box-shadow:0 12px 30px rgba(20,20,19,.25);padding:14px;box-sizing:border-box}
.chapwrap{position:relative;z-index:20}
.chap h3{margin:10px 6px 6px;font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brown)}
.chap h3:first-child{margin-top:2px}
.chap ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.chap button{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;background:transparent;border:0;border-radius:8px;padding:10px 8px;font-family:var(--body);font-size:1rem;color:var(--ink);cursor:pointer;min-height:44px}
.chap button:hover,.chap button:focus-visible{background:var(--cream);outline:none}
.chap button[aria-current="true"]{background:var(--cream);font-weight:700}
.chap button small{font-family:var(--display);font-weight:700;font-size:.7rem;letter-spacing:.1em;color:var(--ink-soft);min-width:2.4em;font-variant-numeric:tabular-nums}


/* volume 3 */
.streaks{animation:streak 1.1s linear infinite}
@keyframes streak{from{transform:translateX(-140px)}to{transform:translateX(140px)}}
.blown{animation:blown 2.6s ease-in-out infinite}
@keyframes blown{50%{transform:translate(40px,-8px)}}
.elgrid{position:absolute;inset:0;background:#1B2224;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;padding:6%;box-sizing:border-box}
.el{background:#2A3335;border-radius:14px;display:flex;align-items:center;justify-content:center;opacity:.22;transition:opacity .4s, transform .4s;min-height:0}
.el svg{width:62%;height:auto;max-height:90%}
.el.on{opacity:1;transform:scale(1.04)}
.peb{opacity:0}
.pebs.on .peb{animation:drop .5s ease-in forwards}
@keyframes drop{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:none}}
.mref{opacity:0;transition:opacity 1.2s}
.mref.on{opacity:1}
.approach2{transform-origin:230px 200px;animation:approach 9s ease-in forwards}
.leaf{transform-origin:20px 115px;transform:scaleX(.12);transition:transform .15s}
.doorwrap{position:relative;background:var(--parchment);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:24px;padding:24px;align-items:center}
.doorsteps ol{margin:12px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-size:clamp(.95rem,1.8vw,1.1rem);line-height:1.35}
.doorpic svg{width:100%;height:auto;max-height:260px;display:block}
.doorgrid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px;background:#10181B}
.doorcard{display:flex;flex-direction:column;gap:8px;background:var(--parchment);border:2px solid var(--ink);border-radius:12px;padding:8px;cursor:pointer;font-family:var(--body);font-size:clamp(.82rem,1.6vw,1rem);line-height:1.25;color:var(--ink);text-align:left;min-width:0}
.doorcard svg{width:100%;height:auto;border-radius:8px;display:block}
.doorcard:hover{transform:translateY(-2px)}
.doorcard.nope{opacity:.4;filter:grayscale(1)}
.doorcard:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}

/* pilot: shared production layer */
#visual{position:relative}
.leaving{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;pointer-events:none;z-index:4;animation:leave .7s ease forwards}
@keyframes leave{to{opacity:0;transform:scale(.985)}}
.entering{animation:enter .8s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{clip-path:inset(0 0 0 100% round 18px)}to{clip-path:inset(0 0 0 0 round 18px)}}
.amb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.kb{animation:kb 24s ease-out forwards;transform-origin:62% 48%}
@keyframes kb{to{transform:scale(1.09)}}
.glowspot{position:absolute;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.55) 0%,rgba(255,190,90,.18) 40%,rgba(255,190,90,0) 70%);mix-blend-mode:screen;pointer-events:none;animation:candle 2.3s steps(9,end) infinite;transition:opacity 1.2s ease}
@keyframes candle{0%{opacity:.85;transform:translate(-50%,-50%) scale(1)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}35%{opacity:.75}55%{opacity:.95;transform:translate(-50%,-50%) scale(.97)}75%{opacity:.8}100%{opacity:.9;transform:translate(-50%,-50%) scale(1.02)}}
.callout{position:absolute;z-index:3;transform:translate(-50%,-50%) scale(0);background:var(--parchment);border:2px solid var(--ink);border-radius:8px;padding:5px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards;box-shadow:0 3px 0 var(--ink);pointer-events:none;white-space:nowrap}

function coffin(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-110" y="-60" width="220" height="60" fill="${WHITE}" stroke="${K}" stroke-width="2.4"/><path d="M-110 -60 L-96 -80 H96 L110 -60" fill="${GOLD}" stroke="${K}" stroke-width="2.2"/>${[-70,-30,10,50].map(d=>`<path d="M${d} -40 q10 -14 20 0 q-10 14 -20 0Z" fill="${GOLD}" stroke="${K}" stroke-width="1.2"/>`).join('')}</g>`; }
function oilLamp(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><circle cy="-24" r="22" fill="url(#glowT)" class="flick"/><path d="M-20 0 Q0 12 20 0 Q18 -8 0 -8 Q-18 -8 -20 0Z" fill="#B86A3A" stroke="${K}" stroke-width="2"/><path d="M0 -8 Q8 -22 0 -34 Q-8 -22 0 -8Z" fill="#FFD27A" stroke="${SAFF}" stroke-width="1.5" class="flick"/></g>`; }
function lotus(x,y,s=1,col=PINK){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 Q-10 -20 0 -36 Q10 -20 0 0Z M0 0 Q-26 -6 -28 -26 Q-8 -20 0 0Z M0 0 Q26 -6 28 -26 Q8 -20 0 0Z" fill="${col}" stroke="${K}" stroke-width="1.8"/></g>`; }
/* a water vessel (kendi) tipped over a bowl */
function kendi(x,y,s=1,{tip=0}={}){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-30 0 Q-34 -8 0 -8 Q34 -8 30 0 Q24 16 0 16 Q-24 16 -30 0Z" fill="#8A8A98" stroke="${K}" stroke-width="2"/><g transform="translate(-10 -50) rotate(${tip})"><path d="M-18 0 Q-24 -30 0 -32 Q24 -30 18 0 Q10 10 0 10 Q-10 10 -18 0Z" fill="${GOLD}" stroke="${K}" stroke-width="2"/><path d="M18 -10 L36 -20 L36 -16 L20 -4" fill="${GOLD}" stroke="${K}" stroke-width="1.6"/><path d="M-4 -32 V-42 H4 V-32" fill="${GOLD}" stroke="${K}" stroke-width="1.6"/></g></g>`; }
/* Yama, king of the dead: crowned, dark green, with a staff */
function yama(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-40 0 L-34 -100 Q0 -112 34 -100 L40 0Z" fill="${LEAF}" stroke="${K}" stroke-width="2.6"/><path d="M-34 -60 H34 M-36 -30 H36" stroke="${GOLD}" stroke-width="4"/><path d="M50 0 V-170" stroke="${GOLD}" stroke-width="5"/><circle cx="50" cy="-176" r="9" fill="${GOLD}" stroke="${K}" stroke-width="1.6"/><path d="M34 -96 L50 -110" stroke="#2E5A3A" stroke-width="12" stroke-linecap="round"/><circle cy="-128" r="20" fill="#2E5A3A" stroke="${K}" stroke-width="2.4"/><path d="M-20 -142 L-14 -176 L-6 -150 L0 -186 L6 -150 L14 -176 L20 -142Z" fill="${GOLD}" stroke="${K}" stroke-width="2"/><path d="M-9 -130 h6 M3 -130 h6 M-6 -118 Q0 -114 6 -118" stroke="${K}" stroke-width="2" fill="none"/></g>`; }
/* a funeral pyre in a tall, tiered paper pavilion (meru) */
function meru(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-80" y="-40" width="160" height="40" fill="${WHITE}" stroke="${K}" stroke-width="2.2"/><path d="M-70 -40 V-140 M70 -40 V-140" stroke="${GOLD}" stroke-width="6"/>${[0,1,2,3].map(k=>`<path d="M${-90+k*16} ${-140-k*26} L0 ${-170-k*26} L${90-k*16} ${-140-k*26}Z" fill="${[TRED,GOLD,TRED,GOLD][k]}" stroke="${K}" stroke-width="2"/>`).join('')}<path d="M0 -250 V-276" stroke="${GOLD}" stroke-width="4"/>${coffin(0,-40,.5)}</g>`; }
function flames(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})" class="flick">${[-50,-25,0,25].map((d,i)=>`<path d="M${d} 0 Q${d-10} -40 ${d+12} -${70+(i%2)*30} Q${d+36} -40 ${d+26} 0Z" fill="${[SAFF,TRED,GOLD][i%3]}" stroke="${K}" stroke-width="2"/>`).join('')}</g>`; }
/* the realms: a wheel of six worlds */
function realms(x,y,s=1){ const C=['#EAD27A','#C9A8D8','#E8C8A8','#8AB878','#A8A8B8','#B85A3A']; return `<g transform="translate(${x} ${y}) scale(${s})"><g class="spin">${C.map((c,i)=>{ const a0=i/6*Math.PI*2, a1=(i+1)/6*Math.PI*2; return `<path d="M0 0 L${Math.cos(a0)*120} ${Math.sin(a0)*120} A120 120 0 0 1 ${Math.cos(a1)*120} ${Math.sin(a1)*120}Z" fill="${c}" stroke="${K}" stroke-width="2.4"/>`; }).join('')}</g><circle r="30" fill="${CREAM}" stroke="${K}" stroke-width="2.4"/></g>`; }
function thCover(){ return tw(`${ground(330)}${wat(300,330,.95)}${buddha(300,330,.5)}${monk(110,330,.8,{arms:'bowl'})}${oilLamp(500,330,1.2)}`); }

/* The Last Thought, the full book. The way of the elders, the four sights, the five remembrances, your last day, the last thought,
   the water of forgiveness, the chanting, merit for the dead, the cremation, Kisa Gotami, Yama and the five messengers,
   the lamp lit from a lamp, the realms, and the flame going out.
   After the Pali Canon (MN 130, AN 5.57, DN 16, the Tirokudda Sutta, MN 72), the Milindapanha and Thai funeral custom.
   A first draft: it should be read by Theravada monks and lay Buddhists. */
const BOOK={home:'lastday', toast:'Learned: ', pathLabel:'Path', pathTitle:'What you have learned', detourTitle:'Wrong turns you walked',
  pathNote:'Every wrong turn rewinds. Everything that arises passes away, and that includes mistakes.',
  guideBack:'Back to the book', voiceSample:'Impermanent are all conditioned things. Their stilling is bliss.'};

/* ---------- pictures ---------- */
const PG=(inner,lab,o)=>frame(sv(tw(inner,o),lab));
const SC=(x,y,s,inner)=>`<g transform="translate(${x} ${y}) scale(${s})">${inner}</g>`;
const HOUSE=(inner)=>`${ground(330,'#B89A6A')}<rect x="20" y="60" width="560" height="270" fill="#E8D8B4"/><path d="M20 330 V60 H580 V330" stroke="${K}" stroke-width="2" fill="none" opacity=".4"/>${inner}`;
function bubble(x,y,inner){ return `<g transform="translate(${x} ${y})"><circle r="40" fill="${WHITE}" stroke="${K}" stroke-width="2.2"/>${inner}</g>`; }
const ROBE=`<path d="M-20 14 L-14 -18 H14 L20 14Z" fill="${SAFF}" stroke="${K}" stroke-width="1.8"/>`, BOWL=`<path d="M-20 -4 Q0 26 20 -4Z" fill="#2A2A2A" stroke="${K}" stroke-width="1.8"/><path d="M-6 -6 q6 -8 12 0" fill="${WHITE}" stroke="${K}" stroke-width="1.2"/>`, BRIDGE=`<path d="M-26 10 Q0 -20 26 10" stroke="#8A5A2A" stroke-width="6" fill="none"/><path d="M-26 16 H26" stroke="${TEAL}" stroke-width="4"/>`;
function houses(){ return [70,190,310,430,550].map((x,i)=>`<g id="h${i+1}" style="transition:opacity .6s"><rect x="${x-44}" y="230" width="88" height="70" fill="#C9A06A" stroke="${K}" stroke-width="2"/><path d="M${x-54} 230 L${x} 190 L${x+54} 230Z" fill="${TRED}" stroke="${K}" stroke-width="2"/><rect x="${x-12}" y="260" width="24" height="40" fill="#6A4A2A" stroke="${K}" stroke-width="1.5"/></g>`).join('')+`<path d="M20 300 V330 M580 300 V330" stroke="${K}" stroke-width="0"/>`; }
const THREAD=(x1,y1,x2,y2)=>`<path d="M${x1} ${y1} Q${(x1+x2)/2} ${Math.max(y1,y2)+30} ${x2} ${y2}" stroke="${WHITE}" stroke-width="2.4" fill="none"/><path d="M${x1} ${y1} Q${(x1+x2)/2} ${Math.max(y1,y2)+30} ${x2} ${y2}" stroke="${K}" stroke-width=".6" fill="none" opacity=".5"/>`;

/* ---------- sound ---------- */
Object.assign(MOODS,{ room:()=>roomTone(), drone:()=>drone(),
  night:()=>pad('night',[98,146.83,196],.03), warm:()=>pad('warm',[110,164.81,220],.035), light:()=>pad('light',[130.81,196,261.63],.035),
  chant:()=>pad('chant',[110,110.6,165],.04),
  water:()=>startLoop('water',g=>{ const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; s.connect(f).connect(g); s.start(); return [s]; },.05),
  fire:()=>startLoop('fire',g=>{ const s=ctx.createBufferSource(); s.buffer=brownBuf; s.loop=true; const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=600; f.Q.value=.8; s.connect(f).connect(g); s.start(); return [s]; },.08) });
function gong(){ bell(130.8,.12,7); }
function knock(){ if(!ctx) return; thump(.35); setTimeout(()=>ctx&&thump(.3),160); }
function tapCount(n,lab,onTap){ let k=0; choices.innerHTML=`<button class="btn" type="button" id="tc">${lab} · 0 of ${n}</button>`; const b=$('#tc'); b.focus({preventScroll:true});
  b.onclick=e=>{ e.stopPropagation(); initAudio(); k++; onTap&&onTap(k); b.textContent=`${lab} · ${k} of ${n}`; if(k>=n){ b.disabled=true; setTimeout(()=>{ choices.innerHTML=''; next(); },700); } }; }

/* ---------- the book ---------- */
const NIGHTBG='#0E2228', CREAMBG='#D9C9A6';
const S=[
{ key:'title', label:'', bg:NIGHTBG,
  view:()=>`<div class="title-card" role="dialog" aria-label="Start"><span class="eyebrow">Many Doors · Theravada Buddhism · the full book</span><h1>The Last Thought</h1>
    <p>In Thailand, Myanmar, Sri Lanka, Laos and Cambodia, Buddhists believe there is no soul to go anywhere, and yet something goes on: a stream of deeds and mind, carried from one life to the next like a flame lit from a flame. This book walks a Theravada death with you, from the first sight of old age to the flame going out.</p>
    <ol><li>Headphones make it better.</li><li>Tap, or press Space, to move on.</li><li>When the book asks you something, answer it yourself.</li></ol>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="begin" type="button">Begin</button><button class="btn alt" id="pickch" type="button">Choose a chapter</button></div></div>`,

{ key:'elders', label:'The way of the elders', bg:CREAMBG,

{ key:'sights', label:'The four sights', bg:CREAMBG, learn:'messengers',

      [38,78,'A sick person',"A sick person, shaking with fever. Everyone falls ill."],

/* ===== Volume 1: before the end ===== */
{ key:'v1', label:'Volume 1', bg:'var(--teal)',
  view:()=>card('Volume 1','Before the End',"Monks are taught to think about death every day. Not to be gloomy, but because a mind that has faced death doesn't panic when it comes."),
  enter(){ mood('night'); gong(); }, beats:[{text:null}] },

{ key:'remember', label:'The five remembrances', bg:CREAMBG, learn:'remember',
  view:()=>PG(`${ground(330)}${monk(300,330,1.25,{arms:'fold'})}${oilLamp(460,330,1.4)}${lotus(140,330,1.4)}`,'A monk sits with folded hands beside an oil lamp and a lotus.'),
  enter(){ mood('chant'); },
  guide:{title:'The Five Remembrances',text:"In the Anguttara Nikaya (AN 5.57), the Buddha says that everyone, monk or lay person, man or woman, should reflect often on five facts. Many Theravada monasteries chant them daily. The point isn't fear: it's to loosen the grip of pride in youth, health and life, and to take your actions seriously."},
  beats:[
    {text:"The Buddha gave everyone five things to remember, every day. Say each one.", lock:true, afterType(){ setTimeout(()=>askAll(["I am of the nature to grow old. I cannot escape ageing.","I am of the nature to fall ill. I cannot escape illness.","I am of the nature to die. I cannot escape death.","Everything dear to me will change, and I will be parted from it.","My actions are my only true belongings. I cannot escape their results."],'I know it'),500); }},
    {text:"You say them every morning for forty years. They stop sounding like threats, and start sounding like facts. That's the point."} ]},

{ key:'v2', label:'Volume 2', bg:'var(--teal)',
  view:()=>card('Volume 2','The Last Day',"The Buddha taught that the mind at the moment of death helps shape the next birth. So the last day is spent keeping the mind calm and bright."),

{ key:'lastday', label:'The last day', bg:CREAMBG,

{ key:'water', label:'The water of forgiveness', bg:CREAMBG, learn:'forgive',
  view:()=>PG(HOUSE(`${mat(300,320)}<path d="M200 298 Q186 300 180 312" stroke="${SKIN}" stroke-width="8" stroke-linecap="round"/>${lay(120,330,.85,{arms:'pour',col:WHITE,hair:'grey'})}${kendi(170,300,.6,{tip:40})}${lay(470,330,.85,{arms:'fold',col:WHITE})}${lay(540,330,.75,{arms:'fold',col:WHITE,hair:'long'})}`),'Mourners in white. An old neighbour pours water over your outstretched hand.'),
  enter(){ mood('room','water'); },
  guide:{title:'Rot nam sop',text:"At a Thai funeral, the first rite is rot nam sop, bathing the body. The dead person's right hand is laid out, and each guest pours a little scented water over it and quietly asks forgiveness for anything they did wrong, and forgives in return. Nobody should carry a grudge into the next life, on either side."},
  beats:[
    {text:"Your family dresses in white. One by one, neighbours pour a little scented water over your hand, and ask forgiveness, and forgive you. Pour the water.", lock:true, afterType(){ tapCount(5,'Pour water',k=>bell(392+k*30,.05,2.4)); }},
    {text:"The old quarrel with the neighbour about the fence. The harsh word to your brother. Forgiven, both ways. Nothing left owing."} ]},

{ key:'chant', label:'The chanting', bg:NIGHTBG,
  view:()=>PG(`${ground(330,'#1E3A40')}${coffin(300,330,1)}${monk(110,330,.85,{arms:'fold'})}${monk(490,330,.85,{arms:'fold'})}${oilLamp(200,330,1)}${oilLamp(400,330,1)}`,'At night, your coffin under lamplight, with monks seated on each side.',{bg:'night'}),
  enter(){ mood('chant','night'); gong(); },
  guide:{title:'Anicca vata sankhara',text:"These lines come from the Mahaparinibbana Sutta (DN 16), the account of the Buddha's own death, where the god Sakka speaks them. They are chanted at almost every Theravada funeral: Anicca vata sankhara, uppada-vaya-dhammino. Uppajjitva nirujjhanti, tesam vupasamo sukho. Impermanent are all conditioned things; their nature is to arise and pass away. Having arisen, they cease. Their stilling is bliss."},
  beats:[
    {text:"For several nights the monks come to chant beside your coffin, in Pali, the old language of the scriptures. Neighbours come, eat together, play cards, keep the family company."},

{ key:'dedicate', label:'Merit for the dead', bg:CREAMBG, learn:'merit',
  view:()=>PG(HOUSE(`${monk(110,330,.85,{arms:'bowl'})}${monk(200,330,.85,{arms:'bowl'})}<path d="M300 300 h80 v30 h-80Z" fill="#C9A06A" stroke="${K}" stroke-width="1.5"/><path d="M310 300 q30 -30 60 0" fill="${WHITE}" stroke="${K}" stroke-width="1.5"/>${kendi(480,330,.9,{tip:30})}<path id="ws" d="M470 290 Q478 310 476 322" stroke="#7AB8D8" stroke-width="4" fill="none" style="opacity:0;transition:opacity .6s"/>${lay(540,330,.85,{arms:'pour',col:WHITE,hair:'long'})}`),'Monks receive food from your family. Your daughter tips a small gold water vessel over a bowl.'),
  enter(){ mood('warm','chant'); },
  guide:{title:'The Tirokudda Sutta',text:"The Tirokudda Sutta, Outside the Walls, describes the dead standing outside the walls of their old homes, at crossroads and doorways, hoping to be remembered. It says weeping and lamentation don't help them at all. What helps is giving to the Sangha, the community of monks, and dedicating the merit to them. Pouring water while the monks chant, called kruat nam, marks the dedication."},
  beats:[

    {text:"As rivers, full of water, fill the ocean full, says the scripture, so what is given here reaches the dead. The merit goes with you."} ]},

{ key:'cremation', label:'The cremation', bg:CREAMBG,
  view:()=>PG(`${ground(330)}${meru(300,330,1)}<g id="fl" style="opacity:0;transition:opacity 2s">${flames(300,296,.9)}</g>${lay(90,330,.85,{arms:'fold',col:WHITE,hair:'long'})}${lay(510,330,.85,{arms:'fold',col:WHITE})}`,'Your coffin in a tall tiered pavilion of red and gold paper at the temple. Mourners in white stand on either side.'),
  enter(){ mood('warm'); gong(); },
  beats:[
    {text:"On the day of the cremation, your coffin is carried three times around the temple's crematorium. Every guest places a small flower of carved sandalwood. Place yours.", lock:true, afterType(){ tapCount(4,'Place a sandalwood flower',k=>bell(330+k*30,.05,2.5)); }},
    {text:"Then the fire. Later, your bones are gathered, washed, and kept in a small shrine at the temple, where your family will come to make merit for you, year after year.", lock:true, show(){ const f=$('#fl'); if(f) f.style.opacity='1'; mood('warm','fire'); setTimeout(armAdvance,1500); }} ]},

{ key:'mustard', label:'The mustard seed', bg:CREAMBG, learn:'grief',
  view:()=>PG(`${ground(330)}${houses()}${lay(300,350,.6,{hair:'long',col:PINK,arms:'fold'})}`,'A row of village houses. A young mother walks from door to door.'),
  enter(){ mood('warm'); },
  guide:{title:'Kisa Gotami',text:"Kisa Gotami's story is told in the commentaries on the Therigatha, the verses of the early Buddhist nuns. After her realisation she became a nun herself, and a verse attributed to her is in the collection. Her story is still told at funerals across the Theravada world."},
  beats:[
    {text:"Your daughter's grief is heavy. The monk tells her an old story. A young mother, Kisa Gotami, carried her dead son to the Buddha, begging for medicine. He said: bring me a mustard seed from a house where no one has ever died."},
    {text:"Go with her, house to house. Knock.", lock:true, afterType(){ tapCount(5,'Knock',k=>{ knock(); const h=$('#h'+k); if(h) h.style.opacity='.45'; }); }},
    {text:"Every house has lost someone. A parent, a child, a husband. By evening Kisa Gotami understood: she wasn't alone, and death wasn't a punishment aimed at her. She buried her son, and went back to the Buddha to learn."} ]},

/* ===== Volume 3: Yama ===== */
{ key:'v3', label:'Volume 3', bg:'var(--teal)',
  view:()=>card('Volume 3','The Messengers',"The scriptures tell of Yama, king of the dead, who asks every new arrival one question."),
  enter(){ mood('night'); gong(); }, beats:[{text:null}] },

{ key:'yama', label:'Yama', bg:NIGHTBG,
  view:()=>PG(`${ground(330,'#1E3A40')}${yama(360,330,1.1)}${lay(150,330,.85,{hair:'grey',col:'#8A7A6A'})}`,'Yama, king of the dead, crowned and green, with a golden staff. You stand before him.',{bg:'night'}),
  enter(){ mood('night'); gong(); },
  guide:{title:'The Divine Messengers',text:"In the Devaduta Sutta (MN 130), Yama asks a newly dead person whether they ever saw the five divine messengers: a newborn baby lying in its own mess, an old person, a sick person, a criminal being punished, and a corpse. The person says yes. Then, Yama asks, did it never occur to you that you too were subject to these, and should do good? The Buddha says he tells this not from hearsay, but from what he has seen himself."},
  beats:[
    {text:"Yama, king of the dead, asks: in your life, did you never see the divine messengers? A baby, an old person, a sick person, a prisoner, a corpse?", lock:true, afterType(){ pick([{label:'I never saw them',go:'x_ignore'},{label:'I saw them, and I tried to act on it'}]); }} ]},

{ key:'heir', label:'Yama', bg:NIGHTBG, learn:'kamma',
  view:()=>PG(`${ground(330,'#1E3A40')}${yama(360,330,1.1)}${lay(150,330,.85,{hair:'grey',col:'#8A7A6A',arms:'fold'})}<circle cx="150" cy="200" r="60" fill="url(#glowT)"/>`,'Yama looks at you. A soft light glows around you.',{bg:'night'}),
  enter(){ mood('night','light'); },
  beats:[
    {text:"Yama doesn't sentence you. In this scripture he only asks. What you did is what follows you: your deeds are the seeds, and you inherit the harvest."},
    {text:"The last of the five remembrances says it: I am the owner of my actions, heir to my actions. Whatever I do, good or bad, of that I will be the heir."} ]},

{ key:'rebirth', label:'The flame', bg:NIGHTBG,
  view:()=>PG(`${ground(330,'#1E3A40')}${oilLamp(200,330,2)}<g transform="translate(400 330) scale(2)"><path d="M-20 0 Q0 12 20 0 Q18 -8 0 -8 Q-18 -8 -20 0Z" fill="#B86A3A" stroke="${K}" stroke-width="1"/></g>`,'One burning oil lamp, and one unlit lamp beside it.',{bg:'night'}),
  enter(){ mood('night'); },
  beats:[
    {text:"Now a new life begins somewhere, shaped by what you did and by your last thought. But what is it that goes on?", lock:true, afterType(){ pick([{label:'My soul moves into a new body',go:'x_soul'},{label:'Neither the same, nor someone else'}]); }} ]},

{ key:'lamp', label:'The flame', bg:NIGHTBG, learn:'nosoul',
  view:()=>PG(`${ground(330,'#1E3A40')}${oilLamp(200,330,2)}<g id="l2" style="opacity:.25;transition:opacity 1.5s">${oilLamp(400,330,2)}</g>`,'One burning lamp. A second lamp waits beside it.',{bg:'night'}),
  enter(){ mood('night','light'); },
  guide:{title:'The Questions of King Milinda',text:"The Milindapanha, a dialogue between the Greek king Menander and the monk Nagasena, around the second century BCE, asks the question everyone asks: if there is no soul, who is reborn? Nagasena answers with a lamp. Is the flame at midnight the same as the flame at dusk? Not the same, and not a different one either: it depends on the one before. Rebirth is like lighting one lamp from another. Nothing passes across, and yet the second flame comes from the first."},
  beats:[
    {text:"The Buddha taught anatta, no self: there is no unchanging soul to move house. And yet something continues, as one lamp lights another. Hold, and light the second lamp.", lock:true, show(){ holdOn({label:'Light the lamp',ms:5000,wait:600,onDone:()=>{ const l=$('#l2'); if(l) l.style.opacity='1'; chime(); }}); }},
    {text:"Is it the same flame? Not the same. Is it a different one? Not that either. It burns because the first one did."} ]},

{ key:'heaven', label:'The realms', bg:NIGHTBG,
  view:()=>PG(`${realms(300,200,1.3)}`,'A turning wheel of six coloured worlds.',{bg:'night'}),
  enter(){ mood('light'); },
  guide:{title:'Thirty-one planes',text:"Theravada cosmology lists thirty-one planes of existence, usually grouped as hell beings, hungry ghosts, animals, humans, and many layers of gods and Brahma beings. Every one of them, even the highest heaven, is temporary. A human birth is prized above the heavens because it has the right mix of pleasure and pain to make awakening possible."},
  beats:[
    {text:"There are many realms to be born into: hells, hungry ghosts, animals, humans, and heavens above heavens. Your good deeds carry you up into a heaven of the gods: light, music, gardens, and no pain."},
    {text:"It's wonderful. You never want it to end.", lock:true, afterType(){ pick([{label:'Stay here forever',go:'x_forever'},{label:'Remember that this too will end'}]); }} ]},

{ key:'wheel', label:'The realms', bg:NIGHTBG, learn:'planes',
  view:()=>PG(`${realms(300,200,1.3)}<circle cx="300" cy="200" r="30" fill="url(#glowT)"/>`,'The wheel of worlds turns. At its still centre, a small light.',{bg:'night'}),
  enter(){ mood('light'); },
  beats:[
    {text:"Every realm is temporary, even the heavens. When the merit runs out, the god dies too, and the wheel turns again. The Buddha didn't teach a way into heaven. He taught a way off the wheel."} ]},

/* ===== Volume 4: the flame goes out ===== */
{ key:'v4', label:'Volume 4', bg:'var(--teal)',
  view:()=>card('Volume 4','The Flame Goes Out',"Nibbana literally means blowing out, as a flame goes out when its fuel is used up."),
  enter(){ mood('light'); gong(); }, beats:[{text:null}] },

{ key:'flameout', label:'Nibbana', bg:NIGHTBG,
  view:()=>PG(`${ground(330,'#1E3A40')}<g id="fo" style="transition:opacity 4s">${oilLamp(300,330,2.6)}</g>`,'A single oil lamp burns in the dark.',{bg:'night'}),
  enter(){ mood('night'); },
  beats:[
    {text:"Imagine the last life: someone who has let go of craving, hatred and delusion, so there's no fuel left for another birth. Before you go further, a question comes up.", lock:true, afterType(){ pick([{label:'Where will I be, after?',go:'x_where'},{label:'Let the question go'}]); }} ]},

{ key:'nibbana', label:'Nibbana', bg:NIGHTBG, learn:'nibbana',
  view:()=>PG(`${ground(330,'#1E3A40')}<g id="fo" style="transition:opacity 4s">${oilLamp(300,330,2.6)}</g>`,'A single oil lamp burns in the dark.',{bg:'night'}),
  enter(){ mood('night','light'); },
  guide:{title:'Where did the fire go?',text:"In the Aggivacchagotta Sutta (MN 72), a wanderer asks the Buddha whether an awakened one exists after death, or doesn't, or both, or neither. The Buddha rejects all four. If a fire in front of you went out, he asks, which direction did it go: north, south, east or west? The question doesn't fit. The fire went out because its fuel was used up. Nibbana is described as peace, the unconditioned, the end of suffering."},
  beats:[
    {text:"Craving was the fuel. When it's gone, the fire doesn't go somewhere. It goes out. Hold, and let the flame go out.", lock:true, show(){ holdOn({label:'Let the flame go out',ms:7000,wait:800,onProgress:p=>{ const f=$('#fo'); if(f) f.style.opacity=String(1-p); },onDone:()=>gong()}); }},
    {text:"That's nibbana. Not nothing, the scriptures insist, and not a place: peace, the end of suffering. Their stilling is bliss."} ]},

{ key:'lastpage', label:'The last page', bg:NIGHTBG,
  view:()=>frame(sv(thCover(),'A temple with red roofs, a golden Buddha, a monk with a bowl and an oil lamp.')),
  enter(){ mood('warm'); },
  beats:[
    {text:"That's the road: messengers noticed, five facts remembered, a last thought kept bright, forgiveness poured, merit shared, a flame lit from a flame, heavens that end, and a fire that finally goes out."},
    {text:"The Buddha's own last words, the scriptures say, were these: all conditioned things are subject to decay. Strive on, with diligence."} ]},

{ key:'end', label:'The end', bg:'var(--teal)',
  view:()=>`<div class="title-card" style="cursor:default"><span class="eyebrow">The end of the book</span><h1>The Last Thought</h1>
    <p>That was the whole road: the way of the elders, the four sights, the five remembrances, the last day, the last thought, the water of forgiveness, the chanting, merit for the dead, the cremation, the mustard seed, Yama, the flame, the realms, and nibbana.</p><p id="endsum" style="font-weight:700"></p>
    <p class="draft">A first draft that should be read by Theravada monks and lay Buddhists. Sources: the Pali Canon, especially the Devaduta Sutta (MN 130), Upajjhatthana Sutta (AN 5.57), Mahaparinibbana Sutta (DN 16), Tirokudda Sutta (Khp 7) and Aggivacchagotta Sutta (MN 72), in the translations of Bhikkhu Bodhi and Thanissaro Bhikkhu; the Milindapanha; the Therigatha commentary on Kisa Gotami; Rupert Gethin, The Foundations of Buddhism (1998); Donald K. Swearer, The Buddhist World of Southeast Asia (2nd ed., 2010).</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="again" type="button">Read it again</button><button class="btn alt" id="pathend" type="button">See your path</button><button class="btn alt" id="chend" type="button">Choose a chapter</button></div>
    <div class="endlinks"><a href="../index.html#doors">Back to Many Doors</a></div></div>`,
  enter(){ mood('warm'); $('#again').onclick=e=>{ e.stopPropagation(); go(idx('elders')); }; $('#chend').onclick=e=>{ e.stopPropagation(); openChapters(true); }; $('#pathend').onclick=e=>{ e.stopPropagation(); openPath(); };
    $('#endsum').textContent=`You learned ${journey.learned.size} of ${LESSONS.length} lessons and walked ${journey.visited.size} of ${DETOURS.length} wrong turns.`+(journey.learned.size===LESSONS.length?' You know the way.':' Read again to learn the rest.'); },
  beats:[{text:null,lock:true}] },

/* ===== wrong turns ===== */
{ key:'x_cling', label:'A wrong turn', bg:'#6A6050',
  view:()=>PG(`${ground(330,'#5A5040')}<rect x="200" y="200" width="200" height="130" fill="#8A7A60" stroke="${K}" stroke-width="2"/><path d="M190 200 L300 140 L410 200Z" fill="#6A4A3A" stroke="${K}" stroke-width="2"/><g opacity=".7">${lay(460,330,.7,{col:'#5A6A5A',skin:'#8A9A8A',hair:'grey'})}</g>`,'A pale, thin figure lingers outside a house, looking in.',{bg:'#8A8070'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"Your last thought is the house: who'll get it, whether the money is safe. You die holding on to it. And you're reborn as a peta, a hungry ghost, hanging around your old house, unable to leave, unable to enjoy any of it."},
    {text:"The last thought isn't everything, but it matters. That's why families fill the dying mind with good memories. Rewind, and remember your merit.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_tears', label:'A wrong turn', bg:CREAMBG,
  view:()=>PG(HOUSE(`${coffin(300,330,1)}${lay(110,330,.85,{hair:'long',arms:'up',col:WHITE})}${lay(500,330,.85,{arms:'up',col:WHITE})}`),'Your family raise their arms and weep by your coffin.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"They weep and lament for days. It's love, and nobody could blame them. But it reaches you as nothing at all. You're outside the walls of your old home, hungry, and nothing comes."},
    {text:"The Tirokudda Sutta says it plainly: weeping, sorrow and lament don't help the dead. Giving does. Rewind, and let them give.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_ignore', label:'A wrong turn', bg:NIGHTBG,
  view:()=>PG(`${ground(330,'#1E3A40')}${yama(360,330,1.3)}${lay(150,330,.75,{hair:'grey',col:'#8A7A6A'})}`,'Yama looms over you.',{bg:'night'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"I never saw them, you say. But you did: your own grandmother, ill for years; your neighbour's funeral; your own grey hair in the mirror. You saw them, and you looked away."},
    {text:"In the scripture Yama says: you were careless. These deeds were done by you, not by your mother or father, and you yourself will feel their result. Rewind, and say what's true.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_soul', label:'A wrong turn', bg:NIGHTBG,
  view:()=>PG(`${ground(330,'#1E3A40')}<g opacity=".6"><circle cx="300" cy="200" r="40" fill="${WHITE}"/><path d="M270 200 Q300 260 330 200" fill="${WHITE}"/></g>`,'A pale, ghostly shape, like a little person, floats in the dark.',{bg:'night'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"You picture yourself as a little ghost moving out of one body and into the next, like moving house. That's how many traditions see it, and it belongs to their doors."},
    {text:"The Buddha taught that there is no such fixed self, in this life or the next. Look for it and you find only changing body, feelings, perceptions, intentions and consciousness. Rewind, and think of the lamp.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_forever', label:'A wrong turn', bg:'#3A3040',
  view:()=>PG(`${ground(330,'#2A2030')}${lotus(240,330,1.6,'#8A7A80')}${lotus(360,330,1.6,'#8A7A80')}`,'Wilted lotus flowers in a grey light.',{bg:'#4A4050'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"You settle in to stay forever. But after a long, long time, your garland wilts, your robes go dull, and your light fades. These are the signs, the texts say, that a god is about to die. The merit is used up, and down you go."},
    {text:"No heaven lasts. That's why the Buddha didn't aim for one. Rewind, and remember that this too will end.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_where', label:'A wrong turn', bg:NIGHTBG,
  view:()=>PG(`${ground(330,'#1E3A40')}${oilLamp(300,330,2.6)}${['N','E','S','W'].map((d,i)=>`<text x="${[300,520,300,80][i]}" y="${[70,210,370,210][i]}" text-anchor="middle" font-family="Jost,sans-serif" font-weight="700" font-size="28" fill="${WHITE}" opacity=".6">${d}</text>`).join('')}`,'The lamp, with the four directions around it.',{bg:'night'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"Where will I be? you ask. Somewhere wonderful? Nowhere? Asking keeps you holding on to an I that will be somewhere, and the fire keeps burning."},
    {text:"The Buddha answered this with a fire: when a fire goes out, did it go north, south, east or west? The question doesn't fit. Rewind, and let it go.", lock:true, afterType(){ rewindButton(); }} ]}
];

const CHAPTERS=[
  ['Before the road',[['The way of the elders','elders'],['The four sights','sights']]],
  ['Volume 1 · Before the End',[['The five remembrances','remember']]],
  ['Volume 2 · The Last Day',[['The last day','lastday'],['The water of forgiveness','water'],['The chanting','chant'],['Merit for the dead','family'],['The cremation','cremation'],['The mustard seed','mustard']]],
  ['Volume 3 · The Messengers',[['Yama','yama'],['The flame','rebirth'],['The realms','heaven']]],
  ['Volume 4 · The Flame Goes Out',[['Nibbana','flameout']]] ];
const LESSONS=[
  ['messengers','The messengers','Old age, sickness and death visit everyone. Notice them.','The four sights'],
  ['remember','The five remembrances','I will age, fall ill, die and lose what I love. My actions are what I own.','The five remembrances'],
  ['lastthought','The last thought','Keep the dying mind calm and full of good memories.','The last day'],
  ['forgive','Forgive both ways','Pour water, ask forgiveness, and forgive. Nothing left owing.','The water of forgiveness'],
  ['merit','Give, don’t lament','Tears don’t reach the dead. Giving, and sharing the merit, does.','Merit for the dead'],
  ['grief','The mustard seed','No house has escaped death. You are not alone in grief.','The mustard seed'],
  ['kamma','Heir to your deeds','You inherit the results of what you do.','Yama'],
  ['nosoul','A flame from a flame','No soul moves on, yet the new life comes from the old.','The flame'],
  ['planes','Every heaven ends','All realms are temporary. The aim is to get off the wheel.','The realms'],
  ['nibbana','The flame goes out','With no craving left, there is no fuel for another birth. Peace.','Nibbana'] ];
const IC=(d)=>`<path d="${d}" fill="none" stroke="#FBF4E6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
const DETOURS=[
  ['x_cling','Clinging to the house',IC('M8 30 V18 L20 8 L32 18 V30Z M16 30 V22 H24 V30')],
  ['x_tears','Only tears',IC('M14 10 Q8 20 14 24 Q20 20 14 10Z M26 14 Q20 24 26 28 Q32 24 26 14Z')],
  ['x_ignore','Ignoring the messengers',IC('M6 20 Q20 6 34 20 Q20 34 6 20Z M10 30 L30 10')],
  ['x_soul','A soul moving house',IC('M20 8 a8 8 0 1 0 .1 0 M12 28 Q20 20 28 28 Q24 34 20 30 Q16 34 12 28Z')],
  ['x_forever','Heaven forever',IC('M20 30 Q10 22 12 12 Q20 18 20 30 Q20 18 28 12 Q30 22 20 30Z')],
  ['x_where','Where did the fire go?',IC('M20 6 V34 M6 20 H34 M20 6 l-4 6 M20 6 l4 6')] ];
updatePathBadge();
go(0);

</script>
