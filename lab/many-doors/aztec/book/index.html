<style>

/* The Nine Levels of Mictlan: a painted codex. Deer-hide cream, codex red, turquoise, ochre and obsidian. */
:root{
  --bg:#EFE2C4; --paper:#F8EFD8; --ink:#1A1210; --ink-soft:#5A4436; --accent:#B8322A; --accent2:#2E9A8E; --gold:#E0A82E; --night:#140E14; --nightink:#F8EFD8;
  --display:'Alfa Slab One','Jost','Georgia',serif;
}
h1,.brand,.ptitle b,.ck b,.how b{font-family:var(--display);font-weight:400}
h1{letter-spacing:.005em}
.brand{letter-spacing:.06em;font-size:.95rem}
.cover{background:#1A1420}
.clashL{animation:clashL 2.4s ease-in-out infinite}.clashR{animation:clashR 2.4s ease-in-out infinite}
@keyframes clashL{50%{transform:translateX(70px)}}@keyframes clashR{50%{transform:translateX(-70px)}}
@media (prefers-reduced-motion:reduce){.clashL,.clashR{animation:none}}

<script>
/* Shared engine for the Many Doors books: sound, narration, the full-screen player and its interactions. */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------------- sound ---------------- */
const SND={ctx:null,m:null,nb:null,bb:null,on:store.get('md-sound')!=='0',loops:{},drone:null};
/* the drone: a quiet, slowly breathing tone on A under everything, so silence only happens on purpose. level(v,secs) fades it (0 = silent, 1 = normal). */
function makeDrone(c,dest,vol=.05){ const t=c.currentTime,g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+6); g.connect(dest);
  const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=650; lp.Q.value=.6; lp.connect(g);
  const sw=c.createOscillator(), sg=c.createGain(); sw.frequency.value=.045; sg.gain.value=260; sw.connect(sg).connect(lp.frequency); sw.start(t);
  const nodes=[sw]; [[55,'sine',.55,0],[110,'sawtooth',.16,-4],[110.3,'sawtooth',.12,3],[164.8,'sine',.12,0],[220,'sine',.1,2],[329.6,'sine',.035,-3]].forEach(([f,type,v,dt],i)=>{ const o=c.createOscillator(),og=c.createGain(); o.type=type; o.frequency.value=f; o.detune.value=dt; og.gain.value=v;
    const l=c.createOscillator(),lg=c.createGain(); l.frequency.value=.03+i*.017; lg.gain.value=v*.45; l.connect(lg).connect(og.gain); o.connect(og).connect(lp); o.start(t); l.start(t); nodes.push(o,l); });
  return {level(v,secs=2){ const n=c.currentTime; g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(Math.max(g.gain.value,.0001),n); g.gain.exponentialRampToValueAtTime(Math.max(vol*v,.0001),n+secs); },
    stop(){ this.level(0,1.5); setTimeout(()=>nodes.forEach(o=>{try{o.stop()}catch(e){}}),1700); }}; }

function aInit(){ if(SND.ctx){ if(SND.ctx.state!=='running') try{SND.ctx.resume()}catch(e){} return; }
  try{ SND.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  const c=SND.ctx; SND.m=c.createGain(); SND.m.gain.value=SND.on?.9:0; SND.m.connect(c.destination);
  const n=c.sampleRate*2; SND.nb=c.createBuffer(1,n,c.sampleRate); SND.bb=c.createBuffer(1,n,c.sampleRate);
  const w=SND.nb.getChannelData(0), b=SND.bb.getChannelData(0); let l=0;
  for(let i=0;i<n;i++){ const r=Math.random()*2-1; w[i]=r; l=(l+.02*r)/1.02; b[i]=l*3.5; }
  SND.drone=makeDrone(c,SND.m); }
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{ if(SND.ctx&&SND.ctx.state!=='running') try{SND.ctx.resume()}catch(e){} },{capture:true,passive:true}));
const T=()=>SND.ctx.currentTime;
function aEnv(g,t,p,a,d){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(p,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d); }
function tone(fr,{type='sine',peak=.12,a=.01,d=2,at=0}={}){ if(!SND.ctx) return; const c=SND.ctx,t=T()+at,o=c.createOscillator(); o.type=type; o.frequency.value=fr; const g=c.createGain(); aEnv(g,t,peak,a,d); o.connect(g).connect(SND.m); o.start(t); o.stop(t+a+d+.1); }
function nz({freq=1000,type='highpass',peak=.08,a=.003,d=.03,q=.7,brown=false}={}){ if(!SND.ctx) return; const c=SND.ctx,t=T(),s=c.createBufferSource(); s.buffer=brown?SND.bb:SND.nb; const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q; const g=c.createGain(); aEnv(g,t,peak,a,d); s.connect(f).connect(g).connect(SND.m); s.start(t,Math.random()); s.stop(t+a+d+.1); }

/* ---------------- narration ---------------- */
const VO={on:('speechSynthesis' in window)&&store.get('md-voiceon')!=='0',voice:null,list:[],rate:parseFloat(store.get('md-rate'))||.86};
function vScore(v){ let n=0; const nm=v.name.toLowerCase(); if(/natural|neural|premium|enhanced|siri/.test(nm)) n+=50; if(/online/.test(nm)) n+=20; if(/en-gb/i.test(v.lang)) n+=15; else if(/^en/i.test(v.lang)) n+=8; else n-=100;
  if(/daniel|arthur|george|ryan|thomas|oliver|guy|libby|sonia|serena|kate|martha|google uk english male/.test(nm)) n+=10;
  if(/compact|espeak|zarvox|trinoids|albert|bad news|bells|boing|bubbles|cellos|whisper|jester|organ|superstar|wobble|fred|junior|ralph/.test(nm)) n-=60; return n; }
function loadVoices(){ if(!('speechSynthesis' in window)) return; const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>vScore(b)-vScore(a)); if(!vs.length) return; VO.list=vs; const saved=store.get('md-voice'); const k=saved?vs.findIndex(v=>v.name===saved):0; VO.voice=vs[Math.max(k,0)]; }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function narrate(text){ return new Promise(res=>{ if(!VO.on||!('speechSynthesis' in window)) return res(false); try{ speechSynthesis.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(text.replace(/[“”]/g,'"')); if(VO.voice) u.voice=VO.voice; u.rate=VO.rate; u.pitch=.98;
  let done=false; const fin=()=>{ if(!done){ done=true; res(true); } }; u.onend=fin; u.onerror=fin; setTimeout(fin,Math.max(4000,text.length*95/VO.rate));

  <h3>Speed</h3><div class="vchips">${sp.map(([l,r])=>`<button type="button" class="vchip" data-r="${r}" aria-pressed="${Math.abs(VO.rate-r)<.01}">${l}</button>`).join('')}</div>
  <h3>Voice</h3>${list.length?`<ol>${list.map((v,i)=>`<li><button type="button" data-v="${i}" aria-current="${VO.voice&&v.name===VO.voice.name}">${esc(v.name.replace(/Microsoft |Google |\(.*?\)/g,''))}</button></li>`).join('')}</ol>`:'<p>No voices have loaded on this device yet.</p>'}

}
function closePlayer(silent){ const s=PS; PS=null; hush(); if(SND.ctx) allOff(.8); cvStop(); if(s){ s.el.remove(); document.body.classList.remove('insession'); if(!silent&&s.onclose) s.onclose(); } }

/* show a passage, one or two sentences at a time, each with Continue */

/* press and hold the stage */
function hold(s,{label,ms=3000,ask:q,early,onP}){ alive(s); if(q) ask(q); return new Promise(res=>{ const l=layer(); l.innerHTML=`<button type="button" class="holdzone" aria-label="${esc(label)}"><span class="holdpill"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="rgba(30,42,43,.2)" stroke-width="4"/><circle id="hr" cx="20" cy="20" r="16" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="100.5" stroke-dashoffset="100.5" transform="rotate(-90 20 20)" stroke-linecap="round"/></svg>${esc(label)}</span></button>`;

  const tick=()=>{ const p=Math.min(1,(performance.now()-t0)/ms); r.setAttribute('stroke-dashoffset',100.5*(1-p)); onP&&onP(p); if(p>=1){ done=true; if(hm){ hm.stop(true); hm=null; } z.classList.remove('on'); l.innerHTML=''; res(); return; } raf=requestAnimationFrame(tick); };

/* the sound of a press and hold: a soft hum that climbs an octave as the ring fills, a bell when it's full */

/* ---------------- sitting: a minute with a breathing ring ---------------- */
let cvRaf=0;

async function sit(s,{text,secs=60,col='#E8B13A',bg}){ alive(s); if(bg) art(bg); ask(text,'Sit'); cvBreath(col); if(SND.ctx) bowl(196,.14);
  await new Promise(res=>{ const l=layer(); l.innerHTML=`<span class="sittime">1:00</span><button type="button" class="ghost">Finish early</button>`; const tEl=l.querySelector('.sittime'); const t0=performance.now(); let iv;
    const end=()=>{ clearInterval(iv); l.innerHTML=''; res(); };
    l.querySelector('.ghost').onclick=end;
    iv=setInterval(()=>{ if(PS!==s){ clearInterval(iv); return res(); } const left=Math.max(0,secs-Math.floor((performance.now()-t0)/1000)); tEl.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`; if(left<=0){ if(SND.ctx) bowl(196,.12); end(); } },250); });
  cvStop(); alive(s); }

/* ---------------- svg helpers shared by the books ---------------- */
function rays(cx,cy,r,n,op=.2,col='#FFF6DE'){ let o=''; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2,a2=a+Math.PI/n*.6; o+=`<path d="M${cx} ${cy}L${cx+Math.cos(a)*r} ${cy+Math.sin(a)*r}L${cx+Math.cos(a2)*r} ${cy+Math.sin(a2)*r}Z" fill="${col}" opacity="${op}"/>`; } return o; }
function stars(n,seed=3,h=400,col='#FFF6DE'){ let s=seed,o=''; const r=()=>{ s=(s*9301+49297)%233280; return s/233280; }; for(let i=0;i<n;i++) o+=`<circle cx="${(r()*600).toFixed(1)}" cy="${(r()*h).toFixed(1)}" r="${(r()*1.6+.3).toFixed(2)}" fill="${col}" opacity="${(r()*.7+.2).toFixed(2)}"/>`; return o; }
function rnd(seed){ let s=seed; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
function header(B){ const h=$('#bar'); if(!h) return; h.innerHTML=`<span class="brand">${esc(B.brand)}<small>${esc(B.brandSub)}</small></span><span class="sp"></span>${(B.links||[]).filter(l=>l[1]).map(([t,u])=>`<a class="pill" href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join('')}`; }

/* The manual: a narrated, illustrated story in chapters. Each chapter is an async function that draws, speaks and asks. */
function manualLanding(B){
  const seen=JSON.parse(store.get(B.key+'-seen')||'[]'); const next=Math.min(+store.get(B.key+'-next')||0,B.chapters.length-1);
  $('#wrap').innerHTML=`<section class="hero"><div><span class="eyebrow">${esc(B.eyebrow)}</span><h1>${esc(B.title)}</h1><p class="lede">${esc(B.lede)}</p><p class="note">${esc(B.note)}</p>
    <div class="cta"><button type="button" class="btn gold" id="begin">${next?`Continue: ${esc(B.chapters[next].name)}`:'Begin'}</button>${next?`<button type="button" class="btn alt" id="restart">Start over</button>`:''}${B.walkUrl?`<a class="pill" href="${B.walkUrl}" target="_blank" rel="noopener">${esc(B.walkName)}</a>`:''}</div></div>
    <div class="cover"><svg viewBox="0 0 600 400" role="img" aria-label="${esc(B.title)}">${B.cover()}</svg></div></section>
    <section class="sec"><h2>Chapters</h2><div class="cgrid">${B.chapters.map((c,i)=>`<button type="button" class="ck${seen.includes(i)?' seen':''}" data-i="${i}" style="--c:${c.col||'var(--accent)'}"><i></i><b>${i+1}. ${esc(c.name)}</b><span>${esc(c.sub)}</span></button>`).join('')}</div></section>
    <section class="sec how"><h2>How it works</h2>${B.how.map(([a,b])=>`<div><b>${esc(a)}</b><p>${esc(b)}</p></div>`).join('')}</section>
    ${B.extra?B.extra():''}<section class="sec"><h2>Sources</h2><p class="sources">${B.sources}</p></section>`;
  $('#begin').onclick=()=>playManual(B,next);
  const r=$('#restart'); if(r) r.onclick=()=>{ store.set(B.key+'-next','0'); playManual(B,0); };
  document.querySelectorAll('.ck[data-i]').forEach(b=>b.onclick=()=>playManual(B,+b.dataset.i));
}
async function playManual(B,start){
  const menu={label:'Chapters',build:()=>`<h3>Chapters</h3><ol>${B.chapters.map((c,i)=>`<li><button type="button" data-go="${i}" aria-current="${i===s.ch}"><small>${i+1}</small>${esc(c.name)}</button></li>`).join('')}</ol>`,go:i=>playManual(B,+i)};
  const s=openPlayer({title:B.title,sub:'',steps:B.chapters.map(c=>c.short||c.name),menu,color:B.chapters[start].col});
  s.onclose=()=>manualLanding(B);
  s.el.classList.add('hasback'); s.back=()=>{ const i=s.ch||0; playManual(B,(s.n||0)>1?i:Math.max(0,i-1)); };
  try{
    for(let i=start;i<B.chapters.length;i++){ alive(s); s.ch=i; s.n=0; const c=B.chapters[i]; store.set(B.key+'-next',String(i)); stepTo(i); s.el.style.setProperty('--c',c.col||'#1F5E63');
      s.el.querySelector('.ptitle').innerHTML=`<b>${i+1} · ${esc(c.name)}</b>`; clearLayer(); cvStop();
      await c.run(s);
      const seen=new Set(JSON.parse(store.get(B.key+'-seen')||'[]')); seen.add(i); store.set(B.key+'-seen',JSON.stringify([...seen]));
      if(SND.ctx) allOff(1.2); }
    store.set(B.key+'-next','0'); alive(s);
    await B.finale(s); closePlayer();
  }catch(e){ if(!(e instanceof Abort)) console.error(e); }
}

const K='#1A1210', HIDE='#EFE2C4', RED='#B8322A', TURQ='#2E9A8E', OCHRE='#E0A82E', OBS='#2A2A33', BLUE='#4FA3B8', MAIZE='#F0C850', MARI='#F28C1E', SKIN='#C9814E', BONE='#F4EEDC', JADE='#3FA36A', DUSK='#2A1E2A', PINK='#D9667A';

<linearGradient id="under" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A1420"/><stop offset="1" stop-color="#3A2A30"/></linearGradient>
<radialGradient id="sunG"><stop offset="0" stop-color="#FFF0B0"/><stop offset=".5" stop-color="${OCHRE}" stop-opacity=".6"/><stop offset="1" stop-color="${OCHRE}" stop-opacity="0"/></radialGradient><clipPath id="cxclip"><rect width="600" height="400"/></clipPath></defs>`;

function ground(y=320,col='#5A3A2A'){ return `<rect x="0" y="${y}" width="600" height="${400-y}" fill="${col}"/><path d="M0 ${y} H600" stroke="${K}" stroke-width="3"/>${Array.from({length:12},(_,i)=>`<circle cx="${25+i*50}" cy="${y+18}" r="4" fill="${K}" opacity=".35"/>`).join('')}`; }
/* A walker in a cloak, profile-free and frontal like the other kits; the dead are pale, faces painted. */
function walker(x,y,s=1,{cloak=HIDE,skin=SKIN,dead=true,arms='down'}={}){ const ar=arms==='up'?`<path d="M-18 -74 L-30 -108 M18 -74 L30 -108" stroke="${skin}" stroke-width="8" stroke-linecap="round"/>`:arms==='offer'?`<path d="M-18 -74 Q-20 -54 0 -56 Q20 -54 18 -74" stroke="${skin}" stroke-width="8" fill="none" stroke-linecap="round"/>`:'';
  return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-12 0 V-30 M12 0 V-30" stroke="${skin}" stroke-width="9"/><path d="M-20 -28 H20 L16 -12 H-16Z" fill="${HIDE}" stroke="${K}" stroke-width="2"/><path d="M-22 -30 L-26 -86 Q0 -96 26 -86 L22 -30Z" fill="${cloak}" stroke="${K}" stroke-width="2.5"/><path d="M-24 -70 H24" stroke="${RED}" stroke-width="4"/><path d="M0 -86 L-8 -70 H8Z" fill="${RED}" stroke="${K}"/>${ar}<circle cx="0" cy="-104" r="15" fill="${dead?'#E8DCC4':skin}" stroke="${K}" stroke-width="2.5"/>${dead?`<path d="M-15 -104 H15" stroke="${K}" stroke-width="3"/>`:''}<path d="M-15 -106 Q-17 -122 0 -122 Q17 -122 15 -106 L10 -112 L4 -108 L-2 -112 L-8 -108Z" fill="${K}"/><circle cx="-5" cy="-100" r="1.8" fill="${K}"/><circle cx="5" cy="-100" r="1.8" fill="${K}"/></g>`; }

function papel(y=20){ const C=[PINK,MARI,TURQ,OCHRE,'#8A5AB8',JADE]; return `<path d="M0 ${y} Q300 ${y+16} 600 ${y}" stroke="${K}" stroke-width="1.5" fill="none"/>${Array.from({length:10},(_,i)=>`<g transform="translate(${30+i*60} ${y+4+Math.sin(i/9*Math.PI)*8})"><path d="M-22 0 H22 V34 L16 40 L10 34 L4 40 L-2 34 L-8 40 L-14 34 L-22 40Z" fill="${C[i%6]}" stroke="${K}" stroke-width="1"/><circle cx="0" cy="14" r="5" fill="${HIDE}" opacity=".8"/><path d="M-12 24 h6 M6 24 h6" stroke="${HIDE}" stroke-width="2" opacity=".8"/></g>`).join('')}`; }
function scroll(x,y,s=1,col=TURQ){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 Q20 -30 6 -50 Q-10 -66 -24 -52 Q-34 -40 -20 -32 Q-10 -28 -8 -40" stroke="${col}" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M0 0 Q20 -30 6 -50 Q-10 -66 -24 -52 Q-34 -40 -20 -32 Q-10 -28 -8 -40" stroke="${K}" stroke-width="1.5" fill="none"/>${marigold(6,-58,.5)}</g>`; }
function milkTree(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-12 0 L-8 -120 H8 L12 0Z" fill="#7A4A2A" stroke="${K}" stroke-width="3"/><circle cx="0" cy="-160" r="80" fill="${JADE}" stroke="${K}" stroke-width="3"/>${Array.from({length:9},(_,i)=>{ const a=i/9*Math.PI*2; return `<path d="M${Math.cos(a)*50} ${-160+Math.sin(a)*50} q-8 10 0 18 q8 -8 0 -18Z" fill="${BONE}" stroke="${K}" stroke-width="1.5"/>`; }).join('')}</g>`; }
function cxCover(){ return cx(`${ground(330)}${hill(110,330,.75,{col:'#4A6A5A'})}${hill(490,330,.75,{col:'#4A6A5A'})}${deathLord(300,330,1)}${xolo(190,330,.7)}${walker(420,330,.7)}`); }

/* The Nine Levels of Mictlan: the Mexica (Aztec) passage, after the Florentine Codex, the Codex Vaticanus A and the Legend of the Suns. */
const BOOK={key:'mictlan',brand:'The Nine Levels of Mictlan',brandSub:'A Mexica book of the dead',title:'The Nine Levels of Mictlan',eyebrow:'From the Florentine Codex and the painted books',
 lede:'The Mexica, the people we call the Aztecs, believed that how you died decided where you went. Most people went down to Mictlan, the place of the dead, on a four-year journey through nine levels with a small dog as their guide.',
 note:'About 30 minutes in twelve chapters. Turn the sound on; a narrator reads each page.',
 walkUrl:'../../../many-doors/aztec/walk/',walkName:'The Road Down',
 how:[['Tap to continue','Each page is read aloud. Tap Continue, or press Space, when you are ready.'],['How we know','Almost everything comes from sources written after the Spanish conquest, above all the Nahua elders who spoke to Bernardino de Sahagún in the 1550s. The names of the nine levels vary between sources.'],['A living people','Nahua communities live in Mexico today, and many of these ideas live on in their languages and in Día de Muertos. This book is a first draft that should be read by Nahua scholars and communities.'],['Your part','You choose your dog, cross the river, walk through the obsidian wind and bring your gifts to the Lord of the Dead.']],
 sources:'Bernardino de Sahagún, Florentine Codex (General History of the Things of New Spain, 1577), Book 3 appendix, tr. Arthur J. O. Anderson and Charles E. Dibble; Codex Vaticanus A (Ríos), fol. 2–3; Legend of the Suns (1558), tr. John Bierhorst; Cantares Mexicanos, tr. John Bierhorst (1985) and Miguel León-Portilla, Aztec Thought and Culture (1963).',
 cover:cxCover,
 chapters:[
 {name:'How You Die',short:'Roads',sub:'The manner of death decides',col:'#B8322A',run:async s=>{
   art(cx(`${sun(120,120,.7)}${hill(470,330,.8,{col:BLUE})}${milkTree(300,330,.6)}<rect x="40" y="300" width="180" height="60" fill="${DUSK}" stroke="${K}" stroke-width="2"/>${deathLord(130,355,.32)}`,{bg:'hide'}));
   if(SND.ctx) pad('pad',[110,165,220],.03);
   await say(s,'For the Mexica, what mattered was not how good you had been, but how you died. Sahagún\'s Nahua informants, and the painted books, describe several destinations.',{eye:'Florentine Codex, Book 3'});
   await spots(s,{ask:'Tap each place.',items:[
     {x:20,y:30,label:'The House of the Sun',say:'Warriors killed in battle or as captives went east to the House of the Sun. For four years they escorted the sun each morning to the top of the sky. Then they became hummingbirds and butterflies, drinking from flowers.'},
     {x:20,y:86,label:'Mictlan',say:'Those who died ordinary deaths, from sickness or old age, went down to Mictlan, the place of the dead. That was most people.'},
     {x:78,y:52,label:'Tlalocan',say:'Those taken by water, by drowning, lightning, or diseases linked to water went to Tlalocan, the paradise of the rain god Tlaloc, where it is always summer.'},
     {x:50,y:30,label:'The Wet-Nurse Tree',say:'Some colonial sources say babies who died before eating maize went to Chichihuacuauhco, a tree dripping with milk, where they waited to be born again.'}]});
   await say(s,'And women who died giving birth were honoured like warriors. They escorted the sun from noon to sunset, and were called the Cihuateteo, the divine women.');
 }},
 {name:'Made from Bones',short:'Bones',sub:'Quetzalcoatl steals from the dead',col:'#2E9A8E',run:async s=>{
   art(cx(`${ground(320,'#3A2A30')}${deathLord(450,320,.9)}${serpent(170,200,.6)}${bones(180,300,1)}`));
   if(SND.ctx) pad('pad',[98,147,196],.03);
   await say(s,'Mictlan is old. The Legend of the Suns says that after the last world was destroyed, the feathered serpent Quetzalcoatl went down to Mictlan to fetch the bones of the people who had lived before.',{eye:'The Legend of the Suns'});
   await say(s,'The Lord of the Dead, Mictlantecuhtli, set him an impossible test: blow a conch shell with no holes. Quetzalcoatl had worms drill holes and bees fly inside to make it sound. He took the bones and ran. A quail startled him, he fell, and the bones broke.');
   await count(s,{ask:'He ground the bones and bled on them. Tap to grind the bones.',n:4,label:'Grind',onTap:()=>{ if(SND.ctx) thud(); }});
   await say(s,'From that paste, people were made, which is why they come in all sizes: the bones had broken unevenly. The Mexica word for us, macehualtin, was read as "the deserved ones": those the gods did penance for. We are made from the dead, and we return to them.');
 }},
 {name:'The Bundle',short:'Bundle',sub:'Jade, papers and a dog',col:'#E0A82E',run:async s=>{
   art(cx(`${ground(320)}${bundle(300,320,1.1)}${jade(160,200,1)}${xolo(470,320,.8,{flip:true})}`,{bg:'hide'}));
   await say(s,'When someone died, the body was dressed, seated with knees drawn up, and wrapped in cloth into a bundle. A mask might be placed over the face.',{eye:'Florentine Codex, Book 3'});
   await say(s,'A small bead of jade, or for poorer people a green stone, was placed in the mouth. It stood for the heart, the yollotl, and some sources say it would be needed later on the road.');
   await spots(s,{ask:'Tap what goes with the dead.',items:[
     {x:27,y:50,label:'The jade bead',say:'Placed in the mouth. A heart that cannot be eaten.'},
     {x:50,y:45,label:'Papers and water',say:'Cut papers to pass the dangers on the road, and a jar of water for the journey.'},
     {x:78,y:72,label:'A dog',say:'A small reddish-yellow dog, killed and buried or burned with its master, with a loose cotton thread around its neck. It would be needed at the river.'}]});
   await say(s,'Then most bodies were burned, and the ashes buried in a jar, sometimes under the floor of the house.');
 }},
 {name:'Choose Your Dog',short:'The dog',sub:'Who will carry you across',col:'#C9814E',run:async s=>{
   art(cx(`${ground(320)}${xolo(130,320,.8,{col:BONE})}${xolo(300,320,.8,{col:'#C9814E'})}${xolo(470,320,.8,{col:OBS})}`,{bg:'hide'}));
   await say(s,'The first level of Mictlan is a wide river, the Apanohuaya. The dead cannot cross it alone. Sahagún\'s informants were precise about which dog can take you.',{eye:'The first level'});
   const i=await choose(s,'Three dogs wait on the bank. Which one will carry you?',['The white dog','The reddish-yellow dog','The black dog'],{right:1,wrong:'That dog won\'t take you. Try another.'});
   await say(s,'The white dog says: I have just washed myself, I won\'t get wet again. The black dog says: I have just got dirty, I can\'t. Only the reddish-yellow dog will carry you. The xoloitzcuintli, the hairless dog of Mexico, is still linked to this role today.');
 }},
 {name:'The River',short:'Level 1',sub:'Apanohuaya, the crossing',col:'#4FA3B8',run:async s=>{
   art(cx(`${river(230)}${hill(80,232,.5)}${hill(540,232,.5,{col:'#4A6A5A'})}<g class="drift">${xolo(260,300,.9,{swim:true})}${walker(250,262,.5)}</g>`));
   if(SND.ctx){ waterLoop(); }
   await say(s,'The dog recognises its master, jumps into the water, and swims. You hold on.',{eye:'Apanohuaya'});
   await hold(s,{label:'Hold on to the dog',ms:6000,ask:'Press and hold, and don\'t let go until the far bank.',early:'Hold on. The current is strong.'});
   loopOff('water'); if(SND.ctx) plop();
   await say(s,'You\'re across. That\'s why families kept dogs and took care of them: you never knew which one you would need.');
 }},
 {name:'Mountains and Obsidian',short:'Levels 2–3',sub:'Where the hills clash',col:'#3FA36A',run:async s=>{
   art(cx(`${ground(330,'#3A2A30')}<g class="clashL">${hill(170,330,1)}</g><g class="clashR">${hill(430,330,1,{col:'#4A6A5A'})}</g>${walker(300,340,.5)}`));
   if(SND.ctx) pad('pad',[87.3,130.8,174.6],.03);
   await say(s,'The second level is Tepeme Monamictlan, the place where the mountains crash together. The dead must slip between them, choosing the moment.',{eye:'The second level'});
   await count(s,{ask:'Wait for the gap, then go. Tap three times to run between the hills.',n:3,label:'Run',onTap:()=>{ if(SND.ctx) thud(); }});
   art(cx(`${ground(330,'#3A2A30')}${hill(300,330,1.3,{col:OBS})}${[[120,140,20],[480,120,-30],[200,80,60],[420,240,10]].map(([a,b,r])=>blade(a,b,1,r)).join('')}${walker(300,340,.5)}`));
   await say(s,'The third is Itztepetl, the obsidian mountain, its slopes covered in blades. The papers buried with the dead were meant for dangers like these.');
 }},
 {name:'The Obsidian Wind',short:'Level 4',sub:'Itzehecayan',col:'#2A2A33',run:async s=>{
   art(cx(`${ground(330,'#3A2A30')}${Array.from({length:12},(_,i)=>`<g class="drift" style="animation-duration:${2+i%4}s">${blade(40+i*48,90+(i*53)%200,.7,70+i*20)}</g>`).join('')}${walker(300,340,.6)}`));
   if(SND.ctx){ windLoop(); }
   await say(s,'The fourth level is Itzehecayan, the place of the obsidian wind. Sahagún\'s informants said a wind blows there so sharp it cuts like knives. This, they said, is why the dead were burned with their belongings: so they would have clothes to shield them.',{eye:'The fourth level'});
   await hold(s,{label:'Walk into the wind',ms:6000,ask:'Wrap your cloak around you. Press and hold to walk through.',early:'Keep your head down. Hold again.'});
   loopOff('wind');
   await say(s,'You come out the other side, cut and cold, but walking.');
 }},
 {name:'Banners and Arrows',short:'Levels 5–6',sub:'Weightless, then hunted',col:'#D9667A',run:async s=>{
   art(cx(`${ground(330,'#3A2A30')}${[100,200,400,500].map((x,i)=>`<g class="bob" style="animation-delay:${i*.4}s">${banner(x,250,1,i%2?8:-8)}</g>`).join('')}<g class="bob">${walker(300,260,.6)}</g>`));
   await say(s,'The fifth level is Pancuecuetlacayan, where the dead lose their weight and float like banners in the wind.',{eye:'The fifth level'});
   await release(s,{ask:'Become weightless. Let these go.',words:['My name','My house','My work','My worries']});
   art(cx(`${ground(330,'#3A2A30')}${[[120,120,10],[480,90,170],[160,240,-10],[440,220,190],[300,60,90]].map(([a,b,r])=>arrow(a,b,1,r)).join('')}${walker(300,340,.6)}`));
   await say(s,'The sixth is Temiminaloyan, where arrows fly at you from hands no one can see. You keep going.');
 }},
 {name:'The Jaguars',short:'Level 7',sub:'Where hearts are eaten',col:'#E0A82E',run:async s=>{
   art(cx(`${ground(330,'#3A2A30')}${jaguar(130,330,.9)}${jaguar(470,330,.9)}${walker(300,340,.6)}${jade(300,170,1)}`));
   if(SND.ctx) drum();
   await say(s,'The seventh level is Teocoyocualoyan, the place where wild beasts eat hearts. Jaguars wait there.',{eye:'The seventh level'});
   await choose(s,'What do you give them?',['The jade bead from my mouth','My own heart'],{right:0,wrong:'Your heart is what they want. Is there anything else?'});
   await say(s,'Modern retellings say this is what the jade bead was for: a heart of stone that the jaguars can\'t eat. Whether or not Sahagún\'s elders meant it that way, the jade went down with the dead, and it was green, the colour of what is precious and alive.');
 }},
 {name:'The Dark Water',short:'Level 8',sub:'Narrow paths',col:'#4FA3B8',run:async s=>{
   art(cx(`${river(300,{shells:false,col:'#1E3440'})}<path d="M0 300 Q150 280 300 300 T600 300" stroke="${OBS}" stroke-width="40" fill="none" opacity=".7"/>${walker(300,300,.55)}`,{bg:'#0E0A10'}));
   if(SND.ctx){ allOff(1); pad('pad',[73.4,110,146.8],.03); }
   await say(s,'The eighth level, Izmictlan Apochcalolca, is a place of narrow paths and dark water. It is very quiet.',{eye:'The eighth level'});
   await still(s,{ask:'Be still, and walk carefully in the dark.',ms:9000});
   await say(s,'Four years have passed since you died. The road down is long because the Mexica believed the dead deserved time.');
 }},
 {name:'The Lord of the Dead',short:'Level 9',sub:'Mictlantecuhtli and Mictecacihuatl',col:'#B8322A',run:async s=>{
   art(cx(`${ground(330,'#3A2A30')}${deathLord(210,330,1)}${deathLord(390,330,.95,{lady:true})}${walker(300,380,.45,{arms:'offer'})}`));
   if(SND.ctx) pad('pad',[98,147,196],.035);
   await say(s,'At last you reach the ninth level, Chiconahuamictlan, and stand before Mictlantecuhtli, Lord of the Dead, and his wife Mictecacihuatl, Lady of the Dead.',{eye:'The ninth level'});
   await say(s,'Sahagún\'s elders said the dead brought gifts: the papers, torches, incense and cloth burned for them by their families over four years. The Lord of the Dead received them.');
   await spots(s,{ask:'Offer your gifts. Tap each one.',items:[{x:30,y:30,label:'Incense',say:'Copal, the sweet resin still burned at Mexican altars.'},{x:70,y:30,label:'Cloth',say:'Cloaks and cloth, burned for you by your family.'},{x:50,y:62,label:'Paper',say:'Cut paper, the oldest offering of all.'}]});
   await say(s,'And then, the sources say, the dead went on into the ninth place and simply ended, or rested. Mictlan isn\'t punishment. It is the end of the road, and rest.');
 }},
 {name:'Flower and Song',short:'Feasts',sub:'The feasts of the dead',col:'#F28C1E',run:async s=>{
   art(cx(`${papel(22)}${ofrenda(300,360,1.2)}${scroll(80,330,1.2)}${scroll(520,330,1.2,PINK)}`,{bg:'#2A1A2A'}));
   if(SND.ctx){ allOff(1); pad('pad',[130.8,196,261.6],.035); chime(); }
   await say(s,'The Mexica held two months of feasts for the dead each year, the Little Feast and the Great Feast of the Dead, with offerings of food and flowers. After the conquest, these blended with the Catholic days of All Saints and All Souls into what became Día de Muertos.',{eye:'The feasts of the dead'});
   await count(s,{ask:'Build the ofrenda. Place four marigolds, cempōhualxōchitl, the flower whose scent guides the dead home.',n:4,label:'Place a flower',onTap:()=>{ if(SND.ctx) plop(); }});
   await say(s,'Nahua poets sang of death in a way that still feels close. One song, attributed to the poet-king Nezahualcoyotl, asks: Is it true that we live on earth? Not forever on earth, only a little while here. Even jade breaks, even gold cracks, even quetzal plumes are torn. Not forever on earth, only a little while here.');
 }}],
 finale:async s=>{ art(cxCover()); if(SND.ctx) chime();
   await say(s,'That is the passage: a death that decides your road, a bundle with a jade heart, a small dog at the river, mountains, blades, wind and jaguars, and four years later, rest.',{eye:'The end of the book'});
   await say(s,'The Mexica didn\'t promise reward for the good or punishment for the bad. They promised a long road, a faithful companion, and a family that would keep burning gifts for you. Only a little while here.'); }};
header({brand:BOOK.brand,brandSub:BOOK.brandSub,links:[['Many Doors','../../../many-doors/'],[BOOK.walkName,BOOK.walkUrl]]});
manualLanding(BOOK);

</script>
