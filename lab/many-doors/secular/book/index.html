<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>window.MD_HOME='../../index.html#doors'</script>
<title>The Last Light</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one full-screen "flight" — a thin instrument bar on top, the scene card in the middle, the narrator's caption card below it. Single deliberate look: the safety-card palette. */
:root{
  color-scheme: light;
  --cream:#F6EBD2; --parchment:#FBF3DF; --ink:#1E2A2B; --ink-soft:#44524F;
  --teal:#1F5E63; --teal-deep:#123D40; --brown:#8A4B22; --lamp:#F2B640;
  --red:#B8352A; --ok:#2F6B2B;
  --scene-bg: var(--cream);
  --display:'Jost', 'Futura', 'Century Gothic', sans-serif;
  --body:'Atkinson Hyperlegible', 'Verdana', sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;background:var(--scene-bg);transition:background-color 2.2s ease}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--ink);background:var(--parchment);transition:opacity 1.5s,filter 1.5s}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:.8rem;text-transform:uppercase}
#stageLabel{font-family:var(--display);font-weight:500;font-size:.85rem;color:var(--ink-soft);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stageLabel b{color:var(--brown);font-weight:700;margin-right:8px;font-variant-numeric:tabular-nums}
.tog{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:36px}
.tog[aria-pressed="false"]{background:transparent;color:var(--ink-soft);border-style:dashed}
.pick{font-family:var(--body);font-size:.8rem;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:8px;padding:6px 8px;min-height:36px;max-width:190px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pick:focus-visible,.tog:focus-visible,.btn:focus-visible,.spot:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
#stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:18px;padding-block:18px;padding-inline:16px;cursor:pointer;user-select:none}
#visual{width:100%;display:flex;justify-content:center;flex:none}
.frame{position:relative;width:min(100%, calc((100dvh - 380px) * 1.5), 980px);min-width:min(100%,300px);aspect-ratio:3/2;max-width:100%;border-radius:18px;overflow:hidden;transition:filter 3s ease, transform 3s ease}
.frame>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:filter 3s ease}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.caption{flex:none;max-width:720px;width:100%;box-sizing:border-box;background:var(--parchment);border:2px solid var(--ink);border-radius:6px;padding:16px 20px;min-height:4.6em;transition:opacity .8s, filter 1.5s, transform 1.5s, border-color 1.5s}
.caption p{margin:0;font-size:clamp(1.02rem, 2.3vw, 1.3rem);line-height:1.45;text-wrap:pretty}
.caption.quiet{background:transparent;border-color:transparent;text-align:center}
.caption.dark{background:#141413;color:var(--parchment);border-color:#141413}
.caption[hidden]{display:none!important}
#hint{margin:0;font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);opacity:0;transition:opacity .6s;min-height:1em}
#hint.on{opacity:.8;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
#choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.04em;border:2px solid var(--ink);background:var(--teal);color:var(--parchment);border-radius:999px;padding:12px 22px;cursor:pointer;min-height:48px}
.btn.alt{background:var(--parchment);color:var(--ink)}

/* dissolution: the manual's chrome comes apart; the narration always stays sharp */
body.d1 .bar{opacity:.85}
body.d2 .bar{filter:blur(.6px);opacity:.6}
body.d2 .frame{border-radius:28px}
body.d3 .bar{filter:blur(1.5px);opacity:.3}
body.d3 .frame{border-radius:40px}
body.void .bar,body.void #hint{opacity:0!important}

/* title */
.title-card{width:min(100%,640px);background:var(--teal);color:var(--parchment);border:2px solid var(--ink);border-radius:18px;padding:36px 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;align-items:flex-start;cursor:default}
.title-card .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:.75rem;color:var(--lamp);text-transform:uppercase}
.title-card h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1;text-wrap:balance;text-transform:uppercase;letter-spacing:.02em}
.title-card p{margin:0;font-size:1.05rem;line-height:1.5;max-width:46ch}
.title-card ol{margin:4px 0 8px;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;font-size:.98rem}
.title-card .btn{background:var(--lamp);color:var(--ink)}

/* hotspots */
.spot{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:3px solid #FFF3D6;background:rgba(242,182,64,.35);cursor:pointer;padding:0}
.spot::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid #FFF3D6;animation:ping 1.8s ease-out infinite}
.spot.done{opacity:0;pointer-events:none;transition:opacity .6s}
@keyframes ping{from{transform:scale(.7);opacity:.9}to{transform:scale(1.4);opacity:0}}
.heartglow{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(var(--s,0.4));background:radial-gradient(circle,#FFFBEA 0%,rgba(255,221,120,.85) 35%,rgba(255,200,80,0) 70%);transition:transform 1.2s ease;pointer-events:none}

/* breath ring */
.breath{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.6);border-radius:50%;border:4px solid var(--parchment);box-shadow:0 0 0 12px rgba(251,243,223,.15);transition:transform 1s ease-in-out, opacity 1s}

/* svg scenes */
.svgscene{position:absolute;inset:0;width:100%;height:100%}
.flicker{transform-origin:300px 262px;animation:flick 1.3s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1) skewX(0)}30%{transform:scaleY(.9) skewX(3deg)}60%{transform:scaleY(1.06) skewX(-2deg)}}
.orb-down{animation:down 7s ease-in-out forwards}
.orb-up{animation:up 7s ease-in-out forwards}
@keyframes down{to{transform:translateY(91px)}}
@keyframes up{to{transform:translateY(-55px)}}
.dots{stroke-dasharray:2 7;stroke-linecap:round}

/* guide entry */
.guide{position:absolute;inset:0;background:var(--parchment);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;gap:4%;padding:5%;box-sizing:border-box}
.guide .tag,.doorsteps .tag{display:inline-block;font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:clamp(.55rem,1.4vw,.75rem);background:var(--teal);color:var(--parchment);padding:5px 10px;border-radius:4px;text-transform:uppercase}
.guide h2{margin:10px 0 8px;font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,3.4vw,2.2rem);line-height:1.05;text-transform:uppercase;color:var(--brown);text-wrap:balance}
.guide p{margin:0;font-size:clamp(.85rem,1.8vw,1.15rem);line-height:1.45}
.guide .fig{height:100%;display:flex;align-items:center;justify-content:center;background:var(--teal);border-radius:12px;min-height:0}
.frame.guideframe{aspect-ratio:auto;width:min(100%,860px)}
.frame.guideframe .guide{position:relative;inset:auto;padding:24px;gap:24px}
.guide .fig{align-self:stretch;min-height:200px;padding:12px}
.guide .fig svg{height:220px;width:auto}
.guide .gtext{box-sizing:border-box}
.guide .gtext:focus-visible{outline:3px solid var(--lamp)}
@media (max-width:760px){
  .frame.guideframe .guide{grid-template-columns:1fr;gap:16px;padding:18px}
  .guide .fig{min-height:0}
  .guide .fig svg{height:150px}
  .guide h2{font-size:1.5rem}
  .guide p{font-size:1.02rem}
}

/* clear light */
.crack{stroke-dasharray:900;stroke-dashoffset:900;animation:crack 1.2s ease-out forwards}
@keyframes crack{to{stroke-dashoffset:0}}
.bubble{opacity:0;transform:scale(.6);transform-origin:80% 80%;transition:opacity .8s, transform .8s}
.bubble.on{opacity:1;transform:scale(1)}
.ring{position:absolute;left:49.8%;top:43%;width:8%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(242,182,64,.55);transform:translate(-50%,-50%);animation:ring 4.5s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(9);opacity:0}}


/* chapters 4-5 */
.rise{animation:rise 4.5s ease-out forwards}
@keyframes rise{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
.walk{animation:walk 9s ease-in forwards}
@keyframes walk{to{transform:translateY(-22px);opacity:.25}}
.steam path{animation:steam 2.4s ease-in-out infinite}
.steam path+path{animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
.balloon{opacity:0}
.balloon.on{animation:shout 4s ease-out forwards}
@keyframes shout{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.mug{opacity:0}
.mug.on{opacity:1;animation:shake .35s linear 2}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.drawer{transition:transform 1s ease}
.drawer.open{transform:translateX(60px)}
.page{transform-box:fill-box;transform-origin:center;animation:fly 1.6s ease-in forwards}
.page.f2{animation-delay:.35s}.page.f3{animation-delay:.7s}
@keyframes fly{to{transform:translate(160px,-190px) rotate(30deg);opacity:0}}
.glass.flash{animation:flash .9s ease}
@keyframes flash{40%{fill:#FFFFFF}}
.popped{transform-box:fill-box;transform-origin:center;animation:pop 1.2s ease 1s forwards}
@keyframes pop{to{transform:scale(1.5);opacity:0}}
.drops{opacity:0;animation:drops 1s ease 2s forwards}
@keyframes drops{to{opacity:1}}
.drawerbtn{position:absolute;background:transparent;border:2px dashed rgba(251,243,223,.75);border-radius:6px;cursor:pointer;padding:0}
.drawerbtn:hover{background:rgba(242,182,64,.2)}
.drawerbtn:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.run{background:var(--red);font-size:1.2rem;letter-spacing:.24em;text-transform:uppercase;padding:14px 34px;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.checks{position:absolute;inset:0;background:var(--parchment);padding:5%;box-sizing:border-box;display:flex;flex-direction:column;gap:4%}
.ck-head span{display:block;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(.95rem,3.4vw,2rem);color:var(--brown);letter-spacing:.03em}
.ck-head small{display:block;font-size:clamp(.7rem,1.6vw,1rem);color:var(--ink-soft);margin-top:4px}
.ck-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;flex:1}
.ck{display:flex;align-items:center;gap:6%;padding:4%;border:2px solid var(--ink);border-radius:12px;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:clamp(.7rem,1.9vw,1.15rem);line-height:1.25;text-align:left;cursor:pointer;min-width:0}
.ck:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.box{flex:none;width:clamp(18px,3vw,32px);aspect-ratio:1;border:3px solid var(--ink);border-radius:6px;position:relative;background:#FFFFFF}
.ck[aria-pressed="true"] .box{background:var(--ok)}
.ck[aria-pressed="true"] .box::after{content:"";position:absolute;left:30%;top:6%;width:28%;height:58%;border:solid #FFFFFF;border-width:0 4px 4px 0;transform:rotate(45deg)}


/* epilogue */
.duo{position:absolute;inset:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.half{position:relative;border:0;padding:0;margin:0;cursor:pointer;background:none;overflow:hidden;transition:filter .4s}
.half svg{width:100%;height:100%;display:block}
.half span{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(.68rem,1.6vw,.95rem);background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;white-space:nowrap}
.duo:hover .half:not(:hover){filter:brightness(.55)}
.half:focus-visible{outline:4px solid var(--lamp);outline-offset:-4px}
.rules{position:relative;background:var(--parchment);padding:24px;display:flex;flex-direction:column;gap:18px}
.rule-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rule{display:flex;flex-direction:column;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:12px;background:var(--cream);min-width:0}
.rule svg{width:100%;height:auto;border-radius:8px;background:#E9DDBF}
.rule b{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--teal)}
.rule p{margin:0;font-size:clamp(.9rem,1.6vw,1.05rem);line-height:1.35}
.spin{transform-origin:300px 170px;animation:spinr 40s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.bluerise{animation:brise 3s ease-out forwards}
@keyframes brise{to{opacity:.85;transform:translateY(-40px)}}

/* volume 2 */
.approach{transform-origin:300px 205px;animation:approach 9s ease-in forwards}
@keyframes approach{from{transform:scale(.8)}to{transform:scale(1.14)}}
.pulse{transform-origin:300px 205px;animation:pulseg 1.24s ease-in-out infinite}
@keyframes pulseg{50%{opacity:.12;transform:scale(.92)}}
.morph .pulse{animation:none;opacity:0;transition:opacity 1s}
.wrath{transform-origin:300px 205px;transition:transform 1.6s ease, opacity 1.4s ease}
.fl{transform-origin:300px 205px;animation:flick2 .45s ease-in-out infinite alternate}
@keyframes flick2{to{transform:scale(1.04) rotate(1.5deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.peace{opacity:0;transform-origin:300px 205px;transform:scale(.3);transition:opacity 1.6s ease .5s, transform 1.6s ease .5s}
.morph .wrath{transform:scale(.12) rotate(90deg);opacity:0}
.morph .peace{opacity:1;transform:scale(1)}
.frame.facing{transition:none;animation:shake2 .12s linear infinite}
@keyframes shake2{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.holdbtn{position:absolute;inset:0;background:transparent;border:0;padding:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.holdpill{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:8px 16px 8px 8px;font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:clamp(.72rem,1.7vw,.95rem);white-space:nowrap}
.holdpill svg{width:30px;height:30px}
.holdbtn:focus-visible .holdpill{outline:3px solid var(--lamp);outline-offset:3px}
.zone{position:absolute;background:transparent;border:2px dashed rgba(255,255,255,.55);border-radius:50%;cursor:pointer;padding:0}
.zone:focus-visible{outline:3px solid var(--lamp)}
.closing{transform-origin:300px 205px;animation:closing 10s ease-in forwards}
@keyframes closing{from{transform:scale(1.35)}to{transform:scale(.82)}}
.orbit{transform-origin:300px 210px;animation:spinr 18s linear infinite}


/* chapters menu */
#app{position:relative}
.chap{position:absolute;right:16px;top:calc(100% + 0px);z-index:20;width:min(340px,calc(100% - 32px));max-height:min(70vh,560px);overflow-y:auto;background:var(--parchment);border:2px solid var(--ink);border-radius:14px;box-shadow:0 12px 30px rgba(20,20,19,.25);padding:14px;box-sizing:border-box}
.chapwrap{position:relative;z-index:20}
.chap h3{margin:10px 6px 6px;font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brown)}
.chap h3:first-child{margin-top:2px}
.chap ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.chap button{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;background:transparent;border:0;border-radius:8px;padding:10px 8px;font-family:var(--body);font-size:1rem;color:var(--ink);cursor:pointer;min-height:44px}
.chap button:hover,.chap button:focus-visible{background:var(--cream);outline:none}
.chap button[aria-current="true"]{background:var(--cream);font-weight:700}
.chap button small{font-family:var(--display);font-weight:700;font-size:.7rem;letter-spacing:.1em;color:var(--ink-soft);min-width:2.4em;font-variant-numeric:tabular-nums}


/* volume 3 */
.streaks{animation:streak 1.1s linear infinite}
@keyframes streak{from{transform:translateX(-140px)}to{transform:translateX(140px)}}
.blown{animation:blown 2.6s ease-in-out infinite}
@keyframes blown{50%{transform:translate(40px,-8px)}}
.elgrid{position:absolute;inset:0;background:#1B2224;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;padding:6%;box-sizing:border-box}
.el{background:#2A3335;border-radius:14px;display:flex;align-items:center;justify-content:center;opacity:.22;transition:opacity .4s, transform .4s;min-height:0}
.el svg{width:62%;height:auto;max-height:90%}
.el.on{opacity:1;transform:scale(1.04)}
.peb{opacity:0}
.pebs.on .peb{animation:drop .5s ease-in forwards}
@keyframes drop{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:none}}
.mref{opacity:0;transition:opacity 1.2s}
.mref.on{opacity:1}
.approach2{transform-origin:230px 200px;animation:approach 9s ease-in forwards}
.leaf{transform-origin:20px 115px;transform:scaleX(.12);transition:transform .15s}
.doorwrap{position:relative;background:var(--parchment);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:24px;padding:24px;align-items:center}
.doorsteps ol{margin:12px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-size:clamp(.95rem,1.8vw,1.1rem);line-height:1.35}
.doorpic svg{width:100%;height:auto;max-height:260px;display:block}
.doorgrid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px;background:#10181B}
.doorcard{display:flex;flex-direction:column;gap:8px;background:var(--parchment);border:2px solid var(--ink);border-radius:12px;padding:8px;cursor:pointer;font-family:var(--body);font-size:clamp(.82rem,1.6vw,1rem);line-height:1.25;color:var(--ink);text-align:left;min-width:0}
.doorcard svg{width:100%;height:auto;border-radius:8px;display:block}
.doorcard:hover{transform:translateY(-2px)}
.doorcard.nope{opacity:.4;filter:grayscale(1)}
.doorcard:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}

/* pilot: shared production layer */
#visual{position:relative}
.leaving{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;pointer-events:none;z-index:4;animation:leave .7s ease forwards}
@keyframes leave{to{opacity:0;transform:scale(.985)}}
.entering{animation:enter .8s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{clip-path:inset(0 0 0 100% round 18px)}to{clip-path:inset(0 0 0 0 round 18px)}}
.amb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.kb{animation:kb 24s ease-out forwards;transform-origin:62% 48%}
@keyframes kb{to{transform:scale(1.09)}}
.glowspot{position:absolute;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.55) 0%,rgba(255,190,90,.18) 40%,rgba(255,190,90,0) 70%);mix-blend-mode:screen;pointer-events:none;animation:candle 2.3s steps(9,end) infinite;transition:opacity 1.2s ease}
@keyframes candle{0%{opacity:.85;transform:translate(-50%,-50%) scale(1)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}35%{opacity:.75}55%{opacity:.95;transform:translate(-50%,-50%) scale(.97)}75%{opacity:.8}100%{opacity:.9;transform:translate(-50%,-50%) scale(1.02)}}
.callout{position:absolute;z-index:3;transform:translate(-50%,-50%) scale(0);background:var(--parchment);border:2px solid var(--ink);border-radius:8px;padding:5px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards;box-shadow:0 3px 0 var(--ink);pointer-events:none;white-space:nowrap}

/* The Last Light, the full book. The door of non-belief: the view that death is simply the end of a person, and what
   people who hold it have found to comfort them, from Epicurus, Lucretius and the Cārvākas to hospice care, organ donation,
   humanist funerals and death cafés. It is written as a door with its own comfort, not as the absence of one.
   A first draft: it should be read by humanist celebrants, palliative care staff and non-religious readers. */
const BOOK={home:'view', toast:'Learned: ', pathLabel:'Path', pathTitle:'What you have learned', detourTitle:'Wrong turns you walked',
  pathNote:'Every wrong turn rewinds. There is no judge on this road, only better and worse ways to care for each other.',
  guideBack:'Back to the book', voiceSample:'Where death is, I am not.'};

/* ---------- pictures ---------- */
const PG=(inner,lab,o)=>frame(sv(sc(inner,o),lab));
const NIGHTBG='#0A0F1F', DUSKBG='#1B2550', PAPERBG='#ECE8DF';

/* ---------- sound ---------- */
Object.assign(MOODS,{ drone:()=>drone(),
  night:()=>pad('night',[98,146.83,196],.03), warm:()=>pad('warm',[110,164.81,220],.035), light:()=>pad('light',[130.81,196,261.63],.035),
  rain:()=>startLoop('rain',g=>{ const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1400; s.connect(f).connect(g); s.start(); return [s]; },.03),
  water:()=>startLoop('water',g=>{ const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=700; s.connect(f).connect(g); s.start(); return [s]; },.05) });
function tapCount(n,lab,onTap){ let k=0; choices.innerHTML=`<button class="btn" type="button" id="tc">${lab} · 0 of ${n}</button>`; const b=$('#tc'); b.focus({preventScroll:true});
  b.onclick=e=>{ e.stopPropagation(); initAudio(); k++; bell(392+k*24,.06,2.4); onTap&&onTap(k); b.textContent=`${lab} · ${k} of ${n}`; if(k>=n){ b.disabled=true; setTimeout(()=>{ choices.innerHTML=''; next(); },700); } }; }
const MON=f=>`<g id="mon">${monitor(300,130,f)}</g>`;
const ATOMS=[['Carbon','a1','The carbon goes to the soil, and into the roots of a tree.'],['Iron','a2','The iron, made in a star that blew up long ago, goes back into the earth.'],['Water','a3','The water rises as cloud and falls as rain on someone else\'s garden.'],['Calcium','a4','The calcium becomes shell, and stone, and someday bone again.']];

/* ---------- the book ---------- */
const S=[
{ key:'title', label:'', bg:NIGHTBG,
  view:()=>`<div class="title-card" role="dialog" aria-label="Start"><span class="eyebrow">Many Doors · Non-belief · the full book</span><h1>The Last Light</h1>
    <p>Many people believe nothing of them goes on after death. No heaven, no rebirth, no judge: the brain stops, and the person stops with it. That isn't an empty door. People who hold this view have spent two and a half thousand years finding ways to face death calmly, care for the dying, and keep the dead with them.</p>
    <p class="draft">A first draft, put together from philosophy, medicine and the practice of humanist and secular celebrants. Not everyone without a religion holds this view; many believe in something after death.</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="begin" type="button">Begin</button><button class="btn alt" id="pickch" type="button">Choose a chapter</button></div></div>`,

/* ===== Chapter 1 · The open door ===== */
{ key:'view', label:'The open door', bg:DUSKBG,
  view:()=>PG(`${person(300,330,1.2)}${tree(470,330,.9)}`,'A person standing alone on a hill under a clear night sky.'),
  enter(){ mood('night'); },
  guide:{title:'Who holds this view',text:"About 1.9 billion people today say they have no religion (Pew Research Center, 2025). They are a mixed group: atheists, agnostics, humanists, and many who simply don't belong anywhere. Plenty of them still believe in a soul, a god, or something after death. This book is for one view among them, held by many: that a person is a living body and brain, and when those stop, so does the person."},
  beats:[
    {text:"This door has no river to cross and no one waiting on the other side. On this map, a life is the whole of the journey."},
    {text:"People who see death this way still have to face it. They still sit with the dying, bury their dead, and grieve. This book is about how they do it."},
    {text:"Seven short chapters: an old idea, a calm philosopher, the last hours, the body's return, what lives on, the goodbye, and one life. There are wrong turns along the way. Each one rewinds."} ]},

{ key:'old', label:'An old idea', bg:PAPERBG, learn:'old',
  view:()=>PG(`${bookF(150,220,1)}${bookF(300,190,1.1)}${bookF(450,220,1)}`,'Three open books under the night sky.',{ground:false}),
  enter(){ mood('warm'); },
  guide:{title:'Three ancient doubters',text:"In India, the Cārvāka or Lokāyata school taught that only this world exists. A medieval summary of their views, translated by E. B. Cowell and A. E. Gough in 1882, quotes them: \"While life is yours, live joyously; none can escape Death's searching eye.\" In Greece, Epicurus (341 to 270 BCE) taught that the soul is made of atoms that scatter at death. In Han China, Wang Chong (about 27 to 97 CE) argued in his Lunheng that the dead do not become ghosts, since nothing remains to make one."},
  beats:[
    {text:"The idea that death is simply the end is old. It turns up in ancient India, Greece and China, each time in thinkers who looked hard at the world and found no sign of a beyond."},
    {text:"Tap the three books.", lock:true, afterType(){ tapAll([
      [25,48,'India','India: the Cārvākas taught that only this world is real. "While life is yours, live joyously."'],
      [50,40,'Greece','Greece: Epicurus said the soul is made of atoms, and at death they simply scatter.'],
      [75,48,'China','China: Wang Chong argued the dead can\'t become ghosts, because nothing is left to make one.'] ]); }} ]},

/* ===== Chapter 2 · The garden ===== */
{ key:'garden', label:"Epicurus' garden", bg:DUSKBG, learn:'tetra',
  view:()=>PG(`${garden()}${person(300,330,.9)}${person(370,330,.8,{sit:true})}`,'A garden between two white columns, with friends sitting among the trees.'),
  enter(){ mood('warm'); },
  guide:{title:'The fourfold cure',text:"Epicurus taught in a garden outside Athens, and anyone could come: women, slaves and the poor among them. His follower Philodemus boiled the teaching down to four lines, later called the tetrapharmakos, the fourfold cure: Don't fear the gods. Don't worry about death. What is good is easy to get. What is terrible is easy to endure."},
  beats:[
    {text:"In a garden outside Athens, about 300 years before Christ, Epicurus taught his friends how to be happy. The biggest thing in the way, he said, is the fear of death."},
    {text:"His followers kept a four-line cure. Tap each line.", lock:true, afterType(){ tapAll([
      [22,30,'The gods','Don\'t fear the gods. If they exist at all, they aren\'t waiting to punish you.'],
      [78,30,'Death','Don\'t worry about death. "Where death is, I am not; where I am, death is not."'],
      [35,62,'The good','What is good is easy to get: bread, water, friends, a quiet mind.'],
      [65,62,'The terrible','What is terrible is easy to endure. Great pain is short, and long pain is mild.'] ]); }} ]},

{ key:'fear', label:"Epicurus' garden", bg:DUSKBG,

{ key:'fear2', label:"Epicurus' garden", bg:DUSKBG,

{ key:'mirror', label:"Lucretius' mirror", bg:NIGHTBG, learn:'mirror',
  view:()=>PG(`<g id="mir">${mirrorF(300,190,90,atoms(30,4,{cx:0,cy:0,r:70}))}</g>`,'An oval mirror in the dark, with faint specks of light inside it.',{ground:false}),
  enter(){ mood('night'); },
  guide:{title:'On the Nature of Things',text:"Lucretius, a Roman poet of the first century BCE, put Epicurus' teaching into a long poem, De Rerum Natura. In Book Three he asks the reader to look back at the endless time before they were born. It didn't trouble us then, he says. \"Nature holds this up to us as a mirror of the time to come after our death.\" Philosophers call this the symmetry argument, and they still argue about whether it works."},
  beats:[
    {text:"Two hundred years later, the Roman poet Lucretius gave the idea a picture. Think of all the time before you were born."},
    {text:"Billions of years went by without you. Press and hold, and look back across them.", lock:true, afterType(){ holdOn({label:'Look back',ms:5000,
      onProgress:p=>{ const m=$('#mir'); if(m) m.innerHTML=mirrorF(300,190,90,atoms(Math.round(10+p*60),4,{cx:0,cy:0,r:70})+(p>.95?person(0,60,.5,{glow:true}):'')); }}); }},
    {text:"You didn't mind a single one of those years. Lucretius said the time after your death is the same, like a mirror held up to the time before."} ]},

/* ===== Chapter 3 · The last hours ===== */
{ key:'hospice', label:'The last hours', bg:PAPERBG, learn:'matter',
  view:()=>PG(`${bed(300,300)}${person(470,330,.9,{sit:true})}${candle(140,320,.8)}`,'A bed in a quiet room. Someone sits beside it.',{ground:false,sky:'#2A3352'}),
  enter(){ mood('warm'); },
  guide:{title:'You matter to the end',text:"Dame Cicely Saunders, a nurse and doctor, founded St Christopher's Hospice in London in 1967, and with it the modern hospice movement. She was herself a Christian, but she built care that serves everyone: pain controlled well, families welcomed, and the dying person treated as a whole person. Her best-known words: \"You matter because you are you, and you matter to the end of your life.\" Hospice and palliative care now help people of every faith and none."},
  beats:[
    {text:"Most deaths today don't come suddenly. They come slowly, in a bed, with time to talk. How those hours are spent matters a great deal, whatever anyone believes comes after."},
    {text:"Hospice nurses say the same few things matter most: no pain, no fear of being alone, and being told the truth, gently."},
    {text:"Your father is dying. One evening he asks you straight out: \"Am I dying?\"", lock:true, afterType(){ pick([{label:'Change the subject and keep his spirits up',go:'x_hide'},{label:'Ask what he wants to know, and stay with him'}]); }} ]},

{ key:'hospice2', label:'The last hours', bg:PAPERBG,
  view:()=>PG(`${bed(300,300)}${hands(330,250,.7)}${person(470,330,.9,{sit:true,glow:true})}${candle(140,320,.8)}`,'Two hands held together over the edge of the bed.',{ground:false,sky:'#2A3352'}),
  enter(){ mood('warm'); },
  beats:[
    {text:"You ask him what he'd like to know. He says he guessed already. Then he talks about his brother, and a lake they swam in as boys. You hold his hand."},
    {text:"With no next world to prepare for, these hours are the last chapter, not a waiting room. Many people find that makes them easier to spend well."} ]},

{ key:'brain', label:'The flat line', bg:NIGHTBG, learn:'brain',
  view:()=>PG(`${bed(300,320)}${MON(0)}`,'A heart and brain monitor above a bed. The line is moving.',{ground:false}),
  enter(){ mood('drone'); },
  guide:{title:'What science sees, and what it doesn\'t know',text:"When the heart stops, blood stops reaching the brain, and within seconds to minutes its electrical activity fades. In a few dying patients, researchers have recorded a short burst of organised activity just after the heart stopped (Jimo Borjigin and colleagues, 2023). About one in ten people revived from cardiac arrest report a near-death experience: light, peace, a life review (Sam Parnia's AWARE studies, 2014 and 2023). People who hold this door's view see these as the dying brain's own last events. Others see them as a glimpse of something more. The research goes on."},
  beats:[
    {text:"Here is what doctors see. The heart stops. With no blood coming, the brain falls quiet within minutes."},
    {text:"Press and hold, and stay with him while the line goes still.", lock:true, afterType(){ let last=-1; holdOn({label:'Stay with him',ms:6000,
      onProgress:p=>{ const f=Math.round(p*20)/20; if(f===last) return; last=f; const m=$('#mon'); if(m) m.innerHTML=monitor(300,130,f); }}); }},
    {text:"A flat line. Some people who are brought back describe light and peace in those last minutes. On this door's map, those are the brain's own final moments, and then the person is gone."},
    {text:"That is the whole crossing: no river and no bridge. Just a quiet room, and the people who stayed."} ]},

{ key:'donor', label:'The gift', bg:DUSKBG, learn:'gift',

  beats:[

/* ===== Chapter 4 · Back to the world ===== */
{ key:'atoms', label:'Star stuff', bg:NIGHTBG, learn:'return',

/* ===== Chapter 5 · What lives on ===== */
{ key:'ripples', label:'Ripples', bg:DUSKBG, learn:'ripple',

{ key:'bonds', label:'Love goes on', bg:PAPERBG, learn:'bonds',
  view:()=>PG(`${table(300,280,220)}<rect x="270" y="236" width="44" height="44" fill="${STAR}" stroke="${K}" stroke-width="2"/>${person(296,272,.28)}${person(170,330,.95,{sit:true})}${candle(380,280,.6)}`,'A woman sitting by a small table with a framed photograph and a candle.',{sky:'#2A3352',ground:false}),
  enter(){ mood('warm'); },
  guide:{title:'Continuing bonds',text:"For much of the twentieth century, grief experts said that healthy mourning meant letting go of the dead and moving on. In 1996, Dennis Klass, Phyllis Silverman and Steven Nickman's book Continuing Bonds changed that. Studying the bereaved, they found that most people keep a relationship with the dead, in memory, conversation and habit, and that this is normal and often healthy. You don't need to believe the dead can hear you to keep loving them."},
  beats:[
    {text:"A year after her husband died, Ruth still tells his photo about her day. She doesn't think he hears her. She just likes to."},
    {text:"Her friends are worried. What do you tell her?", lock:true, afterType(){ pick([{label:'It\'s time to put the photo away and move on',go:'x_moveon'},{label:'That\'s normal. Love doesn\'t end at a death'}]); }} ]},

{ key:'bonds2', label:'Love goes on', bg:PAPERBG,
  view:()=>PG(`${table(300,280,220)}<rect x="270" y="236" width="44" height="44" fill="${STAR}" stroke="${K}" stroke-width="2"/>${person(296,272,.28)}${person(170,330,.95,{sit:true,glow:true})}${candle(380,280,.6)}`,'The woman by the photograph, smiling.',{sky:'#2A3352',ground:false}),

/* ===== Chapter 6 · The goodbye ===== */
{ key:'funeral', label:'The goodbye', bg:DUSKBG, learn:'story',
  view:()=>PG(`${candle(300,300,1.2)}${person(150,330,.8)}${person(220,330,.75)}${person(380,330,.75)}${person(450,330,.8)}`,'People gathered around a single candle.',{sky:'dawn'}),
  enter(){ mood('warm'); },
  guide:{title:'Humanist and secular funerals',text:"A humanist or secular funeral is built around one life. A celebrant, often trained by a group like Humanists UK, meets the family, then writes and leads a ceremony with the person's story, music they loved, readings and tributes. There are no prayers, but there is usually a quiet moment in which religious guests are free to pray in their own way. In England and Wales, many thousands of humanist funerals are held each year."},
  beats:[
    {text:"Without a religion, people still gather. A humanist funeral has no prayers and no promises of a next life. It has one life, told well."},
    {text:"You're helping plan your father's funeral. The celebrant asks what it should be.", lock:true, afterType(){ pick([{label:'Something standard. Use the usual script',go:'x_generic'},{label:'His story: the lake, the jokes, the people he loved'}]); }} ]},

{ key:'funeral2', label:'The goodbye', bg:DUSKBG,
  view:()=>PG(`${candle(300,300,1.2)}${person(150,330,.8,{glow:true})}${person(220,330,.75)}${person(380,330,.75)}${person(450,330,.8)}`,'One person speaks while others listen.',{sky:'dawn'}),
  enter(){ mood('warm'); },
  beats:[
    {text:"His brother tells the story of the lake. Everyone laughs at the part about the borrowed boat. His favourite song plays."},
    {text:"Then there is a moment of quiet, for each person to think about him in their own way. Press and hold for the silence.", lock:true, afterType(){ holdOn({label:'A moment of silence',ms:7000}); }},
    {text:"Almost every funeral in the world, religious or not, has a silence somewhere. It may be the one rite everyone shares."} ]},

{ key:'cafe', label:'Tea and death', bg:PAPERBG, learn:'talk',
  view:()=>PG(`${table(300,280,320)}${cup(200,280)}${cup(300,280,1,EMBER)}${cup(400,280,1,LEAF)}${person(130,330,.85,{sit:true})}${person(470,330,.85,{sit:true})}`,'A café table with three cups of tea and people sitting around it.',{sky:'#3D5A99',ground:false}),
  enter(){ mood('warm','rain'); },
  guide:{title:'Death cafés and death doulas',text:"In 2011 Jon Underwood held the first Death Café in his house in London, after the Swiss sociologist Bernard Crettaz's cafés mortels. The idea is simple: strangers meet over tea and cake to talk about death, with no agenda and nothing to sell. Thousands have now been held in more than 80 countries. At the same time, end-of-life doulas have grown in number: trained companions who help the dying and their families plan, talk, and keep vigil, whatever they believe."},
  beats:[
    {text:"Many people go their whole lives without saying out loud what they want at the end. In 2011, a man in London invited strangers round for tea, cake and a talk about death."},
    {text:"It caught on. Pick up each cup and hear what people ask.", lock:true, afterType(){ tapAll([
      [33,62,'Cup one','"What are you most afraid of?" Usually not being dead. Usually pain, or being a burden, or leaving someone alone.'],
      [50,62,'Cup two','"Where would you want to die?" Most people say at home. Fewer than half do.'],
      [67,62,'Cup three','"Who knows what you want?" Often, no one. Saying it once, out loud, is a gift to the people who will have to decide.'] ]); }} ]},

/* ===== Chapter 7 · One life ===== */
{ key:'forever', label:'One life', bg:NIGHTBG,
  view:()=>PG(`${person(300,330,1.1,{glow:true})}${stars(40,41,300,EMBER)}`,'A figure under a sky full of stars.'),
  enter(){ mood('night'); },
  guide:{title:'The Makropulos case',text:"In 1973 the philosopher Bernard Williams wrote about Elina Makropulos, a character in a play by Karel Čapek who has lived for 342 years and has grown cold and bored with everything. Williams argued that a life without end would sooner or later lose its shape and its point. Other philosophers, like John Martin Fischer, disagree, and think an endless life could stay good. Either way, the question is an old one: does an ending give a life its meaning?"},
  beats:[
    {text:"Here is a question philosophers have argued over for fifty years. If you could, would you live forever?", lock:true, afterType(){ pick([{label:'Yes, I would'},{label:'No, I don\'t think so'}]); }},
    {text:"There's no wrong answer. Bernard Williams thought an endless life would grow tired and lose its shape. Others think it could stay good forever."},
    {text:"For many people on this map, the ending is what makes the days count. A life is precious partly because there is only one."} ]},

{ key:'river', label:'The river and the sea', bg:DUSKBG, learn:'river',
  view:()=>PG(`<g id="rv">${riverSea(0)}</g>${tree(110,330,.6)}`,'A small river winding towards a distant sea.',{sky:'dawn',ground:false}),
  enter(){ mood('light','water'); },
  guide:{title:'Like a river',text:"In a short 1951 essay, \"How to Grow Old\", the philosopher Bertrand Russell, who did not believe in an afterlife, compared a human life to a river: narrow and rushing at first, then wider and calmer, until it flows into the sea without any visible break, and loses itself there without pain. For him, the best way to face death was to care about things larger than yourself, so your own life seemed less and less to matter alone."},
  beats:[
    {text:"The philosopher Bertrand Russell, who expected nothing after death, said a good life is like a river."},
    {text:"Small at first, and rushing. Then wider, slower, calmer. Press and hold, and follow it down.", lock:true, afterType(){ holdOn({label:'Follow the river',ms:6000,
      onProgress:p=>{ const r=$('#rv'); if(r) r.innerHTML=riverSea(p); }}); }},
    {text:"In the end it meets the sea with no break at all, and simply becomes part of something bigger. That was the comfort he found, and passed on."} ]},

{ key:'lastpage', label:'The last page', bg:NIGHTBG,
  view:()=>frame(sv(scCover(),'A person and a tree under a starry night, a soft light around them.')),
  enter(){ mood('light'); },
  beats:[
    {text:"No beyond, and still so much to do: face the fear calmly, tell the dying the truth, give away what the body no longer needs, hand the atoms back, keep the dead in the living, and tell one life's story well."},
    {text:"One life, lived once. On this map, that's exactly what makes it precious."} ]},

{ key:'end', label:'The end', bg:'var(--teal)',
  view:()=>`<div class="title-card" style="cursor:default"><span class="eyebrow">The end of the book</span><h1>The Last Light</h1>
    <p>That was the door of non-belief: Epicurus' garden and Lucretius' mirror, the last hours and the flat line, the gift of donation, the body's return, rippling and continuing bonds, the humanist goodbye, and Russell's river.</p><p id="endsum" style="font-weight:700"></p>
    <p class="draft">A first draft, which should be read by humanist celebrants, palliative care staff and non-religious readers. Sources include: Epicurus, Letter to Menoeceus; Lucretius, De Rerum Natura, Book III; the Sarva-Darśana-Saṃgraha, trans. E. B. Cowell and A. E. Gough (1882); Wang Chong, Lunheng; Cicely Saunders, Watch with Me (2003); J. Borjigin and others, PNAS (2023); S. Parnia and others, Resuscitation (2014, 2023); Carl Sagan, Cosmos (1980); Irvin Yalom, Staring at the Sun (2008); D. Klass, P. Silverman and S. Nickman, Continuing Bonds (1996); Bernard Williams, "The Makropulos Case" (1973); Bertrand Russell, "How to Grow Old" (1951); Humanists UK on non-religious funerals; deathcafe.com.</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="again" type="button">Read it again</button><button class="btn alt" id="pathend" type="button">See your path</button><button class="btn alt" id="chend" type="button">Choose a chapter</button></div>
    <div class="endlinks"><a href="../walk/">Walk Seven Ordinary Days</a><a href="../../index.html#doors">Back to Many Doors</a></div></div>`,
  enter(){ mood('warm'); $('#again').onclick=e=>{ e.stopPropagation(); go(0); }; $('#chend').onclick=e=>{ e.stopPropagation(); openChapters(true); }; $('#pathend').onclick=e=>{ e.stopPropagation(); openPath(); };
    $('#endsum').textContent=`You learned ${journey.learned.size} of ${LESSONS.length} lessons and walked ${journey.visited.size} of ${DETOURS.length} wrong turns.`+(journey.learned.size===LESSONS.length?' You know the way.':' Read again to learn the rest.'); },
  beats:[{text:null,lock:true}] },

/* ===== wrong turns ===== */
{ key:'x_avoid', label:'A wrong turn', bg:'#2A3352',
  view:()=>PG(`${person(300,330,1,{sit:true,col:'#9AA3B8'})}<circle cx="300" cy="200" r="120" fill="#0A0F1F" opacity=".6"/>`,'The worried friend, a dark cloud growing over him.',{ground:false}),
  enter(){ mood('drone'); },
  beats:[
    {text:"He tries never to think of it. But the fear comes back at night, bigger each time, because he has never looked at it in daylight."},
    {text:"Epicurus said the opposite: \"get used to\" the thought, until you see there's nothing in it to fear. Rewind, and think it through.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_hide', label:'A wrong turn', bg:'#2A3352',
  view:()=>PG(`${bed(300,300)}${person(470,330,.9,{col:'#9AA3B8'})}`,'The bed, and a visitor standing at the door, turned away.',{ground:false,sky:'#1B2550'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"You talk about the weather and the football. He stops asking. Over the next days he grows quiet, and there are things neither of you ever says."},
    {text:"Hospice workers hear this regret often. Most dying people already sense the truth, and being kept from it can leave them alone with it. Rewind, and ask him.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_moveon', label:'A wrong turn', bg:'#4A4E5A',
  view:()=>PG(`${table(300,280,220)}${person(170,330,.95,{sit:true,col:'#9AA3B8'})}`,'The table without the photograph. The woman sits alone.',{sky:'#2A3352',ground:false}),
  enter(){ mood('drone'); },
  beats:[
    {text:"Ruth puts the photo in a drawer, to make her friends happy. Now she feels she has lost him twice."},
    {text:"Grief experts used to say mourning meant cutting ties with the dead. Most now say keeping a bond is normal. Rewind, and let her keep him.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_generic', label:'A wrong turn', bg:'#4A4E5A',
  view:()=>PG(`<rect x="200" y="160" width="200" height="140" fill="#9AA3B8" stroke="${K}" stroke-width="2"/>${[170,240,360,430].map(x=>person(x,330,.7,{col:'#9AA3B8'})).join('')}`,'A plain room with a blank sign. The mourners look at their watches.',{ground:false,sky:'#3A3E4A'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"Twenty minutes, a reading nobody chose, and a name read out twice. People leave saying it could have been for anyone."},
    {text:"Without a promise of a next life, the story of this life is the whole point of the goodbye. Rewind, and tell his story.", lock:true, afterType(){ rewindButton(); }} ]}
];
