<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>window.MD_HOME='../../index.html#doors'</script>
<title>The Drum and the Road</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Jost:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one full-screen "flight" — a thin instrument bar on top, the scene card in the middle, the narrator's caption card below it. Single deliberate look: the safety-card palette. */
:root{
  color-scheme: light;
  --cream:#F6EBD2; --parchment:#FBF3DF; --ink:#1E2A2B; --ink-soft:#44524F;
  --teal:#1F5E63; --teal-deep:#123D40; --brown:#8A4B22; --lamp:#F2B640;
  --red:#B8352A; --ok:#2F6B2B;
  --scene-bg: var(--cream);
  --display:'Jost', 'Futura', 'Century Gothic', sans-serif;
  --body:'Atkinson Hyperlegible', 'Verdana', sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;background:var(--scene-bg);transition:background-color 2.2s ease}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--ink);background:var(--parchment);transition:opacity 1.5s,filter 1.5s}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:.8rem;text-transform:uppercase}
#stageLabel{font-family:var(--display);font-weight:500;font-size:.85rem;color:var(--ink-soft);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stageLabel b{color:var(--brown);font-weight:700;margin-right:8px;font-variant-numeric:tabular-nums}
.tog{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:36px}
.tog[aria-pressed="false"]{background:transparent;color:var(--ink-soft);border-style:dashed}
.pick{font-family:var(--body);font-size:.8rem;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:8px;padding:6px 8px;min-height:36px;max-width:190px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pick:focus-visible,.tog:focus-visible,.btn:focus-visible,.spot:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
#stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:18px;padding-block:18px;padding-inline:16px;cursor:pointer;user-select:none}
#visual{width:100%;display:flex;justify-content:center;flex:none}
.frame{position:relative;width:min(100%, calc((100dvh - 380px) * 1.5), 980px);min-width:min(100%,300px);aspect-ratio:3/2;max-width:100%;border-radius:18px;overflow:hidden;transition:filter 3s ease, transform 3s ease}
.frame>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:filter 3s ease}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.caption{flex:none;max-width:720px;width:100%;box-sizing:border-box;background:var(--parchment);border:2px solid var(--ink);border-radius:6px;padding:16px 20px;min-height:4.6em;transition:opacity .8s, filter 1.5s, transform 1.5s, border-color 1.5s}
.caption p{margin:0;font-size:clamp(1.02rem, 2.3vw, 1.3rem);line-height:1.45;text-wrap:pretty}
.caption.quiet{background:transparent;border-color:transparent;text-align:center}
.caption.dark{background:#141413;color:var(--parchment);border-color:#141413}
.caption[hidden]{display:none!important}
#hint{margin:0;font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);opacity:0;transition:opacity .6s;min-height:1em}
#hint.on{opacity:.8;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
#choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.04em;border:2px solid var(--ink);background:var(--teal);color:var(--parchment);border-radius:999px;padding:12px 22px;cursor:pointer;min-height:48px}
.btn.alt{background:var(--parchment);color:var(--ink)}

/* dissolution: the manual's chrome comes apart; the narration always stays sharp */
body.d1 .bar{opacity:.85}
body.d2 .bar{filter:blur(.6px);opacity:.6}
body.d2 .frame{border-radius:28px}
body.d3 .bar{filter:blur(1.5px);opacity:.3}
body.d3 .frame{border-radius:40px}
body.void .bar,body.void #hint{opacity:0!important}

/* title */
.title-card{width:min(100%,640px);background:var(--teal);color:var(--parchment);border:2px solid var(--ink);border-radius:18px;padding:36px 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;align-items:flex-start;cursor:default}
.title-card .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:.75rem;color:var(--lamp);text-transform:uppercase}
.title-card h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1;text-wrap:balance;text-transform:uppercase;letter-spacing:.02em}
.title-card p{margin:0;font-size:1.05rem;line-height:1.5;max-width:46ch}
.title-card ol{margin:4px 0 8px;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;font-size:.98rem}
.title-card .btn{background:var(--lamp);color:var(--ink)}

/* hotspots */
.spot{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:3px solid #FFF3D6;background:rgba(242,182,64,.35);cursor:pointer;padding:0}
.spot::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid #FFF3D6;animation:ping 1.8s ease-out infinite}
.spot.done{opacity:0;pointer-events:none;transition:opacity .6s}
@keyframes ping{from{transform:scale(.7);opacity:.9}to{transform:scale(1.4);opacity:0}}
.heartglow{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(var(--s,0.4));background:radial-gradient(circle,#FFFBEA 0%,rgba(255,221,120,.85) 35%,rgba(255,200,80,0) 70%);transition:transform 1.2s ease;pointer-events:none}

/* breath ring */
.breath{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.6);border-radius:50%;border:4px solid var(--parchment);box-shadow:0 0 0 12px rgba(251,243,223,.15);transition:transform 1s ease-in-out, opacity 1s}

/* svg scenes */
.svgscene{position:absolute;inset:0;width:100%;height:100%}
.flicker{transform-origin:300px 262px;animation:flick 1.3s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1) skewX(0)}30%{transform:scaleY(.9) skewX(3deg)}60%{transform:scaleY(1.06) skewX(-2deg)}}
.orb-down{animation:down 7s ease-in-out forwards}
.orb-up{animation:up 7s ease-in-out forwards}
@keyframes down{to{transform:translateY(91px)}}
@keyframes up{to{transform:translateY(-55px)}}
.dots{stroke-dasharray:2 7;stroke-linecap:round}

/* guide entry */
.guide{position:absolute;inset:0;background:var(--parchment);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;gap:4%;padding:5%;box-sizing:border-box}
.guide .tag,.doorsteps .tag{display:inline-block;font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:clamp(.55rem,1.4vw,.75rem);background:var(--teal);color:var(--parchment);padding:5px 10px;border-radius:4px;text-transform:uppercase}
.guide h2{margin:10px 0 8px;font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,3.4vw,2.2rem);line-height:1.05;text-transform:uppercase;color:var(--brown);text-wrap:balance}
.guide p{margin:0;font-size:clamp(.85rem,1.8vw,1.15rem);line-height:1.45}
.guide .fig{height:100%;display:flex;align-items:center;justify-content:center;background:var(--teal);border-radius:12px;min-height:0}
.frame.guideframe{aspect-ratio:auto;width:min(100%,860px)}
.frame.guideframe .guide{position:relative;inset:auto;padding:24px;gap:24px}
.guide .fig{align-self:stretch;min-height:200px;padding:12px}
.guide .fig svg{height:220px;width:auto}
.guide .gtext{box-sizing:border-box}
.guide .gtext:focus-visible{outline:3px solid var(--lamp)}
@media (max-width:760px){
  .frame.guideframe .guide{grid-template-columns:1fr;gap:16px;padding:18px}
  .guide .fig{min-height:0}
  .guide .fig svg{height:150px}
  .guide h2{font-size:1.5rem}
  .guide p{font-size:1.02rem}
}

/* clear light */
.crack{stroke-dasharray:900;stroke-dashoffset:900;animation:crack 1.2s ease-out forwards}
@keyframes crack{to{stroke-dashoffset:0}}
.bubble{opacity:0;transform:scale(.6);transform-origin:80% 80%;transition:opacity .8s, transform .8s}
.bubble.on{opacity:1;transform:scale(1)}
.ring{position:absolute;left:49.8%;top:43%;width:8%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(242,182,64,.55);transform:translate(-50%,-50%);animation:ring 4.5s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(9);opacity:0}}


/* chapters 4-5 */
.rise{animation:rise 4.5s ease-out forwards}
@keyframes rise{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
.walk{animation:walk 9s ease-in forwards}
@keyframes walk{to{transform:translateY(-22px);opacity:.25}}
.steam path{animation:steam 2.4s ease-in-out infinite}
.steam path+path{animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
.balloon{opacity:0}
.balloon.on{animation:shout 4s ease-out forwards}
@keyframes shout{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.mug{opacity:0}
.mug.on{opacity:1;animation:shake .35s linear 2}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.drawer{transition:transform 1s ease}
.drawer.open{transform:translateX(60px)}
.page{transform-box:fill-box;transform-origin:center;animation:fly 1.6s ease-in forwards}
.page.f2{animation-delay:.35s}.page.f3{animation-delay:.7s}
@keyframes fly{to{transform:translate(160px,-190px) rotate(30deg);opacity:0}}
.glass.flash{animation:flash .9s ease}
@keyframes flash{40%{fill:#FFFFFF}}
.popped{transform-box:fill-box;transform-origin:center;animation:pop 1.2s ease 1s forwards}
@keyframes pop{to{transform:scale(1.5);opacity:0}}
.drops{opacity:0;animation:drops 1s ease 2s forwards}
@keyframes drops{to{opacity:1}}
.drawerbtn{position:absolute;background:transparent;border:2px dashed rgba(251,243,223,.75);border-radius:6px;cursor:pointer;padding:0}
.drawerbtn:hover{background:rgba(242,182,64,.2)}
.drawerbtn:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.run{background:var(--red);font-size:1.2rem;letter-spacing:.24em;text-transform:uppercase;padding:14px 34px;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.checks{position:absolute;inset:0;background:var(--parchment);padding:5%;box-sizing:border-box;display:flex;flex-direction:column;gap:4%}
.ck-head span{display:block;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(.95rem,3.4vw,2rem);color:var(--brown);letter-spacing:.03em}
.ck-head small{display:block;font-size:clamp(.7rem,1.6vw,1rem);color:var(--ink-soft);margin-top:4px}
.ck-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;flex:1}
.ck{display:flex;align-items:center;gap:6%;padding:4%;border:2px solid var(--ink);border-radius:12px;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:clamp(.7rem,1.9vw,1.15rem);line-height:1.25;text-align:left;cursor:pointer;min-width:0}
.ck:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.box{flex:none;width:clamp(18px,3vw,32px);aspect-ratio:1;border:3px solid var(--ink);border-radius:6px;position:relative;background:#FFFFFF}
.ck[aria-pressed="true"] .box{background:var(--ok)}
.ck[aria-pressed="true"] .box::after{content:"";position:absolute;left:30%;top:6%;width:28%;height:58%;border:solid #FFFFFF;border-width:0 4px 4px 0;transform:rotate(45deg)}


/* epilogue */
.duo{position:absolute;inset:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.half{position:relative;border:0;padding:0;margin:0;cursor:pointer;background:none;overflow:hidden;transition:filter .4s}
.half svg{width:100%;height:100%;display:block}
.half span{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(.68rem,1.6vw,.95rem);background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;white-space:nowrap}
.duo:hover .half:not(:hover){filter:brightness(.55)}
.half:focus-visible{outline:4px solid var(--lamp);outline-offset:-4px}
.rules{position:relative;background:var(--parchment);padding:24px;display:flex;flex-direction:column;gap:18px}
.rule-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rule{display:flex;flex-direction:column;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:12px;background:var(--cream);min-width:0}
.rule svg{width:100%;height:auto;border-radius:8px;background:#E9DDBF}
.rule b{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--teal)}
.rule p{margin:0;font-size:clamp(.9rem,1.6vw,1.05rem);line-height:1.35}
.spin{transform-origin:300px 170px;animation:spinr 40s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.bluerise{animation:brise 3s ease-out forwards}
@keyframes brise{to{opacity:.85;transform:translateY(-40px)}}

/* volume 2 */
.approach{transform-origin:300px 205px;animation:approach 9s ease-in forwards}
@keyframes approach{from{transform:scale(.8)}to{transform:scale(1.14)}}
.pulse{transform-origin:300px 205px;animation:pulseg 1.24s ease-in-out infinite}
@keyframes pulseg{50%{opacity:.12;transform:scale(.92)}}
.morph .pulse{animation:none;opacity:0;transition:opacity 1s}
.wrath{transform-origin:300px 205px;transition:transform 1.6s ease, opacity 1.4s ease}
.fl{transform-origin:300px 205px;animation:flick2 .45s ease-in-out infinite alternate}
@keyframes flick2{to{transform:scale(1.04) rotate(1.5deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.peace{opacity:0;transform-origin:300px 205px;transform:scale(.3);transition:opacity 1.6s ease .5s, transform 1.6s ease .5s}
.morph .wrath{transform:scale(.12) rotate(90deg);opacity:0}
.morph .peace{opacity:1;transform:scale(1)}
.frame.facing{transition:none;animation:shake2 .12s linear infinite}
@keyframes shake2{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.holdbtn{position:absolute;inset:0;background:transparent;border:0;padding:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.holdpill{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:8px 16px 8px 8px;font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:clamp(.72rem,1.7vw,.95rem);white-space:nowrap}
.holdpill svg{width:30px;height:30px}
.holdbtn:focus-visible .holdpill{outline:3px solid var(--lamp);outline-offset:3px}
.zone{position:absolute;background:transparent;border:2px dashed rgba(255,255,255,.55);border-radius:50%;cursor:pointer;padding:0}
.zone:focus-visible{outline:3px solid var(--lamp)}
.closing{transform-origin:300px 205px;animation:closing 10s ease-in forwards}
@keyframes closing{from{transform:scale(1.35)}to{transform:scale(.82)}}
.orbit{transform-origin:300px 210px;animation:spinr 18s linear infinite}


/* chapters menu */
#app{position:relative}
.chap{position:absolute;right:16px;top:calc(100% + 0px);z-index:20;width:min(340px,calc(100% - 32px));max-height:min(70vh,560px);overflow-y:auto;background:var(--parchment);border:2px solid var(--ink);border-radius:14px;box-shadow:0 12px 30px rgba(20,20,19,.25);padding:14px;box-sizing:border-box}
.chapwrap{position:relative;z-index:20}
.chap h3{margin:10px 6px 6px;font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brown)}
.chap h3:first-child{margin-top:2px}
.chap ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.chap button{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;background:transparent;border:0;border-radius:8px;padding:10px 8px;font-family:var(--body);font-size:1rem;color:var(--ink);cursor:pointer;min-height:44px}
.chap button:hover,.chap button:focus-visible{background:var(--cream);outline:none}
.chap button[aria-current="true"]{background:var(--cream);font-weight:700}
.chap button small{font-family:var(--display);font-weight:700;font-size:.7rem;letter-spacing:.1em;color:var(--ink-soft);min-width:2.4em;font-variant-numeric:tabular-nums}


/* volume 3 */
.streaks{animation:streak 1.1s linear infinite}
@keyframes streak{from{transform:translateX(-140px)}to{transform:translateX(140px)}}
.blown{animation:blown 2.6s ease-in-out infinite}
@keyframes blown{50%{transform:translate(40px,-8px)}}
.elgrid{position:absolute;inset:0;background:#1B2224;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;padding:6%;box-sizing:border-box}
.el{background:#2A3335;border-radius:14px;display:flex;align-items:center;justify-content:center;opacity:.22;transition:opacity .4s, transform .4s;min-height:0}
.el svg{width:62%;height:auto;max-height:90%}
.el.on{opacity:1;transform:scale(1.04)}
.peb{opacity:0}
.pebs.on .peb{animation:drop .5s ease-in forwards}
@keyframes drop{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:none}}
.mref{opacity:0;transition:opacity 1.2s}
.mref.on{opacity:1}
.approach2{transform-origin:230px 200px;animation:approach 9s ease-in forwards}
.leaf{transform-origin:20px 115px;transform:scaleX(.12);transition:transform .15s}
.doorwrap{position:relative;background:var(--parchment);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:24px;padding:24px;align-items:center}
.doorsteps ol{margin:12px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-size:clamp(.95rem,1.8vw,1.1rem);line-height:1.35}
.doorpic svg{width:100%;height:auto;max-height:260px;display:block}
.doorgrid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px;background:#10181B}
.doorcard{display:flex;flex-direction:column;gap:8px;background:var(--parchment);border:2px solid var(--ink);border-radius:12px;padding:8px;cursor:pointer;font-family:var(--body);font-size:clamp(.82rem,1.6vw,1rem);line-height:1.25;color:var(--ink);text-align:left;min-width:0}
.doorcard svg{width:100%;height:auto;border-radius:8px;display:block}
.doorcard:hover{transform:translateY(-2px)}
.doorcard.nope{opacity:.4;filter:grayscale(1)}
.doorcard:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}

/* pilot: shared production layer */
#visual{position:relative}
.leaving{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;pointer-events:none;z-index:4;animation:leave .7s ease forwards}
@keyframes leave{to{opacity:0;transform:scale(.985)}}
.entering{animation:enter .8s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{clip-path:inset(0 0 0 100% round 18px)}to{clip-path:inset(0 0 0 0 round 18px)}}
.amb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.kb{animation:kb 24s ease-out forwards;transform-origin:62% 48%}
@keyframes kb{to{transform:scale(1.09)}}
.glowspot{position:absolute;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.55) 0%,rgba(255,190,90,.18) 40%,rgba(255,190,90,0) 70%);mix-blend-mode:screen;pointer-events:none;animation:candle 2.3s steps(9,end) infinite;transition:opacity 1.2s ease}
@keyframes candle{0%{opacity:.85;transform:translate(-50%,-50%) scale(1)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}35%{opacity:.75}55%{opacity:.95;transform:translate(-50%,-50%) scale(.97)}75%{opacity:.8}100%{opacity:.9;transform:translate(-50%,-50%) scale(1.02)}}
.callout{position:absolute;z-index:3;transform:translate(-50%,-50%) scale(0);background:var(--parchment);border:2px solid var(--ink);border-radius:8px;padding:5px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards;box-shadow:0 3px 0 var(--ink);pointer-events:none;white-space:nowrap}

/* The Drum and the Road, the full book. Nine peoples whose healers and guides outsiders have called "shamans", and what each says
   about the road of the dead: the Evenki and Nanai of Siberia, the mudang of Korea, Mongolian and Tuvan shamans, the Sámi noaidi,
   the Inuit angakkuq, the Mapuche machi, the Yanomami, the Shipibo-Konibo, and the K'iche' Maya. Each volume is its own door, told from published ethnography and the communities'
   own accounts. These are living traditions, and nothing here is a guide to practising them.
   A first draft: each volume should be read by people of that tradition. */
const BOOK={home:'sib_river', toast:'Learned: ', pathLabel:'Path', pathTitle:'What you have learned', detourTitle:'Wrong turns you walked',
  pathNote:'Every wrong turn rewinds. Each volume is its own people, with its own ways.',
  guideBack:'Back to the book', voiceSample:'Beat the drum, and the road opens.'};

  night:()=>pad('night',[98,146.83,196],.03), warm:()=>pad('warm',[110,164.81,220],.035), light:()=>pad('light',[130.81,196,261.63],.035),
  wind:()=>startLoop('wind',g=>{ const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=500; f.Q.value=.7; s.connect(f).connect(g); s.start(); return [s]; },.04),
  water:()=>startLoop('water',g=>{ const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=800; s.connect(f).connect(g); s.start(); return [s]; },.05) });
function drumHit(k=1){ if(!ctx) return; thump(.5); burst({type:'lowpass',freq:180+k*6,peak:.22,a:.003,d:.25}); }
function tapCount(n,lab,onTap){ let k=0; choices.innerHTML=`<button class="btn" type="button" id="tc">${lab} · 0 of ${n}</button>`; const b=$('#tc'); b.focus({preventScroll:true});
  b.onclick=e=>{ e.stopPropagation(); initAudio(); k++; onTap&&onTap(k); b.textContent=`${lab} · ${k} of ${n}`; if(k>=n){ b.disabled=true; setTimeout(()=>{ choices.innerHTML=''; next(); },700); } }; }
const DOORS=[['Siberia','v_sib'],['Korea','v_kor'],['Mongolia and Tuva','v_mon'],['Sámi','v_sam'],['Inuit','v_inu'],['Mapuche','v_map'],['Yanomami','v_yan'],['Shipibo-Konibo','v_shi'],["K'iche' Maya",'v_may']];

    <p>In many cultures, someone walks between this world and the world of spirits: to heal, to bring back a lost soul, and to guide the dead on their road. Outsiders call them all "shamans". Each people has its own name, its own ways, and its own map of where the dead go. This book has nine doors, one for each.</p>
    <p class="draft">These are living traditions. The book tells what each people has shared about death, from published accounts. It isn't a guide to practising them.</p>

    {text:"They give the panyan food, a pipe of tobacco, a place by the fire. Their grandmother is still part of the family. She just isn't ready for the road yet."} ]},

{ key:'sib_kasa', label:'The road to buni', bg:NIGHTBG, learn:'kasa',
  view:()=>PG(`${ground(310,'#D8DCE0')}${larch(80,310,.8)}<g id="sl" style="transition:translate 1s">${reindeer(260,310,.9)}${sledge(160,310,.9)}${doll(150,284,.6)}</g>${pp(470,310,.8,{hat:'plume',arms:'drum',fringe:true})}`,'A snowy night. A reindeer pulls a sledge carrying the little figure. The saman drums.',{bg:'night'}),
  enter(){ mood('night','wind'); },
  guide:{title:'The kasa',text:"Among the Nanai, the great memorial for the dead, called kasa, was held some time after a death, sometimes a year or more. The saman summoned his spirit helpers, gathered the souls of the dead from their panyan, and escorted them, in a long sung journey that could last days, to buni, the land of the dead, where people were thought to live much as they had on earth. The Russian ethnographer Lev Sternberg, and later Anna Smolyak, recorded these rites."},
  beats:[
    {text:"Months later comes the kasa, the great memorial. The saman calls his spirit helpers, gathers the souls from their panyan, and leads them on the long road to buni, the land of the dead. Hold, and drive the sledge.", lock:true, show(){ holdOn({label:'Drive to buni',ms:6000,wait:800,onProgress:p=>{ const g=$('#sl'); if(g) g.style.translate=`${p*200}px 0`; },onDone:()=>drumHit(4)}); }},
    {text:"In buni, life goes on much as it did here: fishing, hunting, family. The soul has arrived. The family can let it go."} ]},

{ key:'sib_now', label:'The road to buni', bg:HIDEBG,
  view:()=>PG(`${ground(330)}${larch(100,330,1)}${drumF(300,220,1.1)}${larch(500,330,1)}`,'A drum alone between two larch trees.'),
  enter(){ mood('light'); },
  beats:[
    {text:"In the Soviet era, šamans were persecuted, and many drums were burned. Today Evenki and Nanai communities are reviving what survived, in their own way, and on their own terms."} ]},

/* ===== Korea ===== */
{ key:'v_kor', label:'Korea', bg:'var(--teal)',
  view:()=>card('Door 2 · Korea','The Mudang',"In Korea, the mudang, most of them women, hold rituals called gut: for luck, for healing, and to send the dead on with their grief resolved."),
  enter(){ mood('warm'); drumHit(); }, beats:[{text:null}] },

{ key:'kor_bari', label:'Princess Bari', bg:'#3A3046',
  view:()=>PG(`<path d="M0 330 Q150 260 300 300 T600 280 V400 H0Z" fill="#2A2436"/>${pp(220,320,1,{col:SNOW,trim:RUST,hat:'long'})}<path d="M236 240 V290" stroke="${K}" stroke-width="3"/><path d="M226 286 q10 14 20 0Z" fill="#7ACAD8" stroke="${K}" stroke-width="1.5"/><g opacity=".6">${pp(440,320,.85,{col:'#6A5A8A',hat:'none'})}</g>`,'A young woman in white carries a small vessel of water through a dark land.',{bg:'night'}),
  enter(){ mood('night'); },
  guide:{title:'The song of Princess Bari',text:"The story of Bari Gongju, the abandoned princess, is sung by mudang in rituals for the dead, especially in Seoul and central Korea, and can take hours to perform. Versions differ, but in most the princess is thrown away at birth for being a seventh daughter, travels to the land of the dead to fetch the water that can revive her dying parents, and afterwards becomes the guide who leads the souls of the dead to the other world."},
  beats:[
    {text:"Mudang sing an old story in their rites for the dead. A king had seven daughters and wanted a son. He threw the seventh away. Her name was Bari, the abandoned one."},
    {text:"Years later the king and queen fell ill, and only water from the land of the dead could save them. Only Bari would go. She walked the road, served there for years, and brought the water back."},
    {text:"She became the guide of the dead. When a mudang leads a soul to the other world, it's Bari's road she's walking."} ]},

{ key:'kor_gut', label:'The washing', bg:HIDEBG,
  view:()=>PG(`${ground(330)}<rect x="270" y="210" width="60" height="120" rx="12" fill="#D8C080" stroke="${K}" stroke-width="2"/>${[230,250,270,290,310].map(y=>`<path d="M270 ${y} H330" stroke="${K}" stroke-width="1.4"/>`).join('')}<rect x="284" y="190" width="32" height="22" fill="${SNOW}" stroke="${K}" stroke-width="1.8"/>${pp(440,330,.9,{col:SNOW,trim:'#3A5A8A',hat:'long',arms:'offer'})}${pp(150,330,.85,{col:'#E8E0D0',trim:K,hat:'none',arms:'fold'})}`,'A rolled straw mat stands upright with a small white bowl on top. A mudang in white kneels beside it. A son stands in mourning.'),
  enter(){ mood('warm'); },
  guide:{title:'Ssitgim-gut',text:"Ssitgim-gut, the washing ritual, belongs to southwest Korea, especially the island of Jindo, where the Jindo ssitgim-gut is a designated national intangible heritage. The dead person's clothes are rolled inside a straw mat and stood upright, with a bowl holding the soul on top. The mudang washes this figure with a brush dipped in three waters, and the family speaks to the dead, cries, and lets them go."},
  beats:[
    {text:"Your father has died, in a village in southwest Korea. Your family calls a mudang for a ssitgim-gut, a washing ritual. Some relatives say it's old-fashioned.", lock:true, afterType(){ pick([{label:'Skip it: he is gone',go:'x_kor'},{label:'Hold the gut'}]); }} ]},

{ key:'kor_wash', label:'The washing', bg:HIDEBG, learn:'wash',
  view:()=>PG(`${ground(330)}<rect x="270" y="210" width="60" height="120" rx="12" fill="#D8C080" stroke="${K}" stroke-width="2"/>${[230,250,270,290,310].map(y=>`<path d="M270 ${y} H330" stroke="${K}" stroke-width="1.4"/>`).join('')}<rect x="284" y="190" width="32" height="22" fill="${SNOW}" stroke="${K}" stroke-width="1.8"/><g id="ws"></g>${pp(440,330,.9,{col:SNOW,trim:'#3A5A8A',hat:'long',arms:'up'})}`,'The mudang raises a brush over the rolled mat.'),
  enter(){ mood('warm','water'); },
  beats:[
    {text:"Your father's clothes are rolled in a straw mat and stood upright, with his soul in the bowl on top. The mudang washes it with three waters. Wash.", lock:true, afterType(){ const w=['Water with mugwort','Fragrant water','Clear water']; tapCount(3,'Wash',k=>{ bell(392+k*40,.06,3); const g=$('#ws'); if(g) g.innerHTML+=`<path d="M${272+k*14} 214 v${30+k*20}" stroke="#7ACAD8" stroke-width="4" opacity=".7"/>`; }); }},
    {text:"Mugwort water, fragrant water, clear water. As she washes, the family speaks to him, and cries, and says what was never said. His grief, and theirs, is washed away too."} ]},

{ key:'kor_road', label:'Opening the road', bg:HIDEBG, learn:'road',
  view:()=>PG(`${ground(330)}${pp(80,330,.85,{col:'#E8E0D0',trim:K,arms:'offer'})}${pp(520,330,.85,{col:'#E8E0D0',trim:K,hat:'long',arms:'offer'})}<g id="cl">${cloth(100,500,250)}</g>${pp(150,330,.9,{col:SNOW,trim:'#3A5A8A',hat:'long',arms:'up'})}`,'Two relatives hold a long white cloth stretched between them. The mudang stands at one end.'),
  enter(){ mood('light'); },
  beats:[
    {text:"Last, two relatives stretch a long white cloth between them: the road to jeoseung, the other world. The mudang walks it, splitting it down the middle with her body. Hold, and open the road.", lock:true, show(){ holdOn({label:'Open the road',ms:5000,wait:600,onProgress:p=>{ const c=$('#cl'); if(c) c.innerHTML=cloth(100,500,250,{torn:Math.round(p*200)}); },onDone:()=>chime()}); }},
    {text:"The cloth is open, and Bari leads him down it. He goes with nothing left unsaid."} ]},

/* ===== Mongolia and Tuva ===== */
{ key:'v_mon', label:'Mongolia and Tuva', bg:'var(--teal)',
  view:()=>card('Door 3 · Mongolia and Tuva','Sky and Ancestors',"On the steppe, a male shaman is called böö in Mongolian, a female one udgan, and in Tuva both are called kham. They speak with the spirits of ancestors."),
  enter(){ mood('wind'); drumHit(); }, beats:[{text:null}] },

{ key:'mon_sky', label:'Sky and earth', bg:'#5A8AB0', learn:'sky',
  view:()=>PG(`<rect width="600" height="300" fill="#6A9AC0"/>${ground(300,'#8AA060')}${ger(420,300,1)}<path d="M140 300 L170 240 L200 300Z" fill="#9A8A70" stroke="${K}" stroke-width="2"/>${[150,170,190].map((x,i)=>`<path d="M${x} ${250+i*6} q6 -20 0 -40" stroke="${['#3A6AB0',SNOW,OCHRE][i]}" stroke-width="4" fill="none"/>`).join('')}`,'Blue sky over grassland. A white ger, and a cairn of stones hung with blue cloths.',{bg:'#6A9AC0'}),
  enter(){ mood('wind','light'); },
  guide:{title:'Tengri and Erlik',text:"In the old religion of the Mongols, often called Tengerism today, Tenger, the Eternal Blue Sky, is the highest power, with Etügen, the earth, below. Erlik Khan, lord of the underworld, judges and keeps the dead; the figure is shared with Turkic peoples of Siberia. Over centuries this faith blended with Tibetan Buddhism, and in modern Mongolia shamanism has revived strongly since the end of the communist period in 1990."},
  beats:[
    {text:"Above everything is Tenger, the Eternal Blue Sky. Below is the earth. And under the earth, in the old stories, Erlik Khan rules the dead and weighs what they did."},
    {text:"Between them, people live. Travellers circle the ovoo, a cairn of stones hung with blue scarves, and leave an offering to the spirits of the place."} ]},

{ key:'mon_ongod', label:'The ancestors', bg:'#2A2430',
  view:()=>PG(`<rect x="40" y="40" width="520" height="290" fill="#3A2E2A"/>${ground(330,'#5A4636')}${pp(300,330,1.05,{col:'#3A4A6A',trim:OCHRE,hat:'plume',arms:'drum',fringe:true})}${mirror(300,280,1.1)}${drumF(272,266,.5)}${pp(130,330,.8,{col:RUST,hat:'long',arms:'fold'})}${pp(470,330,.8,{col:MOSS,arms:'fold'})}`,'Inside a ger at night. A shaman in a fringed coat with a bronze mirror on her chest drums. Two relatives sit nearby.',{bg:'#2A2430'}),
  enter(){ mood('night'); drumHit(); },
  guide:{title:'Ongod',text:"Ongod (singular ongon) are spirits, above all the spirits of ancestors, and especially of shamans who have died. A Mongolian shaman inherits her ongod through her family line, and during a ritual she invites one to enter her body and speak. Her costume carries ribbons, bells, and bronze mirrors called toli, which protect her and are said to show what is hidden; a fringe over her eyes lets her see the spirit world instead of this one."},
  beats:[
    {text:"Your grandmother died last winter, and the family wants to know she is at peace. They ask an udgan, a shaman whose own ancestors were shamans. Her ancestor spirits, the ongod, will speak through her."},
    {text:"How do you ask?", lock:true, afterType(){ pick([{label:'Ask her to put on a show for the guests',go:'x_mon'},{label:'Bring offerings, and ask with respect'}]); }} ]},

{ key:'mon_ask', label:'The ancestors', bg:'#2A2430', learn:'ongod',
  view:()=>PG(`<rect x="40" y="40" width="520" height="290" fill="#3A2E2A"/>${ground(330,'#5A4636')}${pp(300,330,1.05,{col:'#3A4A6A',trim:OCHRE,hat:'plume',arms:'up',fringe:true})}${mirror(300,280,1.1)}<path d="M100 300 q8 -14 16 0Z" fill="${SNOW}" stroke="${K}" stroke-width="1.4"/><rect x="460" y="282" width="12" height="20" fill="#7A9AB0" stroke="${K}" stroke-width="1.4"/><path d="M520 290 h20" stroke="#3A6AB0" stroke-width="10"/>`,'The shaman lifts her arms. On the floor: a bowl of milk, a bottle, and a blue scarf.',{bg:'#2A2430'}),
  enter(){ mood('night'); },
  beats:[
    {text:"You bring what the spirits are offered. Tap each one.", lock:true, show(){ tapAll([
      [18,74,'Milk',"Milk, flicked to the sky and the four directions: the whitest, cleanest thing on the steppe."],
      [78,72,'Vodka',"Vodka, and tobacco, which the ancestors liked when they were alive."],
      [88,72,'A blue scarf',"A khadag, a blue scarf, the colour of the Eternal Sky."] ]); }},
    {text:"She drums until her ongod arrives, and speaks in an old voice. Your grandmother is with the ancestors, it says. Look after each other. The dead watch over the living, and the living remember the dead."} ]},

/* ===== Sámi ===== */
{ key:'v_sam', label:'Sámi', bg:'var(--teal)',
  view:()=>card('Door 4 · Sámi','The Noaidi',"The Sámi live across the north of Norway, Sweden, Finland and Russia. Their noaidi travelled in trance to the world of the dead, often to bring a sick person's soul back."),
  enter(){ mood('wind'); drumHit(); }, beats:[{text:null}] },

{ key:'sam_drum', label:'The drum', bg:SNOWG,
  view:()=>PG(`${ground(330,'#E0E2E6')}${birch(100,330,1)}${tent(460,330,1,{col:'#9A8A70'})}<g id="dm">${drumF(280,210,1.2)}</g><circle id="ar" cx="270" cy="200" r="6" fill="${OCHRE}" stroke="${K}" stroke-width="1.5" style="transition:cx .4s,cy .4s"/>`,'A painted frame drum in the snow. A small brass ring rests on its skin.',{bg:'snow'}),
  enter(){ mood('wind'); },
  guide:{title:'The drums',text:"A noaidi's drum, goavddis, was painted with figures: sun, gods, people, reindeer, boats, and the worlds above and below. A small ring or pointer, the árpa, was set on the skin and moved as the drum was struck, and where it stopped answered a question. In the 1600s and 1700s Lutheran missionaries confiscated and burned drums and put noaidi on trial; about seventy old drums survive. In 2023 Denmark returned the Freavnantjahke gievrie, a South Sámi drum taken in 1723, to the Sámi."},
  beats:[
    {text:"A noaidi's drum is a map: sun, gods, reindeer, people, and the worlds above and below, painted on the skin. A little ring dances on it as you beat it, and where it stops gives an answer. Beat the drum.", lock:true, afterType(){ const pts=[[300,180],[256,232],[318,236],[262,190]]; tapCount(4,'Beat the drum',k=>{ drumHit(k); const a=$('#ar'); if(a){ a.setAttribute('cx',pts[k-1][0]); a.setAttribute('cy',pts[k-1][1]); } }); }},
    {text:"Missionaries burned most of these drums in the 1600s and 1700s. About seventy survive. One was given back to the Sámi by Denmark in 2023, three hundred years after it was taken."} ]},

{ key:'sam_trance', label:'The journey', bg:SNOWG,
  view:()=>PG(`${ground(330,'#C8B898')}<rect x="40" y="60" width="520" height="270" fill="#8A7458" opacity=".25"/>${fire(300,330,.9)}<g transform="translate(150 316) rotate(-90)">${pp(0,0,.8,{col:'#2E4A7A',trim:RUST,hat:'cap'})}</g>${drumF(112,296,.3)}${pp(450,330,.85,{col:'#2E4A7A',trim:RUST,hat:'long',arms:'fold'})}`,'Inside a tent. The noaidi lies still as if dead, his drum on his chest. A woman sits by the fire, singing.'),
  enter(){ mood('night'); },
  beats:[
    {text:"A child is very sick. Her soul, the family fears, has been taken toward Jábmiidáibmu, the land of the dead under the earth. The noaidi drums until he falls down as if dead. His own soul has gone to fetch hers."},
    {text:"He lies there for a long time without moving. A woman sings a joik to keep his road open. The child's father is frightened.", lock:true, afterType(){ pick([{label:'Shake him to see if he is all right',go:'x_sam'},{label:'Keep singing, and wait'}]); }} ]},

{ key:'sam_back', label:'The journey', bg:SNOWG, learn:'trance',
  view:()=>PG(`${ground(330,'#C8B898')}<rect x="40" y="60" width="520" height="270" fill="#8A7458" opacity=".25"/>${fire(300,330,.9)}<g id="nd"><g transform="translate(150 316) rotate(-90)">${pp(0,0,.8,{col:'#2E4A7A',trim:RUST,hat:'cap'})}</g></g>${pp(450,330,.85,{col:'#2E4A7A',trim:RUST,hat:'long',arms:'fold'})}`,'The noaidi lies still. The woman keeps singing.'),
  enter(){ mood('night'); },
  beats:[
    {text:"Far below, he bargains with Jábmiidáhkká, the old woman who rules the dead, and promises her an offering. Hold, and keep the song going.", lock:true, show(){ holdOn({label:'Keep singing',ms:6000,wait:800,onProgress:p=>{ if(Math.random()<.04) bell(330+p*80,.04,2); },onDone:()=>{ const n=$('#nd'); if(n) n.innerHTML=pp(150,330,.8,{col:'#2E4A7A',trim:RUST,hat:'cap',arms:'up'}); drumHit(5); }}); }},
    {text:"He stirs, sits up, and tells what he saw. The child's soul is back. The trance is a real journey in Sámi belief, and the body left behind must not be disturbed."} ]},

{ key:'sam_saivo', label:'Saivo', bg:'#5A7A9A', learn:'saivo',
  view:()=>PG(`<path d="M0 260 L120 150 L220 230 L330 120 L460 230 L600 160 V400 H0Z" fill="#3A5070" stroke="${K}" stroke-width="2"/><path d="M0 300 H600 V400 H0Z" fill="#6A9AB8"/><path d="M0 300 L120 410 M600 300 L460 410" stroke="none"/><g opacity=".6">${[160,260,360].map((x,i)=>pp(x,290,.6,{col:SNOW,trim:OCHRE,hat:i%2?'long':'cap'})).join('')}</g><path d="M60 330 h80 m60 0 h100 m80 0 h120" stroke="${BIRCH}" stroke-width="2" opacity=".5"/>`,'Mountains above a still lake. Pale figures walk along the shore.',{bg:'#7AA0C0'}),
  enter(){ mood('light'); },
  beats:[
    {text:"And the good dead? Many Sámi spoke of saivo: holy mountains and lakes, a world just beneath this one, where ancestors live a better life, with richer herds. Spirits from saivo helped the noaidi on his journeys."} ]},

/* ===== Inuit ===== */
{ key:'v_inu', label:'Inuit', bg:'var(--teal)',
  view:()=>card('Door 5 · Inuit','The Angakkuq',"Across the Arctic, from Alaska to Greenland, Inuit communities had an angakkuq, who could travel to the sky or under the sea to put things right."),
  enter(){ mood('wind'); drumHit(); }, beats:[{text:null}] },

{ key:'inu_sky', label:'The northern lights', bg:NIGHTBG, learn:'aurora',
  view:()=>PG(`${aurora()}${ground(320,'#D8DCE0')}${snowhouse(440,320,1)}${pp(180,320,.85,{col:'#8A6A4A',trim:SNOW,hat:'hood'})}`,'The northern lights ripple over a snow house. Someone in a fur-trimmed parka looks up.',{bg:'night'}),
  enter(){ mood('night','wind'); },
  guide:{title:'Many names, many versions',text:"Inuit traditions are many, and differ from region to region. In many of them the aurora are the souls of the dead playing a ball game in the sky, and some say you can whistle to bring them closer. The sea woman has many names: Nuliajuk among the Netsilik, Takannaaluk in Iglulik, Sedna in Baffin Island, and others elsewhere. Missionaries suppressed the angakkuq in the 1800s and 1900s; Inuit elders, writers and artists keep telling these stories today."},
  beats:[
    {text:"In many Inuit stories, the northern lights are the dead, playing a ball game across the sky. Some people say: don't whistle at them, or they'll come down close."},
    {text:"Your grandfather died this winter. Tonight, the lights are bright."} ]},

{ key:'inu_sea', label:'The woman under the sea', bg:'#0E2630',
  view:()=>PG(`<path d="M0 0 H600 V40 H0Z" fill="#2A6070"/>${pp(300,320,1.1,{col:'#2A3A4A',trim:'#6A9AA0',hat:'long'})}<path d="M282 230 Q200 200 160 260 Q140 300 180 330 M318 230 Q400 200 440 260 Q460 300 420 330" stroke="#1A1614" stroke-width="10" fill="none"/>${whale(120,140,.5)}<ellipse cx="480" cy="120" rx="30" ry="14" fill="#5A6A70" stroke="${K}" stroke-width="2"/>`,'Deep under the sea, a woman sits with long tangled hair. Seals and a whale hang back.',{bg:'sea'}),
  enter(){ mood('night','water'); },
  beats:[
    {text:"Far below the sea lives a woman whose fingers became the seals, walruses and whales. She lets them go to the hunters, as long as people keep the rules of life and death."},
    {text:"After a death, there were days of mourning: no hunting, no sewing, no cutting. The hunters are hungry, and the weather is good.", lock:true, afterType(){ pick([{label:'Go out hunting tomorrow',go:'x_inu'},{label:'Keep the days of mourning'}]); }} ]},

{ key:'inu_comb', label:'The woman under the sea', bg:'#0E2630', learn:'sedna',
  view:()=>PG(`<path d="M0 0 H600 V40 H0Z" fill="#2A6070"/>${pp(300,320,1.1,{col:'#2A3A4A',trim:'#6A9AA0',hat:'long'})}<g id="hr"><path d="M282 230 Q200 200 160 260 Q140 300 180 330 M318 230 Q400 200 440 260 Q460 300 420 330" stroke="#1A1614" stroke-width="10" fill="none"/></g>${pp(160,250,.7,{col:'#8A6A4A',trim:SNOW,hat:'hood',arms:'up'})}`,'The angakkuq has come down beside the sea woman, reaching for her hair.',{bg:'sea'}),
  enter(){ mood('water','light'); },
  beats:[
    {text:"Even so, people slip, and the sea woman's hair grows tangled with their wrongdoing. She has no fingers to comb it, so she keeps the animals back. The angakkuq journeys down to her. Comb her hair.", lock:true, afterType(){ tapCount(4,'Comb her hair',k=>{ bell(330+k*30,.05,3); const h=$('#hr'); if(h&&k===4) h.innerHTML=`<path d="M290 230 Q280 300 286 330 M310 230 Q320 300 314 330" stroke="#1A1614" stroke-width="10" fill="none"/>`; }); }},
    {text:"Combed and braided, she is calmed, and lets the animals go. The people eat again. Keeping faith with the dead keeps faith with the living."} ]},

/* ===== Mapuche ===== */
{ key:'v_map', label:'Mapuche', bg:'var(--teal)',
  view:()=>card('Door 6 · Mapuche','The Machi',"The Mapuche live in southern Chile and Argentina. Their machi, usually women, heal with plants, drumming and prayer, and climb between the worlds."),
  enter(){ mood('warm'); drumHit(); }, beats:[{text:null}] },

{ key:'map_rewe', label:'The rewe', bg:'#8AB0C8', learn:'rewe',
  view:()=>PG(`<rect width="600" height="330" fill="#9AC0D8"/>${ground(330,'#7A9A50')}${rewe(300,330,1)}<g id="mc" style="transition:translate .6s">${pp(250,330,.85,{col:'#2A2A3A',trim:'#3A5A9A',hat:'band'})}${kultrun(250,260,.45)}</g>`,'A tall carved step-pole with leafy branches beside it. A machi stands at its foot with a drum.',{bg:'#9AC0D8'}),
  enter(){ mood('light'); },
  guide:{title:'The machi',text:"A machi is a healer and spiritual guide among the Mapuche; most today are women. Each machi has a rewe, a carved step-pole set in the ground outside her house and decked with branches of foye (canelo), the sacred tree. In a healing ceremony, machitun, or at the great ngillatun gatherings, she drums the kultrun, a bowl-shaped drum whose painted skin shows the four quarters of the world, and may climb the rewe to reach the spirit world."},
  beats:[
    {text:"Outside a machi's house stands her rewe, a carved pole of steps with sacred branches tied to it. Drumming her kultrun, she can climb it, step by step, toward the world of the spirits. Hold, and climb.", lock:true, show(){ holdOn({label:'Climb the rewe',ms:5000,wait:600,onProgress:p=>{ const m=$('#mc'); if(m) m.style.translate=`${p*36}px ${-p*150}px`; },onDone:()=>drumHit(3)}); }},
    {text:"The rewe is a ladder between worlds, and the machi is the one who climbs it for her community."} ]},

{ key:'map_eluwun', label:'The funeral', bg:HIDEBG,
  view:()=>PG(`${ground(330)}<rect x="230" y="290" width="140" height="40" fill="#8A6A44" stroke="${K}" stroke-width="2"/>${pp(120,330,.85,{col:'#2A2A3A',trim:'#3A5A9A',hat:'none',arms:'up'})}${pp(470,330,.85,{col:'#3A2A2A',trim:RUST,hat:'band',arms:'fold'})}${pp(540,330,.7,{col:'#4A4A2A',trim:OCHRE,hat:'none'})}`,'A wooden coffin. A man speaks with raised arms. Mourners stand listening.'),
  enter(){ mood('warm'); },
  guide:{title:'Eluwün',text:"The eluwün is a Mapuche funeral, often lasting several days. Relatives and guests come from far away; speakers recount the dead person's life and lineage, so that they go with their name honoured; food is shared; and the body is buried with things for the journey. Beliefs vary between communities, but many describe the soul travelling west across the sea, and in southern Huilliche tradition old women who become whales, the trempulkalwe, carry the souls across."},
  beats:[
    {text:"In a Mapuche community, your grandmother has died. Her family holds an eluwün, a funeral that can last days. People are coming from far away. Some ask whether it's worth the trouble.", lock:true, afterType(){ pick([{label:'Bury her quickly and quietly',go:'x_map'},{label:'Gather everyone for the speeches'}]); }} ]},

{ key:'map_speech', label:'The funeral', bg:HIDEBG,
  view:()=>PG(`${ground(330)}<rect x="230" y="290" width="140" height="40" fill="#8A6A44" stroke="${K}" stroke-width="2"/>${pp(120,330,.85,{col:'#2A2A3A',trim:'#3A5A9A',hat:'none',arms:'up'})}${pp(400,330,.8,{col:'#4A3A5A',trim:SNOW,hat:'band',arms:'up'})}${pp(520,330,.85,{col:'#3A2A2A',trim:RUST,hat:'band',arms:'fold'})}`,'Two speakers raise their arms beside the coffin.'),
  enter(){ mood('warm'); },
  beats:[
    {text:"One after another, people stand and speak: who her parents were, the land she came from, what she did, what she was like. Tell her story.", lock:true, afterType(){ tapCount(3,'Tell a memory',k=>bell(294+k*30,.05,3)); }},
    {text:"She goes with her name spoken aloud, and her place in her people known."} ]},

{ key:'map_west', label:'Across the sea', bg:'#3A4A6A', learn:'west',
  view:()=>PG(`<circle cx="470" cy="210" r="70" fill="url(#glowS)"/>${sea(240)}<g id="wh" style="transition:translate 1s">${whale(150,262,.9)}${doll(150,232,.55)}</g>`,'A whale swims west across a sunset sea, carrying a small glowing figure.',{bg:'#5A6A8A'}),
  enter(){ mood('water','light'); },
  beats:[
    {text:"Many Mapuche say the soul travels west, across the sea, to the land of the dead. In the far south, the story goes that old women who have become whales carry the souls over. Hold, and cross.", lock:true, show(){ holdOn({label:'Cross the sea',ms:6000,wait:800,onProgress:p=>{ const w=$('#wh'); if(w) w.style.translate=`${p*280}px 0`; },onDone:()=>chime()}); }},
    {text:"She's across. Some say the dead go on to live among the volcanoes as ancestors, still watching over their people."} ]},

/* ===== Yanomami ===== */
{ key:'v_yan', label:'Yanomami', bg:'var(--teal)',
  view:()=>card('Door 7 · Yanomami','The Falling Sky',"The Yanomami live in the rainforest on the border of Brazil and Venezuela. One of their shamans, Davi Kopenawa, wrote down their knowledge himself, so that outsiders would understand."),
  enter(){ mood('warm','water'); drumHit(); }, beats:[{text:null}] },

{ key:'yan_xapiri', label:'The xapiri', bg:'#1E3424', learn:'xapiri',
  view:()=>PG(`${vines()}${jtree(60,330,1)}${jtree(560,330,1.1)}${ground(330,'#6A5A3A')}${shabono(300,330,1)}<g id="xp"></g>${pp(300,330,.75,{col:'#7A4A2A',trim:RUST,hat:'none',arms:'up'})}`,'A great round communal house in the rainforest. In its open centre, a shaman raises his arms.',{bg:'#2E5A3A'}),
  enter(){ mood('warm','water'); },
  guide:{title:'Davi Kopenawa',text:"Davi Kopenawa is a Yanomami shaman and spokesman who has spent his life defending the forest and his people's land. With the anthropologist Bruce Albert he wrote The Falling Sky: Words of a Yanomami Shaman (2010; English 2013), in his own words, so that white people would understand what they are destroying. This door follows that book."},
  beats:[
    {text:"Yanomami shamans breathe in yãkoana, a powder made from tree resin, and call the xapiri: tiny, shining spirits that dance down to them on paths of light. Watch them come.", lock:true, afterType(){ tapCount(5,'Watch',k=>{ const g=$('#xp'); if(g) g.innerHTML=xapiri(k*3); bell(523+k*40,.04,3); }); }},
    {text:"The xapiri heal the sick, fight off sickness spirits, and, Kopenawa says, help hold up the sky."} ]},

{ key:'yan_death', label:'The ashes', bg:'#1E3424',
  view:()=>PG(`${vines()}${jtree(60,330,1)}${jtree(560,330,1.1)}${ground(330,'#6A5A3A')}${shabono(300,330,1)}${gourd(300,326,1.1)}${pp(200,330,.75,{col:'#7A4A2A',trim:OCHRE,hat:'long',arms:'fold'})}${pp(400,330,.75,{col:'#6A3A2A',trim:OCHRE,hat:'none',arms:'fold'})}`,'Mourners sit by a small gourd in the communal house.',{bg:'#2E5A3A'}),
  enter(){ mood('night'); },
  beats:[
    {text:"When someone dies, their body is cremated and the bones are ground and kept in gourds. Their ghost has to leave for the back of the sky, where the ghosts of the Yanomami live in plenty. The family wonders what to do with their things.", lock:true, afterType(){ pick([{label:'Keep some of their things, to remember',go:'x_yan'},{label:'Let everything of theirs be destroyed'}]); }} ]},

{ key:'yan_reahu', label:'The ashes', bg:'#1E3424', learn:'ashes',
  view:()=>PG(`${vines()}${jtree(60,330,1)}${jtree(560,330,1.1)}${ground(330,'#6A5A3A')}${shabono(300,330,1)}<g id="gd">${gourd(300,326,1.1)}</g>${pp(180,330,.75,{col:'#7A4A2A',trim:OCHRE,hat:'long',arms:'offer'})}${pp(420,330,.75,{col:'#6A3A2A',trim:OCHRE,hat:'none',arms:'offer'})}`,'Mourners hold out bowls around the gourd.',{bg:'#2E5A3A'}),
  enter(){ mood('warm'); },
  beats:[
    {text:"Their belongings are burned, their name isn't spoken again, and at a great feast, the reahu, the ashes are mixed into plantain soup and shared by the relatives. Hold, and let the last trace go.", lock:true, show(){ holdOn({label:'Let them go',ms:5000,wait:600,onProgress:p=>{ const g=$('#gd'); if(g) g.style.opacity=String(1-p*.85); },onDone:()=>chime()}); }},
    {text:"Nothing of the dead is left behind to pull them back. The mourning is over, and the ghost goes on to the back of the sky."},
    {text:"Kopenawa's warning: if the forest is destroyed and the shamans die out, the xapiri will leave, and the sky will fall on everyone, white people too."} ]},

/* ===== Shipibo-Konibo ===== */
{ key:'v_shi', label:'Shipibo-Konibo', bg:'var(--teal)',
  view:()=>card('Door 8 · Shipibo-Konibo','The Songs',"The Shipibo-Konibo live along the Ucayali river in the Peruvian Amazon. Their healers, onanya, those who know, heal with songs."),
  enter(){ mood('water'); drumHit(); }, beats:[{text:null}] },

{ key:'shi_icaro', label:'The songs', bg:'#2A3A2E', learn:'icaro',
  view:()=>PG(`${river(290,'#5A6A4A')}${jtree(80,290,.9)}${jtree(520,290,1)}${canoe(420,300,.8)}<rect x="160" y="180" width="200" height="110" fill="#D8C8A0" stroke="${K}" stroke-width="2"/><path d="M150 180 L260 120 L370 180Z" fill="#B8A060" stroke="${K}" stroke-width="2"/>${pp(220,290,.7,{col:'#3A3A5A',trim:OCHRE,hat:'none'})}${pp(300,290,.65,{col:'#7A2A3A',trim:OCHRE,hat:'long',arms:'fold'})}<g id="sg"></g>`,'A stilt house by a river. A healer sits with a patient. A canoe passes.',{bg:'#6A8A6A'}),
  enter(){ mood('water','night'); },
  guide:{title:'Onanya and kené',text:"In Shipibo-Konibo healing, an onanya (one who knows) learns icaros, songs, from the spirits of plants, and sings them over the sick to restore order to the body. Shipibo understanding links the songs to kené, the intricate geometric designs that Shipibo women paint and embroider; Peru declared kené part of the national cultural heritage in 2008. Among the dangers an onanya guards against are yoshin, spirits, including the wandering ghosts of the dead."},
  beats:[
    {text:"A healer sings icaros, songs learned from the spirits of plants, over a sick woman. Shipibo say the songs carry patterns that put the body back in order. Listen.", lock:true, afterType(){ tapCount(4,'Listen',k=>{ bell(294+k*36,.05,4); const g=$('#sg'); if(g) g.innerHTML+=`<path d="M${200+k*14} ${170-k*10} q8 -10 16 0 t16 0" stroke="${OCHRE}" stroke-width="2.4" fill="none"/>`; }); }},
    {text:"The songs also guard against yoshin, wandering spirits, among them the ghosts of the dead who haven't left. Healing the living and keeping the restless dead away are part of the same work."} ]},

{ key:'shi_tour', label:'Not a product', bg:HIDEBG,
  view:()=>PG(`<rect x="150" y="70" width="300" height="210" rx="10" fill="#F8F6F0" stroke="${K}" stroke-width="2.4"/><rect x="150" y="70" width="300" height="26" rx="10" fill="#C8CCD8" stroke="${K}" stroke-width="2"/><text x="300" y="140" text-anchor="middle" font-family="Jost,sans-serif" font-size="19" font-weight="700" fill="${K}">JUNGLE RETREAT</text><text x="300" y="166" text-anchor="middle" font-family="Jost,sans-serif" font-size="15" fill="${K}">3 nights with a real shaman</text><rect x="235" y="200" width="130" height="34" rx="17" fill="${RUST}"/><text x="300" y="223" text-anchor="middle" font-family="Jost,sans-serif" font-size="15" font-weight="700" fill="#FFF">Book now</text>`,'An advert for a jungle retreat with a real shaman.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"Back home, you see an advert for a retreat in the Amazon: three nights of ayahuasca with a real shaman.", lock:true, afterType(){ pick([{label:'Book it',go:'x_shi'},{label:'Learn from Shipibo people themselves'}]); }} ]},

{ key:'shi_learn', label:'Not a product', bg:'#2A3A2E', learn:'heritage',
  view:()=>PG(`${river(290,'#5A6A4A')}${jtree(80,290,.9)}${jtree(520,290,1)}<rect x="200" y="200" width="200" height="80" fill="#F2ECDD" stroke="${K}" stroke-width="2"/><path d="M210 214 H390 M210 240 H390 M210 266 H390 M240 200 V280 M300 200 V280 M360 200 V280" stroke="#3A2A3A" stroke-width="3"/>${pp(440,290,.7,{col:'#7A2A3A',trim:OCHRE,hat:'long',arms:'offer'})}`,'A Shipibo woman holds out an embroidered cloth.',{bg:'#6A8A6A'}),
  enter(){ mood('warm'); },
  beats:[
    {text:"Shipibo-Konibo artists and healers speak for themselves, and sell their own work. Peru declared their kené designs part of the nation's cultural heritage in 2008."},
    {text:"The songs, the plants and the designs belong to the people who carry them. Listening to them is how you learn."} ]},

/* ===== K'iche' Maya ===== */
{ key:'v_may', label:"K'iche' Maya", bg:'var(--teal)',
  view:()=>card("Door 9 · K'iche' Maya",'The Road to Xibalba',"The K'iche' Maya of highland Guatemala keep the Popol Vuh, their great book, and the 260-day calendar, which is kept by daykeepers, ajq'ij."),
  enter(){ mood('warm'); drumHit(); }, beats:[{text:null}] },

{ key:'may_cross', label:'The crossroads', bg:'#2A2430',
  view:()=>PG(`${crossroads()}<path d="M0 210 H600" stroke="${K}" stroke-width="2" opacity=".3"/>${pp(262,372,.6,{col:'#3A5A3A',trim:OCHRE,hat:'band'})}${pp(338,372,.6,{col:'#5A3A2A',trim:OCHRE,hat:'band'})}`,'Two young men stand where four roads meet: red, black, white and yellow.',{bg:'#2A2430'}),
  enter(){ mood('night'); },
  guide:{title:'The Popol Vuh',text:"The Popol Vuh, the Council Book of the K'iche' Maya, was written down in the K'iche' language in the 1550s by K'iche' nobles, and survives in a copy made by the friar Francisco Ximénez around 1701. Its central story follows the Hero Twins, Hunahpu and Xbalanque, down to Xibalba, the place of fear, to face the lords of death who had killed their father and uncle."},
  beats:[
    {text:"In the Popol Vuh, the lords of Xibalba, the underworld, summoned two brothers to play ball, and killed them. Now the brothers' sons, the Hero Twins Hunahpu and Xbalanque, are called down the same road."},
    {text:"They come to a crossroads of four roads: red, black, white and yellow. The black road speaks, and leads to Xibalba. At its end, the lords sit waiting in a row. Some of them are only wooden figures, put there to trick visitors.", lock:true, afterType(){ pick([{label:'Greet the seated lords politely',go:'x_may'},{label:'Send a mosquito ahead to find out who is real'}]); }} ]},

{ key:'may_names', label:'The lords of death', bg:'#2A2430', learn:'names',
  view:()=>PG(`<rect x="40" y="60" width="520" height="270" fill="#3A2E3A"/>${ground(330,'#4A3A3A')}${[120,190,260,330,400,470].map((x,i)=>lord(x,330,.8,{wood:i===0||i===3})).join('')}<g id="mq">${mosquito(100,120)}</g>`,'A row of seated lords. Two of them are wooden figures. A mosquito flies along the row.',{bg:'#2A2430'}),
  enter(){ mood('night'); },
  beats:[
    {text:"The twins send a mosquito down the row. The wooden figures don't flinch. Each real lord yelps, and the lord beside him calls out his name. Tap to send the mosquito.", lock:true, afterType(){ tapCount(4,'Bite',k=>{ const m=$('#mq'); if(m) m.innerHTML=mosquito(100+k*90,180); bell(660+k*30,.03,2); }); }},
    {text:"One Death! Seven Death! Now the twins know every lord by name. In the Popol Vuh, knowing the names of death's lords is the start of beating them."} ]},

{ key:'may_rise', label:'Sun and moon', bg:'#3A3A5A', learn:'rise',
  view:()=>PG(`<g id="sm" style="transition:translate 1s">${['#F0C040','#E8E8F0'].map((c,i)=>`<circle cx="${220+i*160}" cy="300" r="40" fill="${c}" stroke="${K}" stroke-width="2"/><circle cx="${220+i*160}" cy="300" r="70" fill="url(#glowS)"/>`).join('')}</g>${ground(330,'#2A2430')}${temple(300,330,.6)}${maize(80,330,1)}${maize(520,330,1)}`,'Above a temple and fields of maize, the sun and the moon begin to rise.',{bg:'night'}),
  enter(){ mood('light'); },
  beats:[
    {text:"The twins survive every house of trials in Xibalba. At last they let themselves be burned and their bones ground and thrown in a river, and five days later they come back. They trick the lords of death into asking to be sacrificed too, and defeat them. Hold, and rise.", lock:true, show(){ holdOn({label:'Rise',ms:5000,wait:600,onProgress:p=>{ const s=$('#sm'); if(s) s.style.translate=`0 ${-p*200}px`; },onDone:()=>chime()}); }},
    {text:"The twins rise into the sky as the sun and the moon. Death can be outwitted, and life rises again, like the maize."},
    {text:"Today, K'iche' daykeepers still keep the 260-day calendar and pray at fire altars. And in Kaqchikel Maya towns, on the Day of the Dead, families fly giant kites over the cemeteries to reach the people they've lost."} ]},

{ key:'lastpage', label:'The last page', bg:NIGHTBG,
  view:()=>frame(sv(smCover(),'A glowing drum under the northern lights, between two larch trees.')),
  enter(){ mood('light'); },
  beats:[
    {text:"Nine peoples, nine roads: a river and a sledge, a white cloth torn open, the ancestors' voices, a song that keeps the way open, a woman's combed hair under the sea, whales crossing to the west, ashes shared at a feast, a healer's songs, and twins who outwit the lords of death."},
    {text:"Different maps, but the same work: someone goes where the rest of us can't, so that the dead arrive, and the living can carry on."} ]},

{ key:'end', label:'The end', bg:'var(--teal)',
  view:()=>`<div class="title-card" style="cursor:default"><span class="eyebrow">The end of the book</span><h1>The Drum and the Road</h1>
    <p>That was all nine doors: the Evenki and Nanai of Siberia, the mudang of Korea, the shamans of Mongolia and Tuva, the Sámi noaidi, the Inuit angakkuq, the Mapuche machi, the Yanomami xapiri, the Shipibo-Konibo onanya, and the K'iche' Maya Popol Vuh.</p><p id="endsum" style="font-weight:700"></p>
    <p class="draft">A first draft. Each door should be read by people of that tradition: Evenki, Nanai, Korean, Mongolian, Tuvan, Sámi, Inuit, Mapuche, Yanomami, Shipibo-Konibo and K'iche' Maya readers. Sources include: S. M. Shirokogoroff, Psychomental Complex of the Tungus (1935); A. F. Anisimov on Evenki cosmology; L. Sternberg and A. V. Smolyak on the Nanai; Laurel Kendall, Shamans, Housewives, and Other Restless Spirits (1985); Manduhai Buyandelger, Tragic Spirits (2013); Håkan Rydving, The End of Drum-Time (1993); Knud Rasmussen, Intellectual Culture of the Iglulik Eskimos (1929); Ana Mariella Bacigalupo, Shamans of the Foye Tree (2007); Davi Kopenawa and Bruce Albert, The Falling Sky (2013); Peter Gow and others on Shipibo-Konibo healing; Dennis Tedlock, Popol Vuh (1985, rev. 1996); Barbara Tedlock, Time and the Highland Maya (1982).</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="again" type="button">Read it again</button><button class="btn alt" id="pathend" type="button">See your path</button><button class="btn alt" id="chend" type="button">Choose a chapter</button></div>
    <div class="endlinks"><a href="../walk/">Walk Nine Lessons from the Road</a><a href="../../index.html#doors">Back to Many Doors</a></div></div>`,
  enter(){ mood('warm'); $('#again').onclick=e=>{ e.stopPropagation(); go(0); }; $('#chend').onclick=e=>{ e.stopPropagation(); openChapters(true); }; $('#pathend').onclick=e=>{ e.stopPropagation(); openPath(); };
    $('#endsum').textContent=`You learned ${journey.learned.size} of ${LESSONS.length} lessons and walked ${journey.visited.size} of ${DETOURS.length} wrong turns.`+(journey.learned.size===LESSONS.length?' You know the way.':' Read again to learn the rest.'); },
  beats:[{text:null,lock:true}] },

/* ===== wrong turns ===== */
{ key:'x_sib', label:'A wrong turn', bg:'#4A4440',
  view:()=>PG(`${ground(330,'#7A6A5A')}<rect x="60" y="80" width="480" height="250" fill="#5A4E44" stroke="${K}" stroke-width="2"/><g opacity=".45">${pp(300,330,.9,{col:'#3A3430',skin:'#3A3430',trim:'#3A3430',hat:'long'})}</g>`,'A dim, empty house. A faint figure wanders.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"The panyan is put away in a box. Nobody feeds it or speaks to it. In the Nanai belief recorded by ethnographers, a soul without its home and its care can't make the journey. It wanders, unsettled, near the people it left."},
    {text:"Care for the soul comes first, and the road comes later. Rewind, and keep its place at home.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_kor', label:'A wrong turn', bg:'#4A4440',
  view:()=>PG(`${ground(330,'#7A6A5A')}<g opacity=".45">${pp(400,330,.9,{col:'#E8E0D0',skin:'#B8B0A8',trim:'#8A8A8A'})}</g>${pp(180,330,.85,{col:'#E8E0D0',trim:K,arms:'fold'})}`,'A son stands alone. Behind him, the faint figure of his father.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"No gut. The funeral is quick, and nobody says what they needed to say. In Korean belief, someone who dies with han, a deep unresolved grief or grievance, may not be able to leave. And the living carry their own han too."},
    {text:"The gut is where the dead and the living finally have it out, and let each other go. Rewind, and hold the gut.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_mon', label:'A wrong turn', bg:'#2A2430',
  view:()=>PG(`<rect x="40" y="40" width="520" height="290" fill="#3A2E2A"/>${ground(330,'#5A4636')}${pp(300,330,1.05,{col:'#3A4A6A',trim:OCHRE,hat:'plume',arms:'fold',fringe:true})}${drumF(420,290,.4,{painted:false})}`,'The shaman has put her drum down and folded her arms.',{bg:'#2A2430'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"The udgan puts her drum down. A ritual isn't a performance, she says. The ongod are your family's ancestors and hers, and they're invited with offerings, the way you'd welcome an elder into your home."},
    {text:"Rewind, and ask with respect.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_sam', label:'A wrong turn', bg:'#3A3A44',
  view:()=>PG(`${ground(330,'#8A7A60')}<rect x="40" y="60" width="520" height="270" fill="#4A4038" opacity=".4"/><g transform="translate(150 316) rotate(-90)">${pp(0,0,.8,{col:'#2E4A7A',trim:RUST,hat:'cap'})}</g>${pp(250,330,.85,{col:'#2E4A7A',trim:RUST,arms:'up'})}`,'The father leans over the still noaidi, shaking him.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"He shakes the noaidi. In the old accounts, that is the most dangerous thing you can do: the noaidi's soul is far away, and if his body is disturbed, it may lose its way back, and he may not wake at all."},
    {text:"While he travels, the people left behind keep the road open with their song, and wait. Rewind, and keep singing.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_inu', label:'A wrong turn', bg:'#0E2630',
  view:()=>PG(`<path d="M0 0 H600 V40 H0Z" fill="#2A6070"/>${pp(300,320,1.1,{col:'#2A3A4A',trim:'#6A9AA0',hat:'long'})}<path d="M282 230 Q160 160 120 280 Q100 340 200 330 Q140 250 240 300 M318 230 Q440 160 480 280 Q500 340 400 330 Q460 250 360 300" stroke="#1A1614" stroke-width="12" fill="none"/>`,'The sea woman sits alone, her hair a dark tangle. No animals are near.',{bg:'sea'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"The hunters go out. Nothing comes. Breaking the rules after a death tangles the sea woman's hair, and she holds the animals back. Respect for the dead is part of what keeps the whole community fed."},
    {text:"Rewind, and keep the days of mourning.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_map', label:'A wrong turn', bg:'#4A4440',
  view:()=>PG(`${ground(330,'#7A6A5A')}<rect x="230" y="300" width="140" height="30" fill="#5A4A3A" stroke="${K}" stroke-width="2"/>${pp(470,330,.85,{col:'#3A2A2A',trim:RUST,hat:'band',arms:'fold'})}`,'A plain grave, with one mourner.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"She's buried by the end of the day. Nobody tells her story, and the relatives who travelled arrive too late. For the Mapuche, a person belongs to a lineage and a land, and the eluwün is how the community says so, and sends her off honoured."},
    {text:"Rewind, and gather everyone.", lock:true, afterType(){ rewindButton(); }} ]},
{ key:'x_yan', label:'A wrong turn', bg:'#1E3424',
  view:()=>PG(`${vines()}${jtree(60,330,1)}${ground(330,'#4A4030')}<g opacity=".45">${pp(400,330,.8,{col:'#3A3430',skin:'#3A3430',trim:'#3A3430'})}</g>${pp(220,330,.75,{col:'#7A4A2A',trim:OCHRE,hat:'long',arms:'fold'})}<rect x="270" y="300" width="40" height="30" fill="#8A6A44" stroke="${K}" stroke-width="1.6"/>`,'A mourner sits by a basket of belongings. A faint figure lingers nearby.',{bg:'#2E4A34'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"They keep a few things. In Kopenawa's account, anything the dead leave behind keeps their ghost longing for the living, and keeps the living grieving. The ghost lingers, and can't leave for the back of the sky."},
    {text:"For the Yanomami, every trace is erased so both can be free. Rewind, and let everything go.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_shi', label:'A wrong turn', bg:'#4A4440',
  view:()=>PG(`${ground(330,'#6A6458')}<rect x="150" y="200" width="300" height="130" fill="#5A5048" stroke="${K}" stroke-width="2"/>${[200,260,320,380].map(x=>pp(x,330,.6,{col:'#8A8A8A',hat:'none'})).join('')}${pp(500,330,.75,{col:'#3A3A3A',hat:'none'})}`,'A crowded retreat hall full of tourists.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"The retreat is run by an outsider in a costume. Ayahuasca tourism has drawn many fake healers to the Amazon. Some retreats have been dangerous, and some guests have died. Meanwhile real Shipibo healers and their knowledge are turned into a product."},
    {text:"It's a powerful, risky medicine that belongs to a living people. Rewind, and learn from them.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_may', label:'A wrong turn', bg:'#2A2430',
  view:()=>PG(`<rect x="40" y="60" width="520" height="270" fill="#3A2E3A"/>${ground(330,'#4A3A3A')}${lord(160,330,.8,{wood:true})}${lord(250,330,.8,{wood:true})}${lord(400,330,.8)}${lord(480,330,.8)}${pp(320,330,.7,{col:'#3A5A3A',trim:OCHRE,hat:'band',arms:'fold'})}`,'Bowing to two wooden figures while the real lords of death laugh.',{bg:'#2A2430'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"You bow to the first lord. It's a wooden figure. The real lords of Xibalba howl with laughter. This is exactly how the twins' father and uncle were fooled, before the lords sat them on a burning bench and killed them."},
    {text:"In Xibalba, you have to see through the tricks of death. Rewind, and send the mosquito.", lock:true, afterType(){ rewindButton(); }} ]}
];
