<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>The Hall of Two Truths</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one full-screen "flight" — a thin instrument bar on top, the scene card in the middle, the narrator's caption card below it. Single deliberate look: the safety-card palette. */
:root{
  color-scheme: light;
  --cream:#F6EBD2; --parchment:#FBF3DF; --ink:#1E2A2B; --ink-soft:#44524F;
  --teal:#1F5E63; --teal-deep:#123D40; --brown:#8A4B22; --lamp:#F2B640;
  --red:#B8352A; --ok:#2F6B2B;
  --scene-bg: var(--cream);
  --display:'Jost', 'Futura', 'Century Gothic', sans-serif;
  --body:'Atkinson Hyperlegible', 'Verdana', sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;background:var(--scene-bg);transition:background-color 2.2s ease}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--ink);background:var(--parchment);transition:opacity 1.5s,filter 1.5s}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:.8rem;text-transform:uppercase}
#stageLabel{font-family:var(--display);font-weight:500;font-size:.85rem;color:var(--ink-soft);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stageLabel b{color:var(--brown);font-weight:700;margin-right:8px;font-variant-numeric:tabular-nums}
.tog{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:36px}
.tog[aria-pressed="false"]{background:transparent;color:var(--ink-soft);border-style:dashed}
.pick{font-family:var(--body);font-size:.8rem;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:8px;padding:6px 8px;min-height:36px;max-width:190px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pick:focus-visible,.tog:focus-visible,.btn:focus-visible,.spot:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
#stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:18px;padding-block:18px;padding-inline:16px;cursor:pointer;user-select:none}
#visual{width:100%;display:flex;justify-content:center;flex:none}
.frame{position:relative;width:min(100%, calc((100dvh - 380px) * 1.5), 980px);min-width:min(100%,300px);aspect-ratio:3/2;max-width:100%;border-radius:18px;overflow:hidden;transition:filter 3s ease, transform 3s ease}
.frame>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:filter 3s ease}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.caption{flex:none;max-width:720px;width:100%;box-sizing:border-box;background:var(--parchment);border:2px solid var(--ink);border-radius:6px;padding:16px 20px;min-height:4.6em;transition:opacity .8s, filter 1.5s, transform 1.5s, border-color 1.5s}
.caption p{margin:0;font-size:clamp(1.02rem, 2.3vw, 1.3rem);line-height:1.45;text-wrap:pretty}
.caption.quiet{background:transparent;border-color:transparent;text-align:center}
.caption.dark{background:#141413;color:var(--parchment);border-color:#141413}
.caption[hidden]{display:none!important}
#hint{margin:0;font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);opacity:0;transition:opacity .6s;min-height:1em}
#hint.on{opacity:.8;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
#choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.04em;border:2px solid var(--ink);background:var(--teal);color:var(--parchment);border-radius:999px;padding:12px 22px;cursor:pointer;min-height:48px}
.btn.alt{background:var(--parchment);color:var(--ink)}

/* dissolution: the manual's chrome comes apart; the narration always stays sharp */
body.d1 .bar{opacity:.85}
body.d2 .bar{filter:blur(.6px);opacity:.6}
body.d2 .frame{border-radius:28px}
body.d3 .bar{filter:blur(1.5px);opacity:.3}
body.d3 .frame{border-radius:40px}
body.void .bar,body.void #hint{opacity:0!important}

/* title */
.title-card{width:min(100%,640px);background:var(--teal);color:var(--parchment);border:2px solid var(--ink);border-radius:18px;padding:36px 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;align-items:flex-start;cursor:default}
.title-card .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:.75rem;color:var(--lamp);text-transform:uppercase}
.title-card h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1;text-wrap:balance;text-transform:uppercase;letter-spacing:.02em}
.title-card p{margin:0;font-size:1.05rem;line-height:1.5;max-width:46ch}
.title-card ol{margin:4px 0 8px;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;font-size:.98rem}
.title-card .btn{background:var(--lamp);color:var(--ink)}

/* hotspots */
.spot{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:3px solid #FFF3D6;background:rgba(242,182,64,.35);cursor:pointer;padding:0}
.spot::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid #FFF3D6;animation:ping 1.8s ease-out infinite}
.spot.done{opacity:0;pointer-events:none;transition:opacity .6s}
@keyframes ping{from{transform:scale(.7);opacity:.9}to{transform:scale(1.4);opacity:0}}
.heartglow{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(var(--s,0.4));background:radial-gradient(circle,#FFFBEA 0%,rgba(255,221,120,.85) 35%,rgba(255,200,80,0) 70%);transition:transform 1.2s ease;pointer-events:none}

/* breath ring */
.breath{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.6);border-radius:50%;border:4px solid var(--parchment);box-shadow:0 0 0 12px rgba(251,243,223,.15);transition:transform 1s ease-in-out, opacity 1s}

/* svg scenes */
.svgscene{position:absolute;inset:0;width:100%;height:100%}
.flicker{transform-origin:300px 262px;animation:flick 1.3s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1) skewX(0)}30%{transform:scaleY(.9) skewX(3deg)}60%{transform:scaleY(1.06) skewX(-2deg)}}
.orb-down{animation:down 7s ease-in-out forwards}
.orb-up{animation:up 7s ease-in-out forwards}
@keyframes down{to{transform:translateY(91px)}}
@keyframes up{to{transform:translateY(-55px)}}
.dots{stroke-dasharray:2 7;stroke-linecap:round}

/* guide entry */
.guide{position:absolute;inset:0;background:var(--parchment);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;gap:4%;padding:5%;box-sizing:border-box}
.guide .tag,.doorsteps .tag{display:inline-block;font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:clamp(.55rem,1.4vw,.75rem);background:var(--teal);color:var(--parchment);padding:5px 10px;border-radius:4px;text-transform:uppercase}
.guide h2{margin:10px 0 8px;font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,3.4vw,2.2rem);line-height:1.05;text-transform:uppercase;color:var(--brown);text-wrap:balance}
.guide p{margin:0;font-size:clamp(.85rem,1.8vw,1.15rem);line-height:1.45}
.guide .fig{height:100%;display:flex;align-items:center;justify-content:center;background:var(--teal);border-radius:12px;min-height:0}
.frame.guideframe{aspect-ratio:auto;width:min(100%,860px)}
.frame.guideframe .guide{position:relative;inset:auto;padding:24px;gap:24px}
.guide .fig{align-self:stretch;min-height:200px;padding:12px}
.guide .fig svg{height:220px;width:auto}
.guide .gtext{box-sizing:border-box}
.guide .gtext:focus-visible{outline:3px solid var(--lamp)}
@media (max-width:760px){
  .frame.guideframe .guide{grid-template-columns:1fr;gap:16px;padding:18px}
  .guide .fig{min-height:0}
  .guide .fig svg{height:150px}
  .guide h2{font-size:1.5rem}
  .guide p{font-size:1.02rem}
}

/* clear light */
.crack{stroke-dasharray:900;stroke-dashoffset:900;animation:crack 1.2s ease-out forwards}
@keyframes crack{to{stroke-dashoffset:0}}
.bubble{opacity:0;transform:scale(.6);transform-origin:80% 80%;transition:opacity .8s, transform .8s}
.bubble.on{opacity:1;transform:scale(1)}
.ring{position:absolute;left:49.8%;top:43%;width:8%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(242,182,64,.55);transform:translate(-50%,-50%);animation:ring 4.5s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(9);opacity:0}}


/* chapters 4-5 */
.rise{animation:rise 4.5s ease-out forwards}
@keyframes rise{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
.walk{animation:walk 9s ease-in forwards}
@keyframes walk{to{transform:translateY(-22px);opacity:.25}}
.steam path{animation:steam 2.4s ease-in-out infinite}
.steam path+path{animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
.balloon{opacity:0}
.balloon.on{animation:shout 4s ease-out forwards}
@keyframes shout{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.mug{opacity:0}
.mug.on{opacity:1;animation:shake .35s linear 2}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.drawer{transition:transform 1s ease}
.drawer.open{transform:translateX(60px)}
.page{transform-box:fill-box;transform-origin:center;animation:fly 1.6s ease-in forwards}
.page.f2{animation-delay:.35s}.page.f3{animation-delay:.7s}
@keyframes fly{to{transform:translate(160px,-190px) rotate(30deg);opacity:0}}
.glass.flash{animation:flash .9s ease}
@keyframes flash{40%{fill:#FFFFFF}}
.popped{transform-box:fill-box;transform-origin:center;animation:pop 1.2s ease 1s forwards}
@keyframes pop{to{transform:scale(1.5);opacity:0}}
.drops{opacity:0;animation:drops 1s ease 2s forwards}
@keyframes drops{to{opacity:1}}
.drawerbtn{position:absolute;background:transparent;border:2px dashed rgba(251,243,223,.75);border-radius:6px;cursor:pointer;padding:0}
.drawerbtn:hover{background:rgba(242,182,64,.2)}
.drawerbtn:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.run{background:var(--red);font-size:1.2rem;letter-spacing:.24em;text-transform:uppercase;padding:14px 34px;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.checks{position:absolute;inset:0;background:var(--parchment);padding:5%;box-sizing:border-box;display:flex;flex-direction:column;gap:4%}
.ck-head span{display:block;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(.95rem,3.4vw,2rem);color:var(--brown);letter-spacing:.03em}
.ck-head small{display:block;font-size:clamp(.7rem,1.6vw,1rem);color:var(--ink-soft);margin-top:4px}
.ck-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;flex:1}
.ck{display:flex;align-items:center;gap:6%;padding:4%;border:2px solid var(--ink);border-radius:12px;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:clamp(.7rem,1.9vw,1.15rem);line-height:1.25;text-align:left;cursor:pointer;min-width:0}
.ck:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.box{flex:none;width:clamp(18px,3vw,32px);aspect-ratio:1;border:3px solid var(--ink);border-radius:6px;position:relative;background:#FFFFFF}
.ck[aria-pressed="true"] .box{background:var(--ok)}
.ck[aria-pressed="true"] .box::after{content:"";position:absolute;left:30%;top:6%;width:28%;height:58%;border:solid #FFFFFF;border-width:0 4px 4px 0;transform:rotate(45deg)}


/* epilogue */
.duo{position:absolute;inset:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.half{position:relative;border:0;padding:0;margin:0;cursor:pointer;background:none;overflow:hidden;transition:filter .4s}
.half svg{width:100%;height:100%;display:block}
.half span{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(.68rem,1.6vw,.95rem);background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;white-space:nowrap}
.duo:hover .half:not(:hover){filter:brightness(.55)}
.half:focus-visible{outline:4px solid var(--lamp);outline-offset:-4px}
.rules{position:relative;background:var(--parchment);padding:24px;display:flex;flex-direction:column;gap:18px}
.rule-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rule{display:flex;flex-direction:column;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:12px;background:var(--cream);min-width:0}
.rule svg{width:100%;height:auto;border-radius:8px;background:#E9DDBF}
.rule b{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--teal)}
.rule p{margin:0;font-size:clamp(.9rem,1.6vw,1.05rem);line-height:1.35}
.spin{transform-origin:300px 170px;animation:spinr 40s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.bluerise{animation:brise 3s ease-out forwards}
@keyframes brise{to{opacity:.85;transform:translateY(-40px)}}

/* volume 2 */
.approach{transform-origin:300px 205px;animation:approach 9s ease-in forwards}
@keyframes approach{from{transform:scale(.8)}to{transform:scale(1.14)}}
.pulse{transform-origin:300px 205px;animation:pulseg 1.24s ease-in-out infinite}
@keyframes pulseg{50%{opacity:.12;transform:scale(.92)}}
.morph .pulse{animation:none;opacity:0;transition:opacity 1s}
.wrath{transform-origin:300px 205px;transition:transform 1.6s ease, opacity 1.4s ease}
.fl{transform-origin:300px 205px;animation:flick2 .45s ease-in-out infinite alternate}
@keyframes flick2{to{transform:scale(1.04) rotate(1.5deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.peace{opacity:0;transform-origin:300px 205px;transform:scale(.3);transition:opacity 1.6s ease .5s, transform 1.6s ease .5s}
.morph .wrath{transform:scale(.12) rotate(90deg);opacity:0}
.morph .peace{opacity:1;transform:scale(1)}
.frame.facing{transition:none;animation:shake2 .12s linear infinite}
@keyframes shake2{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.holdbtn{position:absolute;inset:0;background:transparent;border:0;padding:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.holdpill{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:8px 16px 8px 8px;font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:clamp(.72rem,1.7vw,.95rem);white-space:nowrap}
.holdpill svg{width:30px;height:30px}
.holdbtn:focus-visible .holdpill{outline:3px solid var(--lamp);outline-offset:3px}
.zone{position:absolute;background:transparent;border:2px dashed rgba(255,255,255,.55);border-radius:50%;cursor:pointer;padding:0}
.zone:focus-visible{outline:3px solid var(--lamp)}
.closing{transform-origin:300px 205px;animation:closing 10s ease-in forwards}
@keyframes closing{from{transform:scale(1.35)}to{transform:scale(.82)}}
.orbit{transform-origin:300px 210px;animation:spinr 18s linear infinite}


/* chapters menu */
#app{position:relative}
.chap{position:absolute;right:16px;top:calc(100% + 0px);z-index:20;width:min(340px,calc(100% - 32px));max-height:min(70vh,560px);overflow-y:auto;background:var(--parchment);border:2px solid var(--ink);border-radius:14px;box-shadow:0 12px 30px rgba(20,20,19,.25);padding:14px;box-sizing:border-box}
.chapwrap{position:relative;z-index:20}
.chap h3{margin:10px 6px 6px;font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brown)}
.chap h3:first-child{margin-top:2px}
.chap ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.chap button{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;background:transparent;border:0;border-radius:8px;padding:10px 8px;font-family:var(--body);font-size:1rem;color:var(--ink);cursor:pointer;min-height:44px}
.chap button:hover,.chap button:focus-visible{background:var(--cream);outline:none}
.chap button[aria-current="true"]{background:var(--cream);font-weight:700}
.chap button small{font-family:var(--display);font-weight:700;font-size:.7rem;letter-spacing:.1em;color:var(--ink-soft);min-width:2.4em;font-variant-numeric:tabular-nums}


/* volume 3 */
.streaks{animation:streak 1.1s linear infinite}
@keyframes streak{from{transform:translateX(-140px)}to{transform:translateX(140px)}}
.blown{animation:blown 2.6s ease-in-out infinite}
@keyframes blown{50%{transform:translate(40px,-8px)}}
.elgrid{position:absolute;inset:0;background:#1B2224;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;padding:6%;box-sizing:border-box}
.el{background:#2A3335;border-radius:14px;display:flex;align-items:center;justify-content:center;opacity:.22;transition:opacity .4s, transform .4s;min-height:0}
.el svg{width:62%;height:auto;max-height:90%}
.el.on{opacity:1;transform:scale(1.04)}
.peb{opacity:0}
.pebs.on .peb{animation:drop .5s ease-in forwards}
@keyframes drop{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:none}}
.mref{opacity:0;transition:opacity 1.2s}
.mref.on{opacity:1}
.approach2{transform-origin:230px 200px;animation:approach 9s ease-in forwards}
.leaf{transform-origin:20px 115px;transform:scaleX(.12);transition:transform .15s}
.doorwrap{position:relative;background:var(--parchment);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:24px;padding:24px;align-items:center}
.doorsteps ol{margin:12px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-size:clamp(.95rem,1.8vw,1.1rem);line-height:1.35}
.doorpic svg{width:100%;height:auto;max-height:260px;display:block}
.doorgrid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px;background:#10181B}
.doorcard{display:flex;flex-direction:column;gap:8px;background:var(--parchment);border:2px solid var(--ink);border-radius:12px;padding:8px;cursor:pointer;font-family:var(--body);font-size:clamp(.82rem,1.6vw,1rem);line-height:1.25;color:var(--ink);text-align:left;min-width:0}
.doorcard svg{width:100%;height:auto;border-radius:8px;display:block}
.doorcard:hover{transform:translateY(-2px)}
.doorcard.nope{opacity:.4;filter:grayscale(1)}
.doorcard:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}

/* pilot: shared production layer */
#visual{position:relative}
.leaving{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;pointer-events:none;z-index:4;animation:leave .7s ease forwards}
@keyframes leave{to{opacity:0;transform:scale(.985)}}
.entering{animation:enter .8s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{clip-path:inset(0 0 0 100% round 18px)}to{clip-path:inset(0 0 0 0 round 18px)}}
.amb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.kb{animation:kb 24s ease-out forwards;transform-origin:62% 48%}
@keyframes kb{to{transform:scale(1.09)}}
.glowspot{position:absolute;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.55) 0%,rgba(255,190,90,.18) 40%,rgba(255,190,90,0) 70%);mix-blend-mode:screen;pointer-events:none;animation:candle 2.3s steps(9,end) infinite;transition:opacity 1.2s ease}

    {text:"Yours is being copied now, like the famous scroll of the scribe Ani: a guidebook and a phrasebook for the underworld. What you will meet, what to say, and what to do."} ]},

{ key:'selves', label:'The many selves', bg:SANDBG, learn:'selves',
  view:()=>PG(`${YOU(300)}${ba(470,200,1.4)}<g opacity=".55">${eg(160,340,1,{head:'human',skin:'#3B2A1C',kilt:'#3B2A1C'})}</g>${heart(300,240,.9)}<path d="M120 90 h70 a14 14 0 0 1 0 28 h-70 a14 14 0 0 1 0 -28Z" fill="${PAP}" stroke="${K}" stroke-width="2.5"/><text x="155" y="109" text-anchor="middle" font-size="14" fill="${K}">YOU</text>`,'You stand in the middle. Beside you are your shadow, a bird with your face, your heart, and your name in an oval cartouche.'),
  enter(){ mood('warm'); },
  beats:[
    {text:"To an Egyptian, a person wasn't one thing. You're made of several parts, and death will pull them apart. The rites are there to bring them back together. Tap each part of you.", lock:true, show(){ tapAll([
      [50,45,'Body',"The khat, your body. It has to be preserved, because the other parts need somewhere to come home to."],
      [50,60,'Heart',"The ib, your heart: the seat of thought, memory and conscience. This is the part that will be weighed."],
      [78,50,'Ba',"The ba, a bird with your own face. It can fly out of the tomb by day and come back to your body at night."],
      [27,64,'Shadow',"The shut, your shadow. It goes with you, and can even move on its own."],
      [26,26,'Name',"The ren, your name. As long as your name is spoken, you exist."] ]); }},
    {text:"Two more parts can't be drawn. The ka, your life-force, lives on in the tomb and is fed by offerings. And the akh is what you hope to become: a shining spirit, once the journey is done."} ]},

/* ===== Volume 1: seventy days ===== */
{ key:'v1', label:'Volume 1', bg:'var(--teal)',
  view:()=>card('Volume 1','Seventy Days',"An Egyptian funeral took about seventy days, the time the star Sirius disappears from the night sky before it rises again. Everything in it was meant to make you whole, and keep you whole."),
  enter(){ mood('night'); bell(196,.1,5); }, beats:[{text:null}] },

{ key:'lastday', label:'The last day', bg:SANDBG,
  view:()=>PG(`${bedE(300,300)}${eg(140,340,.9,{head:'human',skin:SKINF,arms:'raise'})}${eg(470,340,.9,{head:'human',arms:'down',flip:true})}${tombDoor(560,340,.4)}`,'You lie on a gilded bed. Your wife raises her arms in grief. Your son stands at the foot. In the distance, the door of a tomb in the cliffs.'),
  enter(){ mood('room','warm'); heartbeat(60); },
  beats:[
    {text:"It's your turn. You're old, in a house in Thebes, and it won't be long. Fear not. You've spent years getting ready. Tap the three things.", lock:true, show(){ tapAll([
      [23,58,'Your wife',"Your wife. When it's over she will throw dust on her head and wail through the streets, with her hair loose. That is how love is shown."],
      [79,60,'Your son',"Your son. It will be his job to make offerings at your tomb, and to say your name, for the rest of his life."],
      [93,78,'The tomb',"Your tomb in the western cliffs, where the sun sets. You had it cut and painted years ago. Every Egyptian who could afford it did."] ]); }},
    {text:"Hold, and let go. Every evening the sun goes down in the west. So do you.", lock:true, show(){ holdOn({label:'Let go',ms:6000,wait:800,onDone:()=>{ heartStop(); breath(1.5,5); }}); }} ]},

{ key:'black', label:'', bg:'#000000', void:true,
  view:()=>'', enter(){ silenceAll(1); }, beats:[{text:null, lock:true, auto:6000}] },

{ key:'embalm', label:'The embalmers', bg:SANDBG,
  view:()=>PG(`${mummy(300,300,1)}${eg(470,340,.95,{head:'jackal',skin:BLACK,arms:'forward'})}${eg(130,340,.9,{head:'human',arms:'forward'})}`,'Your body on the embalming table. A priest in a jackal mask leans over it.'),
  enter(){ mood('wind','night'); },
  guide:{title:'Natron',text:"Natron is a natural salt from the dry lakes west of the Nile. Packed around the body for about forty days, it drew out the water, so the body would not decay. Then the body was oiled, wrapped in hundreds of metres of linen and tucked with amulets. Herodotus describes the process, and the prices, in his Histories."},
  beats:[
    {text:"Your body goes to the embalmers. A priest wearing the mask of Anubis, the jackal god, leads the work. The brain is drawn out and thrown away. Nobody thinks it matters."},
    {text:"Then they open your side to take out the organs. The apprentice asks about the heart.", lock:true, afterType(){ pick([{label:'Take it out with the rest',go:'x_heart'},{label:'Leave it in its place'}]); }} ]},

{ key:'jars', label:'The embalmers', bg:SANDBG, learn:'heart',
  view:()=>PG(`${jar(150,320,'human',1.4)}${jar(250,320,'baboon',1.4)}${jar(350,320,'jackal',1.4)}${jar(450,320,'falcon',1.4)}${scarab(300,130,.9)}${textBand(70,'The four sons of Horus')}`,'Four jars with lids shaped like a human, a baboon, a jackal and a falcon. Above them, a green stone scarab.'),
  enter(){ mood('warm'); },
  beats:[
    {text:"The heart stays where it is. Four other organs go into jars, each guarded by a son of Horus. Tap each jar.", lock:true, show(){ tapAll([
      [25,60,'Imsety',"Imsety, with a human head, guards the liver."],
      [42,60,'Hapy',"Hapy, the baboon, guards the lungs."],
      [58,60,'Duamutef',"Duamutef, the jackal, guards the stomach."],
      [75,60,'Qebehsenuef',"Qebehsenuef, the falcon, guards the intestines."] ]); }},
    {text:"A carved stone scarab is laid over your heart, inscribed with Spell 30B. You'll need it at the scales. Then you're packed in natron for forty days, and wrapped in linen."} ]},

{ key:'mouth', label:'Opening the mouth', bg:SANDBG, learn:'mouth',
  view:()=>PG(`${mummy(330,340,1.15,{upright:true})}${eg(410,340,.95,{head:'jackal',skin:BLACK,arms:'forward',flip:true})}${eg(200,340,.95,{head:'human',arms:'forward',kilt:'#E8D9B0'})}<path d="M240 248 l30 -10 l4 8 l-28 8Z" fill="${GOLD}" stroke="${K}" stroke-width="1.5"/>`,'At the tomb door your mummy stands upright. A priest reaches toward its face with a small blade.'),
  enter(){ mood('wind','warm'); },
  beats:[
    {text:"Seventy days later, at the tomb door, your mummy is stood upright, and a priest touches its face with a small adze, a woodworker's blade. This is the Opening of the Mouth. Spell 23: my mouth is opened by Ptah. Tap each sense to open it.", lock:true, show(){ tapAll([
      [56,52,'Mouth',"The mouth, to speak the spells and eat the offerings."],
      [56,42,'Eyes',"The eyes, to see."],
      [48,47,'Ears',"The ears, to hear."],
      [64,47,'Nose',"The nose, to breathe."] ]); }},
    {text:"Your senses are given back. Then the mourners weep and throw dust on their heads, the coffin is carried down, and the tomb is sealed."} ]},

{ key:'offering', label:'Your name', bg:SANDBG,
  view:()=>PG(`${tombDoor(220,340,1)}${tableOff(420,340,1.2)}${eg(520,340,.9,{head:'human',arms:'forward',flip:true})}`,'The painted door of your tomb, with your name above it. Your son stands at an offering table piled with bread and fruit.'),
  enter(){ mood('warm'); },
  guide:{title:'An appeal to the living',text:"Many tombs carry an appeal to passers-by: O you who live on earth, who pass by this tomb, say: a thousand of bread, a thousand of beer, for the ka of so-and-so. Egyptians believed that saying the offering formula out loud, the voice offering, fed the dead as well as real bread did. It costs the passer-by only a breath."},
  beats:[
    {text:"Your ka lives on in the tomb, and has to be fed. Your son brings bread and beer to the false door, where the ka comes out to eat. Years pass. He's getting old and busy, and the tomb is a long walk.", lock:true, afterType(){ pick([{label:'Let the offerings stop',go:'x_forgotten'},{label:'Keep coming, and say the name'}]); }} ]},

{ key:'voice', label:'Your name', bg:SANDBG, learn:'name',
  view:()=>PG(`${tombDoor(300,340,1)}<circle cx="300" cy="170" r="110" fill="url(#sun)" opacity=".5"/>`,'The door of your tomb, glowing.'),
  enter(){ mood('light'); },
  beats:[
    {text:"Even when there's no bread, words will do. Say the offering formula for yourself: a thousand of bread, a thousand of beer, a thousand of everything good and pure.", lock:true, afterType(){ tapCount(3,'A thousand',k=>bell(330+k*50,.07,3)); }},
    {text:"As long as your name is spoken, you exist. That's why the Egyptians carved names everywhere, and why erasing a name from a monument was a way to kill someone a second time."} ]},

/* ===== Volume 2: the Duat ===== */
{ key:'v2', label:'Volume 2', bg:'var(--teal)',
  view:()=>card('Volume 2','The Duat',"Every evening the sun god Ra sinks into the west and sails his boat through the underworld, the Duat, during the twelve hours of the night. The dead hope to ride with him."),
  enter(){ mood('night','water'); }, beats:[{text:null}] },

{ key:'duat', label:'The night boat', bg:'#141A2E',
  view:()=>PG(`${nightSky()}${barque(300,250,1,{riders:`${eg(-80,-10,.5,{head:'falcon',crown:'sun',arms:'down'})}${eg(80,-10,.5,{head:'human'})}`})}${apep(160,320,1)}`,'Ra\'s golden boat sails through the night. Below it, the great serpent Apep coils in the dark water.',{frieze:true}),
  enter(){ mood('water','night'); },
  guide:{title:'The twelve hours',text:"Royal tombs in the Valley of the Kings are painted with whole books about this journey, like the Amduat, the Book of What Is in the Underworld. Each of the twelve hours of the night is a different region, with its own gods, dangers and dead. In the deepest hour, the sun is joined with Osiris, and the old sun becomes young again."},
  beats:[
    {text:"You ride in Ra's boat, down into the dark. But the night is dangerous. The great serpent Apep lies in wait every night to swallow the sun. He rises out of the water now, and the boat lurches.", lock:true, afterType(){ pick([{label:'Jump off and swim for it',go:'x_jump'},{label:'Stay in the boat, and hold on'}]); }} ]},

{ key:'steady', label:'The night boat', bg:'#141A2E', learn:'order',
  view:()=>PG(`${nightSky()}${barque(300,250,1,{riders:`${eg(-80,-10,.5,{head:'falcon',crown:'sun',arms:'down'})}${eg(80,-10,.5,{head:'human'})}`})}<g id="ap">${apep(160,320,1)}</g>`,'The boat holds its course above the serpent.',{frieze:true}),
  enter(){ mood('water','night'); hiss(); },
  beats:[
    {text:"Hold the boat steady while the gods fight him off.", lock:true, show(){ holdOn({label:'Hold the boat steady',ms:5000,wait:600,onDone:()=>{ const a=$('#ap'); if(a){ a.style.transition='opacity 1.5s'; a.style.opacity='0'; } chime(); }}); }},
    {text:"The serpent sinks back. Apep is never killed for good; he comes back every night. Order has to be kept, again and again. That was the Egyptian idea of the world, and of a life."} ]},

{ key:'gates', label:'The gates', bg:SANDBG,
  view:()=>PG(`<g id="gt">${pylon(300,340,1.3,{open:false})}</g>`,'A tall gateway with closed doors. A guard with a jackal head and a knife stands beside it.'),
  enter(){ mood('night'); },
  beats:[
    {text:"To reach the hall of judgment you have to pass a series of gates. Each one has a keeper, a watcher and a herald, often with animal heads and knives in their hands. The first raises his knife. Who are you?", lock:true, afterType(){ pick([{label:'Offer him gold',go:'x_gold'},{label:'“I know you, and I know your name”'}]); }} ]},

{ key:'names', label:'The gates', bg:SANDBG, learn:'names',
  view:()=>PG(`<g id="gt">${pylon(300,340,1.3,{open:true})}</g>`,'The gateway stands open, with light inside.'),
  enter(){ mood('night','warm'); },
  beats:[
    {text:"Spells 144 to 147 give the name of every gatekeeper. That's the key. To know a being's true name is to have power over it. The first gate opens. Name the keepers of the next three.", lock:true, afterType(){ tapCount(3,'I know your name',k=>{ thudE(); const g=$('#gt'); if(g){ g.innerHTML=pylon(300,340,1.3,{open:false}); setTimeout(()=>{ g.innerHTML=pylon(300,340,1.3,{open:true}); },350); } }); }},
    {text:"Gate after gate opens. The book lists twenty-one portals for the house of Osiris alone, and you have every name."} ]},

{ key:'forms', label:'Changing form', bg:SANDBG,
  view:()=>PG(`${ba(160,220,1.5)}<g transform="translate(300 230)"><path d="M0 0 Q-30 -10 -24 -40 Q0 -20 0 0 Q0 -50 0 -60 Q0 -50 0 0 Q24 -20 24 -40 Q30 -10 0 0Z" fill="#6A8FC9" stroke="${K}" stroke-width="2"/><path d="M0 0 V60" stroke="${GREEN}" stroke-width="4"/></g><g transform="translate(450 260)"><path d="M-30 -10 Q-10 -30 20 -22 L40 -40 L44 -36 L26 -16 Q10 4 -30 -10Z" fill="${LINEN}" stroke="${K}" stroke-width="1.8"/><path d="M-4 -4 V40 M6 -4 V40" stroke="${K}" stroke-width="2"/></g>`,'A bird with a human face, a blue lotus, and a white heron.'),
  enter(){ mood('light'); },
  beats:[
    {text:"Between the gates, a whole group of spells, 77 to 88, lets you take on other forms, each with a different power. Which will you take?", lock:true, choice:[
      {label:'A golden falcon',reply:"The falcon, spell 77: I have risen and gathered myself together like a golden falcon. It was the form of Horus, and of kings: strength and sight."},
      {label:'A lotus flower',reply:"The lotus, spell 81: I am the pure lotus that came forth from the sunlight. It closes at night and opens at dawn, so it means being reborn every day."},
      {label:'A swallow',reply:"The swallow, spell 86. Swallows come back every year, and this spell lets you fly out of the tomb and home to visit your family."} ]},
    {text:"The idea underneath all of them is freedom. The dead aren't meant to be shut in a dark box. They're meant to come forth by day, and go where they wish."} ]},

/* ===== Volume 3: the hall of two truths ===== */
{ key:'v3', label:'Volume 3', bg:'var(--teal)',
  view:()=>card('Volume 3','The Hall of Two Truths',"Spell 125, the heart of the whole book. You stand before forty-two judges and then the great balance. Everything you did in your life is about to be weighed against truth itself."),
  enter(){ mood('night'); bell(196,.1,5); }, beats:[{text:null}] },

{ key:'confession', label:'The declarations', bg:SANDBG,
  view:()=>{ const j=Array.from({length:14},(_,i)=>`<g transform="translate(${60+i*36} 150) scale(.32)">${eg(0,0,1,{head:['human','jackal','falcon','ibis'][i%4],arms:'down',crown:'feather'})}</g>`).join(''); return PG(`${j}${j.replace(/translate\((\d+) 150\)/g,(m,a)=>`translate(${a} 250)`)}${j.replace(/translate\((\d+) 150\)/g,(m,a)=>`translate(${a} 340)`)}`,'Three rows of small seated judges, forty-two in all, each with a feather on its head.'); },
  enter(){ mood('night','warm'); },
  guide:{title:'The negative confession',text:"Spell 125 has the dead stand before forty-two judges, one for each province of Egypt, and declare their innocence to each by name. Scholars call it the negative confession. It isn't a list of commandments. It's a list of what a decent life avoids, and it's strikingly practical: about cheating, cruelty, water, food and words."},
  beats:[
    {text:"First you must speak. Make your declarations, one judge at a time.", lock:true, afterType(){ setTimeout(()=>askAll(["I have not killed.","I have not made anyone weep.","I have not stolen.","I have not told lies.","I have not cheated with the weights of the balance.","I have not held back the water in its season.","I have not been quick to anger."],'I declare it'),500); }},
    {text:"Then you end the way the scroll ends: I am pure, I am pure, I am pure, I am pure.", lock:true, afterType(){ tapCount(4,'I am pure',k=>bell(330+k*50,.08,3)); }} ]},

{ key:'weigh', label:'The weighing', bg:SANDBG,
  view:()=>PG(`${YOU(80,{arms:'raise'})}${eg(170,340,.95,{head:'jackal',skin:BLACK,arms:'forward'})}${balance(300,340,1,0)}${ammit(420,340,.75)}${eg(530,340,.95,{head:'ibis',hold:'palette'})}${textBand(60,'The Hall of the Two Truths')}`,'Anubis leads you to a great golden balance. Your heart sits on one side, a feather on the other. Ammit the Devourer crouches beside it, and ibis-headed Thoth stands ready to write.'),
  enter(){ mood('night','warm'); },
  beats:[
    {text:"This is the scene everyone knows. Anubis leads you to a great balance. Tap each thing.", lock:true, show(){ tapAll([
      [43,58,'Your heart',"Your heart, on one side of the scale: everything you thought, felt and did."],
      [62,58,'The feather',"On the other side, a single feather: the feather of Ma'at, goddess of truth, justice and order."],
      [72,80,'Ammit',"Ammit, the Devourer: part crocodile, part lion, part hippopotamus. If your heart is heavier than the feather, she eats it, and you cease to exist."],
      [88,62,'Thoth',"Thoth, the ibis-headed god of writing, ready to write down the result."] ]); }},
    {text:"Now your heart starts to tremble. It remembers things. You see that nobody is quite watching your side of the scale.", lock:true, afterType(){ pick([{label:'Press the scale down a little',go:'x_thumb'},{label:'Speak Spell 30B to your heart'}]); }} ]},

{ key:'spell30', label:'The weighing', bg:SANDBG, learn:'maat',
  view:()=>PG(`${YOU(80,{arms:'raise'})}${eg(170,340,.95,{head:'jackal',skin:BLACK,arms:'forward'})}${balance(300,340,1,0)}${ammit(420,340,.75)}${eg(530,340,.95,{head:'ibis',hold:'palette'})}${textBand(60,'O my heart of my mother')}`,'The heart and the feather on the scale.'),
  enter(){ mood('night','warm'); },
  beats:[
    {text:"You speak the words from the scarab: O my heart of my mother, O my heart of my mother, do not stand up as a witness against me. Do not oppose me in the court. Hold, and keep your heart steady.", lock:true, show(){ holdOn({label:'Keep your heart steady',ms:7000,wait:600,onProgress:p=>{ const b=$('.beam'); if(b) b.style.transform=`rotate(${(1-p)*Math.sin(performance.now()/300)*8}deg)`; },onDone:()=>chime()}); }},
    {text:"The beam settles level. Your heart is exactly as light as truth. Thoth writes it down, and Ammit goes hungry."} ]},

{ key:'osiris', label:'True of voice', bg:SANDBG, learn:'osiris',
  view:()=>PG(`${eg(170,340,1,{head:'falcon',crown:'double',arms:'forward'})}${YOU(90,{arms:'raise'})}${osiris(430,340,1.15)}<path d="M330 340 V120 Q380 90 520 120 V340" fill="none" stroke="${K}" stroke-width="3"/>${textBand(60,'True of voice')}`,'Horus, with a falcon head, leads you to Osiris, who sits enthroned in a shrine, wrapped in white, with a green face.'),
  enter(){ mood('light'); chime(); },
  guide:{title:'Spell 175',text:"Spell 175 has a moving conversation between Osiris and the creator god Atum. Osiris asks what the afterlife will be like, with no water, no air, no love-making. Atum answers that he has given him spirit instead of water and air, and peace of heart instead of bread and beer."},
  beats:[
    {text:"Thoth announces the verdict: you are true of voice. Horus, the falcon god, takes you by the hand and leads you to his father Osiris, enthroned in a shrine."},
    {text:"Osiris was the god who was murdered, torn apart, gathered up and brought back to life. Every justified Egyptian becomes an Osiris: one who died, and rose. Hold, and kneel.", lock:true, show(){ holdOn({label:'Kneel before Osiris',ms:4000,wait:600}); }},
    {text:"From now on your name is written with his: the Osiris, true of voice."} ]},

/* ===== Volume 4: coming forth ===== */
{ key:'v4', label:'Volume 4', bg:'var(--teal)',
  view:()=>card('Volume 4','Coming Forth by Day',"Beyond the hall lies a perfect Egypt, and every morning a door back into the light."),
  enter(){ mood('light'); bell(196,.1,5); }, beats:[{text:null}] },

{ key:'reeds', label:'The Field of Reeds', bg:'#C9B66A',
  view:()=>PG(`${water(250,26)}${water(310,26)}<rect x="0" y="276" width="600" height="34" fill="#C9B66A"/>${reeds(20,250,8,70)}${reeds(500,250,8,70)}${eg(220,250,.6,{head:'human',arms:'forward'})}${eg(330,250,.6,{head:'human',skin:SKINF,arms:'forward'})}${reeds(380,250,10,90)}${sunDisk(520,90,24)}`,'Green islands cut by blue canals. You and your wife harvest tall barley under the sun.',{ground:340}),
  enter(){ mood('water','light'); },
  beats:[
    {text:"The Field of Reeds. Spell 110 shows it: islands cut by canals, where the dead plough, sow and harvest, the Nile always in flood, and the barley taller than a man. Your wife is there."},
    {text:"But even paradise has work in it. A voice calls your name: you've been chosen to dig the canals.", lock:true, afterType(){ pick([{label:'Pick up a hoe and go yourself',go:'x_work'},{label:'Wake your shabtis'}]); }} ]},

{ key:'shabti', label:'The Field of Reeds', bg:'#C9B66A', learn:'fields',
  view:()=>PG(`<rect x="0" y="200" width="600" height="110" fill="#C9B66A"/>${reeds(10,300,6,60)}${reeds(540,300,6,60)}${water(310,26)}${shabtis(6,306)}${sunDisk(520,90,24)}`,'A row of small mummy-shaped figures on the canal bank.',{ground:340}),
  enter(){ mood('water','light'); },
  beats:[
    {text:"You were buried with shabtis, small figures who answer for you. Spell 6 tells them what to say. Tap to wake each one.", lock:true, afterType(){ tapCount(6,'“Here I am!”',k=>{ const s=document.querySelectorAll('.sb')[k-1]; if(s) s.style.opacity='1'; bell(392+k*30,.06,2); }); }},
    {text:"Here I am, says each shabti. Some tombs held 401 of them: one worker for every day of the year, plus thirty-six overseers. Paradise, as a farmer would picture it."} ]},

{ key:'dawn', label:'Coming forth', bg:'#E8B866', learn:'forth',
  view:()=>PG(`<rect x="0" y="40" width="600" height="300" fill="#E8B866"/>${sunDisk(300,190,50)}${barque(300,290,1,{sun:false,riders:`${eg(-60,-10,.5,{head:'falcon',crown:'sun',arms:'down'})}${eg(40,-10,.5,{head:'human',arms:'raise'})}`})}${ba(500,140,1.2)}`,'Dawn. The sun rises over Ra\'s boat. You stand in the boat with your arms raised, and your ba flies free.'),
  enter(){ mood('light'); chime(); },
  beats:[
    {text:"At dawn, Ra's boat rises out of the eastern horizon, and you come forth with it into the light of day. This is the title of the whole book: coming forth by day."},
    {text:"You're an akh now, a shining spirit. Your ba can fly out to visit the world of the living, sit in the shade of your garden, and come home to the tomb at night. And your name is still spoken."} ]},

{ key:'lastpage', label:'The last page', bg:DARKE,
  view:()=>frame(sv(egCover(),'Anubis, the balance, Ammit and Thoth under the sun.')),
  enter(){ mood('warm'); },
  beats:[
    {text:"That's the journey: seventy days to make the body last, a mouth opened, a name kept alive, the night boat of the sun, gates passed by knowing their names, a heart weighed against truth, and fields that never fail."},
    {text:"The scroll gave you the words. But the heart on the scale was the life you had actually lived."} ]},

{ key:'end', label:'The end', bg:'var(--teal)',
  view:()=>`<div class="title-card" style="cursor:default"><span class="eyebrow">The end of the book</span><h1>True of voice</h1>
    <p>That was the whole road: the scroll, the many selves, the last day, the embalmers, the Opening of the Mouth, your name, the night boat, the gates, changing form, the declarations, the weighing, Osiris, the Field of Reeds and coming forth by day.</p><p id="endsum" style="font-weight:700"></p>
    <p class="draft">Sources: the Book of Coming Forth by Day (the "Book of the Dead"), especially the Papyrus of Ani, British Museum EA 10470 (c. 1250 BCE); spells 6, 23, 30B, 77–88, 110, 125, 144–147 and 175; the Amduat; R. O. Faulkner, The Ancient Egyptian Book of the Dead (1985); J. H. Taylor (ed.), Journey Through the Afterlife (British Museum, 2010); Herodotus, Histories 2.85–90.</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="again" type="button">Read it again</button><button class="btn alt" id="pathend" type="button">See your path</button><button class="btn alt" id="chend" type="button">Choose a chapter</button></div>
    <div class="endlinks"><a href="../walk/">Walk the Forty-Two Days</a><a href="../../index.html#doors">Back to Many Doors</a></div></div>`,
  enter(){ mood('warm'); $('#again').onclick=e=>{ e.stopPropagation(); go(idx('scroll')); }; $('#chend').onclick=e=>{ e.stopPropagation(); openChapters(true); }; $('#pathend').onclick=e=>{ e.stopPropagation(); openPath(); };
    $('#endsum').textContent=`You learned ${journey.learned.size} of ${LESSONS.length} lessons and walked ${journey.visited.size} of ${DETOURS.length} wrong turns.`+(journey.learned.size===LESSONS.length?' You know the way.':' Read again to learn the rest.'); },
  beats:[{text:null,lock:true}] },

/* ===== wrong turns ===== */
{ key:'x_heart', label:'A wrong turn', bg:SANDBG,
  view:()=>PG(`${YOU(80,{arms:'raise'})}${balance(300,340,1,-14,{left:'empty'})}${ammit(420,340,.75)}`,'At the great balance, the pan for your heart is empty.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"They take your heart out with the rest. Months later, in the Hall of the Two Truths, Anubis turns to the scale, and there is nothing to put on it. There's nothing to weigh, nothing to remember with, nothing to answer the judges."},
    {text:"The heart was the one organ always left inside. It was you: your mind, your memory, your conscience. Rewind, and leave it in its place.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_forgotten', label:'A wrong turn', bg:'#8A7A5A',
  view:()=>PG(`${sand(220)}${tombDoor(300,340,1,{erased:true})}`,'Your tomb half buried in sand. The name over the door has been hacked away.',{bg:'#C9B88A'}),
  enter(){ mood('drone','wind'); },
  beats:[
    {text:"The offerings stop. Your son dies, and his children never come. Sand drifts against the door. Centuries later someone chisels your name off the wall to reuse the stone. Nobody says it any more."},
    {text:"For an Egyptian, that was a second death, worse than the first. Rewind, and keep saying the name.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_jump', label:'A wrong turn', bg:'#0A0D18',
  view:()=>PG(`<rect x="0" y="40" width="600" height="300" fill="#0A0D18"/>${apep(160,300,1.2)}<g transform="translate(470 330)">${ba(0,0,.8)}</g>`,'Total darkness. The serpent coils in the water. Your small ba flutters alone.',{bg:'#0A0D18'}),
  enter(){ mood('drone','water'); hiss(); },
  beats:[
    {text:"You jump. The boat sails on without you and its light goes with it. You're alone in the dark water of the Duat, with no sun, no gods and no dawn coming, and something huge moving underneath you."},
    {text:"The dead were safe only in the sun's company. Chaos is outside the boat; order is inside it. Rewind, and hold on.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_gold', label:'A wrong turn', bg:SANDBG,
  view:()=>PG(`${pylon(300,340,1.3,{open:false})}${[240,262,284].map(x=>`<circle cx="${x}" cy="330" r="9" fill="${GOLD}" stroke="${K}" stroke-width="1.5"/>`).join('')}`,'Gold rings lie on the ground before the closed gate.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"You hold out gold. The gatekeeper doesn't take it. He doesn't even look at it. The knife stays raised and the door stays shut."},
    {text:"In the Duat, nothing gets you through but knowledge. That's why the spells list every name. Rewind, and say: I know you, and I know your name.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_thumb', label:'A wrong turn', bg:SANDBG,
  view:()=>PG(`${YOU(80,{arms:'raise'})}${balance(300,340,1,12)}${ammit(420,340,.75)}${eg(530,340,.95,{head:'ibis',hold:'palette'})}`,'The balance tips sharply. Thoth turns to look.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"You press the scale down with one finger. And the little baboon on top of the balance, who is Thoth too, turns his head and looks straight at you. Ammit gets up."},
    {text:"One of the declarations you just made was: I have not cheated with the weights of the balance. Ma'at is truth and balance itself. You can't cheat the scale that measures cheating. Rewind, and speak to your heart.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_work', label:'A wrong turn', bg:'#C9B66A',
  view:()=>PG(`${water(250,26)}<rect x="0" y="276" width="600" height="64" fill="#8A6A3A"/>${eg(300,330,.7,{head:'human',arms:'down'})}${sunDisk(520,90,24)}`,'You stand alone in a muddy ditch under the sun.',{ground:340}),
  enter(){ mood('drone'); },
  beats:[
    {text:"You go yourself. You dig all day, and the next day, and the next. The canals of the Field of Reeds are very long, and eternity is longer."},
    {text:"Egyptians thought of this, and buried shabtis to answer the call. Paradise is for living, not for labour. Rewind, and wake your shabtis.", lock:true, afterType(){ rewindButton(); }} ]}
];
