<style>
/* Shared chrome for the Many Doors books. Each book overrides the tokens in its own :root block. Single deliberate light look, like the Bardo series. */
:root{
  color-scheme:light;

}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}

button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:2px solid var(--ink);background:var(--paper)}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.85rem}
.brand small{display:block;font-weight:500;letter-spacing:.04em;text-transform:none;color:var(--ink-soft);font-size:.78rem;font-family:var(--body)}
.bar .sp{flex:1}
.pill,.tog{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;text-decoration:none;min-height:36px;display:inline-flex;align-items:center}

@keyframes toastin{from{opacity:0;transform:translate(-50%,-8px)}}

.menu button{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;background:transparent;border:0;border-radius:8px;padding:9px 8px;font-size:.98rem;cursor:pointer;min-height:44px}

.menu .vchip{flex:1;justify-content:center;font-family:var(--display);font-weight:700;font-size:.78rem;border:2px solid var(--ink);border-radius:999px;padding:7px 6px;min-height:40px}

/* svg motion helpers */

<script>
/* Shared engine for the Many Doors books: sound, narration, the full-screen player and its interactions. */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------------- sound ---------------- */
const SND={ctx:null,m:null,nb:null,bb:null,on:store.get('md-sound')!=='0',loops:{},drone:null};
/* the drone: a quiet, slowly breathing tone on A under everything, so silence only happens on purpose. level(v,secs) fades it (0 = silent, 1 = normal). */
function makeDrone(c,dest,vol=.05){ const t=c.currentTime,g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+6); g.connect(dest);
  const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=650; lp.Q.value=.6; lp.connect(g);
  const sw=c.createOscillator(), sg=c.createGain(); sw.frequency.value=.045; sg.gain.value=260; sw.connect(sg).connect(lp.frequency); sw.start(t);
  const nodes=[sw]; [[55,'sine',.55,0],[110,'sawtooth',.16,-4],[110.3,'sawtooth',.12,3],[164.8,'sine',.12,0],[220,'sine',.1,2],[329.6,'sine',.035,-3]].forEach(([f,type,v,dt],i)=>{ const o=c.createOscillator(),og=c.createGain(); o.type=type; o.frequency.value=f; o.detune.value=dt; og.gain.value=v;
    const l=c.createOscillator(),lg=c.createGain(); l.frequency.value=.03+i*.017; lg.gain.value=v*.45; l.connect(lg).connect(og.gain); o.connect(og).connect(lp); o.start(t); l.start(t); nodes.push(o,l); });
  return {level(v,secs=2){ const n=c.currentTime; g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(Math.max(g.gain.value,.0001),n); g.gain.exponentialRampToValueAtTime(Math.max(vol*v,.0001),n+secs); },
    stop(){ this.level(0,1.5); setTimeout(()=>nodes.forEach(o=>{try{o.stop()}catch(e){}}),1700); }}; }

function aInit(){ if(SND.ctx){ if(SND.ctx.state!=='running') try{SND.ctx.resume()}catch(e){} return; }
  try{ SND.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  const c=SND.ctx; SND.m=c.createGain(); SND.m.gain.value=SND.on?.9:0; SND.m.connect(c.destination);
  const n=c.sampleRate*2; SND.nb=c.createBuffer(1,n,c.sampleRate); SND.bb=c.createBuffer(1,n,c.sampleRate);
  const w=SND.nb.getChannelData(0), b=SND.bb.getChannelData(0); let l=0;
  for(let i=0;i<n;i++){ const r=Math.random()*2-1; w[i]=r; l=(l+.02*r)/1.02; b[i]=l*3.5; }
  SND.drone=makeDrone(c,SND.m); }
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{ if(SND.ctx&&SND.ctx.state!=='running') try{SND.ctx.resume()}catch(e){} },{capture:true,passive:true}));
const T=()=>SND.ctx.currentTime;
function aEnv(g,t,p,a,d){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(p,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d); }
function tone(fr,{type='sine',peak=.12,a=.01,d=2,at=0}={}){ if(!SND.ctx) return; const c=SND.ctx,t=T()+at,o=c.createOscillator(); o.type=type; o.frequency.value=fr; const g=c.createGain(); aEnv(g,t,peak,a,d); o.connect(g).connect(SND.m); o.start(t); o.stop(t+a+d+.1); }
function nz({freq=1000,type='highpass',peak=.08,a=.003,d=.03,q=.7,brown=false}={}){ if(!SND.ctx) return; const c=SND.ctx,t=T(),s=c.createBufferSource(); s.buffer=brown?SND.bb:SND.nb; const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q; const g=c.createGain(); aEnv(g,t,peak,a,d); s.connect(f).connect(g).connect(SND.m); s.start(t,Math.random()); s.stop(t+a+d+.1); }
function loopOn(name,build,vol,fade=2){ if(!SND.ctx||SND.loops[name]) return; const g=SND.ctx.createGain(); g.gain.value=.0001; g.connect(SND.m); const nodes=build(g); g.gain.exponentialRampToValueAtTime(vol,T()+fade); SND.loops[name]={g,nodes}; }
function loopOff(name,fade=1.5){ const L=SND.loops[name]; if(!L) return; delete SND.loops[name]; const t=T(); L.g.gain.cancelScheduledValues(t); L.g.gain.setValueAtTime(Math.max(L.g.gain.value,.0001),t); L.g.gain.exponentialRampToValueAtTime(.0001,t+fade); setTimeout(()=>L.nodes.forEach(n=>{try{n.stop()}catch(e){}}),(fade+.2)*1000); }
function allOff(f=1.2){ Object.keys(SND.loops).forEach(k=>loopOff(k,f)); }
function pad(name,freqs,vol=.04){ loopOn(name,g=>{ const out=[]; freqs.forEach((fr,i)=>{ const c=SND.ctx,o=c.createOscillator(); o.frequency.value=fr; o.detune.value=i%2?4:-4; const tg=c.createGain(); tg.gain.value=.5; const l=c.createOscillator(); l.frequency.value=.1+i*.07; const lg=c.createGain(); lg.gain.value=.35; l.connect(lg).connect(tg.gain); o.connect(tg).connect(g); o.start(); l.start(); out.push(o,l); }); return out; },vol,4); }
function noiseLoop(name,type,freq,vol,brown=true){ loopOn(name,g=>{ const c=SND.ctx,s=c.createBufferSource(); s.buffer=brown?SND.bb:SND.nb; s.loop=true; const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; s.connect(f).connect(g); s.start(); return [s]; },vol); }
function fireLoop(){ noiseLoop('fire','lowpass',500,.12); if(!SND.ctx) return; const L=SND.loops.fire; if(!L||L.crack) return; L.crack=setInterval(()=>{ if(!SND.loops.fire) return clearInterval(L.crack); if(Math.random()<.5) nz({freq:2500+Math.random()*3000,peak:.03+Math.random()*.05,d:.015}); },90); }
function waterLoop(){ noiseLoop('water','bandpass',700,.1,false); }
function windLoop(){ noiseLoop('wind','bandpass',420,.12); }
function bell(f=392,v=.16){ [1,2.01,3.02,4.2].forEach((k,i)=>tone(f*k,{peak:v/(i+1.3),a:.005,d:5-i})); }
function bowl(f=196,v=.18){ [1,2.76,5.4].forEach((k,i)=>tone(f*k,{peak:v/(i+1.4),a:.01,d:6-i*1.5})); }
function chime(){ [523.25,659.25,783.99,1046.5,1318.5].forEach((fr,i)=>tone(fr,{peak:.09,d:3,at:i*.14})); }
function drum(v=.5,at=0){ if(!SND.ctx) return; const c=SND.ctx,t=T()+at,o=c.createOscillator(); o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(42,t+.25); const g=c.createGain(); aEnv(g,t,v,.005,.4); o.connect(g).connect(SND.m); o.start(t); o.stop(t+.5); }
function whoosh(v=.14){ if(!SND.ctx) return; const c=SND.ctx,t=T(),s=c.createBufferSource(); s.buffer=SND.nb; const f=c.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.2; f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(2400,t+.6); f.frequency.exponentialRampToValueAtTime(400,t+1.3); const g=c.createGain(); aEnv(g,t,v,.4,.9); s.connect(f).connect(g).connect(SND.m); s.start(t); s.stop(t+1.5); }
function plop(){ tone(420,{type:'triangle',peak:.12,d:.25}); nz({freq:900,type:'bandpass',peak:.05,d:.08}); }
function thud(){ drum(.6); nz({type:'lowpass',freq:300,peak:.2,d:.3,brown:true}); }
function choir(){ pad('choir',[220,277.2,329.6,440],.05); setTimeout(()=>loopOff('choir',3),5000); }
function setSound(on){ SND.on=on; store.set('md-sound',on?'1':'0'); if(SND.m) SND.m.gain.setTargetAtTime(on?.9:0,T(),.2); }

/* ---------------- narration ---------------- */
const VO={on:('speechSynthesis' in window)&&store.get('md-voiceon')!=='0',voice:null,list:[],rate:parseFloat(store.get('md-rate'))||.86};
function vScore(v){ let n=0; const nm=v.name.toLowerCase(); if(/natural|neural|premium|enhanced|siri/.test(nm)) n+=50; if(/online/.test(nm)) n+=20; if(/en-gb/i.test(v.lang)) n+=15; else if(/^en/i.test(v.lang)) n+=8; else n-=100;
  if(/daniel|arthur|george|ryan|thomas|oliver|guy|libby|sonia|serena|kate|martha|google uk english male/.test(nm)) n+=10;
  if(/compact|espeak|zarvox|trinoids|albert|bad news|bells|boing|bubbles|cellos|whisper|jester|organ|superstar|wobble|fred|junior|ralph/.test(nm)) n-=60; return n; }
function loadVoices(){ if(!('speechSynthesis' in window)) return; const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>vScore(b)-vScore(a)); if(!vs.length) return; VO.list=vs; const saved=store.get('md-voice'); const k=saved?vs.findIndex(v=>v.name===saved):0; VO.voice=vs[Math.max(k,0)]; }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function narrate(text){ return new Promise(res=>{ if(!VO.on||!('speechSynthesis' in window)) return res(false); try{ speechSynthesis.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(text.replace(/[“”]/g,'"')); if(VO.voice) u.voice=VO.voice; u.rate=VO.rate; u.pitch=.98;
  let done=false; const fin=()=>{ if(!done){ done=true; res(true); } }; u.onend=fin; u.onerror=fin; setTimeout(fin,Math.max(4000,text.length*95/VO.rate));
  try{ speechSynthesis.speak(u); }catch(e){ fin(); } }); }
function hush(){ try{ speechSynthesis.cancel(); }catch(e){} }

/* ---------------- the player ---------------- */
class Abort extends Error{}
let PS=null; /* the live player session */
function alive(s){ if(!s||PS!==s) throw new Abort(); }
function openPlayer({title,sub,steps=[],menu=null,color}){
  aInit(); closePlayer(true);
  const el=document.createElement('div'); el.className='player'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-label',title);
  if(color) el.style.setProperty('--c',color);
  el.innerHTML=`<div class="pbar"><span class="ptitle"><b>${esc(sub||'')}</b>${esc(title)}</span>
    ${window.MD_HOME?`<a class="sbtn home" href="${MD_HOME}">← Doors</a>`:''}
    ${menu?`<button type="button" class="sbtn" id="pMenu" aria-expanded="false">${esc(menu.label)}</button>`:''}
    <button type="button" class="sbtn" id="pSound" aria-pressed="${SND.on}">Sound</button>
    ${'speechSynthesis' in window?`<button type="button" class="sbtn" id="pVoice" aria-expanded="false">Voice</button>`:''}
    <button type="button" class="sbtn x" id="pClose" aria-label="Close">×</button>
    <div class="menu" id="pPanel" hidden></div></div>
    ${steps.length?`<ol class="steps" id="pSteps">${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:''}
    <div class="stage" id="pStage"><svg class="art" id="pArt" viewBox="0 0 600 400" role="img" preserveAspectRatio="xMidYMid slice"></svg><canvas class="cv" id="pCv"></canvas><div class="layer" id="pLayer"></div></div>
    <div class="scap"><span class="seye" id="pEye"></span><p id="pText" aria-live="polite"></p><div class="srow" id="pRow"></div></div>`;
  document.body.appendChild(el); document.body.classList.add('insession');
  const s={el,menu}; PS=s;
  el.querySelector('#pClose').onclick=()=>closePlayer();
  el.querySelector('#pSound').onclick=e=>{ setSound(!SND.on); e.currentTarget.setAttribute('aria-pressed',SND.on); };
  const panel=el.querySelector('#pPanel');
  const toggle=(btn,build)=>{ const open=panel.hidden||panel.dataset.k!==btn.id; panel.hidden=!open; panel.dataset.k=btn.id; el.querySelectorAll('.pbar .sbtn[aria-expanded]').forEach(b=>b.setAttribute('aria-expanded',b===btn&&open)); if(open) build(); };
  const vb=el.querySelector('#pVoice'); if(vb) vb.onclick=()=>toggle(vb,()=>voicePanel(panel));
  const mb=el.querySelector('#pMenu'); if(mb) mb.onclick=()=>toggle(mb,()=>{ panel.innerHTML=menu.build(); panel.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ panel.hidden=true; menu.go(b.dataset.go); }); });
  el.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!panel.hidden) panel.hidden=true; else closePlayer(); } });
  setTimeout(()=>el.querySelector('#pClose').focus({preventScroll:true}),50);
  return s;
}
function voicePanel(p){ const list=VO.list.slice(0,14); const sp=[['Slow',.76],['Normal',.86],['Brisk',.98]];
  p.innerHTML=`<h3>Narrator</h3><ol><li><button type="button" id="vOn" aria-current="${VO.on}">${VO.on?'Narrator on · tap to turn off':'Narrator off · tap to turn on'}</button></li></ol>
  <h3>Speed</h3><div class="vchips">${sp.map(([l,r])=>`<button type="button" class="vchip" data-r="${r}" aria-pressed="${Math.abs(VO.rate-r)<.01}">${l}</button>`).join('')}</div>
  <h3>Voice</h3>${list.length?`<ol>${list.map((v,i)=>`<li><button type="button" data-v="${i}" aria-current="${VO.voice&&v.name===VO.voice.name}">${esc(v.name.replace(/Microsoft |Google |\(.*?\)/g,''))}</button></li>`).join('')}</ol>`:'<p>No voices have loaded on this device yet.</p>'}
  <p>Voices depend on your device. Safari on Apple devices and Edge on Windows usually have the most natural ones.</p>`;
  p.querySelector('#vOn').onclick=()=>{ VO.on=!VO.on; store.set('md-voiceon',VO.on?'1':'0'); if(!VO.on) hush(); voicePanel(p); };
  p.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ VO.rate=+b.dataset.r; store.set('md-rate',VO.rate); voicePanel(p); narrate('This is how I will sound.'); });
  p.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ VO.voice=VO.list[+b.dataset.v]; store.set('md-voice',VO.voice.name); VO.on=true; store.set('md-voiceon','1'); voicePanel(p); narrate('This is how I will sound.'); });
}
function closePlayer(silent){ const s=PS; PS=null; hush(); if(SND.ctx) allOff(.8); cvStop(); if(s){ s.el.remove(); document.body.classList.remove('insession'); if(!silent&&s.onclose) s.onclose(); } }
function stepTo(i){ document.querySelectorAll('#pSteps li').forEach((li,k)=>li.className=k<i?'done':k===i?'on':''); }
function art(svg,label=''){ const a=$('#pArt'); if(!a) return; a.innerHTML=svg; a.setAttribute('aria-label',label); }
function layer(){ return $('#pLayer'); }
function clearLayer(){ const l=layer(); if(l) l.innerHTML=''; }
function eyebrow(t){ const e=$('#pEye'); if(e) e.textContent=t||''; }
function toast(t,ms=2400){ const st=$('#pStage'); if(!st) return; const d=document.createElement('div'); d.className='toast'; d.textContent=t; st.appendChild(d); setTimeout(()=>d.remove(),ms); }
function splitText(t){ const parts=t.match(/[^.!?]+[.!?]+["”’']?\s*|[^.!?]+$/g)||[t]; const out=[]; let cur=''; parts.forEach(x=>{ if((cur+x).length>200&&cur){ out.push(cur.trim()); cur=x; } else cur+=x; }); if(cur.trim()) out.push(cur.trim()); return out; }
/* show a passage, one or two sentences at a time, each with Continue */
async function say(s,text,{eye,tap=true}={}){ alive(s); if(eye!==undefined) eyebrow(eye); const chunks=splitText(text);
  for(let i=0;i<chunks.length;i++){ alive(s); const p=$('#pText'); p.textContent=chunks[i]; $('#pRow').innerHTML=''; const spoke=narrate(chunks[i]); if(tap||i<chunks.length-1) await waitTap(s,spoke); else await spoke; } }
function waitTap(s,spoke,label='Continue'){ return new Promise((res,rej)=>{ if(s) s.n=(s.n||0)+1; const row=$('#pRow'); row.innerHTML=`<button type="button" class="sgo" id="pGo">${esc(label)} <span aria-hidden="true">→</span></button>`;
  const b=row.querySelector('#pGo'); let done=false; const go=()=>{ if(done) return; done=true; hush(); document.removeEventListener('keydown',kd); res(); };
  const kd=e=>{ if(PS!==s){ document.removeEventListener('keydown',kd); return; } if((e.key===' '||e.key==='Enter'||e.key==='ArrowRight')&&!e.target.closest('.menu,.pbar')){ e.preventDefault(); go(); } };
  b.onclick=go; document.addEventListener('keydown',kd); b.focus({preventScroll:true}); }); }
function ask(text,eye){ if(eye!==undefined) eyebrow(eye); $('#pText').textContent=text; $('#pRow').innerHTML=''; narrate(text); }
/* multiple choice in the caption row; returns index. right: index of the correct answer or -1 for any */
function choose(s,text,opts,{right=-1,wrong}={}){ alive(s); ask(text); return new Promise(res=>{ const row=$('#pRow'); row.style.justifyContent='flex-start';
  row.innerHTML=opts.map((o,i)=>`<button type="button" class="sgo alt" data-i="${i}">${esc(o)}</button>`).join('');
  row.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; if(right>=0&&i!==right){ b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); if(wrong){ const w=typeof wrong==='function'?wrong(i):wrong; $('#pText').textContent=w; narrate(w); } return; } row.style.justifyContent=''; res(i); });
  row.querySelector('button').focus({preventScroll:true}); }); }
/* press and hold the stage */
function hold(s,{label,ms=3000,ask:q,early,onP}){ alive(s); if(q) ask(q); return new Promise(res=>{ const l=layer(); l.innerHTML=`<button type="button" class="holdzone" aria-label="${esc(label)}"><span class="holdpill"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="rgba(30,42,43,.2)" stroke-width="4"/><circle id="hr" cx="20" cy="20" r="16" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="100.5" stroke-dashoffset="100.5" transform="rotate(-90 20 20)" stroke-linecap="round"/></svg>${esc(label)}</span></button>`;
  const z=l.querySelector('.holdzone'), r=l.querySelector('#hr'); let t0=0,raf=0,done=false,hm=null;
  const tick=()=>{ const p=Math.min(1,(performance.now()-t0)/ms); r.setAttribute('stroke-dashoffset',100.5*(1-p)); onP&&onP(p); if(p>=1){ done=true; if(hm){ hm.stop(true); hm=null; } z.classList.remove('on'); l.innerHTML=''; res(); return; } raf=requestAnimationFrame(tick); };
  const down=e=>{ if(done) return; e.preventDefault(); t0=performance.now(); z.classList.add('on'); hm=holdHum(ms); raf=requestAnimationFrame(tick); };
  const up=()=>{ if(done||!t0) return; cancelAnimationFrame(raf); t0=0; if(hm){ hm.stop(false); hm=null; } z.classList.remove('on'); r.setAttribute('stroke-dashoffset',100.5); onP&&onP(0); if(early){ $('#pText').textContent=early; } };
  z.addEventListener('pointerdown',down); ['pointerup','pointerleave','pointercancel'].forEach(ev=>z.addEventListener(ev,up));
  z.addEventListener('keydown',e=>{ if((e.key===' '||e.key==='Enter')&&!e.repeat) down(e); }); z.addEventListener('keyup',e=>{ if(e.key===' '||e.key==='Enter') up(); });
  z.focus({preventScroll:true}); }); }
/* the sound of a press and hold: a soft hum that climbs an octave as the ring fills, a bell when it's full */
function holdHum(ms){ aInit(); if(!SND.ctx) return {stop(){}}; const c=SND.ctx,t=T(),s=ms/1000,g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.08,t+.25); g.connect(SND.m);
  const os=[[1,-5],[1.5,4],[2,0]].map(([k,dt],i)=>{ const o=c.createOscillator(); o.type=i?'sine':'triangle'; o.detune.value=dt; o.frequency.setValueAtTime(196*k,t); o.frequency.exponentialRampToValueAtTime(392*k,t+s); const og=c.createGain(); og.gain.value=[.6,.25,.15][i]; o.connect(og).connect(g); o.start(t); return o; });
  return {stop(full){ const n=T(); g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(Math.max(g.gain.value,.0001),n); g.gain.exponentialRampToValueAtTime(.0001,n+(full?.6:.18)); if(!full) os.forEach(o=>{ o.frequency.cancelScheduledValues(n); o.frequency.setValueAtTime(o.frequency.value,n); o.frequency.exponentialRampToValueAtTime(o.frequency.value*.8,n+.18); }); os.forEach(o=>o.stop(n+.7)); if(full) bell(784,.08); }}; }
/* tap glowing spots on the picture; spots: [{x,y,label,say}] in % */
function spots(s,{ask:q,items,onTap}){ alive(s); if(q) ask(q); return new Promise(res=>{ const l=layer(); let left=items.length;
  l.innerHTML=items.map((it,i)=>`<button type="button" class="spot" data-i="${i}" style="left:${it.x}%;top:${it.y}%" aria-label="${esc(it.label||'Tap')}"><i></i>${it.label?`<b>${esc(it.label)}</b>`:''}</button>`).join('');
  l.querySelectorAll('.spot').forEach(b=>b.onclick=()=>{ const it=items[+b.dataset.i]; b.classList.add('done'); left--; if(it.say){ $('#pText').textContent=it.say; narrate(it.say); } onTap&&onTap(+b.dataset.i,it); if(!left){ setTimeout(()=>{ l.innerHTML=''; res(); },it.say?1800:600); } });
  l.querySelector('.spot').focus({preventScroll:true}); }); }
/* two pictures side by side; pick one */
function duo(s,{ask:q,a,b,right=-1,wrong}){ alive(s); ask(q); return new Promise(res=>{ const l=layer(); l.innerHTML=`<div class="duo">${[a,b].map((o,i)=>`<button type="button" class="half" data-i="${i}"><svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">${o.svg}</svg><span>${esc(o.label)}</span></button>`).join('')}</div>`;
  l.querySelectorAll('.half').forEach(h=>h.onclick=()=>{ const i=+h.dataset.i; if(right>=0&&i!==right){ if(wrong){ $('#pText').textContent=wrong; narrate(wrong); } return; } l.innerHTML=''; res(i); }); }); }
/* words to clear: tap each to let it go */
function release(s,{ask:q,words,done}){ alive(s); ask(q); return new Promise(res=>{ const l=layer(); l.innerHTML=`<div class="picks">${words.map((w,i)=>`<button type="button" class="pk" data-i="${i}">${esc(w)}</button>`).join('')}</div>`; let left=words.length;
  l.querySelectorAll('.pk').forEach(b=>b.onclick=()=>{ b.classList.add('gone'); plop(); if(--left===0){ setTimeout(()=>{ l.innerHTML=''; res(); },500); } }); }); }
/* hold still (pointer/keys); ms of stillness needed */
function still(s,{ask:q,ms=8000,moved='You moved. Start again, gently.'}){ alive(s); ask(q); if(SND.drone) SND.drone.level(0,2.5); return new Promise(r0=>{ const res=v=>{ if(SND.drone) SND.drone.level(1,4); r0(v); }; const l=layer(); l.innerHTML=`<div class="stillbar"><i></i></div>`; const bar=l.querySelector('i'); let t0=performance.now(),raf;
  const reset=()=>{ t0=performance.now(); }; const mv=()=>{ if(performance.now()-t0>600){ $('#pText').textContent=moved; } reset(); };
  addEventListener('pointermove',mv); addEventListener('keydown',mv);
  const tick=()=>{ if(PS!==s){ cleanup(); if(SND.drone) SND.drone.level(1,2); return; } const p=Math.min(1,(performance.now()-t0)/ms); bar.style.width=p*100+'%'; if(p>=1){ cleanup(); l.innerHTML=''; res(); return; } raf=requestAnimationFrame(tick); };
  const cleanup=()=>{ cancelAnimationFrame(raf); removeEventListener('pointermove',mv); removeEventListener('keydown',mv); }; raf=requestAnimationFrame(tick); }); }
/* count taps (beads, breaths, pebbles) */
function count(s,{ask:q,n,label='Tap',onTap}){ alive(s); ask(q); return new Promise(res=>{ const l=layer(); let k=0; l.innerHTML=`<button type="button" class="holdzone" aria-label="${esc(label)}"><span class="holdpill">${esc(label)}</span></button><span class="counter">0 / ${n}</span>`;
  const z=l.querySelector('.holdzone'), c=l.querySelector('.counter'); z.onclick=()=>{ k++; c.textContent=`${k} / ${n}`; onTap&&onTap(k); if(k>=n){ l.innerHTML=''; res(); } }; z.focus({preventScroll:true}); }); }

/* ---------------- sitting: a minute with a breathing ring ---------------- */
let cvRaf=0;
function cvStop(){ cancelAnimationFrame(cvRaf); const c=$('#pCv'); if(c){ c.getContext('2d').clearRect(0,0,c.width,c.height); c.style.opacity=0; } }
function cvBreath(col,ink='#FFF6DE'){ const cv=$('#pCv'); if(!cv) return; cv.style.opacity=1; const g=cv.getContext('2d'); const t0=performance.now();
  const fr=()=>{ const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1; if(cv.width!==Math.round(r.width*dpr)){ cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); }
    const W=cv.width,H=cv.height,t=(performance.now()-t0)/1000; g.clearRect(0,0,W,H); const ph=(Math.sin(t*2*Math.PI/10-Math.PI/2)+1)/2; const R=Math.min(W,H)*(.16+.14*ph);
    const gr=g.createRadialGradient(W/2,H/2,R*.2,W/2,H/2,R*1.6); gr.addColorStop(0,col); gr.addColorStop(1,'rgba(0,0,0,0)'); g.globalAlpha=.35; g.fillStyle=gr; g.fillRect(0,0,W,H);
    g.globalAlpha=.9; g.strokeStyle=ink; g.lineWidth=3*dpr; g.beginPath(); g.arc(W/2,H/2,R,0,Math.PI*2); g.stroke();
    for(let i=0;i<12;i++){ const a=i/12*Math.PI*2+t*.05; g.globalAlpha=.25+.5*ph; g.beginPath(); g.arc(W/2+Math.cos(a)*R*1.35,H/2+Math.sin(a)*R*1.35,2.5*dpr,0,Math.PI*2); g.fillStyle=ink; g.fill(); }
    cvRaf=requestAnimationFrame(fr); }; fr(); }
async function sit(s,{text,secs=60,col='#E8B13A',bg}){ alive(s); if(bg) art(bg); ask(text,'Sit'); cvBreath(col); if(SND.ctx) bowl(196,.14);
  await new Promise(res=>{ const l=layer(); l.innerHTML=`<span class="sittime">1:00</span><button type="button" class="ghost">Finish early</button>`; const tEl=l.querySelector('.sittime'); const t0=performance.now(); let iv;
    const end=()=>{ clearInterval(iv); l.innerHTML=''; res(); };
    l.querySelector('.ghost').onclick=end;
    iv=setInterval(()=>{ if(PS!==s){ clearInterval(iv); return res(); } const left=Math.max(0,secs-Math.floor((performance.now()-t0)/1000)); tEl.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`; if(left<=0){ if(SND.ctx) bowl(196,.12); end(); } },250); });
  cvStop(); alive(s); }

/* ---------------- svg helpers shared by the books ---------------- */
function rays(cx,cy,r,n,op=.2,col='#FFF6DE'){ let o=''; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2,a2=a+Math.PI/n*.6; o+=`<path d="M${cx} ${cy}L${cx+Math.cos(a)*r} ${cy+Math.sin(a)*r}L${cx+Math.cos(a2)*r} ${cy+Math.sin(a2)*r}Z" fill="${col}" opacity="${op}"/>`; } return o; }
function stars(n,seed=3,h=400,col='#FFF6DE'){ let s=seed,o=''; const r=()=>{ s=(s*9301+49297)%233280; return s/233280; }; for(let i=0;i<n;i++) o+=`<circle cx="${(r()*600).toFixed(1)}" cy="${(r()*h).toFixed(1)}" r="${(r()*1.6+.3).toFixed(2)}" fill="${col}" opacity="${(r()*.7+.2).toFixed(2)}"/>`; return o; }
function rnd(seed){ let s=seed; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
function header(B){ const h=$('#bar'); if(!h) return; h.innerHTML=`<span class="brand">${esc(B.brand)}<small>${esc(B.brandSub)}</small></span><span class="sp"></span>${(B.links||[]).filter(l=>l[1]).map(([t,u])=>`<a class="pill" href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join('')}`; }

/* The walk: one short daily practice per stage, with a map of stones. Each day: the book, what it means, a practice, a task for today, a minute of sitting. */
function stonePos(i,n){ const per=n<=10?n:n<=21?7:n<=42?7:7; const rows=Math.ceil(n/per); const r=Math.floor(i/per), c=i%per, cc=r%2?per-1-c:c;
  const W=600,H=400, dx=(W-120)/Math.max(per-1,1), dy=rows>1?(H-110)/(rows-1):0; return [60+cc*dx, (rows>1?55:200)+r*dy]; }
function walkMap(W,n,{label=true}={}){ const N=W.days.length; let d='',st=''; for(let i=0;i<N;i++){ const [x,y]=stonePos(i,N); d+=(i?'L':'M')+x+' '+y; }
  for(let i=0;i<N;i++){ const [x,y]=stonePos(i,N), P=W.parts[W.days[i].p], done=i<n, cur=i===n; const r=N>20?13:N>9?18:26;
    st+=`<g><circle cx="${x}" cy="${y}" r="${r}" fill="${done?P.col:'#26343A'}" stroke="${cur?W.gold||'#E8B13A':P.col}" stroke-width="${cur?4:2.5}"/>${label?`<text x="${x}" y="${y+4.5}" text-anchor="middle" font-size="${N>20?11:14}" font-weight="700" fill="${done?'#10181B':'#FFF6DE'}">${i+1}</text>`:''}${cur?`<circle cx="${x}" cy="${y}" r="${r+6}" fill="none" stroke="${W.gold||'#E8B13A'}" stroke-width="2" class="pulse"/>`:''}</g>`; }
  return `<rect width="600" height="400" fill="#10181B"/>${W.mapBg?W.mapBg():''}<path d="${d}" fill="none" stroke="rgba(255,246,222,.25)" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>${st}`; }
function walkLanding(W){
  const n=Math.min(+store.get(W.key+'-next')||0,W.days.length-1);
  $('#wrap').innerHTML=`<section class="hero"><div><span class="eyebrow">${esc(W.eyebrow)}</span><h1>${esc(W.title)}</h1><p class="lede">${esc(W.lede)}</p><p class="note">${esc(W.note)}</p>
    <div class="cta"><button type="button" class="btn gold" id="begin">${n?`Continue: ${W.unit} ${n+1}`:`Begin ${W.unit} 1`}</button>${n?`<button type="button" class="btn alt" id="restart">Start over</button>`:''}${W.manualUrl?`<a class="pill" href="${W.manualUrl}" target="_blank" rel="noopener">${esc(W.manualName)}</a>`:''}</div></div>
    <div class="cover"><svg viewBox="0 0 600 400" role="img" aria-label="Map of the ${W.days.length} ${W.unit.toLowerCase()}s">${walkMap(W,n)}</svg></div></section>
    <section class="sec"><h2>The ${W.parts.length>1?'stages':'path'}</h2><div class="cgrid">${W.parts.map((p,i)=>{ const first=W.days.findIndex(d=>d.p===i), last=W.days.length-1-[...W.days].reverse().findIndex(d=>d.p===i); return `<button type="button" class="ck" data-n="${first}" style="--c:${p.col}"><i></i><b>${esc(p.name)}</b><span>${W.unit}s ${first+1}${last>first?'–'+(last+1):''} · ${esc(p.sub)}</span></button>`; }).join('')}</div></section>
    <section class="sec how"><h2>Each ${W.unit.toLowerCase()}</h2>${[['The book',W.howBook||'What the tradition itself says, in plain words.'],['What it means','What it could mean for a living person.'],['A practice','A short interactive moment on the screen.'],['Today','One small thing to do before tomorrow.'],['Sit','A minute of quiet with a breathing ring.']].map(([a,b])=>`<div><b>${a}</b><p>${esc(b)}</p></div>`).join('')}</section>
    <details class="all"><summary>Read every ${W.unit.toLowerCase()} as text</summary>${W.days.map((d,i)=>`<h3>${W.unit} ${i+1}: ${esc(d.t)}</h3><p>${esc(d.book)}</p><p>${esc(d.mean)}</p><p><b>Today:</b> ${esc(d.try)}</p>`).join('')}</details>
    <section class="sec"><h2>Sources</h2><p class="sources">${W.sources}</p></section>`;
  $('#begin').onclick=()=>playWalk(W,n);
  const r=$('#restart'); if(r) r.onclick=()=>{ store.set(W.key+'-next','0'); playWalk(W,0); };
  document.querySelectorAll('.ck').forEach(b=>b.onclick=()=>playWalk(W,+b.dataset.n));
}
async function playWalk(W,n){
  const D=W.days[n], P=W.parts[D.p];
  const menu={label:W.unit+'s',build:()=>`<h3>Jump to a ${W.unit.toLowerCase()}</h3><ol>${W.days.map((d,i)=>`<li><button type="button" data-go="${i}" aria-current="${i===n}"><small>${i+1}</small>${esc(d.t)}</button></li>`).join('')}</ol>`,go:i=>playWalk(W,+i)};
  const s=openPlayer({title:D.t,sub:`${W.unit} ${n+1} of ${W.days.length}`,steps:['The book','Meaning','Practice','Today','Sit'],menu,color:P.col});
  s.onclose=()=>walkLanding(W);
  const bg=W.art(D,n,P);
  try{
    if(W.ambient) W.ambient(D,P);
    stepTo(0); art(bg,D.t); await say(s,D.book,{eye:`${P.name} · the book`});
    stepTo(1); await say(s,D.mean,{eye:'What it means'});
    stepTo(2); clearLayer(); eyebrow('Practice'); if(D.act) await D.act(s,D,P); else if(D.a) await runAct(s,D.a,P); else await hold(s,{label:'Press and hold',ms:3500,ask:'Press and hold while you let that sink in.'});
    alive(s); art(bg,D.t);
    stepTo(3); await say(s,D.try,{eye:'Today'});
    stepTo(4); await sit(s,{text:D.sit,col:P.col});
    alive(s); store.set(W.key+'-next',String(Math.min(n+1,W.days.length-1)));
    if(n===W.days.length-1){ if(W.finale) await W.finale(s); store.set(W.key+'-next','0'); closePlayer(); return; }
    art(walkMap(W,n+1),'Your path'); eyebrow(''); $('#pText').textContent=`${W.unit} ${n+1} done. ${W.unit} ${n+2}, “${W.days[n+1].t}”, is waiting.`; $('#pRow').innerHTML=`<button type="button" class="sgo alt" id="wDone">Close for today</button><button type="button" class="sgo" id="wNext">Go on to ${W.unit.toLowerCase()} ${n+2} →</button>`;
    $('#wDone').onclick=()=>closePlayer(); $('#wNext').onclick=()=>playWalk(W,n+1); $('#wNext').focus({preventScroll:true});
  }catch(e){ if(!(e instanceof Abort)) console.error(e); }
}

/* practice specs written as data: {k:'hold'|'still'|'release'|'count'|'choose', ...} */
async function runAct(s,a,P){
  const q=a.q;
  if(a.k==='hold') await hold(s,{label:a.label||'Press and hold',ms:a.ms||4000,ask:q,early:a.early||'Not yet. Hold again, slowly.'});
  else if(a.k==='still') await still(s,{ask:q,ms:a.ms||8000});
  else if(a.k==='release') await release(s,{ask:q,words:a.words});
  else if(a.k==='count') await count(s,{ask:q,n:a.n,label:a.label||'Tap',onTap:k=>{ if(SND.ctx) (a.sound==='bell'?bell(392+k*20,.07):plop()); }});
  else if(a.k==='choose'){ const i=await choose(s,q,a.opts,{right:a.right??-1,wrong:a.wrong}); if(a.replies&&a.replies[i]) await say(s,a.replies[i]); }
  if(a.after) await say(s,a.after);
}

/* Vignette kit for The Hall of Two Truths: figures in profile on papyrus, after the Papyrus of Ani (c. 1250 BCE). */
const K='#22180F', PAP='#E9D3A1', BLUE='#1F5F8B', LAPIS='#2B4C8C', RED='#A8361F', GREEN='#3E8E5E', GOLD='#D9A321', SKIN='#B9653A', SKINF='#E2B27A', LINEN='#F7F1E1', BLACK='#1E1A16';
const EG_DEFS=`<defs><pattern id="fib" width="7" height="400" patternUnits="userSpaceOnUse"><line x1="3" y1="0" x2="3" y2="400" stroke="#C9AE6E" stroke-width="1" opacity=".5"/></pattern><pattern id="fib2" width="600" height="9" patternUnits="userSpaceOnUse"><line x1="0" y1="4" x2="600" y2="4" stroke="#C9AE6E" stroke-width="1" opacity=".35"/></pattern>
<radialGradient id="sun"><stop offset="0" stop-color="#FFE9A8"/><stop offset=".5" stop-color="${GOLD}" stop-opacity=".6"/><stop offset="1" stop-color="${GOLD}" stop-opacity="0"/></radialGradient><clipPath id="egclip"><rect x="0" y="0" width="600" height="400"/></clipPath></defs>`;
function kheker(y){ let o=''; for(let x=0;x<600;x+=20){ const c=[BLUE,RED,GREEN][(x/20)%3]; o+=`<path d="M${x+3} ${y+30} V${y+8} Q${x+10} ${y-2} ${x+17} ${y+8} V${y+30}Z" fill="${c}" stroke="${K}" stroke-width="1.5"/><circle cx="${x+10}" cy="${y+14}" r="3" fill="${PAP}" stroke="${K}"/>`; } return o; }
function papyrus(inner,{frieze=true,ground=340,bg=PAP}={}){ return `${EG_DEFS}<g clip-path="url(#egclip)"><rect width="600" height="400" fill="${bg}"/><rect width="600" height="400" fill="url(#fib)"/><rect width="600" height="400" fill="url(#fib2)"/>
  ${frieze?`${kheker(0)}<rect x="0" y="30" width="600" height="6" fill="${BLUE}"/><rect x="0" y="36" width="600" height="3" fill="${K}"/>`:''}
  ${inner}${ground?`<rect x="0" y="${ground}" width="600" height="4" fill="${K}"/>${[0,1,2,3,4,5].map(i=>`<rect x="${i*100}" y="${ground+4}" width="100" height="10" fill="${[RED,BLUE,GREEN][i%3]}" stroke="${K}" stroke-width="1.5"/>`).join('')}`:''}</g>`; }
function eyeLine(){ return ''; }
/* a striding figure facing right; head: human | jackal | ibis | falcon */
function eg(x,y,s=1,{head='human',skin=SKIN,kilt=LINEN,flip=false,crown=null,hold=null,arms='forward'}={}){
  const H={human:`<path d="M-9 -150 Q-10 -168 4 -170 Q16 -170 16 -158 L21 -153 L16 -150 L15 -143 L4 -140 Z" fill="${skin}" stroke="${K}" stroke-width="2"/><path d="M-12 -150 Q-14 -174 4 -174 Q14 -174 15 -164 L6 -162 L4 -146 L-4 -136 L-14 -136Z" fill="${BLACK}" stroke="${K}" stroke-width="1.5"/><path d="M-10 -162 l12 0 M-11 -156 l12 0 M-11 -150 l10 0 M-11 -144 l8 0" stroke="${BLUE}" stroke-width="1.5"/><path d="M9 -160 q3 -1 5 1" stroke="${K}" stroke-width="1.6" fill="none"/>`,
   jackal:`<path d="M-8 -138 Q-12 -160 0 -164 L-4 -186 L6 -168 L10 -170 L12 -186 L14 -166 Q18 -164 22 -160 L38 -156 L36 -150 L16 -150 L6 -138Z" fill="${BLACK}" stroke="${K}" stroke-width="1.6"/><path d="M-8 -150 L-12 -132 L4 -134Z" fill="${LAPIS}" stroke="${K}"/><circle cx="16" cy="-160" r="1.8" fill="${GOLD}"/>`,
   ibis:`<path d="M-8 -138 Q-12 -164 4 -166 Q14 -166 14 -158 Q30 -156 44 -138 Q30 -150 14 -152 L6 -138Z" fill="${LINEN}" stroke="${K}" stroke-width="1.6"/><path d="M-10 -160 Q-4 -168 6 -166 L4 -136 L-12 -134Z" fill="${LAPIS}" stroke="${K}"/><circle cx="8" cy="-158" r="1.8" fill="${K}"/>`,
   falcon:`<path d="M-8 -138 Q-12 -164 4 -168 Q16 -168 18 -158 L24 -152 L16 -150 L8 -138Z" fill="${GREEN}" stroke="${K}" stroke-width="1.6"/><path d="M4 -156 q4 4 10 2" stroke="${K}" stroke-width="1.5" fill="none"/><circle cx="8" cy="-160" r="2" fill="${K}"/><path d="M-12 -158 L-12 -134 L4 -136Z" fill="${LAPIS}" stroke="${K}"/>`};
  const C=crown==='double'?`<path d="M-8 -168 V-196 H12 V-176 Q20 -186 22 -200 L26 -198 Q24 -176 16 -168Z" fill="${RED}" stroke="${K}" stroke-width="1.5"/><path d="M-6 -168 Q-8 -200 2 -214 Q12 -200 10 -168Z" fill="${LINEN}" stroke="${K}" stroke-width="1.5"/>`:crown==='sun'?`<circle cx="2" cy="-188" r="16" fill="${RED}" stroke="${K}" stroke-width="1.5"/><path d="M-12 -178 q6 4 4 -6" stroke="${K}" fill="none"/>`:crown==='feather'?`<path d="M2 -170 Q-4 -200 6 -214 Q10 -196 6 -170Z" fill="${LINEN}" stroke="${K}" stroke-width="1.5"/>`:'';
  const A=arms==='raise'?`<path d="M14 -118 L34 -140 L38 -136 L20 -112Z M-14 -116 L4 -140 L8 -136 L-8 -112Z" fill="${skin}" stroke="${K}" stroke-width="1.8"/>`:arms==='down'?`<path d="M14 -118 L18 -84 L12 -84 L8 -116Z" fill="${skin}" stroke="${K}" stroke-width="1.8"/>`:`<path d="M14 -118 L40 -100 L38 -94 L10 -110Z M-14 -116 L-18 -86 L-12 -84 L-8 -112Z" fill="${skin}" stroke="${K}" stroke-width="1.8"/>`;
  const HO=hold==='ankh'?`<g transform="translate(42 -98)"><ellipse cx="0" cy="-8" rx="5" ry="7" fill="none" stroke="${GOLD}" stroke-width="3"/><path d="M-8 0 H8 M0 0 V18" stroke="${GOLD}" stroke-width="3.5"/></g>`:hold==='staff'?`<line x1="40" y1="-150" x2="40" y2="0" stroke="${K}" stroke-width="3"/><path d="M40 -150 l8 -6" stroke="${K}" stroke-width="3"/>`:hold==='palette'?`<rect x="34" y="-108" width="22" height="7" fill="${LINEN}" stroke="${K}" stroke-width="1.5"/><line x1="44" y1="-112" x2="54" y2="-132" stroke="${K}" stroke-width="2"/>`:'';
  return `<g transform="translate(${x} ${y}) scale(${flip?-s:s} ${s})">
   <path d="M-16 0 L-8 0 L-2 -64 L-12 -64Z M10 0 L20 0 L8 -64 L-2 -64Z" fill="${skin}" stroke="${K}" stroke-width="1.8"/><path d="M-20 0 H-6 M8 0 H24" stroke="${K}" stroke-width="3"/>
   <path d="M-16 -64 L14 -64 L16 -92 L-14 -92Z" fill="${kilt}" stroke="${K}" stroke-width="1.8"/><path d="M0 -92 L10 -64" stroke="${K}" stroke-width="1"/>
   <path d="M-12 -92 L12 -92 L20 -124 L-18 -124Z" fill="${skin}" stroke="${K}" stroke-width="1.8"/>${A}
   <path d="M-18 -124 Q0 -112 20 -124 L18 -130 Q0 -122 -16 -130Z" fill="${BLUE}" stroke="${K}" stroke-width="1.5"/><path d="M-16 -130 Q0 -122 18 -130 L12 -136 L-10 -136Z" fill="${GOLD}" stroke="${K}" stroke-width="1.2"/>
   <rect x="-6" y="-142" width="10" height="10" fill="${skin}" stroke="${K}" stroke-width="1.5"/>${H[head]}${C}${HO}</g>`; }
function osiris(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})">
  <path d="M-50 0 V-90 H-20 V-60 H10 V0Z" fill="${RED}" stroke="${K}" stroke-width="2"/><path d="M-46 -4 V-86 H-24 M-46 -40 H10" stroke="${GOLD}" stroke-width="3" fill="none"/>
  <path d="M-24 -60 Q-30 -120 -14 -140 L14 -140 Q20 -100 18 -60 L30 -60 L32 0 L-4 0 L-4 -40 L-24 -40Z" fill="${LINEN}" stroke="${K}" stroke-width="2"/><path d="M-20 -100 h34 M-20 -80 h36" stroke="${K}" stroke-width="1"/>
  <path d="M-12 -140 L16 -140 L18 -160 Q4 -176 -10 -160Z" fill="${GREEN}" stroke="${K}" stroke-width="1.8"/><path d="M16 -150 L22 -146 L16 -144" fill="${GREEN}" stroke="${K}" stroke-width="1.5"/><path d="M16 -142 q6 10 0 22" stroke="${K}" stroke-width="3" fill="none"/>

function balance(x,y,s=1,tilt=0,{left='heart',right='feather',baboon=true}={}){ const L=left==='heart'?heart(0,0,1.1):left==='empty'?'':left; const R=right==='feather'?feather(0,0,1):right;
  return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-14 0 H14 L8 -12 H-8Z" fill="${GREEN}" stroke="${K}" stroke-width="1.8"/><rect x="-4" y="-150" width="8" height="140" fill="${GOLD}" stroke="${K}" stroke-width="1.5"/>

  <rect x="-24" y="-130" width="48" height="130" fill="${open?'#120F0A':BROWNDOOR}" stroke="${K}" stroke-width="2.5"/>${open?`<rect x="-24" y="-130" width="48" height="130" fill="url(#sun)" opacity=".7"/>`:`<path d="M0 -130 V0" stroke="${K}" stroke-width="2"/>`}<path d="M-30 -140 H30 L26 -130 H-26Z" fill="${BLUE}" stroke="${K}" stroke-width="1.8"/>
  ${guard?`<g transform="translate(-60 0) scale(.55)">${eg(0,0,1,{head:'jackal',skin:BLACK,arms:'down'})}<path d="M38 -112 L46 -160" stroke="${LINEN}" stroke-width="5"/><path d="M38 -112 L46 -160" stroke="${K}" stroke-width="1.5" fill="none"/></g>`:''}</g>`; }
const BROWNDOOR='#7A4A26';
function jar(x,y,head,s=1){ const heads={human:SKIN,baboon:GREEN,jackal:BLACK,falcon:GREEN}; return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-16 0 Q-22 -30 -14 -50 H14 Q22 -30 16 0Z" fill="${LINEN}" stroke="${K}" stroke-width="2"/><path d="M-12 -12 H12 M-14 -24 H14" stroke="${BLUE}" stroke-width="2"/>
  ${head==='jackal'?`<path d="M-10 -50 Q-12 -64 -2 -66 L-6 -80 L2 -68 L6 -80 L8 -66 L24 -60 L22 -54 L6 -54 L4 -50Z" fill="${BLACK}" stroke="${K}" stroke-width="1.5"/>`:head==='falcon'?`<path d="M-10 -50 Q-12 -68 4 -70 Q14 -68 14 -60 L20 -56 L12 -54 L8 -50Z" fill="${GREEN}" stroke="${K}" stroke-width="1.5"/>`:head==='baboon'?`<path d="M-10 -50 Q-14 -70 2 -70 Q14 -70 14 -60 L20 -58 L14 -52 L8 -50Z" fill="${GREEN}" stroke="${K}" stroke-width="1.5"/>`:`<path d="M-12 -50 Q-14 -72 2 -72 Q14 -72 14 -62 L18 -58 L12 -52 L6 -50Z" fill="${SKIN}" stroke="${K}" stroke-width="1.5"/><path d="M-12 -52 Q-14 -76 4 -74 L-2 -60 L-4 -50Z" fill="${BLACK}"/>`}</g>`; }
function mummy(x,y,s=1,{upright=false}={}){ return upright?`<g transform="translate(${x} ${y}) scale(${s})"><path d="M-14 0 Q-20 -60 -16 -120 Q-14 -146 4 -148 Q22 -146 20 -120 Q22 -60 14 0Z" fill="${LINEN}" stroke="${K}" stroke-width="2"/><path d="M-16 -110 H20 M-17 -90 H19 M-17 -70 H18 M-16 -50 H17 M-15 -30 H16" stroke="${K}" stroke-width="1"/><path d="M-12 -142 Q4 -156 18 -140 L18 -112 L-14 -112Z" fill="${GOLD}" stroke="${K}" stroke-width="1.5"/><path d="M-12 -132 Q2 -146 16 -132 L14 -118 L-10 -118Z" fill="${SKINF}" stroke="${K}" stroke-width="1.2"/></g>`
  :`<g transform="translate(${x} ${y}) scale(${s})"><path d="M-150 -6 H150 L140 20 H-140Z" fill="${GOLD}" stroke="${K}" stroke-width="2"/><path d="M-130 -6 Q-140 -30 -100 -36 L110 -30 Q140 -26 130 -6Z" fill="${LINEN}" stroke="${K}" stroke-width="2"/><path d="M-80 -34 V-6 M-40 -34 V-6 M0 -33 V-6 M40 -32 V-6 M80 -31 V-6" stroke="${K}" stroke-width="1"/><path d="M110 -30 Q150 -30 140 -6 L110 -6Z" fill="${GOLD}" stroke="${K}" stroke-width="1.5"/></g>`; }
function reeds(x,y,n=10,h=60){ let o=''; const r=rnd(Math.round(x)); for(let i=0;i<n;i++){ const xx=x+i*9+r()*4; o+=`<path d="M${xx} ${y} Q${xx+4} ${y-h*.5} ${xx+2} ${y-h*(.7+r()*.3)}" stroke="${GREEN}" stroke-width="3" fill="none"/><ellipse cx="${xx+2}" cy="${y-h*(.75+r()*.25)}" rx="3" ry="8" fill="#7A5A2A" stroke="${K}" stroke-width="1"/>`; } return o; }
function water(y,h=40){ let o=`<rect x="0" y="${y}" width="600" height="${h}" fill="${BLUE}"/>`; for(let k=0;k<h/10;k++){ let d=`M0 ${y+6+k*10}`; for(let x=0;x<600;x+=20) d+=` l10 -5 l10 5`; o+=`<path d="${d}" stroke="${K}" stroke-width="1.5" fill="none"/>`; } return o; }
function textBand(y,t){ return `<rect x="40" y="${y-16}" width="520" height="26" fill="${PAP}" stroke="${K}" stroke-width="1.5"/><text x="300" y="${y+2}" text-anchor="middle" font-size="14" fill="${K}" style="font-family:'Marcellus',serif;letter-spacing:.08em">${esc(t)}</text>`; }
function egCover(){ return papyrus(`${eg(110,340,1,{head:'jackal',skin:BLACK,arms:'down'})}${balance(260,340,1,0)}${ammit(380,340,.8)}${eg(470,340,1,{head:'ibis',hold:'palette'})}${sunDisk(520,90,22)}`); }

/* The Forty-Two Day Walk: one declaration of Spell 125 a day, before one of the forty-two judges. */
function hallArt(n,col){ let o=''; for(let i=0;i<42;i++){ const r=Math.floor(i/14), c=i%14, x=63+c*36.5, y=150+r*92; const on=i===n, done=i<n;
  o+=`<g opacity="${on?1:done?.95:.45}">${on?`<circle cx="${x}" cy="${y-32}" r="30" fill="url(#sun)"/>`:''}<g transform="translate(${x} ${y}) scale(${on?.36:.3})">${eg(0,0,1,{head:['human','jackal','falcon','ibis'][i%4],arms:'down',crown:'feather'})}</g></g>`; }
  return o; }
const WALK={key:'htt42',brand:'The Forty-Two Day Walk',brandSub:'From the Egyptian Book of the Dead',title:'The Forty-Two Day Walk',eyebrow:'A daily practice · 42 days',unit:'Day',gold:GOLD,
 lede:'In the Hall of Two Truths, the dead stood before forty-two judges and made a declaration of innocence to each one. This walk takes one declaration a day, and asks the question the Egyptians asked: could you honestly say it?',
 note:'Each day takes about five minutes. Your place is saved on this device.',
 manualUrl:'../../../many-doors/egypt/book/',manualName:'The Hall of Two Truths',
 howBook:'One declaration from Spell 125, and what it meant in ancient Egypt.',
 sources:'Spell 125 of the Book of Coming Forth by Day, after the Papyrus of Ani (British Museum EA 10470) and R. O. Faulkner\'s translation (1985). The forty-two declarations survive in several versions; these are plain-English paraphrases grouped by theme, not a numbered transcription. Also: J. H. Taylor, Journey Through the Afterlife (2010); M. Lichtheim, Ancient Egyptian Literature (1973–80) for the Instructions of Ptahhotep and Amenemope.',
 parts:[{name:'Do No Harm',sub:'Violence and cruelty',col:'#A8361F'},{name:'Honest Measures',sub:'Trade and property',col:'#D9A321'},{name:'Land and Water',sub:'The river and the fields',col:'#1F5F8B'},{name:'Words',sub:'Speech and listening',col:'#3E8E5E'},{name:'The Heart',sub:'Temper and pride',col:'#7A4A26'},{name:'The Sacred',sub:'Gods, temples and the dead',col:'#2B4C8C'}],
 art:(D,n,P)=>papyrus(`${hallArt(n,P.col)}${textBand(62,`Judge ${n+1} of 42 · “${D.t}”`)}`),
 mapBg:()=>`<rect width="600" height="400" fill="#16120B"/>`,
 ambient:(D,P)=>{ if(SND.ctx) pad('pad',[[110,165,220],[123.5,185,246.9],[98,147,196],[130.8,196,261.6],[110,164.8,220],[146.8,220,293.7]][D.p],.03); },
 finale:async s=>{ art(papyrus(`${hallArt(42)}${textBand(62,'I am pure, I am pure, I am pure, I am pure')}`)); if(SND.ctx) chime();
   await count(s,{ask:'Forty-two judges. Finish as Ani finished: I am pure. Four times.',n:4,label:'I am pure',onTap:k=>{ if(SND.ctx) bell(330+k*50,.08); }});
   await say(s,'Nobody in Egypt thought the dead had really never done any of these things. The declarations were what a person hoped their heart would agree to. The heart on the scale was the life they had lived, and the walk is a way to live it a little lighter.',{eye:'The end of the walk'}); },
 days:[]};
const DECL=[
 /* DO NO HARM */
 [0,'I have not killed','The plainest declaration, and the one every culture shares. Egyptian law punished murder with death, and the gods were said to detest it.','Most of us will never kill anyone. But the Egyptians put this one beside smaller harms, as if to say they are the same kind of thing, only bigger.','Notice one moment today when you wish someone harm, even in a small way. Let the wish go.','Breathe in life. Breathe out harm.'],
 [0,'I have not ordered anyone to be killed','A separate declaration, for those with power: not only did I not kill, I did not have it done.','Harm done by others on your behalf still counts. This is about the orders you give, the systems you benefit from, and what you let happen.','Think of one harm done in your name, by an institution or a choice. Is there one thing you could do about it?','Rest your hands. Feel that they have done no harm today.'],
 [0,'I have not caused pain','The dead declares that they have not made anyone suffer pain. Spell 125 lists it among the first things said to Osiris.','Pain is often caused carelessly: a sharp remark, an ignored message, a joke at someone\'s expense. The declaration doesn\'t say "on purpose".','Before you speak today, ask once: could this hurt?','Notice any pain in your own body. Wish it, and everyone\'s, eased.'],
 [0,'I have not made anyone weep','One of the most tender lines in the confession. The dead can say: no one cried because of me.','It\'s a high bar, maybe impossible. But it points at something real. The tears we cause are the ones we\'re asked about at the end.','If you have made someone cry, recently or long ago, consider whether an apology is still possible.','Remember a time someone comforted you when you cried.'],
 [0,'I have not made anyone hungry','In a land that lived or starved by the Nile flood, letting someone go hungry was a serious wrong. Officials boasted on their tombs: I gave bread to the hungry.','Hunger still exists, and food is still the most basic gift. The declaration asks what you did with what you had.','Give food today: to a food bank, a neighbour, a stranger.','Feel gratitude for your last meal, all the way through.'],
 [0,'I have not terrorised anyone','The dead declares they have not made anyone afraid. Egyptian wisdom literature warns again and again against officials who frighten the poor.','Fear is a kind of power. The declaration asks whether you have used it: as a boss, a parent, a partner, a stranger online.','Notice one person who might be a little afraid of you. Be gentle with them today.','Breathe slowly enough that nothing in you feels afraid.'],
 [0,'I have not mistreated animals','Among the first declarations: I have not mistreated cattle. Egyptians lived with their animals, and many animals were sacred to the gods.','The circle of care in Spell 125 isn\'t only human. Animals are included in the reckoning.','Do one kind thing for an animal today.','Picture an animal you love. Share the minute with it.'],
 /* HONEST MEASURES */
 [1,'I have not stolen','The dead declares they have not taken what was not theirs. The confession repeats this in several forms, because theft came in so many.','Stealing isn\'t only shoplifting. It\'s taking credit, time, attention or trust that belongs to someone else.','Return something today that isn\'t yours: a book, a tool, or credit for someone else\'s idea.','Feel your empty hands. They hold only what is yours.'],
 [1,'I have not cheated the grain measure','Grain was money in Egypt. The dead declares: I have not diminished the bushel, the measure used to pay wages and taxes.','A small cheat repeated thousands of times is a big theft. This is about honesty in ordinary transactions: weights, prices, hours.','Be scrupulously fair in one small transaction today.','Imagine a measure filled exactly to the brim. No more, no less.'],
 [1,'I have not shortened the measure of land','Every year the flood washed away field boundaries, and surveyors re-measured them. The dead declares: I have not reduced the measure of anyone\'s land.','Moving a boundary stone was the classic quiet crime. It\'s still possible: taking a little more than your share of space, time, or the shared table.','Notice where you take up more room than you need, and give some back.','Picture a field with clear, fair boundaries. Rest inside yours.'],
 [1,'I have not tampered with the scales','The dead declares: I have not added to the weights of the balance, nor tampered with the plumb-line. This in a book whose great scene is a balance.','Ma\'at, the feather on the scale, means truth and fairness at once. Cheating the scales of trade is a lie against the same order that will weigh your heart.','Keep one promise exactly today, to the letter.','Feel the balance of your breath: in and out, equal.'],
 [1,'I have not impoverished anyone','The dead declares they did not make their associates poor. Egyptian instructions tell officials not to grow rich at the expense of those below them.','Wealth can be made in ways that leave others poorer: underpaying, overcharging, quietly profiting from someone\'s need.','Pay someone fairly, tip generously, or settle a debt today.','Wish the people who serve you every day a good living.'],
 [1,'I have not been greedy','One of the forty-two judges hears: I have not been greedy. The Instruction of Ptahhotep calls greed a grievous sickness without cure.','Greed is wanting more than enough. The question is whether you know what enough is.','Name what "enough" would be for you, in one area of life.','Sit with the feeling of having enough for one minute.'],
 [1,'I have not robbed the poor','Egyptian texts singled out the widow and the orphan as people who must not be wronged. Officials\' tombs boast: I was a father to the orphan, a husband to the widow.','The test of a person, here as in the Bible, is how they treat those who can\'t fight back.','Support someone who has less power than you today.','Picture someone vulnerable. Stand beside them in your mind.'],
 /* LAND AND WATER */
 [2,'I have not held back the water','The dead declares: I have not held back water in its season. In Egypt, the flood was life, and diverting it from a neighbour\'s field was a serious crime.','Water is the shared resource that keeps everyone alive. Hoarding what everyone needs is a wrong against all of them.','Don\'t waste water today. Notice every time you use it.','Picture the Nile rising, reaching every field in turn.'],
 [2,'I have not dammed the flowing water','A companion to the last: I have not built a dam against running water. Blocking a channel could ruin the fields downstream.','What flows past you is meant to keep flowing. Help, money, information, kindness: what are you blocking?','Pass something on today that you\'ve been sitting on.','Feel your breath flow in and out without holding it.'],
 [2,'I have not put out a fire','The dead declares: I have not quenched a fire when it should burn. Temple fires and lamps had to be kept alight.','Some fires should be kept alive: someone\'s enthusiasm, a tradition, a friendship. It\'s easy to put them out without noticing.','Encourage someone\'s project or idea today instead of critiquing it.','Picture a small flame. Keep it burning with your breath.'],
 [2,'I have not driven cattle from their pasture','The dead declares they have not driven cattle from the pastures of the gods. Herds belonging to temples grazed on shared land.','The commons, the land everyone shares, is easy to take from and hard to protect.','Pick up litter, or care for a shared space today.','Picture a green pasture, open to all.'],
 [2,'I have not trapped the gods\' birds','The dead declares: I have not trapped birds in the reed beds of the gods. The marshes belonged to the temples, and were teeming with life.','Some places are meant to be left wild. The declaration respects a world that isn\'t only for human use.','Spend a few minutes outdoors today just watching birds or trees.','Listen for birdsong, or imagine it.'],
 [2,'I have not caught the fish of their marshes','A twin to the last: I have not caught the fish of the gods\' marshes. Poaching from temple waters was theft from the gods.','Taking more than your share from nature is an old temptation, and the Egyptians named it.','Eat one meal today mindful of where each part came from.','Picture clear water full of fish. Leave it as it is.'],
 [2,'I have not taken milk from children','The dead declares: I have not taken milk from the mouths of children. It\'s one of the most vivid lines in the confession.','It covers every way the strong take from the young: their food, their future, the world they will inherit.','Do one thing today for a child\'s future: theirs, or all children\'s.','Hold a child you love in your mind, and wish them a full life.'],
 /* WORDS */
 [3,'I have not told lies','Ma\'at, the feather, means truth. The dead declares: I have not spoken falsehood. The god Thoth, lord of words, writes down the verdict.','The Egyptians believed words had power to make things real. A lie was a small act against the order of the world.','Tell one truth today you\'d normally smooth over, kindly.','Breathe in truth. Breathe out what is false.'],
 [3,'I have not slandered anyone','The dead declares: I have not maligned a servant to his master. Speaking ill of someone to the person who controls their livelihood could ruin them.','Gossip feels harmless and travels far. This declaration is about the damage words do when the person isn\'t in the room.','Say something good about someone who isn\'t present today.','Picture someone you have spoken badly of. Wish them well.'],
 [3,'I have not eavesdropped','The dead declares they have not listened at doors. Egyptian instructions advise discretion, and taking only what is freely told.','Curiosity about others\' private business, scrolling through other people\'s lives: the urge is ancient.','Resist checking up on someone today, online or in person.','Listen only to the sounds that come to you, without searching.'],
 [3,'I have not talked too much','One judge hears: I have not been garrulous. Egyptian wisdom texts praise the "silent man" as the wise one, and the talker as a fool.','Some speech fills space rather than saying anything. Silence leaves room for others.','Speak a little less in one conversation today. Listen more.','Rest in silence. Don\'t fill it.'],
 [3,'I have not been deaf to the truth','The dead declares: I have not made myself deaf to words of truth. It\'s a declaration about listening, not speaking.','Truth often arrives in a form we don\'t like: criticism, bad news, someone else being right. Closing your ears is a choice.','Ask someone for honest feedback, and just listen.','Listen to every sound in the room for one minute.'],
 [3,'I have not stirred up strife','The dead declares they have not caused quarrels. Egyptian wisdom praises the person who calms a dispute.','Some people make every room more tense. This declaration asks whether you are one of them.','Defuse one small tension today rather than adding to it.','Breathe calm into a place where there has been conflict.'],
 [3,'I have not cursed','The dead declares they have not cursed, whether a god, the king, or another person. In Egypt a curse was a real weapon.','Curses today are casual, under the breath, in traffic, online. The declaration takes them seriously.','Catch yourself cursing someone today, and swap it for a blessing.','Silently bless three people who annoyed you recently.'],
 /* THE HEART */
 [4,'I have not been hot-tempered','The dead declares: I have not been quick to anger. Egyptian wisdom contrasts the "heated man", who speaks rashly, with the "silent man" who keeps his temper.','Anger is sometimes justified. Being hot-tempered means it arrives before thought does.','When you feel heat rising today, wait one breath before you act.','Feel any heat in your body, and let it cool.'],
 [4,'I have not eaten my heart','The dead declares: I have not eaten my heart. Scholars debate the meaning: brooding, consuming yourself with worry or grudges, or nursing anger in secret.','Whatever the exact sense, it\'s a picture of a self eating itself. Some sorrow and resentment does exactly that.','Notice something you keep chewing over. Put it down for today.','Rest your attention on your heart. Let it be fed, not eaten.'],
 [4,'I have not been arrogant','The dead declares they have not been proud. Ptahhotep warns: don\'t be proud of your knowledge, consult the ignorant as well as the wise.','Arrogance closes the door to learning. The Egyptians thought humility was practical, not just polite.','Ask someone to teach you something today, someone you\'d not normally ask.','Sit as if you know nothing at all.'],
 [4,'I have not puffed myself up','A companion to the last: the dead declares they have not made themselves great above their station.','Puffing yourself up is about appearances: inflating your role, your importance, your story.','Tell a story about yourself today without exaggerating.','Let your breath be exactly its size.'],
 [4,'I have not been impatient','The dead declares they have not acted hastily. Egyptian sayings praise the one who waits and considers.','Most regrets come from haste: words said too quickly, decisions made too fast.','Delay one decision today by an hour, and see if it changes.','Breathe slower than you need to, for the whole minute.'],
 [4,'I have not committed adultery','The dead declares they have not lain with another man\'s wife. The Instruction of Ptahhotep warns sternly against it: a thousand men are ruined by a moment that passes like a dream.','Fidelity is a promise kept over time. The declaration includes it among the things that keep the world in order.','Do one thing today that honours a promise you\'ve made to someone.','Picture someone who trusts you. Feel the weight of that trust.'],
 [4,'I have not been insolent','The dead declares they have not acted with insolence. The Egyptians valued courtesy as part of Ma\'at, the right order of things.','Rudeness is a small chaos. Courtesy, especially to people with less power, is a small act of order.','Be especially courteous to someone who serves you today.','Silently thank the people who made your day work.'],
 /* THE SACRED */
 [5,'I have not reduced the offerings','The dead declares: I have not diminished the food offerings in the temples. Offerings fed the gods, the priests, and the poor.','What you give to the sacred, however you define it, is easily trimmed when no one is looking.','Give something today to what you hold sacred: time, money, attention.','Offer this minute as a gift.'],
 [5,'I have not stolen the bread of the gods','The dead declares they have not taken the loaves of the gods. Temple bread was distributed after the rites; stealing it was stealing from heaven.','Some things are set apart. Taking them for ordinary use, like a quiet day, or a promise, cheapens them.','Keep one thing set apart today: a meal, an hour, a place.','Imagine bread on an altar. Leave it there.'],
 [5,'I have not stolen the food of the dead','The dead declares: I have not taken away the food offerings of the spirits. Families left food at tombs for their dead, and robbing it was a grave wrong.','The Egyptians fed their dead for generations. Remembering them was a duty, not a sentiment.','Remember someone who has died. Say their name aloud.','Picture an offering left for someone you have lost.'],
 [5,'I have not despised my town\'s god','The dead declares they have not despised the god of their city. Every town had its own patron god and festival.','Contempt for what other people hold sacred is easy and cheap. The declaration asks for respect, even where you don\'t share the belief.','Learn something today about a faith that isn\'t yours.','Wish peace to every place of worship near you.'],
 [5,'I have not blocked the god\'s procession','The dead declares they have not opposed a god in his procession. On festival days, the god\'s image was carried through the streets in a boat, and everyone took part.','Shared celebration holds a community together. Standing in its way, or sneering from the side, breaks it.','Join in someone else\'s celebration today, gladly.','Picture a festival procession passing. Let it go by with joy.'],
 [5,'I have not done wrong in the Place of Truth','The dead declares: I have done no evil in the Place of Truth. The phrase can mean the hall of judgment itself, or a sacred place.','Wherever you hold yourself to the highest standard, at work, at prayer, at home, the declaration asks whether you kept it.','Do one thing today exactly as well as you can.','Rest as if you were standing in the Hall of Two Truths.'],
 [5,'I have not done what the gods detest','The last of the forty-two: I have not done what the gods abhor. It gathers up everything else.','In the end the declarations are not a checklist but a direction: toward Ma\'at, toward truth and balance. Then the dead says: I am pure, four times over.','Tonight, weigh your heart honestly, and then put it down.','Breathe in: I am pure. Breathe out: I am pure.']
];
WALK.days=DECL.map(([p,t,book,mean,tr,sit],i)=>({p,t,book,mean,try:tr,sit,act:async(s,D)=>{
  if(i%7===6){ art(papyrus(`${balance(300,340,1.1,0)}${textBand(62,'The weighing')}`)); const B=$('#pArt');
    await hold(s,{label:'Keep your heart steady',ms:5000,ask:'The seventh day of each week ends at the scales. Press and hold to keep your heart steady.',early:'The scales swing. Hold again.',onP:p=>{ const b=B.querySelector('.beam'); if(b) b.style.transform=`rotate(${(1-p)*Math.sin(performance.now()/300)*8}deg)`; }}); if(SND.ctx) chime(); }
  const k=await choose(s,`Could you honestly say it today? “${t}.”`,['I can say it','Not yet']);
  await say(s,k===0?'Then say it aloud, the way Ani did. The judge hears you.':'That\'s an honest answer, and honesty is the point. The Egyptians wrote Spell 30B for exactly this, asking their own heart not to testify against them. Tomorrow is another chance to make it true.'); }}));
header({brand:WALK.brand,brandSub:WALK.brandSub,links:[['Many Doors','../../../many-doors/'],[WALK.manualName,WALK.manualUrl]]});
walkLanding(WALK);
