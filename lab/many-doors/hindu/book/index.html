<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>window.MD_HOME='../../index.html#doors'</script>
<title>The Thirteen Days</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Jost:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one full-screen "flight" — a thin instrument bar on top, the scene card in the middle, the narrator's caption card below it. Single deliberate look: the safety-card palette. */
:root{
  color-scheme: light;
  --cream:#F6EBD2; --parchment:#FBF3DF; --ink:#1E2A2B; --ink-soft:#44524F;
  --teal:#1F5E63; --teal-deep:#123D40; --brown:#8A4B22; --lamp:#F2B640;
  --red:#B8352A; --ok:#2F6B2B;
  --scene-bg: var(--cream);
  --display:'Jost', 'Futura', 'Century Gothic', sans-serif;
  --body:'Atkinson Hyperlegible', 'Verdana', sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;background:var(--scene-bg);transition:background-color 2.2s ease}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--ink);background:var(--parchment);transition:opacity 1.5s,filter 1.5s}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:.8rem;text-transform:uppercase}
#stageLabel{font-family:var(--display);font-weight:500;font-size:.85rem;color:var(--ink-soft);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stageLabel b{color:var(--brown);font-weight:700;margin-right:8px;font-variant-numeric:tabular-nums}
.tog{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:36px}
.tog[aria-pressed="false"]{background:transparent;color:var(--ink-soft);border-style:dashed}
.pick{font-family:var(--body);font-size:.8rem;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:8px;padding:6px 8px;min-height:36px;max-width:190px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pick:focus-visible,.tog:focus-visible,.btn:focus-visible,.spot:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
#stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:18px;padding-block:18px;padding-inline:16px;cursor:pointer;user-select:none}
#visual{width:100%;display:flex;justify-content:center;flex:none}
.frame{position:relative;width:min(100%, calc((100dvh - 380px) * 1.5), 980px);min-width:min(100%,300px);aspect-ratio:3/2;max-width:100%;border-radius:18px;overflow:hidden;transition:filter 3s ease, transform 3s ease}
.frame>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:filter 3s ease}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.caption{flex:none;max-width:720px;width:100%;box-sizing:border-box;background:var(--parchment);border:2px solid var(--ink);border-radius:6px;padding:16px 20px;min-height:4.6em;transition:opacity .8s, filter 1.5s, transform 1.5s, border-color 1.5s}
.caption p{margin:0;font-size:clamp(1.02rem, 2.3vw, 1.3rem);line-height:1.45;text-wrap:pretty}
.caption.quiet{background:transparent;border-color:transparent;text-align:center}
.caption.dark{background:#141413;color:var(--parchment);border-color:#141413}
.caption[hidden]{display:none!important}
#hint{margin:0;font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);opacity:0;transition:opacity .6s;min-height:1em}
#hint.on{opacity:.8;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
#choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.04em;border:2px solid var(--ink);background:var(--teal);color:var(--parchment);border-radius:999px;padding:12px 22px;cursor:pointer;min-height:48px}
.btn.alt{background:var(--parchment);color:var(--ink)}

/* dissolution: the manual's chrome comes apart; the narration always stays sharp */
body.d1 .bar{opacity:.85}
body.d2 .bar{filter:blur(.6px);opacity:.6}
body.d2 .frame{border-radius:28px}
body.d3 .bar{filter:blur(1.5px);opacity:.3}
body.d3 .frame{border-radius:40px}
body.void .bar,body.void #hint{opacity:0!important}

/* title */
.title-card{width:min(100%,640px);background:var(--teal);color:var(--parchment);border:2px solid var(--ink);border-radius:18px;padding:36px 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;align-items:flex-start;cursor:default}
.title-card .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:.75rem;color:var(--lamp);text-transform:uppercase}
.title-card h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1;text-wrap:balance;text-transform:uppercase;letter-spacing:.02em}
.title-card p{margin:0;font-size:1.05rem;line-height:1.5;max-width:46ch}
.title-card ol{margin:4px 0 8px;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;font-size:.98rem}
.title-card .btn{background:var(--lamp);color:var(--ink)}

/* hotspots */
.spot{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:3px solid #FFF3D6;background:rgba(242,182,64,.35);cursor:pointer;padding:0}
.spot::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid #FFF3D6;animation:ping 1.8s ease-out infinite}
.spot.done{opacity:0;pointer-events:none;transition:opacity .6s}
@keyframes ping{from{transform:scale(.7);opacity:.9}to{transform:scale(1.4);opacity:0}}
.heartglow{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(var(--s,0.4));background:radial-gradient(circle,#FFFBEA 0%,rgba(255,221,120,.85) 35%,rgba(255,200,80,0) 70%);transition:transform 1.2s ease;pointer-events:none}

/* breath ring */
.breath{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.6);border-radius:50%;border:4px solid var(--parchment);box-shadow:0 0 0 12px rgba(251,243,223,.15);transition:transform 1s ease-in-out, opacity 1s}

/* svg scenes */
.svgscene{position:absolute;inset:0;width:100%;height:100%}
.flicker{transform-origin:300px 262px;animation:flick 1.3s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1) skewX(0)}30%{transform:scaleY(.9) skewX(3deg)}60%{transform:scaleY(1.06) skewX(-2deg)}}
.orb-down{animation:down 7s ease-in-out forwards}
.orb-up{animation:up 7s ease-in-out forwards}
@keyframes down{to{transform:translateY(91px)}}
@keyframes up{to{transform:translateY(-55px)}}
.dots{stroke-dasharray:2 7;stroke-linecap:round}

/* guide entry */
.guide{position:absolute;inset:0;background:var(--parchment);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;gap:4%;padding:5%;box-sizing:border-box}
.guide .tag,.doorsteps .tag{display:inline-block;font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:clamp(.55rem,1.4vw,.75rem);background:var(--teal);color:var(--parchment);padding:5px 10px;border-radius:4px;text-transform:uppercase}
.guide h2{margin:10px 0 8px;font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,3.4vw,2.2rem);line-height:1.05;text-transform:uppercase;color:var(--brown);text-wrap:balance}
.guide p{margin:0;font-size:clamp(.85rem,1.8vw,1.15rem);line-height:1.45}
.guide .fig{height:100%;display:flex;align-items:center;justify-content:center;background:var(--teal);border-radius:12px;min-height:0}
.frame.guideframe{aspect-ratio:auto;width:min(100%,860px)}
.frame.guideframe .guide{position:relative;inset:auto;padding:24px;gap:24px}
.guide .fig{align-self:stretch;min-height:200px;padding:12px}
.guide .fig svg{height:220px;width:auto}
.guide .gtext{box-sizing:border-box}
.guide .gtext:focus-visible{outline:3px solid var(--lamp)}
@media (max-width:760px){
  .frame.guideframe .guide{grid-template-columns:1fr;gap:16px;padding:18px}
  .guide .fig{min-height:0}
  .guide .fig svg{height:150px}
  .guide h2{font-size:1.5rem}
  .guide p{font-size:1.02rem}
}

/* clear light */
.crack{stroke-dasharray:900;stroke-dashoffset:900;animation:crack 1.2s ease-out forwards}
@keyframes crack{to{stroke-dashoffset:0}}
.bubble{opacity:0;transform:scale(.6);transform-origin:80% 80%;transition:opacity .8s, transform .8s}
.bubble.on{opacity:1;transform:scale(1)}
.ring{position:absolute;left:49.8%;top:43%;width:8%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(242,182,64,.55);transform:translate(-50%,-50%);animation:ring 4.5s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(9);opacity:0}}


/* chapters 4-5 */
.rise{animation:rise 4.5s ease-out forwards}
@keyframes rise{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
.walk{animation:walk 9s ease-in forwards}
@keyframes walk{to{transform:translateY(-22px);opacity:.25}}
.steam path{animation:steam 2.4s ease-in-out infinite}
.steam path+path{animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
.balloon{opacity:0}
.balloon.on{animation:shout 4s ease-out forwards}
@keyframes shout{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.mug{opacity:0}
.mug.on{opacity:1;animation:shake .35s linear 2}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.drawer{transition:transform 1s ease}
.drawer.open{transform:translateX(60px)}
.page{transform-box:fill-box;transform-origin:center;animation:fly 1.6s ease-in forwards}
.page.f2{animation-delay:.35s}.page.f3{animation-delay:.7s}
@keyframes fly{to{transform:translate(160px,-190px) rotate(30deg);opacity:0}}
.glass.flash{animation:flash .9s ease}
@keyframes flash{40%{fill:#FFFFFF}}
.popped{transform-box:fill-box;transform-origin:center;animation:pop 1.2s ease 1s forwards}
@keyframes pop{to{transform:scale(1.5);opacity:0}}
.drops{opacity:0;animation:drops 1s ease 2s forwards}
@keyframes drops{to{opacity:1}}
.drawerbtn{position:absolute;background:transparent;border:2px dashed rgba(251,243,223,.75);border-radius:6px;cursor:pointer;padding:0}
.drawerbtn:hover{background:rgba(242,182,64,.2)}
.drawerbtn:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.run{background:var(--red);font-size:1.2rem;letter-spacing:.24em;text-transform:uppercase;padding:14px 34px;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.checks{position:absolute;inset:0;background:var(--parchment);padding:5%;box-sizing:border-box;display:flex;flex-direction:column;gap:4%}
.ck-head span{display:block;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(.95rem,3.4vw,2rem);color:var(--brown);letter-spacing:.03em}
.ck-head small{display:block;font-size:clamp(.7rem,1.6vw,1rem);color:var(--ink-soft);margin-top:4px}
.ck-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;flex:1}
.ck{display:flex;align-items:center;gap:6%;padding:4%;border:2px solid var(--ink);border-radius:12px;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:clamp(.7rem,1.9vw,1.15rem);line-height:1.25;text-align:left;cursor:pointer;min-width:0}
.ck:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.box{flex:none;width:clamp(18px,3vw,32px);aspect-ratio:1;border:3px solid var(--ink);border-radius:6px;position:relative;background:#FFFFFF}
.ck[aria-pressed="true"] .box{background:var(--ok)}
.ck[aria-pressed="true"] .box::after{content:"";position:absolute;left:30%;top:6%;width:28%;height:58%;border:solid #FFFFFF;border-width:0 4px 4px 0;transform:rotate(45deg)}


/* epilogue */
.duo{position:absolute;inset:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.half{position:relative;border:0;padding:0;margin:0;cursor:pointer;background:none;overflow:hidden;transition:filter .4s}
.half svg{width:100%;height:100%;display:block}
.half span{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(.68rem,1.6vw,.95rem);background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;white-space:nowrap}
.duo:hover .half:not(:hover){filter:brightness(.55)}
.half:focus-visible{outline:4px solid var(--lamp);outline-offset:-4px}
.rules{position:relative;background:var(--parchment);padding:24px;display:flex;flex-direction:column;gap:18px}
.rule-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rule{display:flex;flex-direction:column;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:12px;background:var(--cream);min-width:0}
.rule svg{width:100%;height:auto;border-radius:8px;background:#E9DDBF}
.rule b{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--teal)}
.rule p{margin:0;font-size:clamp(.9rem,1.6vw,1.05rem);line-height:1.35}
.spin{transform-origin:300px 170px;animation:spinr 40s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.bluerise{animation:brise 3s ease-out forwards}
@keyframes brise{to{opacity:.85;transform:translateY(-40px)}}

/* volume 2 */
.approach{transform-origin:300px 205px;animation:approach 9s ease-in forwards}
@keyframes approach{from{transform:scale(.8)}to{transform:scale(1.14)}}
.pulse{transform-origin:300px 205px;animation:pulseg 1.24s ease-in-out infinite}
@keyframes pulseg{50%{opacity:.12;transform:scale(.92)}}
.morph .pulse{animation:none;opacity:0;transition:opacity 1s}
.wrath{transform-origin:300px 205px;transition:transform 1.6s ease, opacity 1.4s ease}
.fl{transform-origin:300px 205px;animation:flick2 .45s ease-in-out infinite alternate}
@keyframes flick2{to{transform:scale(1.04) rotate(1.5deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.peace{opacity:0;transform-origin:300px 205px;transform:scale(.3);transition:opacity 1.6s ease .5s, transform 1.6s ease .5s}
.morph .wrath{transform:scale(.12) rotate(90deg);opacity:0}
.morph .peace{opacity:1;transform:scale(1)}
.frame.facing{transition:none;animation:shake2 .12s linear infinite}
@keyframes shake2{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.holdbtn{position:absolute;inset:0;background:transparent;border:0;padding:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.holdpill{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:8px 16px 8px 8px;font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:clamp(.72rem,1.7vw,.95rem);white-space:nowrap}
.holdpill svg{width:30px;height:30px}
.holdbtn:focus-visible .holdpill{outline:3px solid var(--lamp);outline-offset:3px}
.zone{position:absolute;background:transparent;border:2px dashed rgba(255,255,255,.55);border-radius:50%;cursor:pointer;padding:0}
.zone:focus-visible{outline:3px solid var(--lamp)}
.closing{transform-origin:300px 205px;animation:closing 10s ease-in forwards}
@keyframes closing{from{transform:scale(1.35)}to{transform:scale(.82)}}
.orbit{transform-origin:300px 210px;animation:spinr 18s linear infinite}


/* chapters menu */
#app{position:relative}
.chap{position:absolute;right:16px;top:calc(100% + 0px);z-index:20;width:min(340px,calc(100% - 32px));max-height:min(70vh,560px);overflow-y:auto;background:var(--parchment);border:2px solid var(--ink);border-radius:14px;box-shadow:0 12px 30px rgba(20,20,19,.25);padding:14px;box-sizing:border-box}
.chapwrap{position:relative;z-index:20}
.chap h3{margin:10px 6px 6px;font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brown)}
.chap h3:first-child{margin-top:2px}
.chap ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.chap button{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;background:transparent;border:0;border-radius:8px;padding:10px 8px;font-family:var(--body);font-size:1rem;color:var(--ink);cursor:pointer;min-height:44px}
.chap button:hover,.chap button:focus-visible{background:var(--cream);outline:none}
.chap button[aria-current="true"]{background:var(--cream);font-weight:700}
.chap button small{font-family:var(--display);font-weight:700;font-size:.7rem;letter-spacing:.1em;color:var(--ink-soft);min-width:2.4em;font-variant-numeric:tabular-nums}


/* volume 3 */
.streaks{animation:streak 1.1s linear infinite}
@keyframes streak{from{transform:translateX(-140px)}to{transform:translateX(140px)}}
.blown{animation:blown 2.6s ease-in-out infinite}
@keyframes blown{50%{transform:translate(40px,-8px)}}
.elgrid{position:absolute;inset:0;background:#1B2224;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;padding:6%;box-sizing:border-box}
.el{background:#2A3335;border-radius:14px;display:flex;align-items:center;justify-content:center;opacity:.22;transition:opacity .4s, transform .4s;min-height:0}
.el svg{width:62%;height:auto;max-height:90%}
.el.on{opacity:1;transform:scale(1.04)}
.peb{opacity:0}
.pebs.on .peb{animation:drop .5s ease-in forwards}
@keyframes drop{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:none}}
.mref{opacity:0;transition:opacity 1.2s}
.mref.on{opacity:1}
.approach2{transform-origin:230px 200px;animation:approach 9s ease-in forwards}
.leaf{transform-origin:20px 115px;transform:scaleX(.12);transition:transform .15s}
.doorwrap{position:relative;background:var(--parchment);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:24px;padding:24px;align-items:center}
.doorsteps ol{margin:12px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-size:clamp(.95rem,1.8vw,1.1rem);line-height:1.35}
.doorpic svg{width:100%;height:auto;max-height:260px;display:block}
.doorgrid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px;background:#10181B}
.doorcard{display:flex;flex-direction:column;gap:8px;background:var(--parchment);border:2px solid var(--ink);border-radius:12px;padding:8px;cursor:pointer;font-family:var(--body);font-size:clamp(.82rem,1.6vw,1rem);line-height:1.25;color:var(--ink);text-align:left;min-width:0}
.doorcard svg{width:100%;height:auto;border-radius:8px;display:block}
.doorcard:hover{transform:translateY(-2px)}
.doorcard.nope{opacity:.4;filter:grayscale(1)}
.doorcard:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}

/* pilot: shared production layer */
#visual{position:relative}
.leaving{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;pointer-events:none;z-index:4;animation:leave .7s ease forwards}
@keyframes leave{to{opacity:0;transform:scale(.985)}}
.entering{animation:enter .8s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{clip-path:inset(0 0 0 100% round 18px)}to{clip-path:inset(0 0 0 0 round 18px)}}
.amb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.kb{animation:kb 24s ease-out forwards;transform-origin:62% 48%}
@keyframes kb{to{transform:scale(1.09)}}
.glowspot{position:absolute;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.55) 0%,rgba(255,190,90,.18) 40%,rgba(255,190,90,0) 70%);mix-blend-mode:screen;pointer-events:none;animation:candle 2.3s steps(9,end) infinite;transition:opacity 1.2s ease}
@keyframes candle{0%{opacity:.85;transform:translate(-50%,-50%) scale(1)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}35%{opacity:.75}55%{opacity:.95;transform:translate(-50%,-50%) scale(.97)}75%{opacity:.8}100%{opacity:.9;transform:translate(-50%,-50%) scale(1.02)}}
.callout{position:absolute;z-index:3;transform:translate(-50%,-50%) scale(0);background:var(--parchment);border:2px solid var(--ink);border-radius:8px;padding:5px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards;box-shadow:0 3px 0 var(--ink);pointer-events:none;white-space:nowrap}

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; app.appendChild(t); setTimeout(()=>t.classList.add('out'),2600); setTimeout(()=>t.remove(),3200); }
function rewindSnd(){ if(!ctx) return; const t=now(); const s=ctx.createBufferSource(); s.buffer=noiseBuf; const f=ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value=2;
  f.frequency.setValueAtTime(3200,t); f.frequency.exponentialRampToValueAtTime(260,t+1.1); const g=ctx.createGain(); env(g,t,.25,.05,1.1); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+1.3);
  const o=ctx.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(900,t); o.frequency.exponentialRampToValueAtTime(120,t+1.1); const og=ctx.createGain(); env(og,t,.06,.05,1.05); o.connect(og).connect(master); o.start(t); o.stop(t+1.2); }
function rewind(){ if(!pathState) return go(idx(BOOK.home)); const p=pathState; pathState=null; hush(); rewindSnd();
  const ov=document.createElement('div'); ov.className='rewind'; ov.setAttribute('aria-hidden','true'); ov.innerHTML='<span>◀◀ Rewind</span>'; app.appendChild(ov);
  const f=$('#frame'); f&&f.classList.add('spinback');
  setTimeout(()=>{ go(idx(p.back), p.beat); }, 1100); setTimeout(()=>ov.remove(), 1500); }
function rewindButton(){ choices.innerHTML='<button class="btn" type="button" id="rw">◀◀ Rewind to the choice</button>'; $('#rw').onclick=e=>{ e.stopPropagation(); rewind(); }; $('#rw').focus({preventScroll:true}); }

/* lessons and detours: what the reader has learned, and which wrong turns they have walked down */
const journey={ visited:new Set(), learned:new Set() };
function learn(k){ if(journey.learned.has(k)) return; journey.learned.add(k); const l=LESSONS.find(x=>x[0]===k); if(l){ toast(BOOK.toast+l[2]); if(ctx) chime(); } updatePathBadge(); }
function updatePathBadge(){ const b=$('#pathBtn'); if(b) b.textContent=`${BOOK.pathLabel} ${journey.learned.size}/${LESSONS.length}`; }
/* take a wrong turn on purpose: it plays out, then rewinds to the choice */
function detour(key, backKey, backBeat){ journey.visited.add(key); pathState={back:backKey, beat:backBeat}; go(idx(key)); }
function buildPath(){
  const l=LESSONS.map(([k,t,rule,where],i)=>{ const got=journey.learned.has(k); return `<li class="lesson ${got?'got':''}"><b>${i+1}</b><span>${got?`<strong>${t}</strong>${rule}`:`<strong>Not learned yet</strong><small>Found in: ${where}</small>`}</span></li>`; }).join('');
  const r=DETOURS.map(([k,name,icon])=>{ const seen=journey.visited.has(k); return `<li class="realm ${seen?'seen':''}"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="8" fill="var(--teal)"/>${icon}</svg><span>${name}<small>${seen?'Walked':'Not yet'}</small></span></li>`; }).join('');
  $('#pathpanel').innerHTML=`<h3>${BOOK.pathTitle} · ${journey.learned.size} of ${LESSONS.length}</h3><ol class="lessons">${l}</ol><h3>${BOOK.detourTitle} · ${journey.visited.size} of ${DETOURS.length}</h3><ul class="realms">${r}</ul><p class="pathnote">${BOOK.pathNote}</p>`; }
function openPath(){ closeChapters(); closeVoice(); buildPath(); $('#pathpanel').hidden=false; $('#pathBtn').setAttribute('aria-expanded','true'); $('#pathpanel').focus({preventScroll:true}); }
function closePath(){ const p=$('#pathpanel'); if(!p||p.hidden) return; p.hidden=true; $('#pathBtn').setAttribute('aria-expanded','false'); }
function stillTest({ms,pass,fail,glow,events=[],grace=900,onTick=null}){
  const t0=performance.now(); let raf=0; const recent=[]; const g=glow?$(glow):null; const fired=new Set();
  const disturb=e=>{ if(performance.now()-t0<grace) return; if(e.target&&e.target.closest&&e.target.closest('.bar,#chapters,#pathpanel,#voicepanel')) return; if(!$('#chapters').hidden||!$('#pathpanel').hidden||!$('#voicepanel').hidden) return; if(e.type==='pointermove'){ const tn=performance.now(); recent.push([tn,Math.abs(e.movementX||0)+Math.abs(e.movementY||0)]); while(recent.length&&tn-recent[0][0]>500) recent.shift(); if(recent.reduce((x,r)=>x+r[1],0)<40) return; } stopStillness(); go(idx(fail)); };
  const evs=['pointermove','pointerdown','keydown','touchstart'];
  evs.forEach(ev=>addEventListener(ev,disturb,{capture:true,passive:true}));
  const tick=()=>{ const el=performance.now()-t0; events.forEach((ev,i)=>{ if(!fired.has(i)&&el>=ev.at){ fired.add(i); ev.fn(); } });
    if(g) g.style.setProperty('--s', .5+el/ms*2.2); onTick&&onTick(Math.min(el/ms,1)); if(el>=ms){ stopStillness(); go(idx(pass)); return; } raf=requestAnimationFrame(tick); };
  tick(); stillState={ stop(){ evs.forEach(ev=>removeEventListener(ev,disturb,{capture:true})); cancelAnimationFrame(raf); } };
}
function stopStillness(){ if(stillState){ stillState.stop(); stillState=null; } }
let si=0, bi=0, typing=null, canAdvance=false, autoTimer=null, cleanups=[];
function go(i, sb=0){
  { const prev=S[si]; if(go.ran&&prev&&prev.learn&&i!==si) learn(prev.learn); } /* tapping through fast still counts */
  wakeAudio(); closeChapters(); closePath(); closeVoice(); hush(); clearTimeout(autoTimer); stopStillness(); choices.innerHTML=''; cleanups.forEach(f=>f()); cleanups=[];
  si=i; bi=0; const sc=S[i]; if(!go.ran){ go.ran=true; app.style.transition='none'; requestAnimationFrame(()=>requestAnimationFrame(()=>{ app.style.transition=''; })); }
  app.style.setProperty('--scene-bg', sc.bg); document.body.classList.remove('d1','d2','d3','void');
  if(sc.dissolve) document.body.classList.add('d'+sc.dissolve); if(sc.void) document.body.classList.add('void');
  label.textContent = sc.label||'';
  const oldNode=visual.firstElementChild; visual.innerHTML = sc.view();
  if(oldNode&&!reduce&&oldNode.classList.contains('frame')){ oldNode.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id')); oldNode.removeAttribute('id'); oldNode.querySelectorAll('button').forEach(b=>b.remove());
    const lv=document.createElement('div'); lv.className='leaving'; lv.setAttribute('aria-hidden','true'); lv.appendChild(oldNode); visual.appendChild(lv); setTimeout(()=>lv.remove(),750);
    const nf=visual.firstElementChild; if(nf&&nf.classList.contains('frame')){ nf.classList.add('entering'); setTimeout(()=>nf.classList.remove('entering'),850); } }
  if(DRONE) DRONE.level(sc.void?0:1,sc.void?1:5); /* the black screen of death is the one silence on purpose */
  sc.enter&&sc.enter(); if(sc.guide) addGuideChip(sc.guide); showBeat(sb);
  if(sc.learn) setTimeout(()=>{ if(S[si]===sc) learn(sc.learn); },1600);
  if(sc.detour) journey.visited.add(sc.detour);
}
/* every page shown goes on a trail, so Back can step to the one before (skipping the black screen) */
const trail=[];
function showBeat(j){
  const sc=S[si], b=sc.beats[j]; bi=j;
  { const t=trail[trail.length-1]; if(!sc.void&&!(t&&t[0]===si&&t[1]===j)) trail.push([si,j]); updateBack(); } canAdvance=false; hint.classList.remove('on'); clearTimeout(autoTimer);
  cap.className='caption'+(b.cls?' '+b.cls:'');
  if(b.text===null){ cap.hidden=true; } else { cap.hidden = b.text==='' ; }
  { const nav=$('#capnav'); if(cap.hidden) choices.after(nav); else cap.appendChild(nav); }
  b.show&&b.show(); if(b.say) speak(b.say);
  const finish=()=>{ typing=null; b.afterType&&b.afterType(); if(b.choice) renderChoice(b); if(!b.lock) armAdvance(); if(b.auto) autoTimer=setTimeout(next,b.auto); };
  if(b.text){ const d=b.delay||0; setTimeout(()=>{ if(S[si]!==sc||bi!==j) return; typeOut(b.text, finish); speak(b.text); }, d); }
  else { capText.textContent=''; if(b.delay){ autoTimer=setTimeout(()=>{ if(!b.lock) armAdvance(); },b.delay); } else finish(); }
}
function renderChoice(b){ choices.innerHTML=b.choice.map((c,i)=>`<button class="btn${i?' alt':''}" type="button" data-i="${i}">${c.label}</button>`).join('');
  choices.querySelectorAll('button').forEach(btn=>btn.onclick=e=>{ e.stopPropagation(); const c=b.choice[+btn.dataset.i]; choices.innerHTML=''; tickSnd(); typeOut(c.reply, armAdvance); speak(c.reply); }); }
function typeOut(text, done){
  if(reduce){ capText.textContent=text; done(); return; }
  let k=0; capText.textContent=''; clearInterval(typing&&typing.id);
  const id=setInterval(()=>{ k+=2; capText.textContent=text.slice(0,k); if(k>=text.length){ clearInterval(id); done(); } },34);
  typing={id, text, done};
}
function armAdvance(){ canAdvance=true; setTimeout(()=>{ if(canAdvance) hint.classList.add('on'); },900); }
function updateBack(){ const b=$('#backBtn'); if(b) b.disabled=trail.length<2; }
function back(){ if(trail.length<2) return; trail.pop(); const [ts,tb]=trail.pop(); if(ctx) tickSnd(); if(typing){ clearInterval(typing.id); typing=null; } go(ts,tb); }
$('#backBtn')&&($('#backBtn').onclick=e=>{ e.stopPropagation(); back(); });
$('#hint').onclick=e=>{ e.stopPropagation(); advance(); };
function next(){ const sc=S[si]; if(bi<sc.beats.length-1) showBeat(bi+1); else if(si<S.length-1) go(nextScene()); }
function nextScene(){ const n=S[si].next; return n?idx(n):si+1; }
function advance(){
  if(typing){ clearInterval(typing.id); capText.textContent=typing.text; const d=typing.done; typing=null; d(); return; }
  if(canAdvance) next();
}
$('#stage').addEventListener('click', e=>{ if(e.target.closest('button,.gpop')) return; advance(); });
addEventListener('keydown', e=>{ if(e.key==='Escape'&&!$('#chapters').hidden){ closeChapters(); $('#chapBtn').focus(); return; } if(e.key==='Escape'&&!$('#pathpanel').hidden){ closePath(); $('#pathBtn').focus(); return; } if(e.key==='Escape'&&!$('#voicepanel').hidden){ closeVoice(); $('#voiceBtn').focus(); return; } if(!$('#chapters').hidden||!$('#pathpanel').hidden||!$('#voicepanel').hidden) return; if(stillState) return; if(e.key==='ArrowLeft'){ e.preventDefault(); back(); return; } if([' ','Enter','ArrowRight'].includes(e.key)){ if(document.activeElement&&document.activeElement.tagName==='BUTTON'&&e.key!=='ArrowRight') return; e.preventDefault(); advance(); } });

/* warmth interaction */
function buildChapters(){ const cur=S[si]&&S[si].key; let n=0;
  $('#chapters').innerHTML=CHAPTERS.map(([vol,items])=>`<h3>${vol}</h3><ol>${items.map(([t,k])=>{ n++; return `<li><button type="button" data-k="${k}" ${k===cur?'aria-current="true"':''}><small>${String(n).padStart(2,'0')}</small><span>${t}</span></button></li>`; }).join('')}</ol>`).join('');
  $('#chapters').querySelectorAll('button').forEach(b=>b.onclick=e=>{ e.stopPropagation(); initAudio(); if(ctx&&ctx.state==='suspended') ctx.resume(); if('speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance('')); go(idx(b.dataset.k)); }); }
function openChapters(focus){ closeVoice(); closePath(); buildChapters(); $('#chapters').hidden=false; $('#chapBtn').setAttribute('aria-expanded','true'); if(focus!==false){ const c=$('#chapters [aria-current]')||$('#chapters button'); c&&c.focus({preventScroll:false}); } }
function closeChapters(){ const c=$('#chapters'); if(!c||c.hidden) return; c.hidden=true; $('#chapBtn').setAttribute('aria-expanded','false'); }
$('#chapBtn').onclick=e=>{ e.stopPropagation(); closePath(); $('#chapters').hidden?openChapters():closeChapters(); };
$('#pathBtn').onclick=e=>{ e.stopPropagation(); $('#pathpanel').hidden?openPath():closePath(); };
document.addEventListener('click',e=>{ if(!$('#chapters').hidden&&!e.target.closest('#chapters,#chapBtn')) closeChapters(); if(!$('#pathpanel').hidden&&!e.target.closest('#pathpanel,#pathBtn')) closePath(); if(!$('#voicepanel').hidden&&!e.target.closest('#voicepanel,#voiceBtn')) closeVoice(); },true);

/* the small helpers the woodcut kits share with the short books */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function rays(cx,cy,r,n,op=.2,col='#FFF6DE'){ let o=''; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2,a2=a+Math.PI/n*.6; o+=`<path d="M${cx} ${cy}L${cx+Math.cos(a)*r} ${cy+Math.sin(a)*r}L${cx+Math.cos(a2)*r} ${cy+Math.sin(a2)*r}Z" fill="${col}" opacity="${op}"/>`; } return o; }
function rnd(seed){ let s=seed; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
function stars(n,seed=3,h=400,col='#FFF6DE'){ let s=seed,o=''; const r=()=>{ s=(s*9301+49297)%233280; return s/233280; }; for(let i=0;i<n;i++) o+=`<circle cx="${(r()*600).toFixed(1)}" cy="${(r()*h).toFixed(1)}" r="${(r()*1.6+.3).toFixed(2)}" fill="${col}" opacity="${(r()*.7+.2).toFixed(2)}"/>`; return o; }
/* moods: named sound beds a book defines in MOODS; mood('a','b') keeps those playing and fades the rest */
const MOODS={};
function bell(f=392,v=.1,d=4){ if(!ctx) return; const t=now(); [1,2.01,2.76,4.1,5.4].forEach((k,i)=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.value=f*k; env(g,t,v/(1+i*.9),.004,d/(1+i*.4)); o.connect(g).connect(master); o.start(t); o.stop(t+d+.1); }); }
function knell(n=3,f=146.8){ for(let i=0;i<n;i++) setTimeout(()=>bell(f,.14,6),i*2600); }
function mood(...on){ if(!ctx) return; Object.keys(loops).forEach(k=>{ if(!on.includes(k)) stopLoop(k,2.5); }); on.forEach(k=>{ if(!loops[k]&&MOODS[k]) MOODS[k](); }); }

/* ---------- things to do on a page ---------- */
const sayCap=(t,done=()=>{})=>{ typeOut(t,done); speak(t); };
/* tap every glowing spot; each one answers in the caption, and the last one lets you go on */
function tapAll(items,done){ let n=0; items.forEach(([x,y,lab,line,fn],i)=>spotAt(x,y,lab,b=>{ b.classList.add('done'); initAudio(); bell([392,440,493.9,587.3,659.3,784][i%6],.06,2.6); fn&&fn(); const last=++n===items.length; sayCap(line,last?(done||armAdvance):undefined); })); }
/* a choice that matters: a wrong answer walks you down it, then rewinds to here */
function pick(opts){ choices.innerHTML=opts.map((o,i)=>`<button class="btn" type="button" data-i="${i}"${o.go?` data-go="${o.go}"`:''}>${o.label}</button>`).join('');
  choices.querySelectorAll('button').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const o=opts[+b.dataset.i]; choices.innerHTML=''; tickSnd(); if(o.go) detour(o.go,S[si].key,bi); else next(); }); }
/* open your hands: tap each thing to give it up, and it fades from the picture */
function letGo(items){ choices.innerHTML=items.map(([w],i)=>`<button class="btn alt" type="button" data-i="${i}">${w}</button>`).join(''); let n=0;
  choices.querySelectorAll('button').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const [,id,line]=items[+b.dataset.i]; b.disabled=true; b.style.opacity='.3'; whoosh(.12); bell(523.25-n*40,.05,3);
    const el=document.getElementById(id); if(el){ el.classList.add('fade'); el.style.opacity='0'; el.style.transform='translateY(-20px)'; }
    const last=++n===items.length; sayCap(line,last?()=>{ choices.innerHTML=''; armAdvance(); }:undefined); }); }
/* the bedside questions: each gets a yes */
function askAll(qs,label='Yes'){ let k=0; const ask=()=>{ sayCap(qs[k],()=>{ choices.innerHTML=`<button class="btn" type="button" id="yes">${label}</button>`; const y=$('#yes'); y.focus({preventScroll:true});
    y.onclick=e=>{ e.stopPropagation(); choices.innerHTML=''; bell(293.7+k*36,.07,3); k++; k<qs.length?ask():next(); }; }); }; ask(); }
function holdOn(o){ holdGeneric({...o, onDone:()=>{ o.onDone&&o.onDone(); setTimeout(next,o.wait||300); }}); }
function tryAgain(label,key,beat){ choices.innerHTML=`<button class="btn" type="button" id="again">${label}</button>`; $('#again').onclick=e=>{ e.stopPropagation(); go(idx(key),beat); }; $('#again').focus({preventScroll:true}); }
const card=(eye,h,p,btns='')=>`<div class="title-card"><span class="eyebrow">${eye}</span><h1>${h}</h1><p>${p}</p>${btns}</div>`;

/* Folk-painting kit for The Thirteen Days: bold outline, flat colour, marigold garlands, the ghats of Kashi at dusk. */
const K='#2A1A12', SAND='#EBD3A6', MARI='#F2A007', SAFF='#E86A17', VERM='#B8321C', TURM='#E9B92F', TEAL='#136F75', LEAF='#4C8C3A', WHITE='#FBF4E6', SKIN='#C98A5A', DARK='#3C3A6A', INDIGO='#1D1A3A';
const HI_DEFS=`<defs><linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B2152"/><stop offset=".55" stop-color="#B2475A"/><stop offset="1" stop-color="#F2A007"/></linearGradient>
<linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D58C"/><stop offset="1" stop-color="#F3E2C1"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#FFF1B8"/><stop offset=".45" stop-color="${MARI}" stop-opacity=".55"/><stop offset="1" stop-color="${MARI}" stop-opacity="0"/></radialGradient><clipPath id="hiclip"><rect width="600" height="400"/></clipPath></defs>`;
function garland(y=0,n=30){ let o=''; for(let i=0;i<n;i++){ const x=i*600/(n-1); o+=`<circle cx="${x}" cy="${y+12+Math.sin(i/(n-1)*Math.PI*4)*6}" r="9" fill="${i%2?MARI:SAFF}" stroke="${K}" stroke-width="1.5"/>`; } return o; }
function scene(inner,{sky='dusk',frame=true}={}){ return `${HI_DEFS}<g clip-path="url(#hiclip)"><rect width="600" height="400" fill="${sky==='dusk'?'url(#dusk)':sky==='day'?'url(#day)':sky}"/>${inner}${frame?garland(-4,34):''}</g>`; }
function temples(y=230,col=DARK){ const T=(x,h,w)=>`<path d="M${x-w} ${y} V${y-h*.45} Q${x-w*.6} ${y-h*.8} ${x} ${y-h} Q${x+w*.6} ${y-h*.8} ${x+w} ${y-h*.45} V${y}Z" fill="${col}"/><path d="M${x} ${y-h} v-12" stroke="${col}" stroke-width="3"/><path d="M${x} ${y-h-12} l10 4 l-10 4" fill="${VERM}"/>`;
  return `<rect x="0" y="${y-40}" width="600" height="60" fill="${col}"/>${T(70,120,34)}${T(170,90,26)}${T(260,150,40)}${T(370,100,30)}${T(470,130,36)}${T(560,90,26)}`; }
function steps(y=250,h=60){ let o=''; for(let i=0;i<6;i++) o+=`<rect x="0" y="${y+i*h/6}" width="600" height="${h/6}" fill="${i%2?'#D9B98A':'#E5C899'}" stroke="${K}" stroke-width="1"/>`; return o; }
function river(y=310,lamps=true){ let o=`<rect x="0" y="${y}" width="600" height="${400-y}" fill="${TEAL}"/>`; for(let k=0;k<5;k++){ let d=`M0 ${y+14+k*18}`; for(let x=0;x<600;x+=30) d+=` q15 -6 30 0`; o+=`<path d="${d}" stroke="#4FA3A0" stroke-width="2" fill="none" opacity=".7"/>`; }
  if(lamps){ const r=rnd(5); for(let i=0;i<9;i++){ const x=40+r()*520,yy=y+20+r()*60; o+=`<g class="drift" style="animation-duration:${8+r()*6}s">${diya(x,yy,.6)}</g>`; } } return o; }
function diya(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><circle cx="0" cy="-14" r="18" fill="url(#glow)" class="flick"/><path d="M-16 -4 Q0 10 16 -4 Z" fill="${VERM}" stroke="${K}" stroke-width="1.8"/><path d="M0 -6 Q-5 -14 0 -24 Q5 -14 0 -6Z" fill="${MARI}" stroke="${K}" stroke-width="1" class="flame"/></g>`; }
/* a frontal folk figure; cloth: kurta/dhoti or sari */
function person(x,y,s=1,{cloth=WHITE,skin=SKIN,hair=K,shaved=false,sari=false,arms='down',thread=false}={}){ return `<g transform="translate(${x} ${y}) scale(${s})">
  ${sari?`<path d="M-26 0 Q-30 -60 -18 -96 L18 -96 Q30 -60 26 0Z" fill="${cloth}" stroke="${K}" stroke-width="2"/><path d="M-18 -96 Q10 -70 26 0" fill="none" stroke="${MARI}" stroke-width="5"/>`:`<path d="M-16 0 L-12 -50 L12 -50 L16 0 L4 0 L0 -36 L-4 0Z" fill="${cloth}" stroke="${K}" stroke-width="2"/><path d="M-20 -48 Q0 -40 20 -48 L18 -96 L-18 -96Z" fill="${cloth}" stroke="${K}" stroke-width="2"/>`}
  ${arms==='pray'?`<path d="M-18 -90 L-6 -64 L0 -74 L6 -64 L18 -90" fill="none" stroke="${skin}" stroke-width="7" stroke-linejoin="round"/><path d="M-3 -72 L0 -82 L3 -72Z" fill="${skin}" stroke="${K}" stroke-width="1.2"/>`:arms==='offer'?`<path d="M-18 -90 L-14 -62 L14 -62 L18 -90" fill="none" stroke="${skin}" stroke-width="7" stroke-linejoin="round"/>`:`<path d="M-18 -92 L-24 -46 M18 -92 L24 -46" stroke="${skin}" stroke-width="7" stroke-linecap="round"/>`}
  ${thread?`<path d="M-16 -94 L14 -52" stroke="${WHITE}" stroke-width="2"/>`:''}
  <rect x="-5" y="-104" width="10" height="10" fill="${skin}" stroke="${K}" stroke-width="1.5"/><circle cx="0" cy="-116" r="14" fill="${skin}" stroke="${K}" stroke-width="2"/>
  ${shaved?`<path d="M-2 -130 q-4 -10 2 -14" stroke="${K}" stroke-width="2" fill="none"/>`:sari?`<path d="M-15 -114 Q-18 -136 0 -134 Q18 -136 15 -114 Q22 -110 18 -96 L14 -110 Q0 -128 -14 -110 L-18 -96 Q-22 -110 -15 -114Z" fill="${cloth}" stroke="${K}" stroke-width="1.6"/>`:`<path d="M-14 -118 Q-14 -134 0 -134 Q14 -134 14 -118 Q8 -126 0 -126 Q-8 -126 -14 -118Z" fill="${hair}"/>`}

  view:()=>PG(`${tiny(300,240,1.5)}${icon.sword(110,120)}${icon.fire(490,100)}${icon.water(110,300)}${icon.wind(490,300)}`,'A small golden figure glows like a flame in the dark. Around it: a sword, a fire, a drop of water, a gust of wind.',{sky:INDIGO}),
  enter(){ mood('tanpura','shine'); },
  beats:[
    {text:"Here is what Death taught the boy. The real you, the self, the ātman, is not born and does not die. When the body is killed, it is not killed."},
    {text:"The Bhagavad Gita says the same thing, and names four things that can't touch it. Tap each one.", lock:true, show(){ tapAll([
      [18,30,'The sword',"Weapons cannot cut it."],
      [82,22,'The fire',"Fire cannot burn it."],
      [18,75,'The water',"Water cannot wet it."],
      [82,75,'The wind',"Wind cannot dry it. It is eternal, everywhere, unmoving, ancient (Gita 2.23–24)."] ]); }},
    {text:"The Upanishad even gives it a size. A person no bigger than a thumb, living in the heart, like a flame without smoke."} ]},

{ key:'clothes', label:'Old clothes', bg:SANDBG, learn:'atman',
  view:()=>PG(`<path d="M40 92 Q300 108 560 92" stroke="${K}" stroke-width="3" fill="none"/>${cloth(110,'c0','#F2B8C6',44,60)}${cloth(230,'c1',TEAL,60,90)}${cloth(360,'c2',VERM,70,100)}${cloth(490,'c3',WHITE,64,110)}${tiny(300,340,.8)}`,'A washing line strung with four garments: a child’s shirt, a young man’s kurta, a red wedding shawl and an old man’s white dhoti. A small light waits below.',{sky:'day'}),
  enter(){ mood('tanpura'); },
  beats:[
    {text:"Krishna tells the grieving warrior Arjuna: as a person throws off worn-out clothes and puts on new ones, the self throws off worn-out bodies and enters new ones (Gita 2.22)."},
    {text:"Take them off the line, one by one.", lock:true, afterType(){ letGo([['A child’s shirt','c0',"The child you were. Gone, and you didn't die."],['A young man’s kurta','c1',"The young man. Gone too."],['A wedding shawl','c2',"The bride, the groom, the parent. All worn out, all set down."],['An old man’s dhoti','c3',"And this old body. It's only the last one on the line."]]); }},
    {text:"For the born, death is certain, Krishna says, and for the dead, birth is certain. So don't grieve too long over what can't be avoided. You've changed clothes before."} ]},

/* ===== Volume 1: the last thought ===== */
{ key:'room', label:'The last thought', bg:'#6A3A2A',
  view:()=>PG(`${wall()}<rect y="262" width="600" height="138" fill="#B07A4A"/><rect x="170" y="300" width="300" height="20" rx="4" fill="${WHITE}" stroke="${K}" stroke-width="2"/>${lying(380,306,.85,{cloth:WHITE})}${person(500,300,.7,{sari:true,cloth:MARI,arms:'pray'})}${person(140,300,.7,{shaved:true,thread:true,arms:'pray'})}${diya(250,360,1.1)}${tulsi(560,370,.7)}${pot(430,370,.8)}${portrait(300,120,.55)}`,'A room with a garlanded portrait on the wall. A dying person lies on a white mat on the floor. Family kneel on either side. A clay lamp, a pot of Ganga water and a tulsi plant.',{sky:'#6A3A2A'}),
  enter(){ mood('room','tanpura'); clockOn(); heartbeat(64); },
  beats:[
    {text:"Now it's your turn. You're very ill, and the family has moved you off the bed onto a mat on the floor, closer to the earth, your head to the north."},
    {text:"Fear not. Look around the room. Tap the four things.", lock:true, show(){ tapAll([
      [71.5,85,'The pot',"Water from the Ganga, the holy river, kept in a sealed pot for years for exactly this. A few drops on your lips."],
      [93,82,'The tulsi',"Tulsi, holy basil, sacred to Vishnu. A leaf is placed in your mouth."],
      [41.5,86,'The lamp',"A clay lamp, a diya. It will burn by your head after you go, to light the way."],
      [83,50,'Your daughter',"Your daughter, chanting a name of God softly next to your ear, again and again, so it's the last sound you hear."] ]); }},
    {text:"Why the name? Because of what the Gita says next."} ]},

{ key:'thought', label:'The last thought', bg:'#4A2A1E',
  view:()=>PG(`${wall()}<rect y="262" width="600" height="138" fill="#8A5A3A"/>${lying(380,306,.85,{cloth:WHITE})}<g transform="translate(260 150)"><ellipse rx="130" ry="70" fill="${WHITE}" stroke="${K}" stroke-width="2.5" stroke-dasharray="7 5"/><circle cx="-60" cy="96" r="10" fill="${WHITE}" stroke="${K}" stroke-width="2"/><circle cx="-36" cy="78" r="14" fill="${WHITE}" stroke="${K}" stroke-width="2"/><path d="M-80 20 V-14 L-60 -32 L-40 -14 V20Z" fill="${VERM}" stroke="${K}" stroke-width="2"/>${gold(10,10)}<text x="70" y="14" font-size="44" text-anchor="middle" fill="${SAFF}" font-family="serif">ॐ</text></g>`,'The dying person’s thought bubble: a house, a pile of gold, and the sacred syllable Om.',{sky:'#4A2A1E'}),
  enter(){ mood('room','drone'); heartbeat(58); },
  beats:[
    {text:"Whatever a person remembers at the moment of leaving the body, Krishna says, that is what they become. Whoever remembers me at the end comes to me (Gita 8.5–6)."},
    {text:"So the last thought matters. And yours keeps sliding to the house. Who will get it? Did you lock the back door?"},
    {text:"Where do you put your mind?", lock:true, afterType(){ pick([{label:'On the house, and who gets it',go:'x_deer'},{label:'On God’s name'}]); }} ]},

{ key:'ajamila', label:'The last thought', bg:'#F2A007', learn:'lastthought',
  view:()=>PG(`<rect y="300" width="600" height="100" fill="#B07A4A"/>${lying(330,316,.75,{cloth:'#8A7A66'})}${person(120,300,.75,{cloth:'#3C3A3A',skin:'#3E4E5A'})}${person(190,300,.75,{cloth:'#3C3A3A',skin:'#3E4E5A'})}${person(450,300,.8,{cloth:TURM,skin:'#4F7AB8',arms:'offer'})}${person(520,300,.8,{cloth:TURM,skin:'#4F7AB8',arms:'offer'})}<circle cx="485" cy="190" r="80" fill="url(#glow)" class="flick"/>`,'A dying man. On the left, two dark messengers of Death. On the right, two blue-skinned messengers of Vishnu in yellow, stopping them.',{sky:'day'}),
  enter(){ mood('tanpura','shine'); chime(); heartbeat(52); },
  beats:[
    {text:"Good. There's a famous story about this in the Bhagavata Purana. Ajamila was a man who lived badly for most of his life. But he had named his youngest son Narayana, which is a name of Vishnu."},
    {text:"Dying, terrified, he called out for his little boy: Narayana! And Vishnu's messengers came running, and stopped Death's messengers at the door. He'd said the name. It was enough."},
    {text:"That's why your daughter is chanting in your ear. Families try to fill the last moments with the sacred, so that whatever your mind lands on, it lands on God."} ]},

{ key:'leaving', label:'Leaving the body', bg:INDIGO,
  view:()=>PG(`<g opacity=".55">${person(300,380,2.3,{cloth:'#3C3A6A',skin:'#5A4A7A',hair:'#2A2450'})}</g><path d="M300 228 V114" stroke="${MARI}" stroke-width="3" stroke-dasharray="4 6"/><circle cx="300" cy="112" r="20" fill="none" stroke="${TURM}" stroke-width="2"/><g id="sb" style="transition:transform .2s">${tiny(0,0,.55)}</g>`,'A large faint body. A dotted golden line runs from the heart up to the crown of the head. A tiny bright figure sits at the heart.',{sky:INDIGO}),
  enter(){ mood('shine'); heartbeat(44); const b=$('#sb'); b&&b.setAttribute('transform','translate(300 240)'); },
  guide:{title:'Kashi',text:"In the holy city of Varanasi, also called Kashi, many believe that anyone who dies there is freed at once: Shiva himself whispers the mantra of crossing into their ear. People come there to die. Some hospices, like Mukti Bhawan, the House of Liberation, exist only for them, and ask guests to leave if they haven't died within about two weeks."},
  beats:[
    {text:"At death, the body made of food is left behind. What travels on is the subtle body: your mind, your senses, your breath, and the karma of everything you've done, carried like seeds."},
    {text:"The heart has a hundred and one channels, the Katha Upanishad says. One of them rises to the crown of the head. Leave by that one, and you go up to immortality. Leave by the others, and you go every other way, back into the world."},
    {text:"Hold, and rise to the crown.", lock:true, show(){ heartStop(); clockOff(); holdOn({label:'Rise to the crown',ms:6000,wait:900,onProgress:p=>{ const b=$('#sb'); if(b) b.setAttribute('transform',`translate(300 ${240-128*p})`); },onDone:()=>{ breath(1.5,5); bell(523.25,.08,5); }}); }} ]},

{ key:'black', label:'', bg:'#000000', void:true,
  view:()=>'', enter(){ silenceAll(1); }, beats:[{text:null, lock:true, auto:6000}] },

/* ===== Volume 2: the fire ===== */
{ key:'v2', label:'Volume 2', bg:'var(--teal)',
  view:()=>card('Volume 2','The Fire',"Cremation usually happens within a day, often on the bank of a river. It is called antyeṣṭi: the last sacrifice. The body is the offering."),
  enter(){ mood('tanpura'); conch(); }, beats:[{text:null}] },

{ key:'bier', label:'The last sacrifice', bg:DUSKBG,
  view:()=>PG(`${temples(250)}${steps(250,40)}<rect y="290" width="600" height="110" fill="#D9B98A"/>${bier(300,380)}`,'At dusk by the temples, four men carry a white-shrouded body on a bamboo bier draped in marigolds.'),
  enter(){ mood('tanpura'); },
  beats:[
    {text:"They wash you, dress you in white, and garland you with marigolds. A married woman would wear red. Then four men lift you onto their shoulders on a bamboo bier and walk you to the river."},
    {text:"They chant as they walk. Chant with them, three times.", lock:true, afterType(){ setTimeout(()=>askAll(["Rāma nāma satya hai.","The name of Rama is truth.","Rāma nāma satya hai. Everything else passes."],'Rāma nāma satya hai'),600); }} ]},

{ key:'pyre', label:'The last sacrifice', bg:DUSKBG,
  view:()=>PG(`${temples(250)}${steps(250,40)}${river(290)}<g id="py">${pyre(300,280,.75)}</g>${person(470,290,.75,{shaved:true,thread:true,arms:'offer'})}${pot(470,215,.7)}`,'On the ghat, a body lies on a pyre of logs. The chief mourner, head shaved, holds a clay pot of water.'),
  enter(){ mood('tanpura','river'); },
  guide:{title:'Who lights the fire',text:"Traditionally the chief mourner is the eldest son, and in many places only men go to the cremation ground. That is changing: daughters and wives now light pyres too. Not everyone is cremated. Young children and holy renunciants, sannyasis, are often buried or given to a river, and some communities, such as the Lingayats, bury their dead."},
  beats:[
    {text:"Your eldest son has shaved his head. He carries a clay pot of water on his shoulder, and walks around your pyre three times. With each round, a hole is knocked in the pot, and water runs out behind him."},
    {text:"Tap to walk each round.", lock:true, show(){ tapAll([
      [24,62,'The first round',"The first round. Water runs out of the pot like a life running out.",()=>burst({type:'lowpass',freq:800,peak:.12,d:.6})],
      [50,46,'The second round',"The second.",()=>burst({type:'lowpass',freq:800,peak:.12,d:.6})],
      [76,62,'The third round',"The third. Then he throws the pot down behind him and walks on without looking back. The bond is broken.",crack] ]); }},
    {text:"Now the fire. He lights it at your head. Hold to light the pyre.", lock:true, show(){ holdOn({label:'Light the fire',ms:5000,wait:700,onDone:()=>{ const p=$('#py'); if(p) p.innerHTML=pyre(300,280,.75,{lit:true}); mood('fire','tanpura'); crackle(2500); }}); }},
    {text:"Agni, the fire, was always the messenger in the Vedic sacrifice, carrying offerings up to the gods. Now it carries you."} ]},

{ key:'mourn', label:'The last sacrifice', bg:DUSKBG,
  view:()=>PG(`${temples(250)}${steps(250,40)}${river(290)}${pyre(300,280,.75,{lit:true})}${person(110,290,.7,{sari:true,cloth:WHITE,arms:'pray'})}${person(470,290,.75,{shaved:true,thread:true,arms:'pray'})}`,'The pyre burns. A woman in white and the chief mourner stand by.'),
  enter(){ mood('fire','tanpura'); },
  beats:[
    {text:"Your wife can't stop crying. Nobody would blame her. But what should the family do now?", lock:true, afterType(){ pick([{label:'Let the fire do its work',},{label:'Weep, and keep weeping',go:'x_grief'}]); }},
    {text:"So they stand and watch, and pray. When the fire has done most of its work, your son taps your skull with a bamboo pole. It's called kapāla kriyā, and it frees what's left of you."},
    {text:"At Manikarnika Ghat in Varanasi, pyres have burned like this without stopping, day and night, for centuries."} ]},

{ key:'ashes', label:'The ashes', bg:RIVERBG, learn:'fire',
  view:()=>PG(`${temples(200)}${river(230)}${[110,200,290,380,470].map((x,i)=>diya(x,280+(i%2)*30,.9)).join('')}`,'Little clay lamps float on the dark river at dusk.',{sky:'dusk'}),
  enter(){ mood('river','tanpura'); },
  beats:[
    {text:"On the third or fourth day the bones and ashes are gathered and given to a river, the Ganga if the family can reach it. Lamps go with them, floating downstream."},
    {text:"The body was the last offering. It's been given. Nothing of it is wasted, and none of it was you."} ]},

{ key:'preta', label:'A body of rice', bg:NIGHTBG,
  view:()=>PG(`${bodyOutline()}${PARTS.map(([id,x,y])=>`<g id="${id}" opacity=".15" style="transition:opacity .8s"><circle cx="${x}" cy="${y}" r="16" fill="url(#glow)"/>${pindaBall(x,y)}</g>`).join('')}${banana(110,360,160)}${pindaBall(80,350)}${pindaBall(110,346)}${pindaBall(140,350)}`,'In the dark, the dotted outline of a body. On a banana leaf, balls of cooked rice.',{sky:NIGHTBG}),
  enter(){ mood('drone','tanpura'); },
  beats:[
    {text:"After the fire you have no body at all. You're a preta: a departed one, a ghost. The Garuda Purana says the preta is hungry, thirsty and lost, about the size of a thumb, hovering near home."},
    {text:"So for ten days your family offer you piṇḍas: balls of cooked rice mixed with sesame, ghee and honey. Each one builds a part of a new, subtle body for the journey. Tap to offer each day's piṇḍa.", lock:true, show(){ tapAll(PARTS.map(([id,x,y,name],i)=>[x/6,y/4,`Day ${i+1}`,`Day ${i+1}: ${name.toLowerCase()}.`+(i===9?' Now you can feel hunger and thirst, and so you can be fed.':''),()=>{ const e=$('#'+id); if(e) e.setAttribute('opacity','1'); }])); }},
    {text:"During those days the family are ritually impure. They stay home, don't cook elaborate food, don't go to temples or weddings. Neighbours feed them. Grief is given a shape, and something to do every day."} ]},

{ key:'fed', label:'A body of rice', bg:NIGHTBG, learn:'pinda',
  view:()=>PG(`${bodyOutline()}${PARTS.map(([id,x,y])=>`<circle cx="${x}" cy="${y}" r="16" fill="url(#glow)"/>`).join('')}${tiny(300,240,1.1)}`,'The outline of the body glows, complete.',{sky:NIGHTBG}),
  enter(){ chime(); mood('shine'); },
  beats:[{text:"On the tenth day the new body is complete, about the size of a forearm, the Garuda Purana says. You're ready to travel. The living have built it for you, one handful of rice at a time."}] },

/* ===== Volume 3: the road south ===== */
{ key:'v3', label:'Volume 3', bg:'var(--teal)',
  view:()=>card('Volume 3','The Road South',"Yama's city lies far to the south. The Garuda Purana says the walk takes a year, which is why families keep making offerings every month. Many Hindus read this road as a parable. Here it is as the Purana tells it."),
  enter(){ mood('drone'); conch(); }, beats:[{text:null}] },

{ key:'road', label:'The road south', bg:'#B2475A',
  view:()=>PG(`${road()}${person(250,380,.55,{cloth:'#3C3A3A',skin:'#3E4E5A'})}${person(350,380,.55,{cloth:'#3C3A3A',skin:'#3E4E5A'})}${tiny(300,360,.5)}`,'A long road winds south through desert, past small gates. Two dark messengers walk a small glowing figure along it.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"Yama's messengers come for you, and you walk south. The road passes sixteen cities. At each one, the offerings your family are making that month reach you, and you eat."},
    {text:"For those who did wrong it's a road of burning sand and thorns, with no shade and no water. For those who were generous, the Purana says, there is shade, and water, and food. What you gave away in life is waiting for you on the road."} ]},

{ key:'vaitarani', label:'The river Vaitaraṇī', bg:'#5A1410',
  view:()=>PG(`${bloodRiver(250)}<rect y="216" width="600" height="40" fill="#3C3A6A"/><g id="cw" style="transition:transform .2s">${cow(0,0,.85)}${tiny(-70,-20,.45)}<path d="M-50 -24 Q-60 -30 -64 -20" stroke="${K}" stroke-width="2" fill="none"/></g>`,'A river of blood and pus. A white cow stands at the edge, a small glowing figure holding its tail.'),
  enter(){ mood('river','drone'); const c=$('#cw'); c&&c.setAttribute('transform','translate(110 290)'); },
  guide:{title:'Giving a cow',text:"Giving a cow, godāna, is one of the oldest gifts in Hindu practice. Some families still give a cow, or money for one, to a priest in the dead person's name, so that they have a cow to hold onto at the river. The deeper point is generosity: what you gave away is what carries you over."},
  beats:[
    {text:"Before Yama's city runs the Vaitaraṇī, a river of blood, pus and bones, hot and roaring. The wicked are swept away in it. But there is a way across."},
    {text:"Someone who gave a cow in life, or whose family gives one in their name, crosses holding the cow's tail. Hold on, and don't let go until you reach the far bank.", lock:true, show(){ let last=0; holdOn({label:'Hold the cow’s tail',ms:7000,wait:400,onProgress:p=>{
        if(p===0&&last>.06&&last<1&&S[si].key==='vaitarani'){ last=0; setTimeout(()=>detour('x_river','vaitarani',1),350); return; } last=p; const c=$('#cw'); if(c) c.setAttribute('transform',`translate(${110+380*p} ${290+Math.sin(p*Math.PI*6)*4})`); }}); }},
    {text:"You're across."} ]},

{ key:'dana', label:'The river Vaitaraṇī', bg:'#F3E2C1', learn:'dana',
  view:()=>PG(`${steps(250,60)}<rect y="310" width="600" height="90" fill="#D9B98A"/>${cow(300,320,1)}${tiny(200,300,.6)}`,'On the far bank, the cow and the small figure rest.',{sky:'day'}),
  enter(){ mood('tanpura'); chime(); },
  beats:[{text:"An old cow given to a priest, or a little money in your name. It looks like nothing. But generosity is the one thing in this story strong enough to swim a river of blood."}] },

{ key:'court', label:'The court of Yama', bg:'#3C3A6A',
  view:()=>PG(`<rect width="600" height="400" fill="#3C3A6A"/><rect y="320" width="600" height="80" fill="#2A2450"/>${yama(400,320,1)}${person(170,320,.8,{cloth:WHITE,arms:'offer'})}<g transform="translate(170 250)"><rect x="-34" y="-8" width="68" height="44" fill="${WHITE}" stroke="${K}" stroke-width="2"/><path d="M-28 4 h56 M-28 12 h56 M-28 20 h40 M0 -8 V36" stroke="${K}" stroke-width="1.2"/></g>${icon.sun(80,70)}${icon.moon(220,60)}${icon.wind(380,70)}${icon.fire(520,50)}`,'Yama on his buffalo in his hall. Beside him the scribe Chitragupta with an open ledger. Above: the sun, the moon, the wind and fire.',{sky:'#3C3A6A'}),
  enter(){ mood('drone','tanpura'); conch(); },
  beats:[
    {text:"In his city, Yama sits in judgment. Here he's called Dharmarāja, the king of what is right. Beside him sits Chitragupta, his scribe, who keeps a ledger of every deed of every person who ever lived."},
    {text:"How does he know? There were witnesses, the Purana says, watching all along. Tap each one.", lock:true, show(){ tapAll([
      [13,17,'The sun',"The sun, who saw everything you did by day."],
      [37,15,'The moon',"The moon, who saw everything you did by night."],
      [63,17,'The wind',"The wind, who heard everything you said."],
      [87,12,'The fire',"And fire, who was there at every meal and every prayer."] ]); }},
    {text:"Chitragupta reads. Yama doesn't really sentence you. He reads out what you've already written. Every action leaves a trace, and the trace becomes what happens to you next. That's karma."} ]},

{ key:'wheel', label:'Heavens and hells', bg:INDIGO, learn:'karma',
  view:()=>PG(`${wheel(300,210,150)}<text x="300" y="44" text-anchor="middle" font-size="22" fill="${TURM}" font-family="'Yatra One',serif">heaven</text><text x="300" y="392" text-anchor="middle" font-size="22" fill="${VERM}" font-family="'Yatra One',serif">hell</text>${tiny(300,90,.45)}`,'A great golden wheel turning slowly, heaven written at the top and hell at the bottom.',{sky:INDIGO}),
  enter(){ mood('tanpura','shine'); },
  beats:[
    {text:"The Purana describes heavens of pleasure and many hells, each matched to a wrong. You have earned a heaven. It's beautiful there. The music is better."},
    {text:"But here's the catch. Neither heaven nor hell lasts. Having enjoyed the vast world of heaven, the Gita says, they return to the mortal world when their merit is spent (9.21). What do you want?", lock:true, afterType(){ pick([{label:'Stay in heaven for ever',go:'x_heaven'},{label:'Get off the wheel'}]); }},
    {text:"Good question to ask. After every heaven and every hell comes another birth: as a person, an animal, a plant, a god, depending on karma. This is saṃsāra, the wheel, turning without end. The real goal was never heaven. It was getting off."} ]},

{ key:'sapinda', label:'The twelfth day', bg:SANDBG,
  view:()=>PG(`${banana(300,300,360)}${pindaBall(220,292,'pA')}${pindaBall(300,286,'pB')}${pindaBall(380,292,'pC')}<g id="pY" style="transition:transform 1.4s">${pindaBall(300,360)}</g><text x="220" y="262" text-anchor="middle" font-size="14" fill="${K}">grandfather</text><text x="300" y="256" text-anchor="middle" font-size="14" fill="${K}">father</text><text x="380" y="262" text-anchor="middle" font-size="14" fill="${K}">great-grandfather</text>${crow(500,140,1.4)}${crow(90,170,1.2)}`,'A banana leaf with three balls of rice for the ancestors, and one more below it. Crows wait nearby.',{sky:'day'}),
  enter(){ mood('tanpura'); },
  beats:[
    {text:"Back home, on the twelfth day, comes the rite that ends your time as a ghost. It's called sapiṇḍīkaraṇa. Your piṇḍa is cut into three and merged with the piṇḍas of three ancestors: your father, your grandfather, your great-grandfather."},
    {text:"Hold to join them.", lock:true, show(){ holdOn({label:'Join the ancestors',ms:4000,wait:800,onProgress:p=>{ const y=$('#pY'); if(y) y.setAttribute('transform',`translate(0 ${-70*p})`); },onDone:()=>{ ['pA','pB','pC'].forEach(id=>{ const e=$('#'+id); if(e) e.setAttribute('opacity','.6'); }); bell(392,.08,4); }}); }},
    {text:"With that you're no longer a preta. You're a pitṛ, an ancestor, in the world of the fathers. Every year on the day you died, and in the autumn fortnight of Pitṛ Paksha, your family will feed you again."},
    {text:"And the crows get the first share. They're thought to carry offerings to the dead. Tap a crow.", lock:true, show(){ tapAll([[83,33,'A crow',"If a crow takes the food quickly, people say the ancestor is content.",caw],[15,40,'Another crow',"This one too. You've been fed.",caw]]); }} ]},

{ key:'thirteenth', label:'The thirteenth day', bg:SANDBG,
  view:()=>PG(`${[90,200,310,420,530].map((x,i)=>`${banana(x,320,110)}<circle cx="${x-20}" cy="312" r="10" fill="${WHITE}" stroke="${K}" stroke-width="1.5"/><circle cx="${x}" cy="310" r="8" fill="${TURM}" stroke="${K}" stroke-width="1.5"/><circle cx="${x+20}" cy="312" r="9" fill="${SAFF}" stroke="${K}" stroke-width="1.5"/>`).join('')}${portrait(300,150,.8)}${diya(180,240,1)}${diya(420,240,1)}`,'A garlanded portrait between two lamps. Below, a row of banana leaves laid with food for a feast.',{sky:'day'}),
  enter(){ mood('tanpura'); chime(); },
  beats:[
    {text:"On the thirteenth day the family bathes. Priests and relatives are fed. Your photograph goes up on the wall with a garland. The mourning ends, and the house is pure again."},
    {text:"Life starts up. That's what the thirteen days were for, for the living: not forgetting, but being carried, step by step, back into the world."} ]},

{ key:'moksha', label:'Release', bg:RIVERBG,
  view:()=>PG(`<rect width="600" height="200" fill="url(#dusk)"/><path d="M0 200 H600 V400 H0Z" fill="${TEAL}"/><path d="M-20 400 Q160 300 300 250 Q440 210 620 210" stroke="#4FA3A0" stroke-width="40" fill="none" opacity=".7"/><circle cx="520" cy="200" r="120" fill="url(#glow)"/>${lotus(140,330,1.1)}`,'A river widening into a glowing sea at sunset. A lotus floats in the foreground.',{sky:RIVERBG}),
  enter(){ mood('shine','river'); },
  guide:{title:'One or two?',text:"Hindu schools picture release differently. For Advaita Vedanta, the self was always Brahman, the infinite, and release is simply waking up to that: the river was always water. For devotional schools, Vaishnava, Shaiva and Shakta, the soul lives for ever in the loving presence of God, close but still itself, the way a drop of honey can taste honey."},
  beats:[
    {text:"Beyond heaven, hell and rebirth is mokṣa: release. When all the desires that live in the heart are let go, the Upanishad says, the mortal becomes immortal, and reaches Brahman, the infinite, here and now (Katha 6.14)."},
    {text:"As rivers flowing into the sea lose their names and forms, the wise, freed from name and form, reach the divine (Mundaka 3.2.8). Be still now. Let go of wanting anything. Don't tap.", lock:true, cls:'quiet', afterType(){ stillTest({ms:12000,pass:'released',fail:'mokFail'}); }} ]},

{ key:'mokFail', label:'Release', bg:RIVERBG,
  view:()=>PG(`<rect width="600" height="200" fill="url(#dusk)"/><path d="M0 200 H600 V400 H0Z" fill="${TEAL}"/>${lotus(140,330,1.1)}`,'The river again.',{sky:RIVERBG}),
  beats:[{text:"A desire, a twitch, a thought. That's the whole wheel in one small movement. Sages take lifetimes over this. You can take another minute.", lock:true, afterType(){ tryAgain('Be still again','moksha',1); }}] },

{ key:'released', label:'Release', bg:'#FFF1B8', learn:'moksha',
  view:()=>PG(`<rect width="600" height="400" fill="#FFF1B8"/><circle cx="300" cy="200" r="280" fill="url(#glow)"/><circle cx="300" cy="200" r="140" fill="url(#glow)"/>`,'Only golden light.',{sky:'#FFF1B8',frame:false}),
  enter(){ chime(); setTimeout(()=>bell(523.25,.07,6),1400); },
  beats:[{text:"Those who come to me, Krishna says, do not return to birth (Gita 8.16). The wheel stops. The river is the sea."}] },

{ key:'lastpage', label:'The last page', bg:DUSKBG,
  view:()=>PG(`${moonC(300,70,'mL').replace('opacity=".15"','opacity="1"')}<rect y="330" width="600" height="70" fill="#5A3A2A"/>${gate(300,330,1.15)}${person(300,330,.55,{cloth:SAFF,shaved:true,thread:true,arms:'pray'})}`,'The boy at Death’s gate again, under the moon.'),
  enter(){ mood('tanpura'); },
  beats:[
    {text:"That's the road: a last thought turned to God, a body given to fire, ten days of rice building a new one, a long walk south, a river crossed holding a cow, the ledger, and a place among the ancestors on the thirteenth day."},
    {text:"And it's the answer Nachiketa got from Death, all those centuries ago, for waiting three nights at his door. What you really are was never born, and will never die. The rest is clothing."} ]},

{ key:'end', label:'The end', bg:'var(--teal)',
  view:()=>`<div class="title-card" style="cursor:default"><span class="eyebrow">The end of the book</span><h1>Go in peace</h1>
    <p>That was the whole road: the boy at Death's door, the last thought, the fire, the ten days, the road south, the river, the court, the ancestors and release.</p><p id="endsum" style="font-weight:700"></p>
    <p class="draft">Sources: Katha and Mundaka Upanishads; Bhagavad Gita 2, 8 and 9; Bhagavata Purana (Ajamila); Garuda Purana, Preta Khanda. Practice varies a great deal by region, caste and community.</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="again" type="button">Read it again</button><button class="btn alt" id="pathend" type="button">See your path</button><button class="btn alt" id="chend" type="button">Choose a chapter</button></div>
    <div class="endlinks"><a href="../walk/">Walk the Thirteen Days</a><a href="../../index.html#doors">Back to Many Doors</a></div></div>`,
  enter(){ mood('tanpura'); $('#again').onclick=e=>{ e.stopPropagation(); go(idx('room')); }; $('#chend').onclick=e=>{ e.stopPropagation(); openChapters(true); }; $('#pathend').onclick=e=>{ e.stopPropagation(); openPath(); };
    $('#endsum').textContent=`You learned ${journey.learned.size} of ${LESSONS.length} lessons and walked ${journey.visited.size} of ${DETOURS.length} wrong turns.`+(journey.learned.size===LESSONS.length?' You know the way.':' Read again to learn the rest.'); },
  beats:[{text:null,lock:true}] },

/* ===== wrong turns ===== */
{ key:'x_wealth', label:'A wrong turn', bg:'#4A3A20',
  view:()=>PG(`<rect y="330" width="600" height="70" fill="#5A3A2A"/>${gold(200,320)}${gold(300,326)}${gold(400,320)}${gold(250,300)}${gold(350,300)}${person(300,300,.62,{cloth:SAFF,shaved:true,thread:true,arms:'offer'})}`,'The boy sits on a heap of gold. The gate is gone.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"You take the gold, the horses and the dancers. Yama smiles, and is gone, and the door closes. You'll never know what he would have said."},
    {text:"Yama has a name for this: the fool chooses the pleasant. It isn't wicked. It's just very small. Every one of those horses will die. Rewind, and ask the real question.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_deer', label:'A wrong turn', bg:'#2E4A2A',
  view:()=>PG(`<rect y="300" width="600" height="100" fill="#4C8C3A"/>${[100,500].map(x=>`<g transform="translate(${x} 300)"><path d="M-4 0 V-90" stroke="#7A4A26" stroke-width="10"/><circle cy="-110" r="50" fill="#2E6A2A"/></g>`).join('')}<g transform="translate(300 300)"><path d="M-40 -40 Q-50 -66 -20 -68 L30 -66 Q46 -60 46 -44 L48 0 H40 L38 -24 H-30 L-34 0 H-42Z" fill="#C98A4A" stroke="${K}" stroke-width="2"/><circle cx="48" cy="-80" r="14" fill="#C98A4A" stroke="${K}" stroke-width="2"/><path d="M44 -92 l-8 -22 M52 -92 l8 -22 M40 -104 l-10 -4 M56 -104 l10 -4" stroke="${K}" stroke-width="2.5"/></g>`,'A forest. A young deer stands where a person should be.',{sky:'#9FC6A0'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"There's a story for this too, in the Bhagavata Purana. King Bharata gave up his kingdom to live as a hermit in the forest. But he rescued an orphaned fawn, and grew so attached to it that he thought of nothing else."},
    {text:"He died thinking about his deer. And he was born a deer. The house you're worrying about will be fine. Rewind, and put your mind somewhere bigger.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_grief', label:'A wrong turn', bg:'#3A3040',
  view:()=>PG(`${temples(250)}${steps(250,40)}${river(290)}${pyre(300,280,.75,{lit:true})}${[150,200,400,450].map(x=>person(x,290,.6,{sari:true,cloth:WHITE,arms:'pray'})).join('')}${Array.from({length:12},(_,i)=>`<path d="M${120+i*30} ${170+(i%3)*12} q4 10 0 16" stroke="#4FA3A0" stroke-width="3" fill="none"/>`).join('')}`,'Mourners weep around the pyre, their tears falling like rain.'),
  enter(){ mood('fire','drone'); },
  beats:[
    {text:"They weep, and weep, for days. Nobody does the rites. Nobody cooks the rice."},
    {text:"The Garuda Purana says something startling about this: the dead have to drink the tears their relatives shed, so endless weeping hurts them. Most families take it gently: cry, yes, but then do the next thing. The rites are how you love the dead now.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_river', label:'A wrong turn', bg:'#5A1410',
  view:()=>PG(`${bloodRiver(150)}${tiny(300,260,.5)}`,'The small figure is swept away in a river of blood.',{sky:'#3C1010'}),
  enter(){ mood('river','drone'); burst({type:'lowpass',freq:400,peak:.3,a:.05,d:1.2}); },
  beats:[
    {text:"You let go of the tail, and the Vaitaraṇī takes you. It's hot, and loud, and it doesn't care who you were."},
    {text:"The Purana is trying to frighten you into one thing: generosity, while you can still give. Rewind, and hold on to what you gave.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_heaven', label:'A wrong turn', bg:'#F7D58C',
  view:()=>PG(`<circle cx="300" cy="120" r="140" fill="url(#glow)"/>${lotus(300,180,1.4)}<g class="fadein">${tiny(300,330,.5)}</g><path d="M300 200 V310" stroke="${K}" stroke-width="2" stroke-dasharray="4 6"/>`,'A golden heaven with a great lotus. Below it, a small figure falls back toward earth.',{sky:'day'}),
  enter(){ mood('shine'); setTimeout(()=>{ if(ctx) rewindSnd(); },2500); },
  beats:[
    {text:"Heaven is wonderful. For a while. Then one day your merit runs out, like money in a bank account, and you're born again on earth, a baby, starting over."},
    {text:"That's the trouble with every reward: it ends. The Gita's whole point is that you were never meant to want a nicer room on the wheel. Rewind, and ask to get off.", lock:true, afterType(){ rewindButton(); }} ]}
];

const CHAPTERS=[
  ['The boy who asked Death',[['At Death’s door','door'],['Three wishes','boons'],['What cannot burn','atman'],['Old clothes','clothes']]],
  ['Volume 1 · The Last Thought',[['The room','room'],['The last thought','thought'],['Leaving the body','leaving']]],
  ['Volume 2 · The Fire',[['The bier','bier'],['The pyre','pyre'],['The ashes','ashes'],['A body of rice','preta']]],
  ['Volume 3 · The Road South',[['The road','road'],['The river Vaitaraṇī','vaitarani'],['The court of Yama','court'],['Heavens and hells','wheel'],['The twelfth day','sapinda'],['The thirteenth day','thirteenth'],['Release','moksha']]] ];
const LESSONS=[
  ['shreya','The good, not the pleasant','The wise choose what is good over what is pleasant.','Three wishes'],
  ['atman','What cannot burn','The self was never born and will never die. Bodies are clothing.','Old clothes'],
  ['lastthought','The last thought','What you remember at the end is what you become. Fill the end with God.','The last thought'],
  ['fire','The last offering','The body is given to the fire. None of it was you.','The ashes'],
  ['pinda','Feeding the dead','The living build the traveller a body, a handful of rice a day.','A body of rice'],
  ['dana','Generosity','What you gave away is what carries you across.','The river Vaitaraṇī'],
  ['karma','Karma','Every action leaves a trace, and the trace becomes your next life.','The court of Yama'],
  ['moksha','Release','Heaven ends too. The goal is to get off the wheel.','Release'] ];
const IC=(d)=>`<path d="${d}" fill="none" stroke="#FBF4E6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
const DETOURS=[
  ['x_wealth','Taking the gold',IC('M10 26 h20 M12 22 h16 M14 18 h12')],
  ['x_deer','Thinking of the deer',IC('M14 14 l-4 -6 M26 14 l4 -6 M14 14 q6 4 12 0 v8 q-6 6 -12 0z')],
  ['x_grief','Endless weeping',IC('M14 12 q2 6 0 8 M24 14 q2 6 0 8 M19 24 q2 6 0 8')],
  ['x_river','Letting go in the river',IC('M8 18 q6 -4 12 0 t12 0 M8 26 q6 -4 12 0 t12 0')],
  ['x_heaven','Staying in heaven',IC('M20 8 a12 12 0 1 0 .1 0 M20 14 v12 M15 21 l5 5 l5 -5')] ];
updatePathBadge();
go(0);

</script>
