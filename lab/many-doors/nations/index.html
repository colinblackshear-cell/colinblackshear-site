<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>window.MD_HOME='../index.html#doors'</script>
<title>Many Nations, Many Roads</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Jost:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one full-screen "flight" — a thin instrument bar on top, the scene card in the middle, the narrator's caption card below it. Single deliberate look: the safety-card palette. */
:root{
  color-scheme: light;
  --cream:#F6EBD2; --parchment:#FBF3DF; --ink:#1E2A2B; --ink-soft:#44524F;
  --teal:#1F5E63; --teal-deep:#123D40; --brown:#8A4B22; --lamp:#F2B640;
  --red:#B8352A; --ok:#2F6B2B;
  --scene-bg: var(--cream);
  --display:'Jost', 'Futura', 'Century Gothic', sans-serif;
  --body:'Atkinson Hyperlegible', 'Verdana', sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;background:var(--scene-bg);transition:background-color 2.2s ease}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--ink);background:var(--parchment);transition:opacity 1.5s,filter 1.5s}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:.8rem;text-transform:uppercase}
#stageLabel{font-family:var(--display);font-weight:500;font-size:.85rem;color:var(--ink-soft);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stageLabel b{color:var(--brown);font-weight:700;margin-right:8px;font-variant-numeric:tabular-nums}
.tog{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:36px}
.tog[aria-pressed="false"]{background:transparent;color:var(--ink-soft);border-style:dashed}
.pick{font-family:var(--body);font-size:.8rem;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:8px;padding:6px 8px;min-height:36px;max-width:190px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pick:focus-visible,.tog:focus-visible,.btn:focus-visible,.spot:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
#stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:18px;padding-block:18px;padding-inline:16px;cursor:pointer;user-select:none}
#visual{width:100%;display:flex;justify-content:center;flex:none}
.frame{position:relative;width:min(100%, calc((100dvh - 380px) * 1.5), 980px);min-width:min(100%,300px);aspect-ratio:3/2;max-width:100%;border-radius:18px;overflow:hidden;transition:filter 3s ease, transform 3s ease}
.frame>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:filter 3s ease}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.caption{flex:none;max-width:720px;width:100%;box-sizing:border-box;background:var(--parchment);border:2px solid var(--ink);border-radius:6px;padding:16px 20px;min-height:4.6em;transition:opacity .8s, filter 1.5s, transform 1.5s, border-color 1.5s}
.caption p{margin:0;font-size:clamp(1.02rem, 2.3vw, 1.3rem);line-height:1.45;text-wrap:pretty}
.caption.quiet{background:transparent;border-color:transparent;text-align:center}
.caption.dark{background:#141413;color:var(--parchment);border-color:#141413}
.caption[hidden]{display:none!important}
#hint{margin:0;font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);opacity:0;transition:opacity .6s;min-height:1em}
#hint.on{opacity:.8;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
#choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.04em;border:2px solid var(--ink);background:var(--teal);color:var(--parchment);border-radius:999px;padding:12px 22px;cursor:pointer;min-height:48px}
.btn.alt{background:var(--parchment);color:var(--ink)}

/* dissolution: the manual's chrome comes apart; the narration always stays sharp */
body.d1 .bar{opacity:.85}
body.d2 .bar{filter:blur(.6px);opacity:.6}
body.d2 .frame{border-radius:28px}
body.d3 .bar{filter:blur(1.5px);opacity:.3}
body.d3 .frame{border-radius:40px}
body.void .bar,body.void #hint{opacity:0!important}

/* title */
.title-card{width:min(100%,640px);background:var(--teal);color:var(--parchment);border:2px solid var(--ink);border-radius:18px;padding:36px 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;align-items:flex-start;cursor:default}
.title-card .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:.75rem;color:var(--lamp);text-transform:uppercase}
.title-card h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1;text-wrap:balance;text-transform:uppercase;letter-spacing:.02em}
.title-card p{margin:0;font-size:1.05rem;line-height:1.5;max-width:46ch}
.title-card ol{margin:4px 0 8px;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;font-size:.98rem}
.title-card .btn{background:var(--lamp);color:var(--ink)}

/* hotspots */
.spot{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:3px solid #FFF3D6;background:rgba(242,182,64,.35);cursor:pointer;padding:0}
.spot::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid #FFF3D6;animation:ping 1.8s ease-out infinite}
.spot.done{opacity:0;pointer-events:none;transition:opacity .6s}
@keyframes ping{from{transform:scale(.7);opacity:.9}to{transform:scale(1.4);opacity:0}}
.heartglow{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(var(--s,0.4));background:radial-gradient(circle,#FFFBEA 0%,rgba(255,221,120,.85) 35%,rgba(255,200,80,0) 70%);transition:transform 1.2s ease;pointer-events:none}

/* breath ring */
.breath{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.6);border-radius:50%;border:4px solid var(--parchment);box-shadow:0 0 0 12px rgba(251,243,223,.15);transition:transform 1s ease-in-out, opacity 1s}

/* svg scenes */
.svgscene{position:absolute;inset:0;width:100%;height:100%}
.flicker{transform-origin:300px 262px;animation:flick 1.3s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1) skewX(0)}30%{transform:scaleY(.9) skewX(3deg)}60%{transform:scaleY(1.06) skewX(-2deg)}}
.orb-down{animation:down 7s ease-in-out forwards}
.orb-up{animation:up 7s ease-in-out forwards}
@keyframes down{to{transform:translateY(91px)}}
@keyframes up{to{transform:translateY(-55px)}}
.dots{stroke-dasharray:2 7;stroke-linecap:round}

/* guide entry */
.guide{position:absolute;inset:0;background:var(--parchment);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;gap:4%;padding:5%;box-sizing:border-box}
.guide .tag,.doorsteps .tag{display:inline-block;font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:clamp(.55rem,1.4vw,.75rem);background:var(--teal);color:var(--parchment);padding:5px 10px;border-radius:4px;text-transform:uppercase}
.guide h2{margin:10px 0 8px;font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,3.4vw,2.2rem);line-height:1.05;text-transform:uppercase;color:var(--brown);text-wrap:balance}
.guide p{margin:0;font-size:clamp(.85rem,1.8vw,1.15rem);line-height:1.45}
.guide .fig{height:100%;display:flex;align-items:center;justify-content:center;background:var(--teal);border-radius:12px;min-height:0}
.frame.guideframe{aspect-ratio:auto;width:min(100%,860px)}
.frame.guideframe .guide{position:relative;inset:auto;padding:24px;gap:24px}
.guide .fig{align-self:stretch;min-height:200px;padding:12px}
.guide .fig svg{height:220px;width:auto}
.guide .gtext{box-sizing:border-box}
.guide .gtext:focus-visible{outline:3px solid var(--lamp)}
@media (max-width:760px){
  .frame.guideframe .guide{grid-template-columns:1fr;gap:16px;padding:18px}
  .guide .fig{min-height:0}
  .guide .fig svg{height:150px}
  .guide h2{font-size:1.5rem}
  .guide p{font-size:1.02rem}
}

/* clear light */
.crack{stroke-dasharray:900;stroke-dashoffset:900;animation:crack 1.2s ease-out forwards}
@keyframes crack{to{stroke-dashoffset:0}}
.bubble{opacity:0;transform:scale(.6);transform-origin:80% 80%;transition:opacity .8s, transform .8s}
.bubble.on{opacity:1;transform:scale(1)}
.ring{position:absolute;left:49.8%;top:43%;width:8%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(242,182,64,.55);transform:translate(-50%,-50%);animation:ring 4.5s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(9);opacity:0}}


/* chapters 4-5 */
.rise{animation:rise 4.5s ease-out forwards}
@keyframes rise{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
.walk{animation:walk 9s ease-in forwards}
@keyframes walk{to{transform:translateY(-22px);opacity:.25}}
.steam path{animation:steam 2.4s ease-in-out infinite}
.steam path+path{animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
.balloon{opacity:0}
.balloon.on{animation:shout 4s ease-out forwards}
@keyframes shout{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.mug{opacity:0}
.mug.on{opacity:1;animation:shake .35s linear 2}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.drawer{transition:transform 1s ease}
.drawer.open{transform:translateX(60px)}
.page{transform-box:fill-box;transform-origin:center;animation:fly 1.6s ease-in forwards}
.page.f2{animation-delay:.35s}.page.f3{animation-delay:.7s}
@keyframes fly{to{transform:translate(160px,-190px) rotate(30deg);opacity:0}}
.glass.flash{animation:flash .9s ease}
@keyframes flash{40%{fill:#FFFFFF}}
.popped{transform-box:fill-box;transform-origin:center;animation:pop 1.2s ease 1s forwards}
@keyframes pop{to{transform:scale(1.5);opacity:0}}
.drops{opacity:0;animation:drops 1s ease 2s forwards}
@keyframes drops{to{opacity:1}}
.drawerbtn{position:absolute;background:transparent;border:2px dashed rgba(251,243,223,.75);border-radius:6px;cursor:pointer;padding:0}
.drawerbtn:hover{background:rgba(242,182,64,.2)}
.drawerbtn:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.run{background:var(--red);font-size:1.2rem;letter-spacing:.24em;text-transform:uppercase;padding:14px 34px;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.checks{position:absolute;inset:0;background:var(--parchment);padding:5%;box-sizing:border-box;display:flex;flex-direction:column;gap:4%}
.ck-head span{display:block;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(.95rem,3.4vw,2rem);color:var(--brown);letter-spacing:.03em}
.ck-head small{display:block;font-size:clamp(.7rem,1.6vw,1rem);color:var(--ink-soft);margin-top:4px}
.ck-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;flex:1}
.ck{display:flex;align-items:center;gap:6%;padding:4%;border:2px solid var(--ink);border-radius:12px;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:clamp(.7rem,1.9vw,1.15rem);line-height:1.25;text-align:left;cursor:pointer;min-width:0}
.ck:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.box{flex:none;width:clamp(18px,3vw,32px);aspect-ratio:1;border:3px solid var(--ink);border-radius:6px;position:relative;background:#FFFFFF}
.ck[aria-pressed="true"] .box{background:var(--ok)}
.ck[aria-pressed="true"] .box::after{content:"";position:absolute;left:30%;top:6%;width:28%;height:58%;border:solid #FFFFFF;border-width:0 4px 4px 0;transform:rotate(45deg)}


/* epilogue */
.duo{position:absolute;inset:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.half{position:relative;border:0;padding:0;margin:0;cursor:pointer;background:none;overflow:hidden;transition:filter .4s}
.half svg{width:100%;height:100%;display:block}
.half span{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(.68rem,1.6vw,.95rem);background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;white-space:nowrap}
.duo:hover .half:not(:hover){filter:brightness(.55)}
.half:focus-visible{outline:4px solid var(--lamp);outline-offset:-4px}
.rules{position:relative;background:var(--parchment);padding:24px;display:flex;flex-direction:column;gap:18px}
.rule-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rule{display:flex;flex-direction:column;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:12px;background:var(--cream);min-width:0}
.rule svg{width:100%;height:auto;border-radius:8px;background:#E9DDBF}
.rule b{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--teal)}
.rule p{margin:0;font-size:clamp(.9rem,1.6vw,1.05rem);line-height:1.35}
.spin{transform-origin:300px 170px;animation:spinr 40s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.bluerise{animation:brise 3s ease-out forwards}
@keyframes brise{to{opacity:.85;transform:translateY(-40px)}}

/* volume 2 */
.approach{transform-origin:300px 205px;animation:approach 9s ease-in forwards}
@keyframes approach{from{transform:scale(.8)}to{transform:scale(1.14)}}
.pulse{transform-origin:300px 205px;animation:pulseg 1.24s ease-in-out infinite}
@keyframes pulseg{50%{opacity:.12;transform:scale(.92)}}
.morph .pulse{animation:none;opacity:0;transition:opacity 1s}
.wrath{transform-origin:300px 205px;transition:transform 1.6s ease, opacity 1.4s ease}
.fl{transform-origin:300px 205px;animation:flick2 .45s ease-in-out infinite alternate}
@keyframes flick2{to{transform:scale(1.04) rotate(1.5deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.peace{opacity:0;transform-origin:300px 205px;transform:scale(.3);transition:opacity 1.6s ease .5s, transform 1.6s ease .5s}
.morph .wrath{transform:scale(.12) rotate(90deg);opacity:0}
.morph .peace{opacity:1;transform:scale(1)}
.frame.facing{transition:none;animation:shake2 .12s linear infinite}
@keyframes shake2{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.holdbtn{position:absolute;inset:0;background:transparent;border:0;padding:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.holdpill{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:8px 16px 8px 8px;font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:clamp(.72rem,1.7vw,.95rem);white-space:nowrap}
.holdpill svg{width:30px;height:30px}
.holdbtn:focus-visible .holdpill{outline:3px solid var(--lamp);outline-offset:3px}
.zone{position:absolute;background:transparent;border:2px dashed rgba(255,255,255,.55);border-radius:50%;cursor:pointer;padding:0}
.zone:focus-visible{outline:3px solid var(--lamp)}
.closing{transform-origin:300px 205px;animation:closing 10s ease-in forwards}
@keyframes closing{from{transform:scale(1.35)}to{transform:scale(.82)}}
.orbit{transform-origin:300px 210px;animation:spinr 18s linear infinite}


/* chapters menu */
#app{position:relative}
.chap{position:absolute;right:16px;top:calc(100% + 0px);z-index:20;width:min(340px,calc(100% - 32px));max-height:min(70vh,560px);overflow-y:auto;background:var(--parchment);border:2px solid var(--ink);border-radius:14px;box-shadow:0 12px 30px rgba(20,20,19,.25);padding:14px;box-sizing:border-box}
.chapwrap{position:relative;z-index:20}
.chap h3{margin:10px 6px 6px;font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brown)}
.chap h3:first-child{margin-top:2px}
.chap ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.chap button{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;background:transparent;border:0;border-radius:8px;padding:10px 8px;font-family:var(--body);font-size:1rem;color:var(--ink);cursor:pointer;min-height:44px}
.chap button:hover,.chap button:focus-visible{background:var(--cream);outline:none}
.chap button[aria-current="true"]{background:var(--cream);font-weight:700}
.chap button small{font-family:var(--display);font-weight:700;font-size:.7rem;letter-spacing:.1em;color:var(--ink-soft);min-width:2.4em;font-variant-numeric:tabular-nums}


/* volume 3 */
.streaks{animation:streak 1.1s linear infinite}
@keyframes streak{from{transform:translateX(-140px)}to{transform:translateX(140px)}}
.blown{animation:blown 2.6s ease-in-out infinite}
@keyframes blown{50%{transform:translate(40px,-8px)}}
.elgrid{position:absolute;inset:0;background:#1B2224;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;padding:6%;box-sizing:border-box}
.el{background:#2A3335;border-radius:14px;display:flex;align-items:center;justify-content:center;opacity:.22;transition:opacity .4s, transform .4s;min-height:0}
.el svg{width:62%;height:auto;max-height:90%}
.el.on{opacity:1;transform:scale(1.04)}
.peb{opacity:0}
.pebs.on .peb{animation:drop .5s ease-in forwards}
@keyframes drop{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:none}}
.mref{opacity:0;transition:opacity 1.2s}
.mref.on{opacity:1}
.approach2{transform-origin:230px 200px;animation:approach 9s ease-in forwards}
.leaf{transform-origin:20px 115px;transform:scaleX(.12);transition:transform .15s}
.doorwrap{position:relative;background:var(--parchment);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:24px;padding:24px;align-items:center}
.doorsteps ol{margin:12px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-size:clamp(.95rem,1.8vw,1.1rem);line-height:1.35}
.doorpic svg{width:100%;height:auto;max-height:260px;display:block}
.doorgrid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px;background:#10181B}
.doorcard{display:flex;flex-direction:column;gap:8px;background:var(--parchment);border:2px solid var(--ink);border-radius:12px;padding:8px;cursor:pointer;font-family:var(--body);font-size:clamp(.82rem,1.6vw,1rem);line-height:1.25;color:var(--ink);text-align:left;min-width:0}
.doorcard svg{width:100%;height:auto;border-radius:8px;display:block}
.doorcard:hover{transform:translateY(-2px)}
.doorcard.nope{opacity:.4;filter:grayscale(1)}
.doorcard:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}

/* pilot: shared production layer */
#visual{position:relative}
.leaving{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;pointer-events:none;z-index:4;animation:leave .7s ease forwards}
@keyframes leave{to{opacity:0;transform:scale(.985)}}
.entering{animation:enter .8s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{clip-path:inset(0 0 0 100% round 18px)}to{clip-path:inset(0 0 0 0 round 18px)}}
.amb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.kb{animation:kb 24s ease-out forwards;transform-origin:62% 48%}
@keyframes kb{to{transform:scale(1.09)}}
.glowspot{position:absolute;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.55) 0%,rgba(255,190,90,.18) 40%,rgba(255,190,90,0) 70%);mix-blend-mode:screen;pointer-events:none;animation:candle 2.3s steps(9,end) infinite;transition:opacity 1.2s ease}
@keyframes candle{0%{opacity:.85;transform:translate(-50%,-50%) scale(1)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}35%{opacity:.75}55%{opacity:.95;transform:translate(-50%,-50%) scale(.97)}75%{opacity:.8}100%{opacity:.9;transform:translate(-50%,-50%) scale(1.02)}}
.callout{position:absolute;z-index:3;transform:translate(-50%,-50%) scale(0);background:var(--parchment);border:2px solid var(--ink);border-radius:8px;padding:5px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards;box-shadow:0 3px 0 var(--ink);pointer-events:none;white-space:nowrap}

/* Many Nations, Many Roads, the full book. Seven Native nations of North America, and what each has chosen to share publicly about
   death: the Lakota, the Diné, the Haudenosaunee, the Anishinaabe and the Lingít. You come as a guest. Nothing here reenacts a
   ceremony, and some things are left untold on purpose, because those nations keep them for themselves.
   A first draft: each door should be read by people of that nation. */
const BOOK={home:'lak_road', toast:'Learned: ', pathLabel:'Path', pathTitle:'What you have learned', detourTitle:'Wrong turns you walked',
  pathNote:'Every wrong turn rewinds. Most of them are the mistakes guests make.',
  guideBack:'Back to the book', voiceSample:'You come as a guest.'};

/* ---------- pictures ---------- */
const PG=(inner,lab,o)=>frame(sv(na(inner,o),lab));
const NIGHTBG='#0E1020', PAPERBG='#D8CCB4';
const SHADOWP={col:'#3A3640',legs:'#3A3640',skin:'#3A3640',hair:'long'};

/* ---------- sound ---------- */
Object.assign(MOODS,{ drone:()=>drone(),
  night:()=>pad('night',[98,146.83,196],.03), warm:()=>pad('warm',[110,164.81,220],.035), light:()=>pad('light',[130.81,196,261.63],.035),
  wind:()=>startLoop('wind',g=>{ const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=500; f.Q.value=.7; s.connect(f).connect(g); s.start(); return [s]; },.035),
  water:()=>startLoop('water',g=>{ const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=800; s.connect(f).connect(g); s.start(); return [s]; },.045) });
function tapCount(n,lab,onTap){ let k=0; choices.innerHTML=`<button class="btn" type="button" id="tc">${lab} · 0 of ${n}</button>`; const b=$('#tc'); b.focus({preventScroll:true});
  b.onclick=e=>{ e.stopPropagation(); initAudio(); k++; onTap&&onTap(k); b.textContent=`${lab} · ${k} of ${n}`; if(k>=n){ b.disabled=true; setTimeout(()=>{ choices.innerHTML=''; next(); },700); } }; }
const DOORS=[['Lakota','v_lak'],['Diné','v_din'],['Haudenosaunee','v_hau'],['Anishinaabe','v_oji'],['Lingít','v_tli'],['Cherokee','v_che'],['Niitsitapi','v_bla']];

{ key:'guest', label:'As a guest', bg:PAPERBG, learn:'many',
  view:()=>PG(`${hills(300,'#8A8A5A')}${land(330)}${pn(220,330,.9,{col:'#5A6A8A',hair:'braid'})}${pn(300,330,.95,{col:CLAY,hair:'grey'})}${pn(380,330,.85,{col:SAGE,hair:'short'})}`,'Three people of different ages stand together on open land, in everyday clothes.',{bg:'dusk'}),
  enter(){ mood('warm','wind'); },
  guide:{title:'Why so much was hidden',text:"For a long time, many Native ceremonies were against the law. In the United States, the Code of Indian Offenses of 1883 banned many religious practices, and full legal protection came only with the American Indian Religious Freedom Act of 1978. In Canada, the potlatch and other ceremonies were banned from 1884 to 1951. Children were taken to boarding and residential schools, where their languages and beliefs were punished. Much survived because families kept it quietly, and they have good reason to decide carefully what to share."},
  beats:[
    {text:"Native nations aren't one people with one belief. They're many nations, each with its own language and its own ways of honouring the dead."},

{ key:'v_oji', label:'Anishinaabe', bg:'var(--teal)',
  view:()=>card('Door 4 · Anishinaabe','The Path of Souls',"The Anishinaabe, including the Ojibwe, Odawa and Potawatomi, live around the Great Lakes, on both sides of the border between the US and Canada."),
  enter(){ mood('water'); }, beats:[{text:null}] },

{ key:'oji_west', label:'The path of souls', bg:'#3A4A6A', learn:'west',
  view:()=>PG(`${lake(250)}${land(306,'#6A7A4A')}${birchN(80,306,1)}${birchN(140,306,.8)}${pine(520,306,1.1)}<g id="fd">${fireN(320,334,1.1)}</g>${pn(420,350,.8,{col:'#4A5A4A',hair:'braid'})}`,'A fire burns by a lake at dusk, among birches and pines. Someone watches over it.',{bg:'dusk'}),
  enter(){ mood('water','warm'); },
  guide:{title:'What has been shared',text:"Ojibwe writers such as Basil Johnston (Ojibway Heritage, 1976) and many elders have described the spirit's four-day journey west along the path of souls to the land of the spirits, the fire kept burning by the family for those four days, and food set out for the journey. Teachings vary between communities. Many Anishinaabe families today also hold a ghost supper, jiibay-wiikonge, each autumn."},
  beats:[
    {text:"In many Anishinaabe teachings, when someone dies, the spirit travels west for four days on the path of souls, to the land of the spirits."},
    {text:"For those four days, the family keeps a fire burning to light the way, and sets out food for the journey. Watch the fire.", lock:true, show(){ holdOn({label:'Watch the fire',ms:5000,wait:600,onDone:()=>bell(330,.06,4)}); }} ]},

{ key:'oji_supper', label:'The ghost supper', bg:PAPERBG,
  view:()=>PG(`${land(330,'#9A8A6A')}<rect x="40" y="70" width="520" height="260" fill="#E6DAC2" stroke="${K}" stroke-width="2"/>${table(300,330,300)}${plate(220,288)}${plate(300,288)}${plate(380,288)}${pn(110,330,.85,{col:'#4A5A4A',hair:'braid',arms:'out'})}${pn(500,330,.85,{col:'#6A4A3A',hair:'grey'})}`,'A long table with plates of food. A woman waves you in.'),
  enter(){ mood('warm'); },
  beats:[
    {text:"Every autumn, many Anishinaabe families hold a ghost supper. They cook the favourite foods of their relatives who have died, set a plate out for the spirits, and open the door. Anyone who comes is fed. Your friend's family invites you.", lock:true, afterType(){ pick([{label:'Take photos to post online',go:'x_oji'},{label:'Ask first, then sit and eat'}]); }} ]},

{ key:'oji_eat', label:'The ghost supper', bg:PAPERBG, learn:'supper',
  view:()=>PG(`${land(330,'#9A8A6A')}<rect x="40" y="70" width="520" height="260" fill="#E6DAC2" stroke="${K}" stroke-width="2"/>${table(300,330,300)}${plate(220,288)}${plate(300,288)}${plate(380,288)}${pn(190,330,.8,{col:'#3A5A7A',hair:'short'})}${pn(410,330,.85,{col:'#4A5A4A',hair:'braid'})}`,'You sit at the table with the family.'),
  enter(){ mood('warm','light'); },
  beats:[
    {text:"Tap the table.", lock:true, show(){ tapAll([
      [37,72,'A plate for the spirits',"A plate set out for the relatives who have died, with their favourite foods."],
      [50,72,'Your plate',"Your plate. Eating is how you honour the invitation."],
      [63,72,'Stories',"Stories about the people being remembered, told over the meal."] ]); }},
    {text:"The dead are fed, and so are the living. Remembering the dead is a reason to gather, and to share."} ]},

/* ===== Lingít ===== */
{ key:'v_tli', label:'Lingít', bg:'var(--teal)',
  view:()=>card('Door 5 · Lingít','The Memorial',"The Lingít, also written Tlingit, live along the coast and islands of southeast Alaska and nearby Canada. Every person belongs to one of two halves, Raven or Eagle, and to a clan."),
  enter(){ mood('water'); }, beats:[{text:null}] },

{ key:'tli_koo', label:'The memorial', bg:'#5A6A6A', learn:'koo',
  view:()=>PG(`${sea(300)}${land(300,'#6A6A50')}${sea(352)}${pine(60,300,1.3)}${pine(120,300,1)}${pine(560,300,1.2)}${plankhouse(320,300,1)}${pn(200,320,.75,{col:'#2A2A3A',hair:'long'})}${pn(450,320,.75,{col:'#5A2A2A',hair:'short',arms:'up'})}`,'A large wooden clan house on a forested shore. People gather outside it.',{bg:'#8AA0A8'}),
  enter(){ mood('water','warm'); },
  guide:{title:'Koo.éex\'',text:"The koo.éex', often called a memorial potlatch or 40-day or one-year party, is hosted by the clan of the person who died, often a year or more after the death. Guests from the opposite half, who cared for the body and comforted the family at the funeral, are thanked and repaid. The clan's at.óow, its sacred owned objects such as crest hats and robes, are brought out, and oratory and songs remove the grief. Nora Marks Dauenhauer and Richard Dauenhauer published such speeches, with the permission of the speakers' families, in Haa Tuwunáagu Yís, for Healing Our Spirit (1990)."},
  beats:[
    {text:"When a Lingít person dies, the other half of the community, the opposite moiety, comes to care for the family and the body. A year or more later, the dead person's clan hosts a great memorial, the koo.éex'. Tap what happens.", lock:true, show(){ tapAll([
      [75,67,'Speeches',"Elders give speeches that name the ancestors and lift the grief from the mourners."],
      [53,50,'The clan house',"The clan brings out its at.óow, sacred clan treasures like crest hats and robes, which hold its history."],
      [33,67,'Gifts',"The guests from the opposite half are thanked and repaid for the care they gave."] ]); }},
    {text:"Debts of care are paid, the grief is lifted, and the clan's history is spoken out loud. The dead are honoured by their whole people."} ]},

{ key:'tli_crest', label:'At.óow', bg:PAPERBG,
  view:()=>PG(`${land(330,'#8A8A7A')}<rect x="200" y="90" width="200" height="180" fill="#F4F0E8" stroke="${K}" stroke-width="2.4"/><circle cx="300" cy="170" r="50" fill="none" stroke="#2A2A2A" stroke-width="10"/><path d="M270 170 Q300 140 330 170 Q300 200 270 170Z" fill="#A43A2A"/>${pn(470,330,.85,{col:'#3A5A7A',hair:'short'})}`,'A shop window shows a print with a bold design. You look at it.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"After the memorial, you see a shop selling prints of a crest design like one you saw on a clan robe. They're made by someone who isn't Lingít. It's beautiful, and you'd like it as a tattoo.", lock:true, afterType(){ pick([{label:'Get the tattoo',go:'x_tli'},{label:'Leave it, and ask about its story'}]); }} ]},

{ key:'tli_story', label:'At.óow', bg:'#5A6A6A', learn:'crest',
  view:()=>PG(`${sea(300)}${land(300,'#6A6A50')}${sea(352)}${pine(60,300,1.3)}${plankhouse(320,300,1)}${pn(240,320,.75,{col:'#3A5A7A',hair:'short'})}${pn(400,320,.75,{col:'#2A2A3A',hair:'grey',arms:'out'})}`,'An elder talks with you outside the clan house.',{bg:'#8AA0A8'}),
  enter(){ mood('water','light'); },
  beats:[
    {text:"A crest isn't a pattern. It's at.óow, owned by a clan: its history and its title, sometimes paid for by ancestors with their lives. Only that clan has the right to show it."},
    {text:"Some Lingít also say that the dead can be born again into their own clan, coming home as a grandchild. The clan goes on, and so do its people."} ]},

/* ===== Cherokee ===== */
{ key:'v_che', label:'Cherokee', bg:'var(--teal)',
  view:()=>card('Door 6 · Cherokee','The Darkening Land',"The Cherokee, Tsalagi, come from the southern Appalachians. Today there are three federally recognized Cherokee tribes: the Cherokee Nation, the Eastern Band of Cherokee Indians, and the United Keetoowah Band."),
  enter(){ mood('warm','wind'); }, beats:[{text:null}] },

{ key:'che_west', label:'The Daughter of the Sun', bg:'#3A3A5A', learn:'redbird',
  view:()=>PG(`${hills(300,'#3A4A3A')}${land(330,'#4A5A3A')}${pine(70,330,1)}${pine(540,330,1.1)}<g id="bx">${box(300,330,1)}</g>${[200,240,360,400].map((x,i)=>pn(x,330,.65,{col:['#4A5A7A','#6A4A3A','#5A6A4A','#7A5A4A'][i],hair:i%2?'long':'short'})).join('')}<g id="rb"></g>`,'At dusk in the mountains, people carry a wooden box between them.',{bg:'dusk'}),
  enter(){ mood('night','wind'); },
  guide:{title:'Myths of the Cherokee',text:"The ethnologist James Mooney recorded this story, and many others, from Cherokee storytellers such as Swimmer (Ayunini) in North Carolina in the 1880s and 1890s, published as Myths of the Cherokee (1900). In it, the spirits of the dead go west to Tsusginaiʼi, the Ghost Country, in the Darkening Land, Usunhiyi. Cherokee people tell their own stories today, in their own words and language."},
  beats:[
    {text:"In a Cherokee story recorded in the 1890s, the Sun's daughter died. Seven men went west to the Darkening Land, where the dead live, to bring her back. They caught her spirit, shut it in a box, and set off home. They were told: don't open the box, whatever happens."},
    {text:"On the road, she begged to be let out. She was hungry, she was smothering. Just before they reached home, they opened the lid a crack.", lock:true, show(){ holdOn({label:'Open it a crack',ms:3000,wait:600,onDone:()=>{ const b=$('#bx'); if(b) b.innerHTML=box(300,330,1,{open:true}); const r=$('#rb'); if(r) r.innerHTML=`<g class="drift">${redbird(330,200,1.6)}</g>`; bell(880,.05,3); }}); }},
    {text:"Something flew past them into the bushes: a redbird. When they reached home, the box was empty. Because they opened it, the story says, we can never bring back the dead."} ]},

{ key:'che_claim', label:'A Cherokee grandmother', bg:PAPERBG,
  view:()=>PG(`${land(330,'#9A8A6A')}<rect x="60" y="80" width="480" height="250" fill="#E0D4BC" stroke="${K}" stroke-width="2"/>${pn(220,330,.9,{col:'#7A6A5A',hair:'short',arms:'out'})}${pn(380,330,.9,{col:'#3A4A6A',hair:'long',arms:'fold'})}`,'At a party, someone talks eagerly to a Cherokee woman.'),
  enter(){ mood('warm'); },
  beats:[
    {text:"At a party you meet a Cherokee Nation citizen. You've heard all your life that your great-grandmother was a Cherokee princess.", lock:true, afterType(){ pick([{label:'Tell her you are Cherokee too',go:'x_che'},{label:'Ask her about her nation instead'}]); }} ]},

{ key:'che_nation', label:'A Cherokee grandmother', bg:PAPERBG, learn:'citizen',
  view:()=>PG(`${land(330,'#9A8A6A')}<rect x="60" y="80" width="480" height="250" fill="#E0D4BC" stroke="${K}" stroke-width="2"/>${pn(220,330,.9,{col:'#7A6A5A',hair:'short',arms:'fold'})}${pn(380,330,.9,{col:'#3A4A6A',hair:'long',arms:'out'})}`,'The Cherokee woman talks while you listen.'),
  enter(){ mood('warm','light'); },
  beats:[
    {text:"She tells you about her family's land in Oklahoma, where they were forced to move on the Trail of Tears in 1838 and 1839, and about learning to read the Cherokee syllabary."},
    {text:"Being Cherokee isn't a family legend. It's belonging to a nation, with its own government, citizens and laws, and its own ways of mourning and remembering."} ]},

/* ===== Niitsitapi ===== */
{ key:'v_bla', label:'Niitsitapi', bg:'var(--teal)',
  view:()=>card('Door 7 · Niitsitapi','The Sand Hills',"The Niitsitapi, the Blackfoot Confederacy, are the Siksika, Kainai and Piikani nations of Alberta and the Blackfeet Nation of Montana."),
  enter(){ mood('wind'); }, beats:[{text:null}] },

{ key:'bla_sand', label:'The Sand Hills', bg:'#8A9AB0', learn:'sandhills',
  view:()=>PG(`${rockies(250)}${dunes(300)}${buffalo(170,330,1,{shadow:true})}${buffalo(420,330,.9,{shadow:true})}<g opacity=".5">${pn(300,320,.75,{col:'#7A7488',legs:'#7A7488',hair:'braid'})}</g>`,'Pale sand hills under the mountains. Faint, shadowy buffalo and a shadowy figure.',{bg:'#AAB8C8'}),
  enter(){ mood('wind','light'); },
  guide:{title:'Blackfoot Lodge Tales',text:"George Bird Grinnell recorded Blackfoot accounts of the Sand Hills in Blackfoot Lodge Tales (1892): the shadows of the dead live there, in a grey country, and hunt the shadows of buffalo. Many Niitsitapi elders and writers have since spoken for themselves, and the nations run their own cultural programmes. Sacred bundles, held by keepers and opened only in ceremony, were taken into museums in the 1900s, and many have since been returned."},
  beats:[
    {text:"In old Blackfoot accounts, the dead go to the Sand Hills, a pale country on the plains. There they live as shadows: they camp, they visit, and they hunt the shadows of buffalo."},
    {text:"It isn't a reward or a punishment. It's the people's life, carried on in a quieter, greyer place."} ]},

{ key:'bla_museum', label:'The bundle', bg:'#5A5A60',
  view:()=>PG(`<rect width="600" height="400" fill="#D8D4CC"/>${land(330,'#8A8680')}${vitrine(300,330,1.2)}${pn(470,330,.85,{col:'#3A5A7A',hair:'short'})}`,'A museum display case with a wrapped bundle inside. A visitor looks at it.',{bg:'#D8D4CC'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"In a museum you find a sacred bundle in a glass case, labelled Blackfoot. You're curious what's inside.", lock:true, afterType(){ pick([{label:'Ask the museum to open it for you',go:'x_bla'},{label:'Leave it closed, and read its story'}]); }} ]},

{ key:'bla_home', label:'The bundle', bg:'#8A9AB0', learn:'bundle',
  view:()=>PG(`${rockies(250)}${land(300,'#9AA06A')}${pn(240,320,.85,{col:'#5A3A3A',hair:'grey',arms:'offer'})}<path d="M222 278 Q218 262 236 260 H250 Q266 262 262 278Z" fill="#8A6A44" stroke="${K}" stroke-width="1.8"/>${pn(360,320,.8,{col:'#3A5A6A',hair:'braid'})}`,'Under the mountains, an elder holds a wrapped bundle. A younger person stands beside them.',{bg:'#AAB8C8'}),
  enter(){ mood('light'); },
  beats:[
    {text:"A sacred bundle isn't an exhibit. It's living, and it's cared for by a keeper. It's opened only in ceremony, by the right people. Over the last few decades, many Blackfoot bundles have come home from museums to be used again."} ]},

{ key:'private', label:'Not shared', bg:'#C89A6A', learn:'private',
  view:()=>PG(`${mesaTown(300,330,1.1)}${land(330,'#B8885A')}`,'A village of stone and adobe houses on top of a mesa.',{bg:'dusk'}),
  enter(){ mood('wind'); },
  guide:{title:'Why some nations are not here',text:"The Hopi and many of the Pueblo nations of New Mexico ask that their ceremonies not be photographed, recorded or sketched, and many prefer that outsiders not write about their religion at all. Much that was published about them in the past was taken without consent. This book respects that by leaving them out."},
  beats:[
    {text:"Some nations aren't in this book on purpose. The Hopi and many Pueblo nations ask outsiders not to photograph, record or write about their ceremonies. Much that was published about them in the past was taken without permission."},
    {text:"The most respectful page about them is the one that isn't written."} ]},

{ key:'lastpage', label:'The last page', bg:NIGHTBG,
  view:()=>frame(sv(ncCover(),'The Milky Way over dark hills, and one person looking up.')),
  enter(){ mood('light'); },
  beats:[
    {text:"Seven nations: a spirit road across the sky, four quiet days, words that wipe away tears, a fire and a plate for the dead, a clan that pays its debts of care, a redbird that flew from the box, and shadows hunting on the Sand Hills. And hundreds more nations, each with its own way."},
    {text:"What they share, they share as hosts. A good guest listens, doesn't take what isn't offered, and leaves the rest to them."} ]},

{ key:'end', label:'The end', bg:'var(--teal)',
  view:()=>`<div class="title-card" style="cursor:default"><span class="eyebrow">The end of the book</span><h1>Many Nations, Many Roads</h1>
    <p>That was all seven doors: the Lakota spirit road, Diné quiet, the Haudenosaunee words that wipe tears, the Anishinaabe path of souls and ghost supper, the Lingít memorial, the Cherokee Darkening Land, and the Niitsitapi Sand Hills.</p><p id="endsum" style="font-weight:700"></p>
    <p class="draft">A first draft. Each door should be read by people of that nation: Lakota, Diné, Haudenosaunee, Anishinaabe, Lingít, Cherokee and Niitsitapi readers. Sources include: James R. Walker, Lakota Belief and Ritual (1980); Black Elk and Joseph Epes Brown, The Sacred Pipe (1953); the 1993 Declaration of War Against Exploiters of Lakota Spirituality; Gladys Reichard, Navaho Religion (1950); Haudenosaunee Confederacy accounts of the Great Law of Peace; Basil Johnston, Ojibway Heritage (1976); Nora Marks Dauenhauer and Richard Dauenhauer, Haa Tuwunáagu Yís, for Healing Our Spirit (1990); James Mooney, Myths of the Cherokee (1900); George Bird Grinnell, Blackfoot Lodge Tales (1892).</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="again" type="button">Read it again</button><button class="btn alt" id="pathend" type="button">See your path</button><button class="btn alt" id="chend" type="button">Choose a chapter</button></div>
    <div class="endlinks"><a href="../index.html#doors">Back to Many Doors</a></div></div>`,
  enter(){ mood('warm'); $('#again').onclick=e=>{ e.stopPropagation(); go(0); }; $('#chend').onclick=e=>{ e.stopPropagation(); openChapters(true); }; $('#pathend').onclick=e=>{ e.stopPropagation(); openPath(); };
    $('#endsum').textContent=`You learned ${journey.learned.size} of ${LESSONS.length} lessons and walked ${journey.visited.size} of ${DETOURS.length} wrong turns.`+(journey.learned.size===LESSONS.length?' You know the way.':' Read again to learn the rest.'); },
  beats:[{text:null,lock:true}] },

/* ===== wrong turns ===== */
{ key:'x_lak', label:'A wrong turn', bg:'#4A4440',
  view:()=>PG(`${land(330,'#6A6458')}<rect x="180" y="200" width="240" height="130" rx="60" fill="#5A5048" stroke="${K}" stroke-width="2"/>${pn(470,330,.85,{col:'#8A8A8A',hair:'short'})}${pn(120,330,.85,{col:'#3A5A7A',hair:'short'})}`,'A rented tent in a field. A stranger takes your money.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"You pay. The man running it isn't Lakota, and what he runs isn't a Lakota ceremony. Some of these imitations have even been dangerous, and people have died in them."},
    {text:"Lakota spiritual leaders have asked outsiders, again and again, not to copy or sell their ceremonies. Rewind, and close the page.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_din', label:'A wrong turn', bg:'#8A6A5A',
  view:()=>PG(`${land(300,'#A88A6A')}${pn(220,320,.9,{col:'#3A5A7A',hair:'short',arms:'out'})}${pn(380,320,.9,{col:'#7A4A5A',hair:'grey',arms:'fold'})}`,'The older woman has turned away from you.',{bg:'#C89A7A'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"You ask, and say his name. The room goes quiet. The grandmother looks away, and soon finds something to do in the kitchen."},
    {text:"For many Diné, speaking of the dead, and saying their names, is something to avoid. Rewind, and let it rest.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_hau', label:'A wrong turn', bg:'#4A4440',
  view:()=>PG(`${land(330,'#7A6A5A')}<rect x="60" y="80" width="480" height="250" fill="#8A7E6E" stroke="${K}" stroke-width="2"/>${pn(230,330,.9,{col:'#3A5A7A',hair:'short',arms:'out'})}${pn(380,330,.9,{col:'#6A4A5A',hair:'long',arms:'fold'})}`,'Your friend has stepped back from you.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"Move on? Her eyes fill up. You've told her that her grief is a problem, when what she needed was comfort."},
    {text:"The Haudenosaunee way is the Peacemaker's: wipe the tears, clear the ears, open the throat, and give the grieving person back to their people. Rewind, and listen.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_oji', label:'A wrong turn', bg:'#4A4440',
  view:()=>PG(`${land(330,'#7A6A5A')}<rect x="40" y="70" width="520" height="260" fill="#8A7E6E" stroke="${K}" stroke-width="2"/>${table(300,330,300)}${plate(220,288)}${pn(160,330,.85,{col:'#3A5A7A',hair:'short',arms:'out'})}${phone(196,248,1)}${pn(440,330,.85,{col:'#4A5A4A',hair:'braid',arms:'fold'})}`,'You hold up your phone over the plate for the spirits. Your host folds her arms.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"You start photographing the spirits' plate, the family, the food. Your host asks you to stop. This is a family remembering its dead, not a show."},
    {text:"At gatherings like this, ask before you take any photo, and if there's any doubt, don't. Rewind, and ask first.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_tli', label:'A wrong turn', bg:'#4A4440',
  view:()=>PG(`${land(330,'#6A6458')}${pn(300,330,1,{col:'#3A5A7A',hair:'short'})}<circle cx="318" cy="268" r="9" fill="none" stroke="#2A2A2A" stroke-width="3"/>`,'You stand with a new tattoo on your arm.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"You get the tattoo. To the clan whose crest it is, you're now wearing their history and title, which you have no right to, copied by someone who had no right to sell it."},
    {text:"At.óow belong to a clan. Rewind, and ask about its story instead.", lock:true, afterType(){ rewindButton(); }} ]},
{ key:'x_che', label:'A wrong turn', bg:'#4A4440',
  view:()=>PG(`${land(330,'#7A6A5A')}<rect x="60" y="80" width="480" height="250" fill="#8A7E6E" stroke="${K}" stroke-width="2"/>${pn(220,330,.9,{col:'#7A6A5A',hair:'short',arms:'out'})}${pn(400,330,.9,{col:'#3A4A6A',hair:'long',arms:'fold'})}`,'The Cherokee woman has stepped back, arms folded.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"She's heard it hundreds of times. The Cherokee never had princesses, and family stories like this are so common that Cherokee people call it the Cherokee grandmother myth. Claiming a nation you don't belong to takes something from the people who do."},
    {text:"Rewind, and ask about her nation instead.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_bla', label:'A wrong turn', bg:'#5A5A60',
  view:()=>PG(`<rect width="600" height="400" fill="#8A8680"/>${land(330,'#6A6660')}${vitrine(300,330,1.2)}${pn(470,330,.85,{col:'#3A5A7A',hair:'short',arms:'out'})}`,'The visitor points at the case. A curator shakes their head.',{bg:'#8A8680'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"A good curator says no. A bundle is opened only in ceremony, by those with the right to open it. Opening it for a visitor's curiosity would be like reading someone's private prayers aloud."},
    {text:"Rewind, and leave it closed.", lock:true, afterType(){ rewindButton(); }} ]}
];
