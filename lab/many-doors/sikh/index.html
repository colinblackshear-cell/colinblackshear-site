<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>window.MD_HOME='../index.html#doors'</script>
<title>Light into Light</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Noto+Sans+Gurmukhi:wght@700&family=Jost:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one full-screen "flight" — a thin instrument bar on top, the scene card in the middle, the narrator's caption card below it. Single deliberate look: the safety-card palette. */
:root{
  color-scheme: light;
  --cream:#F6EBD2; --parchment:#FBF3DF; --ink:#1E2A2B; --ink-soft:#44524F;
  --teal:#1F5E63; --teal-deep:#123D40; --brown:#8A4B22; --lamp:#F2B640;
  --red:#B8352A; --ok:#2F6B2B;
  --scene-bg: var(--cream);
  --display:'Jost', 'Futura', 'Century Gothic', sans-serif;
  --body:'Atkinson Hyperlegible', 'Verdana', sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;background:var(--scene-bg);transition:background-color 2.2s ease}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--ink);background:var(--parchment);transition:opacity 1.5s,filter 1.5s}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:.8rem;text-transform:uppercase}
#stageLabel{font-family:var(--display);font-weight:500;font-size:.85rem;color:var(--ink-soft);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stageLabel b{color:var(--brown);font-weight:700;margin-right:8px;font-variant-numeric:tabular-nums}
.tog{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:36px}
.tog[aria-pressed="false"]{background:transparent;color:var(--ink-soft);border-style:dashed}
.pick{font-family:var(--body);font-size:.8rem;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:8px;padding:6px 8px;min-height:36px;max-width:190px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pick:focus-visible,.tog:focus-visible,.btn:focus-visible,.spot:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
#stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:18px;padding-block:18px;padding-inline:16px;cursor:pointer;user-select:none}
#visual{width:100%;display:flex;justify-content:center;flex:none}
.frame{position:relative;width:min(100%, calc((100dvh - 380px) * 1.5), 980px);min-width:min(100%,300px);aspect-ratio:3/2;max-width:100%;border-radius:18px;overflow:hidden;transition:filter 3s ease, transform 3s ease}
.frame>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:filter 3s ease}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.caption{flex:none;max-width:720px;width:100%;box-sizing:border-box;background:var(--parchment);border:2px solid var(--ink);border-radius:6px;padding:16px 20px;min-height:4.6em;transition:opacity .8s, filter 1.5s, transform 1.5s, border-color 1.5s}
.caption p{margin:0;font-size:clamp(1.02rem, 2.3vw, 1.3rem);line-height:1.45;text-wrap:pretty}
.caption.quiet{background:transparent;border-color:transparent;text-align:center}
.caption.dark{background:#141413;color:var(--parchment);border-color:#141413}
.caption[hidden]{display:none!important}
#hint{margin:0;font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);opacity:0;transition:opacity .6s;min-height:1em}
#hint.on{opacity:.8;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
#choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.04em;border:2px solid var(--ink);background:var(--teal);color:var(--parchment);border-radius:999px;padding:12px 22px;cursor:pointer;min-height:48px}
.btn.alt{background:var(--parchment);color:var(--ink)}

/* dissolution: the manual's chrome comes apart; the narration always stays sharp */
body.d1 .bar{opacity:.85}
body.d2 .bar{filter:blur(.6px);opacity:.6}
body.d2 .frame{border-radius:28px}
body.d3 .bar{filter:blur(1.5px);opacity:.3}
body.d3 .frame{border-radius:40px}
body.void .bar,body.void #hint{opacity:0!important}

/* title */
.title-card{width:min(100%,640px);background:var(--teal);color:var(--parchment);border:2px solid var(--ink);border-radius:18px;padding:36px 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;align-items:flex-start;cursor:default}
.title-card .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:.75rem;color:var(--lamp);text-transform:uppercase}
.title-card h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1;text-wrap:balance;text-transform:uppercase;letter-spacing:.02em}
.title-card p{margin:0;font-size:1.05rem;line-height:1.5;max-width:46ch}
.title-card ol{margin:4px 0 8px;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;font-size:.98rem}
.title-card .btn{background:var(--lamp);color:var(--ink)}

/* hotspots */
.spot{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:3px solid #FFF3D6;background:rgba(242,182,64,.35);cursor:pointer;padding:0}
.spot::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid #FFF3D6;animation:ping 1.8s ease-out infinite}
.spot.done{opacity:0;pointer-events:none;transition:opacity .6s}
@keyframes ping{from{transform:scale(.7);opacity:.9}to{transform:scale(1.4);opacity:0}}
.heartglow{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(var(--s,0.4));background:radial-gradient(circle,#FFFBEA 0%,rgba(255,221,120,.85) 35%,rgba(255,200,80,0) 70%);transition:transform 1.2s ease;pointer-events:none}

/* breath ring */
.breath{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.6);border-radius:50%;border:4px solid var(--parchment);box-shadow:0 0 0 12px rgba(251,243,223,.15);transition:transform 1s ease-in-out, opacity 1s}

/* svg scenes */
.svgscene{position:absolute;inset:0;width:100%;height:100%}
.flicker{transform-origin:300px 262px;animation:flick 1.3s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1) skewX(0)}30%{transform:scaleY(.9) skewX(3deg)}60%{transform:scaleY(1.06) skewX(-2deg)}}
.orb-down{animation:down 7s ease-in-out forwards}
.orb-up{animation:up 7s ease-in-out forwards}
@keyframes down{to{transform:translateY(91px)}}
@keyframes up{to{transform:translateY(-55px)}}
.dots{stroke-dasharray:2 7;stroke-linecap:round}

/* guide entry */
.guide{position:absolute;inset:0;background:var(--parchment);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;gap:4%;padding:5%;box-sizing:border-box}
.guide .tag,.doorsteps .tag{display:inline-block;font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:clamp(.55rem,1.4vw,.75rem);background:var(--teal);color:var(--parchment);padding:5px 10px;border-radius:4px;text-transform:uppercase}
.guide h2{margin:10px 0 8px;font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,3.4vw,2.2rem);line-height:1.05;text-transform:uppercase;color:var(--brown);text-wrap:balance}
.guide p{margin:0;font-size:clamp(.85rem,1.8vw,1.15rem);line-height:1.45}
.guide .fig{height:100%;display:flex;align-items:center;justify-content:center;background:var(--teal);border-radius:12px;min-height:0}
.frame.guideframe{aspect-ratio:auto;width:min(100%,860px)}
.frame.guideframe .guide{position:relative;inset:auto;padding:24px;gap:24px}
.guide .fig{align-self:stretch;min-height:200px;padding:12px}
.guide .fig svg{height:220px;width:auto}
.guide .gtext{box-sizing:border-box}
.guide .gtext:focus-visible{outline:3px solid var(--lamp)}
@media (max-width:760px){
  .frame.guideframe .guide{grid-template-columns:1fr;gap:16px;padding:18px}
  .guide .fig{min-height:0}
  .guide .fig svg{height:150px}
  .guide h2{font-size:1.5rem}
  .guide p{font-size:1.02rem}
}

/* clear light */
.crack{stroke-dasharray:900;stroke-dashoffset:900;animation:crack 1.2s ease-out forwards}
@keyframes crack{to{stroke-dashoffset:0}}
.bubble{opacity:0;transform:scale(.6);transform-origin:80% 80%;transition:opacity .8s, transform .8s}
.bubble.on{opacity:1;transform:scale(1)}
.ring{position:absolute;left:49.8%;top:43%;width:8%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(242,182,64,.55);transform:translate(-50%,-50%);animation:ring 4.5s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(9);opacity:0}}


/* chapters 4-5 */
.rise{animation:rise 4.5s ease-out forwards}
@keyframes rise{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
.walk{animation:walk 9s ease-in forwards}
@keyframes walk{to{transform:translateY(-22px);opacity:.25}}
.steam path{animation:steam 2.4s ease-in-out infinite}
.steam path+path{animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
.balloon{opacity:0}
.balloon.on{animation:shout 4s ease-out forwards}
@keyframes shout{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.mug{opacity:0}
.mug.on{opacity:1;animation:shake .35s linear 2}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.drawer{transition:transform 1s ease}
.drawer.open{transform:translateX(60px)}
.page{transform-box:fill-box;transform-origin:center;animation:fly 1.6s ease-in forwards}
.page.f2{animation-delay:.35s}.page.f3{animation-delay:.7s}
@keyframes fly{to{transform:translate(160px,-190px) rotate(30deg);opacity:0}}
.glass.flash{animation:flash .9s ease}
@keyframes flash{40%{fill:#FFFFFF}}
.popped{transform-box:fill-box;transform-origin:center;animation:pop 1.2s ease 1s forwards}
@keyframes pop{to{transform:scale(1.5);opacity:0}}
.drops{opacity:0;animation:drops 1s ease 2s forwards}
@keyframes drops{to{opacity:1}}
.drawerbtn{position:absolute;background:transparent;border:2px dashed rgba(251,243,223,.75);border-radius:6px;cursor:pointer;padding:0}
.drawerbtn:hover{background:rgba(242,182,64,.2)}
.drawerbtn:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.run{background:var(--red);font-size:1.2rem;letter-spacing:.24em;text-transform:uppercase;padding:14px 34px;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.checks{position:absolute;inset:0;background:var(--parchment);padding:5%;box-sizing:border-box;display:flex;flex-direction:column;gap:4%}
.ck-head span{display:block;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(.95rem,3.4vw,2rem);color:var(--brown);letter-spacing:.03em}
.ck-head small{display:block;font-size:clamp(.7rem,1.6vw,1rem);color:var(--ink-soft);margin-top:4px}
.ck-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;flex:1}
.ck{display:flex;align-items:center;gap:6%;padding:4%;border:2px solid var(--ink);border-radius:12px;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:clamp(.7rem,1.9vw,1.15rem);line-height:1.25;text-align:left;cursor:pointer;min-width:0}
.ck:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.box{flex:none;width:clamp(18px,3vw,32px);aspect-ratio:1;border:3px solid var(--ink);border-radius:6px;position:relative;background:#FFFFFF}
.ck[aria-pressed="true"] .box{background:var(--ok)}
.ck[aria-pressed="true"] .box::after{content:"";position:absolute;left:30%;top:6%;width:28%;height:58%;border:solid #FFFFFF;border-width:0 4px 4px 0;transform:rotate(45deg)}


/* epilogue */
.duo{position:absolute;inset:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.half{position:relative;border:0;padding:0;margin:0;cursor:pointer;background:none;overflow:hidden;transition:filter .4s}
.half svg{width:100%;height:100%;display:block}
.half span{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(.68rem,1.6vw,.95rem);background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;white-space:nowrap}
.duo:hover .half:not(:hover){filter:brightness(.55)}
.half:focus-visible{outline:4px solid var(--lamp);outline-offset:-4px}
.rules{position:relative;background:var(--parchment);padding:24px;display:flex;flex-direction:column;gap:18px}
.rule-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rule{display:flex;flex-direction:column;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:12px;background:var(--cream);min-width:0}
.rule svg{width:100%;height:auto;border-radius:8px;background:#E9DDBF}
.rule b{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--teal)}
.rule p{margin:0;font-size:clamp(.9rem,1.6vw,1.05rem);line-height:1.35}
.spin{transform-origin:300px 170px;animation:spinr 40s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.bluerise{animation:brise 3s ease-out forwards}
@keyframes brise{to{opacity:.85;transform:translateY(-40px)}}

/* volume 2 */
.approach{transform-origin:300px 205px;animation:approach 9s ease-in forwards}
@keyframes approach{from{transform:scale(.8)}to{transform:scale(1.14)}}
.pulse{transform-origin:300px 205px;animation:pulseg 1.24s ease-in-out infinite}
@keyframes pulseg{50%{opacity:.12;transform:scale(.92)}}
.morph .pulse{animation:none;opacity:0;transition:opacity 1s}
.wrath{transform-origin:300px 205px;transition:transform 1.6s ease, opacity 1.4s ease}
.fl{transform-origin:300px 205px;animation:flick2 .45s ease-in-out infinite alternate}
@keyframes flick2{to{transform:scale(1.04) rotate(1.5deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.peace{opacity:0;transform-origin:300px 205px;transform:scale(.3);transition:opacity 1.6s ease .5s, transform 1.6s ease .5s}
.morph .wrath{transform:scale(.12) rotate(90deg);opacity:0}
.morph .peace{opacity:1;transform:scale(1)}
.frame.facing{transition:none;animation:shake2 .12s linear infinite}
@keyframes shake2{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.holdbtn{position:absolute;inset:0;background:transparent;border:0;padding:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.holdpill{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:8px 16px 8px 8px;font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:clamp(.72rem,1.7vw,.95rem);white-space:nowrap}
.holdpill svg{width:30px;height:30px}
.holdbtn:focus-visible .holdpill{outline:3px solid var(--lamp);outline-offset:3px}
.zone{position:absolute;background:transparent;border:2px dashed rgba(255,255,255,.55);border-radius:50%;cursor:pointer;padding:0}
.zone:focus-visible{outline:3px solid var(--lamp)}
.closing{transform-origin:300px 205px;animation:closing 10s ease-in forwards}
@keyframes closing{from{transform:scale(1.35)}to{transform:scale(.82)}}
.orbit{transform-origin:300px 210px;animation:spinr 18s linear infinite}


/* chapters menu */
#app{position:relative}
.chap{position:absolute;right:16px;top:calc(100% + 0px);z-index:20;width:min(340px,calc(100% - 32px));max-height:min(70vh,560px);overflow-y:auto;background:var(--parchment);border:2px solid var(--ink);border-radius:14px;box-shadow:0 12px 30px rgba(20,20,19,.25);padding:14px;box-sizing:border-box}
.chapwrap{position:relative;z-index:20}
.chap h3{margin:10px 6px 6px;font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brown)}
.chap h3:first-child{margin-top:2px}
.chap ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.chap button{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;background:transparent;border:0;border-radius:8px;padding:10px 8px;font-family:var(--body);font-size:1rem;color:var(--ink);cursor:pointer;min-height:44px}
.chap button:hover,.chap button:focus-visible{background:var(--cream);outline:none}
.chap button[aria-current="true"]{background:var(--cream);font-weight:700}
.chap button small{font-family:var(--display);font-weight:700;font-size:.7rem;letter-spacing:.1em;color:var(--ink-soft);min-width:2.4em;font-variant-numeric:tabular-nums}


/* volume 3 */
.streaks{animation:streak 1.1s linear infinite}
@keyframes streak{from{transform:translateX(-140px)}to{transform:translateX(140px)}}
.blown{animation:blown 2.6s ease-in-out infinite}
@keyframes blown{50%{transform:translate(40px,-8px)}}
.elgrid{position:absolute;inset:0;background:#1B2224;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;padding:6%;box-sizing:border-box}
.el{background:#2A3335;border-radius:14px;display:flex;align-items:center;justify-content:center;opacity:.22;transition:opacity .4s, transform .4s;min-height:0}
.el svg{width:62%;height:auto;max-height:90%}
.el.on{opacity:1;transform:scale(1.04)}
.peb{opacity:0}
.pebs.on .peb{animation:drop .5s ease-in forwards}
@keyframes drop{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:none}}
.mref{opacity:0;transition:opacity 1.2s}
.mref.on{opacity:1}
.approach2{transform-origin:230px 200px;animation:approach 9s ease-in forwards}
.leaf{transform-origin:20px 115px;transform:scaleX(.12);transition:transform .15s}
.doorwrap{position:relative;background:var(--parchment);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:24px;padding:24px;align-items:center}
.doorsteps ol{margin:12px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-size:clamp(.95rem,1.8vw,1.1rem);line-height:1.35}
.doorpic svg{width:100%;height:auto;max-height:260px;display:block}
.doorgrid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px;background:#10181B}
.doorcard{display:flex;flex-direction:column;gap:8px;background:var(--parchment);border:2px solid var(--ink);border-radius:12px;padding:8px;cursor:pointer;font-family:var(--body);font-size:clamp(.82rem,1.6vw,1rem);line-height:1.25;color:var(--ink);text-align:left;min-width:0}
.doorcard svg{width:100%;height:auto;border-radius:8px;display:block}
.doorcard:hover{transform:translateY(-2px)}
.doorcard.nope{opacity:.4;filter:grayscale(1)}
.doorcard:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}

/* pilot: shared production layer */
#visual{position:relative}
.leaving{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;pointer-events:none;z-index:4;animation:leave .7s ease forwards}
@keyframes leave{to{opacity:0;transform:scale(.985)}}
.entering{animation:enter .8s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{clip-path:inset(0 0 0 100% round 18px)}to{clip-path:inset(0 0 0 0 round 18px)}}
.amb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.kb{animation:kb 24s ease-out forwards;transform-origin:62% 48%}
@keyframes kb{to{transform:scale(1.09)}}
.glowspot{position:absolute;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.55) 0%,rgba(255,190,90,.18) 40%,rgba(255,190,90,0) 70%);mix-blend-mode:screen;pointer-events:none;animation:candle 2.3s steps(9,end) infinite;transition:opacity 1.2s ease}
@keyframes candle{0%{opacity:.85;transform:translate(-50%,-50%) scale(1)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}35%{opacity:.75}55%{opacity:.95;transform:translate(-50%,-50%) scale(.97)}75%{opacity:.8}100%{opacity:.9;transform:translate(-50%,-50%) scale(1.02)}}
.callout{position:absolute;z-index:3;transform:translate(-50%,-50%) scale(0);background:var(--parchment);border:2px solid var(--ink);border-radius:8px;padding:5px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards;box-shadow:0 3px 0 var(--ink);pointer-events:none;white-space:nowrap}

function khanda(x,y,s=1,col=NAVY){ return `<g transform="translate(${x} ${y}) scale(${s})"><circle cy="4" r="22" fill="none" stroke="${col}" stroke-width="7"/><path d="M0 -44 L6 -30 L4 26 H-4 L-6 -30Z" fill="${col}"/><path d="M-10 26 H10 M0 26 V36" stroke="${col}" stroke-width="5"/><path d="M-6 30 Q-40 20 -36 -18 Q-30 6 -2 22 M6 30 Q40 20 36 -18 Q30 6 2 22" fill="${col}"/></g>`; }
function onkar(x,y,s=1,col=NAVY){ return `<text x="${x}" y="${y}" text-anchor="middle" font-family="'Noto Sans Gurmukhi',sans-serif" font-weight="700" font-size="${60*s}" fill="${col}">ੴ</text>`; }
function nishan(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 V-220" stroke="${K}" stroke-width="5"/><path d="M0 -220 L80 -190 L0 -160Z" fill="${KESRI}" stroke="${K}" stroke-width="2"/>${khanda(28,-190,.42)}<path d="M-4 -226 L0 -240 L4 -226Z" fill="${GOLD}" stroke="${K}"/></g>`; }
function jot(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><circle r="60" fill="url(#jotG)" class="pulse"/><path d="M0 -22 Q12 -6 8 8 Q4 16 0 16 Q-4 16 -8 8 Q-12 -6 0 -22Z" fill="#FFF3C0" stroke="${GOLD}" stroke-width="2"/></g>`; }
/* the Guru Granth Sahib under its canopy, wrapped in a rumala, with the chaur beside it */
function palki(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-90 0 V-150 M90 0 V-150" stroke="${GOLD}" stroke-width="7"/><path d="M-104 -150 Q0 -200 104 -150 Z" fill="${KESRI}" stroke="${K}" stroke-width="2.4"/>${[-80,-40,0,40,80].map(d=>`<path d="M${d} -150 l-8 14 h16Z" fill="${GOLD}" stroke="${K}" stroke-width="1"/>`).join('')}<rect x="-80" y="-40" width="160" height="40" fill="${ROSE}" stroke="${K}" stroke-width="2.2"/><path d="M-60 -40 Q-60 -78 0 -74 Q60 -78 60 -40Z" fill="${WHITE}" stroke="${K}" stroke-width="2.2"/><path d="M-50 -60 Q0 -70 50 -60" stroke="${GOLD}" stroke-width="3" fill="none"/>${onkar(0,-46,.38,KESRI)}<g transform="translate(70 -70) rotate(20)"><path d="M0 0 V40" stroke="${GOLD}" stroke-width="4"/><path d="M-6 0 Q0 -40 6 0Z" fill="${WHITE}" stroke="${K}" stroke-width="1.2"/></g></g>`; }
function harmandir(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-260" y="0" width="520" height="60" fill="${WATER}"/>${[0,1,2].map(k=>`<path d="M-250 ${14+k*16} q20 -6 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" stroke="${WHITE}" stroke-width="2" fill="none" opacity=".5"/>`).join('')}<path d="M-260 0 H-120 V-6 H-260Z" fill="${WHITE}" stroke="${K}" stroke-width="2"/><rect x="-80" y="-80" width="160" height="80" fill="${GOLD}" stroke="${K}" stroke-width="2.4"/>${[-56,-28,0,28,56].map(d=>`<path d="M${d-9} -10 V-40 Q${d} -52 ${d+9} -40 V-10Z" fill="#8A6A1A" stroke="${K}" stroke-width="1.4"/>`).join('')}<rect x="-62" y="-104" width="124" height="24" fill="${GOLD}" stroke="${K}" stroke-width="2"/><path d="M-40 -104 Q-40 -150 0 -158 Q40 -150 40 -104Z" fill="${GOLD}" stroke="${K}" stroke-width="2.4"/><path d="M0 -158 V-176" stroke="${K}" stroke-width="3"/>${[-70,70].map(d=>`<path d="M${d-10} -80 Q${d} -100 ${d+10} -80Z" fill="${GOLD}" stroke="${K}" stroke-width="1.8"/>`).join('')}</g>`; }
function flames(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})" class="flick">${[-70,-40,-10,20,50].map((d,i)=>`<path d="M${d} 0 Q${d-10} -50 ${d+12} -${80+(i%2)*30} Q${d+40} -50 ${d+30} 0Z" fill="${[KESRI,ROSE,GOLD][i%3]}" stroke="${K}" stroke-width="2"/>`).join('')}</g>`; }
function pyre(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})">${[0,1,2].map(k=>`<path d="M-110 ${-k*14} H110" stroke="#7A4A22" stroke-width="12" stroke-linecap="round"/>`).join('')}<path d="M-80 -40 Q-80 -60 -56 -60 H80 Q92 -58 88 -40Z" fill="${WHITE}" stroke="${K}" stroke-width="2"/></g>`; }
function river(y=270,col=WATER){ let o=`<rect x="0" y="${y}" width="600" height="${400-y}" fill="${col}"/><path d="M0 ${y} H600" stroke="${K}" stroke-width="3"/>`; for(let k=0;k<4;k++){ let d=`M${k%2*20} ${y+18+k*26}`; for(let x=0;x<620;x+=40) d+=` q10 -8 20 0 q10 8 20 0`; o+=`<path d="${d}" stroke="${WHITE}" stroke-width="2.5" fill="none" opacity=".6"/>`; } return o; }
/* the wheel of 8.4 million lives: tiny creatures around a turning ring */
function wheel(x,y,s=1){ const crit=['M-6 0 Q0 -10 6 0 Q0 4 -6 0Z','M-6 4 L0 -8 L6 4Z','M-8 0 Q-4 -6 4 -4 L8 -8 L8 0Z','M0 -8 a6 6 0 1 0 .1 0']; return `<g transform="translate(${x} ${y}) scale(${s})"><g class="spin"><circle r="90" fill="none" stroke="${K}" stroke-width="5"/><circle r="70" fill="none" stroke="${K}" stroke-width="2" stroke-dasharray="6 8"/>${Array.from({length:12},(_,i)=>{ const a=i/12*Math.PI*2; return `<g transform="translate(${Math.cos(a)*80} ${Math.sin(a)*80}) scale(1.6)"><path d="${crit[i%4]}" fill="${[GREEN,KESRI,ROSE,WATER][i%4]}" stroke="${K}" stroke-width="1"/></g>`; }).join('')}</g></g>`; }
function shCover(){ return sk(`${floor(330,'#C9B48A')}${harmandir(300,330,.9)}${jot(300,110,1)}${nishan(520,330,.8)}`); }

/* Light into Light, the full book. The Guru, what you are, the early-morning Name, the five thieves, your last day, the summons,
   the family's response, the bathing and the five Ks, Kirtan Sohila at the pyre, ashes to running water, the reading of the Guru,
   the account, grace, and the light merging into the Light.
   After the Guru Granth Sahib (Japji, Kirtan Sohila, Sukhmani Sahib, the Alahniyan) and the Sikh Rehat Maryada.
   A first draft: it should be read by Sikh readers. */
const BOOK={home:'lastday', toast:'Learned: ', pathLabel:'Path', pathTitle:'What you have learned', detourTitle:'Wrong turns you walked',
  pathNote:'Every wrong turn rewinds. Everything happens within the Hukam, even a second try.',
  guideBack:'Back to the book', voiceSample:'As water blends with water, so the light merges with the Light.'};

/* ---------- pictures ---------- */
const PG=(inner,lab,o)=>frame(sv(sk(inner,o),lab));
const DIM=`<rect width="600" height="400" fill="#000" opacity=".35"/>`;
function blob(x,y,id){ return `<g id="${id}" style="transition:opacity 1s,transform 1s"><path d="M${x-30} ${y+20} Q${x-40} ${y-20} ${x-10} ${y-30} Q${x+10} ${y-44} ${x+30} ${y-20} Q${x+44} ${y+10} ${x+20} ${y+24} Q${x} ${y+34} ${x-30} ${y+20}Z" fill="#3A3550" stroke="${K}" stroke-width="2" opacity=".85"/><circle cx="${x-8}" cy="${y-6}" r="3.5" fill="${GOLD}"/><circle cx="${x+8}" cy="${y-6}" r="3.5" fill="${GOLD}"/></g>`; }
function urn(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-14 -56 H14 L12 -46 Q32 -36 28 -14 Q24 0 0 0 Q-24 0 -28 -14 Q-32 -36 -12 -46Z" fill="#B86A3A" stroke="${K}" stroke-width="2.4"/><path d="M-26 -26 H26" stroke="${WHITE}" stroke-width="3"/></g>`; }
function ledger(x,y,s=1,{torn=false}={}){ const page=(dx,r)=>`<g transform="translate(${dx} 0) rotate(${r})"><rect x="-70" y="-90" width="140" height="110" fill="${WHITE}" stroke="${K}" stroke-width="2.4"/>${Array.from({length:7},(_,i)=>`<path d="M-56 ${-74+i*13} H56" stroke="${K}" stroke-width="2" opacity=".6"/>`).join('')}</g>`;
  return `<g transform="translate(${x} ${y}) scale(${s})">${torn?page(-110,-14)+page(110,14):page(-70,0)+page(70,0)+`<path d="M0 -90 V20" stroke="${K}" stroke-width="3"/>`}</g>`; }
function gate(x,y,s=1,{open=false}={}){ return `<g transform="translate(${x} ${y}) scale(${s})"><circle cy="-110" r="${open?130:60}" fill="url(#jotG)"/><path d="M-90 0 V-150 Q0 -240 90 -150 V0Z" fill="none" stroke="${GOLD}" stroke-width="12"/>${open?'':`<path d="M-80 0 V-148 Q-40 -200 0 -206 V0Z M80 0 V-148 Q40 -200 0 -206 V0Z" fill="#6A4A2A" stroke="${K}" stroke-width="2.4"/><circle cx="-12" cy="-90" r="5" fill="${GOLD}"/><circle cx="12" cy="-90" r="5" fill="${GOLD}"/>`}</g>`; }
function lamp(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-22 0 Q0 14 22 0 Q20 -8 0 -8 Q-20 -8 -22 0Z" fill="#B86A3A" stroke="${K}" stroke-width="2"/><path d="M14 -6 Q20 -26 14 -34 Q8 -24 14 -6Z" fill="${KESRI}" stroke="${K}" stroke-width="1.2" class="flick"/></g>`; }
const ROOM=(inner)=>`${floor(330,'#C9B48A')}<rect x="20" y="60" width="560" height="270" fill="#EAD9B0"/><path d="M20 330 V60 H580 V330" stroke="${K}" stroke-width="2" fill="none" opacity=".4"/>${inner}`;

/* ---------- sound ---------- */
Object.assign(MOODS,{ room:()=>roomTone(), drone:()=>drone(),
  night:()=>pad('night',[98,146.83,196],.03), warm:()=>pad('warm',[110,164.81,220],.035), light:()=>pad('light',[130.81,196,261.63],.035),
  water:()=>startLoop('water',g=>{ const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=800; s.connect(f).connect(g); s.start(); return [s]; },.05),
  fire:()=>startLoop('fire',g=>{ const s=ctx.createBufferSource(); s.buffer=brownBuf; s.loop=true; const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=600; f.Q.value=.8; s.connect(f).connect(g); s.start(); return [s]; },.08) });
/* a soft harmonium-like chord for the hymns */
function vaja(f=196){ if(!ctx) return; [1,1.5,2].forEach((k,i)=>{ const t=now(); const o=ctx.createOscillator(),g=ctx.createGain(); o.type='sawtooth'; o.frequency.value=f*k; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; env(g,t,.025/(1+i),.25,2.4); o.connect(lp).connect(g).connect(master); o.start(t); o.stop(t+2.8); }); }
function tapCount(n,lab,onTap){ let k=0; choices.innerHTML=`<button class="btn" type="button" id="tc">${lab} · 0 of ${n}</button>`; const b=$('#tc'); b.focus({preventScroll:true});
  b.onclick=e=>{ e.stopPropagation(); initAudio(); k++; onTap&&onTap(k); b.textContent=`${lab} · ${k} of ${n}`; if(k>=n){ b.disabled=true; setTimeout(()=>{ choices.innerHTML=''; next(); },700); } }; }

  view:()=>PG(`${floor(330,'#3A3550')}${pyre(300,330,1)}<g id="fl" style="opacity:0;transition:opacity 2s">${flames(300,300,1.1)}</g>${person(90,330,.85,{turban:false,col:WHITE,chunni:ROSE,arms:'fold'})}${person(520,330,.85,{col:WHITE,arms:'fold'})}`,'Your body on a pyre of wood at dusk. Your family stands on either side with folded hands.',{bg:'night'}),
  enter(){ mood('night'); },
  guide:{title:'Kirtan Sohila',text:"Kirtan Sohila is a short set of five hymns that Sikhs say every night before sleep, and that is sung at the cremation ground. Its first hymn, by Guru Nanak, pictures death as a wedding: the date has been written, so pour oil on the doorstep to welcome the groom, and give the bride your blessings that she may meet her Lord."},
  beats:[
    {text:"At the cremation ground, the family sings Kirtan Sohila, the same hymns you said every night before sleep. The date of the wedding is written, it says. Come, friends, pour oil on the doorstep, and bless me, that I may meet my Lord."},
    {text:"Your son lights the pyre. Hold.", lock:true, show(){ holdOn({label:'Light the pyre',ms:5000,wait:600,onDone:()=>{ const f=$('#fl'); if(f) f.style.opacity='1'; mood('night','fire'); }}); }},
    {text:"Then the Ardas, the standing prayer that ends every Sikh gathering, asking for the soul to rest at God's feet. Sleep was practice. This summons goes to every house, every day."} ]},

{ key:'ashes', label:'The ashes', bg:CREAMBG,
  view:()=>PG(`${floor(330)}${urn(300,330,1.4)}${person(140,330,.85,{col:WHITE})}`,'Your son holds a clay pot of ashes.'),
  enter(){ mood('warm'); },
  beats:[
    {text:"Your ashes are gathered into a pot. Your son wants to do something lasting for you. What should he do?", lock:true, afterType(){ pick([{label:'Build a memorial over them',go:'x_tomb'},{label:'Give them to running water'}]); }} ]},

{ key:'river', label:'The river', bg:WATER, learn:'simple',
  view:()=>PG(`${river(250)}<rect x="0" y="230" width="600" height="20" fill="#C9B48A"/><g class="drift">${[0,1,2,3,4].map(i=>`<circle cx="${180+i*60}" cy="${290+(i%2)*30}" r="4" fill="${WHITE}" opacity=".8"/>`).join('')}</g>${person(100,250,.8,{col:WHITE,arms:'offer'})}`,'Your son kneels at a river bank, letting ashes go into the current.'),
  enter(){ mood('water'); },
  beats:[
    {text:"He takes them to running water. Many families go to Kiratpur Sahib, where the Sutlej river flows past the gurdwara. Hold, and let the river take them.", lock:true, show(){ holdOn({label:'Let the ashes go',ms:5000,wait:600,onDone:()=>chime()}); }},
    {text:"No tomb, no headstone. The body goes back to the elements. What lasts is the Name, and the good you did."} ]},

{ key:'sahaj', label:'The reading', bg:CREAMBG,
  view:()=>PG(ROOM(`${palki(300,330,1)}${person(120,330,.85,{turban:false,col:WHITE,chunni:ROSE,arms:'fold'})}`),'At home, the Guru Granth Sahib under its canopy, with your daughter beside it.'),
  enter(){ mood('warm'); },
  beats:[
    {text:"Back home, a neighbour says your soul needs help on its road: a lamp lit for it, and rice balls offered, as other families do. What will your family do?", lock:true, afterType(){ pick([{label:'Light a lamp and offer rice balls',go:'x_ritual'},{label:'Read the Guru, cover to cover'}]); }} ]},

{ key:'reading', label:'The reading', bg:CREAMBG, learn:'noritual',
  view:()=>PG(ROOM(`${palki(300,330,1)}${person(120,330,.85,{turban:false,col:WHITE,chunni:ROSE,arms:'fold'})}${person(490,330,.85,{col:KESRI,dastar:NAVY,arms:'fold'})}`),'Your family sits before the Guru Granth Sahib, reading in turns.'),
  enter(){ mood('warm'); vaja(); },
  guide:{title:'Sahaj Path and Bhog',text:"A sahaj path is a complete, unhurried reading of all 1,430 pages of the Guru Granth Sahib, often finished in about ten days after a death. The final ceremony is the bhog: the last pages are read, the Ardas is said, and everyone shares karah prashad, a warm sweet made of flour, butter and sugar. In many families the eldest son is then given a turban, to show he now carries the family."},
  beats:[
    {text:"They begin a sahaj path: a complete reading of the Guru Granth Sahib, all 1,430 pages, over about ten days. Read on.", lock:true, afterType(){ tapCount(5,'Read on',k=>{ vaja(196+k*12); }); }},
    {text:"On the last day, the bhog: the final pages, the Ardas, and karah prashad shared with everyone who came. The Rehat Maryada asks Sikhs not to do rites for the soul's road. The hymns are for the living, to turn their grief toward God."} ]},

/* ===== Volume 3: the account ===== */
{ key:'v3', label:'Volume 3', bg:'var(--teal)',
  view:()=>card('Volume 3','The Account',"Every deed, the Gurus say, is written down. But the hymns also say the writing isn't the last word."),
  enter(){ mood('night'); vaja(146.83); }, beats:[{text:null}] },

{ key:'court', label:'The account', bg:NIGHTBG,
  view:()=>PG(`${floor(330,'#2A2C4E')}${ledger(300,250,1.2)}${person(110,330,.85,{col:WHITE,dastar:WHITE,arms:'offer',beard:false})}${person(490,330,.85,{col:WHITE,dastar:WHITE,arms:'offer',beard:false})}`,'A great open ledger glows in the dark, with a scribe on each side.',{bg:'night'}),
  enter(){ mood('night'); },
  guide:{title:'Dharam Rai',text:"Gurbani borrows figures from the Indian world around it. Dharam Rai is the righteous judge of the dead, and Chitra and Gupta are the two scribes who record every act. In the Japji, Guru Nanak lists them among those singing God's praise: they too work within the Hukam. The Gurus use them to say that deeds matter, not to describe a court you could map."},
  beats:[
    {text:"The hymns speak of Dharam Rai, the righteous judge, and two scribes, Chitra and Gupta, who write down every deed. Tap each.", lock:true, show(){ tapAll([
      [18,70,'Chitra',"Chitra, who writes what was seen."],
      [82,70,'Gupta',"Gupta, who writes what was hidden."],
      [50,52,'The account',"Your account: every deed, every word. The Gurus say it's read out, and that God orders Dharam Rai to judge it truly."] ]); }},
    {text:"Your account is opened. What will you stand on?", lock:true, afterType(){ pick([{label:'My pilgrimages and holy baths',go:'x_pilgrim'},{label:'The Name I remembered'}]); }} ]},

{ key:'name', label:'The account', bg:NIGHTBG, learn:'account',
  view:()=>PG(`${floor(330,'#2A2C4E')}${ledger(300,250,1.2,{torn:true})}${jot(300,180,1)}`,'The ledger is torn in two. A light glows between the halves.',{bg:'night'}),
  enter(){ mood('light'); chime(); },
  beats:[
    {text:"The hymns say that for those who lived in the Name, the account is torn up. Deeds were never meant to be traded for heaven. The Name was the point all along."} ]},

{ key:'grace', label:'The gate', bg:NIGHTBG,
  view:()=>PG(`${floor(330,'#2A2C4E')}${gate(300,330,1)}`,'A tall gate, closed, with light glowing behind it.',{bg:'night'}),
  enter(){ mood('night'); },
  beats:[
    {text:"A gate stands before you, with light behind it. It doesn't open by itself. What do you say?", lock:true, afterType(){ pick([{label:'I earned this',go:'x_ego'},{label:'Only by your grace'}]); }} ]},

{ key:'nadar', label:'The gate', bg:NIGHTBG, learn:'grace',
  view:()=>PG(`${floor(330,'#2A2C4E')}${gate(300,330,1,{open:true})}`,'The gate stands open, full of light.',{bg:'night'}),
  enter(){ mood('light'); chime(); },
  beats:[
    {text:"The gate opens. The Japji says it in one line: by karma comes the robe of the body, by grace, nadar, the gate of liberation. You can't climb in. You can only stop holding on to yourself, and be let in."} ]},

/* ===== Volume 4: light into light ===== */
{ key:'v4', label:'Volume 4', bg:'var(--teal)',
  view:()=>card('Volume 4','Light into Light',"The spark goes back to the fire it came from."),
  enter(){ mood('light'); vaja(); }, beats:[{text:null}] },

{ key:'merge', label:'Merging', bg:'#2A2238', learn:'merge',
  view:()=>PG(`<circle cx="300" cy="140" r="170" fill="url(#jotG)"/><g id="sp" class="rise">${jot(300,320,.6)}</g>`,'A small light below rises toward a great light above.',{bg:'night'}),
  enter(){ mood('light'); },
  guide:{title:'Joti jot samana',text:"When a Guru died, Sikhs said he was joti jot samana: merged, light into the Light. Sukhmani Sahib, by Guru Arjan, says it simply: as water blends with water, so the light merges with the Light. This merging, mukti, isn't a place. There's no separate self left to live somewhere. That's the point."},
  beats:[
    {text:"Sukhmani Sahib says: as water blends with water, so the light merges with the Light. Hold, and let your light go home.", lock:true, show(){ holdOn({label:'Merge into the Light',ms:6000,wait:800,onProgress:p=>{ const s=$('#sp'); if(s){ s.style.translate=`0 ${-p*180}px`; s.style.opacity=String(1-p*.7); } },onDone:()=>chime()}); }},
    {text:"No more going round. The drop is back in the ocean. It was never really apart from it."} ]},

{ key:'wedding', label:'The wedding', bg:CREAMBG,
  view:()=>PG(`${floor(330)}${gate(420,330,.8,{open:true})}${person(220,330,1,{turban:false,col:ROSE,chunni:KESRI})}${[120,170,270,320].map((x,i)=>`<circle cx="${x}" cy="${80+(i%2)*14}" r="8" fill="${KESRI}" stroke="${K}" stroke-width="1"/>`).join('')}<path d="M100 80 Q210 110 340 80" stroke="${K}" stroke-width="1.5" fill="none"/>`,'A bride in rose and saffron walks toward a doorway full of light, under a string of marigolds.'),
  enter(){ mood('light','warm'); },
  beats:[
    {text:"The Gurus' favourite picture of all this is a wedding. This world is the bride's parents' house. Death is the day she leaves for her husband's home, and the husband is God."},
    {text:"In the Alahniyan, the hymns for the dead, Guru Nanak says: don't call death bad, people, if you know how to truly die."} ]},

{ key:'lastpage', label:'The last page', bg:NIGHTBG,
  view:()=>frame(sv(shCover(),'The Golden Temple on its pool, under a great light, with the saffron flag beside it.')),
  enter(){ mood('warm'); },
  beats:[
    {text:"That's the road: a spark of the one Light in a borrowed robe, a Name remembered every morning, five thieves let go, a summons accepted, hymns instead of howling, a fire, a river, an account torn up, and a gate opened by grace."},
    {text:"Sikhs hope to die before they die: to break the wall of ego while still alive. Then the end is only the light going home."} ]},

{ key:'end', label:'The end', bg:'var(--teal)',
  view:()=>`<div class="title-card" style="cursor:default"><span class="eyebrow">The end of the book</span><h1>Light into Light</h1>
    <p>That was the whole road: the Guru, what you are, the early hours, the five thieves, the last day, the summons, the Hukam, your family, the bathing, Kirtan Sohila, the river, the reading, the account, the gate, and the merging.</p><p id="endsum" style="font-weight:700"></p>
    <p class="draft">A first draft that should be read by Sikh readers. Sources: the Guru Granth Sahib, especially the Japji (pp. 1–8), Kirtan Sohila (pp. 12–13), Sukhmani Sahib (pp. 262–296) and Guru Nanak's Alahniyan in Rag Vadhans (pp. 578–582); Sikh Rehat Maryada (Shiromani Gurdwara Parbandhak Committee, 1950), on funeral ceremonies; Eleanor Nesbitt, Sikhism: A Very Short Introduction (2016); Pashaura Singh and Louis E. Fenech (eds.), The Oxford Handbook of Sikh Studies (2014).</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="again" type="button">Read it again</button><button class="btn alt" id="pathend" type="button">See your path</button><button class="btn alt" id="chend" type="button">Choose a chapter</button></div>
    <div class="endlinks"><a href="../index.html#doors">Back to Many Doors</a></div></div>`,
  enter(){ mood('warm'); $('#again').onclick=e=>{ e.stopPropagation(); go(idx('guru')); }; $('#chend').onclick=e=>{ e.stopPropagation(); openChapters(true); }; $('#pathend').onclick=e=>{ e.stopPropagation(); openPath(); };
    $('#endsum').textContent=`You learned ${journey.learned.size} of ${LESSONS.length} lessons and walked ${journey.visited.size} of ${DETOURS.length} wrong turns.`+(journey.learned.size===LESSONS.length?' You know the way.':' Read again to learn the rest.'); },
  beats:[{text:null,lock:true}] },

/* ===== wrong turns ===== */
{ key:'x_time', label:'A wrong turn', bg:CREAMBG,
  view:()=>PG(ROOM(`${charpai(300,300)}${DIM}<g opacity=".9">${person(360,330,1.1,{col:'#14141E',dastar:'#14141E',skin:'#14141E',beard:false,legs:'#14141E'})}</g>`),'The dark figure stands right beside your bed.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"You beg for a little more time: a day, an hour, one more breath. The figure doesn't move. Gurbani says the day and the moment were written before you were born, and no one gets a single breath more."},
    {text:"Fighting it only makes the last moments frightened ones. Rewind, and accept the Hukam.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_wail', label:'A wrong turn', bg:'#6A3A3A',
  view:()=>PG(ROOM(`${charpai(300,300,{lying:true})}${person(90,330,.85,{turban:false,col:WHITE,chunni:ROSE,arms:'up'})}${person(500,330,.85,{col:WHITE,arms:'up'})}<rect width="600" height="400" fill="#8A1A1A" opacity=".2"/>`),'Your family raise their arms and cry out.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"They wail and beat their chests, and the neighbours join in. It's what grief looks like in many places. But it treats your death as a disaster, something that shouldn't have happened."},
    {text:"The Gurus taught that death is God's call, and mourning should turn toward God. The Rehat Maryada asks for Gurbani, not lament. Rewind, and let them sing.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_tomb', label:'A wrong turn', bg:CREAMBG,
  view:()=>PG(`${floor(330)}<g transform="translate(300 330)"><rect x="-90" y="-70" width="180" height="70" fill="${WHITE}" stroke="${K}" stroke-width="2.4"/><path d="M-60 -70 Q-60 -150 0 -158 Q60 -150 60 -70Z" fill="${WHITE}" stroke="${K}" stroke-width="2.4"/><path d="M-20 0 V-40 Q0 -56 20 -40 V0Z" fill="#8A8478" stroke="${K}" stroke-width="2"/></g>`,'A white domed tomb stands over your ashes.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"Your son builds a white memorial over your ashes. In a few years people are bowing to it, leaving flowers, asking it for favours. Your name is drawing people away from God, not toward him."},
    {text:"That's why the Rehat Maryada asks Sikhs not to build monuments to the dead. Rewind, and give the ashes to the river.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_ritual', label:'A wrong turn', bg:CREAMBG,
  view:()=>PG(ROOM(`<path d="M220 330 Q300 300 380 330Z" fill="${GREEN}" stroke="${K}" stroke-width="2"/>${[260,290,320,350].map(x=>`<circle cx="${x}" cy="318" r="10" fill="${WHITE}" stroke="${K}" stroke-width="1.5"/>`).join('')}${lamp(200,330,1.4)}`),'A small clay lamp and four rice balls on a leaf.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"They light the lamp and set out rice balls for your soul's road. In Hindu tradition those rites matter deeply, and they belong to that door. But the story goes that when Guru Nanak saw pilgrims at Haridwar throwing water toward the sun for their ancestors, he threw water the other way. If yours can reach the dead, he said, mine can reach my fields in Punjab."},
    {text:"The Sikh code asks families not to perform rites for the soul. What helps is turning to the Guru. Rewind, and read.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_pilgrim', label:'A wrong turn', bg:NIGHTBG,
  view:()=>PG(`${floor(330,'#2A2C4E')}${ledger(300,250,1.2)}${person(300,370,.6,{arms:'offer'})}<path d="M330 290 h28 v70 h-28Z" fill="${WHITE}" stroke="${K}" stroke-width="2"/>`,'You hold up a long list in front of the open ledger.',{bg:'night'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"You list every pilgrimage you made and every holy river you bathed in. The ledger doesn't change. Kabir, whose hymns are in the Guru Granth Sahib, said: if bathing in water set you free, the frogs would be free, bathing all day."},
    {text:"Rituals can wash the body. Only the Name washes the mind. Rewind, and stand on the Name.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_ego', label:'A wrong turn', bg:NIGHTBG,
  view:()=>PG(`${floor(330,'#2A2C4E')}${wheel(300,190,1.2)}`,'A great turning wheel of small creatures.',{bg:'night'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"I earned this, you say. The gate stays shut, and the wheel takes you instead. Another womb, another life, one of 8.4 million forms, round and round."},
    {text:"The I who earns things is the wall itself. Saying it puts the wall straight back up. Rewind, and ask for grace.", lock:true, afterType(){ rewindButton(); }} ]}
];

const CHAPTERS=[
  ['Before the road',[['The Guru','guru'],['What you are','self']]],
  ['Volume 1 · Before the End',[['The early hours','amrit'],['The five thieves','thieves']]],
  ['Volume 2 · The Summons',[['The last day','lastday'],['The summons','summons'],['Your family','family'],['Kirtan Sohila','pyre'],['The ashes','ashes'],['The reading','sahaj']]],
  ['Volume 3 · The Account',[['The account','court'],['The gate','grace']]],
  ['Volume 4 · Light into Light',[['Merging','merge'],['The wedding','wedding']]] ];
const LESSONS=[
  ['naam','Remember the Name','The Name is the one thing you carry over.','The early hours'],
  ['thieves','The five thieves','Lust, anger, greed, attachment and ego rob you of the Name.','The five thieves'],
  ['hukam','Accept the Hukam','Everything is within God’s will, even death.','The summons'],
  ['nowail','Sing, don’t wail','Mourning turns toward God, with hymns instead of lament.','Your family'],
  ['sohila','Kirtan Sohila','Death is a wedding, and the date was always written.','Kirtan Sohila'],
  ['simple','No monuments','Ashes go to running water. What lasts is the Name.','The ashes'],
  ['noritual','Read the Guru','No rites for the soul’s road. The Guru’s words turn the living to God.','The reading'],
  ['account','The account torn up','Rituals don’t clear the account. The Name does.','The account'],
  ['grace','By grace','By karma comes the body, by grace the gate.','The gate'],
  ['merge','Light into Light','As water blends with water, the light merges with the Light.','Merging'] ];
const IC=(d)=>`<path d="${d}" fill="none" stroke="#FBF4E6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
const DETOURS=[
  ['x_time','Begging for time',IC('M12 8 H28 M12 32 H28 M14 8 Q14 20 20 20 Q26 20 26 8 M14 32 Q14 20 20 20 Q26 20 26 32')],
  ['x_wail','Wailing',IC('M10 30 L14 10 M30 30 L26 10 M20 14 a5 5 0 1 0 .1 0')],
  ['x_tomb','A memorial',IC('M10 32 H30 V20 Q30 8 20 8 Q10 8 10 20Z')],
  ['x_ritual','Rites for the road',IC('M8 26 Q20 34 32 26 Q30 22 20 22 Q10 22 8 26Z M26 22 Q30 14 26 10')],
  ['x_pilgrim','Holy baths',IC('M6 26 q7 -6 14 0 t14 0 M14 18 a6 6 0 1 0 .1 0')],
  ['x_ego','I earned this',IC('M20 6 a14 14 0 1 0 .1 0 M20 12 V28')] ];
updatePathBadge();
go(0);

</script>
