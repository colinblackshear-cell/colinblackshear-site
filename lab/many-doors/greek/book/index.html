<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>The Gold Leaf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Jost:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one full-screen "flight" — a thin instrument bar on top, the scene card in the middle, the narrator's caption card below it. Single deliberate look: the safety-card palette. */
:root{
  color-scheme: light;
  --cream:#F6EBD2; --parchment:#FBF3DF; --ink:#1E2A2B; --ink-soft:#44524F;
  --teal:#1F5E63; --teal-deep:#123D40; --brown:#8A4B22; --lamp:#F2B640;
  --red:#B8352A; --ok:#2F6B2B;
  --scene-bg: var(--cream);
  --display:'Jost', 'Futura', 'Century Gothic', sans-serif;
  --body:'Atkinson Hyperlegible', 'Verdana', sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;background:var(--scene-bg);transition:background-color 2.2s ease}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--ink);background:var(--parchment);transition:opacity 1.5s,filter 1.5s}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:.8rem;text-transform:uppercase}
#stageLabel{font-family:var(--display);font-weight:500;font-size:.85rem;color:var(--ink-soft);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stageLabel b{color:var(--brown);font-weight:700;margin-right:8px;font-variant-numeric:tabular-nums}
.tog{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:36px}
.tog[aria-pressed="false"]{background:transparent;color:var(--ink-soft);border-style:dashed}
.pick{font-family:var(--body);font-size:.8rem;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:8px;padding:6px 8px;min-height:36px;max-width:190px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pick:focus-visible,.tog:focus-visible,.btn:focus-visible,.spot:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
#stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:18px;padding-block:18px;padding-inline:16px;cursor:pointer;user-select:none}
#visual{width:100%;display:flex;justify-content:center;flex:none}
.frame{position:relative;width:min(100%, calc((100dvh - 380px) * 1.5), 980px);min-width:min(100%,300px);aspect-ratio:3/2;max-width:100%;border-radius:18px;overflow:hidden;transition:filter 3s ease, transform 3s ease}
.frame>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:filter 3s ease}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.caption{flex:none;max-width:720px;width:100%;box-sizing:border-box;background:var(--parchment);border:2px solid var(--ink);border-radius:6px;padding:16px 20px;min-height:4.6em;transition:opacity .8s, filter 1.5s, transform 1.5s, border-color 1.5s}
.caption p{margin:0;font-size:clamp(1.02rem, 2.3vw, 1.3rem);line-height:1.45;text-wrap:pretty}
.caption.quiet{background:transparent;border-color:transparent;text-align:center}
.caption.dark{background:#141413;color:var(--parchment);border-color:#141413}
.caption[hidden]{display:none!important}
#hint{margin:0;font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);opacity:0;transition:opacity .6s;min-height:1em}
#hint.on{opacity:.8;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
#choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.04em;border:2px solid var(--ink);background:var(--teal);color:var(--parchment);border-radius:999px;padding:12px 22px;cursor:pointer;min-height:48px}
.btn.alt{background:var(--parchment);color:var(--ink)}

/* dissolution: the manual's chrome comes apart; the narration always stays sharp */
body.d1 .bar{opacity:.85}
body.d2 .bar{filter:blur(.6px);opacity:.6}
body.d2 .frame{border-radius:28px}
body.d3 .bar{filter:blur(1.5px);opacity:.3}
body.d3 .frame{border-radius:40px}
body.void .bar,body.void #hint{opacity:0!important}

/* title */
.title-card{width:min(100%,640px);background:var(--teal);color:var(--parchment);border:2px solid var(--ink);border-radius:18px;padding:36px 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;align-items:flex-start;cursor:default}
.title-card .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:.75rem;color:var(--lamp);text-transform:uppercase}
.title-card h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1;text-wrap:balance;text-transform:uppercase;letter-spacing:.02em}
.title-card p{margin:0;font-size:1.05rem;line-height:1.5;max-width:46ch}
.title-card ol{margin:4px 0 8px;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;font-size:.98rem}
.title-card .btn{background:var(--lamp);color:var(--ink)}

/* hotspots */
.spot{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:3px solid #FFF3D6;background:rgba(242,182,64,.35);cursor:pointer;padding:0}
.spot::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid #FFF3D6;animation:ping 1.8s ease-out infinite}
.spot.done{opacity:0;pointer-events:none;transition:opacity .6s}
@keyframes ping{from{transform:scale(.7);opacity:.9}to{transform:scale(1.4);opacity:0}}
.heartglow{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(var(--s,0.4));background:radial-gradient(circle,#FFFBEA 0%,rgba(255,221,120,.85) 35%,rgba(255,200,80,0) 70%);transition:transform 1.2s ease;pointer-events:none}

/* breath ring */
.breath{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.6);border-radius:50%;border:4px solid var(--parchment);box-shadow:0 0 0 12px rgba(251,243,223,.15);transition:transform 1s ease-in-out, opacity 1s}

/* svg scenes */
.svgscene{position:absolute;inset:0;width:100%;height:100%}
.flicker{transform-origin:300px 262px;animation:flick 1.3s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1) skewX(0)}30%{transform:scaleY(.9) skewX(3deg)}60%{transform:scaleY(1.06) skewX(-2deg)}}
.orb-down{animation:down 7s ease-in-out forwards}
.orb-up{animation:up 7s ease-in-out forwards}
@keyframes down{to{transform:translateY(91px)}}
@keyframes up{to{transform:translateY(-55px)}}
.dots{stroke-dasharray:2 7;stroke-linecap:round}

/* guide entry */
.guide{position:absolute;inset:0;background:var(--parchment);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;gap:4%;padding:5%;box-sizing:border-box}
.guide .tag,.doorsteps .tag{display:inline-block;font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:clamp(.55rem,1.4vw,.75rem);background:var(--teal);color:var(--parchment);padding:5px 10px;border-radius:4px;text-transform:uppercase}
.guide h2{margin:10px 0 8px;font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,3.4vw,2.2rem);line-height:1.05;text-transform:uppercase;color:var(--brown);text-wrap:balance}
.guide p{margin:0;font-size:clamp(.85rem,1.8vw,1.15rem);line-height:1.45}
.guide .fig{height:100%;display:flex;align-items:center;justify-content:center;background:var(--teal);border-radius:12px;min-height:0}
.frame.guideframe{aspect-ratio:auto;width:min(100%,860px)}
.frame.guideframe .guide{position:relative;inset:auto;padding:24px;gap:24px}
.guide .fig{align-self:stretch;min-height:200px;padding:12px}
.guide .fig svg{height:220px;width:auto}
.guide .gtext{box-sizing:border-box}
.guide .gtext:focus-visible{outline:3px solid var(--lamp)}
@media (max-width:760px){
  .frame.guideframe .guide{grid-template-columns:1fr;gap:16px;padding:18px}
  .guide .fig{min-height:0}
  .guide .fig svg{height:150px}
  .guide h2{font-size:1.5rem}
  .guide p{font-size:1.02rem}
}

/* clear light */
.crack{stroke-dasharray:900;stroke-dashoffset:900;animation:crack 1.2s ease-out forwards}
@keyframes crack{to{stroke-dashoffset:0}}
.bubble{opacity:0;transform:scale(.6);transform-origin:80% 80%;transition:opacity .8s, transform .8s}
.bubble.on{opacity:1;transform:scale(1)}
.ring{position:absolute;left:49.8%;top:43%;width:8%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(242,182,64,.55);transform:translate(-50%,-50%);animation:ring 4.5s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(9);opacity:0}}


/* chapters 4-5 */
.rise{animation:rise 4.5s ease-out forwards}
@keyframes rise{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
.walk{animation:walk 9s ease-in forwards}
@keyframes walk{to{transform:translateY(-22px);opacity:.25}}
.steam path{animation:steam 2.4s ease-in-out infinite}
.steam path+path{animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
.balloon{opacity:0}
.balloon.on{animation:shout 4s ease-out forwards}
@keyframes shout{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.mug{opacity:0}
.mug.on{opacity:1;animation:shake .35s linear 2}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.drawer{transition:transform 1s ease}
.drawer.open{transform:translateX(60px)}
.page{transform-box:fill-box;transform-origin:center;animation:fly 1.6s ease-in forwards}
.page.f2{animation-delay:.35s}.page.f3{animation-delay:.7s}
@keyframes fly{to{transform:translate(160px,-190px) rotate(30deg);opacity:0}}
.glass.flash{animation:flash .9s ease}
@keyframes flash{40%{fill:#FFFFFF}}
.popped{transform-box:fill-box;transform-origin:center;animation:pop 1.2s ease 1s forwards}
@keyframes pop{to{transform:scale(1.5);opacity:0}}
.drops{opacity:0;animation:drops 1s ease 2s forwards}
@keyframes drops{to{opacity:1}}
.drawerbtn{position:absolute;background:transparent;border:2px dashed rgba(251,243,223,.75);border-radius:6px;cursor:pointer;padding:0}
.drawerbtn:hover{background:rgba(242,182,64,.2)}
.drawerbtn:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.run{background:var(--red);font-size:1.2rem;letter-spacing:.24em;text-transform:uppercase;padding:14px 34px;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.checks{position:absolute;inset:0;background:var(--parchment);padding:5%;box-sizing:border-box;display:flex;flex-direction:column;gap:4%}
.ck-head span{display:block;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(.95rem,3.4vw,2rem);color:var(--brown);letter-spacing:.03em}
.ck-head small{display:block;font-size:clamp(.7rem,1.6vw,1rem);color:var(--ink-soft);margin-top:4px}
.ck-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;flex:1}
.ck{display:flex;align-items:center;gap:6%;padding:4%;border:2px solid var(--ink);border-radius:12px;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:clamp(.7rem,1.9vw,1.15rem);line-height:1.25;text-align:left;cursor:pointer;min-width:0}
.ck:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.box{flex:none;width:clamp(18px,3vw,32px);aspect-ratio:1;border:3px solid var(--ink);border-radius:6px;position:relative;background:#FFFFFF}
.ck[aria-pressed="true"] .box{background:var(--ok)}
.ck[aria-pressed="true"] .box::after{content:"";position:absolute;left:30%;top:6%;width:28%;height:58%;border:solid #FFFFFF;border-width:0 4px 4px 0;transform:rotate(45deg)}


/* epilogue */
.duo{position:absolute;inset:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.half{position:relative;border:0;padding:0;margin:0;cursor:pointer;background:none;overflow:hidden;transition:filter .4s}
.half svg{width:100%;height:100%;display:block}
.half span{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(.68rem,1.6vw,.95rem);background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;white-space:nowrap}
.duo:hover .half:not(:hover){filter:brightness(.55)}
.half:focus-visible{outline:4px solid var(--lamp);outline-offset:-4px}
.rules{position:relative;background:var(--parchment);padding:24px;display:flex;flex-direction:column;gap:18px}
.rule-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rule{display:flex;flex-direction:column;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:12px;background:var(--cream);min-width:0}
.rule svg{width:100%;height:auto;border-radius:8px;background:#E9DDBF}
.rule b{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--teal)}
.rule p{margin:0;font-size:clamp(.9rem,1.6vw,1.05rem);line-height:1.35}
.spin{transform-origin:300px 170px;animation:spinr 40s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.bluerise{animation:brise 3s ease-out forwards}
@keyframes brise{to{opacity:.85;transform:translateY(-40px)}}

/* volume 2 */
.approach{transform-origin:300px 205px;animation:approach 9s ease-in forwards}
@keyframes approach{from{transform:scale(.8)}to{transform:scale(1.14)}}
.pulse{transform-origin:300px 205px;animation:pulseg 1.24s ease-in-out infinite}
@keyframes pulseg{50%{opacity:.12;transform:scale(.92)}}
.morph .pulse{animation:none;opacity:0;transition:opacity 1s}
.wrath{transform-origin:300px 205px;transition:transform 1.6s ease, opacity 1.4s ease}
.fl{transform-origin:300px 205px;animation:flick2 .45s ease-in-out infinite alternate}
@keyframes flick2{to{transform:scale(1.04) rotate(1.5deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.peace{opacity:0;transform-origin:300px 205px;transform:scale(.3);transition:opacity 1.6s ease .5s, transform 1.6s ease .5s}
.morph .wrath{transform:scale(.12) rotate(90deg);opacity:0}
.morph .peace{opacity:1;transform:scale(1)}
.frame.facing{transition:none;animation:shake2 .12s linear infinite}
@keyframes shake2{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.holdbtn{position:absolute;inset:0;background:transparent;border:0;padding:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.holdpill{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:8px 16px 8px 8px;font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:clamp(.72rem,1.7vw,.95rem);white-space:nowrap}
.holdpill svg{width:30px;height:30px}
.holdbtn:focus-visible .holdpill{outline:3px solid var(--lamp);outline-offset:3px}
.zone{position:absolute;background:transparent;border:2px dashed rgba(255,255,255,.55);border-radius:50%;cursor:pointer;padding:0}
.zone:focus-visible{outline:3px solid var(--lamp)}
.closing{transform-origin:300px 205px;animation:closing 10s ease-in forwards}
@keyframes closing{from{transform:scale(1.35)}to{transform:scale(.82)}}
.orbit{transform-origin:300px 210px;animation:spinr 18s linear infinite}


/* chapters menu */
#app{position:relative}
.chap{position:absolute;right:16px;top:calc(100% + 0px);z-index:20;width:min(340px,calc(100% - 32px));max-height:min(70vh,560px);overflow-y:auto;background:var(--parchment);border:2px solid var(--ink);border-radius:14px;box-shadow:0 12px 30px rgba(20,20,19,.25);padding:14px;box-sizing:border-box}
.chapwrap{position:relative;z-index:20}
.chap h3{margin:10px 6px 6px;font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brown)}
.chap h3:first-child{margin-top:2px}
.chap ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.chap button{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;background:transparent;border:0;border-radius:8px;padding:10px 8px;font-family:var(--body);font-size:1rem;color:var(--ink);cursor:pointer;min-height:44px}
.chap button:hover,.chap button:focus-visible{background:var(--cream);outline:none}
.chap button[aria-current="true"]{background:var(--cream);font-weight:700}
.chap button small{font-family:var(--display);font-weight:700;font-size:.7rem;letter-spacing:.1em;color:var(--ink-soft);min-width:2.4em;font-variant-numeric:tabular-nums}


/* volume 3 */
.streaks{animation:streak 1.1s linear infinite}
@keyframes streak{from{transform:translateX(-140px)}to{transform:translateX(140px)}}
.blown{animation:blown 2.6s ease-in-out infinite}
@keyframes blown{50%{transform:translate(40px,-8px)}}
.elgrid{position:absolute;inset:0;background:#1B2224;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;padding:6%;box-sizing:border-box}
.el{background:#2A3335;border-radius:14px;display:flex;align-items:center;justify-content:center;opacity:.22;transition:opacity .4s, transform .4s;min-height:0}
.el svg{width:62%;height:auto;max-height:90%}
.el.on{opacity:1;transform:scale(1.04)}
.peb{opacity:0}
.pebs.on .peb{animation:drop .5s ease-in forwards}
@keyframes drop{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:none}}
.mref{opacity:0;transition:opacity 1.2s}
.mref.on{opacity:1}
.approach2{transform-origin:230px 200px;animation:approach 9s ease-in forwards}
.leaf{transform-origin:20px 115px;transform:scaleX(.12);transition:transform .15s}
.doorwrap{position:relative;background:var(--parchment);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:24px;padding:24px;align-items:center}
.doorsteps ol{margin:12px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-size:clamp(.95rem,1.8vw,1.1rem);line-height:1.35}
.doorpic svg{width:100%;height:auto;max-height:260px;display:block}
.doorgrid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px;background:#10181B}
.doorcard{display:flex;flex-direction:column;gap:8px;background:var(--parchment);border:2px solid var(--ink);border-radius:12px;padding:8px;cursor:pointer;font-family:var(--body);font-size:clamp(.82rem,1.6vw,1rem);line-height:1.25;color:var(--ink);text-align:left;min-width:0}
.doorcard svg{width:100%;height:auto;border-radius:8px;display:block}
.doorcard:hover{transform:translateY(-2px)}
.doorcard.nope{opacity:.4;filter:grayscale(1)}
.doorcard:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}

/* pilot: shared production layer */
#visual{position:relative}
.leaving{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;pointer-events:none;z-index:4;animation:leave .7s ease forwards}
@keyframes leave{to{opacity:0;transform:scale(.985)}}
.entering{animation:enter .8s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{clip-path:inset(0 0 0 100% round 18px)}to{clip-path:inset(0 0 0 0 round 18px)}}
.amb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.kb{animation:kb 24s ease-out forwards;transform-origin:62% 48%}
@keyframes kb{to{transform:scale(1.09)}}
.glowspot{position:absolute;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.55) 0%,rgba(255,190,90,.18) 40%,rgba(255,190,90,0) 70%);mix-blend-mode:screen;pointer-events:none;animation:candle 2.3s steps(9,end) infinite;transition:opacity 1.2s ease}

function tapCount(n,lab,onTap){ let k=0; choices.innerHTML=`<button class="btn" type="button" id="tc">${lab} · 0 of ${n}</button>`; const b=$('#tc'); b.focus({preventScroll:true});
  b.onclick=e=>{ e.stopPropagation(); initAudio(); k++; onTap&&onTap(k); b.textContent=`${lab} · ${k} of ${n}`; if(k>=n){ b.disabled=true; setTimeout(()=>{ choices.innerHTML=''; next(); },700); } }; }

  view:()=>PG(`${line(330)}${gfig(170,330,1.1,{hat:'petasos',staff:'kerykeion',arms:'fwd'})}${crowd([300,380,460],320,.7)}`,'Hermes, in a wide hat and carrying a snake-twined staff, leads a line of pale souls.'),
  enter(){ mood('night'); },
  guide:{title:'Psychopompos',text:"Hermes, messenger of the gods, was also Psychopompos, the guide of souls. Vase painters show him in a wide traveller's hat, carrying the kerykeion, a staff twined with two snakes. At the start of Odyssey 24 he leads the souls of the dead suitors down, and they follow him squeaking, like bats in a cave."},
  beats:[
    {text:"Hermes comes for you, in his wide traveller's hat, with his golden staff. Hold, and follow him down.", lock:true, show(){ holdOn({label:'Follow Hermes',ms:5000,wait:600}); }},
    {text:"Down past the streams of Ocean, past the White Rock, past the gates of the Sun and the land of dreams, to the meadow of asphodel, where the dead live."} ]},

{ key:'charon', label:'The ferryman', bg:NIGHTBG,
  view:()=>PG(`${water(270)}<g class="drift">${boat(300,290,1)}${gfig(220,272,.8,{staff:'pole',hat:'petasos'})}</g>${coin(470,150,1.2)}`,'A dark river at night. Charon stands in his black boat with a long pole.',{bg:'night'}),
  enter(){ mood('water','night'); },
  beats:[
    {text:"At the river Acheron, the river of woe, waits Charon the ferryman, old and grim, in a dark boat. He takes the buried across. Virgil says the unburied must wander the bank for a hundred years. Pay him the coin from your mouth.", lock:true, afterType(){ tapCount(1,'Pay the obol',()=>bell(880,.06,2)); }},
    {text:"Hold, while he poles you across.", lock:true, show(){ holdOn({label:'Cross the river',ms:6000,wait:600}); }},
    {text:"In Aristophanes' comedy The Frogs, the god Dionysus has to row himself across, and complains about the fare the whole way. Even death, for the Greeks, could be funny."} ]},

{ key:'cerberus', label:'The dog', bg:CLAYBG,
  view:()=>PG(`${line(330)}${gate(440,330)}${cerberus(270,330,1.3)}`,'At a dark gateway lies Cerberus, a great black dog with three heads.'),
  enter(){ mood('drone','night'); growl(); },
  beats:[
    {text:"At the gates of Hades lies Cerberus, the dog with three heads. Hesiod says he fawns on everyone who comes in, wagging his tail and ears. But he eats anyone who tries to leave."},
    {text:"Behind you, far above, you can still see a little daylight. Something in you wants to go back.", lock:true, afterType(){ pick([{label:'Turn back toward the light',go:'x_turn'},{label:'Walk on, through the gate'}]); }} ]},

{ key:'gatein', label:'The dog', bg:NIGHTBG, learn:'oneway',
  view:()=>PG(`${line(330)}${gate(240,330)}<g transform="translate(300 320)">${shade(0,0,.8)}</g>`,'A pale soul walks through a dark gateway.',{bg:'night'}),
  enter(){ mood('night'); },
  beats:[{text:"You walk on. The dog wags his tail and lets you pass. For the dead, the gate of Hades opens only one way, and the stories about people who came back out are all stories about how hard it is."}] },

{ key:'judges', label:'The judges', bg:CLAYBG,
  view:()=>PG(`${line(330)}${throne(150,330,1)}${gfig(150,300,.9,{staff:'sceptre'})}${throne(300,330,1)}${gfig(300,300,.9,{staff:'sceptre'})}${throne(450,330,1)}${gfig(450,300,.9,{staff:'sceptre'})}`,'Three judges sit on thrones with sceptres.'),
  enter(){ mood('night','warm'); },
  guide:{title:'Plato, Gorgias',text:"In the Gorgias, Socrates tells a story he says is true. In the old days, people were judged on the day they died, while still alive and fully dressed, and the judges were fooled by fine bodies, rich clothes and important friends. So Zeus changed the rules: the dead are judged naked, by judges who are dead themselves, soul looking at soul."},
  beats:[
    {text:"Plato says three judges sit where the road divides: Minos, Rhadamanthys and Aeacus. You arrive in your best clothes, with a list of your important friends.", lock:true, afterType(){ pick([{label:'Tell them who you were',go:'x_finery'},{label:'Take it all off, and stand there as a soul'}]); }} ]},

{ key:'naked', label:'The judges', bg:CLAYBG, learn:'naked',
  view:()=>PG(`${line(330)}${throne(150,330,1)}${gfig(150,300,.9,{staff:'sceptre'})}${throne(300,330,1)}${gfig(300,300,.9,{staff:'sceptre'})}${throne(450,330,1)}${gfig(450,300,.9,{staff:'sceptre'})}<g transform="translate(300 380)">${shade(0,0,.5)}</g>`,'A small pale soul stands alone before the three thrones.'),
  enter(){ mood('night'); },
  beats:[
    {text:"Socrates says every wrong you did is left on the soul, like the scars of a whipping on a body. The judge sees all of it. Stand still, and let them look. Don't tap.", lock:true, cls:'quiet', afterType(){ stillTest({ms:9000,pass:'fields',fail:'nakedFail'}); }} ]},

{ key:'nakedFail', label:'The judges', bg:CLAYBG,
  view:()=>PG(`${line(330)}${throne(300,330,1)}${gfig(300,300,.9,{staff:'sceptre'})}`,'One judge, waiting.'),
  beats:[{text:"You flinched. Nobody stands easily in front of judges who can see everything. Try again.", lock:true, afterType(){ tryAgain('Stand before them','naked',0); }}] },

{ key:'fields', label:'Three places', bg:NIGHTBG,
  view:()=>PG(`${meadow(250)}<rect x="0" y="20" width="600" height="230" fill="${NIGHTG}"/>${stars(40,5,230,'#E8E0D0')}<circle cx="480" cy="100" r="40" fill="url(#glowG)"/><path d="M420 160 Q480 120 560 160Z" fill="${OLIVE}" stroke="${K}" stroke-width="2"/>${[100,170,240].map(x=>shade(x,320,.6)).join('')}<path d="M260 250 L300 380 L340 250Z" fill="${K}"/>`,'A grey meadow with pale shades, a dark pit in the middle, and a glowing island far off to the west.',{bg:'night'}),
  enter(){ mood('night'); },
  beats:[
    {text:"The judges point the way. Over the centuries, the Greek answers to where the dead go piled up into a kind of map. Tap each place.", lock:true, show(){ tapAll([
      [28,76,'Asphodel',"The Asphodel Meadow, where Homer's ordinary dead drift: not punished, not happy, just faint."],
      [80,30,'Elysium',"The Elysian Fields, or the Isles of the Blessed, at the western edge of the world. Homer says there's no snow or storm there, only the cool west wind. Pindar says the good live there without toil or tears."],
      [50,80,'Tartarus',"Tartarus, a pit as far below Hades as the sky is above the earth. There Sisyphus pushes his stone for ever, and Tantalus stands in water he can never drink."] ]); }},
    {text:"At first, Elysium was only for heroes related to the gods. Over time, more and more people hoped to get there. One group even wrote down directions."} ]},

{ key:'springs', label:'The gold leaf', bg:NIGHTBG,
  view:()=>PG(`${line(330)}${whiteCypress(110,330,.9)}${spring(170,340,.6)}${spring(440,340,.9,{glow:true})}${shade(300,320,.8)}`,'In the dark, a white cypress beside a small spring. Further on, a larger spring glows.',{bg:'night'}),
  enter(){ mood('water','night'); },
  guide:{title:'The gold tablets',text:"From about 400 BCE, some followers of the Orphic and Bacchic mysteries were buried with tiny sheets of gold, folded small or laid on the chest, inscribed with instructions for the dead. Archaeologists have found them in southern Italy, Sicily, Crete and Thessaly. The one quoted here, from Hipponion in Calabria, is among the oldest."},
  beats:[
    {text:"You were initiated, years ago, and you were buried with a thin gold leaf on your chest. It says: in the house of Hades you will find a spring on your right, and beside it a white cypress. The souls of the dead go down to it to cool themselves."},
    {text:"You're terribly thirsty. The first spring is right here.", lock:true, afterType(){ pick([{label:'Drink from the spring by the white cypress',go:'x_lethe'},{label:'Walk on to the Lake of Memory'}]); }} ]},

{ key:'memory', label:'The gold leaf', bg:NIGHTBG, learn:'memory',
  view:()=>PG(`${line(330)}${spring(300,340,1.2,{glow:true})}${gfig(160,330,.8,{staff:'sceptre'})}${gfig(440,330,.8,{staff:'sceptre',flip:true})}${tablet(300,120,.45)}`,'Two guards stand beside a glowing lake. Above it, the gold leaf.',{bg:'night'}),
  enter(){ mood('light','water'); },
  beats:[
    {text:"Guards stand at the Lake of Memory. What are you looking for, they ask, in the darkness of murky Hades? Hold, and give the answer from the gold leaf.", lock:true, show(){ holdOn({label:'Speak the password',ms:6000,wait:600,onDone:()=>chime()}); }},
    {text:"I am a child of Earth and starry Sky. I am parched with thirst and perishing. Give me quickly cold water from the Lake of Memory. And they let you drink, and you go on along the sacred road that the other initiates walk."},
    {text:"Another tablet, from Pelinna, greets the dead like this: Now you have died, and now you have been born, thrice blessed, on this very day. Tell Persephone that the Bacchic god himself has set you free."} ]},

/* ===== Volume 3: the mysteries and the philosophers ===== */
{ key:'v3', label:'Volume 3', bg:'var(--teal)',
  view:()=>card('Volume 3','Mysteries and Philosophers',"Where did that hope come from? From secret rites that promised a better lot to those who had seen them, and from philosophers who said the soul was immortal and had choices to make."),
  enter(){ mood('warm'); bell(196,.1,5); }, beats:[{text:null}] },

{ key:'eleusis', label:'Eleusis', bg:NIGHTBG,
  view:()=>PG(`${line(330)}<g id="tor">${[120,220,380,480].map(x=>`<g opacity=".25" style="transition:opacity .6s">${torch(x,330,.9)}</g>`).join('')}</g>${gfig(300,330,1.1,{hat:'veil'})}${pomegranate(300,150,1.1)}`,'A veiled woman stands at night between unlit torches. A pomegranate hangs above her.',{bg:'night'}),
  enter(){ mood('night','warm'); },
  guide:{title:'The secret',text:"Initiates at Eleusis were sworn to secrecy, and almost all of them kept it for nearly two thousand years, until the sanctuary was closed in the late 300s CE. We know about the procession, the fasting and the torches. We still don't know exactly what was shown in the hall."},
  beats:[
    {text:"Every autumn, thousands walked from Athens to Eleusis to be initiated into the mysteries of Demeter. Their story: Persephone, Demeter's daughter, was carried off to the underworld by Hades. Demeter searched the whole earth for her by torchlight. Light the torches.", lock:true, afterType(){ tapCount(4,'Light a torch',k=>{ const t=$('#tor'); if(t&&t.children[k-1]) t.children[k-1].setAttribute('opacity','1'); bell(392+k*30,.05,2); }); }},
    {text:"Persephone came back. But she had eaten a pomegranate seed below, so she must return to Hades for part of every year. Winter is her absence; spring is her return. Hold, and see what the initiates saw.", lock:true, show(){ holdOn({label:'See the sacred things',ms:6000,wait:600,onDone:()=>chime()}); }} ]},

{ key:'blessed', label:'Eleusis', bg:NIGHTBG, learn:'mysteries',
  view:()=>PG(`<circle cx="300" cy="200" r="170" fill="url(#glowG)"/>${pomegranate(300,200,1.6)}`,'A pomegranate glowing in golden light.',{bg:'night'}),
  enter(){ mood('light'); },
  beats:[{text:"Nobody wrote down what they saw. But the Homeric Hymn to Demeter tells us what they hoped: blessed is the one who has seen these rites. The one who has not will not have the same lot when they are dead, down in the gloom. For many Greeks, that was the answer to Achilles."}] },

{ key:'er', label:'The choice of lives', bg:NIGHTBG,
  view:()=>PG(`${lightPillar()}${spindle(300,200,.9)}${lots(300,350,.9)}`,'A pillar of rainbow light, with a great spinning spindle at its centre. Lots lie scattered on the ground.',{bg:'night'}),
  enter(){ mood('light','night'); },
  guide:{title:'Plato, Republic 10',text:"Plato ends the Republic, his great book about justice, with this story. Er, a soldier, is killed in battle. On the twelfth day, lying on his funeral pyre, he wakes up and tells what he saw. In Plato's version, souls are reborn again and again, and after a thousand years of reward or punishment, they come back to choose."},
  beats:[
    {text:"Plato tells a different story. A soldier named Er saw souls come to the spindle of Necessity to choose their next lives. The lives are laid out on the ground: tyrants, beggars, athletes, animals. A herald says: the responsibility is the chooser's. God is not to blame."},
    {text:"Your lot is called. Which life do you take?", lock:true, afterType(){ pick([{label:'A tyrant’s, with power over all',go:'x_tyrant'},{label:'A quiet, ordinary life'}]); }} ]},

{ key:'quiet', label:'The choice of lives', bg:NIGHTBG, learn:'choose',
  view:()=>PG(`${line(330)}${gfig(300,330,1.1)}${lots(300,360,.6,3)}`,'A single figure holding a small lot.',{bg:'night'}),
  enter(){ mood('light'); },
  beats:[
    {text:"That's what Odysseus chose. He came last, cured of ambition, and searched a long time for the life of a private person with no cares. He said he'd have chosen it even if he'd gone first. Plato's point: the one thing worth learning in this life is how to choose well in the next."},
    {text:"Then every soul crosses the Plain of Forgetting and drinks from the River of Unheeding. Those without wisdom drink too much, and forget everything. Er was not allowed to drink, so he remembered, and came back to tell."} ]},

{ key:'socrates', label:'Socrates', bg:CLAYBG,
  view:()=>PG(`${line(330)}${gfig(260,330,1.1,{arms:'fwd'})}<path d="M310 258 Q318 250 326 258 L322 280 H314Z" fill="${CREAM}" stroke="${K}" stroke-width="2"/>${gfig(420,330,.9,{arms:'mourn',flip:true})}${gfig(500,330,.85,{arms:'mourn',flip:true})}<path d="M196 132 a26 26 0 1 0 22 36 a20 20 0 1 1 -22 -36Z" fill="${CREAM}" stroke="${K}" stroke-width="2"/>${boat(420,175,.4)}`,'Socrates holds out a cup. His friends stand beside him with their hands on their heads. Above, a crescent moon and a small boat.'),
  enter(){ mood('warm'); },
  beats:[
    {text:"In 399 BCE, Athens sentenced the philosopher Socrates to death. At his trial he told the jury he wasn't afraid. Death, he said, is one of two things. Tap each.", lock:true, show(){ tapAll([
      [30,40,'A sleep',"Either it's a dreamless sleep. And think how few days and nights in a whole life are better than one deep, untroubled night."],
      [70,40,'A journey',"Or it's a journey to another place, where you can talk with Homer and Hesiod and the heroes, and ask them questions for ever. Either way, he said, it's a good thing."] ]); }},
    {text:"In prison, his friends wept. He told them to be calm, and drank the hemlock without hesitating. Hold.", lock:true, show(){ holdOn({label:'Drink calmly',ms:5000,wait:600,onDone:()=>breath(1.5,5)}); }},
    {text:"His last words were practical: Crito, we owe a rooster to Asclepius, the god of healing. Please don't forget to pay it. Then he was still."} ]},

{ key:'calm', label:'Socrates', bg:CLAYBG, learn:'fear',
  view:()=>PG(`<circle cx="300" cy="200" r="160" fill="url(#glowG)" opacity=".7"/>${tablet(300,200,1)}`,'The gold leaf, glowing.'),
  enter(){ mood('light'); chime(); },
  beats:[{text:"A sleep, or a journey to good company. Socrates didn't claim to know which. He only said that a good person has nothing to fear, in life or in death."}] },

{ key:'lastpage', label:'The last page', bg:DARK,
  view:()=>frame(sv(gkCover(),'A white cypress, two springs and a traveller, with the gold leaf glowing above.')),
  enter(){ mood('warm'); },
  beats:[
    {text:"That's the Greek passage: a soul like smoke, a coin for the ferryman, a dog that only lets you in, judges who see the soul naked, two springs, and a choice."},
    {text:"The gold leaf said: remember. Don't drink from forgetting. Say who you are: a child of Earth and starry Sky."} ]},

{ key:'end', label:'The end', bg:'var(--teal)',
  view:()=>`<div class="title-card" style="cursor:default"><span class="eyebrow">The end of the book</span><h1>A child of Earth and starry Sky</h1>
    <p>That was the whole road: Homer's shades, the last breath, the lament, the burial, Hermes, Charon, Cerberus, the judges, the three places, the two springs, Eleusis, the choice of lives and Socrates.</p><p id="endsum" style="font-weight:700"></p>
    <p class="draft">Quotations are adapted from published translations. Sources: Homer, Iliad 9, 23 and 24 and Odyssey 11 and 24; Hesiod, Theogony 767–773; the Homeric Hymn to Demeter; Pindar, Olympian 2; Sophocles, Antigone; Aristophanes, Frogs; Plutarch, Life of Solon 21; the gold tablets from Hipponion, Petelia and Pelinna, tr. Fritz Graf and Sarah Iles Johnston, Ritual Texts for the Afterlife (2007); Plato, Gorgias 523–527, Apology 40–41, Phaedo 117–118 and Republic 10; Virgil, Aeneid 6 and Georgics 4.</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="again" type="button">Read it again</button><button class="btn alt" id="pathend" type="button">See your path</button><button class="btn alt" id="chend" type="button">Choose a chapter</button></div>
    <div class="endlinks"><a href="../walk/">Walk The Twelve Days of Er</a><a href="../../index.html#doors">Back to Many Doors</a></div></div>`,
  enter(){ mood('warm'); $('#again').onclick=e=>{ e.stopPropagation(); go(idx('smoke')); }; $('#chend').onclick=e=>{ e.stopPropagation(); openChapters(true); }; $('#pathend').onclick=e=>{ e.stopPropagation(); openPath(); };
    $('#endsum').textContent=`You learned ${journey.learned.size} of ${LESSONS.length} lessons and walked ${journey.visited.size} of ${DETOURS.length} wrong turns.`+(journey.learned.size===LESSONS.length?' You know the way.':' Read again to learn the rest.'); },
  beats:[{text:null,lock:true}] },

/* ===== wrong turns ===== */
{ key:'x_loud', label:'A wrong turn', bg:CLAYBG,
  view:()=>PG(`${line(330)}${[90,160,230,370,440,510].map((x,i)=>gfig(x,330,.75,{arms:'mourn',hat:'veil',flip:i>2})).join('')}${kline(300,320)}`,'A crowd of hired mourners in black, wailing around the couch.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"Hired wailers scream your name through the streets. Mourners claw their cheeks until they bleed. Your family spends a fortune and sacrifices an ox at the grave. Everyone talks about it, and not kindly."},
    {text:"Athens had laws against exactly this. Solon, the city's great lawgiver, banned tearing the flesh, set dirges, hired wailing and lavish offerings, Plutarch says. Grief was the family's, not a show for the city. Rewind, and mourn at home.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_unburied', label:'A wrong turn', bg:NIGHTBG,
  view:()=>PG(`${water(300)}${crowd([120,200,280,360,440],300,.7)}`,'Pale shades crowd the bank of a dark river, unable to cross.',{bg:'night'}),
  enter(){ mood('drone','water'); },
  beats:[
    {text:"Your brother lies where he fell. And on the bank of the river of the dead, his shade wanders with the others who were never buried, held back while the ferry goes without them. In the Odyssey, the ghost of Odysseus' friend Elpenor begs him: don't leave me unwept and unburied."},
    {text:"In Sophocles' Antigone, the king who forbade the burial loses his son and his wife before the play is over. The laws of the gods come before the laws of the city. Rewind, and cover him with earth.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_turn', label:'A wrong turn', bg:NIGHTBG,
  view:()=>PG(`${line(330)}${gfig(400,330,1,{arms:'fwd',flip:true})}${lyre(450,250,.6)}<g opacity=".35">${shade(180,320,.9)}</g>`,'Orpheus with his lyre turns to look back at a pale woman who is fading away.',{bg:'night'}),
  enter(){ mood('drone'); pluck(392); setTimeout(()=>pluck(330),600); setTimeout(()=>pluck(262),1200); },
  beats:[
    {text:"You turn back. Cerberus is on his feet in a moment, all three heads snarling. The dead do not leave. Even Orpheus, whose music charmed the dog and the king of the dead, was only allowed to lead his wife Eurydice out if he did not look back."},
    {text:"Just before the light, he looked, and she was gone, back into the dark for ever. The road into Hades goes one way. Rewind, and walk on.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_finery', label:'A wrong turn', bg:CLAYBG,
  view:()=>PG(`${line(330)}${throne(300,330,1)}${gfig(300,300,.9,{staff:'sceptre'})}${gfig(150,330,1,{hat:'wreath',arms:'fwd'})}${coin(120,220,.8)}${coin(160,200,.8)}`,'A figure in a wreath holds up coins before the judge.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"You tell them who you were: your family, your money, the offices you held, the important people who would speak for you. The judges just look at you."},
    {text:"In Plato's story, this is exactly the problem Zeus fixed. Judges used to be fooled by fine clothes and powerful friends, so now everyone arrives naked, and nothing comes with you but your soul. Rewind, and take it all off.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_lethe', label:'A wrong turn', bg:'#2A2A3A',
  view:()=>PG(`${line(330)}${whiteCypress(300,330,1.1)}${spring(300,345,1)}${crowd([150,450],320,.8)}`,'Pale shades sit by the spring under the white cypress, staring at nothing.',{bg:'#2A2A3A'}),
  enter(){ mood('drone','water'); },
  beats:[
    {text:"You drink. It's cool and sweet. And then you can't remember why you came. Your name goes, then your children's faces, then the gold leaf on your chest. You sit down with the other shades under the white cypress."},
    {text:"That's the spring of forgetting. The tablet says: do not even go near it. For the initiates, memory was salvation: remember who you are. Rewind, and walk on.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_tyrant', label:'A wrong turn', bg:NIGHTBG,
  view:()=>PG(`${line(330)}${throne(300,330,1.3)}${gfig(300,290,1.1,{staff:'sceptre',hat:'wreath'})}`,'A figure on a high throne with a sceptre, alone.',{bg:'night'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"You grab the tyrant's life. Only then do you read it closely: among the other evils written in it, you will eat your own children. That's what happened to the first soul in Er's story. He beat his breast, Plato says, and blamed fate and the gods and everyone except himself."},
    {text:"He had lived a decent life before, out of habit, without ever thinking it through. Rewind, and choose with your eyes open.", lock:true, afterType(){ rewindButton(); }} ]}
];

const CHAPTERS=[
  ['Like smoke',[['Homer’s shades','smoke']]],
  ['Volume 1 · The Rites',[['The last breath','deathbed'],['The laying out','prothesis'],['The burial','burial']]],
  ['Volume 2 · The Road Down',[['Hermes','hermes'],['Charon','charon'],['Cerberus','cerberus'],['The judges','judges'],['Three places','fields'],['The gold leaf','springs']]],
  ['Volume 3 · Mysteries and Philosophers',[['Eleusis','eleusis'],['The choice of lives','er'],['Socrates','socrates']]] ];
const LESSONS=[
  ['shade','Like smoke','For Homer the dead are faint. Life is the bright thing.','Homer’s shades'],
  ['lament','Mourning with measure','Lament from the heart, but as a family, not a show.','The laying out'],
  ['burial','Burying the dead','The dead must be buried. The gods’ law comes before the city’s.','The burial'],
  ['oneway','One way in','The gate of Hades opens only one way. Don’t look back.','Cerberus'],
  ['naked','Judged naked','The judges see only the soul. Nothing else comes with you.','The judges'],
  ['memory','The Lake of Memory','Don’t drink forgetting. Remember who you are.','The gold leaf'],
  ['mysteries','The mysteries','Those who have seen the rites hope for a better lot.','Eleusis'],
  ['choose','Choosing well','The responsibility is the chooser’s. Learn in life how to choose.','The choice of lives'],
  ['fear','Nothing to fear','Death is either a deep sleep or a journey to good company.','Socrates'] ];
const IC=(d)=>`<path d="${d}" fill="none" stroke="#FBF4E6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
const DETOURS=[
  ['x_loud','Hired wailers',IC('M8 12 H32 V24 H18 L12 30 V24 H8Z')],
  ['x_unburied','Leaving the dead unburied',IC('M6 28 H34 M12 28 Q20 16 28 28')],
  ['x_turn','Looking back',IC('M28 20 H12 M18 14 L12 20 L18 26')],
  ['x_finery','Bringing your rank',IC('M10 28 L14 14 L20 22 L26 14 L30 28Z')],
  ['x_lethe','Drinking forgetting',IC('M20 8 Q12 20 20 24 Q28 20 20 8 M8 32 Q14 28 20 32 Q26 36 32 32')],
  ['x_tyrant','The tyrant’s life',IC('M14 30 V16 H26 V30 M12 16 L20 8 L28 16')] ];
updatePathBadge();
go(0);
