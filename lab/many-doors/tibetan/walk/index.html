<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Forty-Nine Day Walk</title></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a single map page (the 49-stone path) that launches one continuous, full-screen walk. Same safety-card look as The Bardo Manual. */
:root{
  color-scheme: light;
  --cream:#F6EBD2; --parchment:#FBF3DF; --ink:#1E2A2B; --ink-soft:#4A5754; --teal:#1F5E63; --brown:#8A4B22; --lamp:#E8B13A;
  --display:'Jost','Futura','Century Gothic',sans-serif; --body:'Atkinson Hyperlegible','Verdana',sans-serif;
}
html,body{min-height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
a{color:var(--teal)}
button{font:inherit}
:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;padding-inline:16px;border-bottom:2px solid var(--ink);background:var(--parchment)}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.85rem}
.brand small{display:block;font-weight:500;letter-spacing:.04em;text-transform:none;color:var(--ink-soft);font-size:.78rem;font-family:var(--body)}
.bar .sp{flex:1}
.pill{font-family:var(--display);font-weight:700;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;text-decoration:none;min-height:36px;display:inline-flex;align-items:center}
.wrap{max-width:980px;margin:0 auto;padding-block:24px 56px;padding-inline:16px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:center}
.eyebrow{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--brown)}
h1{margin:6px 0 12px;font-family:var(--display);font-weight:800;font-size:clamp(2rem,5vw,3.1rem);line-height:1.02;text-wrap:balance}
.lede{font-size:1.08rem;margin:0 0 12px;max-width:52ch}
.note{font-size:.88rem;color:var(--ink-soft)}
.map{background:#10181B;border:2px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 6px 0 var(--ink)}
.map svg{display:block;width:100%;height:auto}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 8px}
.bigbegin{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.04em;border:2px solid var(--ink);background:var(--lamp);color:var(--ink);border-radius:999px;padding:13px 24px;min-height:52px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.bigbegin:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn{font-family:var(--display);font-weight:700;font-size:.92rem;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:10px 18px;min-height:46px;cursor:pointer}
.weeks{margin-top:34px}
.weeks h2,.how h2{font-family:var(--display);font-weight:800;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.wk{text-align:left;background:var(--parchment);border:2px solid var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.wk b{font-family:var(--display);font-weight:800;letter-spacing:.06em}
.wk span{font-size:.86rem;color:var(--ink-soft)}
.wk i{display:block;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--a),var(--b))}
.wk:hover{background:#FFFFFF}
.how{margin-top:34px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.how h2{grid-column:1/-1}
.how div{border-top:3px solid var(--ink);padding-top:8px}
.how b{font-family:var(--display);font-weight:800;display:block}
.how p{margin:2px 0 0;font-size:.93rem}
details.all{margin-top:34px;border-top:2px dashed rgba(30,42,43,.25);padding-top:10px}
details.all summary{cursor:pointer;font-family:var(--display);font-weight:700;min-height:40px;display:flex;align-items:center}
details.all h3{font-family:var(--display);font-weight:800;margin:18px 0 4px;font-size:1.05rem}
details.all p{margin:0 0 6px;max-width:68ch}
.carrylist{position:absolute;inset:6% 6% 18%;background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:14px 16px;overflow:auto;transition:transform 1s cubic-bezier(.5,0,.3,1),opacity 1s}
.carrylist b{font-family:var(--display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;color:var(--brown)}
.carrylist ol{margin:8px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:clamp(.78rem,1.8vw,.95rem);line-height:1.35}
.carrylist li span{font-family:var(--display);font-weight:700;font-size:.72em;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-right:6px}
.carrylist.taken{transform:translateY(60%) scale(.1);opacity:0}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
/* ---------- the daily practice (full-screen session) ---------- */
body.insession{overflow:hidden}
.session{position:fixed;inset:0;z-index:50;background:#0E1416;color:#FFF6DE;display:flex;flex-direction:column;align-items:center;padding:max(10px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));gap:10px;overflow:auto}
.session::before{content:"";position:fixed;inset:0;background:radial-gradient(60% 50% at 50% 40%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);pointer-events:none}
.sbar{position:relative;display:flex;align-items:center;gap:8px;width:100%;max-width:980px;flex-wrap:wrap}
.stitle{font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:.9rem;opacity:.9;min-width:0}
.stitle b{color:var(--c);filter:brightness(1.4);margin-right:6px;letter-spacing:.14em;text-transform:uppercase}
.sbar .sp{flex:1}
.sbtn{font-family:var(--display);font-weight:700;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid rgba(255,246,222,.45);background:transparent;color:#FFF6DE;border-radius:999px;padding:6px 11px;min-height:34px;cursor:pointer}
.sbtn[aria-pressed=false]{opacity:.55}
.sbtn.x{font-size:1rem;width:36px;padding:0}
.steps{position:relative;list-style:none;margin:0;padding:0;display:flex;gap:6px;width:100%;max-width:980px}
.steps li{flex:1;font-family:var(--display);font-weight:700;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,246,222,.45);border-top:3px solid rgba(255,246,222,.15);padding-top:5px;text-align:center}
.steps li.done{border-color:color-mix(in srgb,var(--c) 70%,#FFF6DE);color:rgba(255,246,222,.7)}
.steps li.on{border-color:#FFF6DE;color:#FFF6DE}
.stage{position:relative;width:min(100%,980px,calc(min(58vh,620px)*1.5));aspect-ratio:3/2;border-radius:16px;overflow:hidden;border:2px solid rgba(255,246,222,.18);background:#10181B;flex:none}
@media (max-height:700px){.stage{width:min(100%,calc(48vh*1.5))}}
@media (max-width:600px) and (orientation:portrait){.stage{width:100%;aspect-ratio:1/1;max-height:52vh}.sbtn{font-size:.62rem;padding:5px 8px}.stitle{font-size:.8rem;flex-basis:100%}}
#art,#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{pointer-events:none;opacity:0;transition:opacity .8s}
#layer{position:absolute;inset:0}
.scap{position:relative;box-sizing:border-box;width:100%;max-width:760px;background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:14px 18px 12px;min-height:118px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.seye{display:block;font-family:var(--display);font-weight:800;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brown);min-height:1em}
.scap p{margin:4px 0 0;font-size:clamp(1.02rem,2.2vw,1.2rem);line-height:1.45;min-height:2.9em}
.srow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end;margin-top:8px;min-height:0}
.sgo{font-family:var(--display);font-weight:700;font-size:.92rem;letter-spacing:.03em;border:2px solid var(--ink);background:var(--teal);color:var(--parchment);border-radius:999px;padding:9px 18px;min-height:44px;cursor:pointer}
.sgo.alt{background:transparent;color:var(--ink)}
.chips{display:flex;gap:6px;margin-right:auto}
.chip{font-family:var(--display);font-weight:700;font-size:.8rem;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;min-height:40px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--parchment)}
.holdzone{position:absolute;inset:0;background:transparent;border:0;padding:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;color:inherit}
.holdpill{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:8px 16px;font-family:var(--display);font-weight:700;letter-spacing:.05em;font-size:clamp(.74rem,1.8vw,.95rem);white-space:nowrap;transition:transform .3s}
.holdpill svg{width:28px;height:28px;margin-left:-8px}
.holdzone.on .holdpill{transform:translateX(-50%) scale(.95)}
.holdzone:focus-visible .holdpill{outline:3px solid var(--lamp);outline-offset:3px}
.count{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:none}
.count i{width:12px;height:12px;border-radius:50%;border:2px solid #FFF6DE;opacity:.6}
.count i.on{background:#FFF6DE;opacity:1}
.tapit{position:absolute;transform:translate(-50%,-50%);width:13%;aspect-ratio:1;border-radius:50%;border:2px dashed rgba(255,246,222,.5);background:rgba(255,246,222,.08);padding:4%;cursor:pointer;transition:transform 1s cubic-bezier(.3,0,.3,1),opacity 1s}
.tapit svg{width:100%;height:100%;display:block}
.tapit:hover{background:rgba(255,246,222,.18)}
.tapit.gone{transform:translate(-50%,-260%) rotate(-12deg) scale(.6);opacity:0}
.tapit.bloom{transform:translate(-50%,-50%) scale(1.25);opacity:1;border-color:transparent;background:radial-gradient(circle,rgba(255,233,168,.55),transparent 70%)}
.spot{position:absolute;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:0;background:transparent;cursor:pointer}
.spot i{pointer-events:none;position:absolute;inset:14px;border-radius:50%;border:3px solid #E8B13A;animation:pingS 1.6s ease-out infinite}
@keyframes pingS{from{transform:scale(.6);opacity:1}to{transform:scale(1.6);opacity:0}}
.bub{position:absolute;font-family:var(--body);font-size:clamp(.8rem,1.9vw,1rem);background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;animation:bubIn .5s ease-out;transition:transform .6s,opacity .6s;min-height:40px}
.bub.bite{background:#3A2A44;color:#FFF6DE;border-color:#FFF6DE;font-family:var(--display);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.bub.pop{transform:scale(1.5);opacity:0}.bub.smiled{transform:scale(1.4);opacity:0;background:#E8B13A;color:var(--ink)}.bub.fade{opacity:0}
@keyframes bubIn{from{transform:scale(.3);opacity:0}}
.counter{position:absolute;top:10px;right:14px;font-family:var(--display);font-weight:800;font-size:2rem;color:#FFF6DE;font-variant-numeric:tabular-nums}
.duo{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr}
.half{position:relative;border:0;padding:0;margin:0;cursor:pointer;background:#000;overflow:hidden}
.half svg{width:100%;height:100%;display:block;transition:transform .5s}
.half:hover svg,.half:focus-visible svg{transform:scale(1.04)}
.half span{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:700;font-size:clamp(.7rem,1.7vw,.9rem);white-space:nowrap}
.half+.half{border-left:3px solid #0E1416}
.picks{position:absolute;inset:0;display:flex;flex-wrap:wrap;gap:10px;align-content:center;justify-content:center;padding:16px}
.pk{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:clamp(.85rem,2vw,1.05rem);border:2px solid var(--ink);background:var(--parchment);color:var(--ink);border-radius:999px;padding:8px 18px 8px 8px;cursor:pointer;min-height:48px}
.pk i{width:30px;height:30px;border-radius:50%;background:var(--pc);border:2px solid var(--ink)}
.doors{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);gap:2%;padding:6% 4%}
.dr{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;border:3px solid #FFF6DE;border-radius:999px 999px 10px 10px;background:#26343A;color:#FFF6DE;cursor:pointer;padding:10px 4px;font-family:var(--display);font-weight:700;font-size:clamp(.55rem,1.4vw,.78rem);text-transform:capitalize}
.dr svg{width:70%;max-width:56px}
.dr:hover,.dr:focus-visible{background:#3A4C54}
.wipe{position:absolute;inset:0;background:transparent;border:0;cursor:crosshair;touch-action:none}
.stillbar{position:absolute;left:20%;right:20%;bottom:14px;height:6px;border-radius:3px;background:rgba(255,246,222,.15);overflow:hidden}
.stillbar i{display:block;height:100%;width:0;background:#FFF6DE}
.sitring{position:absolute;inset:4% 0;display:flex;justify-content:center;pointer-events:none}
.sitring svg{height:100%;aspect-ratio:1}
.sittime{position:absolute;right:14px;top:10px;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;color:rgba(255,246,222,.6);font-size:.9rem}
.ghost{position:absolute;left:14px;top:8px;background:transparent;border:0;color:rgba(255,246,222,.55);font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;min-height:34px}
.aloud{position:absolute;inset:8% 10% 22%;display:flex;flex-direction:column;justify-content:center;gap:4px;text-align:center}
.aloud p{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(1rem,3vw,1.7rem);color:rgba(255,246,222,.45)}
.aloud p.now{color:#FFF6DE;font-weight:700}
.sgo.read,.sgo.back{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--parchment);color:var(--ink)}
.sgo.back{left:auto;right:16px;transform:none}
.spin{animation:spinr 40s linear infinite}@keyframes spinr{to{transform:rotate(360deg)}}
.approach{transform-origin:300px 200px;animation:approach 9s ease-in forwards}@keyframes approach{from{transform:scale(.8)}to{transform:scale(1.1)}}
.pulse{transform-origin:300px 200px;animation:pulseg 1.28s ease-in-out infinite}@keyframes pulseg{50%{opacity:.12;transform:scale(.92)}}
.wrath{transform-origin:300px 200px;transition:transform 1.6s ease,opacity 1.4s ease}
.fl{transform-origin:300px 200px;animation:flick2 .45s ease-in-out infinite alternate}@keyframes flick2{to{transform:scale(1.04) rotate(1.5deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.peace{opacity:0;transform-origin:300px 200px;transform:scale(.3);transition:opacity 1.6s ease .5s,transform 1.6s ease .5s}
.morphd .wrath{transform:scale(.12) rotate(90deg);opacity:0}.morphd .peace{opacity:1;transform:scale(1)}.morphd .pulse{opacity:0;animation:none}
.stage.facing{animation:shake2 .12s linear infinite}@keyframes shake2{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.fl2{animation:flick2 .5s ease-in-out infinite alternate}
.wind{animation:windm 3s ease-in-out infinite}@keyframes windm{50%{transform:translateX(40px)}}
.flick{animation:fk 1.4s ease-in-out infinite}@keyframes fk{50%{opacity:.5}}
.shock{transform-origin:300px 200px;transform-box:view-box;animation:shock 2.8s ease-out infinite}@keyframes shock{from{transform:scale(.3);opacity:1}to{transform:scale(5);opacity:0}}
.rp{transform-origin:300px 190px;transform-box:view-box;animation:shock 2.6s ease-out forwards}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const PARTS=[
 {name:'Dying', sub:'The moment of death and the Clear Light', col:'#C9962E'},
 {name:'The Peaceful Visions', sub:'Five lights, five wisdoms', col:'#2F5FA8'},
 {name:'The Fierce Visions', sub:'The same lights, shouting', col:'#A8322A'},
 {name:'Becoming', sub:'Drifting, judgment and the way back', col:'#2E7D63'}
];
const DAYS=[
/* ---------- PART ONE: DYING (1–14) ---------- */
{p:0,t:'Liberation Through Hearing',
 book:"The book's Tibetan name is Bardo Thödol: Liberation Through Hearing in the In-Between. It was made to be read aloud, beside someone who is dying and for weeks after, on the belief that the mind keeps listening even when the body has stopped.",
 mean:"The whole method is hearing. Not studying, not believing: hearing the right words at the right moment and recognizing what they point to. That only works if the words are already familiar. So the book is really meant for the living, to be heard many times before it's needed.",
 try:"Listen to one person today the way the book asks to be heard: completely, without planning your reply.",
 sit:"Close your eyes and just listen. Name nothing. Let every sound arrive and leave."},
{p:0,t:'You Are in a Bardo Now',
 book:"The book describes six bardos, or in-between states: this life, dreaming, meditation, dying, the luminous visions, and becoming. Three belong to the living and three to the dead.",
 mean:"A bardo is a gap: the space between one thing ending and the next beginning. Life is full of them: between waking and sleeping, between jobs, between one breath and the next. The teaching is that these gaps are where change is possible, because the old pattern has loosened and the new one hasn't set.",
 try:"Notice three gaps today: the pause after a door closes, the moment before you pick up your phone, the end of an out-breath.",
 sit:"Watch your breath. Rest your attention in the small pause at the bottom of each exhale."},
{p:0,t:'O Child of Noble Family',
 book:"The reading opens by speaking directly to the dying person: \"O child of noble family, what is called death has now arrived.\" It reminds them they are not the first to go and won't be the last, and asks them not to cling to this life out of longing or weakness.",
 mean:"Noble family isn't about rank. It means your basic nature is already good and already awake, however messy life has been. The first instruction is gentle and practical: you can't hold on, so don't spend your last energy trying.",
 try:"Do one ordinary thing today, washing a cup or closing a door, as if it were the last time. Not sadly. Just fully.",
 sit:"Silently say: everything I love is passing through. Let your hands open in your lap."},
{p:0,t:'Earth Into Water',
 book:"The book's commentaries describe dying as the four elements dissolving in order. First earth: the body grows heavy, it's hard to move or lift the head, and the inner sign is a shimmering mirage.",
 mean:"Earth is everything solid in you: bone, flesh, weight, the feeling of being a firm, separate thing. As it goes, so does the sense of having ground to stand on. The mirage is the mind noticing that what seemed solid was never quite as solid as it looked.",
 try:"Notice one thing you treat as rock-solid today, a plan or an opinion of someone, and ask how solid it really is.",
 sit:"Feel the weight of your body on the chair or floor. Let it be fully held. Stop holding yourself up."},
{p:0,t:'Water Into Fire',
 book:"Next water dissolves into fire. The mouth, nose and eyes dry out, the body stops holding moisture, and the inner sign is a haze like drifting smoke.",
 mean:"Water is everything fluid: blood, tears, and in the tradition, the flow of feeling. As it dries up, feelings lose their grip and stop sticking. The smoke is that blur between one feeling and the next.",
 try:"When a strong feeling arrives today, let it move through like weather. Don't feed it a story. See how long it lasts on its own.",
 sit:"Notice whatever you're feeling right now. Name it once, softly. Then just watch it change."},
{p:0,t:'Fire Into Air',
 book:"Then fire dissolves into air. Warmth leaves the hands and feet and gathers at the heart, digestion stops, and the inner sign is red sparks, like fireflies.",
 mean:"Fire is warmth, digestion, and the energy to take in and use the world. As it fades, you stop taking things in. What's left of your warmth goes where you have always lived most: the heart.",
 try:"Notice where your warmth goes today. Who do you light up for? Give a little of it somewhere unexpected.",
 sit:"Rest your attention in the center of your chest. Feel for any warmth there, however faint."},
{p:0,t:'Air Into Consciousness',
 book:"Last, air dissolves into consciousness. Out-breaths grow long and in-breaths grow short, until the final breath goes out. The inner sign is a small flame, like a butter lamp at the end of its oil.",
 mean:"Air is breath and movement, the last thing to leave. The tradition says that after the outer breath stops, an inner process continues for a while. That's why the reading carries on, and why the body is left undisturbed for a time after death.",
 try:"Three times today, take one slow breath out that's longer than it needs to be. Let it be the whole point.",
 sit:"Lengthen each out-breath a little. Rest in the small stillness after it ends."},
{p:0,t:'The White, the Red and the Black',
 book:"After the breath stops, the commentaries describe three visions. A white glow as the white drop descends from the crown, a red glow as the red drop rises from the navel, then black as they meet at the heart. With them, eighty kinds of thought switch off: anger, wanting, and confusion.",
 mean:"This is the mind's furniture being cleared out, drawer by drawer: first the pushing away, then the pulling toward, then even the dull fog. What's left when it's all gone is the most important moment in the book.",
 try:"Catch one thought today exactly as it dissolves, the moment you notice you've stopped thinking it.",
 sit:"Watch thoughts come and go like lights in a dark room. Don't follow any of them."},
{p:0,t:'The Clear Light',
 book:"At the moment of death, the Ground Luminosity dawns: the Clear Light. The reader says: \"Your own mind, empty and luminous, is the Clear Light. Recognize it. Rest in it.\" The book calls this the first and best chance for liberation.",
 mean:"The Clear Light isn't a light you see. It's awareness itself, before any thought, opinion or self-image shows up: open like a cloudless sky, and aware. The book's claim is that it's always present, just usually hidden behind the clouds. Death clears the clouds for a moment.",
 try:"Today, when you're caught in some small drama, ask: what am I clinging to here? The grip is the cloud. Loosen it and see what's behind.",
 sit:"For one minute, don't meditate on anything. Just be aware, and notice that you're aware."},
{p:0,t:'Why Almost Everyone Misses It',
 book:"The book says that most people don't recognize the Clear Light. It's too vast, too unfamiliar, and the habit of grasping at a separate self pulls them away. The moment passes and they fall unconscious.",
 mean:"We miss it the way we miss the sky by staring at the clouds. The light doesn't need to be found; it needs to be stopped running from. That one thought, \"but what about me?\", is enough to pull the curtain closed. This is why the book is studied in life: to make the open sky familiar.",
 try:"Count the \"what about me?\" moments today. No judgment, just counting.",
 sit:"Rest. When a thought about yourself appears, notice it, and come back to resting."},
{p:0,t:'The Second Light',
 book:"If the first Clear Light is missed, a second, secondary luminosity dawns as consciousness leaves the body. The reader repeats the instructions. Tradition says the best exit is through the crown of the head.",
 mean:"The book is generous. It keeps offering chances, each one a little harder because thoughts are starting to stir again. Practices like phowa, the transfer of consciousness, train the mind in life to leave upward when the time comes.",
 try:"If you miss a chance today, to be patient or kind, look for the second one. There's almost always a second one.",
 sit:"Imagine your attention resting at the very top of your head, open like a skylight."},
{p:0,t:'Waking Up Confused',
 book:"After about three and a half days of unconsciousness, the dead person wakes in a body made of mind, often not realizing they have died. They see their family grieving, call out, and aren't heard.",
 mean:"This is one of the book's most human moments. Being unheard is painful, and the instinct is to try harder and louder. The book's advice is to stop: accept what has happened, and turn toward what comes next.",
 try:"Notice one moment today when you badly want to be understood. Try letting it go without making your point.",
 sit:"Breathe in: I am here. Breathe out: I don't need to be seen."},
{p:0,t:'Signs You May Be Dead',
 book:"The book lists ways the dead can tell. They cast no shadow, leave no footprints, see no reflection in a mirror, and the living don't answer them.",
 mean:"Each sign is a mirror that has stopped reflecting you back. In life, we lean on reflections constantly: other people's reactions, our image, our footprint on the world. The question underneath is: who are you when nothing reflects you?",
 try:"Notice one place today where you look for a reflection: a like, a compliment, a reaction. Let it go unchecked once.",
 sit:"Sit as if no one will ever know you sat. Just this minute, unrecorded."},
{p:0,t:'The Roar',
 book:"As the visions begin, the book warns of terrifying sounds, lights and rays. The sound of reality rolls like a thousand thunders. The instruction: do not be afraid; these are the natural energy of your own mind.",
 mean:"Fear makes everything louder. The book's trick is to name the source: the noise isn't attacking you, it is you, turned all the way up. Running doesn't help, because you bring it with you. Standing still does.",
 try:"When something overwhelms you today, stand still for three breaths before you react.",
 sit:"Let every sound around you be as loud as it is. Don't push any of it away."},
/* ---------- PART TWO: PEACEFUL (15–22) ---------- */
{p:1,t:'Five Lights, Five Poisons',
 book:"Over the next week, the book says, five Buddhas appear in turn, each in a brilliant light, each with a duller, softer light beside it that leads back into one of the six realms of rebirth.",
 mean:"Each Buddha is a wisdom, and each wisdom is a poison transformed. Ignorance becomes spaciousness. Anger becomes clarity. Pride becomes equality. Wanting becomes discernment. Jealousy becomes effective action. The bright light is frightening because it's honest; the soft one is comfortable because it's familiar.",
 try:"Which of the five poisons is loudest in you today: dullness, anger, pride, wanting or jealousy? Just name it.",
 sit:"Picture five colored lights around you: blue, white, yellow, red and green. Rest in the middle."},
{p:1,t:'Day One: Blue',
 book:"On the first day, the Buddha Vairocana appears from the center in brilliant blue light, the wisdom of all-encompassing space. Beside it shines a dull white light: the realm of the gods.",
 mean:"Blue space holds everything without being disturbed by any of it. The gods' realm is the trap of comfort: a life so pleasant there's no reason to wake up. The book says go toward the blue, even though it hurts to look at.",
 try:"Choose one small discomfort today instead of the comfortable option. A cold shower, an honest answer, a quiet minute without your phone.",
 sit:"Imagine your awareness as the sky. Thoughts are birds crossing it. The sky doesn't chase them."},
{p:1,t:'Day Two: White',
 book:"On the second day, Vajrasattva-Akshobhya appears from the east in brilliant white light, mirror-like wisdom. Beside it, a smoky light leads to the hells, drawn by anger.",
 mean:"A mirror shows everything exactly as it is, without adding an opinion. Anger always adds one. Mirror-like wisdom is anger's clarity with the heat taken out: you still see what's wrong, you just don't burn yourself or anyone else.",
 try:"When you feel irritated today, describe the situation to yourself in plain facts only, no adjectives.",
 sit:"Picture a still pond. Let your mind be that surface, reflecting without rippling."},
{p:1,t:'Day Three: Yellow',
 book:"On the third day, Ratnasambhava appears from the south in brilliant yellow light, the wisdom of equality. Beside it, a dull blue light leads back to the human realm, drawn by pride.",
 mean:"Equality sees everyone's worth as the same, which is very freeing and slightly annoying if you were hoping to be special. Pride is always comparing, up or down. When the comparing stops, so does the exhaustion.",
 try:"Catch yourself ranking today: better than, worse than. Each time, swap it for 'also'. They're also trying.",
 sit:"Bring three people to mind: one you love, one you don't know, one you find hard. Wish each the same good thing."},
{p:1,t:'Day Four: Red',
 book:"On the fourth day, Amitabha appears from the west in brilliant red light, discriminating wisdom. Beside it, a dull yellow light leads to the hungry ghosts, drawn by craving.",
 mean:"Discriminating wisdom sees every detail of a thing clearly and appreciates it, without needing to own it. Craving sees only what it lacks. The hungry ghost has an enormous belly and a tiny mouth: nothing ever fills it.",
 try:"Notice one thing you reach for today that never quite satisfies, a snack, a scroll, a purchase. Pause before reaching.",
 sit:"Look closely at one object near you for a whole minute. Appreciate it completely. Don't want it."},
{p:1,t:'Day Five: Green',
 book:"On the fifth day, Amoghasiddhi appears from the north in brilliant green light, all-accomplishing wisdom. Beside it, a dull red light leads to the jealous gods, drawn by envy.",
 mean:"All-accomplishing wisdom simply does what's needed, without keeping score. Jealousy keeps score of everything and gets nothing done. The jealous gods fight forever over a tree whose fruit grows on someone else's side.",
 try:"Do one helpful thing today that no one will know about.",
 sit:"Think of someone who has something you want. Wish them more of it. Notice what happens in your chest."},
{p:1,t:'Day Six: All at Once',
 book:"On the sixth day, all five Buddhas appear together with their retinues, forty-two peaceful figures in all, while the six dull lights of the realms shine at the same time.",
 mean:"Everything shows up at once, which is how life usually is: all the wisdoms and all the temptations in the same room. The instruction doesn't change. Recognize the bright lights as your own mind and don't follow the dull ones.",
 try:"On a busy moment today, stop and ask: of everything pulling at me right now, which one is the bright light?",
 sit:"Let every sensation, sound and thought arrive together. Don't sort them. Just be the space they're in."},
{p:1,t:'Day Seven: Rainbow',
 book:"On the seventh day, the knowledge holders appear in dancing rainbow light, with music and song. Beside them shines a dull green light: the animal realm, drawn by dullness and ignorance.",
 mean:"The knowledge holders are teachers who mastered this journey and came back to help. The animal realm is the opposite of curiosity: no questions, no learning, just getting by. The rainbow invites you to keep learning. That's the whole peaceful week: every bright light is your own wisdom, every soft one your own habit, and the book keeps offering without scolding.",
 try:"Learn one small new thing today on purpose. Ask a question you'd normally skip.",
 sit:"Listen for music in ordinary sounds: traffic, birds, the hum of a fridge."},
/* ---------- PART THREE: FIERCE (23–31) ---------- */
{p:2,t:'Why They Turn Fierce',
 book:"From the eighth day, the same five Buddhas reappear in wrathful form, the herukas, with flames, many arms, fangs and terrifying roars. The book insists they are the peaceful ones, transformed, and that they are your own projections.",
 mean:"They get louder because you didn't hear them whisper. Wrathful isn't angry at you; it's fierce on your behalf, the way a parent shouts when a child steps toward traffic. The faces are terrifying so that your attention finally sticks.",
 try:"Think of someone who was hard on you for your own good. Can you see the care inside the fierceness now?",
 sit:"Imagine something fearsome in front of you. Instead of looking away, look at it kindly."},
{p:2,t:'Day Eight: Buddha Heruka',
 book:"On the eighth day, Buddha Heruka appears, dark brown, three faces, six arms, blazing. He is Vairocana, the blue light of the first day, in wrathful form.",
 mean:"Heruka is often translated blood-drinker, and the tradition explains that the blood they drink is your confusion. The very first, gentlest light has come back fierce. Ignorance doesn't give way to gentleness forever.",
 try:"Name one thing you've been avoiding looking at. Look at it for one minute.",
 sit:"Breathe in fear. Breathe out: this is my mind too."},
{p:2,t:'Day Nine: Vajra Heruka',
 book:"On the ninth day, Vajra Heruka appears, dark blue, the wrathful form of Vajrasattva, the white light of mirror-like wisdom.",
 mean:"Clarity, when ignored, becomes uncomfortable truth. The mirror doesn't soften what it shows. This day asks whether you can look at your own anger in the mirror without flinching or defending it.",
 try:"Notice one time today you defend yourself. Try listening one sentence longer instead.",
 sit:"Picture your face in a mirror. Let it be exactly as it is."},
{p:2,t:'Day Ten: Ratna Heruka',
 book:"On the tenth day, Ratna Heruka appears, dark yellow, the wrathful form of Ratnasambhava, the wisdom of equality.",
 mean:"Pride doesn't like being equal. When the gentle invitation to equality is ignored, it comes back as something that knocks you off your pedestal. That's not punishment; it's relief.",
 try:"Admit a small mistake today without explaining it.",
 sit:"Sit as if you were nobody special. Notice whether it feels heavy or light."},
{p:2,t:'Day Eleven: Padma Heruka',
 book:"On the eleventh day, Padma Heruka appears, dark red, the wrathful form of Amitabha, discriminating wisdom.",
 mean:"Desire, ignored, becomes all-consuming. The fierce red form burns away the grasping so that what's left can appreciate without devouring. Fire can warm or destroy; the difference is clinging.",
 try:"Enjoy something fully today and then let it end without asking for more.",
 sit:"Imagine a red flame. Let it burn away the wanting and leave the warmth."},
{p:2,t:'Day Twelve: Karma Heruka',
 book:"On the twelfth day, Karma Heruka appears, dark green, the wrathful form of Amoghasiddhi, all-accomplishing wisdom.",
 mean:"Jealousy and rushing, ignored, become frantic. The fierce green form cuts through the busyness: do what actually needs doing, and stop doing the rest.",
 try:"Cross one thing off your list today by deciding not to do it.",
 sit:"Feel the urge to do something. Don't. Watch the urge rise and fall."},
{p:2,t:'Day Thirteen: The Animal-Headed Ones',
 book:"On the thirteenth day come the Gauris and the animal-headed Pishachis, eight and eight, surrounding you from every direction.",
 mean:"Animal heads are instinct in visible form: hunger, territory, fear. They circle because instinct always circles. The instruction is still the same: recognize, don't run.",
 try:"Notice one purely instinctive reaction today, a flinch, a grab, a snap. Smile at it.",
 sit:"Feel the animal body you live in: heartbeat, warmth, breath. Let it be what it is."},
{p:2,t:'Day Fourteen: The Gatekeepers',
 book:"On the fourteenth day, four female gatekeepers appear at the four doors, with twenty-eight powerful yoginis. In all, the fierce visions number fifty-eight.",
 mean:"Gatekeepers guard a threshold. They're fierce at the door so that what's inside stays protected. Your fears are often guarding something precious.",
 try:"Ask of one fear today: what is this protecting?",
 sit:"Picture four doors around you, each guarded. You're safe in the middle."},
{p:2,t:'Practice Beats Scholarship',
 book:"The book notes something surprising: learned scholars who never practiced may panic at the fierce visions and fail to recognize them, while a simple practitioner who knows these forms from meditation recognizes them at once.",
 mean:"Knowing about something and knowing it are different. You can't recognize what you've never met. That's the whole case for practicing now, a minute at a time, instead of trusting that you'll figure it out when it matters.",
 try:"Instead of reading about a feeling today, feel it all the way through once.",
 sit:"Recall one of the fierce faces from the last week. Meet it here, now, as practice."},
/* ---------- PART FOUR: BECOMING (32–49) ---------- */
{p:3,t:'The Bardo of Becoming',
 book:"If the visions pass unrecognized, the dead person enters the bardo of becoming, the last stage before rebirth. The book says it can last up to forty-nine days.",
 mean:"Becoming is the stage of drifting and searching. The big flashes of light are gone and habits take over, steering you toward a new life. It's less dramatic and, in a way, more familiar: it looks a lot like an ordinary restless day.",
 try:"Notice when you're on autopilot today. Just notice; you don't need to stop.",
 sit:"Feel the pull of the next thing you want to do. Stay put for one more minute."},
{p:3,t:'The Mind-Made Body',
 book:"In this bardo you have a body made of mind, with all its senses, even if you were blind or deaf in life. It passes through walls and mountains and travels anywhere at a thought, except, the book says, into a mother's womb or the seat of the Buddha's awakening.",
 mean:"With no body to slow it down, the mind goes wherever it's pulled, instantly, and can't settle, like a feather in the wind. That's freedom and a problem: whatever you think, you become. It's a vivid picture of what restless minds already do.",
 try:"Notice how many places your mind visits in one hour without your body going anywhere.",
 sit:"Every time your mind travels, gently bring it back to the room."},
{p:3,t:'Your Things, Your People',
 book:"The dead see their family, their possessions, even people dividing up their belongings. The book warns: don't be attached, and don't be angry if things are misused. Clinging and anger now can drag you toward a painful birth.",
 mean:"It's surprisingly practical: you will have to let go of your stuff, and of controlling what people do with it. Practicing that in small ways now makes it lighter later.",
 try:"Give something away today that you've been keeping just in case.",
 sit:"Picture your favorite possession. Thank it. Let it belong to the world."},
{p:3,t:'The Winds of Karma',
 book:"A fierce wind of karma drives you from behind, and ahead there is a great darkness. You can't stop, can't turn back, and can't find shelter.",
 mean:"Karma simply means action: everything you've done, said and thought, still moving. The wind is momentum. You can't stop it in an instant, but every new action changes its direction a little.",
 try:"Pick one habit you'd like to shift. Do one small thing today in the new direction.",
 sit:"Feel the momentum of your day as wind. Don't fight it. Let it pass through you."},
{p:3,t:'Three Cliffs',
 book:"The four elements return as terrors: avalanches, floods, fires, storms. And three precipices open ahead, white, red and black: anger, desire and ignorance.",
 mean:"Each cliff only exists if you step off it. Anger, desire and confusion feel like places we're pushed into, but the book's view is that no one is pushing. Stepping back is always possible.",
 try:"Next time you feel yourself about to fall into one of the three, take one step back, literally if you like.",
 sit:"Imagine standing at the edge of something. Feel your feet. Step back in your mind."},
{p:3,t:'Yama and the Mirror',
 book:"You come before Yama, the Lord of Death, who holds the mirror of karma. Two companions who were born with you, one good and one bad, count your deeds with white and black pebbles.",
 mean:"The image is a court, but the meaning is self-knowledge. The companions are your own conscience, there since birth. Nothing is hidden because nothing was ever really hidden from you.",
 try:"Tonight, count your day honestly: one white pebble, one black. Then let both go.",
 sit:"Picture a mirror that shows your whole life. Look into it with kindness."},
{p:3,t:'Nothing to Hide',
 book:"The book says it's useless to lie before Yama: the mirror shows everything clearly. The dead may say they did no wrong, but the mirror doesn't argue.",
 mean:"There's relief in this. Pretending takes so much energy. When there's no point hiding, you can finally just be what you are and begin from there.",
 try:"Tell one small truth today you'd normally smooth over.",
 sit:"Let your face relax completely, as if no one could ever misread it."},
{p:3,t:'Nothing Can Hurt You',
 book:"Even when Yama's punishments come, the book says: your body is made of mind, and emptiness can't harm emptiness. Recognize the Lord of Death as your own projection, and you're free.",
 mean:"The worst fear is that something will destroy us. The book's answer is startling: the thing that's afraid is not the kind of thing that can be destroyed. Fear is real, but its target isn't.",
 try:"When you feel threatened today, ask: what exactly could be harmed here?",
 sit:"Breathe into the space around your fear, not the fear itself."},
{p:3,t:'One Good Thought',
 book:"The book stresses that the mind in this bardo is light and easily turned. A single moment of faith, kindness or clear recognition can change the direction of everything.",
 mean:"This is the hopeful heart of the becoming chapter. You don't need a lifetime of perfect behavior; one sincere turn of mind counts. That's true now too: one good thought can redirect a whole day.",
 try:"When your day goes sideways, try one deliberately kind thought and watch where it takes you.",
 sit:"Make one wish for someone's happiness. Let that be the whole minute."},
{p:3,t:'Signs of the Higher Realms',
 book:"As you drift, you glimpse where you might land. Jewel palaces signal the gods. Pleasant forests and wheels of fire signal the jealous gods. Ordinary houses signal human life.",
 mean:"These are the comfortable destinations, and the book still says don't rush in. Even good places are temporary if you enter them out of habit. A human life, though, is praised: it's the one realm where waking up is easiest.",
 try:"Appreciate one ordinary human thing today: a kitchen, a conversation, a bus ride.",
 sit:"Think of the fact that you are here, now, with a mind that can wonder about all this."},
{p:3,t:'Signs of the Lower Realms',
 book:"Caves, burrows and huts signal the animal realm. Tree stumps, dark forests and barren plains signal the hungry ghosts. Black and red lands, or strange songs, can draw you toward the hells.",
 mean:"The lower realms are moods taken to the extreme: dullness, craving and hatred. They feel like shelters at first, a cozy cave, a familiar desert. The book says: don't go in, even if the storm is loud.",
 try:"Notice the mood you retreat into when things get hard. Name it, gently.",
 sit:"Picture a cave entrance. Choose not to go in. Stay in the open air."},
{p:3,t:'Closing the Door: The Sacred',
 book:"When you're drawn toward a couple, the book offers ways to close the door to rebirth. The first: picture a sacred figure, your yidam or teacher, and keep that image vivid.",
 mean:"Whatever fills your mind decides where you go. Holding something sacred in view crowds out the pull of habit. It doesn't have to be religious; it can be anything that represents your best self.",
 try:"Choose one image that represents who you want to be. Bring it to mind three times today.",
 sit:"Hold that image clearly in your mind for one minute."},
{p:3,t:'Closing the Door: Teachers in Disguise',
 book:"The second and third methods: see the couple as your teacher and their partner, and let go of both attraction and jealousy toward them.",
 mean:"The pull toward rebirth runs on attraction to one parent and jealousy of the other. Seeing them as teachers changes the relationship from grasping to respect. It works on ordinary jealousies too.",
 try:"Think of someone who triggers your jealousy. Ask what they might be teaching you.",
 sit:"Picture two people you have strong feelings about. Wish them both well, equally."},
{p:3,t:'Closing the Door: Like a Dream',
 book:"The fourth method: recognize that everything appearing is illusion, like a dream, a mirage or a reflection of the moon in water.",
 mean:"This doesn't mean nothing matters. It means nothing is as solid as it seems, so nothing has quite the grip on you it claims to. Lucid dreamers know the feeling: once you know it's a dream, you're free inside it.",
 try:"Three times today, ask yourself: is this a dream? Look around as if it might be.",
 sit:"Imagine everything around you as a reflection on water. Beautiful, and not quite solid."},
{p:3,t:'Closing the Door: The Clear Light',
 book:"The fifth and deepest method: rest in the Clear Light, the mind's own nature, without grasping at anything. If you can do this, the door closes by itself.",
 mean:"Every method in the book comes back to the first teaching. The Clear Light was there at the start and it's still there at the end. Nothing in between has stained it.",
 try:"Find one moment of open, unoccupied awareness today. Waiting in line counts.",
 sit:"Don't do anything. Don't stop anything. Rest as the awareness that knows this minute."},
{p:3,t:'Choosing a Door',
 book:"If you can't close the door, the book says choose well: avoid births driven by fear or craving, and with a mind of compassion choose a birth where you can keep learning and helping others. It gives signs for good and bad birthplaces.",
 mean:"Not the fanciest house; the kindest one. The motivation you bring into a new beginning shapes everything after it. This applies to new jobs, homes and relationships just as much.",
 try:"Before you start anything new today, set one kind intention for it.",
 sit:"Imagine walking through a doorway into a new chapter. What do you want to bring with you?"},
{p:3,t:'Pure Lands',
 book:"The best choice of all, the book says, is not to be reborn in the six realms at all but in a pure land, such as Amitabha's Land of Bliss, by wishing for it with full sincerity.",
 mean:"A pure land is a world shaped by an awakened mind, where everything supports waking up. You can glimpse one in life: any place, any company, where it's easier to be your best self.",
 try:"Make one corner of your life a little pure land today: tidy a desk, light a candle, put the phone in another room.",
 sit:"Imagine a place where everything helps you be kind and clear. Rest there."},
{p:3,t:'The Forty-Ninth Day',
 book:"Tradition says rebirth happens by the forty-ninth day. Families still mark it with prayers and offerings, and the reading is complete. The book ends by encouraging people to read it often, so that its words are ready when they're needed.",
 mean:"You've walked the whole journey: dying, the lights, the fierce ones, the drift, and the door. None of it is only about the end. Every day has had a little dying in it, a little light, a little choosing. That's the practice.",
 try:"Read one passage from these forty-nine days aloud, to yourself or to someone else. Liberation through hearing.",
 sit:"Sit for one minute in gratitude for having been here at all."}
];

/* ---------- what you DO on each day ---------- */
const REALM_INFO={
  gods:{name:'the god realm',why:'pleasant, proud, and asleep'},
  jealous:{name:'the jealous gods',why:'always comparing, always fighting'},
  humans:{name:'the human realm',why:'busy, wanting, and still able to wake up'},
  animals:{name:'the animal realm',why:'warm, dim, and not asking questions'},
  ghosts:{name:'the hungry ghosts',why:'starving, and never satisfied'},
  hells:{name:'the hell realm',why:'anger, made into a place'}
};
const ACTS=[
/* 1 */ {k:'listen', ask:"Close your eyes if you like. Somewhere in these sounds is a bell. Tap the moment you hear it.", miss:"Not that one. Keep listening.", done:"You heard it. That's the whole method: the right sound, recognized at the right moment."},
/* 2 */ {k:'gap', ask:"Breathe with the circle. At the bottom of each out-breath there's a pause. Tap inside the pause, three times.", early:"Not yet. Wait for the stillness at the bottom.", done:"Three gaps. Once you look, they're everywhere. That's where the book says change can happen."},
/* 3 */ {k:'release', items:['cup','keys','phone','frame','house'], ask:"Your hands are full. Tap each thing to let it go.", done:"Empty hands. Nothing was taken from you. You just stopped holding on."},
/* 4 */ {k:'dissolve', from:'earth', to:'water', ask:"Earth dissolves first. Press and hold, and let the body grow heavy.", early:"No rush. Hold again, and let it sink.", done:"The solid part has let go. The inner sign is a mirage, shimmering like heat on a road."},
/* 5 */ {k:'dissolve', from:'water', to:'fire', ask:"Now water. Press and hold, and let everything wet dry up.", early:"Stay with it. Hold again.", done:"The feelings that moved like water have moved on. The inner sign is smoke."},
/* 6 */ {k:'dissolve', from:'fire', to:'air', ask:"Now fire. Press and hold, and let the warmth pull back toward the heart.", early:"Let it go slowly. Hold again.", done:"The warmth has gathered in the heart. The inner sign is sparks, like fireflies."},
/* 7 */ {k:'dissolve', from:'air', to:'light', ms:7000, ask:"Last, the breath. Press and hold for one long, slow out-breath. Longer than you need.", early:"Longer. Let the whole breath leave.", done:"The outer breath has stopped. The inner sign is a flickering lamp. Something is still awake."},
/* 8 */ {k:'drops', ask:"The white drop from your father waits at the crown. Tap it, and let it fall.", ask2:"The red drop from your mother waits at the navel. Tap it, and let it rise.", done:"They meet at the heart. For a moment there's only black, like a sky with no stars. Then it opens."},
/* 9 */ {k:'still', art:'clear', ms:15000, ask:"The Clear Light is dawning. Don't reach for it. Don't move. Just be still and recognize it.", again:"You reached for it. That's the grip, the clinging. Let go, and be still again.", done:"That's it. There was nothing to grab. It was never out there. It's what you are."},
/* 10 */ {k:'bubbles', words:['what about me?','me','mine','but I…','my turn','what do I get?','me again','am I okay?'], need:7, ask:"Watch the mind. Every time a little 'what about me?' pops up, tap it. Just count.", done:"Seven, and that was only a minute. No judgment. That small voice is why almost everyone misses the light."},
/* 11 */ {k:'choose', missFirst:true, bright:'#FFFFFF', dull:'#7C7A70', realm:null, brightLabel:'The second light', dullLabel:'Drift back to sleep', ask:"The first light went by while you were busy. Here's the second. It's a little dimmer. Which way?", dullReply:"You drifted. The book is patient: it just says, then here's the next chance. Again.", done:"You caught the second one. There's almost always a second one."},
/* 12 */ {k:'bubbles', words:["Can't you hear me?","I'm still here!","Listen to me","You don't understand","Look at me","It's me!"], need:6, letgo:true, ask:"Your family is crying and can't hear you. Every time you want to be understood, tap the words and let them go.", done:"Nobody heard. And you're alright. You didn't need them to."},
/* 13 */ {k:'mirror', show:'empty', ask:"Wipe the mist from the mirror. Drag across it.", done:"No reflection. Behind you, no footprints in the sand. Nothing to check yourself against anymore. That's the sign."},
/* 14 */ {k:'still', art:'roar', ms:13000, ask:"The roar is coming: thunder, wind, a thousand voices. Stand still for three breaths. Don't run.", again:"You ran. Everyone does at first. Stand still again.", done:"Three breaths. The roar is the sound of your own mind. It can't knock you over."},
/* 15 */ {k:'pick', ask:"Five poisons, five colors. Which one is loudest in you right now? There's no wrong answer.", opts:[
  ['#1F7AC7','Dullness','Dullness is the fog of not wanting to look. On the first day the blue light cuts straight through it. Notice it, and look anyway.'],
  ['#FFFFFF','Anger','Anger feels like clarity, but it is clarity with the volume too high. The white light is the same clarity, without the burn.'],
  ['#F2B640','Pride','Pride ranks everything. The yellow light shows everything as equally rich, you included, nobody first.'],
  ['#D8412F','Wanting','Wanting reaches and never quite lands. The red light is the same warmth, without the grabbing.'],

  const n=actx.sampleRate*2; nBuf=actx.createBuffer(1,n,actx.sampleRate); bBuf=actx.createBuffer(1,n,actx.sampleRate);
  const w=nBuf.getChannelData(0), b=bBuf.getChannelData(0); let l=0; for(let i=0;i<n;i++){ const r=Math.random()*2-1; w[i]=r; l=(l+.02*r)/1.02; b[i]=l*3.5; } }
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{ if(actx&&actx.state!=='running') try{ actx.resume(); }catch(e){} },{capture:true,passive:true}));
const T=()=>actx.currentTime;
function aEnv(g,t,p,a,d){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(p,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d); }

function tone(fr,{type='sine',peak=.12,a=.01,d=2,at=0}={}){ if(!actx) return; const t=T()+at; const o=actx.createOscillator(); o.type=type; o.frequency.value=fr; const g=actx.createGain(); aEnv(g,t,peak,a,d); o.connect(g).connect(mstr); o.start(t); o.stop(t+a+d+.1); }

function loopLevel(name,v,s=.6){ const L=LOOPS[name]; if(!L) return; const g=L.g.gain; g.cancelScheduledValues(T()); g.setValueAtTime(Math.max(g.value,.0001),T()); g.linearRampToValueAtTime(Math.max(v,.0001),T()+s); }
