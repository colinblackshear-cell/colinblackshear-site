function allOff(f=1.2){ Object.keys(LOOPS).forEach(k=>loopOff(k,f)); clearInterval(drumT); drumT=null; }
function pad(name,freqs,vol){ loopOn(name,g=>{ const out=[]; freqs.forEach((fr,i)=>{ const o=actx.createOscillator(); o.frequency.value=fr; o.detune.value=i%2?4:-4; const tg=actx.createGain(); tg.gain.value=.5; const l=actx.createOscillator(); l.frequency.value=.11+i*.07; const lg=actx.createGain(); lg.gain.value=.35; l.connect(lg).connect(tg.gain); o.connect(tg).connect(g); o.start(); l.start(); out.push(o,l); }); return out; },vol,4); }
function noiseLoop(name,type,freq,vol,buf){ loopOn(name,g=>{ const s=actx.createBufferSource(); s.buffer=buf||bBuf; s.loop=true; const f=actx.createBiquadFilter(); f.type=type; f.frequency.value=freq; s.connect(f).connect(g); s.start(); LOOPS_F[name]=f; return [s]; },vol,1.5); }
const LOOPS_F={};
function bowl(f=196,v=.18){ if(!actx) return; [1,2.76,5.4].forEach((k,i)=>tone(f*k,{peak:v/(i+1.4),a:.01,d:6-i*1.5})); }
function chime(){ [523.25,659.25,783.99,1046.5,1318.5].forEach((fr,i)=>tone(fr,{peak:.1,d:3,at:i*.14})); }
function bellTone(){ [880,1760*1.003,2640*1.01].forEach((fr,i)=>tone(fr,{peak:.16/(i+1),d:3.5})); }
function plop(){ tone(420,{type:'triangle',peak:.12,d:.25}); nz({freq:900,type:'bandpass',peak:.05,d:.08}); }
function whoosh(v=.14){ if(!actx) return; const t=T(); const s=actx.createBufferSource(); s.buffer=nBuf; const f=actx.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.2; f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(2600,t+.55); const g=actx.createGain(); aEnv(g,t,v,.2,.45); s.connect(f).connect(g).connect(mstr); s.start(t,Math.random()); s.stop(t+.8); }
let drumT=null;
function drum(v=.5){ if(!actx) return; const t=T(); const o=actx.createOscillator(); o.frequency.setValueAtTime(90,t); o.frequency.exponentialRampToValueAtTime(40,t+.25); const g=actx.createGain(); aEnv(g,t,v,.004,.35); o.connect(g).connect(mstr); o.start(t); o.stop(t+.4); nz({type:'lowpass',freq:500,peak:v*.3,d:.12}); }
/* breath you can control: in while held, out when released */
let inhaleN=null;
function inhaleStart(){ if(!actx) return; const t=T(); const s=actx.createBufferSource(); s.buffer=nBuf; s.loop=true; const f=actx.createBiquadFilter(); f.type='bandpass'; f.Q.value=.7; f.frequency.setValueAtTime(700,t); f.frequency.linearRampToValueAtTime(1700,t+4);
  const g=actx.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.32,t+1.2); g.gain.exponentialRampToValueAtTime(.12,t+4.5); s.connect(f).connect(g).connect(mstr); s.start(t,Math.random()); inhaleN={s,g}; }
function exhale(dur=4){ if(!actx) return; if(inhaleN){ const {s,g}=inhaleN; inhaleN=null; g.gain.cancelScheduledValues(T()); g.gain.setValueAtTime(Math.max(g.gain.value,.0001),T()); g.gain.exponentialRampToValueAtTime(.0001,T()+.25); setTimeout(()=>{ try{ s.stop(); }catch(e){} },400); }
  const t=T(); [['bandpass',1400,.7,.4,700],['lowpass',420,.5,.28,300]].forEach(([ty,fr,q,p,f2])=>{ const s=actx.createBufferSource(); s.buffer=nBuf; s.loop=true; const f=actx.createBiquadFilter(); f.type=ty; f.Q.value=q; f.frequency.setValueAtTime(fr,t); f.frequency.linearRampToValueAtTime(f2,t+dur);
    const g=actx.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(p,t+.35); g.gain.exponentialRampToValueAtTime(p*.3,t+dur*.7); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(f).connect(g).connect(mstr); s.start(t,Math.random()); s.stop(t+dur+.1); }); }
const PARTKEY=[[196,246.9,293.7],[146.8,220,293.7],[110,164.8,220],[174.6,220,261.6]];

/* ---------------- narrator ---------------- */
let voiceOn=('speechSynthesis' in window), nVoice=null;
try{ const v=localStorage.getItem('fortynine-voice'); if(v==='0') voiceOn=false; }catch(e){}
function vScore(v){ let n=0; const nm=v.name.toLowerCase(); if(/natural|neural|premium|enhanced|siri/.test(nm)) n+=50; if(/online/.test(nm)) n+=20; if(/en-gb/i.test(v.lang)) n+=15; else if(/^en/i.test(v.lang)) n+=8; else n-=100;
  if(/daniel|arthur|george|ryan|thomas|oliver|guy|libby|sonia|serena|kate|martha|google uk english male/.test(nm)) n+=10; if(/compact|espeak|zarvox|trinoids|albert|bad news|bells|boing|bubbles|cellos|whisper|jester|organ|superstar|wobble|fred|junior|ralph/.test(nm)) n-=60; return n; }
function pickVoice(){ if(!('speechSynthesis' in window)) return; const vs=speechSynthesis.getVoices(); if(vs.length) nVoice=vs.slice().sort((a,b)=>vScore(b)-vScore(a))[0]; }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function narrate(text){ return new Promise(res=>{ if(!voiceOn||!('speechSynthesis' in window)) return res(false); try{ speechSynthesis.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(text.replace(/[“”]/g,'"')); if(nVoice) u.voice=nVoice; u.rate=.86; u.pitch=.92; let ok=true; const fin=()=>{ if(ok){ ok=false; res(true); } };
  u.onend=fin; u.onerror=fin; setTimeout(fin, 2500+text.length*95); speechSynthesis.speak(u); }); }
function hush(){ try{ speechSynthesis.cancel(); }catch(e){} }

/* ---------------- the walk: one journey through all 49 days ---------------- */
const STEPS=['Wk 1','Wk 2','Wk 3','Wk 4','Wk 5','Wk 6','Wk 7'];
const WKEY='fortynine-walk';
let SS=null;
class Abort extends Error{}
function alive(s){ if(!SS||SS!==s) throw new Abort(); }
function getNext(){ try{ return +(JSON.parse(localStorage.getItem(WKEY)||'{}').next||0); }catch(e){ return 0; } }
function setNext(n){ try{ localStorage.setItem(WKEY,JSON.stringify({next:n})); }catch(e){} }
function setDay(s,n){ s.n=n; s.D=DAYS[n-1]; s.P=PARTS[s.D.p]; s.A=ACTS[n-1]; s.el.style.setProperty('--c',s.P.col);
  $('#stitle').innerHTML=`<b>Day ${n}</b> ${esc(s.D.t)}`; s.el.setAttribute('aria-label',`The Forty-Nine Day Walk, day ${n}: ${s.D.t}`); }
function openSession(n){
  aInit(); hush();
  const el=document.createElement('div'); el.className='session'; el.id='session'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true');
  el.innerHTML=`<div class="sbar"><span class="stitle" id="stitle"></span><span class="sp"></span>
      <button type="button" class="sbtn" id="svoice" aria-pressed="${voiceOn}">${voiceOn?'Narrator on':'Narrator off'}</button>
      <button type="button" class="sbtn" id="ssound" aria-pressed="${soundOn}">${soundOn?'Sound on':'Sound off'}</button>
      <button type="button" class="sbtn x" id="sclose" aria-label="Stop here and return to the map">✕</button></div>
    <ol class="steps" aria-label="Weeks of the walk">${STEPS.map((s,i)=>`<li data-i="${i}">${s}</li>`).join('')}</ol>
    <div class="stage" id="stage"><svg id="art" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label=""></svg><canvas id="cv" aria-hidden="true"></canvas><div id="layer"></div></div>
    <div class="scap" id="scap" aria-live="polite"><span class="seye" id="seye"></span><p id="stext"></p><div class="srow" id="srow"></div></div>`;
  document.body.appendChild(el); document.body.classList.add('insession');
  const s={el}; SS=s; setDay(s,n);
  $('#sclose').onclick=()=>closeSession();
  $('#svoice').onclick=e=>{ voiceOn=!voiceOn; if(!voiceOn) hush(); e.target.textContent=voiceOn?'Narrator on':'Narrator off'; e.target.setAttribute('aria-pressed',voiceOn); try{ localStorage.setItem('fortynine-voice',voiceOn?'1':'0'); }catch(x){} };
  $('#ssound').onclick=e=>{ soundOn=!soundOn; if(mstr) mstr.gain.value=soundOn?.9:0; e.target.textContent=soundOn?'Sound on':'Sound off'; e.target.setAttribute('aria-pressed',soundOn); };
  el.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSession(); });
  journey(s,n).catch(e=>{ if(!(e instanceof Abort)) console.error(e); });
  $('#sclose').focus({preventScroll:true});
}
function closeSession(){ const s=SS; SS=null; hush(); if(actx) allOff(.8); if(inhaleN){ try{ inhaleN.s.stop(); }catch(e){} inhaleN=null; } stopWatch(); if(s){ s.el.remove(); } document.body.classList.remove('insession'); cvStop(); render(); }
function stepTo(i){ document.querySelectorAll('.steps li').forEach((li,k)=>{ li.className=k<i?'done':k===i?'on':''; if(k===i) li.setAttribute('aria-current','step'); else li.removeAttribute('aria-current'); }); }
function art(svg,label=''){ const a=$('#art'); a.classList.remove('morphd'); a.innerHTML=svg; a.setAttribute('aria-label',label); }
const layer=()=>$('#layer');
function clearLayer(){ layer().innerHTML=''; }
function eyebrow(t){ $('#seye').textContent=t||''; }
async function line(s,text,{tap=true,eye}={}){ alive(s); if(eye!==undefined) eyebrow(eye); const p=$('#stext'), row=$('#srow'); row.innerHTML=''; p.textContent='';
  let skip=false; const sk=()=>{ skip=true; }; $('#scap').addEventListener('pointerdown',sk,{once:true});
  const spoke=narrate(text);
  for(let i=1;i<=text.length;i++){ if(skip||reduceM){ p.textContent=text; break; } p.textContent=text.slice(0,i); await sleep(text[i-1]===' '?18:24); alive(s); }
  if(!tap) return spoke;
  await waitTap(s, voiceOn?spoke:null); }
function waitTap(s, spoke){ return new Promise((res,rej)=>{ const row=$('#srow'); row.innerHTML=`<button type="button" class="sgo" id="sgo">Continue <span aria-hidden="true">→</span></button>`;
  const b=$('#sgo'); let done=false; const go=()=>{ if(done) return; done=true; hush(); document.removeEventListener('keydown',kd); row.innerHTML=''; if(SS!==s) return rej(new Abort()); res(); };
  const kd=e=>{ if((e.key===' '||e.key==='Enter'||e.key==='ArrowRight') && !e.target.closest('.sbar,#layer button')){ e.preventDefault(); go(); } };
  b.onclick=go; document.addEventListener('keydown',kd); b.focus({preventScroll:true});
  if(spoke) spoke.then(ok=>{ if(ok) setTimeout(go,1100); }); }); }
function prompt(text,eye){ eyebrow(eye??$('#seye').textContent); $('#stext').textContent=text; $('#srow').innerHTML=''; narrate(text); }
function sentences(t){ const parts=t.match(/[^.!?]+[.!?]+["”']?\s*|[^.!?]+$/g)||[t]; const out=[]; let cur=''; parts.forEach(x=>{ if((cur+x).length>190&&cur){ out.push(cur.trim()); cur=x; } else cur+=x; }); if(cur.trim()) out.push(cur.trim()); return out; }

/* the path of 49 stones: seven rows, walked back and forth */
function stonePos(i){ const r=Math.floor(i/7), c=i%7, cc=r%2?6-c:c; return [90+cc*70, 52+r*44]; }
function pathArt(n,{label=true}={}){ let d='', st='';
  for(let i=0;i<49;i++){ const [x,y]=stonePos(i); d+=(i?' L':'M')+x+' '+y; }
  for(let i=0;i<49;i++){ const [x,y]=stonePos(i); const col=PARTS[DAYS[i].p].col; const cur=i===n-1;
    st+= cur? `<circle cx="${x}" cy="${y}" r="20" fill="${col}" opacity=".35"><animate attributeName="r" values="14;24;14" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="${x}" cy="${y}" r="11" fill="${col}" stroke="#FFF6DE" stroke-width="3"/>`
      : `<circle cx="${x}" cy="${y}" r="${i<n-1?8:6}" fill="${i<n-1?col:'#10181B'}" stroke="${col}" stroke-width="2.5" opacity="${i<n-1?1:.6}"/>`; }
  return `<rect width="600" height="400" fill="#10181B"/><path d="${d}" fill="none" stroke="#FFF6DE" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity=".35"/>${st}`; }

async function journey(s,start){
  /* arrive once, at the start of the walk */
  setNext(start); pad('pad',PARTKEY[s.D.p],.03); s.part=s.D.p; stepTo(Math.floor((start-1)/7));
  await arrive(s,start);
  for(let n=start;n<=49;n++){
    alive(s); setDay(s,n); setNext(n); stepTo(Math.floor((n-1)/7));
    if(s.D.p!==s.part){ loopOff('pad',2); setTimeout(()=>{ if(SS===s) pad('pad',PARTKEY[s.D.p],.03); },1800); s.part=s.D.p;
      art(pathArt(n),'The path'); await line(s,`${PARTS[s.D.p].name}. ${PARTS[s.D.p].sub}.`,{eye:'A new stretch of the path'}); }
    /* the day card: the path, with today's stone lit */
    art(pathArt(n),`Day ${n} of 49`); eyebrow(`Day ${n} of 49 · ${PARTS[s.D.p].name}`);
    const sp=await line(s,`Day ${n}. ${s.D.t}.`,{tap:false}); await Promise.race([sp,sleep(2600)]); await sleep(500); alive(s);
    const sc=SCENES[s.A.k]||SCENES.generic; art(sc.before(s),s.D.t);
    await line(s,sentences(s.D.book)[0],{eye:'What the book says'});
    eyebrow('Try it'); await sc.act(s); alive(s); clearLayer(); stopWatch();
    await line(s,s.A.done,{eye:'Try it'});
    art(sc.after?sc.after(s):sc.before(s),s.D.t);
    await line(s,sentences(s.D.mean)[0],{eye:'What it means'});
    if(n%7===0){ await sit(s); await weekCarry(s, n/7); }
    setNext(n<49?n+1:0);
  }
  await finale(s);
}

async function weekCarry(s,w){
  const days=DAYS.slice((w-1)*7,w*7);
  art(`<rect width="600" height="400" fill="#10181B"/><circle cx="300" cy="200" r="230" fill="${s.P.col}" opacity=".12"/>`,'Seven things to carry');
  layer().innerHTML=`<div class="carrylist" id="clist"><b>Week ${w}: seven things to carry</b><ol>${days.map((d,i)=>`<li><span>Day ${(w-1)*7+i+1}</span> ${esc(d.try)}</li>`).join('')}</ol></div>`;
  await line(s,`That's week ${w}. Here are seven small practices from it. You don't need to remember them all. Pick the one that tugs at you.`,{eye:`Week ${w} complete`,tap:false});
  await holdBtn(s,{label:'Hold to take them with you',ms:1500,col:s.P.col,onP:p=>{ const c=$('#clist'); if(c) c.style.transform=`scale(${1-p*.05})`; }});
  alive(s); const c=$('#clist'); if(c){ c.classList.add('taken'); } whoosh(.12); setTimeout(chime,600); await sleep(1000); alive(s); clearLayer();
  if(w===7) return;
  eyebrow(`Week ${w} complete`); $('#stext').textContent=`${7-w} week${7-w>1?'s':''} left on the path. Keep walking, or rest and come back to it. It will remember where you are.`;
  $('#srow').innerHTML=`<button type="button" class="sgo alt" id="srest">Rest here</button><button type="button" class="sgo" id="skeep">Keep walking <span aria-hidden="true">→</span></button>`; $('#skeep').focus({preventScroll:true});
  const keep=await new Promise(r=>{ $('#skeep').onclick=()=>r(true); $('#srest').onclick=()=>r(false); }); alive(s);
  if(!keep){ setNext(w*7+1); closeSession(); throw new Abort(); }
}

async function finale(s){ setNext(0); loopOff('pad',2); setTimeout(()=>{ if(SS===s) pad('pad',[146.8,220,293.7,440],.03); },1500);
  art(pathArt(50)+`<g class="spin" style="transform-origin:300px 200px">${rays(300,200,500,30,.06)}</g>`,'The whole path, walked');
  await line(s,"Forty-nine days. Dying, the lights, the fierce ones, the drift, and the doors. You've walked the whole way.",{eye:'The end of the path'});
  await line(s,"The book was always meant for the living. It only works if the words are familiar before you need them. Now they are.",{eye:'The end of the path'});
  await line(s,"If you remember one thing: whatever appears, bright or terrifying, it is your own mind. Recognize it, and let go.",{eye:'The end of the path'});
  bowl(196,.2); setTimeout(()=>bowl(293.7,.12),900);
  eyebrow('The end of the path'); $('#stext').textContent='Thank you for walking it. Maybe someday you\'ll read it to someone.';
  $('#srow').innerHTML=`<button type="button" class="sgo" id="sdone">Back to the map</button>`; $('#sdone').onclick=()=>closeSession(); $('#sdone').focus({preventScroll:true});
}

/* --- 1. arrive: three breaths you control --- */
async function arrive(s,n){
  const {D,P}=s;
  art(`<rect width="600" height="400" fill="#10181B"/><circle cx="300" cy="200" r="150" fill="${P.col}" opacity=".12"/><g id="bc" style="transform-origin:300px 200px;transform:scale(.45)"><circle cx="300" cy="200" r="120" fill="none" stroke="${P.col}" stroke-width="6"/><circle cx="300" cy="200" r="120" fill="${P.col}" opacity=".18"/><circle cx="300" cy="200" r="20" fill="#FFF6DE"/></g><text x="300" y="372" text-anchor="middle" font-family="Jost,sans-serif" font-weight="700" font-size="15" letter-spacing="4" fill="#FFF6DE" opacity=".7">${n>1?'DAY '+n+' OF 49':'FORTY-NINE DAYS'}</text>`,'A breathing circle');
  await line(s,n>1?`Welcome back. We pick up the path at day ${n}.`:"The book says the journey between one life and the next takes forty-nine days. We'll walk them together, one stone at a time.",{eye:'The Forty-Nine Day Walk'});
  await line(s,"First, arrive. Press and hold while you breathe in. Let go as you breathe out. Three times.",{tap:false});
  const bc=$('#bc'); let count=0;
  layer().innerHTML=`<button type="button" class="holdzone" id="hz" aria-label="Hold while breathing in, release to breathe out"><span class="holdpill" id="hp">Hold to breathe in</span></button><div class="count" id="bcount" aria-hidden="true"><i></i><i></i><i></i></div>`;
  const hz=$('#hz'), hp=$('#hp'); hz.focus({preventScroll:true});
  await new Promise(res=>{ let t0=0, holding=false;
    const down=e=>{ if(holding) return; e&&e.preventDefault&&e.preventDefault(); holding=true; t0=performance.now(); inhaleStart(); bc.style.transition='transform 5s cubic-bezier(.2,.6,.3,1)'; bc.style.transform='scale(1.05)'; hp.textContent='Breathing in…'; hz.classList.add('on'); };
    const up=()=>{ if(!holding) return; holding=false; const held=performance.now()-t0; const dur=Math.max(2.5,Math.min(6,held/1000*1.3)); exhale(dur); bc.style.transition=`transform ${dur}s ease-in-out`; bc.style.transform='scale(.45)'; hz.classList.remove('on');
      if(held>900){ count++; document.querySelectorAll('#bcount i')[count-1].className='on'; } hp.textContent=count>=3?'…':(held>900?'And out… hold again to breathe in':'A little longer. Hold while you breathe in');
      if(count>=3){ hz.disabled=true; setTimeout(res, dur*800); } };
    hz.addEventListener('pointerdown',e=>{ hz.setPointerCapture&&hz.setPointerCapture(e.pointerId); down(e); });
    ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>hz.addEventListener(ev,up));
    hz.addEventListener('keydown',e=>{ if((e.key===' '||e.key==='Enter')&&!e.repeat){ e.preventDefault(); down(); } });
    hz.addEventListener('keyup',e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); up(); } });
    hz.addEventListener('click',e=>e.preventDefault());
  });
  alive(s); clearLayer(); bowl(K0(s));
  await line(s,"Good. You're here.",{});
}
const K0=s=>PARTKEY[s.D.p][0];

/* --- hold helper: press-and-hold with progress ring; drains if released --- */
/* the sound of a press and hold: a soft hum that climbs an octave as the ring fills, a bell when it's full */
function holdHum(c,dest,ms,p0=0){ if(!c||!dest) return {stop(){}}; const t=c.currentTime,s=Math.max(.05,ms*(1-p0)/1000),g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.08,t+.25); g.connect(dest);
  const os=[[1,-5],[1.5,4],[2,0]].map(([k,dt],i)=>{ const o=c.createOscillator(); o.type=i?'sine':'triangle'; o.detune.value=dt; o.frequency.setValueAtTime(196*k*Math.pow(2,p0),t); o.frequency.exponentialRampToValueAtTime(392*k,t+s); const og=c.createGain(); og.gain.value=[.6,.25,.15][i]; o.connect(og).connect(g); o.start(t); return o; });
  return {stop(full){ const n=c.currentTime; g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(Math.max(g.gain.value,.0001),n); g.gain.exponentialRampToValueAtTime(.0001,n+(full?.6:.18)); if(!full) os.forEach(o=>{ o.frequency.cancelScheduledValues(n); o.frequency.setValueAtTime(o.frequency.value,n); o.frequency.exponentialRampToValueAtTime(o.frequency.value*.8,n+.18); }); os.forEach(o=>o.stop(n+.7));
    if(full) [784,1568*1.003,2352*1.01].forEach((fr,i)=>{ const o=c.createOscillator(),bg=c.createGain(); o.frequency.value=fr; bg.gain.setValueAtTime(.0001,n); bg.gain.exponentialRampToValueAtTime(.08/(i+1),n+.005); bg.gain.exponentialRampToValueAtTime(.0001,n+3); o.connect(bg).connect(dest); o.start(n); o.stop(n+3.1); }); }}; }
function holdBtn(s,{label,ms,onP,early,col='#E8B13A'}){ return new Promise(res=>{
  layer().insertAdjacentHTML('beforeend',`<button type="button" class="holdzone" id="hz" aria-label="${label}"><span class="holdpill"><svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="rgba(30,42,43,.2)" stroke-width="4"/><circle id="hring" cx="18" cy="18" r="15" fill="none" stroke="${col}" stroke-width="4" stroke-dasharray="94.2" stroke-dashoffset="94.2" transform="rotate(-90 18 18)"/></svg><span id="hlab">${label}</span></span></button>`);
  const b=$('#hz'), ring=$('#hring'); let p=0, holding=false, last=performance.now(), raf=0, fin=false, warned=false, hm=null;
  const tick=()=>{ if(SS!==s){ cancelAnimationFrame(raf); return; } const nw=performance.now(), dt=nw-last; last=nw;
    p=holding? Math.min(1,p+dt/ms) : Math.max(0,p-dt/(ms*1.6)); ring.setAttribute('stroke-dashoffset',(94.2*(1-p)).toFixed(1)); onP&&onP(p,holding);
    if(p>=1&&!fin){ fin=true; if(hm){ hm.stop(true); hm=null; } b.remove(); res(); return; } raf=requestAnimationFrame(tick); };
  const down=e=>{ e&&e.preventDefault&&e.preventDefault(); holding=true; b.classList.add('on'); aInit(); if(!hm) hm=holdHum(actx,mstr,ms,p); };
  const up=()=>{ if(!holding) return; holding=false; if(hm){ hm.stop(false); hm=null; } b.classList.remove('on'); if(p>.08&&p<1&&early&&!warned){ warned=true; prompt(early); setTimeout(()=>warned=false,4000); } };
  b.addEventListener('pointerdown',e=>{ b.setPointerCapture&&b.setPointerCapture(e.pointerId); down(e); });
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,up));
  b.addEventListener('keydown',e=>{ if((e.key===' '||e.key==='Enter')&&!e.repeat){ e.preventDefault(); down(); } });
  b.addEventListener('keyup',e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); up(); } });
  b.addEventListener('click',e=>e.preventDefault()); b.focus({preventScroll:true}); tick(); }); }

/* --- stillness watcher (movement over 40px in half a second, any click or key) --- */
let watchState=null;
function watchStill(onMove){ stopWatch(); const recent=[]; const t0=performance.now();
  const h=e=>{ if(performance.now()-t0<800) return; if(e.target&&e.target.closest&&e.target.closest('.sbar,.chips,#send')) return;
    if(e.type==='pointermove'){ const tn=performance.now(); recent.push([tn,Math.abs(e.movementX||0)+Math.abs(e.movementY||0)]); while(recent.length&&tn-recent[0][0]>500) recent.shift(); if(recent.reduce((x,r)=>x+r[1],0)<40) return; recent.length=0; }
    if(e.type==='keydown'&&e.key==='Escape') return; onMove(); };
  const evs=['pointermove','pointerdown','keydown']; evs.forEach(ev=>addEventListener(ev,h,{capture:true,passive:true}));
  watchState=()=>evs.forEach(ev=>removeEventListener(ev,h,{capture:true})); }
function stopWatch(){ if(watchState){ watchState(); watchState=null; } }

/* --- canvas mandala (for the sit, and for stillness scenes) --- */
let cvRaf=0;
function cvStop(){ cancelAnimationFrame(cvRaf); const c=$('#cv'); if(c){ c.getContext('2d').clearRect(0,0,c.width,c.height); c.style.opacity=0; } }
function cvMandala(pal,seed){ const cv=$('#cv'); cv.style.opacity=1; const g=cv.getContext('2d'); let W=0,H=0,t=0;
  const size=()=>{ const r=cv.getBoundingClientRect(); W=cv.width=Math.max(1,r.width*devicePixelRatio); H=cv.height=Math.max(1,r.height*devicePixelRatio); }; size(); const ro=new ResizeObserver(size); ro.observe(cv);
  const st={bal:.3,alpha:1,r:.42}, tg={...st}; const seeds=Array.from({length:400},(_,i)=>{ const x=Math.sin(i*127.1+seed*3.7)*43758.5453; return x-Math.floor(x); });
  const layers=[{n:8,rad:.18,size:.16,sh:'petal',dir:1},{n:16,rad:.36,size:.14,sh:'petal',dir:-1},{n:24,rad:.54,size:.08,sh:'dot',dir:1},{n:12,rad:.7,size:.2,sh:'lotus',dir:-1},{n:32,rad:.9,size:.06,sh:'dot',dir:1}];
  const petal=(r,s,w)=>{ g.beginPath(); g.moveTo(r-s/2,0); g.bezierCurveTo(r-s/4,-w,r+s/4,-w,r+s/2,0); g.bezierCurveTo(r+s/4,w,r-s/4,w,r-s/2,0); };
  const lotus=(r,s,w)=>{ g.beginPath(); g.moveTo(r-s/2,0); g.quadraticCurveTo(r,-w*1.4,r+s/2,0); g.quadraticCurveTo(r,w*1.4,r-s/2,0); };
  cancelAnimationFrame(cvRaf);
  const draw=()=>{ t+=reduceM?0:.016; for(const k in tg) st[k]+=(tg[k]-st[k])*.03; g.clearRect(0,0,W,H); const R=Math.min(W,H)*st.r, C={x:W/2,y:H/2}; const br=1+.03*Math.sin(t*.8); const imb=1-st.bal;
    const gr=g.createRadialGradient(C.x,C.y,0,C.x,C.y,R*1.15); gr.addColorStop(0,'rgba(255,250,235,.9)'); gr.addColorStop(.4,'rgba(255,248,225,.35)'); gr.addColorStop(1,'rgba(255,248,225,0)'); g.globalAlpha=st.alpha*(.4+.6*st.bal); g.fillStyle=gr; g.beginPath(); g.arc(C.x,C.y,R*1.15,0,7); g.fill();
    let si=0; layers.forEach((L,li)=>{ for(let i=0;i<L.n;i++){ const sd=seeds[(si++)%400]; if(imb>.08&&sd<imb*.5) continue;
      const a=i/L.n*Math.PI*2+t*.1*L.dir+imb*(sd-.5)*1.8; const rr=L.rad*R*br*(1+imb*(sd-.5)); const sz=L.size*R*(1+.12*Math.sin(t*1.5+i));
      g.save(); g.translate(C.x+imb*(sd-.5)*R*.6, C.y+imb*(seeds[(si*7)%400]-.5)*R*.6); g.rotate(a); g.globalAlpha=st.alpha*.92*(1-imb*.4); g.fillStyle=pal[(i+li)%pal.length];
      if(L.sh==='dot'){ g.beginPath(); g.arc(rr,0,sz*.5,0,7); } else if(L.sh==='lotus') lotus(rr,sz,sz*.4); else petal(rr,sz,sz*.32);
      g.fill(); g.lineWidth=1.2*devicePixelRatio; g.strokeStyle='rgba(30,42,43,.5)'; g.stroke(); g.restore(); } });
    g.globalAlpha=st.alpha*.6; g.lineWidth=1.5*devicePixelRatio; g.strokeStyle='rgba(255,246,222,.5)'; [.28,.46,.63,.8,1].forEach((k,i)=>{ if(imb>.35&&i%2) return; g.beginPath(); g.arc(C.x,C.y,k*R*br,0,Math.PI*2*(1-imb*.4*(i%3))); g.stroke(); });
    g.globalAlpha=1; cvRaf=requestAnimationFrame(draw); };
  draw(); return { set(p){ Object.assign(tg,p); }, stop(){ cancelAnimationFrame(cvRaf); ro.disconnect(); } }; }
const PAL=[['#FFFFFF','#F7EFD9','#EBDDB0','#D4A546','#E8B13A'],['#1F4E9A','#3D74C4','#8FC1F0','#FFFFFF','#D4A546'],['#C8372D','#E8B13A','#7A1712','#F3E9D2','#D4A546'],['#2E8B6E','#8FD1B4','#1F4E9A','#F3E9D2','#D4A546']];

/* --- 5. the sit --- */
async function sit(s){
  const {D,P}=s; art(`<rect width="600" height="400" fill="#0E1416"/>`,'A mandala that settles when you are still'); loopLevel('pad',.02);
  await line(s,D.sit,{eye:'Sit'});
  eyebrow('Sit'); $('#stext').textContent='How long would you like to sit?';
  let mins=1; try{ mins=+(localStorage.getItem('fortynine-sit')||1); }catch(e){}
  $('#srow').innerHTML=`<div class="chips" role="group" aria-label="Length of the sit">${[1,3,5].map(m=>`<button type="button" class="chip" data-m="${m}" aria-pressed="${m===mins}">${m} min</button>`).join('')}</div><button type="button" class="sgo alt" id="sskip">Skip the sit</button><button type="button" class="sgo" id="sbeg">Begin the sit</button>`;
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ mins=+c.dataset.m; try{ localStorage.setItem('fortynine-sit',mins); }catch(e){} document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c)); });
  $('#sbeg').focus({preventScroll:true});
  const go=await new Promise(r=>{ $('#sbeg').onclick=()=>r(true); $('#sskip').onclick=()=>r(false); }); alive(s);
  if(!go){ cvStop(); return; }
  const total=mins*60000; const M=cvMandala(PAL[D.p], s.n); M.set({bal:.15});
  $('#stext').textContent='Be still. The mandala settles when you do.'; eyebrow('Sit');
  layer().innerHTML=`<div class="sitring" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,246,222,.12)" stroke-width="2"/><circle id="sarc" cx="50" cy="50" r="46" fill="none" stroke="${P.col}" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="289" transform="rotate(-90 50 50)"/></svg></div><div class="sittime" id="stime" aria-live="off"></div>`;
  $('#srow').innerHTML=`<button type="button" class="sgo alt" id="send">Skip ahead <span aria-hidden="true">→</span></button>`;
  bowl(K0(s)*.5,.22); hush(); setTimeout(()=>{ if(SS===s) narrate('Be still. The mandala settles when you do.'); },1200);
  let acc=0, last=performance.now(), settle=0, early=false; const arc=$('#sarc'), tm=$('#stime');
  $('#send').onclick=()=>{ early=true; };
  watchStill(()=>{ settle=performance.now()+2500; M.set({bal:.15}); $('#stext').textContent='That\'s alright. Settle again.'; });
  await new Promise(res=>{ const tick=()=>{ if(SS!==s) return res(); const nw=performance.now(), dt=nw-last; last=nw;
      if(nw>settle){ acc+=dt; M.set({bal:Math.min(1,.25+acc/Math.min(total,40000)*.75)}); if($('#stext').textContent.startsWith('That')) $('#stext').textContent='Be still. The mandala settles when you do.'; }
      arc.setAttribute('stroke-dashoffset',(289*(1-acc/total)).toFixed(1)); const left=Math.max(0,total-acc)/1000; tm.textContent=`${Math.floor(left/60)}:${String(Math.ceil(left%60)%60===0&&left%60>59.5?0:Math.ceil(left%60)).padStart(2,'0')}`.replace(/:60$/,':00');
      if(acc>=total||early){ res(); return; } setTimeout(tick,100); }; tick(); });
  stopWatch(); alive(s); M.set({bal:1}); clearLayer(); bowl(K0(s)*.5,.22); setTimeout(()=>bowl(K0(s),.12),900);
  await line(s, early? 'Even a little stillness counts.' : 'Well done. Rest here a moment.',{eye:'Sit'});
  M.stop(); cvStop();
}

function doorArt(inner,p,live){ const I={ deity:`<circle cx="300" cy="170" r="50" fill="#1F7AC7"/><circle cx="300" cy="170" r="22" fill="#FFFFFF"/>`, teacher:`${lf(270,250,.6,{stroke:'#1E2A2B'})}${lf(330,250,.6,{stroke:'#1E2A2B'})}`, dream:`${[0,1,2].map(i=>`<circle class="shock" style="animation-delay:${i}s" cx="300" cy="190" r="30" fill="none" stroke="#8C6BC7" stroke-width="3"/>`).join('')}`, light:`<circle cx="300" cy="190" r="70" fill="#FFFFFF"/>` }[inner];
  const w=live?0:p*80; return `<rect width="600" height="400" fill="#1E2A2B"/><rect x="210" y="60" width="180" height="290" fill="#3A2416" stroke="#C98B3A" stroke-width="8"/><rect x="220" y="70" width="160" height="280" fill="#F3E9D2"/><g id="di" opacity="${live?.3:1}">${I}</g><rect id="dl" x="220" y="70" width="${w}" height="280" fill="#8A4B22" stroke="${INK}" stroke-width="3"/><rect id="dr" x="${380-w}" y="70" width="${w}" height="280" fill="#8A4B22" stroke="${INK}" stroke-width="3"/>`; }
function cliffArt(c){ const cols=['#F3F0E8','#C8372D','#151515'];
  return `<rect width="600" height="400" fill="#2B3A44"/><rect x="0" y="290" width="400" height="110" fill="#5E4A3A"/><path d="M400 290 L400 400" stroke="${INK}" stroke-width="4"/><rect x="400" y="300" width="200" height="100" fill="${c>=0?cols[c]:'#1E2A2B'}" opacity=".85"/>${c<0?cols.map((k,i)=>`<rect x="${430+i*55}" y="300" width="40" height="100" fill="${k}"/>`).join(''):''}<g id="cf" transform="translate(120 280)">${lf(0,0,.6)}</g>`; }
function pureLand(){ return `<rect width="600" height="400" fill="#1F4E9A"/><g class="spin" style="transform-origin:300px 170px">${rays(300,170,600,30,.18)}</g><rect y="300" width="600" height="100" fill="#2E8B6E"/>${['lotus','lamp','flower','candle','bell','lotus'].map((k,i)=>`<g transform="translate(${[60,150,250,330,430,500][i]} ${[290,240,200,240,290,220][i]}) scale(.9)">${ICON[k]}</g>`).join('')}${lf(300,300,.6)}`; }
function realmIcon(k){ const I={
  gods:`<polygon points="8,22 20,10 32,22" fill="#F2B640"/><rect x="11" y="21" width="18" height="12" fill="#FBF3DF"/>`,
  jealous:`<circle cx="20" cy="22" r="11" fill="none" stroke="#E8472F" stroke-width="4" stroke-dasharray="4 3"/>`,
  humans:`<polygon points="9,22 20,12 31,22" fill="#5E3318"/><rect x="12" y="22" width="16" height="12" fill="#8A4B22"/><rect x="15" y="25" width="5" height="5" fill="#F2B640"/>`,
  animals:`<ellipse cx="20" cy="24" rx="11" ry="7" fill="#FBF3DF" stroke="${INK}" stroke-width="1.5"/><circle cx="31" cy="18" r="5" fill="#FBF3DF" stroke="${INK}" stroke-width="1.5"/>`,
  ghosts:`<circle cx="20" cy="25" r="10" fill="#D8CFA8" stroke="${INK}" stroke-width="1.5"/><circle cx="20" cy="11" r="4" fill="#D8CFA8" stroke="${INK}" stroke-width="1.5"/>`,
  hells:`<rect x="8" y="14" width="7" height="20" fill="#4A4A4A"/><rect x="17" y="8" width="7" height="26" fill="#7A1712"/><rect x="26" y="16" width="6" height="18" fill="#4A4A4A"/>` };
  return `<rect width="40" height="40" rx="8" fill="#174C50"/>${I[k]}`; }

function render(){
  const nx=getNext(); const resume=nx>1;
  const map=`<svg viewBox="40 20 520 330" role="img" aria-label="A path of forty-nine stones${resume?`, walked as far as day ${nx-1}`:''}">${pathArt(resume?nx:0)}</svg>`;
  const wk=[0,1,2,3,4,5,6].map(w=>{ const a=PARTS[DAYS[w*7].p], b=PARTS[DAYS[w*7+6].p];
    return `<button type="button" class="wk" data-d="${w*7+1}" style="--a:${a.col};--b:${b.col}"><i></i><b>Week ${w+1}</b><span>Days ${w*7+1}–${w*7+7}: ${esc(DAYS[w*7].t)} to ${esc(DAYS[w*7+6].t)}</span></button>`; }).join('');
  const all=PARTS.map((p,pi)=>`<h3 style="color:${p.col}">${esc(p.name)}</h3>`+DAYS.map((d,i)=>d.p!==pi?'':`<p><b>Day ${i+1}. ${esc(d.t)}.</b> ${esc(d.book)} ${esc(d.mean)}</p>`).join('')).join('');
  $('#wrap').innerHTML=`<section class="hero">
      <div><span class="eyebrow">Tibetan Book of the Dead</span><h1>The Forty-Nine Day Walk</h1>
        <p class="lede">The book says the journey between one life and the next takes forty-nine days. Here you walk all of them in one go: dying, the peaceful lights, the fierce ones, and the doors back in.</p>
        <p class="lede">Each day is a short scene you take part in: you face a mask, let something go, choose between two lights. At the end of each week you sit for a minute and take a few small practices with you.</p>
        <div class="cta">${resume?`<button type="button" class="bigbegin" id="go">Continue from day ${nx}</button><button type="button" class="btn" id="fresh">Start from the beginning</button>`:`<button type="button" class="bigbegin" id="go">Begin the walk</button>`}</div>
        <p class="note">About an hour in all, in seven parts of eight or nine minutes. Stop whenever you like. Headphones help, and turn your ringer on.</p></div>
      <div class="map">${map}</div></section>
    <section class="weeks" aria-label="Start at a week"><h2>Or start at any week</h2><div class="wgrid">${wk}</div></section>
    <section class="how"><h2>How the walk works</h2>
      <div><b>Arrive</b><p>Three breaths you control with your finger.</p></div>
      <div><b>Each day</b><p>A line from the book, something to do, and what it means.</p></div>
      <div><b>Each week</b><p>A sit, where the mandala settles only when you're still, and seven practices to carry.</p></div>
      <div><b>The end</b><p>The whole path, walked. No account and nothing to come back for.</p></div></section>
    <details class="all"><summary>Or read all forty-nine days as text</summary>${all}</details>`;
  $('#go').onclick=()=>openSession(resume?nx:1);
  const f=$('#fresh'); if(f) f.onclick=()=>{ setNext(0); openSession(1); };
  document.querySelectorAll('.wk').forEach(b=>b.onclick=()=>openSession(+b.dataset.d));
}
render();
</script>
