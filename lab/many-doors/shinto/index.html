<style>
/* Shared chrome for the Many Doors books. Each book overrides the tokens in its own :root block. Single deliberate light look, like the Bardo series. */
:root{
  color-scheme:light;
  --bg:#F6EBD2; --paper:#FBF3DF; --ink:#1E2A2B; --ink-soft:#4A5754; --accent:#1F5E63; --accent2:#8A4B22; --gold:#E8B13A; --night:#0E1416; --nightink:#FFF6DE;

}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:2px solid var(--ink);background:var(--paper)}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.85rem}
.brand small{display:block;font-weight:500;letter-spacing:.04em;text-transform:none;color:var(--ink-soft);font-size:.78rem;font-family:var(--body)}
.bar .sp{flex:1}
.pill,.tog{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;text-decoration:none;min-height:36px;display:inline-flex;align-items:center}
.tog[aria-pressed="false"]{border-style:dashed;color:var(--ink-soft)}
.btn{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.03em;border:2px solid var(--ink);background:var(--accent);color:var(--paper);border-radius:999px;padding:11px 22px;min-height:48px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--ink)}
.eyebrow{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent2)}
svg text{font-family:var(--display)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- full-screen player (manual and daily session) ---------- */
body.insession{overflow:hidden}
a.sbtn.home{text-decoration:none;display:inline-flex;align-items:center}
body.insession .mdhome{display:none}
.player{position:fixed;inset:0;z-index:50;background:var(--night);color:var(--nightink);display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.player::before{content:"";position:fixed;inset:0;background:radial-gradient(60% 50% at 50% 40%,color-mix(in srgb,var(--c,var(--accent)) 24%,transparent),transparent 70%);pointer-events:none;transition:background 1.5s}
.pbar{position:relative;display:flex;align-items:center;gap:8px;width:100%;max-width:980px;flex-wrap:wrap}
.ptitle{font-family:var(--display);font-weight:700;letter-spacing:.05em;font-size:.9rem;min-width:0;flex:1}

.sbtn{font-family:var(--display);font-weight:700;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid rgba(255,246,222,.45);background:transparent;color:var(--nightink);border-radius:999px;padding:6px 11px;min-height:34px;cursor:pointer}

.steps li.done{border-color:color-mix(in srgb,var(--c,var(--accent)) 70%,#FFF6DE);color:rgba(255,246,222,.7)}

.stage{position:relative;width:min(100%,980px,calc(min(58vh,620px)*1.5));aspect-ratio:3/2;max-width:100%;border-radius:16px;overflow:hidden;border:2px solid rgba(255,246,222,.18);background:#10181B;flex:none}
@media (max-height:700px){.stage{width:min(100%,calc(48vh*1.5))}}
@media (max-width:600px) and (orientation:portrait){.stage{width:100%;aspect-ratio:1/1;max-height:52vh}.sbtn{font-size:.62rem;padding:5px 8px}.ptitle{font-size:.8rem;flex-basis:100%}}
.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .8s}
.layer{position:absolute;inset:0}
.layer:empty{pointer-events:none}
.scap{position:relative;box-sizing:border-box;width:100%;max-width:760px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:14px 18px 12px;min-height:118px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.seye{display:block;font-family:var(--display);font-weight:800;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent2);min-height:1em}
.scap p{margin:4px 0 0;font-size:clamp(1.02rem,2.2vw,1.2rem);line-height:1.45;min-height:2.9em;text-wrap:pretty}
.srow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end;margin-top:8px}

.sgo.alt{background:transparent;color:var(--ink)}
.sgo.wrong{animation:nope .4s}
@keyframes nope{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* interactions on the stage */
.holdzone{position:absolute;inset:0;background:transparent;border:0;padding:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.holdpill{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:8px 16px;font-family:var(--display);font-weight:700;letter-spacing:.05em;font-size:clamp(.74rem,1.8vw,.95rem);white-space:nowrap;transition:transform .3s}
.holdpill svg{width:28px;height:28px;margin-left:-8px}
.holdzone.on .holdpill{transform:translateX(-50%) scale(.95)}
.holdzone:focus-visible .holdpill{outline:3px solid var(--gold);outline-offset:3px}
.spot{position:absolute;transform:translate(-50%,-50%);width:clamp(46px,9%,70px);aspect-ratio:1;border-radius:50%;border:0;background:transparent;cursor:pointer;padding:0}
.spot i{pointer-events:none;position:absolute;inset:18%;border-radius:50%;border:3px solid var(--gold);animation:ping 1.6s ease-out infinite}
.spot b{cursor:pointer;box-shadow:0 3px 0 var(--ink);position:absolute;left:50%;top:100%;transform:translateX(-50%);font-family:var(--display);font-weight:700;font-size:clamp(.6rem,1.5vw,.8rem);background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:2px 9px;white-space:nowrap}
.spot.done{opacity:0;pointer-events:none;transition:opacity .6s}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(1.6);opacity:0}}
.picks{position:absolute;inset:0;display:flex;flex-wrap:wrap;gap:10px;align-content:center;justify-content:center;padding:16px}
.pk{font-family:var(--display);font-weight:700;font-size:clamp(.85rem,2vw,1.05rem);border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:10px 18px;cursor:pointer;min-height:48px;max-width:100%}
.pk.gone{opacity:.25;pointer-events:none}
.duo{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr}
.half{position:relative;border:0;padding:0;margin:0;cursor:pointer;background:#000;overflow:hidden}
.half svg{width:100%;height:100%;display:block;transition:transform .5s}
.half:hover svg,.half:focus-visible svg{transform:scale(1.04)}
.half span{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:700;font-size:clamp(.7rem,1.7vw,.9rem);white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.half+.half{border-left:3px solid var(--night)}
.counter{position:absolute;top:10px;right:14px;font-family:var(--display);font-weight:800;font-size:1.1rem;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums}
.sittime{position:absolute;right:14px;top:10px;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;color:rgba(255,246,222,.75);font-size:.9rem}
.ghost{position:absolute;left:14px;top:8px;background:transparent;border:0;color:rgba(255,246,222,.65);font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;min-height:34px}
.stillbar{position:absolute;left:20%;right:20%;bottom:14px;height:6px;border-radius:3px;background:rgba(255,246,222,.15);overflow:hidden}
.stillbar i{display:block;height:100%;width:0;background:#FFF6DE}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:5;background:var(--paper);color:var(--ink);border:2px solid var(--ink);font-family:var(--display);font-weight:700;font-size:.85rem;padding:7px 14px;border-radius:999px;max-width:calc(100% - 32px);text-align:center;animation:toastin .35s ease}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-8px)}}
.menu{position:absolute;top:46px;right:0;z-index:60;width:min(340px,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:12px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.menu h3{margin:8px 6px 6px;font-family:var(--display);font-weight:800;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent2)}
.menu ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.menu button{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;background:transparent;border:0;border-radius:8px;padding:9px 8px;font-size:.98rem;cursor:pointer;min-height:44px}
.menu button:hover,.menu button:focus-visible{background:var(--bg);outline:none}
.menu button[aria-current="true"]{background:var(--bg);font-weight:700}
.menu small{font-family:var(--display);font-weight:700;font-size:.7rem;letter-spacing:.1em;color:var(--ink-soft);min-width:2.2em;font-variant-numeric:tabular-nums}
.menu p{margin:4px 8px;font-size:.85rem;color:var(--ink-soft)}
.menu .vchips{display:flex;gap:6px;padding:2px 6px 6px}
.menu .vchip{flex:1;justify-content:center;font-family:var(--display);font-weight:700;font-size:.78rem;border:2px solid var(--ink);border-radius:999px;padding:7px 6px;min-height:40px}
.menu .vchip[aria-pressed="true"]{background:var(--accent);color:var(--paper)}

/* svg motion helpers */
.spin{animation:spinr 50s linear infinite}@keyframes spinr{to{transform:rotate(360deg)}}
.flick{animation:fk 1.4s ease-in-out infinite}@keyframes fk{50%{opacity:.55}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flm .6s ease-in-out infinite alternate}@keyframes flm{to{transform:scaleY(1.12) scaleX(.9) skewX(-3deg)}}

/* ---------- landing pages ---------- */
.wrap{max-width:1000px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:center}
h1{margin:6px 0 12px;font-family:var(--display);font-weight:800;font-size:clamp(2rem,5vw,3.1rem);line-height:1.02;text-wrap:balance}
.lede{font-size:1.08rem;margin:0 0 12px;max-width:52ch}
.note{font-size:.88rem;color:var(--ink-soft)}
.cover{background:var(--night);border:2px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 6px 0 var(--ink)}

@media (max-width:560px){ .pbar{gap:5px} .pbar .sbtn{padding:5px 7px;letter-spacing:.04em} .pbar .sbtn.x{width:32px;padding:0} }
.snav{display:flex;align-items:center;gap:10px}
.snav .srow{flex:1}
.snav .pbk{display:none;margin-top:8px;flex:none}
.player.hasback .snav .pbk{display:inline-flex;align-items:center;gap:4px}

/* ---------- journeys: a full-bleed title, then the player at its biggest ---------- */
body.jbody{background:var(--night)}
body.jbody #bar{display:none}
body.jbody .wrap{max-width:none;padding:0}

.jcover{position:absolute;inset:0;width:100%;height:100%;display:block;animation:jzoom 30s ease-out both}

.jback{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:max(14px,env(safe-area-inset-top,0px));z-index:2;font-family:var(--display);font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:8px 14px;text-decoration:none}
.jt{position:relative;z-index:1;width:100%;max-width:980px;margin:0 auto;padding:32vh max(16px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}

.jmeta{margin:16px 0 0;font-size:.85rem;color:rgba(255,246,222,.7)}

.player.jplayer .stage{width:min(100%,1100px,calc(min(64vh,720px)*1.5))}

/* keep 3:2 on phones so tap spots stay on what they point at */
@media (max-width:600px) and (orientation:portrait){.player.jplayer .stage{width:100%;aspect-ratio:3/2;max-height:none}.player.jplayer .scap p{font-size:1.08rem}}
.player.jplayer .scap{min-height:0}
.player.jplayer .scap p{font-size:clamp(1.08rem,2.4vw,1.32rem);min-height:1.5em}
.gnote{margin-right:auto;font-family:var(--display);font-weight:700;font-size:.78rem;letter-spacing:.06em;border:1.5px dashed var(--ink-soft);background:transparent;color:var(--ink-soft);border-radius:999px;padding:7px 12px;min-height:40px;cursor:pointer}
.gnote[aria-expanded="true"]{border-style:solid;color:var(--ink);background:var(--bg)}
.gtext{margin:8px 0 0!important;font-size:.95rem!important;line-height:1.45;color:var(--ink-soft);border-left:3px solid var(--gold);padding-left:10px;min-height:0!important}
a.sgo{text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.jend{position:absolute;inset:auto 0 0 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:stretch;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.7) 40%)}
.jend>span{flex-basis:100%;text-align:center;font-family:var(--display);font-weight:700;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:#FFF6DE}

.jend small{font-family:var(--body);font-weight:400;font-size:.78rem;color:var(--ink-soft)}

/* The Hidden World: washi paper, vermilion, sumi, pine and indigo, with seigaiha waves. */
:root{
  --bg:#F1E9D6; --paper:#FBF8F0; --ink:#1E1C1A; --ink-soft:#4E4840; --accent:#2C3E6B; --accent2:#D2452E; --gold:#C9A23A; --night:#141A26; --nightink:#FBF8F0;
  --display:'Shippori Mincho',Georgia,serif;
}
h1,.brand,.ptitle b,.ck b,.how b{font-family:var(--display);font-weight:800}

</style>
<header class="bar" id="bar"></header>
<main class="wrap" id="wrap"></main>
<script>
/* Shared engine for the Many Doors books: sound, narration, the full-screen player and its interactions. */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------------- sound ---------------- */
const SND={ctx:null,m:null,nb:null,bb:null,on:store.get('md-sound')!=='0',loops:{},drone:null};
/* the drone: a quiet, slowly breathing tone on A under everything, so silence only happens on purpose. level(v,secs) fades it (0 = silent, 1 = normal). */
function makeDrone(c,dest,vol=.05){ const t=c.currentTime,g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+6); g.connect(dest);
  const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=650; lp.Q.value=.6; lp.connect(g);
  const sw=c.createOscillator(), sg=c.createGain(); sw.frequency.value=.045; sg.gain.value=260; sw.connect(sg).connect(lp.frequency); sw.start(t);
  const nodes=[sw]; [[55,'sine',.55,0],[110,'sawtooth',.16,-4],[110.3,'sawtooth',.12,3],[164.8,'sine',.12,0],[220,'sine',.1,2],[329.6,'sine',.035,-3]].forEach(([f,type,v,dt],i)=>{ const o=c.createOscillator(),og=c.createGain(); o.type=type; o.frequency.value=f; o.detune.value=dt; og.gain.value=v;
    const l=c.createOscillator(),lg=c.createGain(); l.frequency.value=.03+i*.017; lg.gain.value=v*.45; l.connect(lg).connect(og.gain); o.connect(og).connect(lp); o.start(t); l.start(t); nodes.push(o,l); });
  return {level(v,secs=2){ const n=c.currentTime; g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(Math.max(g.gain.value,.0001),n); g.gain.exponentialRampToValueAtTime(Math.max(vol*v,.0001),n+secs); },
    stop(){ this.level(0,1.5); setTimeout(()=>nodes.forEach(o=>{try{o.stop()}catch(e){}}),1700); }}; }

function aInit(){ if(SND.ctx){ if(SND.ctx.state!=='running') try{SND.ctx.resume()}catch(e){} return; }
  try{ SND.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  const c=SND.ctx; SND.m=c.createGain(); SND.m.gain.value=SND.on?.9:0; SND.m.connect(c.destination);
  const n=c.sampleRate*2; SND.nb=c.createBuffer(1,n,c.sampleRate); SND.bb=c.createBuffer(1,n,c.sampleRate);
  const w=SND.nb.getChannelData(0), b=SND.bb.getChannelData(0); let l=0;
  for(let i=0;i<n;i++){ const r=Math.random()*2-1; w[i]=r; l=(l+.02*r)/1.02; b[i]=l*3.5; }
  SND.drone=makeDrone(c,SND.m); }
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{ if(SND.ctx&&SND.ctx.state!=='running') try{SND.ctx.resume()}catch(e){} },{capture:true,passive:true}));
const T=()=>SND.ctx.currentTime;
function aEnv(g,t,p,a,d){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(p,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d); }
function tone(fr,{type='sine',peak=.12,a=.01,d=2,at=0}={}){ if(!SND.ctx) return; const c=SND.ctx,t=T()+at,o=c.createOscillator(); o.type=type; o.frequency.value=fr; const g=c.createGain(); aEnv(g,t,peak,a,d); o.connect(g).connect(SND.m); o.start(t); o.stop(t+a+d+.1); }
function nz({freq=1000,type='highpass',peak=.08,a=.003,d=.03,q=.7,brown=false}={}){ if(!SND.ctx) return; const c=SND.ctx,t=T(),s=c.createBufferSource(); s.buffer=brown?SND.bb:SND.nb; const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q; const g=c.createGain(); aEnv(g,t,peak,a,d); s.connect(f).connect(g).connect(SND.m); s.start(t,Math.random()); s.stop(t+a+d+.1); }
function loopOn(name,build,vol,fade=2){ if(!SND.ctx||SND.loops[name]) return; const g=SND.ctx.createGain(); g.gain.value=.0001; g.connect(SND.m); const nodes=build(g); g.gain.exponentialRampToValueAtTime(vol,T()+fade); SND.loops[name]={g,nodes}; }
function loopOff(name,fade=1.5){ const L=SND.loops[name]; if(!L) return; delete SND.loops[name]; const t=T(); L.g.gain.cancelScheduledValues(t); L.g.gain.setValueAtTime(Math.max(L.g.gain.value,.0001),t); L.g.gain.exponentialRampToValueAtTime(.0001,t+fade); setTimeout(()=>L.nodes.forEach(n=>{try{n.stop()}catch(e){}}),(fade+.2)*1000); }
function allOff(f=1.2){ Object.keys(SND.loops).forEach(k=>loopOff(k,f)); }
function pad(name,freqs,vol=.04){ loopOn(name,g=>{ const out=[]; freqs.forEach((fr,i)=>{ const c=SND.ctx,o=c.createOscillator(); o.frequency.value=fr; o.detune.value=i%2?4:-4; const tg=c.createGain(); tg.gain.value=.5; const l=c.createOscillator(); l.frequency.value=.1+i*.07; const lg=c.createGain(); lg.gain.value=.35; l.connect(lg).connect(tg.gain); o.connect(tg).connect(g); o.start(); l.start(); out.push(o,l); }); return out; },vol,4); }
function noiseLoop(name,type,freq,vol,brown=true){ loopOn(name,g=>{ const c=SND.ctx,s=c.createBufferSource(); s.buffer=brown?SND.bb:SND.nb; s.loop=true; const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; s.connect(f).connect(g); s.start(); return [s]; },vol); }
function fireLoop(){ noiseLoop('fire','lowpass',500,.12); if(!SND.ctx) return; const L=SND.loops.fire; if(!L||L.crack) return; L.crack=setInterval(()=>{ if(!SND.loops.fire) return clearInterval(L.crack); if(Math.random()<.5) nz({freq:2500+Math.random()*3000,peak:.03+Math.random()*.05,d:.015}); },90); }
function waterLoop(){ noiseLoop('water','bandpass',700,.1,false); }
function windLoop(){ noiseLoop('wind','bandpass',420,.12); }
function bell(f=392,v=.16){ [1,2.01,3.02,4.2].forEach((k,i)=>tone(f*k,{peak:v/(i+1.3),a:.005,d:5-i})); }
function bowl(f=196,v=.18){ [1,2.76,5.4].forEach((k,i)=>tone(f*k,{peak:v/(i+1.4),a:.01,d:6-i*1.5})); }
function chime(){ [523.25,659.25,783.99,1046.5,1318.5].forEach((fr,i)=>tone(fr,{peak:.09,d:3,at:i*.14})); }
function drum(v=.5,at=0){ if(!SND.ctx) return; const c=SND.ctx,t=T()+at,o=c.createOscillator(); o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(42,t+.25); const g=c.createGain(); aEnv(g,t,v,.005,.4); o.connect(g).connect(SND.m); o.start(t); o.stop(t+.5); }
function whoosh(v=.14){ if(!SND.ctx) return; const c=SND.ctx,t=T(),s=c.createBufferSource(); s.buffer=SND.nb; const f=c.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.2; f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(2400,t+.6); f.frequency.exponentialRampToValueAtTime(400,t+1.3); const g=c.createGain(); aEnv(g,t,v,.4,.9); s.connect(f).connect(g).connect(SND.m); s.start(t); s.stop(t+1.5); }
function plop(){ tone(420,{type:'triangle',peak:.12,d:.25}); nz({freq:900,type:'bandpass',peak:.05,d:.08}); }
function thud(){ drum(.6); nz({type:'lowpass',freq:300,peak:.2,d:.3,brown:true}); }
function choir(){ pad('choir',[220,277.2,329.6,440],.05); setTimeout(()=>loopOff('choir',3),5000); }
function setSound(on){ SND.on=on; store.set('md-sound',on?'1':'0'); if(SND.m) SND.m.gain.setTargetAtTime(on?.9:0,T(),.2); }

/* ---------------- narration ---------------- */
const VO={on:('speechSynthesis' in window)&&store.get('md-voiceon')!=='0',voice:null,list:[],rate:parseFloat(store.get('md-rate'))||.86};
function vScore(v){ let n=0; const nm=v.name.toLowerCase(); if(/natural|neural|premium|enhanced|siri/.test(nm)) n+=50; if(/online/.test(nm)) n+=20; if(/en-gb/i.test(v.lang)) n+=15; else if(/^en/i.test(v.lang)) n+=8; else n-=100;
  if(/daniel|arthur|george|ryan|thomas|oliver|guy|libby|sonia|serena|kate|martha|google uk english male/.test(nm)) n+=10;
  if(/compact|espeak|zarvox|trinoids|albert|bad news|bells|boing|bubbles|cellos|whisper|jester|organ|superstar|wobble|fred|junior|ralph/.test(nm)) n-=60; return n; }
function loadVoices(){ if(!('speechSynthesis' in window)) return; const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>vScore(b)-vScore(a)); if(!vs.length) return; VO.list=vs; const saved=store.get('md-voice'); const k=saved?vs.findIndex(v=>v.name===saved):0; VO.voice=vs[Math.max(k,0)]; }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function narrate(text){ return new Promise(res=>{ if(!VO.on||!('speechSynthesis' in window)) return res(false); try{ speechSynthesis.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(text.replace(/[“”]/g,'"')); if(VO.voice) u.voice=VO.voice; u.rate=VO.rate; u.pitch=.98;
  let done=false; const fin=()=>{ if(!done){ done=true; res(true); } }; u.onend=fin; u.onerror=fin; setTimeout(fin,Math.max(4000,text.length*95/VO.rate));
  try{ speechSynthesis.speak(u); }catch(e){ fin(); } }); }
function hush(){ try{ speechSynthesis.cancel(); }catch(e){} }

/* ---------------- the player ---------------- */
class Abort extends Error{}
let PS=null; /* the live player session */
function alive(s){ if(!s||PS!==s) throw new Abort(); }
function openPlayer({title,sub,steps=[],menu=null,color}){
  aInit(); closePlayer(true);
  const el=document.createElement('div'); el.className='player'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-label',title);
  if(color) el.style.setProperty('--c',color);
  el.innerHTML=`<div class="pbar"><span class="ptitle"><b>${esc(sub||'')}</b>${esc(title)}</span>
    ${window.MD_HOME?`<a class="sbtn home" href="${MD_HOME}">← Doors</a>`:''}
    ${menu?`<button type="button" class="sbtn" id="pMenu" aria-expanded="false">${esc(menu.label)}</button>`:''}
    <button type="button" class="sbtn" id="pSound" aria-pressed="${SND.on}">Sound</button>
    ${'speechSynthesis' in window?`<button type="button" class="sbtn" id="pVoice" aria-expanded="false">Voice</button>`:''}
    <button type="button" class="sbtn x" id="pClose" aria-label="Close">×</button>
    <div class="menu" id="pPanel" hidden></div></div>
    ${steps.length?`<ol class="steps" id="pSteps">${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:''}
    <div class="stage" id="pStage"><svg class="art" id="pArt" viewBox="0 0 600 400" role="img" preserveAspectRatio="xMidYMid slice"></svg><canvas class="cv" id="pCv"></canvas><div class="layer" id="pLayer"></div></div>
    <div class="scap"><span class="seye" id="pEye"></span><p id="pText" aria-live="polite"></p><div class="snav"><button type="button" class="sgo alt pbk" id="pBk"><span aria-hidden="true">◀</span> Back</button><div class="srow" id="pRow"></div></div></div>`;
  document.body.appendChild(el); document.body.classList.add('insession');
  const s={el,menu}; PS=s;
  el.querySelector('#pClose').onclick=()=>closePlayer();
  el.querySelector('#pBk').onclick=()=>{ if(s.back){ hush(); s.back(); } };
  el.querySelector('#pSound').onclick=e=>{ setSound(!SND.on); e.currentTarget.setAttribute('aria-pressed',SND.on); };
  const panel=el.querySelector('#pPanel');
  const toggle=(btn,build)=>{ const open=panel.hidden||panel.dataset.k!==btn.id; panel.hidden=!open; panel.dataset.k=btn.id; el.querySelectorAll('.pbar .sbtn[aria-expanded]').forEach(b=>b.setAttribute('aria-expanded',b===btn&&open)); if(open) build(); };
  const vb=el.querySelector('#pVoice'); if(vb) vb.onclick=()=>toggle(vb,()=>voicePanel(panel));
  const mb=el.querySelector('#pMenu'); if(mb) mb.onclick=()=>toggle(mb,()=>{ panel.innerHTML=menu.build(); panel.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ panel.hidden=true; menu.go(b.dataset.go); }); });
  el.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!panel.hidden) panel.hidden=true; else closePlayer(); } });
  setTimeout(()=>el.querySelector('#pClose').focus({preventScroll:true}),50);
  return s;
}
function voicePanel(p){ const list=VO.list.slice(0,14); const sp=[['Slow',.76],['Normal',.86],['Brisk',.98]];
  p.innerHTML=`<h3>Narrator</h3><ol><li><button type="button" id="vOn" aria-current="${VO.on}">${VO.on?'Narrator on · tap to turn off':'Narrator off · tap to turn on'}</button></li></ol>
  <h3>Speed</h3><div class="vchips">${sp.map(([l,r])=>`<button type="button" class="vchip" data-r="${r}" aria-pressed="${Math.abs(VO.rate-r)<.01}">${l}</button>`).join('')}</div>
  <h3>Voice</h3>${list.length?`<ol>${list.map((v,i)=>`<li><button type="button" data-v="${i}" aria-current="${VO.voice&&v.name===VO.voice.name}">${esc(v.name.replace(/Microsoft |Google |\(.*?\)/g,''))}</button></li>`).join('')}</ol>`:'<p>No voices have loaded on this device yet.</p>'}
  <p>Voices depend on your device. Safari on Apple devices and Edge on Windows usually have the most natural ones.</p>`;
  p.querySelector('#vOn').onclick=()=>{ VO.on=!VO.on; store.set('md-voiceon',VO.on?'1':'0'); if(!VO.on) hush(); voicePanel(p); };
  p.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ VO.rate=+b.dataset.r; store.set('md-rate',VO.rate); voicePanel(p); narrate('This is how I will sound.'); });
  p.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ VO.voice=VO.list[+b.dataset.v]; store.set('md-voice',VO.voice.name); VO.on=true; store.set('md-voiceon','1'); voicePanel(p); narrate('This is how I will sound.'); });
}
function closePlayer(silent){ const s=PS; PS=null; hush(); if(SND.ctx) allOff(.8); cvStop(); if(s){ s.el.remove(); document.body.classList.remove('insession'); if(!silent&&s.onclose) s.onclose(); } }
function stepTo(i){ document.querySelectorAll('#pSteps li').forEach((li,k)=>li.className=k<i?'done':k===i?'on':''); }
function art(svg,label=''){ const a=$('#pArt'); if(!a) return; a.innerHTML=svg; a.setAttribute('aria-label',label); }
function layer(){ return $('#pLayer'); }
function clearLayer(){ const l=layer(); if(l) l.innerHTML=''; }
function eyebrow(t){ const e=$('#pEye'); if(e) e.textContent=t||''; }
function toast(t,ms=2400){ const st=$('#pStage'); if(!st) return; const d=document.createElement('div'); d.className='toast'; d.textContent=t; st.appendChild(d); setTimeout(()=>d.remove(),ms); }
function splitText(t){ const parts=t.match(/[^.!?]+[.!?]+["”’']?\s*|[^.!?]+$/g)||[t]; const out=[]; let cur=''; parts.forEach(x=>{ if((cur+x).length>200&&cur){ out.push(cur.trim()); cur=x; } else cur+=x; }); if(cur.trim()) out.push(cur.trim()); return out; }
/* show a passage, one or two sentences at a time, each with Continue */
async function say(s,text,{eye,tap=true}={}){ alive(s); if(eye!==undefined) eyebrow(eye); const chunks=splitText(text);
  for(let i=0;i<chunks.length;i++){ alive(s); const p=$('#pText'); p.textContent=chunks[i]; $('#pRow').innerHTML=''; const spoke=narrate(chunks[i]); if(tap||i<chunks.length-1) await waitTap(s,spoke); else await spoke; } }
function waitTap(s,spoke,label='Continue'){ return new Promise((res,rej)=>{ if(s) s.n=(s.n||0)+1; const row=$('#pRow'); row.innerHTML=`<button type="button" class="sgo" id="pGo">${esc(label)} <span aria-hidden="true">→</span></button>`;
  const b=row.querySelector('#pGo'); let done=false; const go=()=>{ if(done) return; done=true; hush(); document.removeEventListener('keydown',kd); res(); };
  const kd=e=>{ if(PS!==s){ document.removeEventListener('keydown',kd); return; } if(e.key==='ArrowLeft'&&s&&s.back&&!e.target.closest('.menu,.pbar')){ e.preventDefault(); document.removeEventListener('keydown',kd); s.back(); return; } if((e.key===' '||e.key==='Enter'||e.key==='ArrowRight')&&!e.target.closest('.menu,.pbar')){ e.preventDefault(); go(); } };
  b.onclick=go; document.addEventListener('keydown',kd); b.focus({preventScroll:true}); }); }
function ask(text,eye){ if(eye!==undefined) eyebrow(eye); $('#pText').textContent=text; $('#pRow').innerHTML=''; narrate(text); }
/* multiple choice in the caption row; returns index. right: index of the correct answer or -1 for any */
function choose(s,text,opts,{right=-1,wrong}={}){ alive(s); ask(text); return new Promise(res=>{ const row=$('#pRow'); row.style.justifyContent='flex-start';
  row.innerHTML=opts.map((o,i)=>`<button type="button" class="sgo alt" data-i="${i}">${esc(o)}</button>`).join('');
  row.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; if(right>=0&&i!==right){ b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); if(wrong){ const w=typeof wrong==='function'?wrong(i):wrong; $('#pText').textContent=w; narrate(w); } return; } row.style.justifyContent=''; res(i); });
  row.querySelector('button').focus({preventScroll:true}); }); }
/* press and hold the stage */
function hold(s,{label,ms=3000,ask:q,early,onP}){ alive(s); if(q) ask(q); return new Promise(res=>{ const l=layer(); l.innerHTML=`<button type="button" class="holdzone" aria-label="${esc(label)}"><span class="holdpill"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="rgba(30,42,43,.2)" stroke-width="4"/><circle id="hr" cx="20" cy="20" r="16" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="100.5" stroke-dashoffset="100.5" transform="rotate(-90 20 20)" stroke-linecap="round"/></svg>${esc(label)}</span></button>`;
  const z=l.querySelector('.holdzone'), r=l.querySelector('#hr'); let t0=0,raf=0,done=false,hm=null;
  const tick=()=>{ const p=Math.min(1,(performance.now()-t0)/ms); r.setAttribute('stroke-dashoffset',100.5*(1-p)); onP&&onP(p); if(p>=1){ done=true; if(hm){ hm.stop(true); hm=null; } z.classList.remove('on'); l.innerHTML=''; res(); return; } raf=requestAnimationFrame(tick); };
  const down=e=>{ if(done) return; e.preventDefault(); t0=performance.now(); z.classList.add('on'); hm=holdHum(ms); raf=requestAnimationFrame(tick); };
  const up=()=>{ if(done||!t0) return; cancelAnimationFrame(raf); t0=0; if(hm){ hm.stop(false); hm=null; } z.classList.remove('on'); r.setAttribute('stroke-dashoffset',100.5); onP&&onP(0); if(early){ $('#pText').textContent=early; } };
  z.addEventListener('pointerdown',down); ['pointerup','pointerleave','pointercancel'].forEach(ev=>z.addEventListener(ev,up));
  z.addEventListener('keydown',e=>{ if((e.key===' '||e.key==='Enter')&&!e.repeat) down(e); }); z.addEventListener('keyup',e=>{ if(e.key===' '||e.key==='Enter') up(); });
  z.focus({preventScroll:true}); }); }
/* the sound of a press and hold: a soft hum that climbs an octave as the ring fills, a bell when it's full */
function holdHum(ms){ aInit(); if(!SND.ctx) return {stop(){}}; const c=SND.ctx,t=T(),s=ms/1000,g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.08,t+.25); g.connect(SND.m);
  const os=[[1,-5],[1.5,4],[2,0]].map(([k,dt],i)=>{ const o=c.createOscillator(); o.type=i?'sine':'triangle'; o.detune.value=dt; o.frequency.setValueAtTime(196*k,t); o.frequency.exponentialRampToValueAtTime(392*k,t+s); const og=c.createGain(); og.gain.value=[.6,.25,.15][i]; o.connect(og).connect(g); o.start(t); return o; });
  return {stop(full){ const n=T(); g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(Math.max(g.gain.value,.0001),n); g.gain.exponentialRampToValueAtTime(.0001,n+(full?.6:.18)); if(!full) os.forEach(o=>{ o.frequency.cancelScheduledValues(n); o.frequency.setValueAtTime(o.frequency.value,n); o.frequency.exponentialRampToValueAtTime(o.frequency.value*.8,n+.18); }); os.forEach(o=>o.stop(n+.7)); if(full) bell(784,.08); }}; }
/* tap glowing spots on the picture; spots: [{x,y,label,say}] in % */
function spots(s,{ask:q,items,onTap}){ alive(s); if(q) ask(q); return new Promise(res=>{ const l=layer(); let left=items.length;
  l.innerHTML=items.map((it,i)=>`<button type="button" class="spot" data-i="${i}" style="left:${it.x}%;top:${it.y}%" aria-label="${esc(it.label||'Tap')}"><i></i>${it.label?`<b>${esc(it.label)}</b>`:''}</button>`).join('');
  l.querySelectorAll('.spot').forEach(b=>b.onclick=()=>{ const it=items[+b.dataset.i]; b.classList.add('done'); left--; if(it.say){ $('#pText').textContent=it.say; narrate(it.say); } onTap&&onTap(+b.dataset.i,it); if(!left){ setTimeout(()=>{ l.innerHTML=''; res(); },it.say?1800:600); } });
  l.querySelector('.spot').focus({preventScroll:true}); }); }
/* two pictures side by side; pick one */
function duo(s,{ask:q,a,b,right=-1,wrong}){ alive(s); ask(q); return new Promise(res=>{ const l=layer(); l.innerHTML=`<div class="duo">${[a,b].map((o,i)=>`<button type="button" class="half" data-i="${i}"><svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">${o.svg}</svg><span>${esc(o.label)}</span></button>`).join('')}</div>`;
  l.querySelectorAll('.half').forEach(h=>h.onclick=()=>{ const i=+h.dataset.i; if(right>=0&&i!==right){ if(wrong){ $('#pText').textContent=wrong; narrate(wrong); } return; } l.innerHTML=''; res(i); }); }); }
/* words to clear: tap each to let it go */
function release(s,{ask:q,words,done}){ alive(s); ask(q); return new Promise(res=>{ const l=layer(); l.innerHTML=`<div class="picks">${words.map((w,i)=>`<button type="button" class="pk" data-i="${i}">${esc(w)}</button>`).join('')}</div>`; let left=words.length;
  l.querySelectorAll('.pk').forEach(b=>b.onclick=()=>{ b.classList.add('gone'); plop(); if(--left===0){ setTimeout(()=>{ l.innerHTML=''; res(); },500); } }); }); }
/* hold still (pointer/keys); ms of stillness needed */
function still(s,{ask:q,ms=8000,moved='You moved. Start again, gently.'}){ alive(s); ask(q); if(SND.drone) SND.drone.level(0,2.5); return new Promise(r0=>{ const res=v=>{ if(SND.drone) SND.drone.level(1,4); r0(v); }; const l=layer(); l.innerHTML=`<div class="stillbar"><i></i></div>`; const bar=l.querySelector('i'); let t0=performance.now(),raf;
  const reset=()=>{ t0=performance.now(); }; const mv=()=>{ if(performance.now()-t0>600){ $('#pText').textContent=moved; } reset(); };
  addEventListener('pointermove',mv); addEventListener('keydown',mv);
  const tick=()=>{ if(PS!==s){ cleanup(); if(SND.drone) SND.drone.level(1,2); return; } const p=Math.min(1,(performance.now()-t0)/ms); bar.style.width=p*100+'%'; if(p>=1){ cleanup(); l.innerHTML=''; res(); return; } raf=requestAnimationFrame(tick); };
  const cleanup=()=>{ cancelAnimationFrame(raf); removeEventListener('pointermove',mv); removeEventListener('keydown',mv); }; raf=requestAnimationFrame(tick); }); }
/* count taps (beads, breaths, pebbles) */
function count(s,{ask:q,n,label='Tap',onTap}){ alive(s); ask(q); return new Promise(res=>{ const l=layer(); let k=0; l.innerHTML=`<button type="button" class="holdzone" aria-label="${esc(label)}"><span class="holdpill">${esc(label)}</span></button><span class="counter">0 / ${n}</span>`;
  const z=l.querySelector('.holdzone'), c=l.querySelector('.counter'); z.onclick=()=>{ k++; c.textContent=`${k} / ${n}`; onTap&&onTap(k); if(k>=n){ l.innerHTML=''; res(); } }; z.focus({preventScroll:true}); }); }

/* ---------------- sitting: a minute with a breathing ring ---------------- */
let cvRaf=0;
function cvStop(){ cancelAnimationFrame(cvRaf); const c=$('#pCv'); if(c){ c.getContext('2d').clearRect(0,0,c.width,c.height); c.style.opacity=0; } }
function cvBreath(col,ink='#FFF6DE'){ const cv=$('#pCv'); if(!cv) return; cv.style.opacity=1; const g=cv.getContext('2d'); const t0=performance.now();
  const fr=()=>{ const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1; if(cv.width!==Math.round(r.width*dpr)){ cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); }
    const W=cv.width,H=cv.height,t=(performance.now()-t0)/1000; g.clearRect(0,0,W,H); const ph=(Math.sin(t*2*Math.PI/10-Math.PI/2)+1)/2; const R=Math.min(W,H)*(.16+.14*ph);
    const gr=g.createRadialGradient(W/2,H/2,R*.2,W/2,H/2,R*1.6); gr.addColorStop(0,col); gr.addColorStop(1,'rgba(0,0,0,0)'); g.globalAlpha=.35; g.fillStyle=gr; g.fillRect(0,0,W,H);
    g.globalAlpha=.9; g.strokeStyle=ink; g.lineWidth=3*dpr; g.beginPath(); g.arc(W/2,H/2,R,0,Math.PI*2); g.stroke();
    for(let i=0;i<12;i++){ const a=i/12*Math.PI*2+t*.05; g.globalAlpha=.25+.5*ph; g.beginPath(); g.arc(W/2+Math.cos(a)*R*1.35,H/2+Math.sin(a)*R*1.35,2.5*dpr,0,Math.PI*2); g.fillStyle=ink; g.fill(); }
    cvRaf=requestAnimationFrame(fr); }; fr(); }
async function sit(s,{text,secs=60,col='#E8B13A',bg}){ alive(s); if(bg) art(bg); ask(text,'Sit'); cvBreath(col); if(SND.ctx) bowl(196,.14);
  await new Promise(res=>{ const l=layer(); l.innerHTML=`<span class="sittime">1:00</span><button type="button" class="ghost">Finish early</button>`; const tEl=l.querySelector('.sittime'); const t0=performance.now(); let iv;
    const end=()=>{ clearInterval(iv); l.innerHTML=''; res(); };
    l.querySelector('.ghost').onclick=end;
    iv=setInterval(()=>{ if(PS!==s){ clearInterval(iv); return res(); } const left=Math.max(0,secs-Math.floor((performance.now()-t0)/1000)); tEl.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`; if(left<=0){ if(SND.ctx) bowl(196,.12); end(); } },250); });
  cvStop(); alive(s); }

/* ---------------- svg helpers shared by the books ---------------- */
function rays(cx,cy,r,n,op=.2,col='#FFF6DE'){ let o=''; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2,a2=a+Math.PI/n*.6; o+=`<path d="M${cx} ${cy}L${cx+Math.cos(a)*r} ${cy+Math.sin(a)*r}L${cx+Math.cos(a2)*r} ${cy+Math.sin(a2)*r}Z" fill="${col}" opacity="${op}"/>`; } return o; }
function stars(n,seed=3,h=400,col='#FFF6DE'){ let s=seed,o=''; const r=()=>{ s=(s*9301+49297)%233280; return s/233280; }; for(let i=0;i<n;i++) o+=`<circle cx="${(r()*600).toFixed(1)}" cy="${(r()*h).toFixed(1)}" r="${(r()*1.6+.3).toFixed(2)}" fill="${col}" opacity="${(r()*.7+.2).toFixed(2)}"/>`; return o; }
function rnd(seed){ let s=seed; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
function header(B){ const h=$('#bar'); if(!h) return; h.innerHTML=`<span class="brand">${esc(B.brand)}<small>${esc(B.brandSub)}</small></span><span class="sp"></span>${(B.links||[]).filter(l=>l[1]).map(([t,u])=>`<a class="pill" href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join('')}`; }

/* The journey: a short click-through trip behind one door. One picture, one line, one thing to do.
   Data: const J={key,tradition,title,tag,mins,col,cover,stops:[{name,run}],end:{line,book,bookUrl,walk,walkUrl},review}. */
const HUB=window.MD_HUB||'../#doors';
/* the pages live in folders; anywhere but the site itself, spell out index.html */
if(!/colinblackshear\.com$/.test(location.hostname)) document.addEventListener('click',e=>{ const a=e.target.closest&&e.target.closest('a[href]'); if(!a) return; const m=a.getAttribute('href').match(/^([^:#]*\/)(#.*)?$/); if(m) a.setAttribute('href',m[1]+'index.html'+(m[2]||'')); },true);
function journeySplash(J){
  document.body.classList.add('jbody');
  const next=Math.min(+store.get(J.key+'-next')||0,J.stops.length-1);
  $('#wrap').innerHTML=`<section class="jsplash" style="--c:${J.col}">
    <svg class="jcover" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${J.cover()}</svg>
    <div class="jshade"></div>
    <a class="jback" href="${HUB}">← All doors</a>
    <div class="jt">
      <span class="jdoor">Door: ${esc(J.tradition)}</span>
      <h1>${esc(J.title)}</h1>
      <p class="jtag">${esc(J.tag)}</p>
      <div class="cta"><button type="button" class="btn gold" id="jgo">${next?'Carry on':'Step through'} <span aria-hidden="true">→</span></button>${next?`<button type="button" class="btn alt" id="jre">Start over</button>`:''}</div>
      <ol class="jstops">${J.stops.map((c,i)=>`<li><button type="button" data-i="${i}"><b>${i+1}</b>${esc(c.name)}</button></li>`).join('')}</ol>
      <p class="jmeta">${J.mins} minutes · tap to move on · sound optional${J.review?` · <em>${esc(J.review)}</em>`:''}</p>
    </div></section>`;
  $('#jgo').onclick=()=>playJourney(J,next);
  const r=$('#jre'); if(r) r.onclick=()=>{ store.set(J.key+'-next','0'); playJourney(J,0); };
  document.querySelectorAll('.jstops [data-i]').forEach(b=>b.onclick=()=>playJourney(J,+b.dataset.i));
}
/* one short line with Continue, and an optional Guide note the curious can open */
async function tell(s,text,{eye,note}={}){ alive(s); if(eye!==undefined) eyebrow(eye); const p=$('#pText'); p.textContent=text; $('#pRow').innerHTML=''; const spoke=narrate(text);
  if(note){ const n=document.createElement('button'); n.type='button'; n.className='gnote'; n.innerHTML='<span aria-hidden="true">✦</span> Guide note'; n.setAttribute('aria-expanded','false');
    n.onclick=()=>{ const open=n.getAttribute('aria-expanded')!=='true'; n.setAttribute('aria-expanded',open); let d=$('#pNote'); if(open){ if(!d){ d=document.createElement('p'); d.id='pNote'; d.className='gtext'; p.after(d); } d.textContent=note; } else if(d) d.remove(); };
    setTimeout(()=>$('#pRow')&&$('#pRow').prepend(n),0); }
  await waitTap(s,spoke); const d=$('#pNote'); if(d) d.remove(); }

async function playJourney(J,start){
  const menu={label:'Stops',build:()=>`<h3>Stops</h3><ol>${J.stops.map((c,i)=>`<li><button type="button" data-go="${i}" aria-current="${i===s.ch}"><small>${i+1}</small>${esc(c.name)}</button></li>`).join('')}</ol><h3>Elsewhere</h3><ol><li><button type="button" data-go="hub"><small>←</small>All doors</button></li></ol>`,go:i=>i==='hub'?location.href=(/colinblackshear\.com$/.test(location.hostname)?HUB:HUB.replace(/\/(#|$)/,'/index.html$1')):playJourney(J,+i)};
  const s=openPlayer({title:J.title,sub:'',steps:J.stops.map(c=>c.short||c.name),menu,color:J.col});
  s.el.classList.add('jplayer'); s.onclose=()=>journeySplash(J);
  /* Back: to the start of this stop, or to the stop before if you're already at its start */
  s.el.classList.add('hasback'); s.back=()=>{ const i=s.ch||0; playJourney(J,(s.n||0)>1?i:Math.max(0,i-1)); };
  try{
    for(let i=start;i<J.stops.length;i++){ alive(s); s.ch=i; s.n=0; const c=J.stops[i]; store.set(J.key+'-next',String(i)); stepTo(i); s.el.style.setProperty('--c',c.col||J.col);
      s.el.querySelector('.ptitle').innerHTML=`<b>Stop ${i+1} of ${J.stops.length}</b>${esc(c.name)}`; clearLayer(); cvStop(); eyebrow(''); $('#pRow').style.justifyContent='';
      await c.run(s); if(SND.ctx) allOff(1.2); }
    store.set(J.key+'-next','0'); alive(s); stepTo(J.stops.length);
    await journeyEnd(s,J);
  }catch(e){ if(!(e instanceof Abort)) console.error(e); }
}
function journeyEnd(s,J){ alive(s); art(J.cover()); if(SND.ctx) chime(); eyebrow('End of the line');
  s.el.querySelector('.ptitle').innerHTML=`<b>Arrived</b>${esc(J.title)}`;
  $('#pText').textContent=J.end.line; narrate(J.end.line);
  const E=J.end; $('#pRow').innerHTML=`<a class="sgo" href="${HUB}">Pick another door <span aria-hidden="true">→</span></a>`;
  layer().innerHTML=`<div class="jend"><span>Want more than the short version?</span>${E.bookUrl?`<a href="${E.bookUrl}">${esc(E.book)}<small>the full illustrated book</small></a>`:''}${E.walkUrl?`<a href="${E.walkUrl}">${esc(E.walk)}<small>a few minutes a day</small></a>`:''}<button type="button" id="jagain">Ride again<small>from the first stop</small></button></div>`;
  $('#jagain').onclick=()=>playJourney(J,0);
  return new Promise(()=>{}); }
/* drag a token along a path to a target, e.g. across a bridge: returns when it arrives */
function drag(s,{ask:q,from,to,label='Drag',onP}){ alive(s); if(q) ask(q); return new Promise(res=>{ const l=layer(); l.innerHTML=`<div class="dtrack" style="left:${from[0]}%;top:${from[1]}%;width:${Math.hypot(to[0]-from[0],(to[1]-from[1])*2/3)}%;transform:rotate(${Math.atan2((to[1]-from[1])*2/3,to[0]-from[0])}rad)"></div><button type="button" class="dknob" style="left:${from[0]}%;top:${from[1]}%" aria-label="${esc(label)}. Use the arrow keys."><span>${esc(label)}</span></button>`;
  const k=l.querySelector('.dknob'); let p=0,on=false,done=false;
  const set=v=>{ p=Math.max(0,Math.min(1,v)); k.style.left=(from[0]+(to[0]-from[0])*p)+'%'; k.style.top=(from[1]+(to[1]-from[1])*p)+'%'; onP&&onP(p); if(p>=.98&&!done){ done=true; l.innerHTML=''; res(); } };
  const proj=e=>{ const r=l.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100; const dx=to[0]-from[0], dy=to[1]-from[1]; const ax=dx*r.width, ay=dy*r.height; return ((x-from[0])*r.width*ax+(y-from[1])*r.height*ay)/(ax*ax+ay*ay); };
  k.addEventListener('pointerdown',e=>{ on=true; k.setPointerCapture(e.pointerId); e.preventDefault(); });
  k.addEventListener('pointermove',e=>{ if(on) set(proj(e)); });
  k.addEventListener('pointerup',()=>{ on=false; }); k.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='ArrowUp'||e.key===' '){ e.preventDefault(); set(p+.1); } if(e.key==='ArrowLeft'||e.key==='ArrowDown'){ e.preventDefault(); set(p-.1); } });
  k.focus({preventScroll:true}); }); }
/* a big tap-anywhere moment with a label, for drama (knock, ring, open) */
function tapIt(s,{ask:q,label='Tap'}){ return count(s,{ask:q,n:1,label}); }

/* The Hidden World: flat colour on washi paper with a band of seigaiha waves top and bottom, after Japanese woodblock prints.
   Vermilion, sumi black, pine green, indigo and a little gold. */
const K='#1E1C1A', VERM='#D2452E', PINE='#3F6B4A', INDIGO='#2C3E6B', GOLD='#C9A23A', WHITE='#FBF8F0', WASHI='#F1E9D6', SKIN='#E2B48A', NIGHTJ='#141A26', SAKAKI='#2F5A3A';
const SH_DEFS=`<defs><pattern id="seigaiha" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="${INDIGO}"/>${[0,40,20].map((x,i)=>`<g transform="translate(${x} ${i<2?20:10})">${[16,11,6].map(r=>`<circle r="${r}" fill="${INDIGO}" stroke="${WHITE}" stroke-width="1.6"/>`).join('')}</g>`).join('')}</pattern>
<radialGradient id="glowJ"><stop offset="0" stop-color="#FFF4D0"/><stop offset=".5" stop-color="${GOLD}" stop-opacity=".5"/><stop offset="1" stop-color="${GOLD}" stop-opacity="0"/></radialGradient>
<linearGradient id="nightJ" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E121C"/><stop offset="1" stop-color="#26324A"/></linearGradient><clipPath id="shclip"><rect width="600" height="400"/></clipPath></defs>`;
function jp(inner,{bg='washi',border=true}={}){ const f=bg==='night'?'url(#nightJ)':bg==='washi'?WASHI:bg;
  return `${SH_DEFS}<g clip-path="url(#shclip)"><rect width="600" height="400" fill="${f}"/>${bg==='night'?stars(50,23,300,'#FBF8F0'):''}${inner}${border?`<rect width="600" height="20" fill="url(#seigaiha)"/><rect y="380" width="600" height="20" fill="url(#seigaiha)"/>`:''}</g>`; }
function floorJ(y=330,col='#C9B48C'){ return `<rect x="0" y="${y}" width="600" height="${400-y}" fill="${col}"/><path d="M0 ${y} H600" stroke="${K}" stroke-width="3"/>`; }
/* a person in kimono: black for mourning, or a colour; long hair tied for women */
function kim(x,y,s=1,{col=K,obi=WHITE,arms='down',hair='short',skin=SKIN}={}){
  const ar={down:'',fold:`<path d="M-16 -64 Q0 -54 16 -64" stroke="${col}" stroke-width="12" fill="none" stroke-linecap="round"/>`,
    offer:`<path d="M-20 -70 Q-18 -50 0 -54 Q18 -50 20 -70" stroke="${col}" stroke-width="12" fill="none" stroke-linecap="round"/>`,
    up:`<path d="M-20 -76 L-34 -108 M20 -76 L34 -108" stroke="${col}" stroke-width="11" stroke-linecap="round"/>`}[arms]||'';
  const h=hair==='long'?`<path d="M-16 -110 Q-18 -128 0 -128 Q18 -128 16 -110 Q0 -118 -16 -110Z M-6 -128 Q0 -140 6 -128Z" fill="#1A1614"/>`:hair==='grey'?`<path d="M-16 -110 Q0 -128 16 -110 Q0 -118 -16 -110Z" fill="#CFCAC0"/>`:hair==='eboshi'?`<path d="M-14 -116 Q-12 -146 4 -150 Q12 -140 14 -116Z" fill="${K}" stroke="${K}" stroke-width="1.5"/>`:`<path d="M-16 -110 Q0 -128 16 -110 Q0 -118 -16 -110Z" fill="#1A1614"/>`;
  return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-26 0 L-20 -84 Q0 -94 20 -84 L26 0Z" fill="${col}" stroke="${K}" stroke-width="2.2"/><path d="M-14 -88 L0 -60 L14 -88" stroke="${WHITE}" stroke-width="3" fill="none"/><rect x="-21" y="-56" width="42" height="12" fill="${obi}" stroke="${K}" stroke-width="1.4"/>${ar}<circle cx="0" cy="-104" r="15" fill="${skin}" stroke="${K}" stroke-width="2.2"/>${h}</g>`; }
function torii(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-70 0 L-62 -150 M70 0 L62 -150" stroke="${VERM}" stroke-width="14"/><path d="M-100 -158 Q0 -170 100 -158 L104 -172 Q0 -186 -104 -172Z" fill="${K}"/><path d="M-90 -150 H90" stroke="${VERM}" stroke-width="14"/><path d="M-80 -120 H80" stroke="${VERM}" stroke-width="10"/><rect x="-10" y="-150" width="20" height="30" fill="${VERM}"/></g>`; }
function shide(x,y,s=1){ return `<path transform="translate(${x} ${y}) scale(${s})" d="M0 0 h8 v8 h-6 v8 h6 v8 h-6 v8" fill="none" stroke="${WHITE}" stroke-width="4" stroke-linejoin="miter"/>`; }
function shimenawa(x1,x2,y){ let o=`<path d="M${x1} ${y} Q${(x1+x2)/2} ${y+24} ${x2} ${y}" stroke="#C9A86A" stroke-width="12" fill="none"/><path d="M${x1} ${y} Q${(x1+x2)/2} ${y+24} ${x2} ${y}" stroke="${K}" stroke-width="1.4" fill="none" stroke-dasharray="6 6"/>`; for(let i=1;i<4;i++){ const t=i/4, xx=x1+(x2-x1)*t, yy=y+24*2*t*(1-t); o+=shide(xx-4,yy+6,.9); } return o; }
function sakaki(x,y,s=1,r=0){ return `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><path d="M0 0 V-60" stroke="#6A4A2A" stroke-width="3"/>${[-50,-38,-26,-14].map((v,i)=>`<path d="M0 ${v} q${i%2?14:-14} -6 ${i%2?20:-20} 4 q${i%2?-10:10} 4 ${i%2?-20:20} -4Z" fill="${SAKAKI}" stroke="${K}" stroke-width="1"/>`).join('')}${shide(2,-44,.6)}</g>`; }
/* the kamidana: a household shrine on a high shelf */
function kamidana(x,y,s=1,{covered=false}={}){ return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-90" y="0" width="180" height="10" fill="#B8925A" stroke="${K}" stroke-width="1.8"/><rect x="-40" y="-56" width="80" height="56" fill="#E8D8B0" stroke="${K}" stroke-width="2"/><path d="M-54 -56 L0 -84 L54 -56Z" fill="#B8925A" stroke="${K}" stroke-width="2"/><rect x="-14" y="-40" width="28" height="40" fill="#D8C090" stroke="${K}" stroke-width="1.5"/>${sakaki(-66,0,.7,-8)}${sakaki(66,0,.7,8)}${covered?`<rect x="-58" y="-88" width="116" height="90" fill="${WHITE}" stroke="${K}" stroke-width="1.6"/><path d="M-58 -60 H58" stroke="#D8D0C0" stroke-width="1.5"/>`:shimenawa(-46,46,-54)}</g>`; }
function tablet(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><circle cy="-50" r="50" fill="url(#glowJ)"/><rect x="-14" y="-90" width="28" height="84" rx="4" fill="#E8D4A8" stroke="${K}" stroke-width="2"/><rect x="-22" y="-8" width="44" height="8" fill="#8A6A3A" stroke="${K}" stroke-width="1.5"/><path d="M-6 -76 V-20 M6 -70 V-30" stroke="${K}" stroke-width="2" opacity=".5"/></g>`; }
function lantern(x,y,s=1,{lit=true}={}){ return `<g transform="translate(${x} ${y}) scale(${s})">${lit?`<circle cy="-26" r="26" fill="url(#glowJ)"/>`:''}<path d="M-14 0 L-16 -40 H16 L14 0Z" fill="${lit?'#FFE6A8':'#D8D0C0'}" stroke="${K}" stroke-width="1.8"/><path d="M-20 -40 H20 L14 -48 H-14Z" fill="${K}"/><path d="M-20 0 H20" stroke="${K}" stroke-width="3"/></g>`; }
function riverJ(y=280,col='#3A6A8A'){ let o=`<rect x="0" y="${y}" width="600" height="${400-y}" fill="${col}"/>`; for(let k=0;k<3;k++){ let d=`M${k%2*20} ${y+20+k*28}`; for(let x=0;x<620;x+=40) d+=` q10 -8 20 0 q10 8 20 0`; o+=`<path d="${d}" stroke="${WHITE}" stroke-width="2" fill="none" opacity=".55"/>`; } return o; }
function boulder(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-80 0 Q-96 -60 -50 -96 Q0 -120 50 -96 Q96 -60 80 0Z" fill="#6A6460" stroke="${K}" stroke-width="3"/><path d="M-40 -70 Q-10 -84 20 -70 M-50 -30 Q0 -44 40 -24" stroke="#4A4440" stroke-width="3" fill="none"/></g>`; }
function shrine(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-90" y="-80" width="180" height="80" fill="${WHITE}" stroke="${K}" stroke-width="2.4"/>${[-60,-20,20,60].map(d=>`<rect x="${d-6}" y="-80" width="12" height="80" fill="${VERM}" stroke="${K}" stroke-width="1.4"/>`).join('')}<path d="M-130 -80 Q0 -100 130 -80 L100 -150 Q0 -164 -100 -150Z" fill="#5A4A3A" stroke="${K}" stroke-width="2.4"/><path d="M-60 -150 L-70 -180 M60 -150 L70 -180 M-40 -158 H40" stroke="${K}" stroke-width="5"/>${shimenawa(-80,80,-74)}</g>`; }
function fire(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})" class="flick"><path d="M-30 0 H30" stroke="#6A4A2A" stroke-width="6"/><path d="M-20 0 Q-26 -24 -8 -40 Q-6 -24 0 -22 Q-2 -40 10 -50 Q14 -30 22 -20 Q26 -6 20 0Z" fill="${VERM}" stroke="${K}" stroke-width="1.6"/></g>`; }
function sjCover(){ return jp(`${floorJ(330,'#C9B48C')}${torii(300,330,1.1)}${lantern(110,330,1.4)}${lantern(490,330,1.4)}${sakaki(200,330,1.1)}`); }

/* The Shinto door: the pass to Yomi, the river, the tablet in the dark, the hidden clap, fifty days, Obon and the hidden world, in seven stops.
   After the Kojiki, Shinto funeral custom (shinsōsai) and Hirata Atsutane. */
const J={key:'j-shinto',tradition:'Shinto',title:'The Hidden World',col:VERM,mins:6,
 tag:'No heaven, no hell. The dead stay close, on the family shelf.',
 cover:sjCover,review:'Still waiting for review by Shinto priests and practitioners.',
 end:{line:'That\'s the Shinto map: a boulder at the pass, water that washes death off, a tablet in the dark, a hidden clap, and ancestors who never go far.',
  book:'The Hidden World',bookUrl:'book/',walk:'Ten Mornings',walkUrl:'walk/'},
 stops:[
 {name:'The pass',short:'The pass',col:INDIGO,run:async s=>{
   art(jp(`<path d="M0 400 L0 180 Q160 120 300 200 Q440 280 600 160 V400Z" fill="#2A2420"/>${kim(200,300,.8,{col:WHITE,hair:'eboshi'})}`,{bg:'night'}));
   if(SND.ctx) pad('pad',[98,147,196],.03);
   await tell(s,'The oldest Japanese story of death. The goddess Izanami died and went down to Yomi, the land of the dead. Her husband Izanagi followed her into the dark, looked when she told him not to, and ran.',{eye:'The Kojiki, 712',note:'The Kojiki, the Record of Ancient Matters, was compiled for the imperial court from older oral traditions. Shinto has no founder and no single scripture, but these myths are its oldest written stories.'});
   art(jp(`<path d="M0 400 L0 180 Q160 120 300 200 Q440 280 600 160 V400Z" fill="#2A2420"/>${kim(130,300,.8,{col:WHITE,hair:'eboshi',arms:'up'})}<g id="bld">${boulder(420,300,1)}</g>`,{bg:'night'}));
   const B=$('#pArt');
   await hold(s,{label:'Roll the boulder',ms:4000,ask:'At the pass he rolls a boulder across the way. Press and hold to roll it shut.',onP:p=>{ const b=B.querySelector('#bld'); if(b) b.style.transform=`translateX(${-p*150}px)`; }});
   if(SND.ctx) thud();
   await tell(s,'Izanami swore to kill a thousand people a day. Izanagi answered: then I will build fifteen hundred birthing huts a day. Death is real. But life wins, by a margin.');
 }},
 {name:'The river',short:'The river',col:'#3A6A8A',run:async s=>{
   art(jp(`${riverJ(230)}${kim(300,290,1,{col:WHITE,hair:'eboshi',arms:'offer'})}`));
   if(SND.ctx) waterLoop();
   await tell(s,'Izanagi felt filthy from Yomi, so he washed in a river mouth.',{eye:'Kegare',note:'Kegare is the pollution of contact with death, blood or disease. It isn\'t a sin and it isn\'t anyone\'s fault. It\'s like dirt, so it can be washed off (misogi), waved away by a priest (harae), or kept away by salt.'});
   await spots(s,{ask:'Wash his eyes and nose.',items:[{x:46,y:30,label:'Left eye',say:'From his left eye: Amaterasu, the sun.'},{x:54,y:30,label:'Right eye',say:'From his right eye: Tsukuyomi, the moon.'},{x:50,y:40,label:'Nose',say:'From his nose: Susanoo, the storm.'}]});
   loopOff('water');
   await tell(s,'Death left a stain, and washing it off made the brightest kami of all. In Shinto, death pollutes. It doesn\'t damn.');
 }},
 {name:'The tablet',short:'The tablet',col:GOLD,run:async s=>{
   art(jp(`${floorJ(320,'#B8A27A')}${kamidana(300,170,1.1,{covered:true})}${kim(130,340,.9)}${kim(470,340,.9,{hair:'long'})}`));
   await tell(s,'It\'s your turn. You\'ve died at home. Your family covers the kami shelf with white paper, to keep the pollution of death away from it. Most Japanese funerals are Buddhist, but your family has chosen a Shinto one.',{eye:'Shinsōsai, a Shinto funeral',note:'Shinto funerals are always held at home or in a hall, never inside a shrine. A shrine is the home of the kami, and death must not enter it.'});
   art(jp(`<g id="tb" style="opacity:0;transition:opacity 3s">${tablet(300,300,1.4)}</g>`,{bg:'#0A0C12'}));
   if(SND.ctx) pad('pad',[73.4,110,146.8],.035);
   const B=$('#pArt');
   await hold(s,{label:'Stay in the dark',ms:5000,ask:'On the night before the funeral every light goes out. A priest moves your spirit into a plain wooden tablet. Press and hold, and stay still in the dark.',onP:p=>{ const t=B.querySelector('#tb'); if(t) t.style.opacity=String(p); }});
   if(SND.ctx) bell(220,.08);
   await tell(s,'You\'re in the tablet now. From here on, your family will speak to you there, and feed you there.');
 }},
 {name:'The hidden clap',short:'The clap',col:PINE,run:async s=>{
   art(jp(`${floorJ(320,'#C9B48C')}${tablet(300,250,1)}${sakaki(240,320,1.2)}${kim(420,340,.9,{arms:'offer'})}`));
   await tell(s,'At the funeral, each mourner lays a sakaki branch before your tablet, then bows twice, claps twice, and bows once.');
   await choose(s,'How do they clap?',['Two sharp claps, like at a shrine','Two claps, without a sound'],{right:1,wrong:'At a shrine the clap calls the kami. In mourning it\'s held back. Try the other.'});
   await count(s,{ask:'Shinobi-te, the hidden clap: hands stopping just short of each other. Clap twice.',n:2,label:'Clap, silently'});
   await tell(s,'A sound you can only see.');
 }},
 {name:'Fifty days',short:'50 days',col:'#8A7A5A',run:async s=>{
   art(jp(`${floorJ(320,'#C9B48C')}<rect x="250" y="150" width="100" height="170" fill="#6A4A2A" stroke="${K}" stroke-width="3"/>${kim(420,340,.9,{hair:'long',col:K})}<circle cx="370" cy="316" r="6" fill="${WHITE}" stroke="${K}"/>`));
   await tell(s,'Your granddaughter comes home from the cremation. Before she steps inside, she sprinkles a pinch of salt over her shoulders, the simplest purification there is.',{eye:'Salt at the door'});
   art(jp(`${floorJ(300,'#B8A27A')}<g id="kd">${kamidana(300,170,1.1,{covered:true})}</g>`));
   await hold(s,{label:'Uncover the shelf',ms:4000,ask:'Forty-nine days of mourning pass, with the shelf covered. On the fiftieth day a priest ends the mourning. Press and hold to uncover the shelf.',onP:p=>{ if(p>.95) art(jp(`${floorJ(300,'#B8A27A')}${kamidana(300,170,1.1)}`)); }});
   if(SND.ctx) chime();
   await tell(s,'Fresh rice, salt and water go back on the shelf. Your tablet joins your parents\' on the ancestors\' shelf. Every morning, someone tells you the news.');
 }},
 {name:'Obon',short:'Obon',col:'#C9A23A',run:async s=>{
   art(jp(`${floorJ(320,'#C9B48C')}${fire(150,320,1.4)}${kim(300,340,.9,{col:INDIGO,obi:VERM})}${kim(400,340,.7,{col:VERM,obi:WHITE,hair:'long'})}${lantern(500,320,1.2)}`,{bg:'night'}));
   if(SND.ctx) fireLoop();
   await tell(s,'Every summer, at Obon, the ancestors come home for three days. A small fire at the gate guides you in, back to the house, the dancing and the food cooked for you.',{eye:'Obon',note:'Obon came to Japan with Buddhism, but almost every family keeps it now, whatever their religion. The welcoming fire is mukaebi, the sending fire okuribi.'});
   loopOff('fire'); if(SND.ctx) waterLoop();
   art(jp(`${riverJ(250)}<g id="ln">${lantern(160,300,1)}</g>`,{bg:'night'}));
   const B=$('#pArt');
   await drag(s,{ask:'On the last night the family sets lanterns on the river to light your way back. Drag the lantern downstream.',from:[27,72],to:[80,72],label:'Float',onP:p=>{ const l=B.querySelector('#ln'); if(l) l.style.transform=`translateX(${p*320}px)`; }});
   loopOff('water');
   await tell(s,'Letting the dead go, gently, is part of loving them. They\'ll be back next year.');
 }},
 {name:'The hidden world',short:'Hidden world',col:INDIGO,run:async s=>{
   art(jp(`<rect x="0" y="20" width="300" height="360" fill="#1A1E2A"/>${floorJ(320,'#C9B48C')}<rect x="0" y="320" width="300" height="80" fill="#2A2A30"/>${kim(430,340,.9,{col:INDIGO})}${[80,150,220].map((x,i)=>`<g opacity=".55" class="fadein" style="animation-delay:${i*.5}s">${kim(x,340,.8,{col:'#3A3E4A',skin:'#6A6A70'})}</g>`).join('')}`));
   if(SND.ctx) pad('pad',[130.8,196,261.6],.03);
   await tell(s,'Where are the dead? Thirty-three years on, after the last memorial, your name merges into the family\'s ancestral kami.',{eye:'Hirata Atsutane, 1812',note:'The Edo scholar Motoori Norinaga took the Kojiki at its word: everyone goes to dark Yomi. His follower Hirata Atsutane disagreed, and placed the dead in the kakuriyo, a hidden world right here.'});
   await still(s,{ask:'Hirata Atsutane said they\'re in the hidden world, right beside us, like a dark room next to a lit one. Be still.',ms:6000});
   await tell(s,'From the dark you can see into the light, but not the other way. The ancestors can see us. We just can\'t see them.');
 }}]};
journeySplash(J);

</script>
