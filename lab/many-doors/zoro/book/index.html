<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>window.MD_HOME='../../index.html#doors'</script>
<title>Three Nights and a Bridge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Jost:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one full-screen "flight" — a thin instrument bar on top, the scene card in the middle, the narrator's caption card below it. Single deliberate look: the safety-card palette. */
:root{
  color-scheme: light;
  --cream:#F6EBD2; --parchment:#FBF3DF; --ink:#1E2A2B; --ink-soft:#44524F;
  --teal:#1F5E63; --teal-deep:#123D40; --brown:#8A4B22; --lamp:#F2B640;
  --red:#B8352A; --ok:#2F6B2B;
  --scene-bg: var(--cream);
  --display:'Jost', 'Futura', 'Century Gothic', sans-serif;
  --body:'Atkinson Hyperlegible', 'Verdana', sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;background:var(--scene-bg);transition:background-color 2.2s ease}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--ink);background:var(--parchment);transition:opacity 1.5s,filter 1.5s}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:.8rem;text-transform:uppercase}
#stageLabel{font-family:var(--display);font-weight:500;font-size:.85rem;color:var(--ink-soft);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stageLabel b{color:var(--brown);font-weight:700;margin-right:8px;font-variant-numeric:tabular-nums}
.tog{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:36px}
.tog[aria-pressed="false"]{background:transparent;color:var(--ink-soft);border-style:dashed}
.pick{font-family:var(--body);font-size:.8rem;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:8px;padding:6px 8px;min-height:36px;max-width:190px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pick:focus-visible,.tog:focus-visible,.btn:focus-visible,.spot:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
#stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:18px;padding-block:18px;padding-inline:16px;cursor:pointer;user-select:none}
#visual{width:100%;display:flex;justify-content:center;flex:none}
.frame{position:relative;width:min(100%, calc((100dvh - 380px) * 1.5), 980px);min-width:min(100%,300px);aspect-ratio:3/2;max-width:100%;border-radius:18px;overflow:hidden;transition:filter 3s ease, transform 3s ease}
.frame>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:filter 3s ease}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.caption{flex:none;max-width:720px;width:100%;box-sizing:border-box;background:var(--parchment);border:2px solid var(--ink);border-radius:6px;padding:16px 20px;min-height:4.6em;transition:opacity .8s, filter 1.5s, transform 1.5s, border-color 1.5s}
.caption p{margin:0;font-size:clamp(1.02rem, 2.3vw, 1.3rem);line-height:1.45;text-wrap:pretty}
.caption.quiet{background:transparent;border-color:transparent;text-align:center}
.caption.dark{background:#141413;color:var(--parchment);border-color:#141413}
.caption[hidden]{display:none!important}
#hint{margin:0;font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);opacity:0;transition:opacity .6s;min-height:1em}
#hint.on{opacity:.8;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
#choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.04em;border:2px solid var(--ink);background:var(--teal);color:var(--parchment);border-radius:999px;padding:12px 22px;cursor:pointer;min-height:48px}
.btn.alt{background:var(--parchment);color:var(--ink)}

/* dissolution: the manual's chrome comes apart; the narration always stays sharp */
body.d1 .bar{opacity:.85}
body.d2 .bar{filter:blur(.6px);opacity:.6}
body.d2 .frame{border-radius:28px}
body.d3 .bar{filter:blur(1.5px);opacity:.3}
body.d3 .frame{border-radius:40px}
body.void .bar,body.void #hint{opacity:0!important}

/* title */
.title-card{width:min(100%,640px);background:var(--teal);color:var(--parchment);border:2px solid var(--ink);border-radius:18px;padding:36px 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;align-items:flex-start;cursor:default}
.title-card .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:.75rem;color:var(--lamp);text-transform:uppercase}
.title-card h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1;text-wrap:balance;text-transform:uppercase;letter-spacing:.02em}
.title-card p{margin:0;font-size:1.05rem;line-height:1.5;max-width:46ch}
.title-card ol{margin:4px 0 8px;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;font-size:.98rem}
.title-card .btn{background:var(--lamp);color:var(--ink)}

/* hotspots */
.spot{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:3px solid #FFF3D6;background:rgba(242,182,64,.35);cursor:pointer;padding:0}
.spot::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid #FFF3D6;animation:ping 1.8s ease-out infinite}
.spot.done{opacity:0;pointer-events:none;transition:opacity .6s}
@keyframes ping{from{transform:scale(.7);opacity:.9}to{transform:scale(1.4);opacity:0}}
.heartglow{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(var(--s,0.4));background:radial-gradient(circle,#FFFBEA 0%,rgba(255,221,120,.85) 35%,rgba(255,200,80,0) 70%);transition:transform 1.2s ease;pointer-events:none}

/* breath ring */
.breath{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.6);border-radius:50%;border:4px solid var(--parchment);box-shadow:0 0 0 12px rgba(251,243,223,.15);transition:transform 1s ease-in-out, opacity 1s}

/* svg scenes */
.svgscene{position:absolute;inset:0;width:100%;height:100%}
.flicker{transform-origin:300px 262px;animation:flick 1.3s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1) skewX(0)}30%{transform:scaleY(.9) skewX(3deg)}60%{transform:scaleY(1.06) skewX(-2deg)}}
.orb-down{animation:down 7s ease-in-out forwards}
.orb-up{animation:up 7s ease-in-out forwards}
@keyframes down{to{transform:translateY(91px)}}
@keyframes up{to{transform:translateY(-55px)}}
.dots{stroke-dasharray:2 7;stroke-linecap:round}

/* guide entry */
.guide{position:absolute;inset:0;background:var(--parchment);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;gap:4%;padding:5%;box-sizing:border-box}
.guide .tag,.doorsteps .tag{display:inline-block;font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:clamp(.55rem,1.4vw,.75rem);background:var(--teal);color:var(--parchment);padding:5px 10px;border-radius:4px;text-transform:uppercase}
.guide h2{margin:10px 0 8px;font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,3.4vw,2.2rem);line-height:1.05;text-transform:uppercase;color:var(--brown);text-wrap:balance}
.guide p{margin:0;font-size:clamp(.85rem,1.8vw,1.15rem);line-height:1.45}
.guide .fig{height:100%;display:flex;align-items:center;justify-content:center;background:var(--teal);border-radius:12px;min-height:0}
.frame.guideframe{aspect-ratio:auto;width:min(100%,860px)}
.frame.guideframe .guide{position:relative;inset:auto;padding:24px;gap:24px}
.guide .fig{align-self:stretch;min-height:200px;padding:12px}
.guide .fig svg{height:220px;width:auto}
.guide .gtext{box-sizing:border-box}
.guide .gtext:focus-visible{outline:3px solid var(--lamp)}
@media (max-width:760px){
  .frame.guideframe .guide{grid-template-columns:1fr;gap:16px;padding:18px}
  .guide .fig{min-height:0}
  .guide .fig svg{height:150px}
  .guide h2{font-size:1.5rem}
  .guide p{font-size:1.02rem}
}

/* clear light */
.crack{stroke-dasharray:900;stroke-dashoffset:900;animation:crack 1.2s ease-out forwards}
@keyframes crack{to{stroke-dashoffset:0}}
.bubble{opacity:0;transform:scale(.6);transform-origin:80% 80%;transition:opacity .8s, transform .8s}
.bubble.on{opacity:1;transform:scale(1)}
.ring{position:absolute;left:49.8%;top:43%;width:8%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(242,182,64,.55);transform:translate(-50%,-50%);animation:ring 4.5s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(9);opacity:0}}


/* chapters 4-5 */
.rise{animation:rise 4.5s ease-out forwards}
@keyframes rise{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
.walk{animation:walk 9s ease-in forwards}
@keyframes walk{to{transform:translateY(-22px);opacity:.25}}
.steam path{animation:steam 2.4s ease-in-out infinite}
.steam path+path{animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
.balloon{opacity:0}
.balloon.on{animation:shout 4s ease-out forwards}
@keyframes shout{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.mug{opacity:0}
.mug.on{opacity:1;animation:shake .35s linear 2}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.drawer{transition:transform 1s ease}
.drawer.open{transform:translateX(60px)}
.page{transform-box:fill-box;transform-origin:center;animation:fly 1.6s ease-in forwards}
.page.f2{animation-delay:.35s}.page.f3{animation-delay:.7s}
@keyframes fly{to{transform:translate(160px,-190px) rotate(30deg);opacity:0}}
.glass.flash{animation:flash .9s ease}
@keyframes flash{40%{fill:#FFFFFF}}
.popped{transform-box:fill-box;transform-origin:center;animation:pop 1.2s ease 1s forwards}
@keyframes pop{to{transform:scale(1.5);opacity:0}}
.drops{opacity:0;animation:drops 1s ease 2s forwards}
@keyframes drops{to{opacity:1}}
.drawerbtn{position:absolute;background:transparent;border:2px dashed rgba(251,243,223,.75);border-radius:6px;cursor:pointer;padding:0}
.drawerbtn:hover{background:rgba(242,182,64,.2)}
.drawerbtn:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.run{background:var(--red);font-size:1.2rem;letter-spacing:.24em;text-transform:uppercase;padding:14px 34px;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.checks{position:absolute;inset:0;background:var(--parchment);padding:5%;box-sizing:border-box;display:flex;flex-direction:column;gap:4%}
.ck-head span{display:block;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(.95rem,3.4vw,2rem);color:var(--brown);letter-spacing:.03em}
.ck-head small{display:block;font-size:clamp(.7rem,1.6vw,1rem);color:var(--ink-soft);margin-top:4px}
.ck-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;flex:1}
.ck{display:flex;align-items:center;gap:6%;padding:4%;border:2px solid var(--ink);border-radius:12px;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:clamp(.7rem,1.9vw,1.15rem);line-height:1.25;text-align:left;cursor:pointer;min-width:0}
.ck:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.box{flex:none;width:clamp(18px,3vw,32px);aspect-ratio:1;border:3px solid var(--ink);border-radius:6px;position:relative;background:#FFFFFF}
.ck[aria-pressed="true"] .box{background:var(--ok)}
.ck[aria-pressed="true"] .box::after{content:"";position:absolute;left:30%;top:6%;width:28%;height:58%;border:solid #FFFFFF;border-width:0 4px 4px 0;transform:rotate(45deg)}


/* epilogue */
.duo{position:absolute;inset:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.half{position:relative;border:0;padding:0;margin:0;cursor:pointer;background:none;overflow:hidden;transition:filter .4s}
.half svg{width:100%;height:100%;display:block}
.half span{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(.68rem,1.6vw,.95rem);background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;white-space:nowrap}
.duo:hover .half:not(:hover){filter:brightness(.55)}
.half:focus-visible{outline:4px solid var(--lamp);outline-offset:-4px}
.rules{position:relative;background:var(--parchment);padding:24px;display:flex;flex-direction:column;gap:18px}
.rule-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rule{display:flex;flex-direction:column;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:12px;background:var(--cream);min-width:0}
.rule svg{width:100%;height:auto;border-radius:8px;background:#E9DDBF}
.rule b{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--teal)}
.rule p{margin:0;font-size:clamp(.9rem,1.6vw,1.05rem);line-height:1.35}
.spin{transform-origin:300px 170px;animation:spinr 40s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.bluerise{animation:brise 3s ease-out forwards}
@keyframes brise{to{opacity:.85;transform:translateY(-40px)}}

/* volume 2 */
.approach{transform-origin:300px 205px;animation:approach 9s ease-in forwards}
@keyframes approach{from{transform:scale(.8)}to{transform:scale(1.14)}}
.pulse{transform-origin:300px 205px;animation:pulseg 1.24s ease-in-out infinite}
@keyframes pulseg{50%{opacity:.12;transform:scale(.92)}}
.morph .pulse{animation:none;opacity:0;transition:opacity 1s}
.wrath{transform-origin:300px 205px;transition:transform 1.6s ease, opacity 1.4s ease}
.fl{transform-origin:300px 205px;animation:flick2 .45s ease-in-out infinite alternate}
@keyframes flick2{to{transform:scale(1.04) rotate(1.5deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.peace{opacity:0;transform-origin:300px 205px;transform:scale(.3);transition:opacity 1.6s ease .5s, transform 1.6s ease .5s}
.morph .wrath{transform:scale(.12) rotate(90deg);opacity:0}
.morph .peace{opacity:1;transform:scale(1)}
.frame.facing{transition:none;animation:shake2 .12s linear infinite}
@keyframes shake2{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.holdbtn{position:absolute;inset:0;background:transparent;border:0;padding:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.holdpill{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--parchment);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:8px 16px 8px 8px;font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:clamp(.72rem,1.7vw,.95rem);white-space:nowrap}
.holdpill svg{width:30px;height:30px}
.holdbtn:focus-visible .holdpill{outline:3px solid var(--lamp);outline-offset:3px}
.zone{position:absolute;background:transparent;border:2px dashed rgba(255,255,255,.55);border-radius:50%;cursor:pointer;padding:0}
.zone:focus-visible{outline:3px solid var(--lamp)}
.closing{transform-origin:300px 205px;animation:closing 10s ease-in forwards}
@keyframes closing{from{transform:scale(1.35)}to{transform:scale(.82)}}
.orbit{transform-origin:300px 210px;animation:spinr 18s linear infinite}


/* chapters menu */
#app{position:relative}
.chap{position:absolute;right:16px;top:calc(100% + 0px);z-index:20;width:min(340px,calc(100% - 32px));max-height:min(70vh,560px);overflow-y:auto;background:var(--parchment);border:2px solid var(--ink);border-radius:14px;box-shadow:0 12px 30px rgba(20,20,19,.25);padding:14px;box-sizing:border-box}
.chapwrap{position:relative;z-index:20}
.chap h3{margin:10px 6px 6px;font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brown)}
.chap h3:first-child{margin-top:2px}
.chap ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.chap button{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;background:transparent;border:0;border-radius:8px;padding:10px 8px;font-family:var(--body);font-size:1rem;color:var(--ink);cursor:pointer;min-height:44px}
.chap button:hover,.chap button:focus-visible{background:var(--cream);outline:none}
.chap button[aria-current="true"]{background:var(--cream);font-weight:700}
.chap button small{font-family:var(--display);font-weight:700;font-size:.7rem;letter-spacing:.1em;color:var(--ink-soft);min-width:2.4em;font-variant-numeric:tabular-nums}


/* volume 3 */
.streaks{animation:streak 1.1s linear infinite}
@keyframes streak{from{transform:translateX(-140px)}to{transform:translateX(140px)}}
.blown{animation:blown 2.6s ease-in-out infinite}
@keyframes blown{50%{transform:translate(40px,-8px)}}
.elgrid{position:absolute;inset:0;background:#1B2224;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4%;padding:6%;box-sizing:border-box}
.el{background:#2A3335;border-radius:14px;display:flex;align-items:center;justify-content:center;opacity:.22;transition:opacity .4s, transform .4s;min-height:0}
.el svg{width:62%;height:auto;max-height:90%}
.el.on{opacity:1;transform:scale(1.04)}
.peb{opacity:0}
.pebs.on .peb{animation:drop .5s ease-in forwards}
@keyframes drop{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:none}}
.mref{opacity:0;transition:opacity 1.2s}
.mref.on{opacity:1}
.approach2{transform-origin:230px 200px;animation:approach 9s ease-in forwards}
.leaf{transform-origin:20px 115px;transform:scaleX(.12);transition:transform .15s}
.doorwrap{position:relative;background:var(--parchment);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:24px;padding:24px;align-items:center}
.doorsteps ol{margin:12px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-size:clamp(.95rem,1.8vw,1.1rem);line-height:1.35}
.doorpic svg{width:100%;height:auto;max-height:260px;display:block}
.doorgrid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px;background:#10181B}
.doorcard{display:flex;flex-direction:column;gap:8px;background:var(--parchment);border:2px solid var(--ink);border-radius:12px;padding:8px;cursor:pointer;font-family:var(--body);font-size:clamp(.82rem,1.6vw,1rem);line-height:1.25;color:var(--ink);text-align:left;min-width:0}
.doorcard svg{width:100%;height:auto;border-radius:8px;display:block}
.doorcard:hover{transform:translateY(-2px)}
.doorcard.nope{opacity:.4;filter:grayscale(1)}
.doorcard:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}

/* pilot: shared production layer */
#visual{position:relative}
.leaving{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;pointer-events:none;z-index:4;animation:leave .7s ease forwards}
@keyframes leave{to{opacity:0;transform:scale(.985)}}
.entering{animation:enter .8s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{clip-path:inset(0 0 0 100% round 18px)}to{clip-path:inset(0 0 0 0 round 18px)}}
.amb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.kb{animation:kb 24s ease-out forwards;transform-origin:62% 48%}
@keyframes kb{to{transform:scale(1.09)}}
.glowspot{position:absolute;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.55) 0%,rgba(255,190,90,.18) 40%,rgba(255,190,90,0) 70%);mix-blend-mode:screen;pointer-events:none;animation:candle 2.3s steps(9,end) infinite;transition:opacity 1.2s ease}
@keyframes candle{0%{opacity:.85;transform:translate(-50%,-50%) scale(1)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}35%{opacity:.75}55%{opacity:.95;transform:translate(-50%,-50%) scale(.97)}75%{opacity:.8}100%{opacity:.9;transform:translate(-50%,-50%) scale(1.02)}}

/* Three Nights and a Bridge, the full book. The choice, the cord, your last hours and the Ashem Vohu, the dog's gaze and the pairs who carry you,
   three nights beside your own head, the river of tears, the fourth dawn, your own self, Rashnu's scales, the bridge, the three houses,
   the towers, the fravashis coming home, and the making wonderful. After the Gathas, the Avesta, the Book of Arda Viraf and the Bundahishn.
   A first draft, to be read by Zoroastrian priests and readers. */
const BOOK={home:'bedside', toast:'Learned: ', pathLabel:'Path', pathTitle:'What you have learned', detourTitle:'Wrong turns you walked',
  pathNote:'Every wrong turn rewinds. Zarathustra left the choice to you, and you can always choose again.',
  guideBack:'Back to the book', voiceSample:'Good thoughts, good words, good deeds.'};

/* ---------- pictures ---------- */
const PG=(inner,lab,o)=>frame(sv(zo(inner,o),lab));
function words(x,y,t,{size=30,col=FIRE}={}){ return `<text x="${x}" y="${y}" text-anchor="middle" font-family="Forum,Georgia,serif" font-size="${size}" fill="${col}" letter-spacing="2">${t}</text>`; }
function lamp(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><circle cy="-34" r="40" fill="url(#fire)" class="flick"/><path class="flame" d="M-6 -16 Q-6 -34 0 -44 Q6 -34 6 -16Z" fill="${FIRE}" stroke="${K}" stroke-width="1.2"/><path d="M-26 -16 H26 Q22 0 0 2 Q-22 0 -26 -16Z" fill="#C9A15A" stroke="${K}" stroke-width="2"/><rect x="-8" y="0" width="16" height="10" fill="#C9A15A" stroke="${K}" stroke-width="1.5"/></g>`; }
function home(inner='',{dim=false}={}){ return `<rect width="600" height="400" fill="${dim?'#0E1428':'#1A2440'}"/><path d="M400 210 V110 Q450 50 500 110 V210Z" fill="#0B1020" stroke="${FIRE}" stroke-width="3"/>${stars(10,7,90).replace(/<circle /g,'<circle transform="translate(400 70) scale(.17 1)" ')}<rect y="300" width="600" height="100" fill="#5A2A2A"/><rect y="300" width="600" height="14" fill="url(#tile)"/><path d="M0 352 H600" stroke="${FIRE}" stroke-width="2" opacity=".5"/>${inner}`; }
function bedZ(x,y){ return `<g transform="translate(${x} ${y})"><rect x="-130" y="-30" width="260" height="18" fill="#3A2A2A" stroke="${K}" stroke-width="2"/><path d="M-126 -12 V20 M126 -12 V20" stroke="${K}" stroke-width="5"/><path d="M-110 -30 Q-118 -52 -94 -54 L100 -50 Q118 -46 112 -30Z" fill="${WHITE}" stroke="${K}" stroke-width="2"/><circle cx="-100" cy="-58" r="12" fill="${SKIN}" stroke="${K}" stroke-width="1.6"/><path d="M-112 -62 Q-100 -76 -88 -62Z" fill="${WHITE}" stroke="${K}" stroke-width="1.2"/></g>`; }
function kusti(x,y,s=1,{tied=true}={}){ return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse rx="110" ry="26" fill="none" stroke="${WHITE}" stroke-width="7"/><ellipse rx="110" ry="26" fill="none" stroke="${K}" stroke-width="1" stroke-dasharray="3 4"/><ellipse rx="96" ry="20" fill="none" stroke="${WHITE}" stroke-width="5" opacity=".8"/><ellipse rx="82" ry="15" fill="none" stroke="${WHITE}" stroke-width="4" opacity=".65"/>${tied?`<circle cx="0" cy="26" r="9" fill="${WHITE}" stroke="${K}" stroke-width="1.5"/><path d="M-4 32 L-14 70 M4 32 L14 70" stroke="${WHITE}" stroke-width="6" stroke-linecap="round"/>`:''}</g>`; }
function paiwand(x1,x2,y){ return `<path d="M${x1} ${y} Q${(x1+x2)/2} ${y+22} ${x2} ${y}" stroke="${WHITE}" stroke-width="5" fill="none"/><path d="M${x1} ${y} Q${(x1+x2)/2} ${y+22} ${x2} ${y}" stroke="${K}" stroke-width="1" fill="none" stroke-dasharray="2 3"/>`; }
function bier(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-90" y="-10" width="180" height="12" fill="#6A6A6A" stroke="${K}" stroke-width="2"/><path d="M-100 -4 H-130 M100 -4 H130" stroke="#6A6A6A" stroke-width="6"/><path d="M-80 -10 Q-86 -30 -66 -32 L72 -28 Q86 -24 80 -10Z" fill="${WHITE}" stroke="${K}" stroke-width="2"/></g>`; }
function tears(y=290){ let o=`<rect x="0" y="${y}" width="600" height="${400-y}" fill="#1E3A5A"/>`; for(let k=0;k<4;k++){ let d=`M0 ${y+14+k*24}`; for(let x=0;x<600;x+=40) d+=` q20 -8 40 0`; o+=`<path d="${d}" stroke="#7AAAD0" stroke-width="2.5" fill="none" opacity=".7"/>`; } return o; }
function drops(n,x0=160,dx=50,y=120){ return Array.from({length:n},(_,i)=>`<path class="tearfall" style="animation-delay:${(i*.37)%2.2}s" d="M${x0+i*dx} ${y+(i%3)*20} q-6 10 0 14 q6 -4 0 -14Z" fill="#9ACAE8"/>`).join(''); }
function table(x,y,inner=''){ return `<g transform="translate(${x} ${y})"><rect x="-140" y="-12" width="280" height="14" fill="#7A4A26" stroke="${K}" stroke-width="2"/><path d="M-120 2 V44 M120 2 V44" stroke="#7A4A26" stroke-width="7"/>${inner}</g>`; }

function coin(x,y){ return `<g transform="translate(${x} ${y})"><circle r="12" fill="${FIRE}" stroke="${K}" stroke-width="1.5"/><circle r="7" fill="none" stroke="${K}" stroke-width="1"/></g>`; }

function step(k){ if(!ctx) return; thump(.35); bell(330+k*60,.06,3); }
function tapCount(n,lab,onTap){ let k=0; choices.innerHTML=`<button class="btn" type="button" id="tc">${lab} · 0 of ${n}</button>`; const b=$('#tc'); b.focus({preventScroll:true});
  b.onclick=e=>{ e.stopPropagation(); initAudio(); k++; onTap&&onTap(k); b.textContent=`${lab} · ${k} of ${n}`; if(k>=n){ b.disabled=true; setTimeout(()=>{ choices.innerHTML=''; next(); },700); } }; }

/* ---------- the book ---------- */

const W=[6,14,26,40];
const S=[
{ key:'title', label:'', bg:DUSKZ,
  view:()=>`<div class="title-card" role="dialog" aria-label="Start"><span class="eyebrow">Many Doors · Zoroastrianism · the full book</span><h1>Three Nights and a Bridge</h1>
    <p>Zoroastrians teach that the soul stays beside the body for three nights, reliving its life. At dawn on the fourth day it meets its own self, and walks out onto a bridge that widens or narrows depending on how it lived. This book walks that road with you, and with the family you leave behind.</p>
    <ol><li>Headphones make it better.</li><li>Tap, or press Space, to move on.</li><li>When the book asks you something, answer it yourself.</li></ol>

{ key:'gathas', label:'The choice', bg:DUSKZ,
  view:()=>PG(`${altar(300,330,1.2)}${zfig(150,340,1,{priest:true,arms:'pray'})}${zfig(450,340,1,{arms:'pray'})}`,'A fire burns on a tall brass altar. A priest in white and a worshipper stand on either side, praying.'),
  enter(){ mood('fire','night'); },
  guide:{title:'A living faith',text:"Zoroastrianism is one of the oldest religions still practised. Most Zoroastrians today are Parsis in India, Iranis and Zoroastrians in Iran, and families who have settled in North America, Britain and Australia. Customs differ between them, and between more traditional and more reformist families. This book follows the classical texts, and the rites as they are often kept."},
  beats:[
    {text:"Zarathustra lived in what is now Iran or Central Asia, probably between 1500 and 1000 BCE. His hymns, the Gathas, are among the oldest religious poetry in the world, and they are still recited in fire temples today."},
    {text:"His great idea was choice. At the beginning of things there were two spirits, he sang: one chose truth and goodness, the other chose the lie. Every person stands between them, and has to choose too.", lock:true, afterType(){ pick([{label:'Choose the lie',go:'x_lie'},{label:'Choose asha: truth'}]); }} ]},

{ key:'asha', label:'The choice', bg:DUSKZ, learn:'choice',
  view:()=>PG(`${altar(300,330,1.5)}${words(300,80,'ASHA')}`,'The fire blazes up. Above it, the word Asha, truth.'),
  enter(){ mood('fire','warm'); chime(); },
  beats:[{text:"Asha: truth, order, the way things ought to be. Hear the best things with your ears, Zarathustra says, look at them with a clear mind, and decide, each person for themselves. Everything that happens after death follows from this. No one imposes a verdict on you. What you meet at the end is the shape of what you chose."}] },

{ key:'kusti', label:'The cord', bg:DUSKZ, learn:'three',
  view:()=>PG(`<circle cx="300" cy="180" r="150" fill="url(#fire)" opacity=".5"/>${kusti(300,200,1.3)}${words(130,300,'HUMATA',{size:24})}${words(300,365,'HUKHTA',{size:24})}${words(470,300,'HVARSHTA',{size:24})}`,'A white woollen cord wound three times in a loop and knotted. Below it, three words: humata, hukhta, hvarshta.'),
  enter(){ mood('fire','warm'); },
  guide:{title:'The sudreh and kusti',text:"At an initiation called the navjote, usually between the ages of seven and fifteen, a Zoroastrian child is given a white cotton shirt, the sudreh, and a cord of lamb's wool, the kusti, woven from seventy-two threads. Every day, with prayers, they untie it and tie it again, three times around the waist, knotted at front and back. It's a way of choosing again."},
  beats:[
    {text:"Every day, a Zoroastrian unties a thin white cord from around the waist and ties it again, with prayers. It goes around three times, one for each of the three things the whole religion rests on. Tap each one.", lock:true, show(){ tapAll([
      [22,62,'Good thoughts',"Humata: good thoughts. Zarathustra put thought first, because every word and every deed starts there."],

    {text:"Now tie the cord. Hold, while it goes around three times.", lock:true, show(){ holdOn({label:'Tie the kusti',ms:5000,wait:600,onDone:()=>{ bell(392,.07,3); setTimeout(()=>bell(440,.07,3),500); setTimeout(()=>bell(523,.07,3),1000); }}); }},
    {text:"Good thoughts, good words, good deeds. Keep them in mind. You'll need all three at the bridge."} ]},

/* ===== Volume 1: the last hours ===== */
{ key:'v1', label:'Volume 1', bg:'var(--teal)',
  view:()=>card('Volume 1','The Last Hours',"Death, for Zoroastrians, is not part of God's good creation. It is the work of the destructive spirit. But the one who dies is not to blame, and is surrounded with prayer to the end."),

{ key:'bedside', label:'The last hours', bg:DUSKZ,
  view:()=>PG(home(`${bedZ(250,320)}${zfig(420,330,.9,{priest:true,arms:'pray'})}${zfig(100,330,.85,{hair:true,cap:false,robe:ROSE})}${lamp(530,300,.8)}`),'A bedroom at night. You lie in bed under white sheets. A priest in white prays at the foot of the bed; your daughter sits by your head. An oil lamp burns.',{sky:'#1A2440'}),

      [70,72,'The priest',"The priest is reciting the Patet, the prayer of repentance. If you can't say it yourself, he says it for you: for every wrong thought, word and deed, I am sorry, and I turn away from it."],

    {text:"Then the prayer every Zoroastrian learns first, the one they hope to say at the very end. An Avestan hymn says the Ashem Vohu said at the end of life, while holding to good thoughts, words and deeds, is worth all that lies between earth and heaven."},
    {text:"In English: truth is the best good. It is happiness. Happiness to the one who is truthful for the sake of the best truth. Hold, and say it with your family.", lock:true, show(){ holdOn({label:'Ashem Vohu',ms:6000,wait:800,onDone:()=>{ heartStop(); clockOff(); breath(1.5,5); }}); }} ]},

{ key:'sagdid', label:'The dog’s gaze', bg:DUSKZ,

  beats:[

    {text:"It's called sagdid, the dog's gaze. Tradition prefers a dog with two spots above its eyes, a four-eyed dog. Its look is said to drive the corpse demon away. It's done again at every prayer time until you are carried out."},
    {text:"Your oldest friend arrives, in tears. She wants to hold you one last time.", lock:true, afterType(){ pick([{label:'Let everyone hold and kiss the body',go:'x_touch'},{label:'Say goodbye from beside the circle'}]); }} ]},

{ key:'nights', label:'Three nights', bg:NIGHTZ,
  view:()=>PG(`${lamp(300,330,1.3)}<g id="sl">${urvan(300,200,1.2)}</g>${words(300,80,'NIGHT ONE',{size:22,col:WHITE})}`,'A single lamp burning in the dark. Above it, your soul, glowing faintly.'),
  enter(){ mood('night','fire'); },
  guide:{title:'Sraosha',text:"Sraosha, whose name means listening or obedience, is the angel who guards the soul through these three nights, when the forces of the lie are said to be most dangerous to it. The family prays to Sraosha, and in many families a priest keeps a fire burning and recites prayers through each night."},
  beats:[
    {text:"Now the three nights. The Hadokht Nask says your soul sits near the head of the body, singing a verse of the Gathas: happiness to the one through whom happiness comes to others. And you relive your life."},
    {text:"A good soul, the text says, feels as much joy in those nights as the whole living world feels. Your family keeps the lamp burning and prays to Sraosha to guard you. Keep watch with them, one night at a time.", lock:true, afterType(){ tapCount(3,'Keep watch until morning',k=>{ bell(330,.07,3); const t=$('.svgscene text'); if(t) t.textContent=['NIGHT TWO','NIGHT THREE','THE THIRD DAWN'][k-1]; }); }},
    {text:"Your daughter has not stopped crying since the night you died. She cries all day, and all night.", lock:true, afterType(){ pick([{label:'Let her weep without end. It shows how much she loved you.',go:'x_tears'},{label:'Let her weep, then let the prayers carry her'}]); }} ]},

{ key:'uthamna', label:'Three nights', bg:DUSKZ, learn:'tears',
  view:()=>PG(home(`${altar(300,330,1)}${zfig(150,340,.9,{hair:true,cap:false,robe:ROSE,arms:'pray'})}${zfig(450,340,.9,{priest:true,arms:'pray'})}`),'Your daughter and a priest pray together beside a fire.',{sky:'#1A2440'}),
  enter(){ mood('fire','warm'); },
  beats:[{text:"She weeps, and then she prays. On the afternoon of the third day the family gathers for the Uthamna ceremony, and friends make gifts to charity in your name. Grief is right, the tradition says. But your soul has a crossing to make, and the prayers of the living help it more than endless tears."}] },

/* ===== Volume 3: the bridge ===== */
{ key:'v3', label:'Volume 3', bg:'var(--teal)',
  view:()=>card('Volume 3','The Bridge',"At dawn on the fourth day your soul leaves the body for good. The family holds the Chahrum ceremony at that same dawn, while you go out to meet what you made."),
  enter(){ mood('wind'); bell(196,.1,5); }, beats:[{text:null}] },

{ key:'wind', label:'The fourth dawn', bg:'#C46A6A',
  view:()=>PG(`${peaks()}<g class="drift">${[0,1,2,3,4].map(i=>`<path d="M${40+i*100} ${120+i*20} q30 -10 60 0 q30 10 60 0" stroke="${WHITE}" stroke-width="3" fill="none" opacity=".6"/>`).join('')}</g>${urvan(300,260,1.4)}`,'Dawn over the mountains. Ribbons of wind blow across the sky toward your soul.',{sky:'dawn'}),
  enter(){ mood('wind'); },
  beats:[
    {text:"As the third night ends, a wind comes from the south. To a righteous soul, the Hadokht Nask says, it smells sweeter than any wind it has ever known."},
    {text:"Be still, and let it reach you. Don't tap.", lock:true, cls:'quiet', afterType(){ stillTest({ms:9000,pass:'daena',fail:'windFail'}); }} ]},

{ key:'windFail', label:'The fourth dawn', bg:'#C46A6A',
  view:()=>PG(`${peaks()}${urvan(300,260,1.2)}`,'The wind has dropped.',{sky:'dawn'}),
  beats:[{text:"You moved, and the wind passed you by. It's only a breeze, but it's the first thing your own life sends to meet you. Try again.", lock:true, afterType(){ tryAgain('Wait for the wind','wind',1); }}] },

{ key:'daena', label:'Your own self', bg:'#C46A6A',
  view:()=>PG(`${peaks()}${urvan(170,280,1.1)}<g class="fadein">${maiden(410,340,1.1)}</g>${dog(520,340,.55,{flip:true})}${dog(300,340,.55)}`,'On the wind, a radiant young woman in white walks toward your soul, with two dogs beside her.',{sky:'dawn'}),
  enter(){ mood('light','wind'); chime(); },
  guide:{title:'The daena',text:"Daena is often translated as conscience, or religion, or simply self. In the Hadokht Nask she appears as a beautiful girl of fifteen. Later Persian texts say that to the wicked she comes as a hideous old woman, and gives the same answer. Either way, what meets you is not a stranger. It is the self your choices made."},
  beats:[
    {text:"On the wind comes a young woman, the most beautiful you have ever seen: radiant, tall and strong. Dogs walk beside her. Who are you? you ask."},
    {text:"I am your own daena, she says. Your own self. I was lovely, and you made me lovelier, with your good thoughts, your good words and your good deeds. Then she asks about the times you did wrong.", lock:true, afterType(){ pick([{label:'Explain that it wasn’t really your fault',go:'x_excuse'},{label:'Own them. They were yours too.'}]); }} ]},

{ key:'own', label:'Your own self', bg:'#C46A6A', learn:'self',
  view:()=>PG(`${peaks()}<g transform="translate(250 280)">${urvan(0,0,1.1)}</g>${maiden(350,330,1)}`,'Your soul and your daena stand together.',{sky:'dawn'}),
  enter(){ mood('light'); },
  beats:[{text:"You own them. They were yours too, and she knows it. Zarathustra's whole teaching rests on this: no fate, no demon and no god made your choices for you. That's frightening, and it's also a kind of dignity. She takes your hand, and leads you to the head of the bridge."}] },

{ key:'judges', label:'The scales', bg:DUSKZ,
  view:()=>PG(`${judge(130,340,1,{robe:'#6A3E8A'})}${judge(470,340,1,{robe:'#3E5C8A',arms:'pray'})}${scalesZ(300,340,1.2)}${judge(300,215,.6,{robe:EMBER})}`,'Three judges at the head of the bridge. In the middle stands a great pair of golden scales.'),
  enter(){ mood('night','warm'); },
  beats:[
    {text:"Three judges wait at the head of the bridge. Mithra, guardian of promises. Sraosha, who has guarded you for three nights. And Rashnu the just, with golden scales. Tap each one.", lock:true, show(){ tapAll([
      [22,72,'Mithra',"Mithra, the judge of promises and contracts. Breaking your word, the Avesta says, is one of the worst things a person can do."],
      [50,42,'Rashnu',"Rashnu, whose name means the just one. He holds the scales on which your thoughts, words and deeds are weighed."],
      [78,72,'Sraosha',"Sraosha, listening. He has kept the demons off you for three nights, and now stands beside you here."] ]); }},
    {text:"You remember the money you have in your pocket. A little gold might help.", lock:true, afterType(){ pick([{label:'Offer Rashnu a gift',go:'x_bribe'},{label:'Step onto the scales as you are'}]); }} ]},

{ key:'weigh', label:'The scales', bg:DUSKZ, learn:'just',
  view:()=>PG(`${judge(130,340,1,{robe:'#6A3E8A'})}${judge(470,340,1,{robe:'#3E5C8A',arms:'pray'})}${scalesZ(300,340,1.2)}${judge(300,215,.6,{robe:EMBER})}`,'The scales swing as your life is weighed.'),
  enter(){ mood('night','warm'); },
  beats:[
    {text:"Your thoughts, words and deeds are weighed. Hold, and keep the scales steady.", lock:true, show(){ holdOn({label:'Keep the scales still',ms:6000,wait:600,onProgress:p=>{ const b=$('.beam'); if(b) b.style.transform=`rotate(${(1-p)*Math.sin(performance.now()/280)*9}deg)`; },onDone:()=>{ const b=$('.beam'); if(b) b.style.transform='rotate(-6deg)'; chime(); }}); }},
    {text:"The good side sinks. Your good outweighs your bad. If the two had balanced exactly, there's a place for that too, which you'll see."} ]},

{ key:'bridge', label:'The bridge', bg:NIGHTZ,
  view:()=>PG(`<g id="br">${bridge(10)}${urvan(160,176,.7)}</g>`,'The Chinvat Bridge, very narrow, running across a black chasm from one mountain peak to another.'),
  enter(){ mood('wind','night'); },
  guide:{title:'Nine spears wide',text:"A later Persian text, the Dadestan i Denig, says the bridge is like a beam with many sides. For the righteous it turns its broad side up, as wide as nine spears laid end to end. For the wicked it turns its edge up, as thin as a razor, and they fall into the House of Lies below."},
  beats:[
    {text:"Then the Chinvat Bridge, the bridge of the separator. It runs from the peak of the world mountain across a chasm. Every soul has to cross it. From here, it looks as thin as a hair."},
    {text:"Your daena leads you. Take the four steps across: good thoughts, good words, good deeds, and the last step into endless light.", lock:true, afterType(){ tapCount(4,'Take a step',k=>{ const b=$('#br'); if(b) b.innerHTML=`${bridge(W[k-1]+10)}<g transform="translate(${160+k*60} ${176-k*2})">${urvan(0,0,.7)}</g>${maiden(Math.min(430,200+k*60),176,.45)}`; step(k); }); }} ]},

{ key:'across', label:'The bridge', bg:NIGHTZ, learn:'bridge',
  view:()=>PG(`${bridge(40)}<circle cx="470" cy="120" r="120" fill="url(#fire)"/><g transform="translate(450 170)">${urvan(0,0,.8)}</g>`,'The bridge, now broad and golden. Your soul stands on the far side in the light.'),
  enter(){ mood('light'); chime(); },
  beats:[{text:"Under your feet the bridge widened with every step, until it was broad and golden. The Hadokht Nask names the steps: the first into the heaven of good thought, the second into good word, the third into good deed, and the fourth into the Endless Lights. You built that width yourself, one day at a time."}] },

{ key:'houses', label:'The three houses', bg:DUSKZ,
  view:()=>PG(`${sunMoonStar()}${[0,1,2,3].map(i=>`<ellipse cx="${80+i*35}" cy="${330-(i%2)*14}" rx="46" ry="22" fill="#8A8A96" opacity=".75"/>`).join('')}<path d="M420 372 Q430 320 495 316 Q560 320 570 372Z" fill="#1A0A0A" stroke="${K}" stroke-width="2"/>${[450,480,510,540].map((x,i)=>`<circle cx="${x}" cy="${352-i%2*8}" r="3" fill="#E0501E"/>`).join('')}`,'The stars, the moon and the sun rising up the sky. Grey clouds below on the left, and a dark cave on the right.'),
  enter(){ mood('light','night'); },
  beats:[
    {text:"In the Book of Arda Viraf, a righteous priest drinks a potion and visits the afterlife for seven days, so he can come back and tell what he saw. He describes three places. Tap each one.", lock:true, show(){ tapAll([
      [77,25,'House of Song',"Garodman, the House of Song, reached through the stations of the stars, the moon and the sun. It's all light and music, in the presence of Ahura Mazda, the Wise Lord. This is where you are going."],
      [19,82,'The place of the mixed',"Hamistagan, the place of the mixed, for those whose good and bad were exactly equal. It's grey, with no reward and no punishment, only heat and cold."],
      [82,86,'House of Lies',"The House of Lies, dark and cramped, so crowded that each soul feels completely alone. Arda Viraf describes its punishments at great length."] ]); }},
    {text:"But none of these is for ever. That's one of the most hopeful ideas in any religion, and you'll see it at the end of this book."} ]},

/* ===== Volume 4: what the living do ===== */
{ key:'v4', label:'Volume 4', bg:'var(--teal)',
  view:()=>card('Volume 4','What the Living Do',"Your family's work isn't over. They pray on the fourth day, the tenth, the thirtieth and every year after. And once a year, the tradition says, you come home."),
  enter(){ mood('warm'); bell(196,.1,5); }, beats:[{text:null}] },

{ key:'towers', label:'The towers', bg:'#8C7A5A',
  view:()=>PG(`<rect x="0" y="300" width="600" height="100" fill="#8C7A5A"/>${dakhma(300,300,1.2)}`,'A round stone tower on a hill under a pale sky. Birds circle above it.',{sky:'#E8D8B0'}),
  enter(){ mood('wind'); },
  guide:{title:'A debate in the community',text:"The towers of silence are still used in Mumbai, though vultures have almost vanished from India, and solar reflectors now help. In Iran most communities moved to burial in cement-lined graves during the twentieth century, and many Zoroastrians abroad choose burial or cremation. Families and priests still debate what the old laws require today."},
  beats:[
    {text:"Earth, water and fire are sacred, so traditionally Zoroastrians neither buried nor burned their dead. Your body is laid on top of a dakhma, a tower of silence, open to the sun and the birds, so it can go back to nature without polluting the good creation."},
    {text:"It sounds harsh to outsiders. To many Zoroastrians it is the last good deed a body can do: feed the birds, and harm nothing. In time the sun bleaches the bones, and they are swept into a central well."} ]},

{ key:'muktad', label:'The fravashis', bg:DUSKZ,
  view:()=>PG(home(`${table(300,300,`${vase(-90,-12)}${vase(0,-12,FIRE)}${vase(90,-12,TURQ)}`)}${lamp(520,300,.8)}<g id="fv" opacity=".2" style="transition:opacity 1.5s">${faravahar(230,140,.7)}</g>`),'A table set with vases of flowers and a burning lamp. Above it, faintly, a winged figure.',{sky:'#1A2440'}),
  enter(){ mood('fire','warm'); },
  guide:{title:'Muktad',text:"The last ten days of the Zoroastrian year are called Muktad by Parsis and Farvardigan by Iranis. Families set out flowers in silver vases, keep a fire burning and recite prayers for their dead. Some fire temples set aside a whole room filled with vases, one for each family."},
  beats:[
    {text:"Every person has a fravashi, a guardian spirit that existed before they were born and outlives them. The Farvardin Yasht says that in the last ten days of the year, the fravashis of the dead come home, asking: who will praise us? Who will welcome us?"},
    {text:"It's the last ten days of the year. Your family is busy, and it's a lot of work.", lock:true, afterType(){ pick([{label:'Skip it this year',go:'x_forget'},{label:'Set out the flowers and light the lamp'}]); }} ]},

{ key:'welcome', label:'The fravashis', bg:DUSKZ, learn:'fravashi',
  view:()=>PG(home(`${table(300,300,`${vase(-90,-12)}${vase(0,-12,FIRE)}${vase(90,-12,TURQ)}`)}${lamp(520,300,.8)}<g>${faravahar(230,140,.7)}</g>`),'The table of flowers, with a winged figure glowing above it.',{sky:'#1A2440'}),
  enter(){ mood('fire','light'); chime(); },
  beats:[
    {text:"They set out the flowers. Light the lamp for them.", lock:true, afterType(){ tapCount(1,'Light the lamp',()=>bell(523,.08,3)); }},
    {text:"The Yasht says that a fravashi welcomed with prayer and gifts goes away blessing the house: may it have herds of cattle and men, a swift horse and a solid chariot. You were remembered. You came home."} ]},

{ key:'frasho', label:'Making wonderful', bg:'#E07A1E',
  view:()=>PG(`${metalRiver(260)}${[110,220,330,440].map((x,i)=>`<g class="rise" style="animation-delay:${i*.3}s">${zfig(x,300,.6,{robe:WHITE})}</g>`).join('')}`,'At the end of time, people of every kind walk through a river of molten metal.',{sky:'dawn'}),
  enter(){ mood('light','fire'); },
  beats:[
    {text:"At the end of time comes Frashokereti, the making wonderful. A saviour, the Saoshyant, will be born, the dead will rise in their bodies, and the whole world will be made new."},
    {text:"Every person, living and risen, will pass through a river of molten metal. To the wicked it will burn. To the righteous, the Bundahishn says, it will feel like walking through warm milk. Hold, and walk through it.", lock:true, show(){ holdOn({label:'Walk through the river',ms:5000,wait:600,onDone:()=>chime()}); }} ]},

{ key:'renewal', label:'Making wonderful', bg:'#E07A1E', learn:'renewal',
  view:()=>PG(`<circle cx="300" cy="200" r="190" fill="url(#fire)" opacity=".6"/>${faravahar(300,190,1.4)}`,'The winged faravahar, glowing in a great golden light.',{sky:'dawn'}),
  enter(){ mood('light'); },
  beats:[{text:"Everyone comes out purified. Even the House of Lies is emptied and cleansed, and the destructive spirit is defeated for good. In the end, every soul reaches the House of Song. In this religion, no one is lost for ever, and evil itself comes to an end."}] },

{ key:'lastpage', label:'The last page', bg:DUSKZ,
  view:()=>frame(sv(zoCover(),'The bridge, broad and golden, with your daena and two dogs, under the glow of the fire.')),
  enter(){ mood('warm'); },
  beats:[
    {text:"That's the passage: a cord tied every day, the Ashem Vohu at the end, the dog's gaze, three nights of remembering, a fragrant wind, your own self coming to meet you, scales that can't be bribed, and a bridge whose width you built yourself."},
    {text:"Zarathustra's whole teaching fits on one line, and Zoroastrians tie it around their waists every day: good thoughts, good words, good deeds."} ]},

{ key:'end', label:'The end', bg:'var(--teal)',
  view:()=>`<div class="title-card" style="cursor:default"><span class="eyebrow">The end of the book</span><h1>Good thoughts, good words, good deeds</h1>
    <p>That was the whole road: the choice, the cord, the last hours, the dog's gaze, three nights, the fourth dawn, your own self, the scales, the bridge, the three houses, the towers, the fravashis and the making wonderful.</p><p id="endsum" style="font-weight:700"></p>
    <p class="draft">A first draft, to be read by Zoroastrian priests and readers before it is shared widely. Sources: the Gathas (Yasna 28–53), especially Yasna 30; Hadokht Nask (Yasht 22) and Yasht 21; Farvardin Yasht (Yasht 13); Videvdad 7, 8 and 19; the Book of Arda Viraf; Dadestan i Denig; Bundahishn 34. After James Darmesteter, Fereydun Vahman, Jivanji Jamshedji Modi, The Funeral Ceremonies of the Parsees, and Mary Boyce, Textual Sources for the Study of Zoroastrianism.</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="again" type="button">Read it again</button><button class="btn alt" id="pathend" type="button">See your path</button><button class="btn alt" id="chend" type="button">Choose a chapter</button></div>
    <div class="endlinks"><a href="../walk/">Walk Nine Nights to the Bridge</a><a href="../../index.html#doors">Back to Many Doors</a></div></div>`,
  enter(){ mood('warm'); $('#again').onclick=e=>{ e.stopPropagation(); go(idx('gathas')); }; $('#chend').onclick=e=>{ e.stopPropagation(); openChapters(true); }; $('#pathend').onclick=e=>{ e.stopPropagation(); openPath(); };
    $('#endsum').textContent=`You learned ${journey.learned.size} of ${LESSONS.length} lessons and walked ${journey.visited.size} of ${DETOURS.length} wrong turns.`+(journey.learned.size===LESSONS.length?' You know the way.':' Read again to learn the rest.'); },
  beats:[{text:null,lock:true}] },

/* ===== wrong turns ===== */
{ key:'x_lie', label:'A wrong turn', bg:NIGHTZ,
  view:()=>PG(`${altar(300,330,1.2,{lit:false})}${words(300,90,'DRUJ',{col:'#8A8A96'})}`,'The altar, cold and dark. Above it, the word Druj, the lie.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"You choose the lie. It's easier, most days. A small untruth here, a convenient one there. The fire on the altar goes out, and everything after this in the book would be the shape of that choice: a foul wind, a hag instead of a girl, a bridge as thin as a razor."},
    {text:"But Zarathustra never says the choice is made once. A Zoroastrian makes it again every day, every time they retie the cord. Rewind, and choose again.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_touch', label:'A wrong turn', bg:DUSKZ,
  view:()=>PG(home(`${slab(270,330,1)}${zfig(200,340,.85,{hair:true,cap:false,robe:ROSE,arms:'open'})}${zfig(330,340,.85,{arms:'open'})}${zfig(420,340,.85,{arms:'open'})}`),'Friends and family crowd around the body and hold it.',{sky:'#1A2440'}),
  enter(){ mood('drone','room'); },
  beats:[
    {text:"Everyone crowds in. They hold you, kiss your face, stroke your hair. It feels like love. But in the tradition, the touch of a corpse makes the living impure, and each of them would now need a long purification, the nine-night barashnum, before they could pray at the fire again."},
    {text:"Keeping the dead apart isn't coldness. It's how the tradition protects the living, and only those trained and joined in pairs touch the body. Rewind, and say goodbye from beside the circle.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_tears', label:'A wrong turn', bg:NIGHTZ,
  view:()=>PG(`${tears(270)}${drops(8)}<g transform="translate(300 300)">${urvan(0,0,.9)}</g>`,'A dark river made of falling tears. Your soul struggles in the middle of it.'),
  enter(){ mood('water','drone'); },
  beats:[
    {text:"She weeps without stopping, for days. And on the road, your soul comes to a great dark river and can't get across. In the Book of Arda Viraf the priest sees exactly this: a river made of the tears that the living shed for the dead, with souls struggling in it."},
    {text:"The tradition doesn't forbid grief. It warns against grief without limit, because the dead feel it. Mourn, then pray, and let them go. Rewind.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_excuse', label:'A wrong turn', bg:'#4A4A4A',
  view:()=>PG(`${peaks()}${urvan(170,280,1)}${maiden(410,340,1.1,{fair:false})}`,'The radiant woman has turned grey and old.',{sky:'#4A4A4A'}),
  enter(){ mood('drone'); },
  beats:[
    {text:"You explain. You were tired. Someone else started it. Anyone would have done the same. As you talk, she changes: her face greys, her back bends, until an old woman stands where the girl was."},
    {text:"She is your own self. You can't lie to her, and you can't hand your choices to someone else. That's the whole point of Zarathustra's teaching. Rewind, and own them.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_bribe', label:'A wrong turn', bg:DUSKZ,
  view:()=>PG(`${scalesZ(300,340,1.2)}${coin(220,250)}${coin(250,236)}${coin(236,262)}${judge(300,215,.6,{robe:EMBER})}`,'Gold coins held out toward the golden scales.'),
  enter(){ mood('drone'); },
  beats:[
    {text:"You hold out the gold. Rashnu doesn't even look at it. The scales don't move by a hair."},
    {text:"The Book of Arda Viraf says Rashnu's scales favour no one: not the righteous, not the wicked, not lords nor rulers. Nothing you own can be weighed, only what you thought, said and did. Rewind, and step on as you are.", lock:true, afterType(){ rewindButton(); }} ]},

{ key:'x_forget', label:'A wrong turn', bg:NIGHTZ,
  view:()=>PG(home(`${table(300,300)}${faravahar(230,140,.7).replace('<g ','<g opacity=".25" ')}`,{dim:true}),'An empty table in a dark room. A faint winged figure hovers, then turns away.',{sky:'#0E1428'}),
  enter(){ mood('drone','night'); },
  beats:[
    {text:"They skip it this year. The ten days pass. The house is dark, the table empty. The Farvardin Yasht says the fravashis go from house to house asking who will welcome them, and the tradition says that from a house where nobody does, they leave disappointed."},
    {text:"Remembering the dead is a duty, and a gift in both directions: the family remembers, and the fravashis bless the house. Rewind, and set out the flowers.", lock:true, afterType(){ rewindButton(); }} ]}
];

const CHAPTERS=[
  ['The choice',[['The choice','gathas'],['The cord','kusti']]],
  ['Volume 1 · The Last Hours',[['The bedside','bedside']]],
  ['Volume 2 · Three Nights',[['The dog’s gaze','sagdid'],['Three nights','nights']]],
  ['Volume 3 · The Bridge',[['The fourth dawn','wind'],['Your own self','daena'],['The scales','judges'],['The bridge','bridge'],['The three houses','houses']]],
  ['Volume 4 · What the Living Do',[['The towers','towers'],['The fravashis','muktad'],['Making wonderful','frasho']]] ];
const LESSONS=[
  ['choice','The choice','Choose truth over the lie, and choose it again every day.','The choice'],
  ['three','Three things','Good thoughts, good words, good deeds.','The cord'],
  ['purity','Keeping death apart','Death is the enemy’s work. Keep it from the living, and never leave anyone alone with it.','The dog’s gaze'],
  ['tears','Grief with a limit','Mourn, then pray. Endless tears become a river the dead must cross.','Three nights'],
  ['self','Your own self','What meets you at the end is your own self, made by your own choices.','Your own self'],
  ['just','Scales that can’t be bribed','Only your thoughts, words and deeds are weighed.','The scales'],
  ['bridge','The width of the bridge','The bridge is as wide as the life you lived.','The bridge'],
  ['fravashi','The fravashis','Welcome the dead home each year, and they bless the house.','The fravashis'],
  ['renewal','Making wonderful','No soul is lost for ever. In the end, evil itself is destroyed.','Making wonderful'] ];
const IC=(d)=>`<path d="${d}" fill="none" stroke="#FBF4E6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
const DETOURS=[
  ['x_lie','Choosing the lie',IC('M14 30 H26 M20 30 V18 M14 18 H26')],
  ['x_touch','Holding the body',IC('M8 24 H32 M12 24 Q12 14 20 14 Q28 14 28 24')],
  ['x_tears','Tears without end',IC('M20 8 Q12 20 20 24 Q28 20 20 8 M8 32 Q14 28 20 32 Q26 36 32 32')],
  ['x_excuse','Making excuses',IC('M8 12 H32 V24 H18 L12 30 V24 H8Z')],
  ['x_bribe','Offering a bribe',IC('M20 8 a12 12 0 1 0 .1 0 M20 14 V26')],
  ['x_forget','Skipping the ten days',IC('M14 30 Q12 20 20 18 Q28 20 26 30Z M20 18 V10')] ];
updatePathBadge();
go(0);
