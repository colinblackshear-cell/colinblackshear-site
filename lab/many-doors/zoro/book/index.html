<style>
/* Shared chrome for the Many Doors books. Each book overrides the tokens in its own :root block. Single deliberate light look, like the Bardo series. */
:root{

html,body{min-height:100%}

button{font:inherit;color:inherit}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:2px solid var(--ink);background:var(--paper)}

.bar .sp{flex:1}
.pill,.tog{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;text-decoration:none;min-height:36px;display:inline-flex;align-items:center}

@keyframes toastin{from{opacity:0;transform:translate(-50%,-8px)}}
.menu{position:absolute;top:46px;right:0;z-index:60;width:min(340px,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:12px;box-shadow:0 12px 30px rgba(0,0,0,.35)}

.menu button{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;background:transparent;border:0;border-radius:8px;padding:9px 8px;font-size:.98rem;cursor:pointer;min-height:44px}

/* svg motion helpers */

:root{
  --bg:#EFE6D2; --paper:#FAF4E4; --ink:#141C2E; --ink-soft:#4A5268; --accent:#1E5E78; --accent2:#B04A1E; --gold:#E8A93A; --night:#0B1020; --nightink:#FAF4E4;

<script>
/* Shared engine for the Many Doors books: sound, narration, the full-screen player and its interactions. */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------------- sound ---------------- */
const SND={ctx:null,m:null,nb:null,bb:null,on:store.get('md-sound')!=='0',loops:{},drone:null};
/* the drone: a quiet, slowly breathing tone on A under everything, so silence only happens on purpose. level(v,secs) fades it (0 = silent, 1 = normal). */
function makeDrone(c,dest,vol=.05){ const t=c.currentTime,g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+6); g.connect(dest);
  const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=650; lp.Q.value=.6; lp.connect(g);
  const sw=c.createOscillator(), sg=c.createGain(); sw.frequency.value=.045; sg.gain.value=260; sw.connect(sg).connect(lp.frequency); sw.start(t);
  const nodes=[sw]; [[55,'sine',.55,0],[110,'sawtooth',.16,-4],[110.3,'sawtooth',.12,3],[164.8,'sine',.12,0],[220,'sine',.1,2],[329.6,'sine',.035,-3]].forEach(([f,type,v,dt],i)=>{ const o=c.createOscillator(),og=c.createGain(); o.type=type; o.frequency.value=f; o.detune.value=dt; og.gain.value=v;
    const l=c.createOscillator(),lg=c.createGain(); l.frequency.value=.03+i*.017; lg.gain.value=v*.45; l.connect(lg).connect(og.gain); o.connect(og).connect(lp); o.start(t); l.start(t); nodes.push(o,l); });
  return {level(v,secs=2){ const n=c.currentTime; g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(Math.max(g.gain.value,.0001),n); g.gain.exponentialRampToValueAtTime(Math.max(vol*v,.0001),n+secs); },
    stop(){ this.level(0,1.5); setTimeout(()=>nodes.forEach(o=>{try{o.stop()}catch(e){}}),1700); }}; }

function aInit(){ if(SND.ctx){ if(SND.ctx.state!=='running') try{SND.ctx.resume()}catch(e){} return; }
  try{ SND.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  const c=SND.ctx; SND.m=c.createGain(); SND.m.gain.value=SND.on?.9:0; SND.m.connect(c.destination);
  const n=c.sampleRate*2; SND.nb=c.createBuffer(1,n,c.sampleRate); SND.bb=c.createBuffer(1,n,c.sampleRate);
  const w=SND.nb.getChannelData(0), b=SND.bb.getChannelData(0); let l=0;
  for(let i=0;i<n;i++){ const r=Math.random()*2-1; w[i]=r; l=(l+.02*r)/1.02; b[i]=l*3.5; }
  SND.drone=makeDrone(c,SND.m); }
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{ if(SND.ctx&&SND.ctx.state!=='running') try{SND.ctx.resume()}catch(e){} },{capture:true,passive:true}));
const T=()=>SND.ctx.currentTime;
function aEnv(g,t,p,a,d){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(p,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d); }
function tone(fr,{type='sine',peak=.12,a=.01,d=2,at=0}={}){ if(!SND.ctx) return; const c=SND.ctx,t=T()+at,o=c.createOscillator(); o.type=type; o.frequency.value=fr; const g=c.createGain(); aEnv(g,t,peak,a,d); o.connect(g).connect(SND.m); o.start(t); o.stop(t+a+d+.1); }
function nz({freq=1000,type='highpass',peak=.08,a=.003,d=.03,q=.7,brown=false}={}){ if(!SND.ctx) return; const c=SND.ctx,t=T(),s=c.createBufferSource(); s.buffer=brown?SND.bb:SND.nb; const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q; const g=c.createGain(); aEnv(g,t,peak,a,d); s.connect(f).connect(g).connect(SND.m); s.start(t,Math.random()); s.stop(t+a+d+.1); }
function loopOn(name,build,vol,fade=2){ if(!SND.ctx||SND.loops[name]) return; const g=SND.ctx.createGain(); g.gain.value=.0001; g.connect(SND.m); const nodes=build(g); g.gain.exponentialRampToValueAtTime(vol,T()+fade); SND.loops[name]={g,nodes}; }

function vScore(v){ let n=0; const nm=v.name.toLowerCase(); if(/natural|neural|premium|enhanced|siri/.test(nm)) n+=50; if(/online/.test(nm)) n+=20; if(/en-gb/i.test(v.lang)) n+=15; else if(/^en/i.test(v.lang)) n+=8; else n-=100;
  if(/daniel|arthur|george|ryan|thomas|oliver|guy|libby|sonia|serena|kate|martha|google uk english male/.test(nm)) n+=10;
  if(/compact|espeak|zarvox|trinoids|albert|bad news|bells|boing|bubbles|cellos|whisper|jester|organ|superstar|wobble|fred|junior|ralph/.test(nm)) n-=60; return n; }
function loadVoices(){ if(!('speechSynthesis' in window)) return; const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>vScore(b)-vScore(a)); if(!vs.length) return; VO.list=vs; const saved=store.get('md-voice'); const k=saved?vs.findIndex(v=>v.name===saved):0; VO.voice=vs[Math.max(k,0)]; }

}
function closePlayer(silent){ const s=PS; PS=null; hush(); if(SND.ctx) allOff(.8); cvStop(); if(s){ s.el.remove(); document.body.classList.remove('insession'); if(!silent&&s.onclose) s.onclose(); } }

/* press and hold the stage */
function hold(s,{label,ms=3000,ask:q,early,onP}){ alive(s); if(q) ask(q); return new Promise(res=>{ const l=layer(); l.innerHTML=`<button type="button" class="holdzone" aria-label="${esc(label)}"><span class="holdpill"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="rgba(30,42,43,.2)" stroke-width="4"/><circle id="hr" cx="20" cy="20" r="16" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="100.5" stroke-dashoffset="100.5" transform="rotate(-90 20 20)" stroke-linecap="round"/></svg>${esc(label)}</span></button>`;

/* ---------------- sitting: a minute with a breathing ring ---------------- */

    iv=setInterval(()=>{ if(PS!==s){ clearInterval(iv); return res(); } const left=Math.max(0,secs-Math.floor((performance.now()-t0)/1000)); tEl.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`; if(left<=0){ if(SND.ctx) bowl(196,.12); end(); } },250); });

function stars(n,seed=3,h=400,col='#FFF6DE'){ let s=seed,o=''; const r=()=>{ s=(s*9301+49297)%233280; return s/233280; }; for(let i=0;i<n;i++) o+=`<circle cx="${(r()*600).toFixed(1)}" cy="${(r()*h).toFixed(1)}" r="${(r()*1.6+.3).toFixed(2)}" fill="${col}" opacity="${(r()*.7+.2).toFixed(2)}"/>`; return o; }

/* The manual: a narrated, illustrated story in chapters. Each chapter is an async function that draws, speaks and asks. */
function manualLanding(B){
  const seen=JSON.parse(store.get(B.key+'-seen')||'[]'); const next=Math.min(+store.get(B.key+'-next')||0,B.chapters.length-1);
  $('#wrap').innerHTML=`<section class="hero"><div><span class="eyebrow">${esc(B.eyebrow)}</span><h1>${esc(B.title)}</h1><p class="lede">${esc(B.lede)}</p><p class="note">${esc(B.note)}</p>
    <div class="cta"><button type="button" class="btn gold" id="begin">${next?`Continue: ${esc(B.chapters[next].name)}`:'Begin'}</button>${next?`<button type="button" class="btn alt" id="restart">Start over</button>`:''}${B.walkUrl?`<a class="pill" href="${B.walkUrl}" target="_blank" rel="noopener">${esc(B.walkName)}</a>`:''}</div></div>
    <div class="cover"><svg viewBox="0 0 600 400" role="img" aria-label="${esc(B.title)}">${B.cover()}</svg></div></section>
    <section class="sec"><h2>Chapters</h2><div class="cgrid">${B.chapters.map((c,i)=>`<button type="button" class="ck${seen.includes(i)?' seen':''}" data-i="${i}" style="--c:${c.col||'var(--accent)'}"><i></i><b>${i+1}. ${esc(c.name)}</b><span>${esc(c.sub)}</span></button>`).join('')}</div></section>
    <section class="sec how"><h2>How it works</h2>${B.how.map(([a,b])=>`<div><b>${esc(a)}</b><p>${esc(b)}</p></div>`).join('')}</section>
    ${B.extra?B.extra():''}<section class="sec"><h2>Sources</h2><p class="sources">${B.sources}</p></section>`;
  $('#begin').onclick=()=>playManual(B,next);
  const r=$('#restart'); if(r) r.onclick=()=>{ store.set(B.key+'-next','0'); playManual(B,0); };
  document.querySelectorAll('.ck[data-i]').forEach(b=>b.onclick=()=>playManual(B,+b.dataset.i));
}
async function playManual(B,start){
  const menu={label:'Chapters',build:()=>`<h3>Chapters</h3><ol>${B.chapters.map((c,i)=>`<li><button type="button" data-go="${i}" aria-current="${i===s.ch}"><small>${i+1}</small>${esc(c.name)}</button></li>`).join('')}</ol>`,go:i=>playManual(B,+i)};
  const s=openPlayer({title:B.title,sub:'',steps:B.chapters.map(c=>c.short||c.name),menu,color:B.chapters[start].col});
  s.onclose=()=>manualLanding(B);
  s.el.classList.add('hasback'); s.back=()=>{ const i=s.ch||0; playManual(B,(s.n||0)>1?i:Math.max(0,i-1)); };
  try{
    for(let i=start;i<B.chapters.length;i++){ alive(s); s.ch=i; s.n=0; const c=B.chapters[i]; store.set(B.key+'-next',String(i)); stepTo(i); s.el.style.setProperty('--c',c.col||'#1F5E63');
      s.el.querySelector('.ptitle').innerHTML=`<b>${i+1} · ${esc(c.name)}</b>`; clearLayer(); cvStop();
      await c.run(s);
      const seen=new Set(JSON.parse(store.get(B.key+'-seen')||'[]')); seen.add(i); store.set(B.key+'-seen',JSON.stringify([...seen]));
      if(SND.ctx) allOff(1.2); }
    store.set(B.key+'-next','0'); alive(s);
    await B.finale(s); closePlayer();
  }catch(e){ if(!(e instanceof Abort)) console.error(e); }
}

 sources:'The Gathas of Zarathustra (Yasna 28–53), especially Yasna 30; Hadokht Nask (Yasht 22); Videvdad 7, 8 and 19; the Book of Arda Viraf (Arda Wiraz Namag, 9th–10th c. CE); Dadestan i Denig; Bundahishn 34. Translations after James Darmesteter (1880s), Fereydun Vahman (1986), and Mary Boyce, Textual Sources for the Study of Zoroastrianism (1984).',

 {name:'The Choice',short:'Choice',sub:'Two spirits, and you between them',col:'#E8A93A',run:async s=>{

   await say(s,'His great idea was choice. There are two spirits at the beginning of things, he sang: one chose truth and goodness, the other chose the lie. Every person stands between them, and must choose too. Hear the best things with your ears, he says. Look at them with a clear mind, and decide, each person for themselves.');

 }},
 {name:'The Body',short:'The body',sub:'The corpse demon and the dog',col:'#8C8577',run:async s=>{

 {name:'Three Nights',short:'Three nights',sub:'The soul beside the head',col:'#2E8B8B',run:async s=>{

 {name:'The Prayer',short:'Prayer',sub:'Ashem Vohu',col:'#1E5E78',run:async s=>{

 {name:'The Dawn Wind',short:'The wind',sub:'The fourth morning',col:'#C46A6A',run:async s=>{

   await say(s,'At the end of the third night, as dawn breaks, a wind comes from the south. The Hadokht Nask says that to a righteous soul it is sweet-smelling, more fragrant than any wind it has ever known. To the wicked it comes from the north, and stinks.',{eye:'The fourth dawn'});
   await still(s,{ask:'Be still, and feel the wind arrive.',ms:8000});
   await say(s,'The soul breathes it in and turns to see who is coming toward it on the wind.');
 }},
 {name:'Your Own Conscience',short:'Conscience',sub:'Who comes to meet you',col:'#E8A93A',run:async s=>{
   art(zo(`${peaks()}${urvan(180,270,1.2)}<g class="fadein">${maiden(400,340,1.1)}</g>${dog(500,340,.6,{flip:true})}${dog(300,340,.6)}`,{sky:'dawn'}));
   if(SND.ctx){ loopOff('wind'); pad('pad',[130.8,196,261.6],.035); chime(); }
   await say(s,'On the wind comes a young woman, the most beautiful the soul has ever seen: radiant, tall, strong, like a girl of fifteen. The Videvdad says dogs walk beside her.',{eye:'Hadokht Nask'});
   await say(s,'The soul asks: who are you? And she answers: I am your own daēnā, your own self. I was lovely, and you made me lovelier by your good thoughts, your good words and your good deeds.');
   await say(s,'For a wicked soul, later texts say, she appears as an old, foul hag, and gives the same answer. You meet yourself.');
   const k=await choose(s,'She asks you to remember. Which made her loveliest?',['My good thoughts','My good words','My good deeds'],{});
   await say(s,['Humata, good thoughts. Zarathustra put thought first, because every word and deed begins there.','Hukhta, good words. Truthful speech was the first thing Persian children were taught, according to Herodotus, after riding and archery.','Hvarshta, good deeds. In the end the daēnā is made of what you did.'][k]);
 }},
 {name:'The Scales',short:'The judges',sub:'Mithra, Sraosha and Rashnu',col:'#3E5C8A',run:async s=>{
   art(zo(`${judge(140,340,1,{robe:'#6A3E8A'})}${judge(460,340,1,{robe:'#3E5C8A',arms:'pray'})}${scalesZ(300,340,1.2)}${judge(300,220,.6,{robe:'#B04A1E'})}`));
   if(SND.ctx) pad('pad',[98,147,196],.03);
   await say(s,'At the head of the bridge, three judges wait. Mithra, guardian of covenants. Sraosha, whose name means listening, who has guarded the soul for three nights. And Rashnu, the just, holding golden scales.',{eye:'The judges'});
   await say(s,'The Book of Arda Viraf says Rashnu\'s scales favour no one, not the righteous, not the wicked, not lords nor rulers. They do not bend by a hair\'s breadth.');
   const B=$('#pArt');
   await hold(s,{label:'Keep the scales still',ms:6000,ask:'Your thoughts, words and deeds are weighed. Press and hold.',onP:p=>{ const b=B.querySelector('.beam'); if(b) b.style.transform=`rotate(${(1-p)*Math.sin(performance.now()/280)*9}deg)`; }});
   await say(s,'Good outweighs bad. If they had balanced exactly, there is a place for that too, which we\'ll come to.');
 }},
 {name:'The Bridge',short:'The bridge',sub:'Chinvat, the bridge of the separator',col:'#C9A15A',run:async s=>{
   art(zo(`${bridge(10)}${urvan(160,176,.7)}`));
   if(SND.ctx){ allOff(1); windLoop(); }
   await say(s,'Then the Chinvat Bridge, the bridge of the separator. It runs from the peak of the world mountain across a chasm, and below it is hell. Every soul must cross.',{eye:'The Chinvat Bridge'});
   await say(s,'Later texts say it is like a beam with many sides. For the wicked it turns its razor edge upward, and they fall. For the righteous it turns its broad side, nine spears wide, and they walk across with ease.');
   const W=[6,14,26,40];
   await count(s,{ask:'Your daēnā leads you. Take the four steps across: good thoughts, good words, good deeds, and the last step into endless light.',n:4,label:'Take a step',onTap:k=>{ art(zo(`${bridge(W[k-1]+10)}<g transform="translate(${160+k*60} ${176-k*2})">${urvan(0,0,.7)}</g>${maiden(Math.min(430,200+k*60),176,.45)}`)); if(SND.ctx) bell(330+k*60,.08); }});
   loopOff('wind'); if(SND.ctx) chime();
   await say(s,'The Hadokht Nask names the steps: the first into the heaven of good thought, the second into good word, the third into good deed, and the fourth into the Endless Lights. You are across.');
 }},
 {name:'Three Houses',short:'Three houses',sub:'Song, the in-between, and the lie',col:'#1E5E78',run:async s=>{
   art(zo(`${sunMoonStar()}${[0,1,2,3].map(i=>`<ellipse cx="${80+i*35}" cy="${330-(i%2)*14}" rx="46" ry="22" fill="#8A8A96" opacity=".75"/>`).join('')}<path d="M420 372 Q430 320 495 316 Q560 320 570 372Z" fill="#1A0A0A" stroke="${K}" stroke-width="2"/>${[450,480,510,540].map((x,i)=>`<circle cx="${x}" cy="${352-i%2*8}" r="3" fill="#E0501E"/>`).join('')}`));
   if(SND.ctx) pad('pad',[146.8,220,293.7],.03);
   await say(s,'In the Book of Arda Viraf, a righteous priest is chosen to drink a potion and visit the afterlife for seven days, so he can report back. He describes three destinations.',{eye:'The Book of Arda Viraf'});
   await spots(s,{ask:'Tap each one.',items:[
     {x:77,y:25,label:'House of Song',say:'Garōdmān, the House of Song, reached through the stations of the stars, the moon and the sun. It is all light and music, in the presence of Ahura Mazda.'},
     {x:19,y:86,label:'Hamistagān',say:'Hamistagān, the place of the mixed, for those whose good and bad were exactly equal. It is grey, neither punishment nor reward, with only the changes of heat and cold.'},
     {x:82,y:86,label:'House of Lies',say:'The House of Lies, dark and cramped, so crowded that each soul feels alone. Arda Viraf describes its punishments at great length.'}]});
   await say(s,'But none of these is forever. This is one of the most hopeful ideas in any religion.');
 }},
 {name:'The Towers',short:'The towers',sub:'What the living do',col:'#8C8577',run:async s=>{
   art(zo(`<rect x="0" y="300" width="600" height="100" fill="#8C7A5A"/>${dakhma(300,300,1.2)}`,{sky:'#E8D8B0'}));
   if(SND.ctx){ allOff(1); windLoop(); }
   await say(s,'Because a corpse would pollute earth, fire and water, all of which are sacred, Zoroastrians traditionally neither buried nor burned their dead. Bodies were laid on the top of a dakhma, a tower of silence, open to the sun and to vultures.',{eye:'The dakhma'});
   await say(s,'The towers are still used in Mumbai, though vultures have almost vanished from India, and solar reflectors now help. Many Zoroastrians in Iran and abroad now use cement-lined graves or cremation. Communities still debate it.');
   await say(s,'What hasn\'t changed is the prayers. They continue on the fourth day, the tenth, the thirtieth and every year after. And during the last ten days of the Zoroastrian year, the fravashis, the guardian spirits of the dead, are believed to come home, and families welcome them with fire, flowers and food.');
   loopOff('wind');
 }},
 {name:'Making Wonderful',short:'Renewal',sub:'The end of evil',col:'#E07A1E',run:async s=>{
   art(zo(`${metalRiver(260)}${[110,220,330,440].map((x,i)=>`<g class="rise" style="animation-delay:${i*.3}s">${zfig(x,300,.6,{robe:WHITE})}</g>`).join('')}`,{sky:'dawn'}));
   if(SND.ctx){ pad('pad',[130.8,196,261.6,329.6],.035); }
   await say(s,'At the end of time comes Frashōkereti, the making wonderful. A saviour, the Saoshyant, will be born, the dead will rise in their bodies, and the whole world will be made new.',{eye:'The making wonderful'});
   await say(s,'Every person, living and risen, will pass through a river of molten metal. To the wicked it will burn. To the righteous, the Bundahishn says, it will feel like walking through warm milk. And everyone comes out purified.');
   await hold(s,{label:'Walk through the river',ms:5000,ask:'Press and hold to walk through the molten river.',early:'Keep walking. Hold again.'});
   art(zo(`${faravahar(300,190,1.4)}<circle cx="300" cy="200" r="190" fill="url(#fire)" opacity=".5"/>`,{sky:'dawn'}));
   if(SND.ctx) chime();
   await say(s,'Even hell is emptied and cleansed, and the evil spirit is defeated for good. In the end, every soul reaches the House of Song. Zoroastrianism is the only religion in this series where everyone is saved and evil itself is destroyed.');
 }}],
 finale:async s=>{ art(zoCover()); if(SND.ctx) chime();
   await say(s,'That is the passage: three nights of remembering, a fragrant wind, your own self coming to meet you, judges who cannot be bribed, and a bridge whose width you built yourself.',{eye:'The end of the book'});
   await say(s,'Zarathustra\'s teaching fits on a single line, and Zoroastrians still tie it into the sacred cord around their waists every day: good thoughts, good words, good deeds.'); }};
header({brand:BOOK.brand,brandSub:BOOK.brandSub,links:[['Many Doors','../../../many-doors/'],[BOOK.walkName,BOOK.walkUrl]]});
manualLanding(BOOK);
